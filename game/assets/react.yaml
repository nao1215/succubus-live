    remember: [{key: mac_name, set: macd}]
  - id: macd
    when: tag.macd > 0
    say:
    - マクド、でございますか。当方は略さずにマクドナルドでございます。
    - マクドでございますね。
    remember: [{key: mac_name, set: macd}]
  - id: nicevoice
    when: tag.nicevoice > 0
    say:
    - 声をお褒めいただき、恐縮でございます。歌うと少々低うございますので、喋っているうちが花でございます。
    - '{from}様、ありがたく頂戴いたします。声を褒めていただくと、少々照れますね。'
  - id: love
    when: tag.love > 0
    say:
    - '{from}様、好きと言っていただけると、うれしゅうございます。'
    - '{from}様、ファン、でございますか。尾が動いております。ありがたく頂戴いたします。'
  - id: cute
    when: tag.cute > 0
    say:
    - ありがたく頂戴いたします、{from}様。少々、照れます。
    - かわいい、と。お褒めいただき、ありがとうございます。
  - id: fired_2
    when: tag.fired_2 > 0
    say:
    - 昔のバンドのお話でございますか。ソロの長さのことは、もうよろしいでしょう。
    - ギル様の三弦は、今もずれております、{from}様。当方、カセットで確かめました。
    - '{from}様、クビの朝は馬車の切符一枚でございました。片道でございます。ムステイン様のお気持ち、少し分かります。'
  - id: ella_word
    when: tag.ella_word > 0
    say:
    - '{from}様、お待ちしておりました！ 『マスター・オブ・パペッツ』、「操り人形の旦那様」。'
    - 『キル・エム・オール』、「皆様、残らずお召し上がりくださいませ」。{from}様、笑っていただいてよろしいのですよ。
    - '{from}様、今日のは自信作でございます。『ライド・ザ・ライトニング』、「稲妻に、お乗りあそばせ」。'
  - id: earplug
    when: tag.earplug > 0
    say:
    - '{from}様、耳栓はお持ちくださいまし。当方は二〇二四年に忘れて、右耳が三日鳴りました。少し高いラの音で。'
    - '{from}様、人には勧めるのでございます、耳栓。人には。'
  - id: cassette
    when: tag.cassette > 0
    say:
    - '{from}様、カセットの巻き戻しは鉛筆でございます。新譜しか聴かない様は、動画で覚えたそうでございます。'
    - あのカセット、まだ持っておりますよ。
  - id: ella_word_2
    when: tag.ella_word_2 > 0
    say:
    - '{from}様、好きな所は秒数で申し上げるのが当方の癖でございます。言葉で「好き」と申し上げるのは、少々苦手で。'
    - '{from}様の好きな曲の、何分何秒でございますか。当方、それで覚えますので。'
  - id: sabbath
    when: tag.sabbath > 0
    say:
    - '{from}様、サバスでございますか。当方、最後のライブを酒蔵の配信で観て、ハンカチを三枚使いました。'
    - '{from}様、アイオミ様は、事故で指先をなくされて、押さえやすい細い弦を探された。三枚目では弦をゆるめて低く合わせておられます。当方、その話が大好きでございます。'
    - ウォード様の、ほんの少し遅れて重く聞こえるドラム。{from}様、あれがサバスの拍でございます。
  - id: metal
    when: tag.metal > 0
    say:
    - '{from}様、メタルのお話でございますか！ どの辺りでございます？ 八〇年代？ それとも新譜しか聴かない様の方面？'
    - '{from}様、メタルを聴く日は、当方、紅茶を濃いめにいたします。'
  - id: megadeth
    when: tag.megadeth > 0
    say:
    - '{from}様、メガデス様！ 当方、『Rust in Peace』の日は、尾が止まりません。'
    - '{from}様、二〇二三年の武道館で、マーティ様が二十三年ぶりにメガデス様と同じ舞台に。当方は配信で、主様の上着を膝に掛けて観ておりました。'
    - '{from}様、今年の最後のアルバムで、メガデス様は初めての全米一位でございます。四十年近くかかりました。'
  - id: thrash
    when: tag.thrash > 0
    say:
    - '{from}様、メタリカ様の曲は好きでございます。『デス・マグネティック』の、音を詰め込みすぎた音だけは苦手でございますが。'
    - ビッグ・フォーのお話でございますか、{from}様。当方の推しを申し上げると戦争になりますので……メガデス様でございます。言ってしまいました。
  - id: blackmore
    when: tag.blackmore > 0
    say:
    - '{from}様、レインボー様の『On Stage』は、日本の公演とドイツの公演の継ぎ合わせでございます。リッチー様が日本の分だけでは納得なさらなかったとか。'
    - '{from}様、『Catch the Rainbow』は、当方、聴く専門でございます。歌うと四分の一音低くなりますので。'
    - '{from}様、『Made in Japan』は、もともと日本だけで出すはずの盤でございました。それが世界中で。'
  - id: yngwie
    when: tag.yngwie > 0
    say:
    - '{from}様、速弾きを「速いだけ」とおっしゃる方には、当方、一晩お付き合いいただきとうございます。'
    - '{from}様、イングヴェイ様の、最後に一段ぐっと上がる音階。和声的短音階と申しまして、当方、耳が勝手に探してしまいます。'
    - シェンカー様は、日本では「神」でございます、{from}様。理由は、武道館二階東様に聞くと「神だから」とだけ。
  - id: nwobhm
    when: tag.nwobhm > 0
    say:
    - '{from}様、NWOBHM、ざっくり申しますと七九年ごろのイギリスの新しいメタルの波でございます。名前は、雑誌の見出しから生まれました。'
    - '{from}様、メイデン様の、馬が駆けるような刻み。当方の尾が勝手に拍を取ります。'
  - id: death_metal
    when: tag.death_metal > 0
    say:
    - '{from}様、ローナ・ショア様の『To the Hellfire』で、当方、正座いたしました。人の声ではない所まで行きますよね。'
    - デスメタルやブラックメタルの、あの荒い録り方。わざとでございます。そこが好きですね。
  - id: doom
    when: tag.doom > 0
    say:
    - '{from}様、ドゥームの日は、ほうじ茶でございます。遅い音楽には、ぬるいお茶が合います。'
    - ドゥームの、あの遅さが、落ち着くのでございます。
  - id: djent
    when: tag.djent > 0
    say:
    - '{from}様、ジェントは、ギターの音をそのまま口で言った言葉でございます。ジェン、と。'
    - '{from}様、八弦の低い音で、城の窓が鳴ったことがございます。'
  - id: metal_2
    when: tag.metal_2 > 0
    say:
    - '{from}様、コーンの七弦の低い音は、当方、好きでございます。歌詞の話は、また別の日に。'
    - '{from}様、リンキン・パーク様は、新しい歌い手の方を迎えて続いておられます。続いているだけで、ありがたいことでございます。'
  - id: sleep_token
    when: tag.sleep_token > 0
    say:
    - '{from}様、スリープ・トークン様のお話は、新譜しか聴かない様の前ではいたしません。少し好きになったのが、悔しいので。'
    - 新譜でございますか、{from}様。当方、新譜しか聴かない様から送られてくる十枚で、なんとか追いついております。
  - id: loudness
    when: tag.loudness > 0
    say:
    - '{from}様、ラウドネス様の『Thunder in the East』は、一九八五年に全米のアルバムの順位で七十四位。四十年後、BABYMETAL様が九位でございます。'
    - ジャパメタ、という言い方。当方はまだ迷っておりまして、普段はバンド名で呼んでおります。
    - '{from}様、日本のメタルのお話は、当方、長くなります。紅茶をお持ちくださいまし。'
  - id: prog
    when: tag.prog > 0
    say:
    - '{from}様、プログレでございますか。長い曲は好きでございます。長いだけで中身の足りない組曲は、少々苦手でございますが。'
    - '{from}様、クリムゾンなら一九七三年から七四年の頃が、当方の推しでございます。'
  - id: symphony
    when: tag.symphony > 0
    say:
    - '{from}様、当方、パガニーニ様にはイングヴェイ様の経由で入りました。ピアノ教室の先生には内緒でございます。'
    - '{from}様、グールド様の『ゴルトベルク』は、当方、八一年の遅い方が好きでございます。うなり声も込みで。'
    - 交響曲のお話でございますか、{from}様。何楽章がお好きでございますか。
  - id: jazz
    when: tag.jazz > 0
    say:
    - '{from}様、ジャズの日はダージリンでございます。'
    - '{from}様、『カインド・オブ・ブルー』には、録音機の回る速さのせいで、少し音が高くなったまま何十年も売られていた曲がございます。合わせて練習した方は大変でございましたね。'
    - '{from}様、一九六一年のヴィレッジ・ヴァンガードのビル・エヴァンス様。お客様のグラスの音まで、当方は好きでございます。'
  - id: kenny_g
    when: tag.kenny_g > 0
    say:
    - '{from}様。一九九九年に、亡くなったルイ・アームストロング様の録音に自分の演奏を重ねた件は、当方、メセニー様と同じ意見でございます。'
    - '{from}様、ケニー・G様の息の長さは、見事でございます。そこは、本当に。'
  - id: rock
    when: tag.rock > 0
    say:
    - '{from}様、ギターのお話でございますか。チューニングは合っておりますか。すみません、癖でございます。'
    - '{from}様、ボーナム様のドラムの、あの広い響き。録った階段の話だけでは足りないのでございます。'
  - id: grunge
    when: tag.grunge > 0
    say:
    - '{from}様、一九九二年の一月、ニルヴァーナ様の『ネヴァーマインド』が、マイケル・ジャクソン様を全米一位から降ろしました。'
    - '{from}様、オアシス様の再結成は、続いているだけでありがたいの一例でございます。券の値段は、別の話でございますが。'
  - id: punk
    when: tag.punk > 0
    say:
    - パンクもディスコも、騒がれたあとで、ちゃんと残っておりますね。
    - パンクのお話でございますか、{from}様。テレビの生放送で悪態をつくのにも、間合いがございます。
  - id: mtv
    when: tag.mtv > 0
    say:
    - '{from}様、MTVが一九八一年に最初に流したのは『ラジオ・スターの悲劇』。自分たちの番組でラジオを殺してみせる、なかなかの度胸でございます。'
    - ラジオのお話でございますか、{from}様。主様は、ラジオを寝るための機械だと思っておられます。
  - id: intro
    when: tag.intro > 0
    say:
    - '{from}様、イントロは飛ばさずに。と申しながら、当方、移動中は飛ばします。'
    - '{from}様、短い動画で流行る曲は苦手、と言いつつ、当方、Bling-Bang-Bang-Born の踊りを鏡の前で覚えました。内緒でございます。'
  - id: spotify
    when: tag.spotify > 0
    say:
    - '{from}様、今の配信の音楽は、曲ごとに音の大きさをそろえて流してくれます。ですから、無理に大きく録っても得はないのでございます。'
    - サブスクの再生履歴、当方のは、目覚ましを直すために何度も再生して、そればかりになりました。
  - id: city_pop
    when: tag.city_pop > 0
    say:
    - '{from}様、『プラスティック・ラブ』は、ジャケットの写真が気になって聴き始めた方も多かった、と写真家の方がおっしゃっています。'
    - シティポップ、いいですね。昔の録音を今聴いていただけるの、うれしいです。
  - id: hip
    when: tag.hip > 0
    say:
    - '{from}様、ディラ様の『Donuts』は、誕生日に出て、その三日後にご本人が亡くなった盤でございます。当方、一曲目から聴くと泣きます。'
    - '{from}様、元のドラムを叩いた方のお名前を、説明欄に一行書いてくださいまし。それだけで当方は嬉しゅうございます。'
  - id: techno
    when: tag.techno > 0
    say:
    - '{from}様、909のハイハットのちりちりは、粗い作りのおかげでございます。'
    - '{from}様、Creepy Nuts様の、あの言葉の詰め方。当方、早口言葉で三回噛みました。'
  - id: vocaloid
    when: tag.vocaloid > 0
    say:
    - ボカロのお話でございますか。自分の曲を誰かが歌ってくれるの、少し羨ましゅうございます。
    - '{from}様、オートチューンを作った方は、もとは石油を探す技術者でございました。'
  - id: zelda_2
    when: tag.zelda_2 > 0
    say:
    - '{from}様、敵に見つかった瞬間のピアノで、当方、主様の茶碗を落としました。今は金継ぎでございます。'
    - '{from}様、『時のオカリナ』の野原の曲は、短い節をその場でつないで鳴らしているそうで。だから何百時間聴いても飽きないのでございます。'
  - id: soundtrack
    when: tag.soundtrack > 0
    say:
    - ゲームの曲は、どの場面で鳴るかが、気になるのでございます。
    - '{from}様、『悪魔城伝説』は日本版でお聴きくださいまし。日本版は、カートリッジに音を足す部品が入っていて、音が多うございます。'
  - id: reverb
    when: tag.reverb > 0
    say:
    - '{from}様、当方、以前、配信の声に響きを足しすぎて、主様に「お風呂から配信してるの？」と言われました。'
    - '{from}様、録音のときは、前のテイクの上に重ねて録らないよう、お気を付けくださいまし。当方、それで良いテイクを一つなくしております。'
  - id: concert
    when: tag.concert > 0
    say:
    - お出かけでございますか、{from}様。耳栓はお持ちでございますか。当方は忘れる方でございます。
    - '{from}様、最前列でございますか。うらやましゅうございます。当方はいつも、後ろで主様の上着を持っております。'
    - ライブ、楽しんでいらしてくださいませ、{from}様。
  - id: listening_to
    when: tag.listening_to > 0
    say:
    - お聴きの曲、ありがたく伺います、{from}様。その曲の何分何秒がお好きでございますか。
    - '{from}様、その曲、今日の紅茶は何が合いますでしょうね。当方、真剣に考えます。'
  - id: band
    when: tag.band > 0
