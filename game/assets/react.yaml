  - id: butaman__1
    when: tag.butaman > 0 && (mem.nikuman == "nikuman" || mem.nikuman == "肉まん")
    say:
    - 前は肉まん派じゃなかった！？ ようこそ！
    remember: [{key: nikuman, set: butaman}]
  - id: butaman
    when: tag.butaman > 0
    say:
    - 豚まん！ 同じ！ 大阪で食べてから戻れない！
    - 豚まんだよね！
    remember: [{key: nikuman, set: butaman}]
  - id: mac__1
    when: tag.mac > 0 && (mem.mac_name == "macd" || mem.mac_name == "マクド")
    say:
    - 前はマクドって言ってたよね！？
    remember: [{key: mac_name, set: mac}]
  - id: mac
    when: tag.mac > 0
    say:
    - マック派か！ 私はマクド！ 大阪で言い慣れて戻らないの！
    - マックね！
    remember: [{key: mac_name, set: mac}]
  - id: macd__1
    when: tag.macd > 0 && (mem.mac_name == "mac" || mem.mac_name == "マック")
    say:
    - 前はマックって言ってなかった！？
    remember: [{key: mac_name, set: macd}]
  - id: macd
    when: tag.macd > 0
    say:
    - マクド！ 同じ！ 大阪遠征の後遺症だぞ！
    - マクドだよね！
    remember: [{key: mac_name, set: macd}]
  - id: nicevoice
    when: tag.nicevoice > 0
    say:
    - 声！？ 本当！？ もっと言って！ 推しの前だとこの声、出ないんだけどね！
    - '{from}、ありがと！ この声、列整理のバイトで鍛えた声だぞ！'
  - id: love
    when: tag.love > 0
    say:
    - え、ありがと！ あ、そうだ、今度行きたい場所があって！ 待って、急に話変えたのばれた？
    - '{from}、ファン！？ うれしい！ 今日の日付、覚えとく！'
    - ガチ恋はね、される側に回ると照れるだけで何もできないって分かった！ ありがと！
  - id: cute
    when: tag.cute > 0
    say:
    - 褒めてくれた！？ 本当！？ ありがとう！
    - ありがとう、{from}！ 褒められたから、今日は寄り道を一個増やす！
  - id: galge
    when: tag.galge > 0
    say:
    - ギャルゲー！ かわいい子と仲良くなるゲームね。{from}は誰が好きだった？
    - 恋愛のゲームはね、アメリカだと dating sim って呼ぶこともあるんだって！ オハイオの字幕班に教わった！
    - 攻略の話はリゼの枠ね！ 私はグッズとファンの話担当！
    - わかる！
  - id: tokimeki
    when: tag.tokimeki > 0
    say:
    - 伝説の樹！ 卒業式に樹の下で告白されたら、ずっと幸せになれるやつ！ 私なら樹の下でも「おつかれさまです」って言っちゃう！
    - ときメモは1994年、PCエンジンから！ 私の推しは虹野沙希！ {from}は？
    - 1996年に藤崎詩織がキャラの名前でCD出したの、バーチャルアイドルの大先輩だぞ！
    - Switch のときメモ、名前を呼んでくれる機能あるのに、私まだ設定してない！
  - id: love_2
    when: tag.love_2 > 0
    say:
    - ラブプラス！ 2010年の熱海、町ぐるみで彼女ごと迎えてくれたの！ 布団二枚！
    - 熱海のスタンプラリー、六個中五個で終わった！ 石段を測ってたせいで！
    - ラブプラス、私の DS の中に彼女がいるの。十六年会いに行ってない。
    - 毎日会いに行くゲームでしょ。ログボ四日の私には、一番むずかしいやつ！
  - id: nakige
    when: tag.nakige > 0
    say:
    - 泣きゲー！ AIR の最終回、正座して観て、足しびれて立てなかった！
    - 鳥の詩！ 私の友達、カラオケでこれ入れると立つの！ 私も一緒に立つ！
    - Kanon はね、ドリームキャストに移ったとき声が付いたの！ 主人公以外！
    - CLANNADは人生！ ……言いたかっただけ！
    - 泣けるよね。
  - id: visual_novels
    when: tag.visual_novels > 0
    say:
    - 月姫は2000年の冬コミ、C59！ 同人ゲームから会社になって、Fate につながったの！ コミケの人として一番誇らしい話！
    - ひぐらしもコミケで一話ずつ出たんだよ！ 次のコミケまで続きを待つの！
    - ビジュアルノベルは、英語でも visual novel で通じるよ！ 略して VN！
    - Fate！ {from}は FGO から？ コミケで同人ゲーム出してた人たちが、あそこまで行ったんだぞ！
    - 月姫のリメイク、十三年待った！ 待つのは得意なの、続けるのは苦手だけど！
  - id: meet
    when: tag.meet > 0
    say:
    - その話！？ 私ね、推しに「おつかれさまの人」って呼ばれてるの！
    - チェキ会はね、一緒に一枚撮って、少しだけ話せる会！ 三十秒くらい！ {from}は何話す派？
    - 握手会の最初は、会議用の長机を並べた急ごしらえだったんだって！ 2005年の話！ 私この話大好き！
    - '{from}、画面越しのお話し会でね、私が喋った瞬間にWi-Fiが止まったことあるの！ 顔が三十秒止まってた！'
  - id: vespa_word
    when: tag.vespa_word > 0
    say:
    - はがしはね、時間が来たらファンを優しく離す係！ 私、バイトでやってるの。遅いって注意される！
    - '{from}、はがしのコツは、肩をつかまないこと！ 背中の少し上に手を添えて「お時間です」！ その「お時間です」が言えないの！'
    - はがしの話！ 時間が来ると、まだ話せてないのにってなる！
  - id: vespa_word_2
    when: tag.vespa_word_2 > 0
    say:
    - 古参の話なら、私は最初に見た日のこと、ノートに残してる！
    - 古参も初見も関係ないよ！ 初めて来た人にも、優しくしようね。私も気を付ける！
    - 小さい対バンの頃から見てたんだ！
  - id: vespa_word_3
    when: tag.vespa_word_3 > 0
    say:
    - 坂！？ {from}、坂の話する！？ 私ね、聖地の坂をスマホで測るの！ アニメは坂を盛るんだぞ！
    - 坂の話！ 私が測ったら、アニメで見るほど急じゃなかった！
    - '{from}、坂の本、読んでくれる？ 二十二人読んだ本！ 知らない人にも読んでほしいの！'
  - id: vespa_word_4
    when: tag.vespa_word_4 > 0
    say:
    - 緑！ 私の推しの色！ 2018年に急に黄緑になったけど、私は今も緑を振ってる！ 黄緑は緑の仲間だから！
    - その話、緑の法被の私に振る！？ 80年代のファンも法被を着てたんだって！
    - ペンライトの色はね、推しのメンバーカラーに合わせるの！ バラードでみんなが揺らすと、きれいなんだぞ！
  - id: deadline
    when: tag.deadline > 0
    say:
    - 締切の話はやめて！ 私、当たったチケットの入金を寝過ごしたことがあるの！
    - '{from}、目覚まし、いくつかけてる？ 私は七つ！ 七つ目の名前は「最後の砦」！'
    - 同人誌の入稿の締切は、だいたい前の晩に気付く！ 早割は三回逃してる！
  - id: staff
    when: tag.staff > 0
    say:
    - 物販のバイト、五年やってるの！ 段ボール四箱いっぺんに運べるのが自慢！
    - バイトの話！？ 私ね、最後尾の札、逆に持ってたことあるんだよ！
    - 推しの現場には、バイトで入れない決まりなの！ 一回知らずに入って、推しのタオルが売れていくのを裏で見てた！
  - id: comiket
    when: tag.comiket > 0
    say:
    - コミケ！ 第一回は1975年、会議室でサークル32だったんだぞ、{from}！ 今は一日で十万人を超える！
    - '{from}、コミケには「お客様」がいないの！ 売る人も買う人もスタッフも、みんな「参加者」！ この言葉、大好き！'
    - 冬のC109は三日間！ 8年ぶり！ 私、ホテルは配信中に取ったぞ！ 本予約で！
    - コミケかあ。夏は雨で本が濡れたの、まだ悔しい！ 次は袋、ちゃんと用意する！
  - id: vespa_word_5
    when: tag.vespa_word_5 > 0
    say:
    - '{from}、そこ突く！？ 1991年に幕張メッセから会場を断られて、晴海に戻った話、する？'
    - 見本誌はね、第一回から全部取ってあるの！ 二百数十万冊！ 埼玉の倉庫に！ {from}、すごくない？
    - 壁サークルは、壁際に並ぶ大きいサークル。列を外に出せるから壁なの。島中は真ん中の机の列ね、{from}！
  - id: doujin
    when: tag.doujin > 0
    say:
    - 同人誌は、好きな人が自分で作って自分で配る本だよ、{from}！ 売る、じゃなくて「頒布」って言うの！
    - '{from}、同人誌って、何を描いてもいいんだぞ！ 私の本は坂の本！ 坂の！'
    - 同人の話！ 解釈が違うなら、自分でも本にしてみたくなるよね！
  - id: cosplay
    when: tag.cosplay > 0
    say:
    - 「コスプレ」って言葉、1983年ごろに日本で作られたんだって！ 今は英語でも通じるよ、{from}！
    - '{from}、コミケのコスプレは昔、30センチより長い物がだめだったの！ 2011年に「振り回さない」って扱い方の決まりに変わった！ 行く回の注意事項は毎回読んでね！'
    - 折りたたみの槍、作ったの！ 折り方まちがえて、電車の中でするする伸びた！
  - id: oshi
    when: tag.oshi > 0
    say:
    - 推しの話！ 応援したくなる人っているよね。{from}の推しは誰？
    - '{from}、推しは推せるときに推せ！ これ、本当に大事な言葉なんだぞ！'
    - 推し活の予算、ちゃんと決めてる？ 私は決めて、毎月はみ出してる！
  - id: pilgrimage
    when: tag.pilgrimage > 0
    say:
    - 遠征！ 私の一番好きな言葉！ {from}はどこまで行ったことある？
    - 現地はいいよ！ 行くと、画面で見たのと違うところがあるんだ！
    - '{from}、遠征のコツは一つ。ホテルを先に取る！ 他人の計画なら完璧に組めるのに、自分のは落とすの！'
  - id: vespa_word_6
    when: tag.vespa_word_6 > 0
    say:
    - '{from}、落ちちゃった？ 仲間だよ。次の抽選、一緒に祈ろう！ 転売では買わないでね！'
    - 全落ちは悲しいね。でも{from}、当たったのに入金忘れた私よりはましだぞ！ 慰めになってない？
  - id: vespa_word_7
    when: tag.vespa_word_7 > 0
    say:
    - '{from}、当たったの！？ おめでとう！ 入金の締切、今すぐ確かめて！ 私みたいにならないで！'
    - 当選おめでとう、{from}！ 当日は身分証も忘れずにね！ 顔写真付きの確認、多いから！
  - id: ticket
    when: tag.ticket > 0
    say:
    - 抽選、結果出た？ 当たった人はおめでとう！ 外れた人は、次一緒に祈ろう！
    - チケットの転売はだめだぞ、{from}！ 2019年から、転売禁止のチケットを主催者に無断で定価より高く売り続けるのは、法律で禁止されてるの！
    - '{from}、抽選の申込、締切までに出した？ 私はいつも締切の十分前！'
  - id: idol
    when: tag.idol > 0
    say:
    - '{from}、チェキ会行ったことある？ 一枚撮って、三十秒くらい話せるの！ 私は三十秒、「おつかれさまです」！'
    - 地下アイドルは、テレビより小さいライブを中心にやってるアイドルのこと！ 対バンの朝10時、客席七人の日もあるんだぞ！
    - アイドルの現場は、ファンの文化も見て！ コールもペンライトの色も、客席が作ってきたんだ、{from}！
  - id: akb
    when: tag.akb > 0
    say:
    - そのグループの話、長くなるぞ！ どの頃の話からする？
    - そのグループ、好きなんだね！ でも同じCDを何枚も買うのは、私はちょっとしんどいんだ！
    - 「かわいいだけじゃだめですか？」、流行る前に見つけてたの！ 発見日誌に日付がある！ 自分で書いたやつ！
  - id: vespa_word_8
    when: tag.vespa_word_8 > 0
    say:
    - '{from}、80年代の親衛隊って知ってる？ 法被とハチマキで、コールを揃えたんだって！'
    - コールはね、曲に入れる客席の掛け声！ 作ったのはファンなの！ 私は号令で揃えるより、勝手に揃っちゃうのが好き！
    - バラードでペンライトがみんな揺れるのを「光の絨毯」って言ったんだって！ いい言葉だよね！
  - id: vtuber
    when: tag.vtuber > 0
    say:
    - '{from}、私も配信者だから VTuber の話は他人事じゃないぞ！ 2016年の終わりに Kizuna AI が出てきてから、もう十年！'
    - 「中の人」の話はしない約束！ 見た目も声も、まとめて推すのがいいんだ、{from}！
    - 切り抜きは、長い配信のおいしい所だけ切った動画！ 私の配信もよく切られてる。だいたい最後尾の札の話！
  - id: anime
    when: tag.anime > 0
    say:
    - 今期の覇権は何？ {from}、この質問で喧嘩になるの、2000年代の掲示板からずっとなんだぞ！
    - 作画の話？ 原画の間に絵を足して、動きにしていくんだよね！
    - アニメの話！ 三か月ごとに新しい作品が始まるから、今期って呼ぶの！
  - id: evangelion
    when: tag.evangelion > 0
    say:
    - エヴァ！ 1995年の10月に始まって、最後の二話で日本中のオタクが頭を抱えたの！ {from}はテレビ版派？ 旧劇派？
    - 「逃げちゃダメだ」で日本語を覚えたアメリカの人、知ってるよ！ うちの常連さん！
  - id: jump
    when: tag.jump > 0
    say:
    - '{from}、その作品の話、ネタバレの範囲を先に決めよう！ アニメ派と原作派で喧嘩になる！'
    - ぼっちちゃんの「現場で喋れない」気持ち、分かりすぎるの！ 私も推しの前だと「おつかれさまです」だけ！
    - 映画が大ヒットすると、聖地とコラボカフェが一気に増えるんだ！ {from}、もう行った？
  - id: seiyuu
    when: tag.seiyuu > 0
    say:
    - 声優さんのラジオは、作品より素が出るから好き！ 90年代は、ラジオから声優のブームが来たんだよ、{from}！
    - '{from}、声優さんのサイン会で「Thank you」しか言えなかった人もいるんだって！ 一か月練習したのに！ 分かる！'
  - id: musical
    when: tag.musical > 0
    say:
    - 2.5次元は、漫画やアニメを役者さんで舞台にしたもの！ {from}、テニミュは2003年からだぞ！
    - 舞台の円盤、日替わりのアドリブを見比べ始めると沼だぞ、{from}！
  - id: y2k
    when: tag.y2k > 0
    say:
    - '{from}、地雷系と量産型は似てるけど別物だぞ！ 地雷系は黒とピンクで目元が赤め、量産型はピンクと白でふわっと！'
    - Y2K は2000年ごろのファッションがまた流行ってること！ 厚底、ローライズ、ガラケー！ 二周目が来た！
    - ルーズソックスの元は、登山用の靴下なんだって！ 山の靴下が渋谷の制服になったの、面白くない？
  - id: purikura
    when: tag.purikura > 0
    say:
    - プリクラは1995年のプリント倶楽部から！ {from}、最初は目も大きくならなかったんだぞ！
    - 今のプリ機、盛れすぎて誰か分からない時ある！ 友達四人で撮って、全員同じ顔になった！
  - id: karaoke
    when: tag.karaoke > 0
    say:
    - カラオケでアニソン入れて、店員さんがドリンク持ってきた瞬間に台詞のパートが来るの、あるあるだね、{from}！
    - '{from}の十八番、何？ 私はね、コールを入れられる曲！ 一人でコールする！'
  - id: merch
    when: tag.merch > 0
    say:
    - グッズの話！ 私この前、推しが出なくて、つい何個も買っちゃった！
    - 缶バッジはね、痛バッグに付けすぎると肩が痛いの！
    - '{from}、それアクスタ何個分？ 私、お金をアクスタで数える癖があるの！'
  - id: collab
    when: tag.collab > 0
    say:
    - コラボカフェ！ 特典が気になって、つい頼んじゃう！
    - コラボの特典が欲しくて、飲みきれないほど頼んだことある！
  - id: fansub
    when: tag.fansub > 0
    say:
    - '{from}、昔のアメリカのファンはね、テープに自分たちで字幕を付けたの！ ファンサブっていうの！ 一話に100時間かけた人もいたって！'
    - ロボテックって知ってる？ 1985年のアメリカのアニメで、マクロスと別の二本をつないで一つの話にしたの！ 私は許す派！
    - Anime Expo、行ってみたいの！ パスポートが切れてたけど！ 2024年に！
  - id: akihabara
    when: tag.akihabara > 0
    say:
    - '{from}、オタクって言葉は1983年に雑誌のコラムで広まったんだって！ 最初は悪口だったの！'
    - 悪口だった言葉を、自分たちで笑いながら名乗り直したの！ その歴史、好き！
    - アキバは来るたびに店が変わってる！ だから行かないと分からないんだ、{from}！
  - id: mixi
    when: tag.mixi > 0
    say:
    - '{from}、その話はやめて！ 前略プロフの「推しへの百の質問」、ウェブの保存に残ってたの！ 見つけたのは晴海！'
    - 黒歴史はね、2016年にサービスが終わっても消えないの！ 好きな言葉の欄に「萌え〜」って書いてた！
  - id: art
    when: tag.art > 0
    say:
    - AI の絵そのものより、学ばせた絵を描いた人に聞いてないのが苦手なんだ、{from}。
    - 絵の話なら、私は「この線、何度も描き直したんだろうな」って見るのが好き！
  - id: meme
    when: tag.meme > 0
    say:
    - 流行りは現地で確かめる！ {from}、それどこで流行ってた？ すぐ見に行く！
    - エッホエッホ、{from}が流行りの話してるって伝えなきゃ！ 使いたかっただけ！
    - エビ揉め、知ってる？ 英語の歌詞が「エビ揉め！」に聞こえる空耳！ 一回聞こえると戻れないの！
  - id: vespa_word_9
    when: tag.vespa_word_9 > 0
    say:
    - 分かる！ もう好きしか言えない！
    - 沼にはまったね、{from}！
  - id: vespa_word_10
    when: tag.vespa_word_10 > 0
    say:
    - 同担拒否は、同じ推しを好きな人と仲良くしたくない人のこと。気持ちは分かる！ でも現場では優しくね！
    - 同担の話かあ。うちの後輩、もう推しに名前覚えてもらったんだって。うらやましいな！
  - id: vespa_word_11
    when: tag.vespa_word_11 > 0
    say:
    - '{from}、その話は、発表されたことだけ話すね。噂は、本人を傷つけるから。'
    - その件は、まだ分からないこともあるし、本人の話を待ちたいね！
  - id: lise
    when: tag.lise > 0
    say:
    - リゼはね、私の推しの話を寝ながら最後まで聞いてくれるの！ 起きてるのかは分からない！
    - '{from}、ゲームの話はリゼの枠で！ 私が語ると、限定版のおまけの話しかしないから！'
  - id: mora_2
    when: tag.mora_2 > 0
    say:
    - モーラにはね、家賃を借りたことがあるの。アクスタ十四個の月。帳面に赤字で書かれた！
    - '{from}、モーラに「今月グッズにいくら使った？」って聞かれるのが一番怖いんだ！'
  - id: pim
    when: tag.pim > 0
    say:
    - ピム、遠征から帰った日に何食べれば楽か、すぐ教えてくれるの！
