title: ピムが唐揚げを持って遊びに来た。冷蔵庫を開けられた
family: true
parts:
# 挨拶：もう半日働いた人と、起きたばかりの人
- - mora: はい、始めるよ。こんにちは。今日は一人じゃないの。
  - pim: ピムです！ モーラさんのお部屋にお邪魔してます！
  - chat: [窓口十二年, え、ピムさん？]
  - mora: 窓口十二年、「え、ピムさん？」って。そう。チャイムを三回押された。
  - chat: [ポイントで生きてる, モーラ今起きたでしょ]
  - mora: 今起きたか？ 起きて四十分。
  - pim: {face: surprised, text: 四十分！ わたし、四時五十分に起きて、もう四時間、唐揚げ揚げてきました！}
  - mora: 知ってる。ドアを開けたら唐揚げのにおいがした。
  - pim: 髪です！ 揚げた日は、髪が一日唐揚げなんです！
  - chat: [上の子もう中二, パート明けに直行したのね]
  - pim: 上の子もう中二さん、出席確認しました！ 直行です！ お迎えまで時間があるので！
  - mora: うちの常連より先に、自分の常連を呼んだね。
# 出席確認が、モーラの常連に飛ぶ
- - pim: あっ、すみません！ 窓口十二年さん、ポイントで生きてるさん、出席確認しました！
  - chat: [窓口十二年, 出席確認された。初めて]
  - chat: [ポイントで生きてる, なんか背筋が伸びる]
  - mora: ポイントで生きてるの背筋、初めて聞いた。うちは出席取らないの。来ても黙ってていい枠。
  - pim: 黙っててもいいんですか！ 自由ですね……。
  - chat: [帳面カウンター, ピムさんの「！」、もう十二回]
  - mora: {face: smug, text: 帳面カウンター、もう数えてる。}
  - pim: 数えられてるんですか！ ……十四回目です！
  - chat: [帳面カウンター, モーラさんは0回]
  - mora: 0回。いつもどおり。
# 唐揚げは、もも？ むね？
- - pim: で、これです！ まんぷく亭の残りの唐揚げ！ 持って帰っていいって言われたので！
  - mora: ありがと。……もも？
  - pim: ももです！ うちのお店、もも一本なんです！
  - mora: 私、むね派なんだけど。
  - pim: ノクスさんと同じですね！ ノクスさんには、むねを揚げて持っていきました！
  - mora: ノクスにはむねを揚げて、私には残りのもも。
  - pim: 今日は残り物なので！ 選べないんです！
  - mora: いいよ。もらう側は選ばない。
  - chat: [町中華の跡取り, レモンかける？]
  - mora: レモン？ 自分の皿だけ。
  - pim: {face: smile, text: 自分の皿だけ！ わたしもです！ 規則帳にも「レモンは取り分けてから」！}
  - mora: 帳面と同じ。人の分は人の欄。……ここは気が合うね。
  - mora: ……おいしい。時間たってるのに、まだ衣がさくさくしてる。
  - pim: 四時間揚げてる人の唐揚げなので！
# 冷蔵庫を開けられる
- - pim: 残りは冷蔵庫に入れますね！ 開けます！
  - mora: え、いいけど。……あ、待って。
  - pim: {face: surprised, text: ……静かです。冷蔵庫が、静かです。}
  - chat: [実家に帰れてない, 冷蔵庫が静かｗ]
  - mora: 冷蔵庫はいつも静かだよ。
  - pim: うちのは開けると何か落ちてくるんです！ 娘のヨーグルトか、夫のマヨネーズ！
  - pim: このゼリー二個は、熱の回の！ リゼ様が差し入れた四個の残りですよね！
  - mora: なんで覚えてるの。……これは治ってから自分で買った二個。
  - pim: で、このお鍋は？
  - mora: カレー。二人前作ったから、三日目。今日で終わる。
  - pim: いいなあ……三日目……！
  - mora: いいの？ 三日目は、もう味が分からないよ。
  - pim: うちのカレー、一晩でなくなるんです！ 夫が三回おかわりします！
  - mora: 私は、作ったものがなくならないのが悩み。
  - pim: わたしは、すぐなくなるのが悩みです！
  - chat: [上の子もう中二, 交換したら？]
  - pim: 交換？ それです！ 三日目のカレー、ください！ 明日のお昼、作らなくていい！
  - mora: え、本当に持って帰るの。
  - pim: 帰ります！ お昼が一回浮きます！ 浮いた一時間、わたしの時間です！
  - mora: 私のカレーで、ピムに一時間できるのか。……いいね、それ。
# 冷凍庫と、おあいこ
- - pim: {face: surprised, text: 冷凍庫、すき間がある！ アイス入れ放題じゃないですか……。}
  - chat: [税理士事務所の繁忙期, 豚の箱の件]
  - pim: 繁忙期さん、出席確認しました！ 豚の件は言わないでください！
  - mora: ふるさと納税で豚が四箱届いたやつでしょ。
  - pim: 三箱です！ 三つの町です！
  - mora: 訂正。ありがとう。……で、さっきピム、リゼのゼリーが四個って言ったでしょ。三個。三個とも食べた。
  - pim: 言いました……！ 訂正します！
  - mora: {face: smug, text: これでおあいこ。}
  - chat: [帳面カウンター, おあいこのために取っておいたな]
  - pim: 取っておいたんですか！ さっき言ってくれればいいのに！
  - mora: 訂正されたときに使うの。
# 二人とも、立って食べてる
- - chat: [手伝う派の夫, ピムさんはご飯座って食べてる？]
  - pim: 手伝う派の夫さん、出席確認しました！ ご飯、座って食べてるかって？ ……座ってないです。台所で、娘の残したのを立って食べてます！
  - mora: 私も立って食べてる。流しの前で。
  - pim: 知ってます！ ペヤングの回！ 「座るとちゃんとした食事みたいになるから」！
  - mora: ピムは、座る時間がないから立ってる。
  - pim: モーラさんは？
  - mora: 座る理由がないから立ってる。
  - chat: [実家に帰れてない, どっちも座りなよ]
  - pim: 座ると、娘に呼ばれるんです！ 座った瞬間に「ママー」！ 毎回です！
  - mora: 座った瞬間に呼ばれるの、ちょっとうらやましい。私が座っても、誰も呼ばないもん。
  - pim: じゃあ、わたしが呼びます！ 毎晩九時に電話で「モーラさーん」って！
  - mora: いい。電話代がかかる。
  - ask:
      who: mora
      q: みんな、ご飯は座って食べてる？
      options:
      - c: 座って食べてる
        r:
        - '{from}は座ってる。えらい。'
      - c: 一人のときは立ってる
        r:
        - '{from}も立ってる。流しの前？'
      - c: 子どもの残りを立って食べる
        r: []
      - c: スマホ見ながら寝転んで
        r:
        - スマホ見ながら寝転んで食べてる、か。
        - '{from}、それはもう食事じゃなくて休憩だよ。'
      npc: [[実家に帰れてない, 1], [上の子もう中二, 2], [ポイントで生きてる, 3], [窓口十二年, 0], [手伝う派の夫, 0]]
  - mora: 座ってる人も、立ってる人もいるね。窓口十二年と、手伝う派の夫は座ってる。
  - chat: [手伝う派の夫, 座ってる。妻は立ってる]
  - pim: {face: annoyed, text: 「妻は立ってる」。……今日帰ったら、奥さんの椅子を引いてください。}
  - chat: [手伝う派の夫, はい]
# 脇道：ポテサラは作る？ 買う？
- - chat: [ポイントで生きてる, 冷蔵庫にポテサラはないの]
  - mora: ポテサラ？ ないよ。食べたいときはスーパーのお惣菜。じゃがいもから一人分作ると、三日ポテサラになるから。
  - pim: わたしは手作りしたい派です！ マヨネーズは四十グラムです！
  - mora: 量るんだ、ポテサラも。
  - chat: [窓口十二年, ポテサラおじさん思い出した]
  - mora: 2020年の夏の。スーパーで「母親ならポテトサラダくらい作ったら」って言われた、って投稿のやつね。
  - pim: {face: angry, text: 人に言われて作るものではありません！ わたしは作りたいから作るんです！}
  - ask:
      who: pim
      q: ポテトサラダ、手作りしたいですか？ お惣菜で十分ですか？
      options:
      - c: 手作りしたい
        r:
        - '{from}さん、こっちです！ マヨネーズ、何グラムですか！'
      - c: お惣菜で十分
        r: []
      - c: その日の元気しだい
        r:
        - '{from}さん、正解です！ 元気しだいです！'
      npc: [[窓口十二年, 1], [ポイントで生きてる, 1], [町中華の跡取り, 1], [上の子もう中二, 2], [寝てない育休中, 2]]
  - mora: 窓口十二年も、ポイントも、町中華も惣菜だって。
  - pim: じゃあ今日は買います！ マヨネーズは、家で量って足します！
  - mora: もう入ってる分は？
  - pim: {face: surprised, text: ……何グラムなんでしょう。}
  - mora: 店に電話しないでね。
  - pim: まだスマホ出してません！
  - mora: 鞄は開けたね。
  - chat: [寝てない育休中, いまは元気しだいの元気がない]
  - pim: 育休中さん、出席確認しました。……元気がない日は、惣菜です。それでいいんです。
# 夜：夜食と、寝かしつけ
- - chat: [実家に帰れてない, 二人とも夜は何してるの]
  - mora: 夜？ 私は夜型だから起きてる。記帳がはかどって、お腹が空く。
  - pim: で、ペヤングですね！ 「せーの」！
  - mora: 言わないで。……言ってるけど。
  - pim: わたしは寝かしつけです。で、わたしが先に寝ます！ 絵本の途中で声が止まって、娘に「ママ、つづき」って起こされます！
  - chat: [上の子もう中二, 親が先に落ちるやつ]
  - mora: 誰かが隣で寝てるの、ちょっといいね。
  - pim: いいですけど、蹴られます！ 一晩に三回、顔です！ 四歳の足、強いんです！
  - pim: あと、寝かしつけのとき配信を小さく流してるんです。リゼ様の配信だと娘が寝て、モーラさんの配信だと、わたしが寝ます！
  - mora: {face: annoyed, text: ……それ、褒めてる？}
  - pim: 褒めてます！ 声が落ち着くんです！ 三分で寝ます！
  - mora: 褒められた、一件。……三分で寝られたのも、一件でいいのかな。
  - chat: [帳面カウンター, 一件でいい]
  - pim: でも、夜中に一人で、熱いうちにペヤングが食べられるの、うらやましいです。
  - pim: 熱いうちに食べ終わったの、いつだろう……。
  - mora: じゃあ、今。唐揚げ、温めるよ。
  - pim: あ、お皿出します！ お箸は！ レンジは何ワットですか！
  - mora: 座ってて。
  - pim: ……何してたらいいんですか。
  - mora: 何もしないで。
  - pim: {face: flustered, text: それ、苦手です！}
  - chat: [寝てない育休中, 何もしないのが一番むずい]
  - mora: 育休中も苦手か。……はい、温まった。熱いよ。
  - pim: あつっ！ おいしいです！ 熱いうちに食べてます！
  - mora: 座って食べてるね。
  - pim: {face: surprised, text: ……座ってます！}
# 脇道：「独身税」と、雑費とインク
- - chat: [ポイントで生きてる, 独身税って結局なんなの]
  - mora: 独身税？ 正式には子ども・子育て支援金。独身だけが払う制度じゃないよ。子どものいる世帯も払うの。
  - pim: うちも夫の保険料に入ってます！ 四月分からです！
  - mora: ……で、お金の話ならね。ピムの家計簿、雑費の欄があるでしょ。
  - pim: {face: flustered, text: あります。雑費は、雑費です。}
  - mora: 雑費の七割がコンビニのスイーツ。自分の配信で言ってた。帳簿係として、あれは見過ごせない。
  - pim: 聞いてたんですか！ ……じゃあモーラさん。インクの瓶、何本ありますか。
  - mora: ……四十三本。
  - pim: 使ってるのは？
  - mora: 二本。
  - pim: {face: smug, text: 残りの四十一本は、何の欄ですか！}
  - mora: ……文具費。
  - chat: [ポイントで生きてる, ほんとに？]
  - mora: ……半分くらいは、雑費かもしれない。
  - pim: じゃあ、わたしのスイーツも文具費で！
  - mora: そこは真似しないで。
# 休みの取れない二人
- - chat: [実家に帰れてない, 二人とも休みの日は何してるの]
  - pim: 休みの日ですか？ 家族の予定です！ 土曜は公園と買い物、日曜は義母の家か、保育園の行事！ モーラさんは？
  - mora: ……まあ、それは後で。
  - chat: [窓口十二年, 出た「それは後で」]
  - mora: 何も入ってないの。入ってないのに、休んだ気がしない。
  - chat: [上の子もう中二, ピムさん、喜多方は？]
  - mora: 喜多方。来月行くって言ってたね。
  - pim: {face: smile, text: はい！ 行きます！ その日の家のことは、夫に全部任せます！ やり直し禁止です！}
  - mora: えらい。
  - pim: なので、留守番の手順書を書きました！ 八枚です！
  - mora: {face: surprised, text: 八枚。}
  - pim: ゴミの日、保育園の持ち物、娘の靴下の左右、夫のマヨネーズの量！
  - chat: [手伝う派の夫, それ、やり直し禁止の逆では]
  - pim: {face: surprised, text: 「やり直し禁止の逆」……逆です！ 先にやり直してます！}
  - mora: それ、置いていかない方が回るんじゃない。
  - pim: 置いていきません！ 八枚、喜多方に持って行きます！
  - mora: ラーメンの横に八枚。
  - pim: 読みません！ お守りです！
  - mora: 一人でも行けるよ。私、一人焼肉も行ったし。
  - pim: 網が三人用だった回ですよね！
  - mora: 二人用。訂正。
  - pim: 訂正します！ ……再発防止の規則を作ります！
  - mora: うちで規則作らないで。……帰ったら報告して。その日、私は何も入ってないから、聞ける。
  - pim: {face: smile, text: 一番に報告します！ 出席確認より先に！ モーラさんの休みの話も、そのとき聞きます！}
  - mora: 私の休みは……まあ、それは後で。
  - chat: [帳面カウンター, 「それは後で」二回目]
# 締め：お迎えの五分前
- - pim: あっ、時間！ お迎えです！ 五分前に着きたいので出ます！
  - mora: 五分前派ね。私も。
  - pim: そこは同じです！ カレー、お鍋ごと持ちました！ お鍋は今度返しに来ます！
  - chat: [窓口十二年, また来る口実ができた]
  - mora: 口実って言わないの。
  - pim: 口実です！ みなさん、出席ありがとうございました！ ピムでした！
  - chat: [上の子もう中二, いってらっしゃい]
  - mora: 行った。……静かになった。
  - chat: [帳面カウンター, ピムさんの「！」、百回超えた。モーラさん0回]
  - mora: 百回超えと0回。よく数えたね。……まあ、それでちょうどいいんだと思う。
  - mora: ……あれ。冷蔵庫に付箋が貼ってある。
  - chat: [実家に帰れてない, なんて書いてある？]
  - mora: 「唐揚げ（四個）。今日と明日で食べること。座って食べること」。
  - chat: [窓口十二年, 規則作ってる]
  - mora: {face: smile, text: うちで規則作らないでって言ったのに。しかも二つ。}
  - mora: 読んだよって、あとでピムに送っとく。たぶん、あの子喜ぶから。
  - mora: 座って食べるかは……まあ、それは後で。今日はここまで。またね。
