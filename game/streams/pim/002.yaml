title: 【子育て回】唐揚げを揚げてる最中に、保育園から「お熱です」の電話が来た話
family: true
parts:
# オープニング：髪が唐揚げの匂い
- - say: ピムです！ 娘が昼寝したので、始めます。
  - say: 今日、パートの日だったんですよ。まだ髪が唐揚げの匂いです。
  - chat: [ガチャ爆死太郎, いい匂いしそう]
  - say: ガチャ爆死太郎さん、出席確認しました！ 「いい匂いしそう」って、匂いは届かないので安心してください。
  - say: わたし、お弁当屋さんで週三回、朝の揚げ物をやってるんです。六時から。
  - chat: [初見の旅人, 初見です。朝六時から揚げ物すごい]
  - say: 初見の旅人さん、いらっしゃいませ！ 朝六時から揚げ物、慣れると平気ですよ。目が覚めます。
  - chat: [手伝う派の夫, こんにちは。旦那さん匂いに寄ってきそう]
  - say: 手伝う派の夫さん、こんにちは。「旦那さん匂いに寄ってきそう」……寄ってきます。
  - say: でも、寄ってくるのは唐揚げの匂いにです。わたしにじゃないです。
  - chat: [定時退社したい, 悲しい]
  - say: 悲しい、って言わないでください！ ……ちょっとだけ悲しいです。
  - chat: [上の子もう中二, こんにちは。今日もパートおつかれ]
  - say: 先輩、出席確認しました！ パートおつかれって、ありがとうございます。
  - say: 今日、唐揚げ四百個は揚げてないです。普通の日です。
  - chat: [上の子もう中二, 四百個の日があるのが怖い]
  - say: 四百個の日、年末はあるんです。大晦日は、揚げても揚げても予約の紙が減らないんですよ。
  - chat: [上の子もう中二, オードブルの予約か]
  - say: オードブルの予約、それです。去年は、終わったら腕が上がらなくて、年越しそば、夫に食べさせてもらいました。
  - chat: [ガチャ爆死太郎, 介護ｗ]
  - say: 介護って言われました。はい、介護でした。娘も横で「あーん」って言ってました。
# 本題っぽいもの：「お熱です」の電話
- - say: 今日はね、先週の電話の話をしようと思って。
  - say: 唐揚げを油に入れた、その瞬間に電話が鳴ったんですよ。
  - chat: [上の子もう中二, 保育園だ]
  - say: {face: surprised, text: 保育園です！ なんで分かったんですか！}
  - chat: [上の子もう中二, 電話はいつも揚げてる時に鳴る]
  - say: 電話はいつも揚げてる時に鳴る……。先輩のときもそうでした？
  - chat: [上の子もう中二, 三人分、十年分そう]
  - say: 三人分、十年分……。わたしのは「お熱です、37.8度です」でした。
  - say: うちの園、37.5度を超えたら電話が来るんです。園の決まりで。
  - chat: [定時退社したい, 37.5の壁]
  - say: 37.5の壁、ですね。朝は36.9度だったんですよ。ちゃんと測って出したんです。
  - chat: [夜勤明けの人, 昼に上がるやつ]
  - say: 夜勤明けさん、そう、昼に上がるやつです。子どもの熱って、なんでお昼に上がるんでしょうね。
  - say: で、唐揚げです。まだ油の中です。
  - say: 店長が「行って行って」って言ってくれて、エプロンのまま走りました。
  - chat: [ガチャ爆死太郎, 唐揚げの匂いのまま]
  - say: 唐揚げの匂いのままです。保育園の先生、たぶん気づいてました。
  - chat: [夜勤明けの人, 唐揚げは？]
  - say: 唐揚げは、店長が揚げてくれました。店長、優しいんです。
  - say: ……でも次の日、店長の顔、ちょっと疲れてて。
  - chat: [手伝う派の夫, 子持ち様って言われるやつだ]
  - say: 子持ち様、ですか。言われたことはないんです。言われる前に、自分で三回くらい思ってます。
  - chat: [上の子もう中二, 悪いのは人が足りないことだよ]
  - say: 「悪いのは人が足りないこと」……先輩、ありがとうございます。そう思うことにします。
  - say: 次の日、お礼にプリンを作って持って行きました。
  - chat: [夜勤明けの人, 手作りえらい]
  - say: 手作り、えらいって言ってもらえました！ 卵と牛乳と砂糖、全部量って作りました。
  - chat: [初見の旅人, 量るんだ]
  - say: 量るんです！ 〇・一グラムまで量れるはかりがあるんです。
  - chat: [夜勤明けの人, うちの職場も急に休む人いると地獄]
  - say: 急に休む人がいると地獄……夜勤だと、代わりの人を探すのも大変そうですね。
  - chat: [夜勤明けの人, 先週二人休んで、一人で二十床見た]
  - say: {face: surprised, text: 一人で二十……。それ、寝てないですよね。}
  - chat: [夜勤明けの人, 今から寝る]
  - say: 今から寝るんですね。寝てください。ここは聞き流してていいので。
  - chat: [定時退社したい, うちも子どもの熱で休む人いるけど、お互いさまだと思ってる]
  - say: 「お互いさま」って言ってもらえると、ほんとに助かります。
  - say: わたしも、店長が休む日は唐揚げ全部揚げようと思ってます。まだ一回もないですけど。
# 脇道：唐揚げにレモン
- - chat: [ガチャ爆死太郎, ところで唐揚げにレモンかける派？]
  - say: 唐揚げにレモン？ あ、それ聞きます？ 揚げてる人に聞きます？
  - chat: [ガチャ爆死太郎, 揚げてる人だから聞きたい]
  - say: 揚げてる人だから聞きたい、と。わたしは自分のお皿だけです。大皿にはかけません。
  - say: 取り分けてから、自分のにだけ絞るんです。
  - chat: [定時退社したい, 平和なやつだ]
  - say: 平和なやつなんです。聞かないで全部にかける人、いるじゃないですか。
  - chat: [夜勤明けの人, 飲み会で毎回いる]
  - say: 飲み会で毎回いる！ いますよね！ 半分しなしなになるんです。揚げた側から見ると、ちょっと泣けます。
  - say: そういえば、モーラさんもわたしと同じなんですよ。自分の皿だけ派。
  - chat: [初見の旅人, 揚げる人はやっぱりかけないの？]
  - say: 揚げる人はかけないのか、っていうと、かける人が多いですよ。店長は全部にかけます。揚げたての音が消えるのが好きなんですって。
  - chat: [初見の旅人, 音ｗ]
  - say: 音です。じゅわーが、しゅんってなるのがいいらしいです。わたしにはよく分からないです。
  - chat: [手伝う派の夫, うちの妻はかける。俺はかけない]
  - say: 奥さんはかけて、手伝う派の夫さんはかけない。割れてますね。どうしてるんですか？
  - chat: [手伝う派の夫, 俺が先に三個取る]
  - say: {face: smile, text: 先に三個取る……。早い者勝ち。強いですね、それ。}
  - chat: [上の子もう中二, 旦那さんは？ レモン派？]
  - say: 夫はレモン派か？ うちの夫は……マヨネーズです。
  - chat: [ガチャ爆死太郎, マヨかｗ]
  - say: マヨです。お店の唐揚げをお土産に持って帰ると、わたしの目の前でかけるんですよ。
  - say: 揚げた人の前ですよ。度胸がすごいと思います。
  - chat: [夜勤明けの人, 揚げた人の前は強い]
  - say: で、最近は娘も真似してマヨネーズかけるんです。
  - say: {face: annoyed, text: 二対一で負けてます。わたしの唐揚げなのに。}
  - chat: [上の子もう中二, 子どもはマヨ好きだよね]
  - say: 子どもはマヨ好き、ですよね。ブロッコリーにかけてくれる分には、うれしいんですけど。
  - ask:
      q: 唐揚げにレモン、かけますか？
      options:
      - c: かける
        r:
        - '{from}さん、かける派ですね。大皿のときは、一言だけ聞いてあげてください。'
      - c: かけない
        r:
        - '{from}さん、衣を大事にしてくれる人ですね。揚げる側として、うれしいです。'
      - c: 自分の皿だけ
        r:
        - 自分のお皿だけ、ですね！
        - '{from}さん、わたしとモーラさんと同じです！'
      - c: マヨネーズ
        r:
        - マヨネーズ派ですか。
        - '{from}さん、うちの夫と娘の側ですね……。わたしは見ないようにしてます。'
      npc: [[ガチャ爆死太郎, 0], [手伝う派の夫, 1], [定時退社したい, 2], [夜勤明けの人, 3]]
  - say: みごとに、ばらばらですね。夜勤明けさんは、マヨネーズ派！
  - chat: [夜勤明けの人, 夜勤明けはマヨが沁みる]
  - say: 夜勤明けはマヨが沁みる……。それは仕方ないです。夜勤明けは何でもありです。
# 戻る：お迎えの電話
- - chat: [手伝う派の夫, で、保育園の電話のとき、旦那さんは迎えに行けなかったの？]
  - say: {face: annoyed, text: 旦那さんは迎えに行けなかったのか。そこ聞いちゃいます？}
  - say: 夫は城の門番なので、門から離れられないんです。本人いわく。
  - chat: [手伝う派の夫, 本人いわく]
  - say: でもこの前のお祭りの日、同僚に門を任せて、焼きそば買いに行ってたんですよ。
  - chat: [ガチャ爆死太郎, 離れられるじゃんｗ]
  - say: 離れられるじゃん、ですよね。焼きそばのためなら離れられるんです。
  - chat: [手伝う派の夫, 耳が痛い。うちも電話は妻にしか来ない]
  - say: 電話は妻にしか来ない……うちも同じです。園の連絡先、一番上がわたしになってて。
  - say: ……一番上にしたの、わたしなんですけど。
  - chat: [定時退社したい, 自分でｗ]
  - say: はい、自分でです。入園の書類を書くとき、つい自分を一番上に書いちゃったんです。
  - chat: [上の子もう中二, 一番上を旦那さんにすればいいよ]
  - say: {face: surprised, text: 一番上を旦那さんに……先輩、それです。なんで思いつかなかったんだろう。}
  - chat: [上の子もう中二, 旦那さんが出ないと結局こっちに来るけどね]
  - say: 旦那さんが出ないと、結局こっち。来るんですね、二番目に。
  - say: でも、夫の電話が先に鳴るの、一回見てみたいです。焼きそば屋さんの前で。
  - ask:
      q: 保育園や学校からの電話、家ではどっちに来ますか？
      options:
      - c: ほぼ自分
        r:
        - ほぼ自分に来るんですね。
        - '{from}さん、仲間です。着信音、ちょっと嫌いになりませんでした？'
      - c: パートナーに来る
        r:
        - パートナーに来るんですね。
        - '{from}さん、いいなあ。どうやってそうなったか、あとで教えてください。'
      - c: 交代で決めてる
        r:
        - '{from}さん、交代制！ 表とか作ってるんですか？ 見たいです。'
      - c: まだ電話を受けたことがない
        r:
        - '{from}さん、電話が来ないの、いいなあ。そのままでいてほしいです。'
      npc: [[上の子もう中二, 0], [手伝う派の夫, 1], [寝てない育休中, 3], [定時退社したい, 3]]
  - say: 「まだ電話を受けたことがない」が多いですね、いいなあ。手伝う派の夫さん、今「パートナーに来る」を押しました？
  - chat: [手伝う派の夫, 押した]
  - say: 押した、って。それだと、電話は全部奥さんに来てます、って自分で認めたことになりますよ。
  - chat: [手伝う派の夫, 妻から見たら俺がパートナーだから合ってる]
  - say: {face: surprised, text: 妻から見たら俺がパートナー……合ってます。理屈は合ってます。くやしい。}
  - chat: [上の子もう中二, ミミちゃんと同じ手口]
  - say: ミミと同じ手口、ほんとだ。四歳と同じ手口ですね。
  - chat: [寝てない育休中, こんにちは。遅れて来た。電話の話こわい]
  - say: 寝てない育休中さん、出席確認しました。電話の話こわい？ こわくないですよ、たぶん。
  - say: 来たら来たで、なんとかなります。店長もいますし。
# また飛ぶ：役員のじゃんけん
- - chat: [上の子もう中二, 連絡先といえば、今年の役員の連絡網どうなった？]
  - say: 役員の連絡網……あっ、先輩、それ思い出させます？
  - chat: [定時退社したい, 役員なの？]
  - say: 役員なの、って？ 役員なんです。四月の保護者会で決まったんですけど。
  - say: 誰も手を挙げなくて、十二人でじゃんけんになったんですよ。
  - say: 「最初はグー、じゃんけん」って言うじゃないですか。
  - chat: [ガチャ爆死太郎, まさか]
  - say: {face: shy, text: そのまさかです。最初はグーのグーを、そのまま出しました。わたしだけ。}
  - chat: [ガチャ爆死太郎, 一人負けｗｗ]
  - say: 一人負けです。十一人がパーで、わたしだけグー。
  - say: そしたら、みんなが拍手してくれたんです。優しい拍手でした。
  - chat: [手伝う派の夫, 優しい拍手はつらい]
  - say: 優しい拍手はつらい、ほんとそう。怒られる方がまだ楽です。
  - chat: [上の子もう中二, でも一回やっとくと後が楽だよ]
  - say: 一回やっとくと後が楽……先輩、四月にもそう言ってくれましたね。
  - say: だから張り切って、引き継ぎの書類を作ったんです。十二ページ。
  - chat: [上の子もう中二, 前の人のは？]
  - say: 前の人の？ メモ一枚でした。「夏祭りの氷は前の日に頼む」。
  - chat: [上の子もう中二, それで回ってたんだよ]
  - say: {face: surprised, text: それで回ってた！？ 氷だけで！}
  - chat: [上の子もう中二, 十二ページあると次の人が読まないよ]
  - say: 十二ページあると読まない……読まないですね。わたしでも読まないかも。
  - say: 来年は一枚にします。氷のことは、ちゃんと書きます。
  - chat: [夜勤明けの人, 氷は大事]
  - say: 夜勤明けさんも、氷は大事って。去年、氷が来なくて、かき氷がただのシロップになったそうなので。
# 締め
- - say: よし、今夜、夫と連絡先の順番を変える話をします。
  - chat: [手伝う派の夫, うちも今日変える]
  - say: 「うちも今日変える」？ え、手伝う派の夫さん、自分から？
  - chat: [手伝う派の夫, 妻に「当たり前でしょ」って言われそうだけど]
  - say: 「当たり前でしょ」、言われると思います。でも、たぶんうれしいと思いますよ。わたしならうれしいです。
  - chat: [手伝う派の夫, 報告する]
  - say: 報告、待ってます！
  - say: あ、スマホが光りました。夫からです。
  - chat: [夜勤明けの人, なんて？]
  - say: なんてって、また「夜なに？」です。
  - chat: [ガチャ爆死太郎, また聞かれてるｗ]
  - say: また聞かれてます。唐揚げ、って返しておきます。……あ、ついでに、お迎え行ける日も聞いとこう。
  - say: {face: smile, text: 今のうちに、です。ピムでした！}
