title: 娘に「パパのチャーハンの方がおいしい」と言われて、町中華に通い始めた話
family: true
parts:
# オープニング：お昼は天津飯
- - say: ピムです！ こんにちは。
  - say: 今日のお昼、近所の町中華で天津飯を食べてきました。
  - chat: [町中華の跡取り, こんにちは。天津飯、甘酢？ 塩？]
  - say: 町中華の跡取りさん、出席確認しました！ 甘酢か塩か？ 塩です。
  - chat: [町中華の跡取り, 渋い]
  - say: 渋いって言われました。そのお店、甘酢か塩か選べるんですよ。選べるのがうれしくて。
  - chat: [初見の旅人, 初見です。天津飯って天津の料理？]
  - say: 初見の旅人さん、いらっしゃいませ！ 天津飯は天津の料理か。それが、天津にはないそうなんです。
  - say: 日本の中華屋さんで生まれた料理なんですって。名前だけ天津です。
  - chat: [初見の旅人, 知らなかった]
  - say: 知らなかったですよね。あと、東の方はケチャップの甘酢が多くて、西は醤油とか塩が多いって言われてます。
  - chat: [ガチャ爆死太郎, こんにちは。関西だけど塩っていうか醤油だった]
  - say: ガチャ爆死太郎さん、こんにちは！ 関西で醤油だった？ 西の人だったんですね。
  - chat: [ガチャ爆死太郎, 東京来て天津飯頼んだら赤くてびっくりした]
  - say: 東京で頼んだら赤かった！ びっくりしますよね。わたしは逆に、塩のを初めて見たとき「味ある？」って思いました。
  - chat: [町中華の跡取り, うちは甘酢しかない]
  - say: 「うちは甘酢しかない」。跡取りさんのお店は甘酢なんですね。今度行ったら、ちゃんと甘酢を頼みます。
  - chat: [上の子もう中二, こんにちは。一人で町中華いいな]
  - say: 先輩、出席確認しました！ 一人で町中華、いいでしょう。娘が保育園の日だけの、ぜいたくです。
# 本題っぽいもの：パパのチャーハン
- - say: で、町中華によく行くようになったのには、理由があって。
  - chat: [町中華の跡取り, 来た、あの話]
  - say: 「来た、あの話」って、跡取りさん。そうです。先月の日曜、夫がお昼にチャーハンを作ったんですよ。
  - say: で、娘が一口食べて言ったんです。「パパのチャーハンの方がおいしい」。
  - chat: [ガチャ爆死太郎, 「の方が」]
  - say: {face: annoyed, text: そう、「の方が」です。何と比べたか、言わなくても分かりますよね。}
  - chat: [初見の旅人, ピムさんもチャーハン作るの？]
  - say: わたしもチャーハン作るか？ 毎週土曜のお昼に作ってます。全部量るんです。
  - say: ご飯二百グラム、卵一個、塩は一・二グラム。
  - chat: [町中華の跡取り, 塩を量る人はじめて見た]
  - say: 塩を量る人、はじめて見ました？ 量りますよ！ 量らないと、毎回味が変わるじゃないですか。
  - chat: [手伝う派の夫, 旦那さんは？]
  - say: 夫ですか？ 何も量りません。火を全開にして、鍋を振って、最後に醤油を鍋のふちに回すだけ。
  - chat: [町中華の跡取り, それが正解なんだよなあ]
  - say: {face: surprised, text: え、「それが正解」なんですか？}
  - chat: [町中華の跡取り, 鍋のふちで醤油が焦げて、香りになる]
  - say: 鍋のふちで醤油が焦げて香りになる……。わたし、焦げないようにずっと中火でした。
  - chat: [ガチャ爆死太郎, 安全運転チャーハン]
  - say: 安全運転チャーハン！ そうでした。失敗はしないけど、娘には「ふつう」って言われました。
  - chat: [寝てない育休中, 毎回同じ味なのはすごいことだよ]
  - say: 毎回同じ味なのはすごい……育休中さん、ありがとうございます。……でも判定は「ふつう」なんですよね。
  - say: それで悔しくて、町中華に偵察に行き始めたんです。
  - chat: [町中華の跡取り, 偵察ｗ]
  - say: 偵察です、笑わないでください。カウンターの端に座って、鍋を振るところを見るんです。
  - chat: [上の子もう中二, 何杯食べた？]
  - say: 何杯食べたか。先月だけで、チャーハン七杯です。
  - chat: [上の子もう中二, 体重は？]
  - say: 体重は……測ってません。それは測らないことにしてます。
  - chat: [町中華の跡取り, で、何か分かった？]
  - say: 何か分かったか？ 分かりました！ お店のおじさんたち、誰も量ってないんです。
  - chat: [町中華の跡取り, うちの父も量ってない]
  - say: 跡取りさんのお父さんも量ってない！ 量らないのに、毎回同じ味なんです。なんでなんですか？
  - chat: [町中華の跡取り, 四十年同じ鍋振ってるから]
  - say: 四十年同じ鍋振ってるから……。わたしのはかり、買って二年です。
  - chat: [町中華の跡取り, あと家の火じゃ無理。米が飛ぶだけ]
  - say: 家の火じゃ米が飛ぶだけ。飛びました。振ったら、ご飯が床に。
  - say: 床のご飯は、夫が拾って食べてました。「おいしい」って。
  - say: {face: annoyed, text: 床のじゃなくて、お皿のを褒めてほしかったです。}
  - chat: [手伝う派の夫, 俺もチャーハンだけは妻に勝ってる]
  - say: え、手伝う派の夫さんも「チャーハンだけは勝ってる」？ なんで夫が強いんですかね。
  - chat: [手伝う派の夫, たぶん一品しか作らないから、それだけ練習してる]
  - say: 一品しか作らないから、それだけ練習してる……。あー、それはあるかもしれません。
  - say: わたし、一週間で二十品くらい作るんですよ。夫は月に一回、チャーハンだけ。
  - chat: [上の子もう中二, 一点集中には勝てない]
  - say: 一点集中には勝てない。勝てないですね。こっちは毎日、ほかの料理もあるのに。
  - chat: [町中華の跡取り, うちの父もチャーハン以外は母の方がうまいって言ってる]
  - say: {face: surprised, text: え、お父さんも、チャーハン以外はお母さんの方がうまいって！？}
  - chat: [町中華の跡取り, 家のご飯は母が作ってる。父は家だと何もしない]
  - say: 家では何もしない……。お店で四十年振ってる人が。
  - chat: [町中華の跡取り, 休みの日はカップ麺食べてる]
  - say: 休みの日はカップ麺……。なんか、ちょっと安心しました。
# 脇道：冷凍チャーハンとファミレス
- - chat: [夜勤明けの人, 冷凍チャーハンで戦えば？]
  - say: 冷凍チャーハンで戦う、やりました、それ。ニチレイの本格炒め炒飯。
  - say: 夫のチャーハンと並べて、娘に「どっちがおいしい？」って聞いたんです。
  - chat: [夜勤明けの人, どうなった]
  - say: どうなったと思います？ 娘、両方をお皿の上で混ぜて食べました。
  - chat: [ガチャ爆死太郎, 第三の答えｗ]
  - say: {face: surprised, text: 第三の答えです！ 比べるはずが、新しいチャーハンができちゃいました。}
  - say: 夫は「合作だな」って言ってました。うれしそうに。
  - chat: [初見の旅人, ニチレイのやつうまいよね]
  - say: ニチレイのやつ、おいしいんですよ。ノクスさんもあれ好きなんですって。
  - say: 袋の裏の分量どおりに炒めるらしくて。そこはわたしと気が合います。
  - chat: [定時退社したい, こんにちは。偵察ってファミレスも行くの？]
  - say: 定時退社したいさん、出席確認しました！ ファミレスも偵察するか？ 行きます。バーミヤンです。
  - say: チャーハンのパラパラ具合を見に行くんです。
  - say: 一回、娘が食べて「パパのとおなじ」って言ったんですよ。
  - chat: [町中華の跡取り, 旦那さん、バーミヤン級]
  - say: 「旦那さん、バーミヤン級」。そうなんです。メモにもそう書きました。
  - say: 褒めてるのか、けなしてるのか、自分でも分からないです。
  - chat: [手伝う派の夫, 褒めてると思う]
  - say: 褒めてると思う、ですか。そう思うことにします。
  - say: ファミレスって、みんなバラバラなんですよね。
  - say: モーラさんとノクスさんはサイゼリヤ。一人で入っても浮かないからって。
  - say: リゼ様はガストです。ロボットが席まで料理を持ってきてくれるから。
  - chat: [ガチャ爆死太郎, リゼ様らしいｗ]
  - say: エラさんはロイヤルホストで、ヴェスパさんはデニーズ。夜中の作戦会議用だそうです。
  - ask:
      q: 好きなファミレス、どこですか？
      options:
      - c: サイゼリヤ
        r:
        - サイゼリヤですね。
        - '{from}さん、モーラさんとノクスさんと同じですね。'
      - c: ガスト
        r:
        - ガストですね。
        - '{from}さん、リゼ様の側です。ロボット、かわいいですよね。'
      - c: バーミヤン
        r:
        - バーミヤンですね！
        - '{from}さん、仲間です！ チャーハン、見てみてください。'
      - c: ロイヤルホストかデニーズ
        r:
        - ロイヤルホストかデニーズですね。
        - '{from}さん、エラさんかヴェスパさんの側ですね。'
      npc: [[ガチャ爆死太郎, 0], [夜勤明けの人, 1], [町中華の跡取り, 2], [定時退社したい, 0]]
  - chat: [町中華の跡取り, ファミレスより町中華に来て]
  - say: サイゼリヤが多いですね。……「町中華に来て」って跡取りさん、行ってます！ お店がどこかは知らないですけど。
  - chat: [夜勤明けの人, 夜勤明けにファミレスでモーニング食べるのが好き]
  - say: 夜勤明けにモーニング、いいですよね。空いてて。
  - chat: [夜勤明けの人, 朝の七時に一人でハンバーグ食べてる]
  - say: 朝の七時に、一人でハンバーグ！
  - chat: [夜勤明けの人, 夜勤明けは夜ご飯だから]
  - say: 夜勤明けは夜ご飯だから……そっか、夜ご飯なんですね。
  - chat: [ガチャ爆死太郎, 隣の席がモーニングのトーストだと気まずい]
  - chat: [夜勤明けの人, 気まずくない。こっちは一日終わってる]
  - say: 「こっちは一日終わってる」。終わってる人と、始まる人が隣に座ってるんですね。ファミレスすごい。
  - chat: [夜勤明けの人, ドリンクバーで二時間寝たこともある]
  - say: ドリンクバーで二時間寝た……。お店の人、優しいですね。
# 戻る：伝票の字
- - say: あ、そうだ、偵察の話。偵察のついでに、集めてるものがあるんですよ。
  - chat: [夜勤明けの人, 何]
  - say: {face: smug, text: 何かって？ 伝票の字です。}
  - chat: [定時退社したい, 出た伝票]
  - say: 出た、って言わないでください。お店の人が手で書く伝票、略して書くじゃないですか。あれを集めてるんです。
  - say: 天津飯の甘酢が「天甘」で、塩が「天塩」とか。
  - chat: [ガチャ爆死太郎, 天塩はもう塩の名前ｗ]
  - say: 天塩はもう塩の名前、そうなんです。伝票の上だと、わたしの天津飯は調味料なんです。
  - say: 一番好きなのは、あるお店のおばあさんが書く「ニレ」。
  - chat: [初見の旅人, ニレ？ 木？]
  - say: ニレ、木じゃないです。ニラレバです。
  - chat: [町中華の跡取り, うちの父はレニって書く]
  - say: {face: surprised, text: お父さんは「レニ」！ レバニラなんですね、お店では。}
  - say: 中国語の順番だとニラレバで、レバニラは『天才バカボン』で広まったって話があるんですよ。
  - chat: [町中華の跡取り, それ父に言ったら怒りそう]
  - say: お父さん怒りそう？ 言わないでください。ニレの人もレニの人も、どっちもおいしいので。
  - chat: [定時退社したい, 誰も笑ってないぞ]
  - say: 誰も笑ってない……。わたしだけ笑ってます。いいんです、これは。
  - chat: [町中華の跡取り, ちょっと面白い]
  - say: {face: smile, text: 「ちょっと面白い」、跡取りさん！ 分かってくれる人がいた。}
  - chat: [町中華の跡取り, ちなみに父はチャーハンを「チャ」の一文字で書く]
  - say: 一文字！ 「チャ」だけですか！
  - chat: [町中華の跡取り, 半チャンは「半チャ」。チャーシュー麺は「チャメン」]
  - say: 半チャンが「半チャ」で、チャーシュー麺が「チャメン」。え、並んでたら厨房の人は分かるんですか？
  - chat: [町中華の跡取り, 父しか分からない]
  - say: お父さんしか分からない……。それ、お父さんがお休みの日はどうするんですか。
  - chat: [町中華の跡取り, 店が休み]
  - say: 店が休み。あ、そうか。お店ごと休みなんですね。
  - chat: [ガチャ爆死太郎, 伝票の話、まだ続く？]
  - say: 「まだ続く？」って、続けたいんですけど、ガチャ爆死太郎さんの声が冷たいので、やめておきます。
  - chat: [上の子もう中二, 写真は撮ってるの？]
  - say: 写真、撮ってます。スマホの写真、娘と伝票ばっかりです。
  - ask:
      q: 天津飯のあん、どっちが好きですか？
      options:
      - c: 甘酢
        r:
        - '{from}さん、東の定番ですね。伝票だと「天甘」です。'
      - c: 塩
        r:
        - '{from}さん、わたしと同じです！ 伝票だと「天塩」です。'
      - c: 醤油
        r:
        - '{from}さん、西の方ですか？ 醤油のも食べてみたいです。'
      - c: 天津飯を食べたことがない
        r:
        - '{from}さん、ぜひ一回。選べるお店だと、迷うのも楽しいです。'
      npc: [[初見の旅人, 3], [ガチャ爆死太郎, 2], [町中華の跡取り, 0], [上の子もう中二, 0]]
# 締め
- - say: 甘酢が多いですね。跡取りさん、自分のお店の味に入れましたね。……結局、チャーハンは夫に勝ててないです。
  - chat: [町中華の跡取り, 四十年かかる]
  - say: 四十年かかる……。おばあさんになったら勝てるかもしれません。
  - chat: [上の子もう中二, 旦那さんもその頃うまくなってるよ]
  - say: {face: annoyed, text: 旦那さんもその頃うまくなってる……先輩、それ言わないでください。}
  - chat: [初見の旅人, 天津飯食べたくなったから落ちます]
  - say: 天津飯食べたくなった！ 初見の旅人さん、ありがとうございました！ 甘酢か塩か、お店に入る前に決めてくださいね。
  - say: 聞かれてから迷うと、後ろのお客さんの視線がつらいので。
  - chat: [町中華の跡取り, 偵察、父に言っとく]
  - say: お父さんに言っとく、って！ お店が分かったら、今度行きたいです。偵察って言わないでくださいね。
  - chat: [町中華の跡取り, 甘酢しかないけどね]
  - say: {face: smile, text: 甘酢しかない、ですね。甘酢、頼みます！ ピムでした！}
