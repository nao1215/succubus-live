title: 【子育て回】「夜泣きっていつ終わるの？」と聞かれたので、うちの場合の話（離乳食とはちみつの話も）
family: true
parts:
# オープニング：朝早くのコメント
- - say: ピムです。こんにちは。ちょっと遅れました。
  - say: 寝かしつけしてたら、わたしも一緒に寝ちゃってて。十五分くらい。
  - chat: [ガチャ爆死太郎, こんにちは。寝落ちあるある]
  - say: ガチャ爆死太郎さん、出席確認しました。寝落ち、あるあるですよね。
  - say: 起きたら、娘の足がわたしの顔の上にありました。
  - chat: [上の子もう中二, こんにちは。子どもの足は必ず顔に来る]
  - say: 先輩、出席確認しました！ 「子どもの足は必ず顔に来る」。来ますよね。なんで顔なんでしょう。
  - chat: [上の子もう中二, 一番下は小二だけど、まだ来る]
  - say: 一番下が小二で、まだ来る！？ じゃあ、あと何年かは来ますね。
  - chat: [寝てない育休中, こんにちは。今日も起きてる]
  - say: 寝てない育休中さん、出席確認しました。今日も起きてる、ですか。
  - chat: [寝てない育休中, 昨日は四回起きた]
  - say: 昨日は四回起きた……。お疲れさまです。ほんとに。
  - chat: [手伝う派の夫, こんにちは。今日は何の話？]
  - say: 手伝う派の夫さん、こんにちは。今日は何の話か……決めてないです。
  - say: 決めてないんですけど、先週、育休中さんに聞かれたことがあって。
  - chat: [寝てない育休中, 夜泣きのやつ？]
  - say: そう、夜泣きのやつです。「いつ終わるの」って。
  - say: 先週は時間がなくて、ちゃんと返せなかったんですよ。
  - chat: [寝てない育休中, 覚えててくれたんだ]
  - say: 覚えてますよ。だから今日はその話から。
# 本題っぽいもの：夜泣きはいつ終わるのか
- - say: 育休中さん、今、何か月でしたっけ。
  - chat: [寝てない育休中, 五か月。三時間続けて寝たことない]
  - say: 五か月で、三時間続けて寝たことがない……。よくここまで来ました。
  - say: うちは七か月くらいから、二時間おきでした。それが三か月。
  - chat: [夜勤明けの人, 三か月はきつい]
  - say: 三か月はきつい、はい、きつかったです。起きた回数、正の字で付けてたんですよ。ノートの裏に。
  - say: 最後の方は字が崩れて、「正」が「止」になってました。
  - chat: [寝てない育休中, 書く余裕もなくなるよね]
  - say: 書く余裕、なくなりますよね。途中から、何回目か分からなくなってました。
  - chat: [寝てない育休中, いつ終わったの]
  - say: いつ終わったか。ある日、気付いたら朝まで寝てたんです。
  - say: 十か月のころでした。
  - say: 何を変えたか、覚えてないんですよ。付けてたノートも、その日だけ白くて。
  - chat: [寝てない育休中, 分からないのか]
  - say: 分からないのか、って。分からないんです。ごめんなさい、答えになってなくて。
  - chat: [上の子もう中二, うちも三人とも、理由わからず終わった]
  - say: 先輩のところも、三人とも理由が分からず終わったんですか。
  - chat: [上の子もう中二, 分からないまま終わる、が本当のところだと思う]
  - say: 分からないまま終わる。うちもそれです。あの頃は長かったですけど。
  - chat: [寝てない育休中, ちょっと楽になった]
  - say: ちょっと楽になった？ よかった。でも毎晩違いますよね。今日は少し眠れそうですか？
  - chat: [寝てない育休中, 今日は夫が夜の担当。たぶん寝れる]
  - say: 今日は旦那さんが夜の担当！ よかった。寝てください。
  - chat: [手伝う派の夫, 旦那さんは夜泣きのとき何してた？]
  - say: {face: annoyed, text: 夜泣きのとき夫が何してたか？ 寝てました。いびきかいて。}
  - say: 娘が泣いてる横で、夫がいびき。二人で合唱でした。
  - chat: [手伝う派の夫, 耳が痛い。俺も起きなかった時期ある]
  - say: 起きなかった時期ある、と。起きない人は、本当に起きないですよね。あれ何なんでしょう。
  - chat: [手伝う派の夫, 起きても母乳は出ないしって思ってた]
  - say: 「起きても母乳は出ない」……手伝う派の夫さん。
  - say: ミルクは作れますよね。
  - chat: [手伝う派の夫, はい]
  - say: おむつは替えられますよね。
  - chat: [手伝う派の夫, はい……]
  - say: {face: smile, text: 「はい……」。はい、以上です。責めてないですよ。確認しただけです。}
  - chat: [ガチャ爆死太郎, こわい確認ｗ]
  - chat: [手伝う派の夫, 下の子のときは起きた。三回に一回くらい]
  - say: {face: surprised, text: こわい確認って言われた……え、下の子のときは三回に一回起きた？ それは言っていいです。}
# 脇道：お風呂の順番
- - chat: [定時退社したい, 寝かしつけってお風呂の時間も関係ある？]
  - say: お風呂の時間も関係あるか。あるって言う人、多いですね。うちはお風呂のあと、わりとすぐ寝ます。
  - chat: [定時退社したい, 子どもと一緒に入ってる？]
  - say: 一緒に入ってます。お湯もぬるめにしてます。娘が「あつい」って言うので。
  - say: で、娘を先に洗うじゃないですか。頭から。泡が体に落ちるので。
  - say: そしたら、わたしの番には、もう娘が湯船で「出たい」って言ってるんです。
  - chat: [上の子もう中二, 母親の髪はいつも急ぎ]
  - say: 「母親の髪はいつも急ぎ」。急ぎです。自分の頭、ほぼ流してるだけです。
  - chat: [手伝う派の夫, うちは俺が入れる日、子どもが全然出てこない]
  - say: {face: surprised, text: 旦那さんが入れる日は出てこない！ 分かります！ うちも三十分出てこないんですよ。}
  - say: 何してるのかと思ったら、二人で湯船でしりとりしてました。
  - chat: [手伝う派の夫, しりとりは終わらない]
  - say: しりとりは終わらない、ほんとに。のぼせる前に、わたしが「ん」の付く言葉を言いに行きました。
  - chat: [ガチャ爆死太郎, 強制終了ｗ]
  - say: はい、強制終了です。「みかん」って言って、扉を閉めました。
  - say: お風呂の時間、一日で一番しゃべるんですよ。保育園で何があったかとか。
  - chat: [上の子もう中二, 湯船だと話すよね子ども]
  - say: 湯船だと話しますね、子ども。あと、アンパンマンのマーチを歌わされます。毎日。
  - chat: [手伝う派の夫, うちもそれ。二番まで]
  - say: 手伝う派の夫さんのところは二番まで！ うちは一番を三回です。
  - chat: [初見の旅人, 初見です。上がったあとが戦争って聞く]
  - say: 初見の旅人さん、いらっしゃいませ！ 上がったあとが戦争、って。戦争です。
  - say: 娘の体をふいて、パジャマ着せて、髪を乾かして。わたしはその間、タオル一枚です。
  - chat: [初見の旅人, 自分のは？]
  - say: 自分のは？って、自分の髪は最後です。乾かしてる途中で娘が寝ちゃうと、半分ぬれたまま寝ます。
  - chat: [寝てない育休中, 入浴剤とか使う？]
  - say: 入浴剤、バブを使います。でもね、娘が溶けるのをずっと見てるんですよ。
  - say: 溶け終わるまで入らないから、二人で洗い場で五分くらい待つんです。
  - chat: [上の子もう中二, わかる。シュワシュワ見たいんだよね]
  - say: シュワシュワ見たいんです、そう。冬は寒いので、一回半分に割って入れたんですよ。
  - say: そしたら「二回見られる」って、すごく喜んで。
  - chat: [手伝う派の夫, 一箱が倍もつ]
  - say: {face: smug, text: 一箱が倍もつ、そうなんです。家計にも優しいです。}
  - ask:
      q: お風呂で、いちばん時間がかかるのは？
      options:
      - c: 頭を洗う
        r:
        - '{from}さん、髪が長いんですか？ わたしはいつも流すだけで終わってます。'
      - c: 湯船でぼーっとする
        r:
        - '{from}さん、いいなあ。ぼーっとする時間、うらやましいです。'
      - c: 上がってから髪を乾かす
        r:
        - '{from}さん、分かります。乾かすのが一番面倒ですよね。'
      - c: シャワーだけなので速い
        r:
        - '{from}さん、速いのはいいですね。朝ですか、夜ですか？'
      npc: [[ガチャ爆死太郎, 3], [夜勤明けの人, 1], [定時退社したい, 2], [寝てない育休中, 2]]
# 戻る：離乳食とはちみつ
- - say: 髪を乾かすのが多いですね、分かります。……そうだ、育休中さん。先週、離乳食のことも書いてましたよね。
  - chat: [寝てない育休中, 書いた。聞きたかった]
  - say: 聞きたかったんですね。そろそろですか？
  - chat: [寝てない育休中, そろそろ。何から始めた？]
  - say: 何から始めたか。うちの話だけしますね。正しいのは、保健センターでもらう紙の方なので。
  - say: うちは国のガイドの通りに、新しい食べ物は一さじずつにしました。
  - say: それと、新しいのは平日の午前中だけ。
  - chat: [寝てない育休中, なんで平日の午前？]
  - say: なんで平日の午前か、っていうと、何かあっても病院が開いてるからです。
  - chat: [上の子もう中二, それ大事。うちもそうしてた]
  - say: で、それを夫が破ったんですよ。
  - say: {face: surprised, text: わたしがいない土曜日に、初めての食べ物を三つ一緒にあげたんです。}
  - chat: [ガチャ爆死太郎, 何を]
  - say: 何をって、卵と、パンと、キウイ。
  - say: 口のまわりが赤くなって、どれのせいか分からなくなりました。
  - chat: [手伝う派の夫, なんでキウイ]
  - say: なんでキウイか。夫いわく、「緑がきれいだったから」。
  - chat: [手伝う派の夫, 気持ちはちょっと分かる]
  - say: 気持ちはちょっと分かる、って。分からないでください。……いや、きれいでしたけど。
  - say: 病院の先生と相談して、一つずつ試し直しました。キウイでした。
  - chat: [寝てない育休中, 大丈夫だったの？]
  - say: 大丈夫でした。今は普通に食べてます。夫は今でもキウイから目をそらします。
  - say: あと、これはちょっとだけ真面目な話です。
  - say: 一歳になるまで、はちみつはあげないでくださいね。
  - say: 乳児ボツリヌス症っていう病気があって。
  - say: ざっくり言うと、はちみつに入ってることがある菌で、赤ちゃんは重くなることがあるんです。
  - chat: [寝てない育休中, 知らなかった。メモする]
  - say: メモしてください。保健センターの紙にも書いてあるはずです。
  - say: 2017年に東京で、はちみつが原因とみられる赤ちゃんが亡くなって。
  - say: それで国が、もう一回注意を出してるんです。
  - say: うち、義母が白湯にはちみつを入れようとしたことがあって。
  - chat: [上の子もう中二, あー、昔はあげてたって言うやつ]
  - say: 「昔はあげてた」、言われました。「昔はみんなあげてたのよ」って。
  - say: 止めたんですけど、思わず義母の手首をつかんじゃって。
  - chat: [夜勤明けの人, 正しいけど気まずいやつ]
  - say: {face: shy, text: 正しいけど気まずい、それです。そのあと出てきた煮物がすごくおいしくて、もっと気まずかったです。}
  - chat: [上の子もう中二, 義母の煮物うまい問題]
  - say: 義母の煮物うまい問題！ うまいんです。目分量なのに。わたし、量っても勝てないんです。
  - chat: [寝てない育休中, 義母さんとは今は仲いいの？]
  - say: 今は仲いいか？ 普通です。会うたびに「うちの子は夜泣きしなかった」って言われる、普通です。
  - chat: [ガチャ爆死太郎, それ普通なのｗ]
  - say: それ普通なの、って言われても。毎回、同じ言い方なんですよ。「うちの子は」の言い方まで同じで。
  - chat: [上の子もう中二, 義母あるある]
  - say: で、その「うちの子」が、うちの夫なんです。
  - chat: [手伝う派の夫, 夜泣きしなかった夫が、夜泣きの横でいびきｗ]
  - say: {face: annoyed, text: 夜泣きしなかった夫が、夜泣きの横でいびき。そうなんです！ 小さいころから寝るのが得意だったんですよ。}
  - chat: [夜勤明けの人, 才能だ]
  - say: 才能、ですね。娘には、できればわたしの方じゃなくて、夫の方が似てほしいです。そこだけは。
# 締め：とうもころし
- - chat: [寝てない育休中, ミミちゃん今は何て言ってるの]
  - say: ミミが今何て言ってるか？ もう普通にしゃべりますよ。去年の夏までは、とうもろこしを「とうもころし」って言ってて。
  - chat: [寝てない育休中, かわいい]
  - say: かわいいですよね。かわいかったです。物騒な野菜でした。
  - say: それが今年の夏、スーパーで急に「とうもろこし買って」って言ったんです。
  - chat: [上の子もう中二, あー……]
  - say: 普通に言えてて。レジの前で止まっちゃいました。後ろの人に押されました。
  - chat: [上の子もう中二, 言い間違いって予告なしでいなくなるよね]
  - say: 言い間違いは予告なしでいなくなる……。本当に予告なしでした。ちょっと寂しいです。
  - chat: [寝てない育休中, うちの子もいつか言うのかな]
  - say: 育休中さんの子もいつか言うか。言いますよ。言ったら、どこかに書いておいてください。すぐ消えちゃうので。
  - chat: [寝てない育休中, そうする。ちょっと寝てくる]
  - say: {face: smile, text: ちょっと寝てくる、ですね。いってらっしゃい。ここは出席扱いにしておきます。}
  - say: 娘が起きる前に、わたしも麦茶飲んできます。ピムでした。
