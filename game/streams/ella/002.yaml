title: ブラック・サバスの最初のアルバムと、きのこたけのこ
parts:
# 始まり（カセットの中身）
- - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: 本日は、濃いめのアッサムを淹れてまいりました。
  - chat: [武道館二階東, アッサムってことはサバスの日？]
  - say: 「アッサムってことはサバスの日？」。さすがでございます、武道館様。聴く盤で、紅茶を変えておりますので。
  - chat: [鍵盤を売った, こんにちは。カセット聴いた？]
  - say: 鍵盤を売った様、「カセット聴いた？」って。いきなりそこでございますか。
  - chat: [新譜しか聴かない, それ聞きに来た]
  - chat: [ヘドバンで首やった, 鍵盤入ってた？]
  - say: 皆様それを聞きに。はい、聴きました。厨房の機械を、夜中にこっそりお借りして。
  - say: 鍵盤は入っていたか。入っておりました。当方の鍵盤。
  - chat: [鍵盤を売った, おお！]
  - say: ただ、すっごく小さかったんです。ギターの、ずっと後ろのほうで、かすかに。
  - chat: [ヘドバンで首やった, ギルの仕業だ]
  - say: ギル様の仕業。そうとしか思えません。音量を下げられております。
  - chat: [ピアノ教室の先生, 昔の自主制作なら、単に録音が下手だっただけかも]
  - say: 単に録音が下手だった……先生、それは言わないでくださいまし。当方、ギル様のせいにしたいので。
  - chat: [新譜しか聴かない, 正直]
  - say: 正直でございましょう。でも一か所だけ、鍵盤がギターより前に出る所がございまして。
  - say: そこだけ、十回くらい巻き戻して聴きました。鉛筆で。
  - chat: [新譜しか聴かない, 鉛筆使ったんだ]
  - say: 鉛筆、使いました。新譜様に言われたので、つい。
  - chat: [新譜しか聴かない, 言っただけなのに]
  - say: {face: laugh, text: 言っただけなのに、とおっしゃいましても。使ってみたら、意外と楽しゅうございました。}
  - chat: [鍵盤を売った, 自分の音が聴けてよかったね]
  - say: はい。小さかったですけど、ちゃんと当方の音でした。指の癖で分かるんです。
  - chat: [ヘドバンで首やった, 指の癖って音で分かるの？]
  - say: 指の癖、音で分かります。当方、和音を押さえるとき、いちばん下の音だけ、ほんの少し先に鳴らす癖があって。
  - chat: [ピアノ教室の先生, それ直したほうがいいやつ]
  - say: 「直したほうがいい」。先生、今日はもう二回目でございますよ。
# 本題（一九七〇年の金曜日）
- - say: さて、本日はサバスの日なので。ブラック・サバスの、最初のアルバムのお話を。
  - chat: [初見の旅人, 初見です。サバスって？]
  - say: 旅人様、いらっしゃいませ。サバスって何か？ イギリスのバンドで、ヘヴィメタルの元祖と言われる方々でございます。
  - say: 歌っていたのが、オジー・オズボーン様。
  - chat: [初見の旅人, 名前は聞いたことあります]
  - say: お名前は有名ですものね。その方々の最初のアルバムが出たのが、一九七〇年の二月十三日。
  - chat: [新譜しか聴かない, 56年前]
  - say: 五十六年前。新譜様からしたら、大昔でございますよね。
  - chat: [新譜しか聴かない, 化石]
  - say: 化石って。化石でも、まだ皆様聴いておりますからね。
  - say: でね、この日。金曜日だったんです。十三日の金曜日。
  - chat: [ヘドバンで首やった, 狙ってるじゃん]
  - say: 狙ってる、ですよね！ 当方、こういう所が大好きなんです。
  - chat: [武道館二階東, 一曲目の雨の音がいいんだよ]
  - say: 一曲目の雨の音！ そうなんです！ 雨の音と、遠くの鐘の音から始まりまして。
  - say: そこにギターが、ずーん、と三つの音を鳴らす。
  - chat: [初見の旅人, 怖そう]
  - say: 怖そう、でしょう。怖いんです。その三つの音、わざと気持ちの悪い音の幅にしてございまして。
  - say: 三全音、と申します。ざっくり言うと、ドとファのシャープみたいな、落ち着かない組み合わせでございます。
  - chat: [初見の旅人, 歌ってみてください]
  - say: {face: flustered, text: 歌ってみて？ 歌いません。歌いませんよ。}
  - chat: [ピアノ教室の先生, 歌わないほうがいいと思う]
  - say: 「歌わないほうがいい」。先生。今のは、どういう意味でございますか。
  - chat: [ヘドバンで首やった, 先生なんか知ってるな]
  - say: 先生が何か知ってる？ 何もございません。次へまいります。
  - chat: [ピアノ教室の先生, 悪魔の音程の話はしないの？]
  - say: 悪魔の音程の話、しません。昔、教会で禁止された、という話。あれ、後の時代にできた話らしいので。
  - say: 本当は言いたかったんですよ。でも、先生に直されるのが見えていたので。
  - chat: [ピアノ教室の先生, よく我慢した]
  - say: {face: smug, text: 「よく我慢した」。もっと褒めてくださってもよろしいのですよ。}
  - say: それで、曲名でございます。当方、サバスの曲名を、丁寧な言葉に訳すのが好きでして。
  - chat: [武道館二階東, 出た]
  - chat: [初見の旅人, 訳？]
  - say: 訳でございます。たとえば『パラノイド』は、「お疑いが深くていらっしゃる」。
  - chat: [新譜しか聴かない, 誰も笑ってない]
  - chat: [ヘドバンで首やった, ちょっと笑った]
  - say: 誰も笑ってない……あ、首やった様は「ちょっと笑った」。ありがとうございます。お一人いれば十分です。
  - chat: [初見の旅人, アイアン・マンは？]
  - say: 『アイアン・マン』は、「鉄の殿方」。
  - chat: [ピアノ教室の先生, そのまま]
  - say: そのまま、ですね。これは自分でも、ちょっと手抜きだと思います。
# 脇道（きのこたけのこ）
- - chat: [ヘドバンで首やった, たけのこの里食べながら見てる]
  - say: あら。たけのこの里を食べながら。首やった様、たけのこ派でいらっしゃる？
  - chat: [ヘドバンで首やった, たけのこ一択]
  - say: {face: smile, text: たけのこ一択！ お仲間でございます！ 当方もたけのこでございます。}
  - chat: [新譜しか聴かない, エラはきのこっぽいのに]
  - say: 当方がきのこっぽい？ よく言われるんです。なぜでしょう。
  - chat: [新譜しか聴かない, 古風だから]
  - say: 古風だから、と。きのこの山が古風、というのもよく分かりませんけれど。
  - say: 当方は、あのクッキーが好きなんです。チョコと一緒に、さくっと来るところが。
  - chat: [武道館二階東, 自分はきのこ派です。持つとこがあるから]
  - say: 持つ所があるから、きのこ。ええ、武道館様はそうだと存じておりました。
  - chat: [ピアノ教室の先生, うちの教室の子たち、毎年これで揉めてる]
  - say: 教室の子たちが毎年揉める。揉めますよね。先生の教室では、どちらが多いんです？
  - chat: [ピアノ教室の先生, きのこ。でもレッスン前は食べさせない]
  - say: きのこが多くて、レッスン前は禁止。指がチョコだらけになりますものね。
  - chat: [ピアノ教室の先生, 鍵盤が茶色くなる]
  - say: {face: surprised, text: 鍵盤が茶色く。なったことがあるんですね、先生。}
  - chat: [ヘドバンで首やった, 自分はたけのこを一口で二個いく]
  - say: 一口で二個！ それは、もったいなくございません？
  - chat: [ヘドバンで首やった, 口の中でちょうどいい]
  - say: 口の中でちょうどいい、と。当方は一個ずつ、紅茶を一口はさんで食べます。
  - chat: [新譜しか聴かない, 食べ方まで古風]
  - say: 食べ方まで古風でございますか。普通だと思っておりました。
  - chat: [ヘドバンで首やった, きのこは最後クラッカーだけ残る]
  - say: {face: laugh, text: 最後にクラッカーだけ残る……それは、きのこ派の皆様の前で言ってはいけません。}
  - ask:
      q: 皆様は、きのこの山とたけのこの里、どちら派でございますか。
      options:
      - c: きのこの山
        r:
        - '{from}様は、きのこの山。持つ所、便利でございますものね。'
        - 当方はたけのこですけれど、敵だとは思っておりませんよ。たぶん。
      - c: たけのこの里
        r:
        - たけのこの里！ {from}様、ようこそこちら側へ！
        - クッキーのさくっと、でございますよね。分かってくださって、うれしいです。
      - c: どっちも好き
        r:
        - どっちも好き。{from}様、平和なお方。それなら誰とも揉めませんね。
        - でも、片方しか残っていなかったら、どちらを取ります？ ……答えなくてよろしいです。
      npc: [[ヘドバンで首やった, 1], [武道館二階東, 0], [新譜しか聴かない, 2], [ピアノ教室の先生, 0], [鍵盤を売った, 1]]
  - chat: [鍵盤を売った, きのこもいるね]
  - say: きのこの山、と書く方もいらっしゃいますね。持つ所は便利ですものね。
  - chat: [ピアノ教室の先生, で、サバスの話は？]
  - say: 「で、サバスの話は？」……あ。
  - say: 待ってくださいまし。どこまで話しましたっけ。
  - chat: [初見の旅人, 鉄の殿方]
  - say: {face: shy, text: 「鉄の殿方」。そう、そこまででございました。失礼いたしました。}
# 本題に戻る（アイオミ様の指と、ウォード様の拍）
- - say: ここからは、ちょっとオタクの話でございます。
  - say: ギターのトニー・アイオミ様。この方、十七歳のときに、工場の事故で指の先をなくされているんです。
  - chat: [初見の旅人, えっ]
  - chat: [鍵盤を売った, 右手だっけ]
  - say: 右手だったか。右手でございます。左利きなので、弦を押さえるほうの手。
  - chat: [初見の旅人, それでギター続けたんですか]
  - say: それでも続けたんです。洗剤の容器を溶かして、指先にかぶせる物を自分で作って。
  - chat: [ヘドバンで首やった, 自作すごい]
  - say: 自作、すごいですよね。それでも押さえると痛いので、細い弦を探したんです。当時はそういう弦が売っていなくて、バンジョーの弦を張ったとか。
  - say: さらに後、三枚目の『Master of Reality』では、弦をゆるめて、音を低く合わせておられます。
  - say: ゆるめると押さえるのが楽になって、音も低く、重くなるんです。
  - chat: [新譜しか聴かない, 痛いから工夫したら重い音になったってこと？]
  - say: {face: smile, text: 痛いから工夫したら、重い音に。そう！ そうなんでございます！ 当方、この話が大好きで！}
  - say: 最初のアルバムは、まだ普通の高さなんですけれど。痛くて工夫した所から、あの重さが育っていく。もう、たまらなくて。
  - chat: [武道館二階東, エラちゃん早口]
  - say: 早口？ え、そうでございました？ 普通に話しているつもりなのですけれど。
  - chat: [ヘドバンで首やった, 尻尾めっちゃ揺れてる]
  - say: {face: annoyed, text: 尻尾が揺れてる？ 尾は見ないでくださいまし。}
  - say: それから、ドラムのビル・ウォード様。当方、この方の叩き方が好きでして。
  - say: ほんの少しだけ、遅れ気味に叩くんです。ちょうどの所より、ちょっと後ろ。
  - chat: [初見の旅人, 遅れるのってだめなんじゃ]
  - say: 遅れるのはだめなんじゃ、と思いますよね。それが、わざとなんです。そのおかげで、重たい物を引きずるみたいに聞こえるんですよ。
  - chat: [新譜しか聴かない, ただ遅いだけでは]
  - say: ただ遅いだけ、では。違うんです、違うんですけど……うまく言えません。
  - chat: [新譜しか聴かない, 説明あきらめた]
  - say: はい、説明あきらめました。三分くらい聴いていただくほうが早いです。
  - chat: [ヘドバンで首やった, 首が勝手に動くやつね]
  - say: 首が勝手に動くやつ！ それです！ 首やった様、それでございます。
  - chat: [ヘドバンで首やった, だから首やった]
  - say: {face: laugh, text: だから首を。それは、お大事になさってくださいまし。}
# 締め（砂時計と『パラノイド』）
- - chat: [鍵盤を売った, 三分で思い出したけど、紅茶って何分蒸らすの]
  - say: 紅茶を何分蒸らすか。当方は三分でございます。小さな砂時計で計っております。
  - say: ただ、たまに砂時計が見つからない日があって。そういう日は、三分くらいの曲を一曲かけるんです。
  - chat: [初見の旅人, おしゃれ]
  - say: おしゃれでございましょう。それで、サバスの日は『パラノイド』をかけるんですけど。
  - say: あの曲、三分ないんですよ。
  - chat: [武道館二階東, 2分48秒くらいだっけ]
  - say: 二分四十八秒くらい。そのくらいでございます。なので、サバスの日の紅茶は、いつもちょっと薄いんです。
  - chat: [ヘドバンで首やった, 曲選び直せばいいのに]
  - say: 曲を選び直せばいい？ それは嫌なんです。サバスの日は『パラノイド』なので。
  - chat: [新譜しか聴かない, 頑固]
  - say: 頑固、でございますね。自分でもそう思います。
  - say: そろそろお時間でございます。本日もありがとうございました。
  - chat: [鍵盤を売った, 手紙の返事は？]
  - say: 手紙の返事は……それは、次回以降ということで。
  - chat: [ピアノ教室の先生, 逃げた]
  - say: 逃げた、と。はい、逃げました。それでは皆様、ごきげんよう。
  - say: たけのこ派の皆様、また来てくださいね。きのこ派の皆様も、どうぞ。
