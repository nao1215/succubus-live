title: メタリカをクビになったギタリストが、メガデスを作るまで
parts:
# 始まり（自動で流れてきた曲）
- - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: 今日は、セイロンのストレートでございます。速い曲の日は、すっきりした葉にしておりまして。
  - chat: [武道館二階東, スラッシュの日か]
  - say: スラッシュの日か、と。はい、スラッシュメタルの日でございます。
  - chat: [初見の旅人, スラッシュって？]
  - say: スラッシュって何か。えっと、すごく速くて、刻むようなギターのメタルでございます。八〇年代のアメリカで流行りました。
  - chat: [ヘドバンで首やった, 首に悪いやつ]
  - say: 首に悪いやつ、そうです。首やった様、本日は首を振らずにお聴きくださいまし。
  - chat: [ヘドバンで首やった, 無理]
  - say: 無理。でしょうね。
  - chat: [新譜しか聴かない, この前送ったおすすめ聴いた？今年のやつ10枚]
  - say: 新譜様の、今年のおすすめ十枚。聴きました！ 全部。ありがとうございます。
  - say: ただ、そのあと自動で次に流れてきた曲に、つかまってしまいまして。
  - chat: [新譜しか聴かない, 何]
  - say: 何の曲か。ローナ・ショア様の『To the Hellfire』でございます。
  - chat: [新譜しか聴かない, それ2021年だから新譜じゃないよ]
  - say: 二〇二一年だから新譜じゃない。存じております。五年前でございます。
  - say: 叫び声が、もう人の声に聞こえない所まで行くんです。当方、紅茶を置いて、正座で聴きました。
  - chat: [武道館二階東, 正座ｗ]
  - chat: [新譜しか聴かない, 老害がデスコアにハマった]
  - say: {face: shy, text: 老害がデスコアにハマった。ハマりました。認めます。}
# 本題（一九八三年四月の朝）
- - say: それで本日は、有名なクビの話をしようと思いまして。当方のクビより、ずっと有名なほうの。
  - chat: [鍵盤を売った, ムステインだ]
  - say: ムステイン、そうです。一九八三年の四月十一日。ニューヨーク。
  - say: メタリカ様が、まだ一枚もアルバムを出していない頃でございます。
  - chat: [初見の旅人, メタリカは知ってます]
  - say: メタリカはご存じ。そのメタリカ様の最初のギターの一人が、デイヴ・ムステイン様。その朝、クビを言い渡されたんです。
  - chat: [初見の旅人, なんでですか]
  - say: なんでか。お酒と、荒れた振る舞いと、メンバーとの衝突、と言われております。
  - chat: [ヘドバンで首やった, 当時のメタルの人みんなそうでは]
  - say: 当時のメタルの人、みんなそう……それは当方も、ちょっと思います。
  - say: ムステイン様は、そのまま長距離バスで、カリフォルニアへ帰された。
  - chat: [新譜しか聴かない, エラの馬車の切符と同じじゃん]
  - say: {face: surprised, text: 当方の馬車の切符と同じ！ そうなんです！ 片道でございます！}
  - say: 当方なんかが、ムステイン様のお気持ちが分かると言ったら失礼なのですけれど。
  - say: 分かります。
  - chat: [武道館二階東, 分かっちゃうんだ]
  - chat: [鍵盤を売った, 今日は肩入れの日だ]
  - say: 分かっちゃう、肩入れの日。はい、今日は肩入れいたします。先に言っておきます。
  - say: 代わりに入ったのが、カーク・ハメット様。飛行機の中で曲を覚えたそうでございます。
  - chat: [ピアノ教室の先生, 飛行機で覚えるのすごい]
  - say: 飛行機で覚える、すごいですよね。当方なら、着くまでに三曲が限界です。
  - chat: [ヘドバンで首やった, 三曲はいけるんだ]
  - say: 三曲はいけるのか。鍵盤でしたら。
  - say: で、その翌月に録ったのが、最初のアルバム『キル・エム・オール』。
  - chat: [新譜しか聴かない, 敬語訳来るぞ]
  - say: はい、敬語訳でございます。「皆様、残らずお召し上がりくださいませ」。
  - chat: [ヘドバンで首やった, 給食みたい]
  - say: {face: laugh, text: 給食みたい！ 言われてみれば、そうでございますね。}
  - say: でね、このアルバム。クビになった方の名前が、残っているんです。
  - chat: [初見の旅人, クビなのに？]
  - say: クビなのに、なんです。曲を作った人の所に、ムステイン様のお名前が、四曲。
  - say: 『The Four Horsemen』、『Jump in the Fire』、『Phantom Lord』、『Metal Militia』。
  - chat: [武道館二階東, フォー・ホースメンが一番有名か]
  - say: フォー・ホースメンが一番有名ですね。それに、ハメット様のギターソロも、いくつかは出だしがムステイン様の考えたものだと言われております。
  - chat: [鍵盤を売った, 名前が残ってるのはいいね]
  - say: 名前が残ってるのはいい。いいですよね。当方のカセットにも、名前を書いておけばよかったです。
# 脇道（コーヒーか紅茶か、喫茶店の針）
- - chat: [作業用BGM勢, コーヒー飲みながら見てます]
  - say: 作業用BGM勢様、いらっしゃいませ。コーヒーを飲みながら。コーヒー派でございますか。
  - chat: [作業用BGM勢, コーヒーないと仕事できない]
  - say: ないと仕事できない。当方は紅茶なんですけど、コーヒーの香りは好きなんです。淹れているそばを通ると、つい足が止まります。
  - say: 作業用BGM勢様は、豆から挽かれる方？
  - chat: [作業用BGM勢, インスタント。三杯目から味が分からない]
  - chat: [新譜しか聴かない, エラはコーヒー飲まないの？]
  - say: インスタントで、三杯目から味が分からない……それはお疲れでございます。当方が飲むか？ 年に三回くらいは。飲むときはブラックです。
  - chat: [ピアノ教室の先生, 三回は少ない]
  - chat: [武道館二階東, 喫茶店とか行く？]
  - say: 三回は少ない、と。で、喫茶店。行きます！ 城下に、店主の方が自分のレコードをかけるお店がございまして。
  - chat: [作業用BGM勢, そういう店いいな]
  - say: そういう店、いいんですよ。それで、一度ですね。レコードの針が飛んで、同じ所を何回も繰り返しておりまして。
  - chat: [初見の旅人, あるあるなんですか？]
  - say: あるあるか、というと、たまにございます。盤に小さな傷があると、針がそこで戻ってしまうんです。
  - say: でも店主の方、お皿を洗っていて、気付いておられなくて。
  - chat: [ヘドバンで首やった, 言ってあげなよ]
  - say: 言ってあげなよ、と思いますよね。言えなかったんです。何周か待って、それでも気付かれないので、そっと立って針を上げました。
  - chat: [武道館二階東, 勝手に触ったの？]
  - say: 勝手に触ったか。触りました。……お店の物なのに。
  - say: そうしたら店主の方が、「ありがとう」とだけ言って。その日のお代を取らなかったんです。
  - chat: [作業用BGM勢, いい店]
  - say: いい店、なんです。今度、そのお店で何がかかっていたか、思い出したらお話しします。
  - chat: [新譜しか聴かない, 思い出せないの]
  - say: 思い出せないの、って。思い出せないんです。針のことばかり見ていたので。
  - chat: [ピアノ教室の先生, えっと、ムステインはどうなった]
  - say: ムステインはどうなった。あっ。そうでした。バスに乗せたままでございました。
# 本題に戻る（バスの中で付けた名前）
- - say: ムステイン様は、帰りのバスの中で、新しいバンドの名前を思いついた、と言われております。
  - say: 政治家のビラに書かれていた言葉から取った、とか。
  - chat: [ヘドバンで首やった, バスで名前決めるの強い]
  - say: バスで名前を決めるの、強いですよね。当方は馬車で泣いていただけでございます。
  - chat: [鍵盤を売った, 泣いたんだ]
  - say: {face: shy, text: 泣いたんだ、って。ちょっとだけです。}
  - say: その年のうちに、ロサンゼルスでメガデスができました。
  - chat: [新譜しか聴かない, メガデスの敬語訳は？]
  - say: メガデスの敬語訳。二枚目の『Peace Sells… but Who's Buying?』。
  - say: 「平和、お売りしております。お買い上げの方は？」
  - chat: [ヘドバンで首やった, それはちょっと好き]
  - chat: [新譜しか聴かない, ただの店員]
  - say: ちょっと好き、と、ただの店員。店員さんでございますね。
  - say: それから、ちょっとオタクの話を。『The Four Horsemen』には、元になった曲があるんです。
  - say: ムステイン様が書いた『The Mechanix』。歌詞が全然違いまして。
  - chat: [武道館二階東, ガソリンスタンドの歌でしょ]
  - say: ガソリンスタンドの歌、そうです。ガソリンスタンドの……少々、お下品な歌でございます。
  - chat: [ヘドバンで首やった, ガソリンスタンドで何するの]
  - say: ガソリンスタンドで何をするか。給油でございます。……そういう意味の。
  - chat: [ヘドバンで首やった, そういう意味の給油ｗ]
  - say: {face: smug, text: サキュバスの前でその話を広げると、長くなりますよ。}
  - say: メタリカ様は、歌詞を書き換えて、真ん中に新しい部分を足して『The Four Horsemen』にした。
  - say: ムステイン様は、元の形のまま、メガデスの最初のアルバムに『Mechanix』として入れた。
  - chat: [新譜しか聴かない, 同じ曲が二つのバンドにあるの面白い]
  - say: 同じ曲が二つのバンドに。面白いですよね。聴き比べると、同じリフなのに、だいぶ顔つきが違うんです。
  - ask:
      q: 皆様は、メタリカ派でございますか、メガデス派でございますか。
      options:
      - c: メタリカ
        r:
        - '{from}様はメタリカ。肩入れの日に、正直なお方。'
        - メタリカ様の曲、当方も大好きでございますよ。
      - c: メガデス
        r:
        - メガデス！ {from}様、本日のお仲間でございます！
        - 紅茶、もう一杯淹れてまいりますね。
      - c: 両方好き
        r:
        - 両方好き。{from}様、大人でございますね。
        - 当方も本当はそうなんです。今日だけ、メガデス様の味方をしているだけで。
      - c: スレイヤー
        r:
        - '{from}様はスレイヤー。今日は、首を休ませる気がございませんね。'
        - いいと思います。四天王と呼ばれるバンドは、四つございますから。
      npc: [[新譜しか聴かない, 0], [武道館二階東, 1], [鍵盤を売った, 2], [ヘドバンで首やった, 3], [作業用BGM勢, 0]]
  - say: メタリカ派の方が多いですね。肩入れの日なのに。
# 締め（二十七年ぶりの同じ舞台）
- - chat: [初見の旅人, 二人は仲直りしたんですか？]
  - say: 二人は仲直りしたか。その前に、一つ、苦しい場面がございまして。二〇〇一年の。
  - say: メタリカ様の記録映画『Some Kind of Monster』に、ムステイン様と、ドラムのラーズ・ウルリッヒ様が、ホテルの一室で向かい合う場面があるんです。
  - chat: [武道館二階東, あれは観てて苦しい]
  - say: 観てて苦しい、ですよね。間に、バンドの話し合いを手伝うカウンセラーの方が座っておられて。
  - chat: [初見の旅人, バンドにカウンセラー？]
  - say: バンドにカウンセラー、そうなんです。当時のメタリカ様は、バンドの中がこじれていて、話し合いの先生を雇っておられたんです。
  - chat: [鍵盤を売った, うちのバンドにも欲しかった]
  - say: うちのバンドにも欲しかった。当方の月下晩餐会にもです。
  - say: その場面で、ムステイン様が、ずっと二番目だった気持ちを話されるんです。
  - say: ただ、ムステイン様ご自身は、あとで、あの場面を外してほしかったと言っておられるそうで。
  - chat: [新譜しか聴かない, じゃあ観ないほうがいいのでは]
  - say: {face: sad, text: 観ないほうがいいのでは。そうなんです。そう思うのに、当方、観てしまうんです。}
  - chat: [ピアノ教室の先生, 正直]
  - say: 正直、でございましょう。で、そこから九年後。
  - say: 二〇一〇年に、同じ舞台に立ったことがあるんです。
  - say: ブルガリアのソフィアで、メタリカ、スレイヤー、メガデス、アンスラックスの四組が、同じ日に出る公演がございまして。
  - chat: [武道館二階東, ビッグ・フォー]
  - say: そう、ビッグ・フォー。最後に、メタリカ様の舞台に、メガデス様とアンスラックス様の方々が上がって、ダイアモンド・ヘッドの『Am I Evil?』を一緒に演奏したんです。そこにムステイン様もいた。
  - chat: [ヘドバンで首やった, スレイヤーは？]
  - say: スレイヤーは？ スレイヤー様からは、ドラムのデイヴ・ロンバード様だけ。ケリー・キング様たちは上がっておられなくて、あとで、出ればよかったとおっしゃったそうです。
  - say: メタリカ様と同じ舞台に立つのは、一九八三年の四月以来。二十七年ぶりでした。
  - chat: [鍵盤を売った, よかった]
  - say: よかった、ですよね。当方、その映像を何回観たか分かりません。
  - chat: [新譜しか聴かない, 仲直りしたってこと？]
  - say: 仲直りしたってこと？ それは、どうなんでしょう。ご本人たちにしか分かりませんね。
  - chat: [作業用BGM勢, 仕事終わったので落ちます。コーヒー二杯目いきます]
  - say: お仕事終わり、お疲れ様でございます、作業用BGM勢様。コーヒー二杯目、いってらっしゃいませ。
  - chat: [ヘドバンで首やった, 俺も紅茶飲みたくなってきた]
  - say: 紅茶を飲みたくなってきた。どうぞどうぞ。何の葉がございます？
  - chat: [ヘドバンで首やった, ティーバッグのやつ]
  - say: ティーバッグ、それで十分でございます。お湯を先に注いで、三分。それだけ。
  - say: それでは皆様、本日もありがとうございました。ごきげんよう。
