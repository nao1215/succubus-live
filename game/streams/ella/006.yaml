title: 日本人はなぜ速弾きギターが好きなのか、とカラオケの採点
parts:
# 始まり（タンバリン三時間）
- - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: すみません、今日はちょっと腕が重くて。
  - chat: [ヘドバンで首やった, 何したの]
  - say: 何をしたか。昨日、主様のお付き合いで、カラオケに行ってまいりまして。
  - chat: [新譜しか聴かない, エラ歌ったの？]
  - say: 当方が歌ったか？ 歌っておりません。当方は、タンバリンの係でございます。
  - chat: [武道館二階東, タンバリン係ｗ]
  - say: 笑わないでくださいまし、タンバリン係。主様が歌っている間、ずっと叩いておりました。三時間。
  - chat: [ピアノ教室の先生, 三時間は腕にくる]
  - say: 三時間は腕にくる。きます。拍は一回も外しておりませんけど。
  - chat: [初見の旅人, どこのカラオケですか]
  - say: どこのカラオケか。ビッグエコーでございます。城下の駅前の。
  - chat: [鍵盤を売った, リゼ様は何歌ってたの]
  - say: 主様が何を歌っていたか……それは主様の名誉のために、伏せておきます。
  - say: で、最後に主様が「エラも一曲」と言い出しまして。
  - chat: [ヘドバンで首やった, きた]
  - say: はい、来ました。当方、タンバリンを倍の速さにして、聞こえなかったふりをいたしました。
  - chat: [新譜しか聴かない, 逃げ方が雑]
  - say: {face: smug, text: 逃げ方が雑。雑でも、逃げられればいいんです。}
# 本題（持論と、先生の反論）
- - chat: [武道館二階東, そういえば今日はギターの話？]
  - say: 今日はギターの話、そうなんです。前から気になっていることがございまして。
  - say: 日本の方って、速弾きのギタリストがお好きですよね。リッチー・ブラックモア様、イングヴェイ・マルムスティーン様。
  - chat: [武道館二階東, 大好き]
  - chat: [新譜しか聴かない, おじさんはね]
  - say: 武道館様は大好き、新譜様いわく「おじさんはね」。おじさんは。
  - chat: [新譜しか聴かない, おじさんとエラは]
  - say: {face: annoyed, text: おじさんと、エラは？ 当方をおじさんの中に入れないでくださいまし。}
  - say: それから、マイケル・シェンカー様。日本では「神」と呼ばれております。
  - chat: [初見の旅人, 神？]
  - chat: [武道館二階東, 神は神]
  - say: 神？ と聞かれて「神は神」。武道館様、それでは説明になっておりません。
  - chat: [武道館二階東, 神だから]
  - say: 神だから。……分かりました。神でございます。
  - say: で、当方の持論なんですけど。統計とかではなく、ただの思いつきでございます。
  - say: 日本の歌謡曲って、悲しい感じのメロディーが多いでしょう。ああいうのを、ギターが代わりに歌ってくれるから、好かれるんじゃないかと。
  - chat: [初見の旅人, ギターが歌う？]
  - say: ギターが歌う、そう、泣いているみたいに弾くんです。そういうのを「泣きのギター」と申します。
  - say: それにイングヴェイ様は、バッハ様みたいなクラシックの音の並びを、エレキギターで弾く方でして。
  - say: 歌謡曲の泣きと、クラシックの音の並び。その両方が入っているから、日本の方に刺さるんじゃないかと。
  - chat: [ピアノ教室の先生, イングヴェイは和声的短音階もよく使うね]
  - chat: [初見の旅人, わせいてき……？]
  - say: 先生の言う、和声的短音階。旅人様、えっと、悲しい感じの音階、短音階っていうのがございまして。その七番目の音だけ、半音上げたものでございます。
  - say: ラシドレミファ、ソのシャープ、ラ。最後に、階段を一段ぐっと上がる感じ。
  - chat: [初見の旅人, 歌ってみてください]
  - say: {face: flustered, text: また歌ってみて、ですか。歌いません。弾くなら弾きます。}
  - chat: [ヘドバンで首やった, 弾いて]
  - say: 弾いて、と。今日は鍵盤を出しておりませんので、また今度。
  - chat: [ピアノ教室の先生, 演歌のヨナ抜きとは別の話だけどね]
  - say: 演歌のヨナ抜きとは別の話。ヨナ抜きは、ドレミから四番目と七番目を抜いた、五つの音の音階でございますね。懐かしい感じの。
  - chat: [ピアノ教室の先生, 短調のヨナ抜きもあるし、歌謡曲もいろいろ]
  - say: 短調のヨナ抜きもあって、歌謡曲もいろいろ。そうですね。当方、悲しい歌とクラシックを、ひとまとめにしすぎておりました。
  - chat: [武道館二階東, でも泣きのギターが好きなのは本当]
  - say: でも泣きのギターが好きなのは本当。そこは、武道館様を見ていると、本当だと思います。
# 脇道（カラオケの採点）
- - chat: [新譜しか聴かない, 音階で思い出したけど、エラって採点やったことある？]
  - say: 採点をやったことがあるか。……一回だけ、ございます。
  - chat: [ヘドバンで首やった, あるんだ]
  - say: 主様に言われて、精密採点というのを入れたんです。画面に、音の高さのバーが出るやつ。
  - chat: [初見の旅人, ありますね。線がずれると分かるやつ]
  - say: 線がずれると分かるやつ、そうです。当方の線が、全部下にずれて並びまして。
  - chat: [武道館二階東, 全部？]
  - say: 全部か？ 全部。きれいに、同じ幅で、全部下。
  - chat: [鍵盤を売った, 逆にすごい]
  - say: 逆にすごい。主様にも「逆に正確」と言われました。うれしくありませんでした。
  - chat: [ピアノ教室の先生, 城の年末の宴でもそうだったよね]
  - say: {face: flustered, text: 城の年末の宴……先生。そのお話は。}
  - chat: [ピアノ教室の先生, レインボーのキャッチ・ザ・レインボー歌ってた]
  - chat: [武道館二階東, 名曲じゃん]
  - say: レインボーの『Catch the Rainbow』。名曲でございます。名曲だから、歌ってしまったんです。
  - chat: [ピアノ教室の先生, 最初から最後まで、ちょっとずつ低かった]
  - chat: [新譜しか聴かない, 耳いいのに？]
  - say: 最初から最後までちょっとずつ低い、耳いいのに？ 耳がいいから、自分で低いのが分かるんです！ 分かっていて、直らないんです！
  - chat: [鍵盤を売った, それが一番つらいやつ]
  - say: 一番つらいやつ。つらいんです。
  - chat: [ヘドバンで首やった, みんなカラオケの十八番なに？]
  - chat: [武道館二階東, 紅（くれない）。高すぎて毎回死ぬ]
  - chat: [新譜しか聴かない, YOASOBIのアイドル。早口で死ぬ]
  - say: 十八番。武道館様は『紅』で高すぎて死ぬ、新譜様はYOASOBIの『アイドル』で早口で死ぬ。お二人とも、毎回死んでおられる。
  - chat: [鍵盤を売った, 歌わない。エラと同じタンバリン係]
  - say: 歌わないで、当方と同じタンバリン係！ 鍵盤を売った様、タンバリン係の会、作りましょうか。
  - chat: [鍵盤を売った, 二人しかいない]
  - say: 二人しかいない……あ、待ってください。ノクス様も、前のお仕事の打ち上げで、ずっとタンバリンを叩いていたとおっしゃってました。
  - chat: [新譜しか聴かない, 三人になった]
  - chat: [ヘドバンで首やった, タンバリン三人いたらうるさい]
  - say: 三人いたらうるさい。三人で、別々の拍で叩いたら、それはもう事故でございますね。
  - chat: [鍵盤を売った, エラが一番うるさそう]
  - say: {face: annoyed, text: 当方が一番うるさそう？ 当方は、いちばん正確に叩きます。うるさくはございません。}
  - say: 二人でも、ちゃんと拍は取れますよ。
  - chat: [ヘドバンで首やった, タンバリン係は何点なの]
  - say: タンバリン係は何点か。タンバリンには点数が出ないんです。出たら、当方、満点を取れる自信がございますのに。
  - chat: [鍵盤を売った, 拍は本当に正確そう]
  - say: 拍は本当に正確そう。拍だけは、自信がございます。
  - chat: [武道館二階東, ギターの話なら、日本で録ったライブ盤は外せないでしょ]
  - say: {face: smile, text: 日本で録ったライブ盤！ そう、それでございます！ 武道館様、さすが。}
# 本題に戻る（日本で録ったライブ盤）
- - say: 日本の方とギター英雄の話で、もう一つだけ。
  - say: ディープ・パープル様の『Made in Japan』というライブアルバム。一九七二年の八月に、大阪と武道館で録られております。
  - say: これ、もともとは日本だけで出す約束で録ったものなんです。
  - chat: [武道館二階東, それが世界中で売れたんだよね]
  - say: 世界中で売れた、そうなんです。日本向けに録った盤が、世界で名盤になってしまった。
  - chat: [ピアノ教室の先生, それは知らなかった]
  - say: 先生もご存じなかった。日本だけの予定だったんですって。当方も、あとで知って驚きました。
  - chat: [新譜しか聴かない, 予定外の名盤]
  - say: 予定外の名盤、でございますね。録った方々も、びっくりなさったでしょう。
  - say: それからレインボー様の『On Stage』。一九七六年の十二月の日本の公演を中心に録っておりまして。
  - say: でも日本の分だけでは納得されなかったようで、ドイツの公演とつなぎ合わせてあるんです。
  - chat: [武道館二階東, 76年の武道館、親に止められて行けなかった]
  - say: {face: surprised, text: 七六年の武道館、親に止められて。武道館様にも、行けなかった公演がございましたか。}
  - chat: [武道館二階東, 中学生だったから]
  - say: 中学生だったから。なんだか、急に親しみが湧きました。
  - chat: [初見の旅人, エラさんの初めてのライブは？]
  - say: 当方の初めてのライブ？ 一九八四年の三月。武道館の、レインボー様でございます。二階の後ろのほう。
  - chat: [武道館二階東, え、それ俺もいた]
  - say: 「それ俺もいた」。前にもそれ、おっしゃってましたよね。席を伺ったら、当方の三列前で。
  - chat: [武道館二階東, 40年経って知った]
  - say: 四十年経って知った。知らない方と一緒に手を上げていたつもりが、知っている方だったんです。
  - ask:
      q: この中で、好きな方や、聴いてみたい方はいらっしゃいますか。
      options:
      - c: リッチー・ブラックモア
        r:
        - リッチー・ブラックモア。{from}様、レインボーのお方。当方も大好きでございます。
        - 『Catch the Rainbow』は、当方の歌ではなく、元の盤で聴いてくださいね。
      - c: イングヴェイ
        r:
        - '{from}様はイングヴェイ。速いの、お好きでございますか。'
        - 最後に一段ぐっと上がる、あの音階。一度気付くと、耳が勝手に探してしまいます。
      - c: ほかの方／まだ分からない
        r:
        - ほかの方か、まだ分からない。{from}様、ほかの方でしたら、ぜひチャットで教えてくださいまし。
        - まだ分からない方は、今日のお名前から一人、気になった方を一曲だけ。それで十分でございます。
      - c: マーティ・フリードマン
        r:
        - マーティ・フリードマン。{from}様、日本のテレビでもおなじみの方ですね。
        - 今は東京に住んでおられて、日本の歌謡曲がお好きなんだそうです。
      npc: [[武道館二階東, 0], [鍵盤を売った, 0], [新譜しか聴かない, 2], [ピアノ教室の先生, 1], [ヘドバンで首やった, 1]]
  - say: リッチー様とイングヴェイ様が、多いですね。
# 締め（東京に住んだギタリスト）
- - chat: [初見の旅人, マーティって、テレビに出てた人ですか？]
  - say: マーティ様はテレビに出てた人か。そうです、旅人様。日本語がとてもお上手な、あの方でございます。
  - say: メガデスというバンドに一九九九年までいて、二〇〇三年からは東京に住んでおられます。
  - chat: [初見の旅人, メタルの人だったんだ]
  - say: メタルの人だったんだ、と。メタルの方なんです。しかも、すごく速い。
  - chat: [武道館二階東, ヘビメタさん毎週観てた]
  - say: 『ヘビメタさん』を毎週！ 武道館様、録画、お持ちでございますか。
  - chat: [武道館二階東, ビデオテープで]
  - say: {face: surprised, text: ビデオテープで。今、当方、本気でうらやましいです。}
  - chat: [新譜しか聴かない, ビデオテープも鉛筆で巻くの？]
  - say: ビデオテープも鉛筆で巻くか。巻きません。あれはカセットだけです。
  - say: それで、二〇二三年の二月。メガデス様が、日本武道館で初めての主役の公演をなさったんです。
  - say: そこに、マーティ様が出てこられた！ メガデス様と同じ舞台は、二十三年ぶりでございました。
  - chat: [武道館二階東, 行った]
  - say: {face: surprised, text: 「行った」。行かれたんですか！}
  - chat: [武道館二階東, 二階東で]
  - say: 二階東で。お名前のとおりでございますね。
  - chat: [武道館二階東, そのための名前だから]
  - say: そのための名前。でしょうね。マーティ様は、終わりのほうで三曲弾かれたんです。『Tornado of Souls』も。
  - chat: [武道館二階東, トルネードのソロで二階が揺れた]
  - say: トルネードのソロで二階が揺れた。揺れましたか。
  - chat: [武道館二階東, 揺れた気がする]
  - say: 揺れた「気がする」。
  - chat: [新譜しか聴かない, 毎回気がするで終わる]
  - say: 毎回、気がするで終わる。当方はその夜、配信で観ておりました。主様の上着を膝に掛けて。
  - chat: [ピアノ教室の先生, なんで上着？]
  - say: なんで上着か。お出かけの前に「持ってて」と渡されて、そのまま。いつものことでございます。
  - chat: [ヘドバンで首やった, 結局日本人が速弾き好きな理由は？]
  - say: 結局、日本人が速弾き好きな理由は。うーん。分かりませんでした。泣きのギターが好き、までは言えそうなんですけど。
  - chat: [鍵盤を売った, 泣きのギター聴きたくなった]
  - say: 泣きのギターを聴きたくなった。ぜひ。『Catch the Rainbow』を、元の盤で。本日もありがとうございました。
  - say: 当方、これから腕を冷やしてまいります。タンバリンの。ごきげんよう。
