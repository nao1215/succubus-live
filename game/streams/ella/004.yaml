title: ラウドネスからBABYMETALまで、日本のメタルがアメリカで売れた話
parts:
# 始まり（初見の方と、去年の失言）
- - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - chat: [新譜しか聴かない, 老害の時間だ]
  - say: 「老害の時間だ」。新譜様、ごきげんよう。本日もお若くていらっしゃいますこと。
  - chat: [新譜しか聴かない, ありがとうございます老害]
  - chat: [武道館二階東, エラちゃんこんにちは]
  - say: 「ありがとうございます老害」……で、武道館様は今日もエラちゃん。……もう、様のことは言いません。疲れました。
  - chat: [武道館二階東, 勝った]
  - chat: [ヘドバンで首やった, ついに諦めた]
  - chat: [海外から見てる, hello from Ohio! japanese metal is the best]
  - say: {face: surprised, text: ハロー、フロム、オハイオ。まあ、オハイオから！ 日本のメタルがいちばん、と。ようこそいらっしゃいました。}
  - chat: [海外から見てる, i love BABYMETAL]
  - say: BABYMETALがお好き。いいですね。今日、ちょうどその辺りのお話をしようと思っていたんです。
  - chat: [新譜しか聴かない, その前に、スリープ・トークンは分かった？]
  - say: 「スリープ・トークンは分かった？」。来ましたね。
  - chat: [ピアノ教室の先生, 何の話？]
  - chat: [新譜しか聴かない, 去年エラが「分からない」って言ったバンド。そのあと全米1位になった]
  - say: 先生、何の話かと申しますと。二〇二五年の五月でございます。『Even in Arcadia』というアルバムで、アメリカで一位。
  - say: 当方、その少し前に、配信で「分かりません」と申しまして。
  - chat: [新譜しか聴かない, 毎回言う]
  - say: 毎回言う、と。毎回言われております。それで、ちゃんと一晩聴きました。
  - chat: [新譜しか聴かない, で？]
  - say: で？ と。正直に申し上げます。……少し、好きになりました。
  - chat: [新譜しか聴かない, よっしゃ]
  - chat: [ヘドバンで首やった, 老害陥落]
  - say: {face: flustered, text: 老害陥落。陥落いたしました。くやしいです。}
  - chat: [新譜しか聴かない, どこが好きになったの]
  - say: どこが好きか。静かな所から、急に重たくなる所でございます。そこの落差が、思っていたよりずっとよくて。
  - chat: [新譜しか聴かない, そこが一番いいとこだから]
  - say: そこが一番いいとこ。最初に聴いたときは、静かな所で止めてしまっていたんです。もったいないことをしました。
  - chat: [ピアノ教室の先生, 最後まで聴かないで分からないって言ってたの？]
  - say: {face: shy, text: 最後まで聴かずに分からないと……はい。そういうことになります。}
  - chat: [武道館二階東, それはエラちゃんが悪い]
  - say: 当方が悪い。悪うございました。
# 本題（一九八五年の七十四位）
- - say: で、本日は日本のメタルのお話でございます。
  - chat: [武道館二階東, ジャパメタ！]
  - say: ジャパメタ、でございます。一九八五年。ラウドネス様の『Thunder in the East』というアルバムが、アメリカで売れたんです。
  - say: ビルボードという、アメリカのアルバムの順位表で、七十四位。
  - chat: [初見の旅人, 74位ってすごいんですか？]
  - say: 七十四位ってすごいのか。すごいんですよ。日本のメタルのバンドが、アメリカの順位表に名前を載せたんですから。
  - chat: [武道館二階東, 当時はみんな雑誌の順位見て大騒ぎした]
  - say: 雑誌の順位を見て大騒ぎ。一九八四年に、BURRN!という雑誌ができておりますもんね。日本で初めての、メタルの専門誌。
  - chat: [武道館二階東, 創刊号持ってる]
  - say: {face: surprised, text: 創刊号を持ってる！ 本当でございますか。}
  - chat: [武道館二階東, 実家の押し入れにある]
  - say: 実家の押し入れに。見たい。今すぐ見たいです。今度、写真を送ってくださいまし。
  - chat: [新譜しか聴かない, 尻尾揺れてる]
  - say: 尻尾揺れてる？ 揺れていてもいいんです、今のは。
  - chat: [鍵盤を売った, ラウドネスのドラムの樋口さん、亡くなってもう結構経つよね]
  - say: 樋口宗孝様。亡くなられたのは二〇〇八年でございます。四十九歳で。
  - chat: [武道館二階東, 最後のアルバムに生前のドラムが使われたんだよね]
  - say: 最後のアルバムに生前のドラム。そうなんです。『The Everlasting』。生前に録っておられたドラムで、一枚できております。
  - say: 当方、あのアルバムは、ドラムの音ばかり追いかけて聴いてしまいます。
  - chat: [鍵盤を売った, わかる]
  - say: 分かってくださいますか。あのアルバムの話をすると、当方いつも黙ってしまうんです。
# 脇道（初めて買ったCD）
- - chat: [ヘドバンで首やった, みんな初めて買ったCDって何？]
  - say: 初めて買ったCD。あ、それ、聞きたいです。皆様、何でした？
  - chat: [新譜しか聴かない, CD買ったことない。最初からサブスク]
  - say: {face: surprised, text: CDを一枚も買ったことがなくて、最初からサブスク！ そういう時代なんですね。}
  - chat: [ピアノ教室の先生, ショパンのノクターン集。親に買ってもらった]
  - say: ショパンのノクターン集。先生らしい。それは、誰の演奏の？
  - chat: [ピアノ教室の先生, 覚えてない。ジャケットが青かった]
  - say: 覚えてないけどジャケットが青かった。色で覚えてるの、すごく分かります。
  - chat: [初見の旅人, エラさんは？]
  - say: 当方は何か、ですか。当方はですね……。
  - say: あ。
  - chat: [武道館二階東, まさか]
  - say: そのまさかです。ラウドネス様の『Thunder in the East』でございます。CDという円盤を、初めて買ったのが、それで。
  - chat: [ヘドバンで首やった, 話が戻ってきたｗ]
  - say: 話が戻ってきた。戻ってきてしまいました。狙っていないんですよ、本当に。
  - chat: [鍵盤を売った, 自分はレコードだった。親のプレーヤーで]
  - say: 親御さんのプレーヤーでレコード！ 何をお掛けになったんです？
  - chat: [鍵盤を売った, YMO。針落とすの怖かった]
  - say: YMO。針を落とすの、怖い。分かります。最初の一回、手が震えますよね。
  - chat: [鍵盤を売った, 震えて二曲目から始まった]
  - say: {face: laugh, text: 震えて二曲目から！ それはそれで、思い出になりますね。}
  - chat: [武道館二階東, 俺はアイアン・メイデンの『魔力の刻印』。友達の兄貴に勧められて]
  - say: {face: surprised, text: アイアン・メイデンの『魔力の刻印』。最初の一枚で、それ。友達のお兄様、ありがとうございます。}
  - chat: [初見の旅人, 自分はアニメの主題歌のシングルでした]
  - say: アニメの主題歌のシングル、いいですね。当方の主様も、最初はゲームの曲だったそうです。
  - ask:
      q: 皆様が初めて買ったCDやレコード、どんなものでございましたか。
      options:
      - c: 洋楽
        r:
        - 洋楽。{from}様、洋楽から。何のアルバムか、チャットで教えてくださいまし。
        - 最初の一枚が洋楽の方は、だいたい、そのまま沼に落ちておられます。
      - c: J-POP・邦楽
        r:
        - '{from}様は、J-POP、邦楽。シングルでしたか？ あの細長いCD、懐かしいですね。'
        - 当方、あの細長いの、今でも何枚か取ってあります。
      - c: アニメやゲームの曲
        r:
        - アニメやゲームの曲。{from}様、主様と同じでございます！
        - ゲームの曲から入った方、当方はちょっとうらやましいんです。
      - c: 買ったことがない
        r:
        - 買ったことがない。{from}様、新譜様とお仲間ですね。
        - いつか一枚、手に取ってみてくださいまし。重さが、けっこういいんですよ。
      npc: [[武道館二階東, 0], [新譜しか聴かない, 3], [鍵盤を売った, 1], [ヘドバンで首やった, 2], [海外から見てる, 2]]
  - chat: [海外から見てる, my first CD was Pokemon soundtrack]
  - say: アニメやゲームの曲の方、多いですね。オハイオ様は、ポケモンのサントラ！ すてきです。あ、日本語で失礼いたしました。
  - chat: [海外から見てる, its ok i use translate]
  - say: 大丈夫、翻訳で読んでる。ありがとうございます。当方の敬語、ちゃんと訳されておりますか。
  - chat: [新譜しか聴かない, 絶対変な英語になってる]
  - say: 絶対変な英語になってる。なっていそうですね。「当方」が、どう訳されているのか気になります。
  - chat: [海外から見てる, it says "this side"]
  - say: {face: laugh, text: 「ディス・サイド」。こちら側！ ちょっと合っております。}
  - chat: [ピアノ教室の先生, で、ラウドネスの話の続きは？]
  - say: ラウドネスの続き、そうでした。えっと、どこまで話しましたっけ。
  - chat: [武道館二階東, 74位と創刊号]
  - say: 七十四位と創刊号。ありがとうございます。創刊号の写真、忘れないでくださいね。
# 本題に戻る（作った人と、ジャパメタという言葉）
- - say: ここからは、少しオタクの話でございます。
  - say: その『Thunder in the East』を作ったのが、マックス・ノーマン様というイギリスの方で。
  - chat: [ピアノ教室の先生, 誰？]
  - say: 誰？ 先生、ここ、当方がいちばん言いたかった所なんです！
  - say: オジー様の最初のソロアルバム『Blizzard of Ozz』を、途中から引き継いで録った方なんですよ。
  - chat: [武道館二階東, そうなの？]
  - say: そうなんです。最初の方とうまくいかなくて、ノーマン様が引き継いだ。録音の係としてはお名前があるんですけど、作った人としては載っていないんです。
  - say: しかも、そのあとメガデス様の『Rust in Peace』の仕上げも、この方なんです。
  - chat: [新譜しか聴かない, あ、メガデスも出てくるんだ]
  - say: メガデスも出てくるんです！ 当方の好きなアルバムに、同じ方が何度も出てくる。気付いた夜は、うれしくて眠れませんでした。
  - chat: [ヘドバンで首やった, 好きな人が裏方にいがち]
  - say: 好きな人が裏方にいがち。いがちなんです！
  - say: それで。当方、一つ迷っていることがございまして。
  - say: 「ジャパメタ」って言葉。言っていいのか、毎回迷うんです。
  - chat: [新譜しか聴かない, なんで？普通に言うでしょ]
  - chat: [武道館二階東, 俺らは誇りで言ってたよ]
  - say: 普通に言う、誇りで言ってた。武道館様の世代は、そうなんですよね。
  - say: ただ当方、当時、言われた側のバンドの方々がどう思っていたのか、確かめられていなくて。
  - chat: [武道館二階東, 人によるんじゃない？ 俺の周りは誇りだった気はする]
  - say: 誇りだった「気はする」。
  - chat: [武道館二階東, 40年前の飲み会の記憶だから]
  - say: 四十年前の飲み会の記憶。それは当方もかなり怪しいので、何も言えません。
  - chat: [新譜しか聴かない, 今の若い人は普通に言うよ]
  - say: 若い方は普通に言えて、武道館様は誇りで言える。当方だけ、口ごもってしまうんです。
  - chat: [ピアノ教室の先生, 気にしすぎでは]
  - say: 先生の言う通り、気にしすぎかもしれません。なので、今日も決めません。迷ったままにしておきます。
# 締め（四十年で九位）
- - chat: [海外から見てる, BABYMETAL top 10 in US!]
  - say: BABYMETAL、アメリカでトップテン！ そうなんです！ 二〇二五年の『Metal Forth』。ビルボードで九位。
  - chat: [新譜しか聴かない, 日本人だけのグループで初の10位以内]
  - say: 日本人だけのグループで初の十位以内。新譜様、よくご存じで。当方の言うことがなくなってしまいました。
  - chat: [新譜しか聴かない, 言わせない]
  - chat: [新譜しか聴かない, その前にウェンブリーもやってるしね]
  - say: 言わせない、と。ウェンブリーは二〇一六年の四月でございますね。ロンドンのウェンブリー・アリーナで、日本の歌い手として初めての、主役の公演。
  - chat: [海外から見てる, I watched that on youtube]
  - say: それをYouTubeで観た！ 当方もでございます。
  - chat: [新譜しか聴かない, エラ、BABYMETALは好きなの？]
  - say: BABYMETALは好きか。好きでございます。最初は、アイドルとメタルが混ざるなんて、と思っていたんですけど。
  - say: 演奏している方々の腕が、とにかくすごくて。すぐに降参しました。
  - chat: [新譜しか聴かない, また降参してる]
  - say: また降参してる。今日は、二回目でございますね。
  - chat: [武道館二階東, 74位から40年で9位か]
  - say: 「七十四位から四十年で九位か」……ほんとうですね。七十四位から、四十年かけて九位。
  - say: 当方、今ちょっと、ぐっときてしまいました。
  - chat: [鍵盤を売った, 九位まで行ったの、びっくりした]
  - say: 九位はびっくり、当方もでございます。順位が出た朝、二回見直しました。
  - chat: [海外から見てる, "what was your first CD again?"]
  - say: 当方の最初のCDは何だったか。Loudness! Thunder in the East! ……伝わりました？
  - chat: [海外から見てる, i will listen!]
  - say: {face: smile, text: 聴いてくださる！ うれしい！ ぜひ一曲目から聴いてくださいまし。}
  - say: それでは皆様、本日もありがとうございました。
  - say: 武道館二階東様、創刊号の写真、本当にお待ちしておりますからね。
  - chat: [武道館二階東, 押し入れ開けるの怖い]
  - say: {face: laugh, text: 押し入れを開けるのが怖い。一緒に怖がりますから。ごきげんよう。}
