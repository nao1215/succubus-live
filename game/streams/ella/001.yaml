title: 中古屋で、昔クビになったバンドのカセットが三百円で売られていた
parts:
# 始まり（ルマンドの粉）
- - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: あ、もう映っておりますね。少々お待ちくださいまし、口の周りを。
  - chat: [ヘドバンで首やった, 何食べてたの]
  - say: 何を食べていたか？ ルマンドでございます。始まる前に一本だけ、と思いまして。
  - chat: [新譜しか聴かない, 粉ついてる]
  - say: {face: surprised, text: 粉ついてる？ え、どこに。どこでございますか。}
  - chat: [新譜しか聴かない, うそ]
  - say: 「うそ」って。新譜様、始まって一分で、それでございますか。
  - chat: [武道館二階東, エラちゃんこんにちは]
  - say: 「エラちゃん、こんにちは」。武道館様、ごきげんよう。ちゃんではなく、様をお付けくださいまし。
  - chat: [武道館二階東, エラちゃん様]
  - say: 「エラちゃん様」。そこではございませんのよ、もう。
  - chat: [初見の旅人, 初見です。ルマンド好きなんですか？]
  - say: 初見の旅人様、いらっしゃいませ。ルマンドが好きか？ 好きでございます！ 紅茶に、いちばん合うので。
  - say: ただ、あれ、食べるとき音がいたしますでしょう。さくさくっと。
  - chat: [初見の旅人, しますね]
  - say: しますよね。ですので、配信中に音を立てないように、練習しているのでございます。
  - chat: [ヘドバンで首やった, 練習するもんなの]
  - say: 練習するもんなのか、と。いたしますとも。今のところ、全敗でございます。
  - chat: [ピアノ教室の先生, ノクスさんもルマンド派だよね]
  - say: 先生、よくご存じで。ノクス様もルマンド派でございます。粉がキーボードに入るのに、やめられないと。
  - say: 当方は紅茶にこぼして、ノクス様はキーボードにこぼす。お互い、苦労しております。
  - chat: [新譜しか聴かない, ルマンドやめればいいのに]
  - say: {face: laugh, text: やめればいい、とおっしゃいますけど。やめられたら苦労しておりません。}
# 本題（中古盤屋の三百円の箱）
- - say: で、本日はですね。先週の話をさせてくださいまし。ちょっと、恥ずかしい話なのですけれど。
  - chat: [鍵盤を売った, こんにちは。恥ずかしい話？]
  - say: 鍵盤を売った様、ごきげんよう。恥ずかしい話かって？ ええ、ちょうどいいところに。
  - say: 当方、城下の中古盤屋に、週に二回通っておりまして。
  - chat: [武道館二階東, 多い]
  - say: 週に二回は多い？ 多くはございません。新しい入荷が、火曜と金曜でございますので。
  - say: 店主の方とはもう長くて、当方が入ると、黙ってメタルの棚を指さしてくださるんです。
  - chat: [ヘドバンで首やった, 会話いらないやつ]
  - say: そう、会話いらないのでございます。この前なんか、指さしたあとに首を横に振られまして。
  - chat: [初見の旅人, それは？]
  - say: それは何か、と申しますと。「今日は何もない」という意味でございました。
  - chat: [ピアノ教室の先生, 通じてるの面白い]
  - say: 通じるんですよ、これが。で、その日。レジの横に、カセットの箱がございました。一本三百円。
  - chat: [新譜しか聴かない, カセットってまだ売ってるんだ]
  - say: カセット、まだ売っておりますよ。新譜様は、触ったことございますか。
  - chat: [新譜しか聴かない, 鉛筆で巻くやつでしょ]
  - say: {face: surprised, text: 鉛筆で巻くやつ！ ご存じでした。どこで覚えたんですか。}
  - chat: [新譜しか聴かない, 動画]
  - say: 動画で。そうでございますか。
  - say: それで、箱をめくっておりましたら、見覚えのある字がございまして。
  - say: 当方が昔いたバンドの、自分たちで作ったカセットでございました。
  - chat: [武道館二階東, え]
  - chat: [初見の旅人, バンドやってたんですか]
  - chat: [ヘドバンで首やった, 初耳なんだけど]
  - say: 初耳でございますよね。八〇年代の終わりでございます。城下のメタルのバンドで、鍵盤を弾いておりました。
  - chat: [鍵盤を売った, 鍵盤！]
  - say: そう、鍵盤でございます。鍵盤を売った様と同じ持ち場でございますね。
  - chat: [新譜しか聴かない, バンド名は]
  - say: バンド名、言わなきゃだめでございますか。
  - chat: [新譜しか聴かない, だめ]
  - say: だめ、と。……「月下晩餐会」と申しました。
  - chat: [ヘドバンで首やった, ｗｗｗ]
  - chat: [新譜しか聴かない, 名前がもうメタル]
  - say: {face: annoyed, text: 「名前がもうメタル」って、笑わないでくださいまし。当時は、それが格好よかったんです。}
  - chat: [武道館二階東, 80年代はそういう名前ほんとに多かった]
  - say: 八〇年代、そういう名前ばかりでしたよね！ 武道館様、ありがとうございます。
  - say: で、そのカセット。表に、メンバーの写真が載っておりまして。
  - say: 写っているのが、四人。
  - chat: [ピアノ教室の先生, 何人のバンド？]
  - say: 何人のバンドか？ 五人でございます。
  - chat: [鍵盤を売った, あっ]
  - chat: [ヘドバンで首やった, まさか]
  - say: そのまさかで。当方の所だけ、はさみで切ってございました。
  - chat: [新譜しか聴かない, ひどすぎて笑う]
  - chat: [初見の旅人, なんでですか]
  - say: なんで、と申しますと。当方、そのバンドを、クビになっておりますので。
  - chat: [武道館二階東, えええ]
  - say: ある朝、練習に行きましたら、馬車の切符を一枚渡されまして。
  - chat: [ヘドバンで首やった, 片道？]
  - say: 片道でございました。往復なら、まだ話し合う気があると思えたんですけれど。
  - chat: [新譜しか聴かない, 理由は]
  - say: 理由は、「ソロが長い」と。
  - chat: [ピアノ教室の先生, 何小節弾いたの]
  - say: 何小節弾いたか。……三十二小節。
  - chat: [ピアノ教室の先生, 長い]
  - say: 長くございません！ 気持ちが乗ると、三十二小節なんてすぐでございます！
  - chat: [鍵盤を売った, 弾いてる側はそうなんだよね]
  - say: 弾いてる側はそう、ですよね？ 鍵盤を売った様は分かってくださる。
# 脇道（文化祭のソロ）
- - chat: [ヘドバンで首やった, ソロ長いって言われたの初めて？]
  - say: 言われたのは初めてか？ いえ、それが。二回目なのでございます。
  - chat: [武道館二階東, 一回目あるのかよ]
  - say: 一回目、あるんですのよ。学生の頃の文化祭で。有志のバンドで鍵盤を弾きまして。
  - say: ソロの所で楽しくなってしまって、予定の三倍弾いたんです。
  - chat: [新譜しか聴かない, 三倍]
  - say: 終わったあと、ギターの子に「ソロが長い」と。人生で一回目でございます。
  - chat: [ピアノ教室の先生, 全然学んでない]
  - say: {face: shy, text: 学んでおりません。今思えば、そうでございますね。}
  - chat: [初見の旅人, 文化祭のバンドって何やったんですか]
  - say: 何をやったか、でございますね。ディープ・パープルの『Highway Star』を。鍵盤のソロがある曲なので、当方が選びまして。
  - chat: [鍵盤を売った, 自分で選んで自分で長くしたのか]
  - say: 自分で選んで自分で長くした。そうなんです！ 選んだ時点で、もう長く弾く気でございました。
  - chat: [ヘドバンで首やった, 確信犯]
  - chat: [武道館二階東, みんなの文化祭どうだった？俺は軽音で照明係]
  - chat: [新譜しか聴かない, 文化祭とか出たことない]
  - say: 武道館様は照明係、新譜様は出たことがない。それはそれで、気楽でようございますね。
  - chat: [初見の旅人, 自分はクラスでお化け屋敷でした]
  - say: お化け屋敷！ 音は、どうなさいました？ 効果音は。
  - chat: [初見の旅人, ラジカセで流してました]
  - say: {face: smile, text: ラジカセ！ 当方、そういうの大好きでございます。}
  - say: あの、ちょっと割れた音で鳴る悲鳴、ありますでしょう。あれが一番怖いんですよ。
  - chat: [ピアノ教室の先生, 先生的にはソロ三倍は止めたい]
  - say: {face: flustered, text: 三倍は止めたい？ 先生、そこは止めないでくださいまし。}
  - say: でも、そうなんです。文化祭でも長く弾いて、バンドでも同じことをいたしました。
  - chat: [鍵盤を売った, 二回やったらもう芸風]
  - say: 芸風と呼んでいただけると、少し救われます。
# 本題に戻る（二つ目の理由と、買って帰った）
- - say: で、クビの理由。実はもう一つございまして。
  - say: 「ギターのチューニングを、毎回直す」と。
  - chat: [新譜しか聴かない, それはエラが悪いでしょ]
  - say: 当方が悪い？ だって、ずれていたんです！ ギター担当のギル様の、三本目の弦が、毎回ちょっとだけ。
  - chat: [初見の旅人, チューニングって？]
  - say: チューニングと申しますのは、弦の音の高さを、決まった高さに合わせることでございます。楽器の準備運動みたいなものです。
  - chat: [初見の旅人, ずれてたら直したくなりますね]
  - say: 直したくなりますよね！ 旅人様は当方の味方でございます。
  - chat: [ピアノ教室の先生, でも人の楽器を毎回勝手に直すのはね]
  - say: ……勝手に、というのは、まあ、勝手にでございましたけれど。
  - chat: [武道館二階東, 勝手にやってた]
  - say: ギル様とは、それ以来、口をきいておりません。
  - say: それで、そのカセットでございます。三百円で、買って帰りました。
  - chat: [ヘドバンで首やった, 買ったんかい]
  - say: 買いますよ。自分の切られた写真、置いて帰れます？
  - chat: [鍵盤を売った, 自分なら置いて帰る]
  - chat: [新譜しか聴かない, 自分は買って家で笑う]
  - say: 置いて帰る方と、買って笑う方。当方はですね、正直、腹が立って、でも気になって。
  - say: 店主の方には何も言わずにお会計しました。三百円、ちょうど。
  - chat: [武道館二階東, 店主は知ってるの？エラがメンバーだったって]
  - say: 店主の方が知っているか？ 知らないはずでございます。……知らないと思いたいです。
  - ask:
      q: 皆様、バンドを組んだことはございますか。
      options:
      - c: ある。揉めて解散した
        r:
        - 揉めて解散。{from}様、お仲間でございます。何で揉めました？ よろしければ、一言で。
        - 当方のところは、ソロの長さとチューニングでございました。
      - c: ある。今も続いてる
        r:
        - 今も続いている！ {from}様、すごい。うらやましいです。
        - 次のライブ、どこかで教えてくださいまし。当方、こっそり行きたいです。
      - c: ない。聴く専門
        r:
        - '{from}様は聴く専門。聴いてくださる方がいないと、こちらは困ってしまいますので。'
        - それに、聴く専門の方はクビになりませんしね。
      npc: [[鍵盤を売った, 0], [武道館二階東, 2], [ヘドバンで首やった, 2], [ピアノ教室の先生, 2], [新譜しか聴かない, 1]]
  - chat: [鍵盤を売った, 自分も揉めた。お金で]
  - say: 聴く専門の方が多いですね。で、鍵盤様はお金で揉めた。それは、あとまで気まずいやつでございますね。
  - chat: [鍵盤を売った, それで鍵盤も売った。家賃で]
  - say: {face: sad, text: 家賃で、鍵盤を。そうでございましたか。}
  - say: 今は、何か弾いておられます？
  - chat: [鍵盤を売った, 電子ピアノ買った。小さいやつ]
  - say: {face: smile, text: 小さい電子ピアノ！ よかった。小さくても、鍵盤は鍵盤でございます。}
  - chat: [鍵盤を売った, ヘッドホンで夜に弾いてる]
  - say: 夜にヘッドホンで。いいですよね。ソロも長く弾けますし。
  - chat: [新譜しか聴かない, 長く弾く話に戻すな]
  - say: 戻すな、って。戻しておりません。ルマンド、もう一本いただきます。さくっ。音、入りましたね。
# 締め（届いた手紙）
- - say: それで、実は続きがございまして。
  - say: 九月に、手紙が届いたんです。月下晩餐会から。
  - chat: [武道館二階東, え、今さら？]
  - say: 今さらなんです。四十周年で、一晩だけ集まって演奏するから、当方にも来てほしい、と。
  - chat: [新譜しか聴かない, 再結成じゃん！]
  - chat: [鍵盤を売った, 行くの？]
  - say: 再結成。行くのか？ ……返事は、まだしておりません。
  - chat: [ヘドバンで首やった, 九月って一か月以上前]
  - say: 一か月以上前でございますね。はい。放っております。
  - chat: [ピアノ教室の先生, なんで]
  - say: なんでって。写真を切った方々でございますよ？ どんな顔で行けばいいのか、分からなくて。
  - chat: [鍵盤を売った, でも呼ばれたんでしょ]
  - say: そう、呼ばれました。……そこが、困るところなんです。
  - chat: [武道館二階東, とりあえずカセット聴いてみたら？]
  - say: まずカセットを聴いてみる。そうですね。城に一台だけ、カセットの機械がございますので。厨房の棚の奥に。
  - chat: [初見の旅人, 厨房に？]
  - say: そう、厨房に。料理長が昔、演歌を聴いていた機械でございます。今夜、こっそり借りてまいります。
  - chat: [新譜しか聴かない, エラの鍵盤入ってるか確認して]
  - say: 当方の鍵盤が入っているか。入っていたら、次の配信でお話しいたします。入っていなかったら……それも、お話しいたします。
  - chat: [ヘドバンで首やった, どっちにしろ話すんだ]
  - say: {face: smug, text: どっちにしろ話す。もちろんでございます。こんな話、一人で抱えていられません。}
  - chat: [初見の旅人, 楽しかったです。また来ます]
  - say: 旅人様、ありがとうございます。お化け屋敷の話、また聞かせてくださいまし。
  - say: それでは皆様、本日もありがとうございました。
  - say: 当方、残りのルマンドをいただいてまいります。音を立てずに。
  - chat: [新譜しか聴かない, 無理でしょ]
  - say: {face: laugh, text: 無理でしょ、と。無理でございますね。ごきげんよう。}
