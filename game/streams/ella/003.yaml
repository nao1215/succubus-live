title: オジー・オズボーンの最後のライブを、家で一人で観て泣いた
parts:
# 始まり（お風呂上がり）
- - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: すみません、髪がまだ少し濡れておりまして。お風呂から上がったばかりなんです。
  - chat: [ヘドバンで首やった, 湯上がりエラ]
  - say: 「湯上がりエラ」。そういう言い方はおやめくださいまし。
  - chat: [新譜しか聴かない, 何度のお湯に入るの]
  - say: 何度のお湯か。四十二度でございます。
  - chat: [新譜しか聴かない, あつっ]
  - chat: [武道館二階東, 江戸っ子か]
  - say: 熱い、江戸っ子か、と。熱いほうが、頭がしゃっきりするんです。
  - chat: [ピアノ教室の先生, 何分入ってるの]
  - say: 何分入るか？ 三十分くらいでございます。レコードの片面が、だいたいそのくらいなので。
  - say: 脱衣所でかけて、片面が終わったら上がる。
  - chat: [初見の旅人, レコードがタイマーなんですね]
  - say: レコードがタイマー、そうなんです。針が最後まで行くと、ぷつ、ぷつって鳴るので、それが合図です。
  - chat: [鍵盤を売った, 42度で30分はのぼせない？]
  - say: 四十二度で三十分、のぼせないか。のぼせません。……と思っておりますけど、主様には「顔が赤い」と言われます。
  - chat: [ヘドバンで首やった, のぼせてるじゃん]
  - say: のぼせてる……そうかもしれません。
  - chat: [武道館二階東, 他の人は何度なの]
  - say: 他の方は何度か。城の中だと、モーラ様が四十一度。ピム様に「四十二度は熱すぎます」と言われて、一度下げたそうで。
  - say: ピム様は四十度。主様は三十九度。
  - say: ノクス様は三十八度で、熱いと上がってから画面の文字が揺れるとか。
  - chat: [新譜しか聴かない, ノクスぬるすぎ]
  - say: ノクス様、ぬるいですよね。当方、三十八度だと、入っている気がしないんです。
  - chat: [ヘドバンで首やった, ヴェスパは？]
  - say: ヴェスパ様ですか？ シャワーだけで四十三度だそうです。当方より熱い方がおりました。
  - chat: [武道館二階東, ヴェスパの勝ち]
  - say: {face: annoyed, text: ヴェスパ様の勝ち、って。お風呂は勝ち負けではございませんよ。}
  - chat: [鍵盤を売った, 温泉は行く？]
  - say: 温泉、行きます！ 城崎温泉が好きで。外湯が七つあって、お風呂ごとに響き方が違うんです。
  - chat: [初見の旅人, 響き方？]
  - say: 響き方って何か、ですよね。手を一つ叩くと、音の残り方が違うんですよ。長く残るお風呂と、すぐ消えるお風呂。
  - say: それで、七つ回って、手を叩いて比べていたら。
  - say: 三つ目のお湯で、地元の方に「お嬢ちゃん、拍手は湯から上がってから」と言われまして。
  - chat: [ヘドバンで首やった, 怒られてるｗ]
  - chat: [武道館二階東, 温泉で拍手してる人いたら見るわ]
  - say: {face: shy, text: 温泉で拍手してたら見る。そうですよね。残りの四つは、静かに入りました。}
# 本題（抽選に外れた夏）
- - say: それで、お風呂で考えていたんですけど。今日は、去年の夏のお話をしようと思いまして。
  - chat: [武道館二階東, あれか]
  - say: 「あれか」。はい、あれです。二〇二五年の七月五日。イギリスのバーミンガムで、オジー様の最後の公演がございました。
  - chat: [初見の旅人, オジーって、ブラック・サバスの？]
  - say: ブラック・サバスの、そうです、旅人様。サバスの歌い手で、そのあとご自分の名前でもずっと歌ってこられた方です。
  - say: 地元のサッカー場、ヴィラ・パークで。公演の名前は『バック・トゥ・ザ・ビギニング』。
  - chat: [新譜しか聴かない, それは知ってる。配信観た]
  - say: 新譜様、配信観られました？ 当方も配信でございます。
  - chat: [初見の旅人, 現地じゃないんですね]
  - say: 現地じゃないのか……券の抽選に、三回申し込んだんです。
  - chat: [ヘドバンで首やった, 三回とも？]
  - say: 三回とも？ はい、三回とも外れました。
  - chat: [鍵盤を売った, つらい]
  - say: つらいです。三回目の発表を見たときは、もう紅茶を淹れる気力もなくて。白湯を飲んでおりました。
  - chat: [武道館二階東, 白湯ｗ]
  - say: 白湯、笑うところではございません。それで当日は、城の地下の酒蔵で、一人で観たんです。
  - chat: [ピアノ教室の先生, なんで酒蔵？]
  - say: なんで酒蔵か。音がよく響くのと……泣く顔を、主様に見られたくなかったので。
  - chat: [ヘドバンで首やった, 泣く気満々]
  - say: 泣く気満々、でございました。ハンカチを何枚も持って下りました。
  - say: 出演の方々が、とにかく多くて。
  - chat: [新譜しか聴かない, メタリカもスレイヤーも出てた]
  - say: メタリカもスレイヤーも、出ておられました。まとめ役は、トム・モレロ様でございました。
  - chat: [武道館二階東, 一日でフェス何回分って感じ]
  - say: フェス何回分、本当に。当方、途中で紅茶を何回も淹れ直しに上がりました。
  - chat: [鍵盤を売った, あれ、お金も集めてたんだよね]
  - say: お金も集めていた、そうなんです。寄付のための公演でもございました。
  - say: 最初は、ものすごい金額が報じられたんですけど。あとでご家族が、実際はずっと少なかった、とおっしゃって。
  - chat: [初見の旅人, そうなんだ]
  - say: ええ。それでも、出た方は皆様お金を受け取らずに出られたそうです。
  - say: 当方は地下で観ていただけですけど、画面に向かって、ずっと拍手しておりました。
  - say: そして最後に、サバスの四人。
  - say: オジー様、アイオミ様、ギーザー・バトラー様、ビル・ウォード様。
  - say: この四人がそろうのは、二〇〇五年以来だったんです。
  - chat: [鍵盤を売った, ウォードがいたのが大きい]
  - say: ウォード様がいたのが大きい！ 鍵盤を売った様、そこなんです！
  - say: 正直に申しますと、当方、ウォード様のいないサバスは少し苦手でして。
  - chat: [新譜しか聴かない, 言うねえ]
  - say: 「言うねえ」。言います。好きなものは好き、苦手なものは苦手と言わないと、気持ちが悪いので。
  - say: オジー様は、大きな椅子に座って歌われました。
  - chat: [初見の旅人, 座って？]
  - say: 座って、です。もう、立って歌えるお体ではなかったんです。それでも、最後まで歌いきられた。
  - chat: [武道館二階東, あれは泣いた]
  - say: 「あれは泣いた」。泣きますよね。
  - say: サバスの曲は四つ。『ウォー・ピッグス』、『N.I.B.』、『アイアン・マン』。最後が『パラノイド』。
  - chat: [ヘドバンで首やった, お疑いが深くていらっしゃる]
  - say: {face: laugh, text: 「お疑いが深くていらっしゃる」！ 覚えてくださってた！ 首やった様！}
  - chat: [新譜しか聴かない, 泣ける場面でそれやめて]
  - say: 泣ける場面でやめて、と言われても、やめません。当方の中では、もうあの訳でも泣けるようになってしまったので。
# 脇道（好きな数字）
- - chat: [ピアノ教室の先生, 四人そろったの、エラ的にはどうだった]
  - say: 四人そろってどうだったか。ウォード様もいる、と思ったら、もうそれだけで。画面にずっと手を振っておりました。
  - say: 四人が舞台に並んだときは、指で一、二、三、四って数えてしまって。
  - chat: [鍵盤を売った, 数えなくても四人なのに]
  - say: 数えなくても四人。そうなんです。数えなくても分かるのに、数えずにいられなかったんです。
  - chat: [武道館二階東, 分かる。俺も来日のときメンバー数える]
  - say: 来日のときにメンバーを数える。数えますよね！ 全員いるか、確かめたくなります。
  - say: 当方、もともと四がいちばん好きな数字なんです。最初のサバスが四人なので。
  - chat: [ヘドバンで首やった, 重い理由]
  - chat: [新譜しか聴かない, みんな好きな数字ある？ 自分は7]
  - chat: [ピアノ教室の先生, 3。三拍子が好きだから]
  - say: 好きな数字、新譜様は七、先生は三拍子だから三。ワルツでございますね。新譜様は、なぜ七？
  - chat: [新譜しか聴かない, 特に理由ない]
  - say: 特に理由なし。それはそれで、気持ちがいいですね。
  - chat: [ヘドバンで首やった, 自分は69]
  - say: {face: annoyed, text: 首やった様。その数字は、こちらでは読まなかったことにいたします。}
  - chat: [ヘドバンで首やった, なんで分かったの]
  - say: なんで分かったか？ 当方、サキュバスでございますから。そういう数字は、すぐ分かってしまうんです。
  - chat: [鍵盤を売った, 酒蔵でハンカチ握ってたとこの続きは？]
  - say: {face: shy, text: 酒蔵でハンカチの続き。あ、そうでした。ハンカチを握ったところまで。}
# 本題に戻る（酒蔵の扉）
- - say: 『パラノイド』の、最初のギターが鳴った所で。当方、もう、ぼろぼろでございまして。
  - say: そこへ、酒蔵の扉が開いたんです。
  - chat: [武道館二階東, リゼ様か]
  - say: 主様か、と。当たりです。主様が、ワインを取りに下りてこられたんです。
  - chat: [ヘドバンで首やった, 最悪のタイミング]
  - say: 最悪のタイミングでございます。当方、とっさに、樽を数えているふりをいたしました。
  - chat: [新譜しか聴かない, ハンカチ持ったまま？]
  - say: ハンカチ持ったまま？ はい。ハンカチを持ったまま、泣きながら、樽を数えておりました。
  - chat: [ピアノ教室の先生, 無理がある]
  - say: 無理がありますよね。主様は「何個あった？」とだけ聞いて、ワインを一本持って、上がっていかれました。
  - chat: [鍵盤を売った, 優しい]
  - say: {face: shy, text: 優しい、はい。数は、答えられませんでした。}
  - ask:
      q: 皆様は、好きなバンドのライブ。会場に行く派ですか、配信で観る派ですか。
      options:
      - c: 会場。音は体で浴びたい
        r:
        - '{from}様は会場で、音を体で浴びたい派。うらやましいです。耳栓は、お持ちですか？'
        - 当方は、持っていくのをよく忘れるんですけど。
      - c: 配信。家が楽
        r:
        - 配信で、家が楽。{from}様、お仲間でございます。紅茶を何杯でも淹れられますし。
        - ただ、知らない方と一緒に手を上げられないのは、ちょっと寂しいですね。
      - c: 行きたいけど券が取れない
        r:
        - 行きたいけど券が取れない……{from}様。当方と一緒に、白湯を飲みましょう。
        - 抽選は、当方の味方をしてくれたことがございません。
      npc: [[武道館二階東, 0], [新譜しか聴かない, 0], [鍵盤を売った, 1], [ヘドバンで首やった, 0], [初見の旅人, 2]]
  - chat: [武道館二階東, 会場の話ならいくらでもするよ。去年は二階の一番後ろ]
  - say: 会場派の方が多いですね。武道館様は、去年二階の一番後ろ！ 見えました？
  - chat: [武道館二階東, 豆粒。でも音は来た]
  - say: 豆粒、でも音は来た。音が来るなら、豆粒でもうらやましいです。
# 締め（十七日後と、続いているバンド）
- - say: それで。皆様ご存じかもしれませんが、その十七日後に。
  - say: 七月二十二日、オジー様は七十六歳で亡くなられました。
  - chat: [鍵盤を売った, 間に合ったんだよね]
  - say: 間に合った。そうなんです。地元で、最後まで歌って。間に合ったんです。
  - say: そのあと、バーミンガムの街で、お見送りの行列がございまして。
  - say: 街にある、ブラック・サバスの名前の付いたベンチの所で、車が止まったそうです。
  - chat: [武道館二階東, ファンが花を置いてた]
  - say: ファンの方が花を置いて。当方、その写真を、しばらく携帯の待ち受けにしておりました。
  - chat: [ヘドバンで首やった, 今は？]
  - say: 今の待ち受けは、主様の寝顔でございます。
  - chat: [新譜しか聴かない, 急に重い]
  - say: {face: smug, text: 急に重い？ え、普通でございますよ。}
  - chat: [ピアノ教室の先生, 普通ではない]
  - chat: [新譜しか聴かない, リンキンも新しいボーカルで続いてるし、続くバンドは続くよ]
  - say: 続くバンドは続く、そうですね。リンキン・パーク様は、二〇二四年にエミリー・アームストロング様を迎えて。
  - chat: [新譜しか聴かない, 最初は賛否あったけどね]
  - say: 賛否、ありましたね。でも当方、続いてくださるだけで、うれしいんです。
  - chat: [鍵盤を売った, じゃあエラも手紙の返事しなよ]
  - say: 「じゃあエラも手紙の返事しなよ」……あ。
  - chat: [ヘドバンで首やった, 刺さった]
  - say: {face: flustered, text: 刺さりました。鍵盤を売った様、それは今言わなくても。}
  - chat: [武道館二階東, 逃げた]
  - say: はい、逃げます。今日はもう、お風呂で温まった頭が冷えてしまいました。
  - say: 本日もありがとうございました。湯冷めしないうちに、失礼いたします。
  - chat: [新譜しか聴かない, 42度に入り直すの？]
  - say: {face: laugh, text: 四十二度に入り直すか。入り直しません。……たぶん。ごきげんよう。}
