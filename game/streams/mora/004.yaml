title: 一人で焼肉に行ったら、二人用の網が出てきた
parts:
# 挨拶と、服のにおい
- - say: こんばんは。始めるよ。
  - chat: [定時退社したい, こんばんは]
  - chat: [ポイントで生きてる, 画面越しに焼肉のにおいがする]
  - say: 画面越しに焼肉のにおい？ しないでしょ。……でも当たり。さっき焼肉行ってきたの。
  - chat: [夜勤明けの人, 誰と？]
  - say: 誰と？ 一人で。
  - chat: [実家に帰れてない, 一人焼肉！]
  - say: 一人焼肉、って言うとかっこいいけど、かっこよくはなかったよ。今日はその話。
  - say: 服がまだにおうの。消臭スプレー、さっき三回かけた。
  - say: 髪にもかけようか迷って、やめた。髪にかけていいのか、缶の裏に書いてなかったから。
# 二人用の網
- - say: お店に入って、「一人です」って言ったの。声、ちょっと小さかったけど。
  - chat: [手帳は三冊目, 一人ですって言うの緊張する]
  - say: 「一人です」って言うの、緊張するよね。で、店員さんが元気に「お一人様ですね！」って。
  - say: 声が大きいの。お店中に知らせなくていいのに。
  - say: 振り向いた人が二人いたよ。数えちゃった。
  - say: で、席に座ったら、網が来たの。それがね、大きいの。
  - chat: [ポイントで生きてる, 二人用？]
  - say: 二人用？ たぶん二人か三人用。四人がけのテーブルに一人で座ってたから。
  - say: 広いの。お肉を三枚並べたら、残りが全部空いてて。
  - say: 落ち着かないの。何か置きたくなる。でも置くものがない。
  - chat: [実家に帰れてない, 野菜焼けば]
  - say: 野菜焼けば、って、頼んだよ。玉ねぎとかぼちゃ。それでも半分空いてた。
  - say: 途中で店員さんが来てね、「網、替えましょうか」って言ってくれたの。
  - say: でも替えても、また同じ大きさの網が来るでしょ。だから「大丈夫です」って言った。
  - chat: [手帳は三冊目, 小さい網くださいって言えばよかった]
  - say: 「小さい網ください」、言えないよ、その場では。思いついたの、帰りの電車だもん。
  - say: 言い返す言葉も、だいたい帰りの電車で思いつくの。
  - chat: [ポイントで生きてる, 空いてるとこにポイントカード並べれば]
  - say: 空いてるとこにポイントカード並べる？ 燃えるよ、カード。あんたの財布ごと燃える。
# 最初に頼むもの
- - chat: [手帳は三冊目, 最初何頼んだ？]
  - say: 最初に何頼んだか。タン塩。これは譲れない。
  - chat: [ポイントで生きてる, いきなりカルビでしょ]
  - say: いきなりカルビ？ カルビ派か。最初に脂っこいの行くと、あとが続かないよ。
  - chat: [ポイントで生きてる, 若いので]
  - say: 若いって言った？ 今、私に向かって言った？
  - say: まあいいよ。タン塩はね、レモンに付けて食べるの。
  - chat: [初見の旅人, レモンかける派？]
  - say: レモンかける派か、って？ かけないの。小皿のレモン汁に、自分の分だけ付ける。唐揚げもそう。
  - say: 勝手に全部にかけられるのは、ちょっと嫌。
  - chat: [定時退社したい, 一人焼肉なら誰にもかけられないじゃん]
  - say: 一人焼肉なら誰にもかけられない、そうなの！ そこは一人のいいところ。全部自分で決められる。
  - ask:
      q: 焼肉、最初に頼むのは？
      options:
      - c: タン塩
        r:
        - '{from}はタン塩。分かってるね。'
        - 薄いからすぐ焼けるでしょ。最初の一枚が早いの、嬉しいよね。
      - c: カルビ
        r:
        - '{from}もカルビ派か。若いね。'
        - 私も昔はそうだった。今は二枚目で、ご飯がほしくなる。
      - c: ハラミ
        r:
        - '{from}はハラミ。そこから行くんだ。'
        - ハラミもいいね。柔らかくて、一人でも頼みやすい量だし。
      - c: ご飯とキムチ
        r:
        - '{from}はご飯とキムチ。先にそっちを固めるんだね。'
        - 分かる。肉が来るまでの間が手持ちぶさただから。
      npc: [[夜勤明けの人, 0], [ポイントで生きてる, 1], [手帳は三冊目, 2], [定時退社したい, 3], [実家に帰れてない, 0]]
  - say: で、タン塩を焼いてたらね、隣のテーブルが四人の家族だったの。
  - say: 向こうはお肉がどんどん来て、網がいっぱい。こっちはタン塩三枚。
  - say: 見比べちゃった。網の使い方が全然違うの。
  - chat: [ポイントで生きてる, 寂しくなった？]
  - say: 寂しくなったか？ なってないよ。好きな焼き加減で食べられるし。
  - chat: [ポイントで生きてる, モーラは何焼きが好き？ レア？]
  - say: レアかって？ 私はよく焼く派。人にも焼かれたくない。自分で焼く。
  - chat: [ポイントで生きてる, 焼かれたい]
  - say: {face: annoyed, text: 焼かれたい、じゃないの。焼かないよ。あんたは網に乗せない。}
  - chat: [夜勤明けの人, ご飯は頼んだ？]
  - say: ご飯？ 頼んだ。普通の量。
  - chat: [定時退社したい, 焼肉は大盛りでしょ]
  - say: 焼肉は大盛り、って言うけどね、大盛りにすると、途中でお肉が足りなくなるの。で、お肉を追加して、またご飯が余るの。
  - say: 終わらないの。だから普通。
  - say: 最後にね、冷麺を頼むか一回迷ったの。一人で冷麺まで行くと、なんか本気の人みたいでしょ。
  - say: 結局頼まなかった。帰りにコンビニでアイス買った。同じことなのにね。
# 脇道：サイゼリヤの一人席
- - chat: [初見の旅人, 一人で入りやすいお店ってどこ？]
  - say: 一人で入りやすいお店？ サイゼリヤ。一人で入っても、全然浮かないの。
  - say: 私はミラノ風ドリアと、小エビのサラダ。
  - say: あと、合計がだいたい分かるのがいいの。暗算しなくても。
  - chat: [ポイントで生きてる, 暗算できないもんね]
  - say: 「暗算できないもんね」って、できないよ。だからサイゼが好きなの。
  - chat: [手帳は三冊目, キッズメニューの間違い探しやる？]
  - say: キッズメニューの間違い探し、やる！ ドリアが来るまでの間に。
  - say: でもね、前に九個までは見つけたの。十個目が分からなくて。
  - say: 探してる間に、ドリアが冷めたの。
  - say: 悲しいでしょ。で、次に行ったら、間違い探しの絵が新しくなってたの。
  - chat: [夜勤明けの人, 去年変わったやつ]
  - say: 去年変わったやつ、そう。九個まで探したのが、全部なかったことに。
  - chat: [ポイントで生きてる, 写真撮っとけば]
  - say: 写真撮っとけば、ね。撮ればよかった。でもお店の中で間違い探しの写真を撮るの、ちょっと恥ずかしくない？
  - chat: [名無しの使い魔, みんな撮ってる]
  - say: みんな撮ってるの？ じゃあ次は撮る。
  - chat: [手帳は三冊目, 一人だとドリンクバー何杯いく？]
  - say: ドリンクバー何杯いくか。三杯。最初はお茶で、次がメロンソーダ、最後はまたお茶。
  - say: メロンソーダはね、一人のときしか飲まないの。人といると、なんか子どもっぽい気がして。
# 脇道：一人でどこまで行ける？
- - chat: [毎朝おはよう係, 一人カラオケは行く？]
  - say: 一人カラオケ？ 行く行く！ 好き。
  - say: 一人カラオケ専用のお店があるの知ってる？ ワンカラっていうの。
  - say: 部屋がすごく狭くて、ヘッドホンをして歌うの。2011年からあるんだよ。
  - chat: [手帳は三冊目, 電話ボックスみたいな部屋]
  - say: 電話ボックスみたいな部屋、そう、そんな感じ。初めて行ったとき、部屋の広さを靴で測ったの。
  - say: 歌う前に。かかとからつま先で、何足分かって。
  - chat: [ポイントで生きてる, 何足だった]
  - say: 何足だったか？ 覚えてない。測ったことだけ覚えてる。
  - say: 最近は普通のカラオケ店に一人で行くことが多いの。ヘッドホンだと、自分の声が近すぎて。
  - chat: [定時退社したい, 何歌うの？]
  - say: 何歌うか？ 中島みゆきの「糸」。で、採点も入れるの。
  - chat: [実家に帰れてない, 何点？]
  - say: 点数？ 最高が89点。90点が、ずっと越えられないの。
  - say: 採点の画面で、音程は合ってるのに「抑揚」が低いって出るの。抑揚って言われても、どこで付けたらいいか分からないよ。
  - say: この前もまた89点が出てね。そしたら、隣の部屋から拍手が聞こえたの。
  - chat: [初見の旅人, え、聞こえてた？]
  - say: 聞こえてたか？ たぶん違う。隣、何人かで来てたみたい。隣の人の歌が終わって、仲間が拍手しただけ。
  - say: でもなんか嬉しくて、私も拍手した。一人で。
  - chat: [毎朝おはよう係, 回らない寿司は？]
  - say: 回らない寿司は、まだ。カウンターで「おまかせで」が言えないの。
  - say: 一回ね、のれんの前までは行ったの。そしたら、中の大将と目が合って。
  - chat: [ポイントで生きてる, 入った？]
  - say: 入ったか？ 会釈して、通り過ぎた。
  - say: そのあと、はま寿司に行った。タッチパネルで頼めるから、誰とも目が合わないの。
  - say: 回るお寿司なら一人でも余裕。最後はかっぱ巻きで締めるの。
  - ask:
      q: 一人でどこまで行ける？
      options:
      - c: 一人焼肉
        r:
        - '{from}は一人焼肉。そこまで行けるなら強い。'
        - 網の大きさだけ気をつけてね。半分空くと落ち着かないから。
      - c: 一人カラオケ
        r:
        - '{from}は一人カラオケ。行く人か。'
        - 隣の部屋の拍手、聞こえたら一緒に拍手していいからね。
      - c: 回らない寿司
        r:
        - '{from}、回らない寿司まで行けるの？ すごい。私はのれんの前で会釈して帰ったよ。'
        - 今度、入り方を教えて。最初に何て言えばいいかだけでいいから。
      - c: 一人旅
        r:
        - '{from}は一人旅。私も好き。'
        - 誰にも合わせないで、乗り換えまで全部自分で決めるの。あれは楽しい。
      npc: [[夜勤明けの人, 1], [実家に帰れてない, 3], [ポイントで生きてる, 0], [手帳は三冊目, 3], [定時退社したい, 2]]
  - chat: [名無しの使い魔, 一人旅の話も聞きたい]
  - say: 一人旅の話？ 私はね、旅先の郵便局で、自分あてにはがきを出すの。
  - say: その町の絵と日付が入った消印を押してもらえるの。風景印っていうの。
  - say: 帰ってから三日後くらいに、旅先からのはがきが自分に届くの。
  - say: 自分の字で、自分の名前が書いてあるの。ちょっと照れるけど、好き。
  - chat: [夜勤明けの人, 家で一人鍋はする？]
  - say: 一人鍋、する！ 冬はほぼ毎週。一人用の小さい土鍋があるの。
  - chat: [定時退社したい, 何鍋？]
  - say: 何鍋？ 鱈ちり。鱈と豆腐と白菜を入れて、ポン酢だけ。
  - say: 洗い物も土鍋一個で済むし。
  - chat: [名無しの使い魔, 締めは？]
  - say: 締めは雑炊！ 卵を落として、残った具も全部入れちゃう。
  - chat: [ポイントで生きてる, ラーメン派です]
  - say: ラーメン派もいるね。いいね。でも一人だとね、雑炊にすると次の日まで残らないの。それがいい。
  - chat: [初見の旅人, 残らないのがいいの？]
  - say: 残らないのがいいの、って？ 一人だと、何でも余るの。だから全部片付くものが好き。
  - chat: [夜勤明けの人, 一人鍋の土鍋、置き場所に困る]
  - say: 土鍋の置き場所、困る！ 夏の間、ずっと冷蔵庫の上にいるの。
  - chat: [帳面カウンター, 焼肉の網は結局どうなったの]
  - say: 焼肉の網は結局どうなったか。網ね。
# 締め：網の半分
- - say: 結局ね、最後まで網の半分は空いてたの。
  - say: タン塩、カルビ、ハラミ、玉ねぎ。全部、手前の半分で焼いた。
  - chat: [夜勤明けの人, 奥まで手が届かないから]
  - say: 奥まで手が届かない、それもある。奥は遠いの。四人がけの奥。
  - chat: [初見の旅人, 次はどうする？]
  - say: 次はどうするか。入るときに「一人です」って言うのと一緒に、網の大きさも聞く。
  - chat: [ポイントで生きてる, 網の大きさ聞く人初めて見る]
  - say: 網の大きさ聞く人、初めて見る？ 私が最初になるよ。小さい網、ありますかって。
  - chat: [定時退社したい, カウンター席の店にすればいいのでは]
  - say: カウンター席の店にすればいい……それだ。カウンターの焼肉屋、探す。
  - say: じゃあ今日はここまで。服、もう一回スプレーしてくる。おやすみ。
