title: 洗濯機が止まったので、取扱説明書を後ろから読んだ
parts:
# 挨拶と、止まった洗濯機
- - say: こんばんは。始めるよ。後ろで洗濯機が鳴ってたらごめんね。
  - chat: [夜勤明けの人, こんばんは。洗濯中？]
  - say: 洗濯中、のはずだったの。さっき止まったの。ピーピー言って。
  - chat: [手帳は三冊目, エラー？]
  - say: うん、エラー。画面にアルファベットと数字が出てる。意味は分からない。
  - chat: [ポイントで生きてる, 叩けば直る]
  - say: 叩けば直る？ 叩かないよ。うちの洗濯機、まだ新しいほうなんだから。
  - say: 説明書を読むよ。今、手元に持ってきた。
# 説明書は後ろから読む
- - say: 私ね、説明書は後ろから読むの。「困ったときは」のページから。
  - chat: [初見の旅人, 最初から読まないの？]
  - say: 最初から読まないのかって？ 最初のほうは「安全のために」が何ページも続くでしょ。あれは知ってる。
  - say: 後ろの表が好きなの。症状、原因、直し方、って三列に並んでるやつ。
  - say: で、今その表で、画面と同じ記号を探してるの。……あった。
  - chat: [夜勤明けの人, 原因は？]
  - say: 原因はね、「ふたが閉まっていません」。
  - chat: [ポイントで生きてる, ｗｗｗ]
  - say: 笑わないで。閉まってると思ってたの。見に行ったら、タオルの端がふたに挟まってた。
  - say: {face: shy, text: 閉め直した。回り始めた。はい、直りました。}
  - say: ここから一時間くらい洗濯待ち。だから今日はそのまま喋るね。
  - say: 表の話に戻るとね、実家の古い炊飯器の説明書が、あの表がすごくよかったの。
  - say: 一番下の行がね、「それでも直らないときは、無理をせず」って書いてあって。
  - say: 無理をせず、でいいの。そのあと電話番号がちゃんと書いてあるから。
  - chat: [説明書捨てる派, 読まなくても分かるやつ。説明書なんて買ったその日に捨てる]
  - say: 出た。説明書捨てる派。来ると思ってた。
  - say: 買ったその日に捨てる！ 箱と一緒に？
  - chat: [説明書捨てる派, 箱と一緒に]
  - say: 箱と一緒に、って。困ったときどうするの。
  - chat: [説明書捨てる派, 検索する]
  - say: 検索ね。検索すると、説明書の画像が出てくるでしょ。
  - chat: [説明書捨てる派, 出てくる]
  - say: {face: smug, text: ほら。誰かが取っておいた説明書を読んでるじゃない。}
  - chat: [説明書捨てる派, メーカーのサイトにPDFがある]
  - say: メーカーのサイトにPDF。それはそうだね。メーカーが取っておいてくれてるんだ。
  - say: うーん。だから捨てていい、って言いたいんでしょ。まあ、それはそれでいいのか。でも私は捨てない。
  - chat: [夜勤明けの人, メーカーに電話したことある？]
  - say: メーカーに電話したことある。前の洗濯機のとき。でもね、電話がつながるの、平日の昼だけなの。
  - chat: [定時退社したい, 働いてる人は電話できない]
  - say: 働いてる人は電話できない、できないの！ 区役所と同じ。休みを取らないと、洗濯機の相談もできない。
  - say: やっとつながっても保留でしょ。保留の音楽が流れるでしょ。あれ、何回も同じところに戻ってくるの。
  - say: 曲、覚えちゃった。いまだに鼻歌で出てくる。
  - chat: [ポイントで生きてる, 歌って]
  - say: 歌わないよ、ポイントで生きてる。ちょっとだけなら……いや、やっぱり歌わない。
  - chat: [名無しの使い魔, つながったあとは？]
  - say: つながったあとはね、すごく丁寧に教えてくれた。「電源を抜いて、少し待ってから入れてみてください」って。
  - say: それで直ったの。三十分待って、話したのは三分。
  - chat: [説明書捨てる派, 説明書にも書いてあったやつでは]
  - say: 説明書にも書いてあった？ ……書いてあったかもしれない。あの頃はまだ後ろから読んでなかったの。
# 脇道：本棚のネジが二本余った
- - chat: [定時退社したい, 説明書読んでもネジ余る派です]
  - say: 説明書読んでもネジ余る派？ それ私もある！ 本棚。
  - say: ニトリで買った本棚を一人で組み立てたの。最後にネジが二本余ったの。
  - chat: [初見の旅人, 説明書読んだのに？]
  - say: 初見さん、読んだんだよ、説明書。三回読み直した。どこのネジか分からない。
  - chat: [手帳は三冊目, 予備で入ってるだけでは]
  - say: 予備で入ってるだけ？ 予備って書いてなかったの。書いてあったら安心できたのに。
  - say: で、本棚はちゃんと立ってるの。本も載ってる。
  - say: 立ってるならいいって言われるけど、立ってるから怖いの。どこかが足りないまま立ってるんだよ。
  - chat: [定時退社したい, 余ったネジどこにある？]
  - say: 余ったネジはね、本棚の一番上の段に置いてある。
  - say: 小さい封筒に入れて、「本棚 ネジ 二本 どこの？」って書いたの。封筒に質問を書いても、答えは来ないんだけどね。
  - chat: [説明書捨てる派, 自分は余ったネジも捨てる]
  - say: {face: surprised, text: 余ったネジも捨てるの？ ネジまで？}
  - chat: [説明書捨てる派, 立ってるので]
  - say: 立ってるので、だって。強いね、あんた。うらやましくはないけど。
  - chat: [名無しの使い魔, 一人で組み立てると、板を支える手が足りない]
  - say: 板を支える手が足りない！ 片手で板を押さえて、片手でドライバー。足で別の板を押さえてた。
  - say: 一人暮らしの家具はね、足も手のうちに入るの。
  - say: 最後に裏の薄い板を、小さい釘で打つでしょ。あれが一番つらかった。
  - say: 夜だったから、トントン鳴らすたびに下の階に聞こえてないか気になって。
  - chat: [初見の旅人, 下の階は？]
  - say: 下の階は、リゼの部屋。終わったあとで「何作ってたの」ってLINEが来た。聞こえてたの。
  - chat: [手帳は三冊目, 手伝ってって言えばよかったのに]
  - say: 手伝ってって言えば、って？ 言っても来ないよ。リゼ、夜はゲームしてるから。
# 脇道：小説も最後から読む
- - chat: [手帳は三冊目, 後ろから読むのって小説も？]
  - say: 小説も？ 最後のページから読むよ。
  - chat: [初見の旅人, ネタバレじゃん]
  - say: ネタバレじゃん、って言われるけど、平気なの。というか、先に知りたいの。
  - say: 結末を知ってから読むと、途中で「あ、ここでこう言ってたんだ」って見つけられるでしょ。
  - chat: [名無しの使い魔, 絶対だめ派です]
  - say: 絶対だめ派、いるよね。ヴェスパがそれ。
  - say: 前にこの話をしたら、本気の顔で怒られたの。「最後から読むのは作者に失礼！」って。
  - chat: [名無しの使い魔, 自分も怒る]
  - say: 使い魔も怒る？ 怒られる側なのは分かってる。だから人の本ではやらないよ。自分で買った本だけ。
  - chat: [初見の旅人, 最後から読んで、最初に戻るの？]
  - say: 最初に戻るか？ 戻るよ。最後の二ページだけ読んで、あとは普通に最初から。
  - say: 推理小説だと、犯人が分かった状態で読むでしょ。そうすると、その人が出てくるたびに「あ、今うそついた」って分かるの。
  - chat: [夜勤明けの人, それはそれで楽しそう]
  - say: 夜勤明けさん、それはそれで楽しそうって。楽しいの。そう言ってくれる人、なかなかいないんだよ。
  - chat: [名無しの使い魔, 映画は？]
  - say: 映画は？ 最後から見られないから、あらすじを最後まで調べてから行く。
  - say: それでも泣くの。知ってるのに泣くの。知ってるから、来るぞ来るぞって、手前から泣いてる。
# 脇道：洗濯物はたたむ？ 干すのはどこ？
- - chat: [毎朝おはよう係, 洗濯物ってたたむ派？]
  - say: たたむ派か？ たたむ。たたまないと、何枚あるか分からなくなるの。
  - chat: [定時退社したい, かごから直接着てる]
  - say: かごから直接着てる、ね。それも一人暮らしだとよく聞く。
  - chat: [初見の旅人, 外に干す？]
  - say: 外に干すか？ 部屋干し。うち、城の三階で、風が強いの。外に干すと飛ぶの。
  - chat: [ポイントで生きてる, 飛んだことある？]
  - say: 飛んだことある。靴下が一枚、下の階のリゼのベランダに落ちた。
  - say: 三日後に返ってきた。ドアノブにかかってた。
  - say: やさしいけど、なんで三日かかったのかは分からない。
  - chat: [ポイントで生きてる, 下着じゃなくてよかったね]
  - say: {face: annoyed, text: 下着じゃなくてよかった、って、下着は外に干さないよ。……そこ聞かないで。}
  - chat: [ポイントで生きてる, 何色？]
  - say: 何色って、靴下の話をしてるの。靴下は黒。全部黒。
  - chat: [夜勤明けの人, 全部黒だと片方なくしても困らない]
  - say: 全部黒だと片方なくしても困らない、そうなの！ 片方がリゼのベランダに行っても、残りで組めるの。
  - chat: [定時退社したい, 洗濯機は何使ってる？]
  - say: 洗濯機は何か、シャープ。冷蔵庫もシャープ。同じお店で、同じ日に買ったの。
  - say: 引っ越しのとき、一回で済ませたかったの。店員さんに「ご新婚ですか」って聞かれた。
  - chat: [初見の旅人, なんて答えたの]
  - say: なんて答えたか。「一人です」って。店員さん、すごく申し訳なさそうな顔してた。
  - say: 申し訳なくないよ、って言いたかったけど、言うとかえって変でしょ。だから冷蔵庫の扉の向きの話をした。右開きか左開きか。
  - ask:
      q: 洗濯物、たたむ？
      options:
      - c: たたんでしまう
        r:
        - '{from}は、たたんでしまう。私と同じだ。'
        - たたむと、何がどれだけあるか分かるから落ち着くの。
      - c: かごから直接着る
        r:
        - '{from}は、かごから直接着る。正直でいいね。'
        - かごの底に、いつも同じシャツが残らない？
      - c: ハンガーのまましまう
        r:
        - '{from}はハンガーのまましまう。頭いいね。'
        - それ、ちょっとまねしたい。たたむの、夜中だと眠くなるから。
      npc: [[毎朝おはよう係, 0], [定時退社したい, 1], [夜勤明けの人, 2], [ポイントで生きてる, 1], [手帳は三冊目, 0]]
# 終わり：きのこたけのこ
- - chat: [名無しの使い魔, 洗濯待ちの間、何食べてる？]
  - say: 洗濯待ちの間、何食べてるか。今はたけのこの里。さっき開けた。
  - chat: [ポイントで生きてる, きのこ派です]
  - say: きのこ派です、って始まった。私はたけのこ。チョコとクッキーが、最後まで同じくらいずつ減るから。
  - chat: [ポイントで生きてる, きのこは柄が残るのがいい]
  - say: 柄が残るのがいいの？ 最後にクラッカーだけ残るの、私はちょっと寂しいんだけど。
  - ask:
      q: きのこの山とたけのこの里、どっち派？
      options:
      - c: きのこの山
        r:
        - '{from}はきのこか。'
        - 柄を最後に食べる派？ それとも先に食べる派？
      - c: たけのこの里
        r:
        - '{from}はたけのこ。仲間だ。'
        - 一袋開けると止まらないのも、たけのこの困るところだよね。
      - c: すぎのこ村
        r:
        - '{from}、すぎのこ村！ 懐かしい名前が来た。'
        - 知ってる人、今どれくらいいるんだろう。
      npc: [[ポイントで生きてる, 0], [夜勤明けの人, 1], [定時退社したい, 0], [名無しの使い魔, 1], [手帳は三冊目, 2]]
  - chat: [手帳は三冊目, 明治の総選挙だと2018年はたけのこが勝った]
  - say: 2018年の総選挙はたけのこが勝った、そうそう。で、次の年にきのこが勝ったんだよね。
  - chat: [夜勤明けの人, あれは組織票]
  - say: 組織票って言い出すと、終わらないよ。夜勤明けさん。
  - chat: [定時退社したい, たけのこはクッキーが本体]
  - chat: [ポイントで生きてる, きのこはチョコが本体]
  - say: みんな本体の話してる。私はどっちが本体でもいいの。袋の底の、割れたかけらが一番好き。
  - chat: [名無しの使い魔, 間をとってアルフォート]
  - say: 間をとってアルフォート？ 出していいの、それ。あ、洗濯機、すすぎに入った音。
  - chat: [ポイントで生きてる, きのこの勝ち]
  - chat: [夜勤明けの人, たけのこの勝ち]
  - say: きのこの勝ち、たけのこの勝ち、まだやってる。どっちもおいしいでしょ、もう。洗濯が終わるまで、私はたけのこ食べてる。おやすみ。
