title: 区役所でマイナンバーカードの暗証番号を三回間違えた
parts:
# 挨拶と、初めての有休
- - say: はい、始めるよ。こんばんは。
  - chat: [ポイントで生きてる, こんばんは。顔が疲れてる]
  - say: 「顔が疲れてる」って、開口一番それ？ 疲れてるよ。昨日、区役所に行ったの。
  - chat: [窓口十二年, おっ]
  - say: 窓口十二年、もう「おっ」って言ってる。反応が早い。まだ入口にも着いてないよ。
  - chat: [初見の旅人, 初見です。区役所で何かあったんですか]
  - say: 初見さんだ、いらっしゃい。区役所で何かあったかって？ あったの。マイナンバーカードの更新。
  - say: 中の電子証明書っていうのが、五年で切れるのね。お知らせの封筒が来てたの。
  - chat: [実家に帰れてない, いつ来てたの]
  - say: いつ来てたか？ 二か月前。
  - say: 笑わないでね。色の薄い封筒って、急いでない顔してるでしょ。
  - chat: [夜勤明けの人, 分かる。赤いのしか開けない]
  - say: 夜勤明けさん、赤いのしか開けないって。でしょ！ 赤いのは開ける。窓が二つあるのも開ける。
  - say: で、区役所って、開いてる時間が私の仕事の時間とぴったり同じなの。
  - chat: [定時退社したい, それな]
  - say: だから休みを取ったの。有休。
  - chat: [実家に帰れてない, え、モーラが休んだ]
  - say: 「モーラが休んだ」って、事件みたいに言わないで、権利だよ。まあ、初めて使ったけど。
  - say: {face: shy, text: 初めての有休が区役所。うん、自分でもどうかと思う。}
# 番号札の機械と、六十一の次の二百八
- - say: で、入ったら番号札の機械があるでしょ。ボタンが七つあったの。
  - say: 「転入・転出」「住民票」「戸籍」……で、「マイナンバーカード」もあるの。
  - say: なのに、その下に小さく「受け取り」って書いてあって。私、受け取りじゃなくて更新なの。
  - chat: [初見の旅人, どれ押したの]
  - say: どれ押したかって？ 更新のボタンが見つからなくて、人が並んでる方を押しちゃったの。「転入・転出」。
  - say: ちゃんと聞けばよかった。案内の人、入口に立ってたのに。
  - chat: [窓口十二年, うちの区は「その他」があります]
  - say: 「その他」があるの？ ずるい。そっちに引っ越したい。転入・転出のボタンで。
  - say: で、出てきた札が七十三番。表示を見たら六十一番。
  - chat: [帳面カウンター, 十二人待ちか]
  - say: 十二人待ち、と思うでしょ。次に呼ばれたのが、二百八番。
  - chat: [窓口十二年, 窓口ごとに番号が別]
  - say: そう、窓口ごとに番号が別なの。百番台が戸籍、二百番台が住民票、みたいに分かれてて。
  - say: 頭にアルファベットでも付けてくれたら分かるのに、数字だけ。
  - chat: [夜勤明けの人, 病院も同じ。後の番号が先に呼ばれる]
  - say: 病院も、後の番号が先に呼ばれるよね。分かる。診察と会計と薬で番号が三つになるでしょ。
  - say: 薬局でまた別の番号。一日に四つ番号もらって、用事は一個しか済んでないの。あれ何なんだろうね。
  - chat: [夜勤明けの人, 前に待合で寝ちゃった]
  - say: 待合で寝ちゃったの？ 上級者だよ。呼ばれたとき起きられた？
  - chat: [夜勤明けの人, 隣のおばあちゃんが起こしてくれた]
  - say: {face: smile, text: 隣のおばあちゃんが起こしてくれた？ いいおばあちゃん！ 私の隣にも座っててほしい。}
  - ask:
      q: 待合で番号を待ってる間、何してる？
      options:
      - c: スマホを見てる
        r:
        - '{from}はスマホを見てる、ね。普通の人だね。私もそうしたい。'
        - でも顔を上げたら番号が三つ進んでて、焦るでしょ。
      - c: 表示の番号をずっと見てる
        r:
        - '{from}は表示をずっと見てる派。私と同じだ。'
        - 見てても早くならないのは分かってるの。目を離すと抜かされる気がするんだよね。
      - c: 周りの人の番号札をのぞく
        r:
        - '{from}、周りの番号札をのぞくの？ それ、やっていいの？'
        - 私もやった。隣の人が七十四番で、ちょっと勝った気がした。
      npc: [[夜勤明けの人, 0], [帳面カウンター, 1], [ポイントで生きてる, 2], [窓口十二年, 1]]
  - chat: [窓口十二年, 窓口から見ると、表示を見てる人はすぐ分かる。首が動く]
  - say: {face: shy, text: 表示を見てる人は首が動く、って。動いてた。たぶんずっと動いてた。}
# 脇道：待合の自販機と缶コーヒー
- - say: で、待つしかないから、自販機に行ったの。
  - say: いつもはね、お〜いお茶って決めてるの。迷うと時間かかるから。
  - say: でも区役所の自販機に、ジョージアのエメラルドマウンテンがあって。
  - chat: [定時退社したい, エメマン懐かしい]
  - say: そう、エメマン！ 懐かしいよね。昔いた書記局の廊下の自販機にあったの。
  - say: 締めの日の夜は、みんな一本ずつ持ってたんだよ。
  - chat: [初見の旅人, 書記局って？]
  - say: 書記局はね、私が昔いた職場。魔王府の、帳簿を付ける部署ね。お金の出入りを全部書くところ。
  - say: 魔王府って言うと笑われるけど、普通の職場だったの。残業も普通にあった。
  - say: 机に空き缶が並ぶでしょ。四本並んだら、もう朝まで帰れないの。
  - chat: [夜勤明けの人, 缶が時計なの怖い]
  - say: 缶が時計なの怖い、って。怖いでしょ。四本目を開けるとき、みんな黙るの。
  - chat: [手帳は三冊目, エメマンって1994年からだっけ]
  - say: 手帳は三冊目、よく知ってるね。そうそう、1994年。私が書記局に入ってちょっとしてから。
  - chat: [ポイントで生きてる, 缶コーヒーはボス一択]
  - say: 缶コーヒーはボス一択？ ボス派ね。いいよ、ボスもおいしい。
  - chat: [名無しの使い魔, 缶コーヒー甘すぎて飲めない]
  - say: 甘すぎて飲めない人もいるね。甘いよね。エメマン、甘いのにちゃんと苦いの。そこが好き。
  - say: そういえばリゼにあげたことあるんだけど、一口で返された。「苦い」って。
  - say: リゼは紅茶派なの。しかも返すとき、飲み口を私の方に向けて置いたの。
  - chat: [ポイントで生きてる, 間接キス狙いでは]
  - say: {face: annoyed, text: 間接キス狙い？ 違うよ。あれは「片付けて」の向き。}
  - chat: [ポイントで生きてる, モーラの飲み口はどっち向き]
  - say: 私の飲み口？ 向こう向き。ポイントで生きてる、そういうのはポイント貯めてから言って。一生貯まらないけど。
  - say: 待って、何の話してたっけ。
  - chat: [初見の旅人, 七十三番]
  - say: そう、七十三番。旅人、覚えててくれた。エメマン飲んで戻っても、まだ六十番台だったの。
# 記入台のペン
- - say: 待ってる間に申請書を書けって言われて、記入台に行ったの。
  - chat: [手帳は三冊目, 紐でつながってるペンだ]
  - say: そう、紐でつながってるペン。紐がね、二十センチくらいしかないの。
  - say: 紙の右下まで届かないの。だから紙の方をこっちに寄せて書くの。
  - chat: [窓口十二年, 長くすると隣の紐と絡まるんです。毎朝ほどいてます]
  - say: {face: surprised, text: 長くすると隣のと絡まるから、毎朝ほどいてる？ 誰も触ってないのに？}
  - say: 怖い話じゃん！ 夜中に紐どうしが仲良くしてるの？
  - say: で、記入台に札が貼ってあったの。「消せるボールペンは使えません」。
  - chat: [ポイントで生きてる, 局長だ]
  - chat: [初見の旅人, 局長って誰]
  - say: 初見さんは知らないよね、局長。書記局の頃の上司。帳簿を、こすると消えるペンで付けてた人。
  - say: だめなやつでしょ。しかも暖炉の横の棚に立ててたの。
  - say: あのペン、60度くらいで色が消えるのね。夏の締めの日に開いたら、数字が半分なかった。
  - chat: [窓口十二年, うわ]
  - say: で、怒られたのは私。私は消えないインクで書いてたのに。
  - say: ひどいでしょ。だからあの札を見ると、ちょっとだけ気が晴れるの。
  - chat: [窓口十二年, あの札、うちの区のは自分が書きました]
  - say: {face: surprised, text: え、あの札、あんたが書いたの？ ありがとう。ほんとに。}
  - chat: [窓口十二年, 消えて書き直しが月に何件もあるので]
  - say: 消えて書き直しが、月に何件も。局長、全国にいるんだ。
# 暗証番号のメモが、自分で読めない
- - say: で、やっと呼ばれたの。七十三番。転入・転出の窓口で。
  - say: 「更新は四番の窓口です」って言われた。分かってたよ、途中から。
  - say: でもね、その人、四番まで連れてってくれて、番号札もそのまま使えるようにしてくれたの。
  - say: 優しかった。窓口の人に助けられた日だったな、昨日は。
  - say: で、四番の窓口。「暗証番号を入れてください」。
  - chat: [実家に帰れてない, まさか]
  - say: 「まさか」って。そのまさか。覚えてなかった。
  - chat: [初見の旅人, 帳簿の人なのに？]
  - say: 「帳簿の人なのに」。いや、帳簿の人だから、手帳に書いてあるの。手帳は持っていったよ。
  - chat: [窓口十二年, 暗証番号を手帳に書くのは]
  - say: 「暗証番号を手帳に書くのは」、分かってる！ だからそのままは書いてないの。自分で考えた暗号で書いたの。
  - say: で、暗号の決まりを、忘れてたの。
  - chat: [夜勤明けの人, 一番安全な手帳w]
  - say: {face: annoyed, text: 一番安全な手帳って。安全だよ。私にも開けられないんだから。}
  - say: 手帳にはね、「青い鳥 引く 三」って書いてあった。
  - say: 何それって、私が聞きたいよ。五年前の私に。
  - chat: [手帳は三冊目, 昔のツイッター？]
  - say: 昔のツイッター？ 私も思った。でも数字にならないでしょ。
  - chat: [六法は枕, 幸せの青い鳥]
  - say: 幸せの青い鳥？ じゃあ幸せ引く三？ やめて、減らさないで。
  - say: 窓口の前で小さい声で言っちゃった。「なんで鳥なの」って。
  - say: 数字四桁のほうは、三回でロック。で、窓口の人は黙って待っててくれるの。後ろにも人がいるのに。
  - ask:
      q: 暗証番号が分からない。三回まで試せるなら、一回目は何を入れる？
      options:
      - c: 誕生日
        r:
        - '{from}は誕生日。正直だね。私も一回目は誕生日だった。'
        - 違った。五年前の私、そこまで素直じゃなかったみたい。
      - c: いつも使ってる番号
        r:
        - '{from}は、いつも使ってる番号。使い回す派ね。'
        - 私も二回目にそれ入れた。銀行のと同じやつ。違った。そこだけはちゃんとしてたんだね、五年前の私。
      - c: その場で暗号を解く
        r:
        - '{from}は、その場で暗号を解く。真面目。'
        - でも窓口の前で暗号を解くの、すごく恥ずかしいよ。後ろに人が並んでるから。
      npc: [[夜勤明けの人, 0], [ポイントで生きてる, 1], [手帳は三冊目, 2], [実家に帰れてない, 0]]
  - say: 一回目、誕生日。違う。二回目、銀行の番号。違う。
  - say: 三回目はね、うちにある万年筆のインクの瓶の数にしたの。
  - chat: [手帳は三冊目, 43本のやつ？ 四桁にならない]
  - say: そう、43本。四桁にならないから、頭にゼロを二つ付けて、0043。天才だと思ったよ、その瞬間は。
  - chat: [窓口十二年, 五年前は何本だったんですか]
  - say: 五年前は何本……あ。
  - say: 五年前は、もっと少なかった。何本だったかは覚えてない。
  - say: {face: shy, text: で、ロックがかかりました。}
# ロックのあとと、窓口の天井
- - chat: [初見の旅人, ロックかかったらどうなるの]
  - say: ロックのあとはね、その窓口で、暗証番号を作り直せるの。紙をもう一枚書いて。
  - say: 片方覚えてればコンビニでもできるんだけど、私は両方忘れてたから。両方。
  - chat: [窓口十二年, 両方忘れる人、珍しくないです]
  - say: 両方忘れる人、珍しくないの？ ほんと？ 慰めじゃなくて？
  - chat: [窓口十二年, ただの事実です]
  - say: ただの事実です、だって。ならいい。ちょっと安心した。
  - chat: [ポイントで生きてる, モーラのロックは何回で外れる？]
  - say: {face: smug, text: 私のロック？ 外れないよ。三回目で閉まるの。四回目はないから、窓口で本人確認からやり直して。}
  - chat: [名無しの使い魔, 暗証番号の話だよね？]
  - say: 「暗証番号の話だよね？」って、暗証番号の話だよ。ずっと暗証番号の話。
  - chat: [窓口十二年, 窓口のあるある言っていいですか]
  - say: 窓口のあるある？ どうぞ。今日はあんたの日だよ。
  - chat: [窓口十二年, 番号入れるとき、みんな手で隠すけど、こっちは最初から見てないです]
  - say: みんな手で隠すけど、最初から見てないの？ じゃあどこ見てるの。
  - chat: [窓口十二年, 天井です。一番大きい染みは北海道に似てます]
  - say: 天井の、北海道に似た染み。それ好き。気を使ってくれてたんだ。
  - say: 今度行ったら、私も天井見る。北海道探す。
  - chat: [六法は枕, 区の特定はやめよう]
  - say: 区の特定はやめよう、ね。しないよ。六法、たまにはいいこと言うね。
  - chat: [六法は枕, いつも言ってる]
  - say: 「いつも言ってる」？ 留年してなければ、信じたんだけどね。
# 締め：新しい番号はどこに書いた
- - say: で、新しい暗証番号を決めたの。今度は暗号にしないで書いた。
  - chat: [窓口十二年, 書かないで]
  - say: 「書かないで」って、書かないと覚えられないの！ でもね、番号と、何の番号かを、別のページに書いたの。
  - chat: [手帳は三冊目, 次は自分で読める？]
  - say: 次は自分で読めるか。そこが心配なの。書いた場所をまず覚えておかないと。
  - say: 何の番号かのページは、覚えてる。番号のほうは。
  - say: 今、思い出せない。
  - chat: [窓口十二年, 窓口でお待ちしてます]
  - say: 「窓口でお待ちしてます」って、待ってないで！ 次の更新まで使わなければ大丈夫だから。たぶん。
  - chat: [窓口十二年, ちなみにさっきの染み、よく見たら青森でした]
  - say: {face: surprised, text: よく見たら青森？ ちょっと、北海道って言ったじゃない。}
  - say: いいよ。窓口の人も、天井は見間違えるんだね。安心した。
  - say: はい、今日はここまで。封筒は、来たら開けようね。私も開ける。
  - chat: [実家に帰れてない, 今日届いたのは開けた？]
  - say: 今日届いたの？ それは、後で。おやすみ。
