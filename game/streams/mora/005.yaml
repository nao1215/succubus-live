title: 友達の結婚式のご祝儀と、新札に替える列
parts:
# 挨拶と、届いた招待状
- - say: こんばんは。始めるね。
  - chat: [実家に帰れてない, こんばんは]
  - chat: [夜勤明けの人, 今日はちょっと髪が整ってる]
  - say: 髪が整ってる、分かる？ 今日ね、友達の結婚式だったの。さっき帰ってきた。
  - chat: [初見の旅人, モーラの？]
  - say: {face: annoyed, text: 「モーラの？」じゃないよ。友達の、って言ったでしょ。私のじゃない。}
  - chat: [初見の旅人, すみません]
  - say: すみません、だって。いいよ。招待状が来たのは二か月前。学生の頃の友達で、もう十年くらい会ってなかったの。
  - say: 封筒の字を見て、一瞬だれか分からなかった。
  - chat: [ポイントで生きてる, 朝バタバタした？]
  - say: 朝バタバタしたか？ した。袱紗が見つからなかったの。ご祝儀袋を包む布ね。
  - say: 紫の布ね。前の式で使って、どこにしまったか忘れてて。
  - chat: [夜勤明けの人, どこにあった？]
  - say: どこにあったと思う？ 喪服のポケット。
  - say: 前に使ったのがお葬式だったの。で、出かける直前にストッキングが伝線して。
  - say: 予備を鞄に入れておいてよかった。駅のトイレで履き替えたよ。
  - say: 伝線したほうは、そのまま駅のゴミ箱に。燃えるゴミか迷って、三秒くらい立ち止まった。
  - chat: [名無しの使い魔, 予備持ってるのすごい]
  - say: 予備持ってるのすごい、って？ 前に一回やってるからね。同じ失敗は二回はしないの。三回目はあるけど。
# 返事のはがき
- - say: で、返事のはがきね。「ご出席」の「ご」を線で消して、「出席」に丸をする、あれ。
  - chat: [定時退社したい, 毎回やり方忘れる]
  - say: 毎回やり方忘れる、忘れるよね。私、毎回スマホで調べてから書く。
  - say: で、線を引くとき定規を使うの。
  - chat: [夜勤明けの人, 定規w]
  - say: 定規で笑われてる。手で引くと曲がるの。曲がった線、相手に届くの嫌じゃない？
  - chat: [手帳は三冊目, 「寿」って字で消す人もいる]
  - say: 「寿」の字で消す人、いるね。あれはかっこいい。私は字が硬いから、寿がお役所の判子みたいになる。
  - chat: [窓口十二年, お役所の判子に失礼]
  - say: お役所の判子に失礼？ あ、ごめん。窓口十二年の前で言っちゃった。
  - chat: [夜勤明けの人, メッセージ欄に何書いた？]
  - say: メッセージ欄に何書いたか。それがね、三日悩んだの。「おめでとう」の次が書けなくて。
  - say: 十年会ってないでしょ。「元気？」も変だし、「久しぶり」も変だし。
  - chat: [手帳は三冊目, 「お招きありがとう」で十分]
  - say: 「お招きありがとう」で十分。結局それにした。「お招きありがとう。当日楽しみにしてます」。
  - say: 三日悩んで、普通の文になったの。悩んだ分、字だけはすごくきれいに書いた。
# ご祝儀の三万円と、両替機の列
- - say: で、ご祝儀。友達なら三万円が多いでしょ。
  - chat: [初見の旅人, 三万円って高い]
  - say: 三万円って高い、高いよね。でも、そう答える人がだいたい八割くらいいるんだって。
  - chat: [ポイントで生きてる, 二万じゃだめなの]
  - say: 二万じゃだめなのか、って。二で割れる数は縁が切れるって言うから、避ける人が多いの。
  - chat: [六法は枕, 最近は二万でもいいって話もある]
  - say: 六法の言うとおり、最近は二万でもいいって話もあるね。一万円札一枚と五千円札二枚にして、三枚にするとか。
  - say: 三枚ならいいって理屈、すごいよね。でも、そういう工夫、私は嫌いじゃない。
  - say: で、お札は新札にするの。銀行の両替機で替えるんだけど。
  - chat: [手帳は三冊目, 両替機にも列がある]
  - say: 両替機にも列、あるの！ 式の前の日に行ったら、三人並んでた。
  - say: 私の前の人もね、一万円札をきれいに三枚、封筒に入れてたの。
  - say: ああ、この人もどこかの式に出るんだなって。
  - chat: [実家に帰れてない, 同じ式だったりして]
  - say: 同じ式だったりして、って思うよね。実はね、今日の受付でまた会ったの。私のすぐ前に立ってた。
  - chat: [初見の旅人, ほんとに同じ式w]
  - say: ほんとに同じ式。新郎のほうの友達だったの。向こうも気づいて、振り返って「あ」って。
  - say: 気まずくはなかったよ。二人で、ちょっと笑った。話したのはそれだけ。
  - say: 披露宴の席は離れてたの。でもお色直しのとき、向こうのテーブルからこっちを見て、また小さく会釈してくれた。
  - say: 名前も知らないのに、知り合いが一人増えた気がしたよ。
  - ask:
      q: 結婚式でいちばん緊張するのは？
      options:
      - c: 受付でご祝儀を渡すとき
        r:
        - '{from}は受付でご祝儀を渡すとき。分かる。袱紗から出す手がもたつくの。'
        - 私は袱紗をたたみ直すのに時間がかかって、後ろの人を待たせる。
      - c: 知り合いがいない席
        r:
        - '{from}は、知り合いがいない席。それか。'
        - 隣の人と、新郎新婦とどういう関係か聞き合うやつね。あれで五分はもつ。
      - c: スピーチや余興を頼まれる
        r:
        - '{from}はスピーチや余興。頼まれたことあるんだ。すごい。'
        - 私は一回も頼まれたことがない。頼まれたら、たぶん原稿を十回書き直す。
      - c: 呼ばれたことがない
        r:
        - '{from}は呼ばれたことがない。それはそれで気が楽だよ。'
        - 三万円も、新札の列も、ないからね。
      npc: [[夜勤明けの人, 1], [手帳は三冊目, 0], [ポイントで生きてる, 3], [定時退社したい, 1], [実家に帰れてない, 0]]
# 披露宴の料理と、好きなものは最後
- - chat: [定時退社したい, 料理何出た？]
  - say: 料理は何が出たか。コースのお料理。お肉がね、すごくおいしかったの。
  - say: で、私、好きなものは最後に残す派なの。
  - chat: [夜勤明けの人, 自分は先に食べる派]
  - say: 夜勤明けさんは先に食べる派。いるよね。でも先に食べると、残りがなんか消化試合になるでしょ。
  - chat: [ポイントで生きてる, 残してたら下げられるやつ]
  - say: 残してたら下げられるやつ。それ、前にやられたの。定食屋で。
  - say: 鯖の塩焼きを最後のひと口まで取っておいたら、店員さんが「お下げしますか」って。
  - say: まだ食べてるのに。思わず大きい声で「まだです」って言っちゃった。隣のサラリーマンがこっち見た。
  - chat: [手帳は三冊目, 鯖は守れた？]
  - say: 鯖は守れた。で、今日の披露宴でも、お肉を最後にひと切れ残してたの。
  - chat: [夜勤明けの人, 下げられそうになった？]
  - say: 下げられそうになったか？ なった。お皿に手が伸びてきたの。
  - say: 今日はね、声は出さないで、フォークを置いて止めた。お皿の上に。
  - say: 式場で「まだです」は言えないでしょ。
  - chat: [名無しの使い魔, ケーキは食べた？]
  - say: ケーキ？ 食べた。いちごは最後に食べたよ。
  - chat: [定時退社したい, いちご先に食べる派です]
  - say: いちご先に食べる派です、って。それは分かり合えないね。いいけど。
  - chat: [手帳は三冊目, 新婦さんとは話せた？]
  - say: 新婦さんとは、ちょっとだけ話せた。写真を撮るときに「来てくれてありがとう」って。
  - say: 十年ぶりなのに、声は昔のままだった。
  - say: 学生のとき、私のノートを写してた子なの。字がすごく丸くて、写したほうがきれいに見えたんだよね。
  - say: 私、友達の誕生日は全部手帳に書いてあるの。でも、連絡はしないの。
  - chat: [夜勤明けの人, 書いてるのに]
  - say: うん、書いてるのに。マメじゃないの、私。気づいたら誕生日が過ぎてる。
  - chat: [手帳は三冊目, 来年はおめでとう送ろう]
  - say: 来年はおめでとう送ろう、か。送る。たぶん。
# 脇道：二次会と割り勘
- - chat: [ポイントで生きてる, 二次会は行った？]
  - say: 二次会？ 行かなかった。私ね、飲み会は一次会で帰る人なの。
  - chat: [夜勤明けの人, なんで]
  - say: なんでって、会計を任されるの。毎回。端の席に座るから、お会計の紙が回ってくるの。
  - chat: [初見の旅人, 端に座らなければ]
  - say: 端に座らなければ、って言うけど、端が落ち着くの。真ん中だと、両側に話しかけないといけないでしょ。
  - say: で、紙が来るでしょ。暗算できないから、スマホの電卓を出すの。
  - say: で、電卓を出すと「さすが帳簿の人」って言われるの。電卓使ってるのに。
  - chat: [帳面カウンター, 割り勘は一円単位？]
  - say: 割り勘は一円単位か？ 一円単位。きっちり割る。画面をみんなに見せる。
  - chat: [定時退社したい, 先輩なら多めに払ってほしい]
  - say: 先輩なら多めに払ってほしい、そういう人もいるよね。私は多めにも少なめにもできないの。きっちりじゃないと、夜に思い出しちゃう。
  - say: 前にね、リゼに「奢って」って言われて、断ったの。そしたらリゼが払っちゃったの。
  - chat: [初見の旅人, 逆に？]
  - say: うん、逆に。だから一円単位で返そうとしたら、計算に十分かかって。
  - say: 終わったとき、リゼは寝てた。
  - chat: [ポイントで生きてる, 奢られとけばよかったのに]
  - say: 奢られとけばよかった？ それはできないの。借りっぱなしだと落ち着かないから。
  - chat: [毎朝おはよう係, 鳥貴族なら全部同じ値段で楽]
  - say: 鳥貴族なら全部同じ値段。そう、楽！ 皿の数を数えればいいから。
  - chat: [夜勤明けの人, 10月から値上がりしたよね]
  - say: 10月から値上がり、したね。一品410円。前は390円だった。
  - say: 皿の数に410を掛けるの、暗算だと急に難しくなったよ。390のときも、できてなかったけど。
  - ask:
      q: 飲み会のお会計、どうしてる？
      options:
      - c: きっちり割り勘
        r:
        - '{from}は、きっちり割り勘。仲間だ。電卓、一緒に出そう。'
        - 画面を見せると、誰も文句を言わないのがいいんだよね。
      - c: 多く払う側
        r:
        - '{from}は多く払う側か。かっこいいね。'
        - 払う人がいると、私の電卓の出番がなくなる。ちょっと寂しい。
      - c: 奢られたい
        r:
        - '{from}は奢られたい。リゼと同じだ。'
        - 奢られる人は、だいたい会計のとき寝てるか、トイレにいるんだよね。
      - c: 飲んだ分だけ払う
        r:
        - '{from}は飲んだ分だけ払う。それがもめにくいよね。'
        - ただ、誰が何杯飲んだか覚えてる人が必要なの。だいたい私になる。
      npc: [[ポイントで生きてる, 2], [定時退社したい, 1], [夜勤明けの人, 3], [手帳は三冊目, 0], [初見の旅人, 2]]
  - chat: [手帳は三冊目, 引き出物は何だった？]
  - say: 引き出物はね、カタログギフト。それと、焼き菓子の箱。紙袋がすごく大きいの。
  - say: 帰りの電車でずっと膝の上に乗せてた。
  - chat: [ポイントで生きてる, カタログ何選ぶ？]
  - say: カタログで何選ぶか。まだ見てないけど、たぶん鍋。小さいの。
  - chat: [定時退社したい, 一人用の鍋もうあるのでは]
  - say: 一人用の鍋はもうある。でも二個目が欲しいの。一個だと洗ってる間に使えないから。
  - chat: [名無しの使い魔, カタログ、選ぶの忘れて期限切れたことある]
  - say: カタログ、選ぶの忘れて期限切れ。分かる。あれ、期限があるんだよね。私も一回やった。
  - say: 手帳に期限を書いたのに、その頁を開かなかったの。書いただけで安心しちゃうの。
# 締め：ブーケトスと、母への電話
- - say: 式もよかったよ。十年ぶりの友達、ドレス似合ってた。
  - chat: [名無しの使い魔, ブーケトスあった？]
  - say: ブーケトス、あった。私は後ろのほうで、手を下ろしたまま見てた。
  - chat: [ポイントで生きてる, 取りにいけよ]
  - say: 取りにいけよ、って。取ったら、母に報告することが増えるでしょ。電話が一時間延びるよ。
  - say: 取ったのは新婦の妹さん。すごく跳んでた。拍手した。
  - chat: [夜勤明けの人, お母さんには話した？]
  - say: お母さんには、帰りに電話した。結婚式だったよって。
  - chat: [ポイントで生きてる, 返ってきた言葉は]
  - say: 返ってきた言葉は、「で、いい人はいなかったの？」。
  - chat: [帳面カウンター, ｗｗｗ]
  - say: 草、多いね。両替機の人の話は、母にはしてない。したら大変なことになるから。
  - say: はい、今日はここまで。足が痛いの。慣れない靴だったから。おやすみ。
