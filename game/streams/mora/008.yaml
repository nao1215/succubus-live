title: 夜中にカップ焼きそばを作ったら、ソースを先に入れてしまった
parts:
# 挨拶と、夜食
- - say: こんばんは。始めるよ。
  - chat: [夜勤明けの人, こんばんは。何か食べてた？]
  - say: 何か食べてた、って、なんで分かるの。
  - chat: [夜勤明けの人, 口がもぐもぐしてる]
  - say: 口がもぐもぐ？ してない。……さっきまでしてた。カップ焼きそば。
  - chat: [ポイントで生きてる, この時間に？]
  - say: うん、この時間に。お腹が空いたら、時間は関係ないの。
  - chat: [定時退社したい, 夜中の焼きそばは罪の味]
  - say: 夜中の焼きそばは罪の味。分かる。おいしいのは分かってて、食べ終わってから後悔するやつ。
  - say: 戸棚の奥に一個だけ置いてあったの。「非常用」って自分で付箋を貼って。非常じゃなかったけど、お腹は非常だった。
# ペヤングの湯切り
- - chat: [手帳は三冊目, 何の焼きそば？]
  - say: 何の焼きそばか。ペヤング。普通のソースやきそば。
  - chat: [名無しの使い魔, UFO派です]
  - say: 使い魔はUFO派か。おいしいよね。私は昔からペヤング。四角いのが好きなの。
  - say: で、湯切りのときね、私、流しの前で両手で押さえて「せーの」って言うの。
  - chat: [夜勤明けの人, 誰に言ってるの]
  - say: 夜勤明けさん、誰にも言ってないよ。一人の部屋で、流しに向かって言ってる。
  - say: 昔ね、ふたがめくれて、麺が半分流しに落ちたことがあって。
  - chat: [ポイントで生きてる, だばぁ]
  - say: そう、だばぁ。あれからずっと掛け声かけてる。
  - chat: [定時退社したい, 自分も一回やった。もう一個作った]
  - say: 定時退社さんも一回やって、もう一個作ったの？ 夜中に？
  - chat: [定時退社したい, 作った。全部食べた]
  - say: 作って、全部食べた。えらいのかな。分からないけど、すごい。
  - say: 私は落としたとき、半分になった麺をそのまま食べたの。もう一個作る元気がなくて。
  - say: 半分の焼きそばに、ソースを一袋全部かけたら、すごく濃くなった。
  - say: でも、おいしかったよ。おいしかったのが、またちょっと悔しかった。
  - chat: [手帳は三冊目, 湯切りの穴、開け方が分からない]
  - say: 湯切りの穴の開け方、分かる！ どっち向きにはがすか、毎回ふたの字を読むの。
  - ask:
      q: カップ麺の定番は？
      options:
      - c: カップヌードル
        r:
        - '{from}はカップヌードル。王道だね。'
        - あれは三分待つ間に、ふたの上で何か温めたくなるの。私だけ？
      - c: ペヤング
        r:
        - '{from}はペヤング。仲間だ。'
        - 湯切りのとき、何か言う？ 私は「せーの」。
      - c: 日清焼そばU.F.O.
        r:
        - '{from}はUFO派か。'
        - 湯切りの口が開けやすいの、うらやましいんだよね。
      - c: どん兵衛か赤いきつね
        r:
        - '{from}は、どん兵衛か赤いきつね。和風だね。私は赤いきつね派。'
        - お揚げを最後に残すか、先に食べるかで、また話が長くなりそう。
      npc: [[名無しの使い魔, 2], [手帳は三冊目, 0], [ポイントで生きてる, 1], [夜勤明けの人, 3], [定時退社したい, 1]]
# ソースを先に入れた
- - say: で、今日なんだけど。湯切りはうまくいったの。
  - say: うまくいったけど、その前に、ソースを入れてたの。
  - chat: [夜勤明けの人, お湯を入れる前に？]
  - say: そう、お湯を入れる前に。かやくと一緒に、ソースも出して、つい。
  - say: お湯がソースの色になるの。で、それを湯切りで捨てるの。
  - say: 味は、薄かった。焼きそばの形をした、ほんのりソースのなにか。
  - chat: [説明書捨てる派, 裏の作り方読まないから]
  - say: 裏の作り方は、読んだの！ 番号まで振ってあって、ちゃんと読んだの。手が先に動いたの。
  - chat: [説明書捨てる派, 読んでもだめなら読まなくていいのでは]
  - say: 読んでもだめなら読まなくていい……それ、今日は言い返せないね。
  - chat: [定時退社したい, マヨネーズかければいける]
  - say: マヨネーズかければいける？ かけた。マヨネーズの味になった。
  - say: で、捨てたお湯のほうが、ちゃんとソースの匂いがしたの。流しから。いい匂いだった。悔しかった。
# 流しの前で立って食べる
- - say: で、立ったまま食べたの。流しの前で。
  - chat: [実家に帰れてない, 座りなよ]
  - say: 座りなよ、って言われても、一人のときは座らないの。座ると、ちゃんとしたご飯みたいになるから。
  - say: 洗い物も、容器と箸だけで済むし。
  - chat: [手帳は三冊目, 鍋から直接食べる人もいる]
  - say: 鍋から直接？ それはまだやってない。まだね。
  - say: でもね、食べ終わって、流しの容器を見たら、急に虚しくなったの。
  - chat: [定時退社したい, 来るよね、あれ]
  - say: 来るよね、あれ。底にちょっとだけソースの色が残ってて。
  - chat: [実家に帰れてない, お母さんに言ったら怒られそう]
  - say: お母さんに言ったら、怒られる。母には「ちゃんと座って食べてる」って言ってるから。
  - say: 実家だとね、立って食べてると「お行儀」って一言だけ言われるの。今でも流しの前で、その声がちょっと聞こえる。
# 脇道：コンビニのレジ横と、冷凍のご飯
- - chat: [名無しの使い魔, コンビニで何か買えばよかったのに]
  - say: コンビニで買えばよかった？ 行くのが面倒だったの。行ったら行ったで、レジ横で揚げ鶏を買っちゃうし。
  - chat: [夜勤明けの人, セブンの揚げ鶏うまい]
  - say: セブンの揚げ鶏、おいしいよね！ ななチキじゃなくて、揚げ鶏のほうね。
  - chat: [ポイントで生きてる, からあげクン一択]
  - say: からあげクン一択？ それもいいね。あれは箱に楊枝が付いてるのがえらいの。
  - say: でね、冬に揚げ鶏と、おでんの大根を買ったことがあって。
  - say: 帰って、おでんを器に移してるうちに、揚げ鶏が冷めちゃって。
  - say: どっちも熱いうちに食べたいのに、一人だと順番にしか食べられないの。手が二本しかないから。
  - chat: [夜勤明けの人, ご飯は炊いてないの？]
  - say: ご飯は、冷凍してあるよ。三合炊いて、一膳ずつラップして凍らせてるの。
  - say: でもね、一回失敗したの。一合だけ炊こうとして、水を二合の線まで入れちゃって。
  - chat: [手帳は三冊目, おかゆになるやつ]
  - say: そう、おかゆになるやつ。熱もないのに、三日おかゆを食べたよ。
  - say: 一人だと、何を作っても三日かかるの。カレーも三日。
  - chat: [定時退社したい, カレーは三日目がうまい]
  - say: カレーは三日目？ 私は二日目がいちばんおいしいと思う。三日目はうどんにする。
  - say: カレーうどんにすると、また一回分増えるんだよね。
  - chat: [初見の旅人, 永遠に終わらない]
  - say: 永遠に終わらない、そう、終わらないの。……あれ、何の話だっけ。焼きそば？
  - chat: [毎朝おはよう係, 夜中のお菓子の話しようとしてた]
  - say: 夜中のお菓子の話しようとしてた？ してないよ。今あんたが振ったんでしょ。いいよ、しよう。
# 脇道：夜中のお菓子
- - chat: [毎朝おはよう係, じゃあ聞く。夜中にお菓子開ける？]
  - say: 夜中にお菓子開けるか。開ける。開けるときにね、「半分だけ」って声に出して言うの。
  - chat: [夜勤明けの人, 守れた？]
  - say: 守れたか？ 守ったことない。
  - say: この前は、半分のところでクリップで袋を止めたの。
  - say: クリップ外すのに、三分かからなかった。
  - chat: [初見の旅人, 何のお菓子？]
  - say: 柿の種だよ、旅人。亀田の。
  - chat: [定時退社したい, ピーナッツが減ったやつ]
  - say: ピーナッツが減ったやつ、そう！ 柿の種とピーナッツの割合、昔は六対四だったのが、2020年に七対三になったの。
  - chat: [名無しの使い魔, 投票で決めたんだよね]
  - say: 投票で決めた、そう、お客さんの投票で。七対三がいちばん多かったんだって。
  - chat: [夜勤明けの人, 自分は六対四に一票入れたかった]
  - say: 六対四に一票入れたかった？ ピーナッツ派だね。私は変わる前の袋を一つ取っておいて、新しいのと並べたの。
  - chat: [ポイントで生きてる, 数えたの？]
  - say: 数えたか？ 数えた。ちゃんとピーナッツ減ってた。
  - say: 数えたあとは、全部食べた。両方。
  - ask:
      q: 夜中にお菓子の袋、開けちゃう？
      options:
      - c: 開ける。一袋いく
        r:
        - '{from}は一袋いく。正直だね。私もそっち側。'
        - 朝に空の袋を見て、静かになるやつね。
      - c: 半分でやめられる
        r:
        - '{from}、半分でやめられるの？ すごい。どうやってるの？'
        - 私はクリップを止めて、三分で外したよ。コツがあったら教えて。
      - c: 夜中は食べない
        r:
        - '{from}は夜中は食べない。意志が強い。'
        - 私も昔はそうだった気がする。いつからこうなったのか覚えてない。
      npc: [[夜勤明けの人, 0], [ポイントで生きてる, 0], [毎朝おはよう係, 2], [定時退社したい, 1], [手帳は三冊目, 0]]
  - chat: [ポイントで生きてる, 夜中に食べると太るよ]
  - say: 夜中に食べると太る、知ってる。でも、ここは夜型が多いから、みんな同じでしょ。
  - chat: [名無しの使い魔, 冷凍の焼きおにぎりもやばい]
  - say: 冷凍の焼きおにぎり、やばい！ ニッスイの大きいの。私は二個いくの。
  - say: 一個だと、なんか足りないの。二個だと多いんだけど。
  - say: 一個半にできたらいいのに。半分に割って冷凍庫に戻すと、次に見たとき、なんでこれ半分なのって自分で思うの。
# 脇道：次の朝の胃と、健康診断
- - chat: [夜勤明けの人, 次の朝、胃にこない？]
  - say: 次の朝、胃に？ くる。夜食の次の朝は、胃が重いの。
  - say: 私、胃が弱いの。たぶん夜食のせいなんだけど。
  - chat: [定時退社したい, 分かってるならやめよう]
  - say: 分かってるならやめよう、って。やめられたら苦労しないの。
  - chat: [手帳は三冊目, 健康診断は大丈夫？]
  - say: 健康診断は、それがね、今年は胃で「要経過観察」が付いたの。
  - chat: [初見の旅人, 要経過観察って？]
  - say: 要経過観察はね、すぐ病院ってほどじゃないけど、気をつけて様子を見てね、っていう印。
  - say: 毎年一個だけ付くの。去年はコレステロール、一昨年は視力。
  - say: 毎年違うの。毎年同じなら気をつけようがあるのに、毎回ちがうところに来るの。
  - chat: [夜勤明けの人, 今年は胃だったんだ]
  - say: そう、今年は胃。去年の結果も一緒に出して見ちゃった。並べても、何も分からなかったけど。
  - chat: [名無しの使い魔, 健康診断の封筒、開けるの怖い]
  - say: 健康診断の封筒、怖いよね。しかも一枚目は、だいたい身長と体重なの。悪い知らせは三枚目くらいにある。
  - chat: [定時退社したい, 三枚目までめくる勇気]
  - say: 三枚目までめくる勇気？ 私はね、後ろからめくるの。先に悪いほうを見たいから。
  - chat: [手帳は三冊目, 説明書と同じ読み方だ]
  - say: 説明書と同じ読み方、そうかも。でも胃の結果を見たあとも、夜食はやめてないの。
  - say: だめだよね。今日も食べたし。
# 終わり：今日しゃべった人
- - chat: [実家に帰れてない, 今日は誰かとしゃべった？]
  - say: 今日、誰かとしゃべったか？ えっとね。
  - say: お昼に行ったセブンの店員さんと、郵便の人。
  - say: 郵便の人には「ご苦労さまです」って言った。店員さんには「袋いりません」。
  - chat: [ポイントで生きてる, それ会話？]
  - say: それ会話？ って、会話だよ。向こうも「ありがとうございます」って言ってくれたもん。
  - say: 二人。あと今、みんな。
  - chat: [毎朝おはよう係, みんなも入れていいよ]
  - say: みんなも入れていいの？ じゃあ多いね、今日は。
  - chat: [定時退社したい, 休みの日、夜に初めて出した声が「あ」だったことある]
  - say: 夜に初めて出した声が「あ」。ある。宅配が来て「あ、はい」って言ったら、声がかすれてたの。
  - chat: [手帳は三冊目, 独り言は数に入る？]
  - say: 独り言は数に入るか。どうだろうね。湯切りの「せーの」は入れたくないな。
  - chat: [ポイントで生きてる, 入れなよ]
  - say: 入れなよ、って。まあいいや。そろそろ寝るね。流しの容器、洗ってから。おやすみ。
