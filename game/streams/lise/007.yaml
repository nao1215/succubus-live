title: ゲームボーイとスーファミで、動く絵は横に何枚まで並べられた？
family: true
lobby:
- 前に、ファミコンは動く絵を横に8枚までって話をしたでしょう。
- 今日はゲームボーイとスーファミの場合。
- 修学旅行で、ゲームボーイを先生に取られた話もするわ。
parts:
# 入り（電池の蓋）
- - say: こんばんは。今日はね、ゲームボーイを持ってきたの。初代の。
  - chat: [毎朝おはよう係, こんばんは]
  - chat: [レトロゲー老人, 初代！ まだ動くの？]
  - say: まだ動くのかって、動くわよ。私の持ってる物の中で、たぶん一番古いの。
  - chat: [ログボだけ勢, 裏の電池の蓋ある？]
  - say: 電池の蓋は、ない。二回なくしたの。
  - chat: [ログボだけ勢, 二回w]
  - say: 二回よ、笑わないで。一回目は友達のお古の蓋をもらって、二回目でもう諦めたわ。
  - say: 今はテープで留めてる。
  - chat: [レトロゲー老人, それ初代あるあるだわ]
  - say: 初代あるあるなのね。よかった、私だけじゃなくて。
  - chat: [初見のこぐま, 初見です。ゲームボーイって電池なの？]
  - say: こぐまさん、いらっしゃい。ゲームボーイは電池なのかって、そうよ、単三を四本入れるの。
  - say: 台風の日とか、停電に備えて他の機械は全部充電するんだけど、これだけは電池を並べるの。
  - chat: [初見のこぐま, 停電したの？]
  - say: 停電は、しなかったわ。充電したぶん全部遊んで、台風が過ぎる前に寝ちゃった。
# 本題の入り（ゲームボーイは横に十枚）
- - say: で、今日はこの子の絵の話をしたかったの。
  - say: ファミコンは、動く絵を横一列に八枚までだったでしょう。
  - chat: [初見のこぐま, 知らない]
  - say: こぐまさんは知らないのね。大丈夫。昔のゲーム機って、横に並べられる絵の数が決まってたの。
  - say: それを超えると、はみ出した分は描かれないのよ。
  - chat: [初見のこぐま, 消えるってこと？]
  - say: 消えるってこと、そう、消えるの。それでチカチカしたりしてたのよ。
  - say: で、ゲームボーイは、横一列に十枚まで。全部で四十枚。
  - chat: [ログボだけ勢, ファミコンより二枚多い]
  - say: そう、ファミコンより二枚多い。ちょっとだけ余裕があるの。
  - chat: [物理演算の民, その代わり落とし穴あるよね]
  - say: 落とし穴、あるの。それ言いたかったのよ。
  - say: 使わない絵を隠すとき、横にずらして画面の外に出すでしょう。
  - say: そうやって外に出しても、十枚のうちの一枚に数えられちゃうの。
  - chat: [初見のこぐま, 見えてないのに？]
  - say: 見えてないのに、よ。画面の外にいるのに、席だけ取ってるのよ。
  - chat: [物理演算の民, だから縦に外す]
  - say: そう、縦に外すの。下に追い出す。それなら席を取らないから。
  - chat: [コマ送り勢, 横で隠そうとしてハマったことある]
  - say: 横で隠そうとしてハマった？ 私も。二回ハマったわ。同じことで。
  - chat: [コマ送り勢, 二回は多い]
  - say: 二回は多いって言われても、一回目で覚えたつもりだったのよ。
  - chat: [初見のこぐま, 何作ってたの？]
  - say: 何を作ってたかっていうと、小さいゲームよ。ゲームボーイで、寝てる羊を数えるだけのやつ。
  - chat: [ログボだけ勢, 寝るためのゲームw]
  - say: そう、寝るためのゲーム。羊が十一匹並ぶと、一匹消えるの。で、また悩んだのよ。
  - chat: [初見のこぐま, 十枚までだから？]
  - say: そう、十枚までだから。覚えるの早いわね。
  - chat: [ログボだけ勢, 完成した？]
  - say: 完成した？ してないわ。三匹目くらいで私が寝ちゃうもの。
# 脇道（修学旅行と通信ケーブル）
- - chat: [ログボだけ勢, ゲームボーイって修学旅行で持ってった？]
  - say: 持って行ったわよ、修学旅行。京都。
  - say: 夜、宿で友達と通信ケーブルつないで対戦してたの。
  - chat: [レトロゲー老人, 先生に見つかるやつ]
  - say: 先生に見つかるやつ、そう、見つかったわ。ケーブルを取られたの。
  - chat: [初見のこぐま, 本体も？]
  - say: 本体は無事。ケーブルだけ。最終日に返してもらえたわ。
  - say: でもね、帰りのバスで、先生がテトリスやってたの。
  - chat: [ログボだけ勢, 先生w]
  - chat: [定時退社したい, 没収したケーブルで？]
  - say: 没収したケーブルで？ そこまでは分からないわ。でも見てたのよ、私。
  - say: 言わなかったけど、ずっと覚えてる。
  - chat: [処理落ち愛好会, テトリスなら今パソコンでもできるよ]
  - say: テトリスなら今パソコンでも、できるわね。私、パソコンで文字を書くソフトの中に入ってるテトリスで遊んでるもの。
  - chat: [初見のこぐま, 文字を書くソフトにテトリス？]
  - say: そう、文字を書くソフトにテトリス。emacsっていうの。中にテトリスが最初から入ってるのよ。
  - say: しかも、勝手にテトリスを遊んでくれる仕組みも足せるの。
  - chat: [ログボだけ勢, 自動テトリスw]
  - say: 自動テトリス、入れたら、寝てる間もずっと積んでくれてたわ。
  - chat: [処理落ち愛好会, それ遊んでるって言う？]
  - say: それ遊んでるって言うか？ 言わないかもね。見てもいないもの。でも気分はいいのよ。
  - chat: [処理落ち愛好会, ノクスさんはvimだっけ]
  - say: そうそう、ノクスはvim。ノクスにemacsの話をすると、小声で何か言われるの。聞こえないけど。
  - chat: [喫茶店の常連, 修学旅行は奈良だった]
  - say: 常連さんは奈良なのね。鹿にせんべい取られた？
  - chat: [喫茶店の常連, 取られた。袋ごと]
  - say: 袋ごと。鹿の方が先生より手が早いわね。
  - chat: [温泉ソムリエ, うちは北海道]
  - say: 北海道、いいわね、寒そうだけど。私なら宿から出ないわ。
  - ask:
      q: 修学旅行、どこに行った？
      options:
      - c: 京都・奈良
        r:
        - 京都か奈良ね、{from}。私と同じ。夜、何か取られなかった？
      - c: 東京・関東
        r:
        - 東京の方ね、{from}。遊ぶ所が多くて、先生も大変そう。
      - c: 北海道・沖縄
        r:
        - 遠いのね、{from}。飛行機で寝られた？
      - c: 海外
        r:
        - 海外なの、{from}？ すごい。私は国内でも寝てたのに。
      npc: [[喫茶店の常連, 0], [温泉ソムリエ, 2], [ログボだけ勢, 1], [レトロゲー老人, 0], [定時退社したい, 1], [初見のこぐま, 2]]
  - say: きれいに分かれたわね。京都と奈良も、東京も、北海道と沖縄も同じくらい。
  - chat: [初見のこぐま, で、ゲームボーイの話は？]
  - say: ゲームボーイの話、そうだった。十枚の続きね。
# 戻る（初代とカラーで重なり方が違う）
- - chat: [物理演算の民, 初代とカラーで重なり方違うよね]
  - say: 初代とカラーで重なり方が違う、そう、次はそれ。
  - say: 絵が二枚重なったとき、どっちが手前に来るか。
  - say: 初代のゲームボーイは、左にいる方が手前なの。
  - say: カラー用に作ったソフトだと、番号の若い方が手前。
  - chat: [初見のこぐま, じゃあ古いソフトをカラーで遊んだら変わる？]
  - say: 古いソフトをカラーで遊んだら変わるか？ 変わらないの。昔のソフトを動かすときは、カラーも初代と同じ決め方で描くのよ。
  - chat: [ログボだけ勢, 引っ越したら家のルールが違う感じ]
  - say: カラー用のソフトなら、ね。古いソフトは、引っ越しても前の家のルールで暮らしてるの。
  - say: 引っ越したら家のルールが違う、そんな感じね。私も城に来たとき、廊下で寝て怒られたもの。
  - chat: [ログボだけ勢, それはどこでも怒られる]
  - say: どこでも怒られる、って、そうかしら。前の家では怒られなかったのよ。
  - chat: [エラッタ収集家, 初代は他にも壊れ方がありますよね]
  - say: 初代のほかの壊れ方、あるわね。ある命令の使い方をすると、絵の表が壊れちゃうの。初代だけ。
  - say: カラーでは直ってるのよ。
  - chat: [初見のこぐま, 初代、壊れやすい]
  - say: 初代、壊れやすいのよ。電池の蓋もなくなるし。
# また飛ぶ（スーファミは三十二枚、私の挫折）
- - chat: [レトロゲー老人, スーファミは？]
  - say: スーファミになると、ぐっと増えるの。横一列に三十二枚。
  - chat: [初見のこぐま, 急に増えた]
  - say: 急に増えたでしょう。でもね、今度は別の上限があるの。
  - say: 大きい絵は、細かいかけらを何個も組み合わせて作ってるのよ。
  - say: そのかけらが、一列に三十四個まで。
  - chat: [初見のこぐま, 枚数は大丈夫でも、かけらが足りなくなる？]
  - say: そう、かけらが足りなくなる。大きい子が並ぶと、枚数より先に足りなくなるの。
  - chat: [喫茶店の常連, 大食いの客が来ると皿が足りないみたいな]
  - say: 大食いの客が来ると皿が足りない、そうそう、そんな感じ。
  - say: あとね、スーファミは、どの絵から優先するか、始まりの番号を選べるようになったの。
  - chat: [レトロゲー老人, ファミコンで手でやってたやつか]
  - say: そう、ファミコンで手でやってたやつ。ファミコンは名簿ごと並べ替えてたけど、スーファミは番号を一つ書き換えればいいの。
  - chat: [初見のこぐま, 自動で回してくれるの？]
  - say: 自動で回してくれる？ 自動じゃないわ。毎回その番号を変えるのは、作る人の仕事よ。でも楽にはなったの。
  - say: 私ね、スーファミのゲームを自分で作ろうとしたことがあるの。三回。
  - chat: [ログボだけ勢, 三回とも？]
  - say: 三回とも、途中でやめたわ。
  - say: 絵の位置を書いておく表が、二つに分かれてて、小さい方の表がややこしいの。
  - chat: [エラッタ収集家, 上位テーブルですね]
  - say: そう、上位テーブル。そこで毎回止まったのよ。
  - chat: [初見のこぐま, また挑戦するの？]
  - say: また挑戦、ね。どうかしら。四回目は、起きてるときにやるわ。
# 脇道（毎回全部送り直す）
- - chat: [処理落ち愛好会, ファミコンの方は絵の表を毎回送り直すんだよね]
  - say: 毎回送り直す、そう。ファミコンの絵の表って、ほうっておくと中身が崩れるの。
  - say: だから画面を描くたびに、全部書き直してるのよ。一秒に六十回。
  - chat: [初見のこぐま, 大変そう]
  - say: 大変そう、でしょう。でも、一気に送る専用の仕組みがあるの。
  - say: 一個ずつ手で書くより、四倍くらい速いのよ。
  - chat: [ログボだけ勢, 毎日全部言い直さないと覚えられない子]
  - say: 毎日全部言い直さないと覚えられない子？ 言い方。でもそうね。
  - chat: [ログボだけ勢, リゼみたい]
  - say: リゼみたいって何よ。私は言い直されても覚えないわ。
# 脇道（カラオケの十八番、ポケモン言えるかな）
- - chat: [温泉ソムリエ, ゲームボーイといえばポケモン]
  - say: ゲームボーイといえばポケモン、そうね。カラオケで歌うの、「ポケモン言えるかな？」なのよ、私。
  - chat: [初見のこぐま, あれ全部言えるの？]
  - say: 全部は言えたことないの。いつも八十匹目くらいで寝ちゃう。
  - chat: [ログボだけ勢, カラオケで寝るな]
  - say: カラオケで寝るなって言われても、一人カラオケだと誰も起こしてくれないのよ。で、そのまま延長になるの。
  - chat: [温泉ソムリエ, 延長料金w]
  - say: そう、延長料金。寝てる時間にお金払ってるの。ちょっと悔しいわ。
  - chat: [喫茶店の常連, 私の十八番はアニソン]
  - say: 十八番はアニソン？ いいわね。何のアニメ？
  - chat: [喫茶店の常連, 内緒]
  - say: 内緒なの？ 気になるじゃない。
  - chat: [定時退社したい, 会社のカラオケは昭和歌謡しか歌えない]
  - say: 会社のカラオケは昭和歌謡しか、って。上の人に合わせてるのね。大変ね。
  - chat: [定時退社したい, もう慣れた]
  - say: 慣れたのね。私は合わせるくらいなら寝るわ。
  - ask:
      q: カラオケで歌うのは？
      options:
      - c: アニソン・ゲームの曲
        r:
        - アニソンね、{from}。仲間。全部言えるやつ、ある？
      - c: J-POP
        r:
        - J-POPね、{from}。みんな知ってるから盛り上がるわね。
      - c: 懐メロ
        r:
        - 懐メロなの、{from}。上の人と行くと助かるわね、きっと。
      - c: 歌わない
        r:
        - 歌わないのね、{from}。聞く係も大事よ。私は寝る係だけど。
      npc: [[喫茶店の常連, 0], [定時退社したい, 2], [温泉ソムリエ, 1], [ログボだけ勢, 3], [初見のこぐま, 1], [レトロゲー老人, 0]]
  - say: アニソンとJ-POPが同じくらいね。アニソンが強いの、この配信っぽいわ。
  - chat: [喫茶店の常連, で、内緒のアニメはね]
  - say: 内緒のアニメ、言うの？ 待ってたのよ。
  - chat: [喫茶店の常連, やっぱり内緒]
  - say: やっぱり内緒？ ずるいわね。じゃあ、次まで気にしておくわ。
# 締め
- - chat: [初見のこぐま, ゲームボーイ欲しくなった]
  - say: ゲームボーイが欲しくなった？ 中古で探すなら、裏の電池の蓋があるか見てね。
  - say: 私みたいに、テープで留めることになるから。
  - chat: [レトロゲー老人, 蓋だけ売ってるよ]
  - say: 蓋だけ売ってるの？ じゃあ今度、三個買っておくわ。またなくすから。
  - chat: [ログボだけ勢, 三個目もなくしそう]
  - say: 三個目もなくしそうって、なくすわね、たぶん。
  - say: 今日はここまで。次は何にしようかしら。また考えておくわ。
  - say: おつかれさま。ゲームボーイの電源、切ってから寝るわね。
