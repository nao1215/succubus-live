title: ゲームのバグを9回報告しても、名前が載らなかった
lobby:
- ゲームのバグを見つけて、作った会社に知らせるのが趣味なの。
- 9回送って、お知らせに名前が載ったことは一度もないの。だいたい誰かが先に送ってるのよ。
- 今日はその話と、なぜか二日続いたカレーの話。
parts:
# 入り（寝言の「重複です」、グループLINE）
- - say: こんばんは。今日はちゃんと起きてるわ。たぶん。
  - chat: [毎朝おはよう係, こんばんは]
  - chat: [ログボだけ勢, たぶんかよ]
  - say: 「たぶんかよ」って言わないで。聞いて。エラに言われたんだけど、私、寝言で「重複です」って言うらしいの。
  - chat: [ログボだけ勢, 寝ても仕事してるw]
  - say: 寝ても仕事？ してないわよ。夢の中でも二番目なのよ、たぶん。
  - say: エラが録音しようとしたから、録ったらクビよって言ったの。
  - chat: [喫茶店の常連, 録ってないの？]
  - say: 録ってないわ。でもあの子、真顔でまねできるようになったの。
  - say: それが一番似てるのよ。腹が立つくらい。
  - chat: [ログボだけ勢, エラさんのまね聞きたい]
  - say: エラのまねが聞きたい？ だめ。で、この前ね、寝ぼけてグループLINEに「重複です」って送っちゃったの。
  - chat: [夜勤明けの人, 誰のグループ？]
  - say: 誰のグループかって、モーラとエラと私の。ちょうど二人が夕飯の相談をしてたの。
  - say: そしたらモーラが「カレーが重複ってこと？」って。
  - chat: [ログボだけ勢, 話が勝手に進んだ]
  - say: そう、話が勝手に進んだのよ。で、本当にカレーが二日続いたの。
  - chat: [喫茶店の常連, 寝言で献立決めてる]
  - say: 寝言で献立を決めてる、って。決めた覚えはないのよ。二日目もおいしかったけど。
# 脇道（カレーの辛さ）
- - chat: [喫茶店の常連, カレー何辛派？]
  - say: 私は甘口。辛いと水を取りに立つ回数が増えるの。
  - chat: [温泉ソムリエ, 子ども舌]
  - say: 子ども舌でいいの。立たなくていいのが大事なの。
  - say: 温泉卵を乗せると、もっと甘くなるのよ。
  - chat: [ログボだけ勢, 甘口に温玉は甘々すぎ]
  - say: 甘々すぎ？ 甘々でいいの。寝る前に食べるんだもの。
  - say: 家のは、エラが辛口なの。だから二つ鍋を作ってくれるのよ。
  - chat: [夜勤明けの人, エラさん大変]
  - say: エラさん大変、ね。大変よね。私は運ばれてくるのを待ってるだけ。
  - chat: [夜勤明けの人, 手伝いなよ]
  - say: 手伝いなよって、手伝ったことはあるのよ。じゃがいもの皮むき。
  - say: むいてる途中で寝て、ピーラーを持ったまま起きたの。
  - chat: [ログボだけ勢, 危ない]
  - say: 危ないって、エラにもそう言われて、それから台所に入れてもらえないの。
  - chat: [喫茶店の常連, 狙ってやったでしょ]
  - say: 狙ってないわ。結果がよかっただけ。
  - say: 外で食べるなら、ココイチの出前ね。台所に立たなくていいから。
  - chat: [喫茶店の常連, 店に行かないんだw]
  - say: 店には行かないわ。出前は寝てても来るもの。
  - chat: [温泉ソムリエ, 甘口に後から一味足すのが一番]
  - say: 甘口に後から一味？ 足すの？ 甘口の意味がなくなるじゃない。
  - chat: [温泉ソムリエ, 自分で辛さを決められる]
  - say: 自分で辛さを決められる、って。決めるのが面倒なのよ。私は最初から甘口でいいわ。
  - ask:
      q: カレーの辛さ、どれにする？
      options:
      - c: 甘口
        r:
        - 甘口ね、{from}。仲間。温泉卵も乗せてみて。
      - c: 中辛
        r:
        - 中辛ね、{from}。ちょうどいいってやつね。
      - c: 辛口
        r:
        - 辛口なのね、{from}。エラと同じ側。
        - 私なら水を三回取りに行くわ。
      - c: 激辛
        r:
        - 激辛なの、{from}？ 見てるだけで汗が出るわ。
      npc: [[喫茶店の常連, 1], [温泉ソムリエ, 2], [ログボだけ勢, 0], [夜勤明けの人, 1], [レトロゲー老人, 3]]
  - say: 中辛が多いのね。みんな大人ね。
  - chat: [初見のペンギン, 初見です。重複って何の話だったの？]
  - say: ペンギンさん、いらっしゃい。重複って何の話か、そう、今からその話。
# 本題（九件目の報告）
- - say: 私ね、ゲームのバグを見つけたら、作った会社に知らせてるの。
  - say: 2019年から九件送って、返事は全部「重複です」とか「もう知ってます」。
  - chat: [初見のペンギン, 先に誰かが送ってるってこと？]
  - say: そう、先に誰かが送ってるの。毎回、私は二番目なの。
  - chat: [朝五時の報告者, こんばんは。その節はどうも]
  - say: 「その節はどうも」。ほら出た。この人よ、私の前によくいるの。
  - chat: [初見のペンギン, 本人いるのw]
  - say: 本人いるのよ、毎回。朝五時に起きてバグを報告してる人なの。
  - chat: [朝五時の報告者, 九件目は何だったんですか]
  - say: 九件目は何だったか、聞くのね。いいわ、話す。
  - say: あるゲームの、ガチャの履歴の画面。
  - say: 自分の履歴を開くアドレスの、最後の番号を一つ変えたら。
  - say: 他の人の履歴が見えたの。
  - chat: [規約は同意だけ, 他人のガチャ見れるの面白そう]
  - say: 他人のガチャが見れて面白そう？ 面白くないわ。何をいくら回したか、全部見えるのよ。あなたのも。
  - chat: [規約は同意だけ, それは嫌だ]
  - say: 嫌でしょう。だから、これは急いで知らせなきゃって思ったの。
  - chat: [初見のペンギン, どうやって見つけたの]
  - say: 見つけ方？ 恥ずかしいんだけど、自分の履歴を見ようとして、寝ぼけて番号を打ち間違えたの。
  - say: そしたら知らない人の、すごい回数の履歴が出てきて、目が覚めたわ。
  - chat: [ログボだけ勢, また眠気が見つけてる]
  - say: また眠気が見つけてる、そうなのよ。見つけたのが夜中の三時。
  - say: で、報告を半分書いて、寝たの。
  - chat: [ログボだけ勢, 知ってた]
  - say: 「知ってた」わよね。起きたら、四十分前に誰かが送ってたわ。
  - say: {face: annoyed, text: 「重複です」。}
  - chat: [エラッタ収集家, その声なんですか]
  - say: 何その声って、重複を読むときの声。もう慣れちゃったの。
  - chat: [朝五時の報告者, 今回は私じゃないです]
  - say: 今回は私じゃない、知ってるわ。前のはあなただったけどね。
  - chat: [初見のペンギン, 前のって？]
  - say: 前のっていうのは、三年前。同じ品物を二回もらえる穴を見つけて、また半分書いて寝たの。
  - say: 起きたら、この人が三分先に送ってた。
  - chat: [初見のペンギン, 三分w]
  - say: 三分よ、笑うでしょう。修正のお知らせに名前が載ったのは、向こう。
  - chat: [朝五時の報告者, その節はどうも]
  - say: {face: annoyed, text: その節って言わないで。}
# 脇道（題だけ書いて寝る）
- - chat: [朝五時の報告者, 先に題と再現の手順だけ出せば、寝ても間に合いますよ]
  - say: 先に題と手順だけ出せ、って。分かってるのよ。分かってるの。
  - say: でも題を書くと、もう寝ていい気がするのよ。
  - chat: [ログボだけ勢, 分かる。題書いたら仕事した気になる]
  - say: 題を書いたら仕事した気になる、でしょう。分かってくれる人がいて嬉しいわ。
  - chat: [定時退社したい, 会社の報告書もそれ]
  - say: 会社の報告書もそれ？ 世の中みんなそうなのね。
  - chat: [定時退社したい, 題だけのファイルが十個ある]
  - say: 題だけのファイルが十個。私より多いわ。安心した。
  - chat: [朝五時の報告者, 次は一緒に出しましょう]
  - say: 次は一緒に、ね。考えておくわ。考えるだけかもしれないけど。
  - chat: [初見のペンギン, なんでそこまでして報告するの]
  - say: ペンギンさん、なんでそこまで、ね。お金はほとんど出ないの。出ても図書カード。
  - say: 欲しいのは、お知らせの一行よ。「見つけてくれた人」って、名前が一回載ってほしいの。
  - chat: [ログボだけ勢, 一回くらい載ってほしいな]
  - say: 一回くらい載ってほしい、って。ありがと。載ったら、みんなに見せびらかすわ。
  - say: 生まれ変わったら、ゲーム会社の中でバグを探す係になりたいのよ。
  - say: 中にいれば、誰より先に見つけられるでしょう。
  - chat: [朝五時の報告者, 中の人も重複しますよ]
  - say: {face: annoyed, text: 中の人も重複する？ そういう夢のないこと言わないで。}
# 脇道（バグはいつも夜中に見つかる、二度寝の会）
- - chat: [初見のペンギン, バグってどうやって見つけるの？]
  - say: バグをどうやって見つけるか。だいたい夜中よ。眠くて、変なボタンの押し方をしたときに出るの。
  - say: 起きてるときは、ちゃんと遊んじゃうから見つからないのよ。
  - chat: [ログボだけ勢, 眠気が才能]
  - say: 眠気が才能。そう言ってもらえると助かるわ。
  - say: 私ね、昔のゲームのバグを探す三人の集まりにいるの。名前は「二度寝」。
  - chat: [初見のペンギン, 名前w]
  - say: 一人は毎回寝坊する人、一人は毎回私を起こす係の人。で、私。
  - chat: [レトロゲー老人, 起こす係がいないと成立しない会]
  - say: 起こす係がいないと成立しない会、そうなの。その係の人がいなかったら、とっくに解散してるわ。
  - say: 去年、集まりで発表する番が回ってきたの。
  - chat: [ログボだけ勢, 嫌な予感]
  - say: 嫌な予感、当たり。寝坊したわ。起こす係の人の電話、何回も鳴ってたって。
  - chat: [夜勤明けの人, それで起きないのはすごい]
  - say: 出番は飛ばされて、次の人が発表してたわ。毎回寝坊する方の人が。
  - chat: [初見のペンギン, その人は起きれたんだ]
  - say: そう、その人は起きれたの。その日だけ起きたのよ。ずるいでしょう。
  - ask:
      q: ゲームでバグを見つけたことある？
      options:
      - c: ある、報告もした
        r:
        - 報告までしたのね、{from}。先に送ってくれた人かもしれないわね、私の。
      - c: 見つけたけど黙ってた
        r:
        - 黙ってたの、{from}。まあ、普通はそうよね。
        - 次は送ってみて。私より早く。いや、やっぱり遅く。
      - c: バグで遊んだ
        r:
        - 遊んだのね、{from}。一人で遊ぶゲームなら、それも楽しみ方よ。
      - c: ない
        r:
        - ないのね、{from}。私が変な押し方しすぎなのかしら。
      npc: [[朝五時の報告者, 0], [レトロゲー老人, 2], [ログボだけ勢, 1], [初見のペンギン, 3], [RTA走者見習い, 2]]
  - say: バグで遊んだ人、けっこういるのね。そうよね、楽しいもの。
# また飛ぶ（仮置きの絵と、賞の取り消し）
- - chat: [切り抜き職人A, 重複じゃないけど、去年の賞の取り消しの話思い出した]
  - say: 賞の取り消し？ あ、クレール・オブスキュールでしょう。去年の十二月の。
  - chat: [初見のペンギン, 何があったの？]
  - say: すごく売れたRPGがあってね。インディー・ゲーム・アワードっていう賞で、大賞と新人の賞を取ったの。
  - say: それが、二日後に取り消されたの。
  - chat: [初見のペンギン, なんで]
  - say: なんでかっていうと、主催の説明だと、応募のときに「生成AIは使ってない」って答えてたから、だって。
  - say: 発売したころ、柱に貼ってあるポスターの絵に、仮置きのAIの絵が残ってたの。
  - chat: [初見のペンギン, 仮置きって？]
  - say: 仮置きっていうのは、とりあえず置いとく絵のこと。あとで本物に替えるつもりのやつ。
  - say: 発売してすぐ差し替えたそうだけど、賞は別の作品に回ったの。
  - chat: [定時退社したい, 仮のやつって本番まで残るよね]
  - say: 仮のやつ、本番まで残るのよ。私も昔、仮置きのドクロの絵を残したまま売ったことあるもの。
  - chat: [ログボだけ勢, ドクロの話また聞きたい]
  - say: ドクロの話をまた聞きたい？ それは前にしたでしょう。今日はしないわ。
  - say: 私、あのゲーム自体は好きなのよ。だから笑えなかったわ。
# 締め
- - chat: [初見のペンギン, で、結局ガチャの穴は直ったの？]
  - say: ガチャの穴は、直ったわ。もう他の人のは見えないの。
  - say: 私のおかげじゃないけど。まあ、直ったならいいわ。
  - chat: [朝五時の報告者, 念のため、送ったのは私じゃないです]
  - say: 「送ったのは私じゃないです」。分かったってば。さっきも聞いたわ。
  - chat: [喫茶店の常連, 今日の夕飯は？]
  - say: 今日の夕飯？ 聞かないで。今日もたぶんカレー。三日目。
  - chat: [温泉ソムリエ, 三日目のカレーが一番うまい説]
  - say: 三日目が一番うまい説、それは本当よ。甘口でも、三日目はちょっと辛くなる気がするの。
  - chat: [喫茶店の常連, 気のせいでは]
  - say: 気のせいでは、って。気のせいね。たぶん。
  - chat: [ログボだけ勢, 重複です]
  - say: {face: annoyed, text: 「重複です」って、あなたまで言わないで。}
  - say: 次は、私の好きなゲームと苦手なゲームの話をするわ。
  - say: おつかれさま。報告の続き、書いてから寝る。題だけで終わるかもしれないけど。
