title: 昔作ったボットが、19日でBANされた話
lobby:
- 昔、ネットのゲームで、代わりに遊んでくれるプログラムを書いたの。
- 19日で捕まったわ。なんで捕まったか、今日話す。
- お風呂上がりなの。髪がまだ濡れてる。
parts:
# 入り（お風呂上がり、入浴剤）
- - say: はい、映ってる。ごめんね、髪まだ濡れてるの。
  - chat: [毎朝おはよう係, こんばんは]
  - chat: [ログボだけ勢, 風呂上がりか]
  - say: こんばんは、おはよう係さん。そう、風呂上がり。湯船でうとうとしちゃって、ちょっと遅れたの。
  - chat: [夜勤明けの人, 湯船で寝るのは危ないって]
  - say: 湯船で寝るのは危ないって？ 分かってる。今日はエラに起こされたの。危なかったわ。
  - say: 次は、眠くなったら上がる。ほんとに。
  - chat: [温泉ソムリエ, 約束だよ]
  - say: 約束ね、する。エラにも見張られてるし。
  - chat: [ログボだけ勢, 風呂で何してたの]
  - say: 何してたかっていうと、バブが溶けるのを見てたの。シュワシュワいう音、ずっと聞いてられるのよ。
  - chat: [温泉ソムリエ, 入浴剤派か]
  - say: そう、入浴剤派よ。溶けきったら、もう出ていい合図にしてるの。
  - chat: [ログボだけ勢, 合図を待つのね]
  - say: そう、合図を待つの。今日はその話も少しするわ。
  - say: 洗うのは顔からよ。最初に寝ぼけてお湯をかけちゃうから。
  - chat: [温泉ソムリエ, 俺は頭から]
  - say: ソムリエさんは頭から？ 頭からの人、多いわよね。目が覚めそう。
  - ask:
      q: お風呂は、湯船につかる？
      options:
      - c: 毎日つかる
        r:
        - 毎日なのね、{from}。仲間。でも眠くなったら上がってね。
        - 私が言うのも変だけど。
      - c: たまにつかる
        r:
        - たまにね、{from}。つかる日は、入浴剤を入れたくなるでしょう。
      - c: シャワーだけ
        r:
        - シャワーね、{from}。早く寝られるならそれでいいわ。
      - c: 銭湯・温泉が好き
        r:
        - 銭湯や温泉ね、{from}。私は休憩室が目当てなの。
        - 畳の部屋でごろごろできるでしょう。あれが一番いいのよ。
      npc: [[温泉ソムリエ, 3], [夜勤明けの人, 2], [ログボだけ勢, 0], [毎朝おはよう係, 1], [レトロゲー老人, 1]]
  - say: たまにつかる人が多いのね。毎日の人もいるし、みんなちゃんとしてるわ。
  - chat: [温泉ソムリエ, 風呂上がりは何飲む派？]
  - say: 風呂上がりはコーヒー牛乳。いつもは紅茶なんだけど、お風呂上がりだけは別なの。
  - chat: [ログボだけ勢, コーヒーは目が覚めるから飲まないって言ってなかった？]
  - say: コーヒーは飲まないって言ってた？ 言ったわ。でもあれは、ほぼ牛乳だから。
  - chat: [ログボだけ勢, 都合がいい]
  - say: 「都合がいい」って、そうよ、都合がいいのよ、私は。で、今も手に持ってる。ほら。
  - chat: [温泉ソムリエ, 瓶じゃないのか]
  - say: 瓶じゃないの、紙パックよ。瓶は返しに行くのが面倒でしょう。
# 本題らしきもの（画面の上の帯）
- - chat: [初見の旅人, 初見です。今日は何の話？]
  - say: 初見さん、いらっしゃい。今日は何の話かっていうと、ゲームの話をちょっとしてから、昔の失敗の話。
  - say: スーパーマリオの画面の上、点数とかコインの数が出てる所、分かる？
  - chat: [初見の旅人, ある]
  - say: あるわよね。マリオが右に進んで画面が動いても、あそこは動かないでしょう。
  - chat: [ログボだけ勢, 言われてみれば止まってる]
  - say: そう、言われてみれば止まってる。上は止めて、下だけ動かしてるの。
  - say: でもファミコンは、今画面のどの高さを描いてるか、普通は教えてくれないのよ。
  - chat: [初見の旅人, じゃあどうやって分けてるの]
  - say: どうやって分けてるか。帯のコインのマークの所に、動く絵を一枚こっそり重ねてるの。
  - say: 画面を描いていってそこに来たら、「今ここ描いたよ」って合図が出るの。
  - say: 合図が来たら、「ここから下は動かして」って切り替えるのよ。
  - chat: [初見の旅人, コインが合図だったのか]
  - say: {face: smile, text: そう、コインが合図。くるくる光ってるだけに見えるでしょう。あれが目印なの。}
  - chat: [レトロゲー老人, スプライト0ヒットってやつね]
  - say: そうそう、スプライト0ヒット。0番の絵が当たったら合図、ってこと。
  - chat: [処理落ち愛好会, 合図来なかったらどうなるの]
  - say: 合図が来なかったら？ 待ち続けるの。ずっと。
  - say: 「合図が来るまで待つ」って書いてあるから、来ないと固まっちゃうゲームもあるのよ。
  - chat: [初見の旅人, 律儀]
  - say: 律儀よね、ほんと。私なら五分で帰って寝てるわ。
# 脇道（待つ → ボット）
- - say: あ、待つ話で思い出したわ。嫌なこと。
  - chat: [ログボだけ勢, なに]
  - say: なにって、昔、ボットを書いたの。
  - chat: [初見の旅人, ボットって？]
  - say: ボットっていうのはね、ゲームを代わりに遊んでくれる、小さいプログラム。
  - say: ネットのゲームでね。歩くのと回復するのを全部任せてたの。
  - say: 名前は「ねぼすけ一号」。
  - chat: [ログボだけ勢, 名前がもう本人]
  - say: 名前がもう本人って、いいでしょう。私が寝てる間に働いてくれる子よ。夢みたいでしょう。
  - say: やってたこと、さっきのマリオと同じなのよ。
  - say: 画面の体力のところの色を見て、赤くなるまで待つの。赤くなったら薬を飲む。
  - chat: [エラッタ収集家, 合図を待つ形は同じですね]
  - say: そう、形は同じ。待って、来たら動く。それだけ。
  - chat: [元・金策業者, 懐かしい。昔はみんなそれだった]
  - say: 「懐かしい、みんなそれだった」って、来たわね、元・業者。
  - chat: [元・金策業者, 元、って付けてくれるの助かる]
  - say: 「元」は付けるわよ。今は会社員なんでしょう。
  - say: ゲームのお金を本物のお金で売るのは、私は嫌いだけどね。昔話は聞くわ。
  - chat: [元・金策業者, それでいい]
# BAN
- - say: で、ねぼすけ一号は19日働いて、BANされたの。
  - chat: [初見の旅人, BANって？]
  - say: BANはね、アカウントごと、出入り禁止にされること。
  - say: 届いたのは、決まった文のメール一通だけ。
  - say: 「不正なプログラムの使用が確認されたため」。
  - say: {face: annoyed, text: 何で分かったのかは、書いてなかったのよ。}
  - chat: [ログボだけ勢, そりゃ書かないでしょ]
  - say: そりゃ書かない、わよね。分かるの。でも知りたかったの。
  - say: だから自分で調べたの。動いてるプログラムの中を覗く道具を覚えて。
  - chat: [初見の旅人, そこまでする？]
  - say: そこまでするのよ。楽をするための苦労なら、いくらでもするの。
  - say: で、分かったの。捕まった理由。
  - say: クリックの間隔が、毎回きっかり一秒だったの。
  - chat: [ログボだけ勢, 真面目すぎるw]
  - say: {face: smug, text: そう、真面目すぎたの。人間はそんなに真面目じゃないのよ。}
  - say: 私なんて、決まった時間に起きたことないのに。
  - say: 親より働き者だったせいで、捕まったの。
  - chat: [元・金策業者, 業者のは間隔をわざとバラしてた]
  - say: 業者は間隔をわざとバラしてた？ でしょうね。ずるいけど、そこは賢いわ。
  - chat: [元・金策業者, それでも何か月かに一回、まとめて消された]
  - say: それでもまとめて消された、か。見張る側も、バラし方のくせを見るようになったのよね。追いかけっこ。
  - chat: [元・金策業者, まとめて消える日は作業場が静かになった]
  - say: 作業場が静かになる、って。作業場って、何人くらいいたの？
  - chat: [元・金策業者, それは言えない]
  - say: 言えないのね。まあ、聞かないでおくわ。
  - chat: [ログボだけ勢, 闇が深い]
  - say: 闇が深い、ね。深いのよ、昔のネットのゲームは。私は浅いところで寝てただけ。
  - chat: [エラッタ収集家, ちなみにウィンドウの名前は]
  - say: {face: shy, text: ウィンドウの名前は、言わないで。}
  - chat: [ログボだけ勢, 言って]
  - say: 「言って」って、もう。ボットの窓の名前に、自分のキャラの名前を入れてたの。
  - chat: [ログボだけ勢, 草]
  - chat: [初見の旅人, それはバレるw]
  - say: 草ばっかり。それはバレる、よね。笑わないでよ。私も今は笑うけど。
  - say: 半分はそれのせいだったと思ってるわ、今でも。
# また脇道（オートで戦ってくれるなら）
- - chat: [RTA走者見習い, 最初からオート付いてるゲームなら捕まらなかったのに]
  - say: 最初からオートが付いてるゲームなら？ それよ。私が欲しかったのはそれなの。
  - say: ドラクエ4って、仲間に作戦を渡すと、勝手に戦ってくれるでしょう。
  - chat: [レトロゲー老人, ガンガンいこうぜ]
  - say: そう、「ガンガンいこうぜ」とか「いのちだいじに」とか。
  - say: 命令じゃなくて、方針だけ渡すの。理想の部下よ。
  - chat: [RTA走者見習い, クリフトのザラキ]
  - say: クリフトのザラキ。言うと思った。方針を渡しても、言うこと聞かない子はいるのよ。
  - say: 私ね、子どもの頃、あれを「さくせい」だと思ってたの。
  - chat: [ログボだけ勢, 作成w]
  - say: 笑ったわね、作成。何かを作るコマンドだと思ってたのよ。
  - say: 友達に直されて、恥ずかしくて「どっちでも仲間は動くわ」って言い返したわ。
  - chat: [初見の旅人, 負けず嫌い]
  - say: そう、負けず嫌いなの。寝てるときだけ素直。
  - ask:
      q: ゲームにオートの戦闘があったら使う？
      options:
      - c: すぐ使う
        r:
        - すぐ使うのね、{from}。分かるわ。私もボタンは少ない方がいい。
      - c: 面倒なときだけ
        r:
        - 面倒なときだけね、{from}。それくらいがちょうどいいのかも。
      - c: 自分で操作したい
        r:
        - 自分でやりたいのね、{from}。それも分かる。私は見てる方が好きだけど。
      - c: オートがあるゲームはやらない
        r:
        - やらないのね、{from}。こだわりがあるのね。ちょっと聞いてみたいわ。
      npc: [[ログボだけ勢, 0], [RTA走者見習い, 2], [レトロゲー老人, 1], [初見の旅人, 1], [元・金策業者, 0]]
  - say: すぐ使うと、面倒なときだけ、が同じくらいね。仲間がいっぱい。
  - chat: [RTA走者見習い, RTAでオートは使わないけどね]
  - say: RTAの人はそうよね。そっちは、速さを競ってるんだものね。私と目的が逆なのよ。
# 戻る（マリオの合図とサ終）
- - chat: [初見の旅人, あれ、マリオの帯の話はどこ行った]
  - say: マリオの帯の話、どこ行ったって？ そうそう、合図を待つところまで話したわね。
  - say: えっと、あれでだいたい全部だったかも。
  - chat: [レトロゲー老人, 右端だと合図来ないとかあるよ]
  - say: 右端だと合図が来ない、あるわね。画面の右の端の一列だと、合図が鳴らないの。
  - say: そこに置いちゃうと、ずっと待ってることになるのよ。
  - chat: [初見の旅人, ねぼすけ一号なら待ってくれそう]
  - say: ねぼすけ一号なら待つわね。あの子、やめどきが分からないから。
  - chat: [元・金策業者, あのゲーム、今どうなってるの]
  - say: あのゲームは、終わったわ。2016年に。サーバーが閉じたの。
  - say: 私ね、BANを解いてくださいってメールを、毎年同じ日に送ってたのよ。
  - chat: [ログボだけ勢, 毎年？]
  - say: そう、毎年。返事は来ないけど。
  - say: 今は宛先がなくて、戻ってくるの。それでも送ってる。
  - chat: [ログボだけ勢, 年一のログボじゃん]
  - say: {face: smile, text: 年一のログボ、そうね。もらえるのは「宛先不明」だけ。}
  - chat: [元・金策業者, 業者より律儀]
  - say: 業者より律儀って、ほめてるの？ 怠け者が続けてる、数少ない習慣よ。
# 締め
- - chat: [規約は同意だけ, ボットって今でも作れる？]
  - say: ボットの作り方は言わないわ。捕まるし、まじめに遊んでる人が損するもの。
  - say: それより、あなたが入れたツールの方が心配よ。
  - chat: [規約は同意だけ, 消したってば]
  - say: 消したってば、ね。なら、いいわ。パスワードも変えておいてね。
  - chat: [温泉ソムリエ, 次は湯船で寝ないように]
  - say: 湯船で寝ないように、ね。気をつけるわ。眠くなったら上がる。さっき約束したもの。
  - chat: [初見の旅人, ボットの名前の話で笑った]
  - say: ボットの名前で笑った？ 笑っていいわよ。私も笑い話にしてるもの。
  - say: 次は、バグを報告したら毎回「重複です」って返ってくる話。
  - say: じゃあね、おつかれさま。髪乾かしてくる。エラに乾かしてもらうんだけど。
