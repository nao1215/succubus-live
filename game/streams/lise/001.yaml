title: ファミコンの敵がチカチカしてた理由
lobby:
- 昔のゲームで、敵がチカチカしてたの、覚えてる？
- あれ、壊れてたんじゃないのよ。今日はその話。
- 寝不足なの。ゲームを一コマずつ止めて見てたら朝だったわ。
parts:
# 入り（寝不足、重複のメール）
- - say: あ、映ってる？ おはよう。
  - chat: [毎朝おはよう係, おはよう]
  - chat: [ログボだけ勢, 眠そうw]
  - say: おはよう係さん、おはよう。眠そう？ 眠いわよ。ゆうべ寝てないもの。
  - chat: [ログボだけ勢, また？]
  - say: 「また？」って、またよ。昔のゲームを一コマずつ止めて見てたの。
  - say: 四時間くらい。気づいたら外が明るかった。
  - chat: [夜勤明けの人, 寝な？]
  - say: 寝なって？ 寝ようとしたのよ。そしたらメールが来てて。
  - chat: [ログボだけ勢, あっ（察し）]
  - say: 察したわね。そう、それ。「ご報告ありがとうございます。重複です」。
  - chat: [エラッタ収集家, 何件目でしたっけ]
  - say: 何件目か？ 九件目。バグを見つけて送ると、毎回誰かが先に送ってるの。
  - chat: [朝五時の報告者, おはようございます。その節はどうも]
  - say: 朝五時さん、出たわね。「その節はどうも」じゃないわよ。今回はあなたじゃないでしょうね。
  - chat: [朝五時の報告者, 違います、たぶん]
  - say: たぶんって何よ。もう、その話は今度するわ。
  - chat: [初見の旅人, 初見です。何のバグ？]
  - say: 初見さん、いらっしゃい。何のバグかっていうと、ゲームの不具合を見つけて、作った会社に知らせるのが趣味なの。
  - say: で、毎回二番目なの。
  - chat: [初見の旅人, 草]
# 本題の入り（横一列に八枚）
- - say: で、何を一コマずつ見てたかっていうとね。
  - say: ファミコンで、敵がチカチカ点滅してたでしょう。あれ。
  - chat: [レトロゲー老人, あったあった]
  - chat: [初見の旅人, 動画で見たことある。壊れてるのかと思った]
  - say: 壊れてるのかと思った？ 壊れてないの。わざとなのよ、あれ。
  - chat: [初見の旅人, わざと？]
  - say: そう、わざと。ファミコンって、動く絵を横一列に八枚までしか出せないの。
  - say: マリオとか敵とか弾とか、動いてるものね。スプライトっていうの。
  - chat: [規約は同意だけ, スプライトって飲み物じゃないの]
  - say: 飲み物のスプライトじゃないわ。いや、私も最初そう思ったけど。
  - say: シールだと思って。背景の上に貼って動かすシール。
  - chat: [規約は同意だけ, 了解、同意します]
  - say: 「同意します」って、同意しなくていいの。分かったならそれでいいの。
  - say: で、そのシールが、同じ高さに八枚まで。九枚目は描かれないの。
  - chat: [初見の旅人, え、いるのに見えないの]
  - say: {face: surprised, text: そう、いるのに見えない。そこが面白いのよ。}
  - chat: [処理落ち愛好会, 九枚目はどうやって決まるの]
  - say: 九枚目がどう決まるか？ 番号の若い順に八枚。九枚目からはその行だけ消えるの。
  - say: 中で八枚ぶんの名簿を、一行ごとに作り直してるのよ。三十二バイトしかない名簿。
  - chat: [処理落ち愛好会, 二次OAMね]
  - say: そう、二次OAM。詳しい人がいると話が早くて助かるわ。
# 脇道（コーヒー派か紅茶派か、コメダ）
- - chat: [夜勤明けの人, 眠いならコーヒー飲めば]
  - say: コーヒー飲めばって？ 飲まないの。目が覚めちゃうから。
  - chat: [ログボだけ勢, 目を覚ましたいんじゃないの？]
  - say: 覚ましたくはないのよ。起きてたいだけで。
  - chat: [ログボだけ勢, 何が違うのそれ]
  - say: 何が違うって、全然違うわ。私は紅茶派なの。アールグレイ。
  - say: ティーバッグ入れっぱなしで、真っ黒になっても飲むわ。
  - chat: [レトロゲー老人, それはもう渋いだけでは]
  - say: 渋いわよ。でも取り出すのが面倒なの。
  - chat: [初見の旅人, カフェとか行かないの？]
  - say: カフェ？ 行くわよ、コメダ。ソファの席が好きなの。
  - say: 座ると眠くなるのよ。だから長居しないうちに帰るようにしてる。
  - chat: [ログボだけ勢, 寝に行ってない？]
  - say: 寝に行ってないわ、寝ないように帰るの。一回うとうとして、お冷やを足してもらった音で起きたのよ。
  - say: {face: shy, text: 恥ずかしかったわ。それから、眠くなったら会計。}
  - chat: [喫茶店の常連, コメダならシロノワールでしょ]
  - say: シロノワールね。頼むと眠くなるのよ、あれ。おいしいけど。
  - say: あなたはいつも何頼むの？
  - chat: [喫茶店の常連, たっぷりサイズのアイスコーヒー]
  - say: たっぷりのコーヒー。それ飲んだら私、三日寝られないわ。
  - chat: [夜勤明けの人, 大げさw]
  - say: 大げさじゃないわ。いや、二日くらいかも。
  - ask:
      q: コーヒー派？ 紅茶派？
      options:
      - c: コーヒー
        r:
        - コーヒーなのね、{from}。夜まで起きていられるの、うらやましいわ。
        - 私は一口で目が冴えて、夜中に後悔するの。
      - c: 紅茶
        r:
        - 紅茶ね、{from}。仲間。
        - ティーバッグ、出す派？ 入れっぱなし派？ 私は入れっぱなし。
      - c: 緑茶
        r:
        - 緑茶ね、{from}。渋いのが平気なら、私の真っ黒の紅茶も飲めるかもね。
      - c: どれも飲まない
        r:
        - 飲まないのね、{from}。水派？ 寝つきはそれが一番よさそう。
      npc: [[夜勤明けの人, 0], [レトロゲー老人, 0], [ログボだけ勢, 3], [喫茶店の常連, 0], [毎朝おはよう係, 2]]
  - say: コーヒー多いわね。みんなどうやって寝てるの？
  - chat: [夜勤明けの人, 夜勤だから寝る時間が昼]
  - say: 夜勤だから寝るのが昼か。そうだったわね。うらやましいような、大変なような。
  - chat: [初見の旅人, で、チカチカの話は？]
  - say: {face: surprised, text: あ、チカチカの話。そうだった。待って、どこまで話したっけ。}
  - chat: [処理落ち愛好会, 九枚目が消えるとこ]
  - say: そうそう、ありがと。九枚目が消えるところね。
# 戻る（ちらつきは順番の入れ替え）
- - say: で、九枚目がずっと同じ子だと、その子はずっと見えないでしょう。
  - chat: [初見の旅人, かわいそう]
  - say: かわいそうだし、見えない敵に当たったら困るわよね。
  - chat: [RTA走者見習い, 見えない弾に当たって死んだことある]
  - say: 見えない弾に当たって死んだ？ あるわよね。見えなくても、そこにいるの。
  - say: 当たったかどうかの判定は、描かれてなくても生きてるのよ。
  - chat: [RTA走者見習い, 理不尽すぎる]
  - say: 理不尽よ。私も昔、それでコントローラー投げかけたもの。
  - chat: [ログボだけ勢, 投げかけた（投げてない）]
  - say: 投げてないわ。母に見られてたから。
  - say: で、作った人もそれは嫌なの。だから毎回、並べる順番を入れ替えるの。
  - say: 今回はこの子が消える、次はあの子が消える、って。
  - chat: [ログボだけ勢, 当番制じゃん]
  - say: {face: smile, text: そう、当番制。みんな少しずつ消えるの。}
  - say: それが、目にはチカチカに見えるのよ。
  - chat: [初見の旅人, ずっと消えるよりマシってこと？]
  - say: そう、ずっと消えるよりマシってこと。点滅の方がまだ分かるでしょう。
  - chat: [レトロゲー老人, 主人公だけ点滅しないゲームあったな]
  - say: 主人公だけ点滅しないの、あるわね。主人公だけ、いつも先頭に置いておくの。
  - say: 自分が見えなくなったら、遊べないもの。
  - chat: [ログボだけ勢, リゼもたまに消えてる]
  - say: 消えてないわ。目を閉じてるだけ。
  - chat: [ログボだけ勢, それを寝てるって言うんよ]
  - say: それを寝てるって言う、ね。言い返せないわ。いいわ、続ける。
# 隠す技（透明な八枚、ゼルダ）
- - say: でね、ここからが私の好きなところ。逆の使い方があるの。
  - say: 八枚までなら、見えないシールを先に八枚並べちゃえばいいのよ。
  - chat: [規約は同意だけ, そしたら？]
  - say: その行は満員だから、あとから来た子は全部消えるの。
  - chat: [初見の旅人, わざと消すの？]
  - say: わざと。見せたくない所を隠すのに使うの。
  - chat: [レトロゲー老人, ゼルダの扉だ]
  - say: そう、それ！ ゼルダの伝説の、ダンジョンの扉。
  - say: リンクが上の扉をくぐるとき、体がすっと消えていくでしょう。
  - chat: [初見の旅人, 壁の後ろに入ってるんじゃないの]
  - say: 壁の後ろに入ってると思うでしょう。私もそう思ってたの。でも違うのよ。
  - say: その高さに、見えない子が八人並んでるの。リンクは九人目で、描かれてないだけ。
  - chat: [ログボだけ勢, 勇者なのに九人目扱い]
  - say: 勇者なのに九人目。扱いがひどいわよね。ゲームの中であんなに頑張ってるのに。
  - chat: [コマ送り勢, 忍者龍剣伝のムービーも]
  - say: あっ、忍者龍剣伝のムービー！ それ、ゆうべ私が四時間見てたやつ。
  - chat: [ログボだけ勢, あれ一コマずつ見たくなるの分かる]
  - say: 分かる？ 映画みたいな場面、黒い枠があるでしょう。
  - say: 枠の外に見えない八人を並べて、絵がはみ出さないようにしてるの。
  - chat: [コマ送り勢, 全部それでやってるの？]
  - say: 全部じゃないの。落とし穴に落ちる所は、別のやり方で隠してる。
  - say: 一コマずつ見てると、ここは並べてる、ここは違う、って分かるのよ。それが楽しくて朝になったの。
  - chat: [コマ送り勢, わかる。俺も昨日三時までやってた]
  - say: 三時！ あなたも寝てないじゃない。
  - chat: [コマ送り勢, 一コマ進めるボタン押すの止まらんのよ]
  - say: ボタンが止まらないの、分かるわ。あと一コマ、あと一コマって。
  - say: ゲームより、一コマずつ見る方が止まらないのよね。
  - chat: [夜勤明けの人, 楽しそうでなにより]
  - say: 楽しそうでなにより、って。楽しかったわよ。眠いけど。
  - chat: [レトロゲー老人, ドラキュラ2の沼もそうだよね]
  - say: 沼ね、悪魔城ドラキュラII。シモンが沼に入ると、下半身が消えるの。
  - chat: [ログボだけ勢, 下半身が消えるのは困る]
  - say: {face: smug, text: 困るわね。サキュバス的には、そこが大事なのに。}
  - chat: [初見の旅人, 急にサキュバス]
  - say: 急にって何よ。サキュバスなのよ、一応。ゲームの話に戻るわね。
# エミュで上限を外すと
- - chat: [物理演算の民, エミュで八枚の制限外せばチカチカしないじゃん]
  - say: 八枚の制限を外せばいいって？ 来たわね、その話。
  - chat: [初見の旅人, エミュって何？]
  - say: エミュはね、パソコンで昔のゲーム機のまねをするソフト。
  - say: その中に、八枚の制限を外す設定があるのよ。
  - chat: [物理演算の民, 外すと全部見える。快適]
  - say: 快適よ。私も最初、喜んで外してたわ。
  - say: でね、ゼルダのダンジョンに入ったら。
  - say: リンクが、扉の壁の上を歩いてたの。
  - chat: [物理演算の民, あ]
  - say: {face: smug, text: 「あ」でしょう。その「あ」が聞きたかったの。}
  - chat: [ログボだけ勢, 隠してたのが全部見えちゃうのか]
  - say: そう、全部見えちゃう。見えない八人が効かなくなるの。
  - chat: [コマ送り勢, じゃあどうすんの]
  - say: どうするかっていうと、同じ高さに同じ絵が八枚きれいに並んでたら、それは隠すためって見分けるらしいの。
  - say: 中でどうやってるかまでは、私は確かめてないから言わないわ。
  - chat: [エラッタ収集家, 確かめてないことは言わない、大事]
  - say: {face: shy, text: 大事なのよ、ほんとに。前に確かめずに言って、三日くらい言われ続けたの。懲りたわ。}
  - ask:
      q: エミュで遊ぶとき、チカチカの制限はどうしてる？
      options:
      - c: 実機と同じ
        r:
        - 実機どおりね、{from}。チカチカも込みで楽しむ人ね。
      - c: 外してる
        r:
        - 外してるのね、{from}。見やすいのは本当よ。
        - ゼルダで壁の上を歩いてたら教えて。笑うから。
      - c: ゲームごとに変える
        r:
        - ゲームごとに変えるの、{from}。手間をかけるのね。私はやらないけど。
      - c: エミュ使わない
        r:
        - 使わないのね、{from}。実機で遊んでるの？ いいわね、それ。
      npc: [[レトロゲー老人, 0], [物理演算の民, 1], [コマ送り勢, 2], [規約は同意だけ, 3], [処理落ち愛好会, 0]]
  - say: 実機どおりが多いのね。このへん、そういう人が集まってるわね。
# 締め（規約は同意だけ、次の話）
- - chat: [規約は同意だけ, 今日ガチャの話はしないの？]
  - say: ガチャの話？ しないわ。というか、あなた。
  - say: 先週言ってた「石が増えるツール」、消した？
  - chat: [規約は同意だけ, まだ]
  - say: まだなの？ 消して。石は増えないし、アカウントを取られることもあるの。
  - chat: [規約は同意だけ, はい]
  - say: うん。消したら教えてね。
  - chat: [ログボだけ勢, お母さんかよ]
  - say: お母さんじゃないわ。心配なだけ。
  - chat: [初見の旅人, 面白かった。チカチカの理由はじめて知った]
  - say: チカチカの理由、はじめて知った？ よかった。私も話してて楽しかったわ。眠いのに。
  - chat: [夜勤明けの人, おやすみ]
  - say: おやすみ。あなたもちゃんと寝てね。
  - say: 次は、マリオ3のキノコがどこから出てきてるかの話をするわ。たぶん。
  - say: じゃあ、おつかれさま。私も寝る。
