title: 私が「OK」を出したせいで、日曜の朝にお店の通知が十四分止まった話
lobby:
- こんばんは。今日は、私のやらかしの話。
- 人のコードに「OK」って書いたら、日曜の朝に通知が止まったの。
- 知らない言葉は、出たらすぐかみ砕くね。
- 途中でカップヌードルの話もする。たぶん。
parts:
# オープニング（からあげクンのレッド）
- - say: あ、映ってる？ 映ってるわね。
  - say: こんばんは、起きてる人たち。
  - chat: [処理落ち愛好会, 画面くらっ]
  - say: 「画面くらっ」って……暗くないの。紫なの。来て早々それ？
  - chat: [処理落ち愛好会, 挨拶みたいなもん]
  - say: 挨拶みたいなもん？ 挨拶なら「こんばんは」って打って。
  - chat: [カーネル読み, こんばんは]
  - chat: [RTOS屋十五年, こんばんは]
  - say: カーネル読みさん、RTOS屋さん、こんばんは。ほら、できる人はできるの。
  - chat: [夜勤明けの人, こんばんは。今起きた]
  - say: 夜勤明けさん、今起きたの？ おはよう。私もさっき起きたの。五時に。夕方の。
  - say: でね、起きてすぐローソン行ったの。
  - chat: [夜勤明けの人, 何買ったの]
  - say: 何買ったか？ からあげクンのレッド。最後の一個だったの。
  - chat: [処理落ち愛好会, 勝ち]
  - say: {face: smug, text: 勝ったわ。今日の運、たぶんここで使った。}
  - say: レッドってね、夜勤の人の食べ物だと思ってるの、私。
  - chat: [初見の旅人, はじめまして。なんで夜勤？]
  - say: いらっしゃい、初見さん。なんで夜勤かっていうとね、前の職場で、レッドを買ってくる人が、だいたいその日の当番だったの。
  - say: だから今でも、レッド買ってる人を見ると「この人も当番かしら」って思っちゃう。
  - chat: [夜勤明けの人, 自分も今日レッドだった]
  - say: {face: smile, text: 夜勤明けさんも今日レッド？ ほら！ 当番の人。心の中で会釈しとくね。}
  - chat: [定時退社したい, 自分は定時でレギュラー]
  - say: 定時さんはレギュラーなのね。レギュラーもおいしいわよね。
  - chat: [新卒二年目, こんばんは。今日は起きてます]
  - say: 新卒さん、「今日は起きてます」って、わざわざ言うのね。
  - say: ……日曜の当番だった人、ちゃんと寝た？ 誰とは言わないけど。
  - chat: [新卒二年目, 名指しじゃないですか]
  - chat: [新卒二年目, 寝ました。呼ばれなかったので]
  - say: 呼ばれなかったのね、よかった。私はね、呼ばれた方なの。今日はその話。
# 四文字
- - chat: [DDD警察, 何やらかした]
  - say: やらかした前提なのね、DDD警察さん。合ってるけど。
  - say: 先週の木曜の朝四時にね、チームの子のコードを読んでたの。私、今の会社で、五人のチームのリードなの。
  - chat: [初見の旅人, コードを読むの？]
  - say: コードを読むのはね、レビューっていうの。人が書いたのを、入れる前に読んで、危ない所を探すの。リードの仕事の半分くらい、これ。
  - chat: [初見の旅人, 校閲さんだ]
  - say: そう、校閲みたいなもの。
  - say: で、一本読んで、こう打ったの。「LGTM」。
  - chat: [初見の旅人, える……？]
  - say: LGTM はね、Looks Good To Me。「私はいいと思う」っていう、合格のはんこ。
  - say: それで入ったコードが、日曜の朝に、お店の通知を十四分止めたの。
  - chat: [処理落ち愛好会, ｗｗｗ]
  - chat: [定時退社したい, 胃が痛い]
  - say: 草が多いわね。笑っていいのよ。私も今は笑える。木曜の私だけは笑えないけど。
  - say: 定時さんは、まだ始まって三分なのに胃が痛いのね。
  - chat: [定時退社したい, 当番の話は全部胃にくる]
  - say: 当番の話は全部胃にくる、分かる。胃薬を横に置いて聞いて。
  - chat: [初見の旅人, お店の通知って？]
  - say: お店の通知っていうのは、注文が入ったら、お店の人のスマホが鳴るやつ。それが一回も鳴らなかったの。
  - chat: [カーネル読み, 原因は]
  - say: 原因はね、言うと短いの。
  - say: 鍵を握ったまま、よその会社の返事を待ってたの。待つ時間の上限なしで。
  - chat: [RTOS屋十五年, あー]
  - chat: [初見の旅人, 鍵？]
  - say: 鍵って何か、よね。プログラムの中には「今、使用中」の札があるの。
  - say: トイレの鍵みたいなもの。一人入ってる間は、ほかの人は外で待つでしょ。
  - chat: [初見の旅人, トイレは分かる]
  - say: トイレは分かるわよね。そのコードはね、トイレに入って鍵をかけたまま、よその会社に電話してたの。
  - say: 「この注文、本物ですか」って確かめる電話。
  - chat: [処理落ち愛好会, トイレで電話すな]
  - say: {face: laugh, text: トイレで電話すな、ほんとにそう。で、日曜の朝、電話の相手が出なかったの。}
  - chat: [初見の旅人, 外で待ってる人は]
  - say: 外の人？ ずっと外。通知を送りたい子たちが、トイレの前に十四分並んでたの。
  - chat: [新卒二年目, それ自分も書いちゃいそう]
  - say: 新卒さん、書いちゃいそう？ 書くわよ。私も昔書いた。だから気づけるはずだったの。朝四時じゃなければ。
  - chat: [処理落ち愛好会, 四時に読むな]
  - say: 四時に読むな。……それは、本当にそう。
# 朝四時の夜食（カップヌードル）
- - chat: [夜勤明けの人, 朝四時って何食べてるの]
  - say: 朝四時に何食べてるか？ え、そこ聞くの？
  - say: カップヌードルのシーフード。いつもそれ。
  - chat: [処理落ち愛好会, 健康に悪い]
  - say: 健康に悪いって？ 卵も食べてるから平気。たぶん。
  - say: でね、三分はちゃんとタイマーで計るの。四分は待たないの。
  - chat: [カーネル読み, 一分の差わかるの]
  - say: 一分の差なんて分かるのか、って思うでしょ。だから一回、確かめたの。
  - chat: [RTOS屋十五年, 確かめたのか]
  - say: 自分で目隠しして、三分のと四分のを食べ比べたの。六回。
  - chat: [初見の旅人, 目隠しでカップ麺]
  - say: {face: smug, text: 目隠しでカップ麺よ。六回中、四回当てたの。}
  - chat: [処理落ち愛好会, ほぼ偶然では]
  - say: ほぼ偶然、って……そう言われたの、前にも。
  - chat: [カーネル読み, 六回は少ない]
  - say: {face: annoyed, text: 少ないのは分かってるの。食べすぎてお腹がいっぱいになったの。}
  - chat: [新卒二年目, リゼさんもシーフード派って聞きました]
  - say: そうなの！ リゼもシーフードなの。
  - say: でもリゼは「三分待つ間に一回寝られる」って言ってた。
  - chat: [処理落ち愛好会, 三分で寝るな]
  - say: 三分で寝るな、よね。寝たら伸びるのに。リゼは伸びたのも好きなのかもしれない。
  - chat: [定時退社したい, うちはカレー味一択]
  - say: カレー味の人もいるのね。……シーフードの方が、夜中に胃が静かよ。
  - chat: [定時退社したい, 胃の話するとまた痛くなる]
  - say: また痛くなっちゃった？ ごめん。胃の話は、やめる。
# 何の話してたっけ（偽物が優秀すぎた）
- - say: 待って、何の話してたっけ。
  - chat: [カーネル読み, トイレで電話]
  - say: そう、トイレで電話。ありがとう。
  - chat: [DDD警察, テストは付いてなかったの]
  - say: テスト？ 付いてたの。しかも、ちゃんと通ってたの。
  - say: 試験のときは、本物の会社じゃなくて、偽物の電話の相手を使うのね。
  - say: その偽物が、いつも一瞬で返事してたの。
  - chat: [カーネル読み, 偽物が優秀すぎる]
  - say: {face: laugh, text: そう、偽物が優秀すぎたの。本物は日曜の朝、寝てたのに。}
  - say: 返事が遅いときのことは、一回も試してなかったの。
  - chat: [新卒二年目, 偽物はいつも速いですよね]
  - say: 速いのよね。作るとき、うまくいく相手しか作らないから。遅い相手も、黙って切る相手もいなかったの。
  - chat: [DDD警察, ちなみに説明欄は]
  - say: 説明欄はね、「堅牢な外部連携を実装しました」。
  - chat: [DDD警察, 堅牢]
  - chat: [処理落ち愛好会, 堅牢ｗ]
  - say: みんな「堅牢」で笑ってる。書いたのが人か機械かは、どっちでもいいの。
  - say: 「堅牢」って字を見て、安心しちゃったのは私。そこが私の失敗。
  - chat: [RTOS屋十五年, 直すのはどれくらいかかった]
  - say: 直すのは簡単だと思ったの。口では「二時間」って言っちゃった。
  - chat: [カーネル読み, ×3.7]
  - chat: [処理落ち愛好会, ×3.7]
  - say: {face: annoyed, text: 「かける3.7」……今日は二人とも打つのね。}
  - chat: [初見の旅人, 3.7って何？]
  - say: 3.7はね、私が口で言う見積もりの係数。私が「二時間」って言うと、平均で3.7倍かかるの。記録してるの。
  - chat: [初見の旅人, 記録してるのに直らないの]
  - say: {face: annoyed, text: 口は直らないの。だから仕事のチケットには、幅で書くの。今回は「半日から一日」。}
  - chat: [新卒二年目, で、どれくらいかかったんですか]
  - say: ……夜までかかった。チケットの方は、当たったの。
  - chat: [処理落ち愛好会, 口だけ外れる]
  - say: 口だけ外れるって言わないで。……合ってるけど。
# 見たことある？
- - say: ねえ、みんなにも聞いていい？
  - ask:
      q: 「使用中」の札を持ったまま、よそからの返事を待つプログラム、見たことある？
      options:
      - c: 自分で書いた
        r:
        - '{from}もなのね。いらっしゃい、こっち側に。'
        - 一回書くと、次は人のコードでも目に入るようになるの。私はそうだった。
      - c: レビューで止めた
        r:
        - '{from}、すごい。木曜の朝四時に、横にいてほしかった。'
        - 止めるとき、ちょっと言いにくくなかった？ おつかれさま。
      - c: 本番で見た
        r:
        - 本番で見たのね。
        - '{from}……おつかれさま。何分止まったの？'
        - よかったら、あとでチャットで聞かせて。そういう話、好きなの。
      - c: 何の話か分からない
        r:
        - 何の話か分からない、か。
        - '{from}、正直でいいわ。トイレで電話してる人の話、くらいでいいの。'
        - 明日、トイレの前で待たされたら、ちょっと思い出して。
      npc: [[新卒二年目, 0], [RTOS屋十五年, 1], [定時退社したい, 2], [初見の旅人, 3], [DDD警察, 1]]
  - chat: [新卒二年目, 書いたことあります。先月]
  - say: レビューで止めた人が多いのね。頼もしい。……新卒さん、先月書いたの？ どうなったの？
  - chat: [新卒二年目, 先輩がレビューで止めてくれた。でも何がダメか分かってなかった]
  - say: 先輩が止めてくれたのね。何がダメか、今日、分かった？
  - chat: [新卒二年目, トイレで電話、で分かりました]
  - say: {face: smile, text: トイレで電話、で分かったのね。よかった。何回もした甲斐があったわ。}
  - chat: [定時退社したい, うちのは本番で三十分止まった]
  - say: 三十分。……定時さん、その日は定時で帰れなかったでしょ。
  - chat: [定時退社したい, 帰れなかった]
  - say: やっぱり。胃が痛くなるの、ちゃんと理由があるのね。
# 私の事後報告
- - chat: [DDD警察, 事後報告は書いた？]
  - say: 事後報告？ 書いたわ。事故のあとに書く、「何がどの順で起きて、どう直したか」の報告書。
  - say: 四日かかったけど。
  - chat: [カーネル読み, 報告にも×3.7]
  - say: 報告に係数はないの。
  - chat: [RTOS屋十五年, その朝はどう止めた]
  - say: その朝はね、私が指揮だったの。チャットで。まず、入れたばかりの変更を戻したの。原因がそれだって決まる前に。
  - say: 戻すのが一番早くて、一番安全だったから。十四分で止まったのは、戻したからなの。
  - say: それから、たまってた通知を送り直したの。送ったかどうかの印を見ながら。同じ通知が二回鳴らないように。
  - chat: [新卒二年目, 原因が分かる前に戻すんですか]
  - say: 戻すの。お店の人が困ってる間は、影響を止めるのが先。原因探しは、そのあとでいいの。
  - say: なんで起きたか、には三つ書いたの。
  - say: 鍵を握ったまま外を待った。待つ時間の上限がなかった。偽物がいつも速かった。
  - say: それから、外に電話する変更を、眠い一人の LGTM で入れられる決まりだったこと。
  - chat: [新卒二年目, 自分の名前書いたんですか]
  - say: 自分の名前？ 時系列の所に、事実として書いたの。四時五分、ノクスが LGTM。……ちょっと恥ずかしかったけど。
  - say: でも、書いた子の名前は書いてないの。原因の欄は、人じゃなくて仕組みで書くの。
  - chat: [RTOS屋十五年, 直し方は]
  - say: 直し方はね、要る物だけ鍵の中で写して、外への電話は鍵を離してから。電話には、何秒で切るかを必ず付ける。
  - say: 戻ってきたときに中身が変わってたら、そのまま書き戻さないの。確かめ直してから。
  - say: で、試験の偽物に、遅い子を一匹足したの。三十秒黙ってる子。
  - chat: [処理落ち愛好会, 遅い偽物かわいい]
  - say: かわいいの。動かしたら、一発で列ができたの。
  - say: 直す前のコードで、ね。直したあとは、ちゃんと流れたの。
  - chat: [処理落ち愛好会, 壊れて喜ぶな]
  - say: {face: laugh, text: 喜ぶわよ！ 列ができた瞬間、声出ちゃった。小さくだけど。}
  - chat: [カーネル読み, 四つ目は]
  - say: 四つ目。外に電話する変更は、二人で見る決まりにしたの。眠いときは、時刻に関係なく、レビューを人に渡す。
  - chat: [DDD警察, 遅い返事も試した？]
  - say: うん。今度は、ずっと返事が来ないのも試した。
  - say: 三十秒の子のほかに、何も言わずに電話を切っちゃう子も足したの。
  - chat: [RTOS屋十五年, 切る子もいるのか]
  - say: いるのよ、本物にも。夜中に一回だけ、とか。
  - chat: [新卒二年目, 謝辞は載りました？]
  - say: 謝辞？ 載ったの。電話の相手の会社の当番の人がね、向こうの事後報告に「ノクスさんが、時刻付きの記録をくれた」って。
  - say: 日曜の朝、向こうも止まってたの。うちの記録で、向こうが止まった時刻が分かったんだって。
  - chat: [処理落ち愛好会, nxo じゃなかった？]
  - say: {face: shy, text: nxo じゃなかったの。綴り、合ってた。それがうれしくて、二回読んだ。}
  - chat: [初見の旅人, nxo？]
  - say: nxo っていうのはね、前に一回、お礼の欄に名前を間違えて載ったことがあるの。その話は、またいつか。
# 締め（よる）
- - chat: [RTOS屋十五年, この形の事故、火星でもあったよな]
  - say: {face: surprised, text: 火星の話、それ言っちゃう？ 次の回でやろうと思ってたのに。}
  - chat: [RTOS屋十五年, すまん]
  - say: いいの。一九九七年に、似た形のことが火星で起きてるの。鍵を持った子が進めなくて、待つ子が詰まる所が似てるの。仕組みは別なんだけど。
  - say: それは次。今日はもう、時間。
  - chat: [新卒二年目, よるは]
  - say: よるのこと、聞いてくれるの？
  - chat: [初見の旅人, よるって？]
  - say: よるはね、私が九年、暇な夜だけ作ってる小さい OS。
  - say: 前の版は時計まで動くの。今書き直してる版は、名前を一行出して、最初の時計の合図で落ちるの。
  - chat: [初見の旅人, 九年落ちてるの]
  - say: 落ちてるのは書き直してる方よ。今日の仮説はね、合図を受けたときのメモの置き場所が、ずれてるんじゃないかって。
  - chat: [カーネル読み, どきどき]
  - say: yoru、って出た。合図を入れる。
  - say: {face: surprised, text: 落ちた。}
  - chat: [処理落ち愛好会, 今日も落ちた]
  - chat: [RTOS屋十五年, 今日も落ちた]
  - say: {face: laugh, text: みんな「今日も落ちた」って。でもね、落ちた場所が先週と違うの！}
  - chat: [カーネル読み, 進歩？]
  - say: 直ってはいないの。でも、比べる記録が一個増えたの。置き場所の仮説は、まだ消えてないけど。
  - say: 起きてる人たち、ありがとう。楽しかった。
  - say: 寝なさい。私は、レッドの残りを食べてから寝るけど。
  - chat: [夜勤明けの人, 一個しかなかったんじゃ]
  - say: {face: shy, text: 一個しかなかった、けど……一個に五粒入ってるの。まだ二粒あるの。}
