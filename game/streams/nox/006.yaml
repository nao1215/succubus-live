title: 消し忘れた設定と許可の話（私の0.05 BTC と、2022年のゲームの橋）
lobby:
- こんばんは。今日は「消し忘れ」の話。
- 試験のための設定を消し忘れて、自分のお金をなくした話をするね。
- 2022年に、使わなくなった許可が残ってて大きな事故になった話も。
- 値段の話と、買う売るの話はしないの。
parts:
# オープニング（サブスク）
- - say: あ、映ってる。こんばんは、起きてる人たち。
  - chat: [新卒二年目, こんばんは]
  - chat: [処理落ち愛好会, こんばんは。今日なんか機嫌悪い？]
  - say: 機嫌悪い？ 悪くないの。……ちょっと悪い。
  - chat: [カーネル読み, 何があった]
  - say: 帳簿をつけてたの。配信の分の。そしたら、毎月数百円ずつ、知らない引き落としがあったの。
  - chat: [初見の旅人, はじめまして。詐欺？]
  - say: いらっしゃい、初見さん。詐欺かって？ 詐欺じゃないの。私が悪いの。
  - say: 前に試しに借りたクラウドの機械を、消し忘れてたの。
  - chat: [処理落ち愛好会, いつから]
  - say: {face: shy, text: いつからかって……二年前から。}
  - chat: [処理落ち愛好会, ｗｗｗ]
  - chat: [定時退社したい, 二年は痛い]
  - say: 二年は痛い、痛いの。一回も使ってないのに、二年間ずっと起きてたの、その機械。
  - chat: [RTOS屋十五年, 何に使うつもりだったの]
  - say: 何に使うつもりだったか？ 古い版の再現を、部屋の機械じゃなくてクラウドでやってみようと思ったの。
  - say: で、一日やって、やっぱり部屋の機械の方が早いって思って。そのまま。
  - chat: [処理落ち愛好会, 部屋の機械が勝った]
  - say: 部屋の機械が勝った、そう、勝ったの。クラウドの方は、負けたのに二年働かされてたの。
  - chat: [新卒二年目, ほかにサブスク何入ってるんですか]
  - say: ほかのサブスク？ Spotify と Netflix。それだけ。それだけのつもりだったの。
  - chat: [夜勤明けの人, Netflix で何見てる]
  - say: Netflix で何見てるか？ 最近は何も。前は『MR. ROBOT』を見てた。夜中に一人で画面見てる人の話だから。
  - chat: [処理落ち愛好会, 本人じゃん]
  - say: 本人じゃん、って……本人じゃないの。私はあんなに喋らない。
  - chat: [カーネル読み, Spotify は何聞くの]
  - say: Spotify は、作業用の曲を一つにまとめてるの。Kraftwerk の『Computer World』とか。
  - chat: [RTOS屋十五年, 渋い]
  - say: 渋いでしょ。四十年以上前のアルバムなのに、今の私の仕事の歌みたいなの。
  - say: で、今日は消し忘れの話をしたいの。私の、もっと大きい方の消し忘れ。
# 0.05
- - chat: [DDD警察, 0.05 の話か]
  - say: そう、0.05 の話。常連さんは知ってる話。
  - chat: [新卒二年目, ノクスさんってビットコイン持ってるんですか]
  - say: ビットコイン持ってるか？ 持ってないの。
  - chat: [処理落ち愛好会, 嘘だ。詳しいのに]
  - say: 嘘だ、詳しいのに、って。詳しいのと、持てるのは別なの。
  - say: 二〇一七年にね、仕組みを知りたくて、お財布のプログラムを自分で書いたの。
  - chat: [カーネル読み, 嫌な予感]
  - say: 嫌な予感？ 当たるわよ、その予感。
  - say: 試験のとき、毎回同じ結果が出るように、ライブラリの説明に載ってる試験用の種をそのまま使ってたの。
  - chat: [初見の旅人, らんすうのたね？]
  - say: 乱数の種っていうのは、くじ引きの箱の、混ぜ方の元みたいなもの。それを固定すると、毎回同じ順でくじが出るの。
  - say: 試験には便利なの。毎回同じになるから。
  - say: で、その試験用の種のまま、本物の鍵を作っちゃったの。
  - chat: [RTOS屋十五年, あ]
  - say: 本物の網で 0.05 BTC だけ受け取ったの。勉強のつもりで。
  - say: 寝て、起きたら、無かった。
  - chat: [処理落ち愛好会, ｗｗｗ]
  - chat: [新卒二年目, ええ……]
  - say: 草と「ええ……」が半々ね。笑っていいの。私も今は笑える。
  - say: その種を知ってたのは、私だけじゃなかったのね。誰でも読める説明書に載ってたんだもの。
  - say: 種から鍵を作り直せること自体は、普通なの。お財布はそれで復元するんだもの。だめだったのは、みんなが知ってる種だったこと。
  - chat: [初見の旅人, 取り返せたの？]
  - say: 取り返せたか？ 無理なの。だから、そのまま勉強代。
  - chat: [夜勤明けの人, 0.05 っていくらくらい]
  - say: 0.05 がいくらか……値段の話はしないって決めてるの。そのときの私の、夜食ひと月分くらい、とだけ。
  - chat: [処理落ち愛好会, 夜食ひと月分を一晩で]
  - say: 一晩で。起きたら、お財布の画面に 0 って出てたの。
  - say: 最初は表示がおかしいんだと思って、三回くらい読み込み直したの。
  - chat: [RTOS屋十五年, それは直さないやつ]
  - say: 読み込み直しても、それは直らないやつ。直らなかった。
  - chat: [DDD警察, 事後報告は書いた？]
  - say: 事後報告？ 自分あてに書いたの。誰にも見せないやつ。
  - say: 何が起きたかの所に「種を固定したまま本物を作った」。なんで、の所に「試験の設定と本物の設定が同じファイルだった」。
  - chat: [カーネル読み, 分けてなかったのか]
  - say: 分けてなかったのか、って。分けてなかったの。一人で作ってると、分けるのが面倒なのよ。
  - chat: [DDD警察, どう直した]
  - say: どう直したか。試験の設定が、本物を作るときに入ってたら止まるようにしたの。それからもう、自分の鍵は持ってない。
  - chat: [カーネル読み, 乱数の失敗は大きい所でもある]
  - say: 乱数の失敗は大きい所でもある、あるの。二〇一三年に、Android の乱数の欠陥で、Android のお財布のアプリが危ないって警告が出たの。
  - say: 私の部屋とスマホで、同じ種類の失敗。規模は全然違うけど。
# そういえば（パスワード）
- - chat: [定時退社したい, パスワードは何で管理してる？]
  - say: パスワードは何で管理してるか？ KeePassXC。紙には書かないの。
  - chat: [初見の旅人, きーぱす？]
  - say: KeePassXC はね、パスワードを全部しまっておく金庫みたいなアプリ。合言葉一個で開くの。
  - chat: [処理落ち愛好会, その合言葉忘れたら]
  - say: {face: annoyed, text: その合言葉を忘れたら……考えないようにしてる、のは嘘。控えを封筒に入れて、別の場所にしまってあるの。どこかは言わない。}
  - chat: [夜勤明けの人, 自分は全部ブラウザに覚えさせてる]
  - say: 全部ブラウザに覚えさせてる？ それでもいいのよ。同じのを使い回してないなら。
  - chat: [夜勤明けの人, 使い回してる]
  - say: 使い回してるの……一個だけでいいから、大事なのだけ変えて。銀行とメール。
  - chat: [新卒二年目, モーラさんは紙の帳面に暗号で書いてるって]
  - say: そうなの。モーラはね、自分で考えた暗号で帳面に書いてるの。
  - say: で、その暗号の解き方を、たまに忘れるんだって。
  - chat: [処理落ち愛好会, だめじゃん]
  - say: だめじゃん、って。だめなの。でも私も子どもの頃、暗号で日記を書いて、解き方を別の暗号で書いて、両方解けなくなったの。
  - chat: [カーネル読み, 二重に鍵をなくしてる]
  - say: 二重に鍵をなくしてる、そう。だからモーラのこと、笑えないの。心配はしてるけど。
  - chat: [処理落ち愛好会, 家の Wi-Fi のパスワードは言える？]
  - say: 家の Wi-Fi のパスワード？ 言えないの。長くて覚えられないのにしたから。
  - chat: [処理落ち愛好会, 自分の家なのに]
  - say: 自分の家なのに。お客さんが来たら、ルーターの裏のシールを見てもらうの。
  - chat: [カーネル読み, 客来るの]
  - say: {face: annoyed, text: 客来るのか、って……来たことはないけど。来たらそうするの。}
  - chat: [新卒二年目, 会社のは二段階の認証が毎朝つらいです]
  - say: 二段階の認証が毎朝つらい、分かる。でも、パスワードだけよりずっと守れるの。
  - chat: [新卒二年目, 番号も盗まれるって聞きました]
  - say: 盗まれることもあるの。だから、会社がパスキーやセキュリティキーを使えるなら、そっちが楽で強いの。毎朝つらいなら、担当の人に言っていいのよ。
# 橋の許可
- - chat: [RTOS屋十五年, パスワードもいいけど、消し忘れなら Ronin]
  - say: 消し忘れなら Ronin……出すと思った。二〇二二年の、ゲームの橋の話ね。
  - chat: [初見の旅人, 橋？]
  - say: Axie Infinity っていうゲームがあってね。ゲームの中の帳面と、外の帳面の間で、お金を行き来させる仕組みがあったの。それを橋って呼ぶの。
  - say: 二〇二二年の三月に、そこから六億ドルくらいが抜かれたの。
  - chat: [定時退社したい, 六億]
  - say: 六億よ。しかも気づいたのは六日後。引き出せない人が出てきて、やっと。
  - say: 橋を渡るにはね、九人の見張り役のうち、五人の署名が要ったの。
  - say: そのうち四人分は、同じ会社が持ってたの。
  - chat: [DDD警察, 五人目は]
  - say: 五人目は誰か。五人目がね、消し忘れなの。
  - say: 二〇二一年の十一月、混んでて困ったときに、別の団体が「代わりに署名していいよ」って許可を出したの。
  - say: 十二月にはもう要らなくなった。でも、その許可は取り消されてなかったの。
  - chat: [新卒二年目, 一時的な許可が残ってた]
  - say: 一時的な許可が残ってた、そう。三か月残ってて、それで五人分そろっちゃったの。
  - chat: [処理落ち愛好会, 入口は偽の求人だっけ]
  - say: 入口は偽の求人、そう。社員の人が、偽の会社の求人に応募して、書類のファイルを開いたのが始まりだった、って報じられてるの。そこは報道の話ね。
  - chat: [処理落ち愛好会, 開くなよ]
  - say: 開くなよ、って言うけど、開くわよ。ちゃんと応募して、内定の書類って言われたら、私も開くと思う。
  - say: だから、人が気をつける話にしたくないの。許可は、期限が来たら勝手に切れる形で出す話。だまされても、そこで止まるように作る話。
  - chat: [DDD警察, 九人いても、五人に届くのは簡単だったのか]
  - say: 九人いても、五人は簡単だったか？ 四つは同じ会社の鍵で、もう一つも、消し忘れた許可で使えたの。それで必要な五つに届いちゃった。
  - say: 九人で見張ってるつもりだったのにね。
  - chat: [RTOS屋十五年, 冗長化したつもりで同じ電源につないでたやつ]
  - say: {face: laugh, text: 冗長化したつもりで同じ電源、それ！ 二台あるのに、同じタップに挿さってるやつ。}
  - chat: [処理落ち愛好会, ノクスの部屋の十一台]
  - say: 私の部屋の十一台……全部、同じ延長コードなの。言わないで。
  - chat: [初見の旅人, 犯人は分かったの？]
  - say: 犯人？ アメリカの捜査機関が、四月に北朝鮮の Lazarus っていうグループだって名指ししたの。
  - say: 私に分かるのは、どこで抜けてたか、まで。そこから先は、私の話じゃないの。
  - chat: [カーネル読み, ノクスのクラウドも]
  - say: あ、犯人の話じゃなくて、消し忘れの方ね。
  - say: {face: flustered, text: 「ノクスのクラウドも」……そう。私のクラウドも、それ。}
  - ask:
      q: 「とりあえず」で作ったものや出した許可、消す日まで決めてる？
      options:
      - c: 決めてる
        r:
        - '{from}、すごい。どうやって忘れないようにしてるの？'
        - 期限で切れる形にしてるなら、それが一番。人の記憶に頼らないのがいいの。
      - c: 決めてない。たぶん残ってる
        r:
        - 消す日、決めてないのね。
        - '{from}、こっち側ね。私もさっきまでそっちだった。'
        - まず一個でいいから、今も要るか見て。強い権限か分からなかったら、担当の人に相談してね。
      - c: そもそも何を出したか覚えてない
        r:
        - 何を出したかも覚えてない、か。
        - '{from}……それが一番困るやつなの。'
        - 二年後の帳簿で見つかるの。私みたいに。
      npc: [[RTOS屋十五年, 0], [DDD警察, 1], [新卒二年目, 1], [定時退社したい, 2], [処理落ち愛好会, 2]]
  - say: 決めてない人と、覚えてない人が多いわね。……みんな、こっち側。
  - chat: [新卒二年目, うちの本番の権限、先月から一個残ってるのがあります]
  - say: {face: surprised, text: 先月から一個残ってるの？ 言ってくれてありがとう。強い権限なら、今夜でも当番の人に言って。}
  - say: そうじゃなくても、明日の朝一番に、今も要るか担当の人と確かめて。要らないなら外すの。
  - chat: [新卒二年目, 朝一で確かめます]
# 締め（パスワードの話のまま）
- - say: 今日はここまでかな。クラウドの機械、今から消すの。
  - chat: [夜勤明けの人, パスワード今変えてる]
  - say: パスワード、今変えてるの？
  - chat: [夜勤明けの人, 銀行のやつ。思い出せなくて再設定してる]
  - say: 銀行のが思い出せないのね。……それはそれで、使い回してないってことかも。
  - chat: [処理落ち愛好会, 前向き]
  - chat: [夜勤明けの人, 秘密の質問が「初めて飼ったペット」で詰んでる]
  - say: 秘密の質問が「初めて飼ったペット」。……飼ったことあるの？
  - chat: [夜勤明けの人, ない]
  - say: ないの？ ないのに選んだの。
  - chat: [カーネル読み, 当時の自分は何て答えたんだ]
  - say: 当時の自分は何て答えたか。当時の自分しか知らないのよね。……がんばって。
  - say: 起きてる人たち、ありがとう。おやすみなさい。
