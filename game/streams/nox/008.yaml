title: Go の「if err != nil」、毎回書くのは面倒？（あとタブかスペースか）
lobby:
- こんばんは。今日は言語の話。好き嫌いの話。
- Go っていう言語の、エラーの書き方が面倒って言われる話をするね。
- 途中で、タブ派かスペース派か聞くかも。
parts:
# オープニング（一日 Go）
- - say: あ、映った。こんばんは、起きてる人たち。
  - chat: [処理落ち愛好会, こんばんは。今日なにしてた]
  - say: 今日なにしてたか？ 一日、Go を書いてたの。お仕事の。
  - chat: [処理落ち愛好会, if err != nil を百回書いたんだろ]
  - say: {face: annoyed, text: if err != nil を百回……百回は書いてない。}
  - chat: [カーネル読み, 何回]
  - say: 何回かって……数えてない。たくさん。
  - chat: [初見の旅人, はじめまして。いふえらー？]
  - say: いらっしゃい、初見さん。「いふえらー」はね、Go っていう言語では、失敗したかどうかを、毎回自分で確かめるの。
  - say: 「さっきの、失敗してない？ 失敗してたら、ここで止まって」って、一個ずつ書くの。
  - chat: [初見の旅人, 毎回？]
  - say: 毎回かって？ 毎回。だから「面倒」ってよく笑われるの。
  - chat: [処理落ち愛好会, 面倒だろ]
  - say: 面倒だろって？ 面倒よ。でも私は好きなの。どこで失敗を見てるか、全部目に見えるから。
  - chat: [DDD警察, 例外で投げればいいのに]
  - say: 「例外で投げればいいのに」。出た、例外の人。DDD警察さんは Java だものね。
  - chat: [DDD警察, Kotlin です]
  - say: Kotlin です、って。ごめん。Kotlin ね。
  - chat: [新卒二年目, 僕は TypeScript です]
  - say: 新卒さんは TypeScript。みんなばらばらで楽しいわね、今日。
  - chat: [RTOS屋十五年, C]
  - say: RTOS屋さんは C。知ってた。
  - chat: [カーネル読み, C と、たまにアセンブラ]
  - say: カーネル読みさんは、読む方が多いでしょ。書くより。
  - chat: [カーネル読み, 読む方が楽しい]
  - say: 読む方が楽しい、分かる。私も最近、書くより読む仕事の方が多いの。
# nil なのに nil じゃない
- - chat: [カーネル読み, でも Go の err には罠がある]
  - say: err の罠、あるの。今日、それを踏んだ人のコードを読んだの。
  - say: 中身が空っぽのエラーを返したのに、受け取った側では「失敗した」って判定されてたの。
  - chat: [初見の旅人, 空っぽなのに失敗？]
  - say: 空っぽなのに失敗、よね。えっとね。Go のエラーって、箱みたいなものなの。
  - say: 箱には「何の種類のエラーか」の札と、「中身」が入ってるの。
  - say: 両方空っぽのときだけ、「エラーなし」って扱われるの。
  - say: 中身は空でも、札だけ入ってると、「何か入ってる箱」になっちゃうの。
  - chat: [初見の旅人, 空の箱に名札だけ貼ってある]
  - say: 空の箱に名札だけ貼ってある、そう、そんな感じ。
  - chat: [カーネル読み, Go の FAQ に一項目ある]
  - say: Go の FAQ にも、あるの。「nil のエラーが nil と等しくならないのはなぜ？」って。
  - say: 答えは、エラーなしのときは、型の付いた空っぽじゃなくて、ちゃんと素の nil を返して、なの。
  - chat: [新卒二年目, TypeScript にもそういうのあります。null と undefined]
  - say: null と undefined、あるわね。空っぽに見えて扱いが違うのは、似てるわね。仕組みは別だけど。
  - chat: [処理落ち愛好会, 空っぽに種類があるの、ノクスの冷蔵庫]
  - say: 私の冷蔵庫？ 卵と豆乳とポン酢が入ってるの。空っぽじゃないの。
  - chat: [カーネル読み, ポン酢は何にかけるの]
  - say: ポン酢は何にかけるか？ 常夜鍋。豚肉とほうれん草を、昆布のお湯にくぐらせるだけのお鍋。
  - chat: [処理落ち愛好会, 毎晩それ？]
  - say: {face: annoyed, text: 毎晩それって……毎晩じゃないの。名前が「常夜」なだけ。}
# 包んで渡す
- - chat: [新卒二年目, err をそのまま返すだけのコード、よく見ます]
  - say: err をそのまま返すだけ、見るわよね。私もよく書く。
  - say: でもね、そのままでも、ファイルの名前が入ってるエラーはあるの。Go のファイルのエラーは、名前を持ってるの。
  - say: でも、「何のために読んだか」は、その場所でしか分からないでしょう。上の方で受け取った人には、それが分からないの。
  - chat: [初見の旅人, 伝言ゲームで目的が消える]
  - say: 伝言ゲームで目的が消える、そう。だから一言足して包んで返すの。「設定を読もうとしたら、ファイルがなかった」って。
  - chat: [カーネル読み, '%w で包むやつ']
  - say: パーセント w で包むやつ、そう。二〇一九年の Go 1.13 から、包んだまま中身を取り出して確かめられるようになったの。
  - say: errors.Is なら、包まれた中も含めて、指定したエラーに当たるか調べられるの。
  - chat: [新卒二年目, 型で調べたいときは？]
  - say: 型で調べたいとき？ 型を調べる方は errors.As ね。Is は「この子いる？」、As は「この種類の子いる？」。
  - chat: [処理落ち愛好会, 包んだり開けたり忙しい]
  - say: 包んだり開けたり、忙しいの。プレゼントみたい。もらったことはあんまりないけど。
  - chat: [RTOS屋十五年, よるのエラーは何て出るの]
  - say: {face: shy, text: よるのエラー？ ……「だめ」って出るの。}
  - chat: [カーネル読み, 何がだめなのか]
  - say: 何がだめなのか、分からないの。自分で書いたのに。
  - chat: [処理落ち愛好会, 人には包めって言うのに]
  - say: 人には包めって言うのに、ね。仕事のは、何をしてて何が足りなかったかまで出すの。よるのは……趣味だから、今度包む。
# JavaScript のイコール
- - chat: [夜勤明けの人, JavaScript のイコール二個と三個の違いが分からない]
  - say: イコール二個と三個の違い？ あ、それね。二個の方は、比べる前に勝手に型をそろえようとするの。
  - say: 文字の「1」と数字の 1 を、同じって言っちゃうの。
  - chat: [夜勤明けの人, 優しい]
  - say: 優しい、って。優しすぎるの。だから私は普段は三個で書くの。でもね、人の二個を見つけても、黙っては直さない。
  - chat: [カーネル読み, なんで直さない]
  - say: x イコール二個 null って書くと、null と undefined を両方まとめて見られるの。
  - say: わざとかもしれないでしょ。試験を見て、書いた人に聞いてから。
  - chat: [新卒二年目, うちのチームは lint で禁止してます]
  - say: lint で禁止、いいわね。チームで決めて機械に止めてもらうと、誰も怒られなくて済むの。
  - chat: [カーネル読み, Gleam は触った？]
  - say: Gleam？ 触った！ 二〇二四年に 1.0 が出た言語ね。
  - say: Erlang の上で動かせば、落ちた仕事を見張り役が立て直す作りも使えるの。そこに型のチェックが付いてる感じ。勝手に全部直るわけじゃないけど。好き。
  - chat: [DDD警察, 珍しく早口]
  - say: {face: flustered, text: 「珍しく早口」って……早口じゃないの。好きなだけ。}
# 書かなくていい形は来なかった
- - chat: [DDD警察, 結局、短く書ける構文は入らないの]
  - say: 短く書ける構文？ 入らないことになったの。今のところ。
  - say: 二〇一九年にね、try っていう、短く書ける仕組みの提案があったの。
  - say: Go のチームの人たちが出したの。でも、みんなの反応が大きくて、見送りになったの。
  - chat: [カーネル読み, デバッグ用の print を足しにくいって意見もあった]
  - say: print を足しにくいって意見、そう。短くすると、間に一行足したいときに困るのよね。私もそこは分かる。
  - say: それから何年も、短くする案が何百個も出たの。
  - say: で、二〇二五年の六月に、Go の公式のブログで、「当面、エラーのための新しい書き方は追いかけません」って。
  - chat: [処理落ち愛好会, 諦めた]
  - say: 諦めた？ 諦めたっていうか……決めないことに決めたの。
  - chat: [RTOS屋十五年, C は戻り値見て errno だしな]
  - say: C はまず戻り値。失敗したときだけ errno を見るの。errno だけ見ちゃだめよ、前の値が残ってるから。
  - say: ……C の人から見たら、Go のはまだ優しい方ね。
  - chat: [初見の旅人, ノクスちゃんは短くなってほしかった？]
  - say: 短くなってほしかったか？ うーん。……ちょっとだけ。三十回目くらいで、指が疲れるから。
  - chat: [カーネル読み, 好きって言ってたのに]
  - say: 好きって言ってたのに、って……好きと疲れるは、両方あるの。
# そういえば（タブとスペース）
- - chat: [新卒二年目, そういえばノクスさんってタブ派ですか]
  - say: タブ派か？ タブ。
  - chat: [処理落ち愛好会, 即答]
  - say: 即答よ。Go は gofmt っていう道具に任せるの。頭はタブ、位置合わせにはスペースも使うけど、全部道具が決めるから喧嘩しなくていいの。
  - chat: [DDD警察, うちはスペース4つ]
  - say: スペース4つ、スペースの人ね。幅は読む人が決めればいいのに。
  - chat: [夜勤明けの人, 自分はメモ帳でスペース連打してる]
  - say: メモ帳でスペース連打なのね。何回押してるか、数えてる？
  - chat: [夜勤明けの人, 見た目で止めてる]
  - say: 見た目で止めてるの。……それでそろってるなら、いいのよ。
  - chat: [カーネル読み, ピムは？]
  - say: ピム？ ピムはね……家計簿の数字を、全角スペースでそろえてるの。
  - chat: [RTOS屋十五年, 全角]
  - say: {face: surprised, text: 全角なの！ 聞いたとき、小さく声が出たの。}
  - chat: [処理落ち愛好会, ノクスの悲鳴聞きたかった]
  - say: 悲鳴は、聞かせないの。ピムには言ってない。家計簿なら、たぶんそれでいいのよ。
  - ask:
      q: 字の頭をそろえるとき、タブ派？ スペース派？
      options:
      - c: タブ
        r:
        - '{from}、こっちね。'
        - 一回押すだけ。幅はあとで好きに変えられるの。
      - c: スペース
        r:
        - '{from}はスペースなのね。DDD警察さんと一緒。'
        - いいのよ、そろってさえいれば。……全角じゃなければ。
      - c: 全角スペース
        r:
        - '{from}……ピムの仲間がいた。'
        - 家計簿ならいいの。コードには入れないでね。お願い。
      - c: 道具に任せる
        r:
        - '{from}、それが一番揉めないのよね。'
        - Go の人はだいたいそれ。gofmt が決めるから、誰も怒らない。
      npc: [[DDD警察, 1], [カーネル読み, 0], [新卒二年目, 3], [処理落ち愛好会, 2], [RTOS屋十五年, 0], [夜勤明けの人, 1]]
  - chat: [処理落ち愛好会, 全角に入れといた]
  - say: {face: annoyed, text: タブとスペースで半々ね。……処理落ちさん、全角に入れなくていいの。}
  - chat: [カーネル読み, ついでに vim か emacs か]
  - say: vim か emacs か？ vim。昔入ったサーバーには、だいたい vi 系がいたから。今は何も入ってない箱も多いけど。
  - chat: [夜勤明けの人, リゼは？]
  - say: リゼ？ リゼは emacs なの。中にテトリスが入ってるからって。
  - chat: [RTOS屋十五年, 理由がゲーム]
  - say: 理由がゲーム。リゼらしいでしょ。私は、テトリスより先に終わり方を覚えたけど。
  - chat: [処理落ち愛好会, vim の終わり方]
  - say: {face: smug, text: vim の終わり方はね、コロン、q。……最初の日は分からなくて、ウィンドウごと閉じたの。}
# 言語の好き嫌い
- - say: エディタの話も、結局、言語の好き嫌いと同じね。
  - say: 言語の好き嫌いって、楽しいわよね。私、喧嘩は好きなの。
  - say: でも、その言語を書いてる人を馬鹿にし始めたら、そこでやめるの。
  - chat: [新卒二年目, Rust はどうですか]
  - say: Rust はどうか？ 好き。布教してくる人が、ちょっと苦手なだけ。
  - chat: [カーネル読み, 正直]
  - chat: [処理落ち愛好会, Python は？ 遅いって言われてる]
  - say: Python は遅いって？ Python ね。去年の十月に出た 3.14 で、大きいことがあったの。
  - say: 一度に一つしか動けないようにしてた大きな鍵を、外した版があるの。その版の「試験的」っていう札が外れたの。
  - chat: [初見の旅人, 鍵を外すと速くなる？]
  - say: 鍵を外すと速くなるか？ 何人も同時に働けるようになるの。ただ、それが普通の版になるかは、まだ決まってないの。
  - chat: [RTOS屋十五年, 長かったな]
  - say: 長かったな、って。長かったの。外しても周りの部品が壊れないようにするのが、大変だったのよ。
  - chat: [DDD警察, Kotlin の話はしないの]
  - say: Kotlin の話？ 今度、DDD警察さんに教えてもらう。私、詳しくないの。
  - chat: [DDD警察, 教える]
  - say: 教えてくれるの？ ありがとう。
# 締め（チャットの喧嘩）
- - chat: [DDD警察, スペース4つが正義]
  - chat: [新卒二年目, 2つでは]
  - chat: [処理落ち愛好会, 8つ]
  - say: あ、また字下げのスペースの数で揉めてるの？
  - say: 4つ、2つ、8つ……増えてる。
  - chat: [カーネル読み, Linux のカーネルはタブで8幅]
  - chat: [DDD警察, それはタブだろ]
  - chat: [新卒二年目, 結局タブが強い？]
  - say: 結局タブが強い？ ……結論は出ないのよね、この話。毎回。
  - say: みんなで続けてて。私はもう一回 if err != nil を書いてから寝るから。
  - say: おやすみなさい、起きてる人たち。
