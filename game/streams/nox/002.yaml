title: 火星に降りた探査機が、何度も勝手に再起動した理由（1997年）
lobby:
- こんばんは。今日は火星の話。
- 1997年に火星に降りた探査機が、着いてから何度も再起動したの。
- 原因は、急ぎの仕事が、急がない仕事に待たされたこと。
- 途中でお風呂の話になったら、ごめんね。
parts:
# オープニング（半熟）
- - say: あ、映った。こんばんは、起きてる人たち。
  - chat: [処理落ち愛好会, こんばんは（暗い）]
  - say: 「こんばんは、かっこ暗い」……かっこの中、要らないの。
  - chat: [RTOS屋十五年, こんばんは]
  - chat: [夜勤明けの人, 今日寒くない？]
  - say: 夜勤明けさん、今日寒いの？ ここ地下だから、分からないの。隣の機械の部屋があったかくて。
  - say: でもね、寒くなったのは分かった。卵で。
  - chat: [初見の旅人, はじめまして。卵？]
  - say: いらっしゃい、初見さん。卵はね、私、毎朝ゆで卵を七分ゆでるの。夕方だけど。
  - say: 今日、割ったら半熟だったの。
  - chat: [カーネル読み, 冬の半熟きた]
  - say: 冬の半熟、来たの。水道の水が冷たくなると、同じ七分でも半熟になるの。
  - chat: [初見の旅人, 水の温度で変わるんだ]
  - say: 変わるの。お鍋も水の量もタイマーも、全部同じにしてるのに。
  - chat: [RTOS屋十五年, 水温を測ればいい]
  - say: 水温を測れって。分かってるの。測ればいいの。
  - say: {face: shy, text: でも、冬の半熟、好きなのよね。だから直してない。}
  - chat: [処理落ち愛好会, 直さないバグ]
  - say: 直さないバグ。季節もの。
  - chat: [新卒二年目, こんばんは。前回の火星の話、待ってました]
  - say: 新卒さん、前回の火星の話、待っててくれたの？ 覚えててくれたのね。
  - say: 前回ね、私の「OK」で通知が止まった話をしたでしょ。トイレで電話。
  - say: あれと似た所のあることが、一九九七年に火星で起きてるの。鍵を持った子が進めなくなる所。今日はそれ。
# 火星で再起動
- - chat: [初見の旅人, 火星？]
  - say: 火星よ。Mars Pathfinder っていう探査機。一九九七年の七月四日に、火星に降りたの。
  - chat: [初見の旅人, 車のパスファインダーしか知らない]
  - say: 車のパスファインダーもあるわね。小さい車も一緒に降りたから、ちょっと合ってる。
  - say: で、着いてから何日か、勝手に再起動を繰り返したの。
  - chat: [夜勤明けの人, 火星で再起動は怖い]
  - say: 火星で再起動、怖いでしょ。行って電源抜けないもの。
  - say: 原因は、優先度逆転っていうの。
  - chat: [初見の旅人, ゆうせんど……]
  - say: 「ゆうせんど……」で止まっちゃった？ 名前が怖いわよね。ざっくり言うね。
  - say: プログラムの中には、急ぎの仕事と、急がない仕事があるの。急ぎの方が先に動く。
  - say: それがひっくり返るの。急ぎの子が、急がない子のせいで待たされる。
  - chat: [初見の旅人, なんで]
  - say: なんでかっていうと、またトイレなの。ごめんね。
  - say: 急がない子が、先にトイレに入って鍵をかけたの。そこへ急ぎの子が来て、外で待つ。
  - chat: [初見の旅人, 早く出てあげて]
  - say: 早く出てあげて、よね。出たいの。でも、中くらいの子たちが次々に来て、先に動いちゃうの。
  - say: 急がない子は自分の番が来なくて、用を済ませられない。鍵も返せない。
  - chat: [処理落ち愛好会, 中くらいの子が悪い]
  - say: 中くらいの子が悪い？ ううん。中くらいの子も、自分の番だから動いただけなの。
  - say: 誰か一人が悪いわけじゃないのに、詰まるの。嫌でしょ。私は好きなんだけど。
  - chat: [カーネル読み, 好きなのか]
  - say: 好きなのかって？ 好き。人を犯人にして終われない事件なの。見落としは、ちゃんとあったけど。
# 話が二つある
- - say: でね、この事件、広まった話と、作った本人があとから書いた話があるの。
  - say: その年の十二月に、探査機の OS を作った会社の人が、学会で話したの。
  - say: それを聞いた Microsoft の Mike Jones さんが、メールで要約を流したの。
  - say: 題が「What really happened on Mars?」。
  - chat: [カーネル読み, で、本人から返事が来る]
  - say: そう、本人から返事が来るの！ 探査機のソフトを作ってた Glenn Reeves さんから。
  - say: 書き出しがね、「この要約、たぶん四百人くらいから転送されてきた」。
  - chat: [処理落ち愛好会, 400人ｗ]
  - chat: [夜勤明けの人, 本人のとこに回ってくるのつらい]
  - say: {face: laugh, text: 本人のとこに回ってくるの、つらいわよね。四百通よ。受信箱どうなってたのかしら。}
  - say: で、Reeves さんの方を読むと、Jones さんの版と違う所があるの。
  - chat: [RTOS屋十五年, 本人の説明だと、ウォッチドッグとは書いてない]
  - say: 「本人はウォッチドッグとは書いてない」……RTOS屋さん、先に言わないで。合ってるけど。
  - chat: [初見の旅人, うぉっちどっぐ？]
  - say: ウォッチドッグっていうのは、返事がしばらくないと叩き起こす見張りのこと。Jones さんの版だと、見張りが再起動させたことになってるの。
  - say: Reeves さんの版だと、一秒に八回まわる仕事の区切りで、「前の回の仕事、終わってる？」って確かめる所があって。
  - say: 終わってなかったら、そこで再起動。
  - chat: [カーネル読み, 結果は同じでは]
  - say: 結果は同じでは、って？ 再起動したのは同じ。でも、名前より、何を見張ってたかが大事なの。
  - say: Reeves さんの版だと、見てたのは仕事の締め切り。締め切りに間に合わなかった理由を追ったら、鍵に着いたの。
# そういえばお風呂（シャワーだけ）
- - chat: [夜勤明けの人, 話それるけど寒いから今日は湯船にお湯張った]
  - say: 寒いから湯船にお湯張ったの？ え、いいわね。何分入るの？
  - chat: [夜勤明けの人, 気づいたら一時間]
  - say: {face: surprised, text: 一時間。のぼせない？}
  - chat: [処理落ち愛好会, ノクスは湯船派？]
  - say: 私が湯船派か？ ううん、シャワーだけなの。冬も。
  - chat: [初見の旅人, 寒くない？]
  - say: 寒くないかって？ 寒いの。だから、出る前に足だけお湯をずっと当ててる。
  - say: 前に一回、シャワーをうんと熱くしたことがあるの。
  - say: そしたら上がってから、画面の字が揺れて見えて。
  - say: コードを一行、読み間違えたの。
  - chat: [カーネル読み, それは風呂のせいなのか]
  - say: 風呂のせいなのか、って……お風呂のせい。そういうことにしてるの。
  - chat: [新卒二年目, シャワーって朝ですか夜ですか]
  - say: 朝か夜か？ 朝。仕事が終わって、寝る前。十分で出るの。
  - chat: [処理落ち愛好会, 終了処理]
  - say: {face: annoyed, text: 終了処理って言わないで。……合ってるけど。}
  - chat: [定時退社したい, 湯船入らないの？]
  - say: 湯船に入らないのか？ 入ると、そのまま寝そうで怖いの。当番の電話が鳴っても出られないでしょ。
  - chat: [定時退社したい, 風呂でも当番のこと考えてる]
  - say: 考えてる。……定時さんは、お風呂で仕事のこと考えないの？
  - chat: [定時退社したい, 考えないために定時で帰ってる]
  - say: {face: surprised, text: 考えないために定時で帰ってる……うらやましい。それ、どうやるの。}
# お天気係
- - chat: [RTOS屋十五年, 風呂もいいけど、火星で待たされてたのは誰]
  - say: 火星で待たされてたのは誰か。そう、火星。
  - say: 鍵を握ったまま止められた子が誰だったか、なの。
  - say: 気象を測る係。ASI/MET っていう名前。
  - chat: [初見の旅人, お天気係]
  - say: そう、お天気係ね。
  - say: ほかの係は、掲示板みたいなやり方でデータを受け取ってたの。お天気係だけ、別のやり方だった。
  - say: パイプっていう筒で受け取って、select っていう道具で「何か来た？」って待ってたの。
  - chat: [カーネル読み, 鍵は select の中]
  - say: 「鍵は select の中」、そこ！ 鍵はね、お天気係が自分で作ったんじゃなくて、OS の select の中にあったの。
  - chat: [処理落ち愛好会, ！出た]
  - say: {face: flustered, text: 「びっくりマーク出た」って……出てない。出たけど。}
  - say: 自分で作った鍵なら、作るとき設定を見るでしょ。OS の中の鍵は、誰も見てなかったの。
  - chat: [新卒二年目, ライブラリの中まで見ないです]
  - say: ライブラリの中まで見ない、よね。私も前回のは、よその会社の返事の遅さを見てなかったし。
  - say: で、地球に同じ作りの機械があって、そこで何度も同じ仕事を流したの。
  - say: 中の出来事を全部記録する仕組みを付けて。そしたら、十八時間かからずに同じことが起きたの。
  - chat: [RTOS屋十五年, 地上の双子]
  - say: 地上の双子。火星の機械は持って帰れないから、地球の双子で起こしたの。
  - chat: [初見の旅人, 打ち上げ前には気づかなかったの？]
  - say: 打ち上げ前に気づかなかったか？ 試験のときも、実は起きてたの。でも再現できなくて、後回しになったの。
  - say: 着陸のソフトを先に仕上げる方が大事だったから。
  - say: Reeves さんはそれを「We had our priorities right.」って書いてるの。優先順位は正しかった、って。
  - chat: [カーネル読み, 優先度のバグの話でそれ言う]
  - say: {face: laugh, text: 優先度のバグの話でそれ言う、って……言うの。たぶん、わざと。}
# 直し方
- - chat: [新卒二年目, どうやって直したんですか]
  - say: どうやって直したか。設定を一個変えて、継承っていう仕組みを入れたの。
  - say: 鍵を握ってる下っ端の子に、待ってる急ぎの子の優先度を、その間だけ貸すの。
  - chat: [初見の旅人, 今だけ偉くなる]
  - say: そう、今だけ偉くなるの。偉くなれば、中くらいの子に抜かされないでしょ。すぐ出てこられるの。
  - say: でもね、その一個の設定、select の鍵の全部に効くの。だから地上の双子で、ほかの所の動きが変わらないか、ちゃんと試してから送ったの。
  - chat: [カーネル読み, 火星にプログラムを打ち込んで直したんでしょ]
  - say: 火星にプログラムを打ち込んで直した、ね。広まった話だとそうなの。探査機の中のインタプリタで直した、って。
  - say: Reeves さんは「シェルでソフトを変えてはいない」って書いてるの。
  - say: 地上で直した版との差分を送って、探査機の中の専用のソフトが確かめてから当てたの。
  - chat: [処理落ち愛好会, 地味]
  - say: 地味でしょ。でも私は、そっちの方がどきどきする。
  - chat: [処理落ち愛好会, 本番で直接いじらないのか]
  - say: 本番で直接いじらないのか？ いじらないの。……ねえ、その目で私を見ないで。
  - chat: [処理落ち愛好会, 先週配信中に設定いじって真っ暗にした人]
  - say: {face: annoyed, text: 「配信中に設定いじって真っ暗にした人」……あれは配信の設定。火星じゃないの。}
  - chat: [RTOS屋十五年, 本番は本番]
  - say: ……はい。
  - chat: [RTOS屋十五年, ところで自分は継承より天井派]
  - say: RTOS屋さんは天井派。来たわね。毎回これで揉めるの。
  - say: 天井にもやり方がいくつかあるの。今話すのは、「このトイレに入った人は、入った瞬間に偉くなる」って最初から決めておくやり方。
  - chat: [RTOS屋十五年, 設計の時点で待ち時間の上限が読める]
  - say: 待ち時間の上限が読める、そう、読めるの。資源と締め切りが全部読めるなら、天井は強いの。
  - say: でも、誰がどのトイレを使うか、全部書き出せないと決められないでしょ。
  - say: 今日のみたいに、OS の中の鍵は書き出せないこともあるの。
  - ask:
      q: 待たされた時だけ偉くする（継承）と、最初から偉くしておく（天井）、どっちが好き？
      options:
      - c: 待たされた時だけ（継承）
        r:
        - '{from}、私と同じ。'
        - 普段は誰の邪魔もしないのがいいの。困ったときだけ出てくるの。
      - c: 最初から（天井）
        r:
        - '{from}は RTOS屋さんの方ね。'
        - 書き出せる設計なら、私も天井を選ぶの。……書き出すのが面倒なのは、また別の話。
      - c: そもそも鍵を使わない
        r:
        - '{from}、それやると別の苦労が始まるのよ。'
        - 鍵がなくても、順番を守らせる方法は要るの。難しさが別の所に移るだけ。
      npc: [[RTOS屋十五年, 1], [カーネル読み, 0], [DDD警察, 2], [処理落ち愛好会, 1], [新卒二年目, 0]]
  - chat: [RTOS屋十五年, 天井が多い]
  - say: {face: annoyed, text: 天井が多いって……継承と天井で、だいたい半々でしょ。今日は数えないで。}
  - chat: [処理落ち愛好会, 負けてる]
  - say: 負けてない。半々なの。
# 締め（よる）
- - chat: [新卒二年目, 今の Linux だと継承は入ってるんですか]
  - say: 今の Linux で？ 入れられるの。でも普通の pthread の鍵は、頼まないと継承なしなの。
  - say: 既定は PTHREAD_PRIO_NONE。火星と同じで、頼まなかったら付いてないの。
  - chat: [新卒二年目, 明日うちのコード見てみます]
  - say: 明日見てみるのね。何もなくても、見たことは覚えておいて。
  - chat: [初見の旅人, お風呂行ってきます]
  - say: お風呂行ってくるの？ いってらっしゃい。何度にするの？
  - chat: [初見の旅人, 40度]
  - say: 40度ね。長湯して、のぼせないでね。
  - say: じゃあ、よるを起動するね。私の作ってる OS。
  - chat: [カーネル読み, 今日の仮説は]
  - say: 今日の仮説はね、準備の順番を一個入れ替えたの。時計の合図を受ける前の準備。
  - say: yoru、って出た。合図を入れる。
  - say: {face: surprised, text: 落ちた。}
  - chat: [処理落ち愛好会, 今日も落ちた]
  - chat: [RTOS屋十五年, 地上の双子で試したら]
  - say: 地上の双子で試せって？ 双子がいないの。……あ、部屋の古い機械でやればいいのか。来週やる。
  - say: 起きてる人たち、ありがとう。楽しかった。
  - say: 寝なさい。私は、半熟の卵を食べてから寝るけど。
