title: 「これは理解できなくていい」と書かれた、昔の Unix のコメント
lobby:
- こんばんは。今日は昔の Unix の話。
- 1970年代のソースに、「理解しなくていい」って書いてあるコメントがあるの。
- 本当の意味は、ちょっと違うのよ。
- 途中で、初めて買った CD の話をするかも。
parts:
# オープニング（書きかけたコメント）
- - say: あ、映った。こんばんは、起きてる人たち。
  - chat: [カーネル読み, こんばんは]
  - chat: [RTOS屋十五年, こんばんは]
  - chat: [処理落ち愛好会, こんばんは。今日はよる起動する？]
  - say: よるを起動するか？ するかも。……今日ね、よるのコードにコメントを書いてたの。
  - chat: [初見の旅人, はじめまして。よる？]
  - say: いらっしゃい、初見さん。よるはね、私が趣味で作ってる、小さい OS の名前なの。
  - say: で、仕事を切り替える所のコードに、説明を書こうとしたの。
  - say: 書けなくて。気づいたら「理解しなくていい」って打ってたの。
  - chat: [カーネル読み, You are not expected to understand this]
  - say: {face: smile, text: You are not expected to understand this、それ！ それを書きそうになったの。}
  - chat: [処理落ち愛好会, 自分で書いたのに理解してない]
  - say: 自分で書いたのに理解してない、そう、理解してないの。してたら、よるはもう落ちてないの。
  - chat: [RTOS屋十五年, 結局なんて書いた]
  - say: 結局なんて書いたか？ 「あとで書く」って書いたの。
  - chat: [処理落ち愛好会, 一番だめなやつ]
  - say: 一番だめなやつ、そうなの。でも「理解しなくていい」よりは、まだ正直でしょ。
  - chat: [カーネル読み, 正直さで勝負するな]
  - say: 正直さで勝負するな、って……勝負はしてないの。
  - chat: [初見の旅人, ゆー あー のっと……？]
  - say: 「ゆー あー のっと」っていうのはね、一九七〇年代の Unix のソースに、本当にそう書いてあるコメントがあるの。今日はその話。
# 試験に出ない
- - say: Unix の第六版っていう、一九七五年ごろの版があるの。
  - say: その中で、動いてる仕事を別の仕事に切り替える所のコメントに、「You are not expected to understand this.」って。
  - chat: [初見の旅人, 理解しなくていい？]
  - say: 理解しなくていい？ 直訳だと「あなたが分かることは期待してません」。だからずっと、「凡人には分からん」っていう意味だと思われてたの。
  - chat: [処理落ち愛好会, 煽ってる]
  - say: 煽ってる、そう見えるでしょ。でも、書いた側のデニス・リッチーさんが、あとで説明してるの。
  - say: 煽りじゃなくて、「ここは試験に出ません」くらいの冗談だった、って。
  - chat: [初見の旅人, 試験に出ない]
  - say: 試験に出ない、そう。授業の先生が「ここは飛ばしていいよ」って言う感じ。
  - chat: [RTOS屋十五年, 実際、本当に分かりにくいコードだった]
  - say: 本当に分かりにくいコードだった、そう、分かりにくかったの。その頃の PDP-11 っていう機械の、C のコンパイラがレジスタをどうしまうかに頼ってたの。
  - chat: [初見の旅人, れじすた？]
  - say: レジスタっていうのは、CPU の中の、手元のメモ用の小さい引き出し。そこの使い方のくせに頼ってた、ってこと。
  - say: だからほかの機械に持っていくと動かなくて、次の第七版で作り直されたの。
  - chat: [カーネル読み, 機械のくせに頼ったコードは移植で壊れる]
  - say: 機械のくせに頼ったコードは移植で壊れる、壊れるの。よるも、たぶんそれ。……分からないけど。
# コピーのコピーで回った本
- - chat: [カーネル読み, ライオンズ本の話もして]
  - say: ライオンズ本の話？ する。
  - say: オーストラリアの大学の John Lions さんが、そのソースを全部、授業のために解説した本を作ったの。一九七七年。
  - chat: [初見の旅人, 教科書？]
  - say: 教科書かって？ 教科書。でもね、そのあと Unix の持ち主の会社が、ソースの解説を授業で使うのを認めなくなったの。
  - say: だから正式には出せなくなっちゃって。
  - say: そしたら世界中の学生が、コピーのコピーを回して読んだの。
  - chat: [処理落ち愛好会, 海賊版]
  - say: 海賊版……そう言われちゃうと困るけど、まあ、そう。
  - chat: [RTOS屋十五年, 夜中に集まって読んだって話もある]
  - say: 夜中に集まって読んだ話、あるの。学生が授業のあとに集まって、コピーを囲んで読んだって。いいわよね、そういうの。
  - chat: [カーネル読み, 正式に出たのは1996年]
  - say: 正式に出たのは1996年、そう、二十年くらいたってから。やっと普通に買えるようになったの。
  - chat: [新卒二年目, 二十年コピーで回ってたんですか]
  - say: 二十年コピーで、回ってたの。それだけ読みたい人がいたのよ。
  - chat: [処理落ち愛好会, ノクスは読んだの]
  - say: 私が読んだか？ 読んだの。大学の計算機室の夜番のときに、先輩の机に正式に出た方の本が置いてあって。
  - say: 夜中、誰も来ないから、ずっと読んでたの。
  - chat: [カーネル読み, どこまで分かった]
  - say: {face: shy, text: どこまで分かったか……例のコメントの所で、ちゃんと分からなかった。}
  - chat: [RTOS屋十五年, 試験に出ないからいい]
  - say: 試験に出ないからいい、そう、出ないからいいの。そういうことにしてるの。
  - chat: [新卒二年目, 今でも読む価値ありますか]
  - say: 今でも読む価値？ あると思う。今の OS よりずっと小さいから、全部読めるのよ。全部読める OS って、あんまりないの。
  - chat: [カーネル読み, 今の Linux は読み切れない]
  - say: 今の Linux は読み切れない？ カーネル読みさんでも？
  - chat: [カーネル読み, 一生かかっても無理]
  - say: 一生かかっても無理、って。カーネル読みさんが無理なら、私も無理ね。
# そういえば（初めての CD）
- - chat: [夜勤明けの人, 1996年って何してた？]
  - say: 1996年に何してたか？ 私はまだ魔界にいたの。人間界に来たのは、次の一九九七年。
  - chat: [処理落ち愛好会, 来て最初に何した]
  - say: 来て最初に何したか。秋葉原の部品屋さんで店番。で、最初のお給料で、CD を買ったの。
  - chat: [初見の旅人, 何の CD？]
  - say: 何の CD か？ 電気グルーヴの「Shangri-La」。シングルの。
  - chat: [RTOS屋十五年, 1997年のやつだ]
  - say: そう、その年に出たの。お店で流したら、店長に「部品屋っぽくない」って言われたの。
  - chat: [処理落ち愛好会, 部品屋っぽい曲って何]
  - say: 部品屋っぽい曲って何、って……知らないの。でもね、次の日から、店長の方が口ずさんでたの。
  - chat: [夜勤明けの人, 店長ハマってる]
  - say: 店長ハマってる、そう、ハマってたの。私よりずっと。
  - chat: [新卒二年目, 初めて買った CD、僕はもうなかったかも。最初からサブスクで]
  - say: {face: surprised, text: 最初からサブスク？ そうなのね。……そうよね、新卒さんの世代だと。}
  - chat: [カーネル読み, 自分はレンタル屋で借りてダビング]
  - say: レンタル屋でダビング。分かる人と分からない人がいるわね、今のチャット。
  - chat: [初見の旅人, 分からない]
  - say: 分からない？ ダビングは、カセットテープに録音して写すこと。……説明すると、急に年を取った気がするの。
  - chat: [処理落ち愛好会, 初めての携帯は]
  - say: 初めての携帯？ 一九九九年の、iモードのドコモの携帯。これも店番のお給料で買ったの。
  - chat: [夜勤明けの人, iモード懐かしい]
  - say: iモード懐かしいでしょ。画面が小さくて、白黒……じゃなかった、もう色は付いてたかしら。覚えてないの。
  - chat: [RTOS屋十五年, 機種による]
  - say: 機種によるのね。私のは、ボタンを押すと、ちょっとだけ光ったの。
  - chat: [処理落ち愛好会, 光らせない設定にしてそう]
  - say: {face: annoyed, text: 光らせない設定にしてそう、って……その頃は、まだしてなかったの。}
  - chat: [初見の旅人, 今のスマホは？]
  - say: 今のスマホ？ Pixel の 6a。小さくて、片手で当番の通知を消せるの。四年使ってる。
# 何の話だっけ（一周する時計）
- - say: ……あれ、何の話してたっけ。
  - chat: [カーネル読み, 理解しなくていいコメント]
  - say: 理解しなくていいコメント、そう。ありがとう。
  - say: 昔のソースのコメントで、もう一個好きなのがあるの。今の Linux の中にあるの。
  - say: Linux はね、起動してからの時間を、jiffies っていう数で数えてるの。
  - chat: [初見の旅人, じふぃーず]
  - say: jiffies はね、時計が一回カチッて鳴るたびに一つ増える数。
  - say: その数、箱の大きさが決まってるから、いつか一周して 0 に戻っちゃうの。
  - chat: [処理落ち愛好会, 戻るとどうなる]
  - say: 戻るとどうなるか？ 一周したときのことを考えてないプログラムは、時間が逆に進んだと思って変なことをするの。
  - say: でね、Linux では、その数の下の32ビットの所が、起動して五分で一周するように、最初の数をずらしてあるの。
  - chat: [初見の旅人, 32ビット？]
  - say: 32ビットっていうのは、数を入れる箱の大きさのこと。その箱がいっぱいになる少し手前から、わざと数え始めるの。
  - chat: [初見の旅人, わざと？]
  - say: わざとなの。コメントに「一周のバグが早く見つかるように」って書いてあるの。
  - chat: [RTOS屋十五年, 何十日も待たなくていい]
  - say: 何十日も待たなくていい、そう。本当に何十日も動かす試験もあるけど、毎回は待てないでしょ。だから最初から、一周の手前にしておくの。
  - chat: [カーネル読み, Windows 95 の 49.7 日]
  - say: Windows 95 の 49.7 日、あったわね。ミリ秒を 32 ビットで数えると、だいたい 49.7 日で一周するの。
  - say: 当時の Windows には、49.7 日つけっぱなしにすると止まる不具合があったの。
  - chat: [処理落ち愛好会, 49日もつけっぱなしにしない]
  - say: 49日もつけっぱなしにしない、そう、しないから、なかなか見つからなかったのよね。
  - chat: [定時退社したい, うちの会社のサーバー、一か月に一回再起動する決まりがある]
  - say: 一か月に一回、決まりで再起動するの？
  - chat: [定時退社したい, 理由は誰も知らない]
  - say: {face: laugh, text: 理由は誰も知らないのね。}
  - say: たぶん昔、何十日かで調子が悪くなった機械があったのよ。その人はもういなくて、決まりだけ残ってるの。
  - chat: [RTOS屋十五年, よくある]
  - chat: [新卒二年目, うちにもあります。月曜は再起動の日]
  - say: 月曜は再起動の日、あるのね。……やめる前に、理由を探してね。昔の障害の記録とか。
  - say: 見つからなかったら、試験の環境で長く動かして、時計も境目まで進めて確かめるの。いきなり本番でやめないでね。
  - chat: [処理落ち愛好会, よるは何日で落ちる]
  - say: よるは何日で落ちるか？ 書き直してる方は、一回目のカチッで落ちるの。一周どころじゃないの。
  - chat: [カーネル読み, 0日]
  - say: {face: annoyed, text: 0日って言わないで。0.01秒くらいはもってるの。}
  - ask:
      q: コードのコメントに、自分でも分からなくなった一言を書いたことある？
      options:
      - c: ある
        r:
        - '{from}もなのね。なんて書いたの？'
        - 私、昔のに「ここ触るな」って書いてあって、理由が書いてなかったの。自分の字で。
      - c: 「あとで直す」なら山ほど
        r:
        - '{from}、私もそれいっぱいある。'
        - 「あとで」がいつなのか、書いておけばよかったのよね。……仕事なら、理由と、困る条件を残すの。趣味のは、たまってるけど。
      - c: コメントはほとんど書かない
        r:
        - '{from}は書かない派なのね。'
        - コードで分かるならいいの。コードに書けない理由だけは、残してあげて。次の人が困るから。
      npc: [[カーネル読み, 1], [RTOS屋十五年, 0], [新卒二年目, 2], [処理落ち愛好会, 1], [DDD警察, 1]]
  - chat: [処理落ち愛好会, あとで直すが多い]
  - say: 「あとで直す」が多いわね。みんな同じなのね。
# 締め（大晦日の思い出話）
- - chat: [RTOS屋十五年, 一周の話なら 2000年問題]
  - say: 一周の話なら2000年問題、あ、それね。私、一九九九年の大晦日は、大学の計算機室で夜番のバイトをしてたの。
  - chat: [夜勤明けの人, 何か起きた？]
  - say: 何か起きたか？ 何も起きなかったの。零時になって、機械を一台ずつ見て回ったけど、全部普通。
  - say: あとで知ったの。何年も前から、直してた人たちがいたって。
  - chat: [RTOS屋十五年, その年はずっと直してた]
  - say: その年はずっと直してた……RTOS屋さんも？
  - chat: [RTOS屋十五年, 年の二桁を四桁にする仕事を一年中]
  - chat: [RTOS屋十五年, 大晦日は会社で年越しそば]
  - say: 二桁を四桁にする仕事を一年中。で、会社で年越しそば。
  - chat: [カーネル読み, 自分は実家でテレビ見てた]
  - chat: [夜勤明けの人, 自分はまだ小学生]
  - say: {face: surprised, text: 実家でテレビ、まだ小学生……。}
  - chat: [新卒二年目, 僕は生まれてないです]
  - say: 生まれてない……今日はここで終わりにするね。
  - say: よるは、明日起動する。おやすみなさい、起きてる人たち。
