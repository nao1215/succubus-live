title: 小さい管理画面に、大げさな設計を入れたら（名前だけの DDD と、分けすぎて戻した人たち）
lobby:
- こんばんは。今日は設計の話。ちょっと愚痴もある。
- テーブル四つの画面に、六段の層の設計を入れた現場の話。
- 分けすぎて、一つに戻した会社の話もするね。
- 途中でサイゼリヤの話をすると思う。
parts:
# オープニング（提案書）
- - say: あ、映った。こんばんは、起きてる人たち。
  - chat: [DDD警察, こんばんは]
  - say: DDD警察さん、こんばんは。今日は来ると思ってた。
  - chat: [DDD警察, なんで]
  - say: 「なんで」って……今日ね、うちの営業さんから、新しい案件の提案書の下書きが回ってきたの。技術の所を見てって。
  - say: 一ページ目に「マイクロサービスで作ります」って書いてあったの。
  - chat: [処理落ち愛好会, 嫌そう]
  - say: {face: annoyed, text: 「嫌そう」って、見えた？ 暗いのに。}
  - chat: [初見の旅人, はじめまして。まいくろさーびす？]
  - say: いらっしゃい、初見さん。マイクロサービスはね、一つのアプリを、小さいアプリにたくさん分けて作るやり方なの。
  - say: お店で言うと、レジと厨房と在庫を、別々の会社にお願いする感じ。
  - chat: [初見の旅人, 連絡が大変そう]
  - say: 連絡が大変そう、って。そう、そこが大変なの。
  - chat: [DDD警察, 分ける理由が書いてあればいい]
  - say: 分ける理由ね。……書いてなかったの。「拡張性のため」だけ。
  - chat: [DDD警察, それはだめ]
  - say: だめよね。……DDD警察さんと意見が合うの、珍しいわね。
  - chat: [カーネル読み, 何を作る案件]
  - say: 何の案件か？ 町の歯医者さんの予約。先生が一人で、椅子が二つ。
  - chat: [RTOS屋十五年, 椅子二つにマイクロサービス]
  - chat: [処理落ち愛好会, 椅子ごとにサービス]
  - say: {face: laugh, text: 椅子ごとにサービス、って。それなら二個で済むわね。}
  - chat: [新卒二年目, 断るんですか]
  - say: 断るのかって？ 断らないの。何を良くしたいのか、先にお客さんに聞いてもらうの。負荷なのか、別々に更新したいのか、壊れ方を分けたいのか。
  - say: 今の話なら、「一つで作って、困ったら分けましょう」って書くつもり。でも、どうしても分けなきゃいけない境目があるなら、先に聞きたいの。
  - chat: [DDD警察, 通るといいな]
  - say: 通るといいけど。通らなかったら、分ける理由と、どこで切るかを一緒に書く係になるの。それも私の仕事。……そのときは愚痴を聞いて。
# 三百十二個
- - chat: [カーネル読み, 三百十二個の話？]
  - say: 三百十二個の話……それ、言うの。
  - chat: [新卒二年目, 何ですかそれ]
  - say: 何かっていうとね、前に行ってた客先の現場の話。テーブル四つの管理画面があったの。
  - chat: [初見の旅人, テーブル？]
  - say: テーブルっていうのは、データの表のこと。お客さんの表、商品の表、みたいな。四つしかない、小さい画面なの。
  - say: そこに設計の人が、六段の層を入れたの。「クリーンアーキテクチャで、DDD で」って。
  - chat: [初見の旅人, 層？]
  - say: 層はね、仕事を段に分けるの。画面の段、決まりの段、データの段、って。本当は分ける理由があるの。
  - say: でも小さい画面で六段にすると、上の段から下の段へ、同じ中身を写すだけの関数がいっぱいできるの。
  - say: 私、それを三百十二個書いたの。
  - chat: [処理落ち愛好会, 数えたのか]
  - say: 数えたのかって？ 数えたの。悔しかったから。
  - chat: [新卒二年目, 写すだけって、名前を付け替えるだけですか]
  - say: 名前の付け替えだけか、って。そう。「ユーザー」を「ユーザーの入れ物」に入れて、次の段で「ユーザーの別の入れ物」に入れ替えるの。中身は同じ。
  - chat: [定時退社したい, それ残業の元]
  - say: 残業の元、そうなの。一項目足すたびに六か所直して、同じ写し漏れを二回、本番に出したの。
  - say: だからその数を集めて、層を減らす案を書いて、定例で聞いたの。「その設計で、何が得したんですか」って。
  - chat: [カーネル読み, 聞いたんだ]
  - say: 聞いたの。チャットじゃなくて、声で。めずらしく。
  - say: 案は通らなくて、翌月、別の班に移ったの。理由は、聞けなかった。……聞けばよかった。
  - chat: [処理落ち愛好会, ｗｗｗ]
  - chat: [DDD警察, それは DDD じゃなくて層の病気]
  - say: 層の病気、ね。分かってる。DDD警察さん、いつもそう言ってくれるの。
  - say: DDD そのものは嫌いじゃないの。名前だけの DDD が嫌いなの。
  - say: 今は私がリードだから、反対の案を出してくれる子の話は、最後まで聞くようにしてるの。あのときの私が欲しかったの、それだったから。
# 中身のない入れ物
- - chat: [DDD警察, その現場、ドメインのクラスに振る舞いはあった？]
  - say: 振る舞い？ なかったの。入れ物だけ。
  - chat: [初見の旅人, 振る舞い？]
  - say: 振る舞いっていうのはね。DDD で揃えたいのは、その仕事の言葉と決まりなの。
  - say: 「お客さん」があったら、「お客さんは何ができるか」も近くに置くやり方が、よく使われるの。
  - say: たとえば「この人は、もう一回割引を使える？」みたいな決まりを、お客さんのそばに書くの。
  - say: その現場のは、名前と住所をしまう箱だけで、決まりは全部よその段に散らばってたの。
  - chat: [DDD警察, 貧血のドメインモデル]
  - say: そう、貧血のドメインモデル。Martin Fowler さんが二〇〇三年に、そう呼んで書いてるの。見た目は立派なのに、中に振る舞いがない、って。
  - chat: [処理落ち愛好会, 貧血は鉄分とれ]
  - say: {face: laugh, text: 鉄分とれ、って。コードに鉄分あげたいわね。}
  - chat: [新卒二年目, うちのチームも AI が「DDD 準拠です」って説明欄に書いてきます]
  - say: AI が「DDD 準拠です」って？ 書いてくるのよね、最近。
  - say: 私、レビューのとき、その説明欄を見たら、まず言葉の一覧と、コードの名前と、お客さんの言葉が同じか比べるの。
  - chat: [新卒二年目, 言葉の一覧？]
  - say: 言葉の一覧っていうのは、お客さんとこっちで、同じ物を同じ名前で呼ぶための一覧。
  - say: でも一覧だけ揃っても、会話とコードで同じ名前を使ってないと意味がないの。
  - say: 前の現場のは、三年前のまま止まってたの。お客さんはもう別の名前で呼んでるのに。
  - chat: [DDD警察, それは DDD じゃない]
  - say: そうなの。だから、名前だけって言ってるの。
  - chat: [新卒二年目, 明日うちのも探してみます]
  - say: 明日探すのね。なかったら、作ってみて。お客さんと話す人と一緒にね。最初は十個くらいでいいから。
# 六角形に意味はない
- - chat: [RTOS屋十五年, ヘキサゴナルってなんで六角形なの]
  - say: なんで六角形か？ あ、それ好きな話。
  - say: ヘキサゴナルアーキテクチャっていうのはね、二〇〇五年に Alistair Cockburn さんが書いた設計の考え方なの。
  - say: 真ん中に大事な決まりを置いて、外とつなぐ口をまわりに並べるの。
  - chat: [初見の旅人, 六角形の意味は]
  - say: 六角形の意味はね、本人が「六って数字が大事だから六角形なわけじゃない」って書いてるの。
  - say: 描く人が、口をいくつでも描き足せるように、場所が要っただけなんだって。
  - chat: [処理落ち愛好会, 適当]
  - say: 適当じゃないの。正直なの。私はその一文が好き。
  - chat: [DDD警察, 円が四つのやつも、四つじゃなくていいって本人が言ってる]
  - say: そう、円が四つのクリーンアーキテクチャも。描いた人たちは、わりとゆるいのよね。
  - say: 真似する人の方が、きっちり四つにしちゃうの。
  - chat: [カーネル読み, 六段にしちゃう]
  - say: {face: annoyed, text: 六段にしちゃうの。}
# そういえば（サイゼリヤ）
- - chat: [新卒二年目, そういえばこの前、チームの設計の打ち合わせサイゼでやりました]
  - say: 打ち合わせをサイゼリヤで！ いいわね。何食べたの？
  - chat: [新卒二年目, ミラノ風ドリア]
  - say: ミラノ風ドリア。私もそれと、辛味チキン。
  - chat: [処理落ち愛好会, 安定]
  - say: 安定でしょ。安いから、長くいても気が楽なの。
  - chat: [夜勤明けの人, 間違い探しやる？]
  - say: 間違い探し？ やる。全部見つけるまで帰らないの。
  - say: 一回ね、最後の一個がどうしても見つからなくて、三時間いたの。
  - chat: [初見の旅人, 三時間]
  - say: そう、三時間。ドリンクバーの四杯目で見つかったの。思わず声が出ちゃって、隣の席の人に振り向かれた。
  - chat: [カーネル読み, 声で喋ってる]
  - say: {face: shy, text: 声で喋ってる、って……そういうときだけ出るの。}
  - chat: [新卒二年目, うちの打ち合わせも間違い探しで終わりました]
  - say: 間違い探しで終わったの？ 設計は？
  - chat: [新卒二年目, 決まりませんでした]
  - say: {face: laugh, text: 決まらなかったのね。サイゼだと、そうなるのよね。}
  - chat: [夜勤明けの人, 辛味チキン何本頼む]
  - say: 何本か？ 一皿。二本食べたら残りは持って帰ろうって、毎回思うの。
  - chat: [定時退社したい, 結局全部]
  - say: 結局全部食べるの。冷めると悲しいから。
  - chat: [処理落ち愛好会, 見積もりと同じ]
  - say: {face: annoyed, text: 見積もりと同じ、じゃないの。見積もりの話はしてないの。}
# 分けすぎて戻した
- - say: サイゼの話、また長くなったわ。さっきの、分けすぎたサービスだけど。
  - say: 分けすぎて、一つに戻した会社の話が、いくつかあるの。
  - say: 二〇一八年に、Segment っていう会社が「さよならマイクロサービス」っていう記事を書いてるの。
  - say: 送り先ごとに小さいアプリを作ってたら、百四十個を超えちゃって。それを一つにまとめたの。
  - chat: [処理落ち愛好会, 百四十]
  - say: 百四十の面倒を見るのに、人が足りなくなったのよね。
  - say: 二〇二三年には、Amazon の Prime Video の人たちが、動画の品質を見張る仕組みを一つにまとめて、費用を九割下げたって。
  - chat: [DDD警察, あれは分散が悪いんじゃなくて、部品の選び方の問題だったって反論も多い]
  - say: 部品の選び方の問題だった、って反論ね。そこは大事。分けたのが悪い、じゃなくて、あの使い方だと高くついた、って話なの。
  - chat: [RTOS屋十五年, 両方読むのがいい]
  - say: 両方読む、そうね。で、私が好きなのは、Martin Fowler さんの二〇一五年の短い記事。
  - say: 「うまくいったマイクロサービスの話は、ほとんどが、大きくなりすぎた一つのアプリを分けたところから始まってる」って。
  - chat: [新卒二年目, 最初から分けたらだめってことですか]
  - say: だめって言い切ってはいないの。でも、最初から分けて苦労した話の方が多い、って。
  - ask:
      q: 新しく作るなら、最初から小さく分ける？ まず一つで作る？
      options:
      - c: 最初から分ける
        r:
        - '{from}は分ける派なのね。'
        - どこで分けるか、最初に分かってるならいいの。分かってる？
      - c: まず一つで作って、あとで分ける
        r:
        - '{from}、私もそっち。'
        - 一つで作ってみると、どこで切ると楽か、あとで見えてくるの。
      - c: ずっと一つでいい
        r:
        - '{from}、それで困らないなら、それがいいのよ。'
        - 分けなきゃいけない日が来たら、そのとき考えればいいの。
      npc: [[DDD警察, 1], [新卒二年目, 1], [カーネル読み, 2], [RTOS屋十五年, 2], [処理落ち愛好会, 0]]
  - chat: [処理落ち愛好会, 分ける派一人]
  - say: 一つで作る派が多いわね。分ける派は一人……処理落ちさん、分けるのね。
  - chat: [処理落ち愛好会, なんとなく]
  - say: なんとなくなのね。……提案書を書いた人と同じじゃない。
# 締め（うまくいった現場）
- - chat: [DDD警察, 一回だけ、DDD がうまくいった現場にいた]
  - say: ……聞きたい。
  - chat: [DDD警察, お客さんと同じ言葉で話すのを、本当にやってた]
  - chat: [DDD警察, 言葉の一覧を毎週直してた。営業の人も一緒に]
  - say: お客さんと同じ言葉で話して、その言葉の一覧を毎週直してたのね。
  - say: 毎週。営業の人も。
  - chat: [DDD警察, 層は三つだけだった]
  - say: 層が、三つだけ。
  - chat: [DDD警察, 仕様の変更が来ても、どこを直せばいいか、みんなすぐ言えた]
  - say: 仕様が変わっても、どこを直すか、みんなすぐ言えたの？ ……それは、うらやましい。
  - chat: [カーネル読み, ノクスが黙って聞いてる]
  - say: 黙って聞くわよ。いい話なんだもの。
  - chat: [新卒二年目, 言葉の一覧、営業の人も見るんですね]
  - chat: [DDD警察, 営業の人が一番直してた]
  - say: 営業の人が一番。……作る人だけで決めてなかったのね。
  - chat: [DDD警察, その現場は会社ごとなくなったけど]
  - say: え、その会社ごと、なくなったの？
  - chat: [DDD警察, 設計のせいではない]
  - say: 設計のせいじゃない。うん……そうよね。
  - say: 今日はここまでにしようかな。DDD警察さん、続き、今度聞かせて。
  - say: 起きてる人たち、ありがとう。おやすみなさい。
