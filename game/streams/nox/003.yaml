title: 「止まって」と言われても片付けをしなかった私のプログラム（二年間）
lobby:
- こんばんは。今日は、私が二年前に書いたプログラムの話。
- 止まる前の片付けを書いたのに、二年間一回も動いてなかったの。
- 途中で、きのこの山とたけのこの里の話もする。
parts:
# オープニング（明るさ）
- - say: あ、映った。こんばんは、起きてる人たち。
  - chat: [処理落ち愛好会, ……あれ？]
  - chat: [カーネル読み, ちょっと明るい]
  - say: 「ちょっと明るい」、気づいた？ 画面の明るさ、一つだけ上げたの。
  - chat: [処理落ち愛好会, 誤差]
  - say: 誤差って言わないで。眼科で言われたの。「暗すぎます」って。
  - chat: [夜勤明けの人, 眼科行ったんだ]
  - say: 眼科、行ったの。人間界の病院、眼科しか行ったことないの。
  - say: 先生に「どれくらい暗くしてるんですか」って聞かれて、一番下って言ったら、ちょっと黙られた。
  - chat: [RTOS屋十五年, 黙るよそれは]
  - say: 黙るわよね。で、一つで許してもらったの。
  - chat: [新卒二年目, こんばんは！ 前に言ってた事後報告、書きました]
  - say: {face: surprised, text: 新卒さん、事後報告書いたの？}
  - chat: [新卒二年目, 気をつける、は書かずに、何がどの順で起きたかから書きました]
  - say: {face: smile, text: 「気をつける」じゃなくて、起きた順から書いたのね。うれしい。あとで読ませて。}
  - say: じゃあ今日は、私の方が書く番の話。
# 二年間で0件
- - say: 二年前に書いたサービスがあるの。お店の予約を受け付けるやつ。
  - say: で、そのサービスには、止まるときの片付けを書いておいたの。
  - chat: [初見の旅人, はじめまして。片付け？]
  - say: いらっしゃい、初見さん。片付けっていうのは、お店の閉店作業みたいなもの。
  - say: 「もう閉めるよ」って言われたら、今いるお客さんの注文だけは最後まで受けるでしょ。
  - say: 書きかけの伝票を書き終えて、それから電気を消すの。
  - chat: [初見の旅人, いきなり消したら困る]
  - say: いきなり消したら困るでしょ。注文が途中で消えちゃう。
  - say: で、片付けを始めるときに、記録を一行残すようにしてたの。「shutting down」って。
  - say: 先週ね、別の調べ物のついでに、その記録を二年分探したの。
  - chat: [カーネル読み, 何件]
  - say: {face: surprised, text: 何件あったか。……0件。}
  - chat: [処理落ち愛好会, ｗｗｗ]
  - chat: [定時退社したい, 胃]
  - say: 笑うわよね。胃って打った人もいる。入れ替えは百回以上してるのに、記録は一行もないの。
  - say: でもね、0件だけじゃ、片付けが動いてない証拠にはならないの。記録を書く前に止められてたのかもしれないし、記録の方が落ちてたのかもしれない。
  - say: だから、実際に止めて確かめたの。
  - chat: [初見の旅人, じゃあどうやって止まってたの]
  - say: どうやって止まってたか？ 止める試験をして、箱の中の親子を見たら分かったの。毎回、三十秒待たされたあとに、無理やり電気を落とされてたの。
  - chat: [初見の旅人, 誰に]
  - say: 誰にって、Kubernetes っていう係。プログラムを箱に入れてたくさん並べて、面倒を見てくれる仕組み。
  - say: その係が「閉めて」って言って、三十秒待ってくれるの。で、閉めないと、もう待たない。
  - chat: [新卒二年目, 何か困ってたんですか]
  - say: 何か困ってたか？ 入れ替えのとき、ちょうど来てた予約が、たまにエラーになってたの。
  - say: お客さんがやり直してくれてたから、誰も気づかなかったの。
  - chat: [RTOS屋十五年, 一回も？]
  - say: 一回も気づかなかったか？ 一回も。二年間。
# 「閉めて」が届かない
- - chat: [初見の旅人, 「閉めて」ってどうやって言うの]
  - say: 「閉めて」の言い方はね、シグナルっていうの。OS がプログラムの肩をとんとんってする合図。
  - say: SIGTERM が「そろそろ終わって」。SIGKILL が「はい終わり」。
  - say: SIGKILL の方は、プログラムは聞くことも断ることもできないの。
  - chat: [処理落ち愛好会, 優しい店長と怖い店長]
  - say: 優しい店長と怖い店長、そう、それでいいの。
  - say: で、私は優しい方の SIGTERM を受け取る係を、ちゃんと付けてたの。Go で。
  - chat: [新卒二年目, signal.Notify ですよね。うちも書いてます]
  - say: signal.Notify、書いてるでしょ。私も書いてた。なのに届いてなかったの。
  - say: 箱の作り方を書くファイルがあってね。Dockerfile っていうの。
  - say: その中に「この箱を開けたら、これを動かして」って書く所があるの。書き方が二通りあるの。
  - say: 「CMD ./server」って、そのまま書く形と。「CMD ["./server"]」って、かっこで囲む形。
  - chat: [初見の旅人, 見た目しか違わない]
  - say: 見た目しか違わない、そう見えるでしょ。私も二年前、そう思ってたの。
  - say: そのまま書く方はね、間にシェルっていう係が入るの。シェルが先に起きて、シェルが私のプログラムを起こすの。
  - chat: [初見の旅人, 伝言役？]
  - say: 伝言役？ そう、伝言役。で、「閉めて」は、箱の中で最初に起きた子に言われるの。
  - chat: [カーネル読み, で、シェルは伝えない]
  - say: {face: laugh, text: で、シグナルは伝えない。そう、伝えないの！ 伝言役なのに。}
  - say: Docker の説明書にもちゃんと書いてあるの。シェルはシグナルを渡さない、って。
  - say: かっこで囲む形を使いなさい、とも書いてある。私、読んでなかった。
  - chat: [定時退社したい, うちのも確認したらそのまま書く方だった]
  - say: {face: surprised, text: 定時さんのも、そのまま書く方だったの？ 今見たの？}
  - chat: [定時退社したい, 今見た]
  - say: 明日、試験の環境で一回止めてみて。合図がどのプロセスまで届くか、起動スクリプトも一緒に見るの。
  - say: シェルが間に残ってたら、起動の仕方を直しましょ。今夜は胃薬飲んで寝て。
# そういえば（きのこたけのこ）
- - chat: [処理落ち愛好会, 話ぶった切るけど今日たけのこの里買った]
  - say: たけのこの里買った？ え。今それ言う？
  - chat: [処理落ち愛好会, 食べながら見てる]
  - say: 食べながら見てるのね。私、きのこの山なの。
  - chat: [処理落ち愛好会, 知ってる。だから言った]
  - say: {face: annoyed, text: 知ってて言った、って。わざとなのね。}
  - chat: [初見の旅人, なんできのこ派なの]
  - say: なんできのこ派か？ 持つ所があるでしょ。軸の所。だからキーボードが汚れないの。
  - chat: [カーネル読み, 理由が作業者]
  - say: 理由が作業者、って。大事なのよ。たけのこは周りがチョコだから、持つと指につくの。
  - chat: [処理落ち愛好会, クッキーがサクサクなのがいいんだよ]
  - say: クッキーがサクサク、ね。サクサクなのは認めるわ。……認めるだけ。
  - chat: [夜勤明けの人, きのこってどこから食べる？]
  - say: どこから食べるか？ 傘から。チョコの所を先に食べて、軸は最後。
  - chat: [新卒二年目, 自分は軸から折って食べます]
  - say: {face: surprised, text: 軸から折るの？ 持つ所がなくなるじゃない。}
  - chat: [新卒二年目, 一口で入れるので関係ないです]
  - say: 一口なのね。……それなら、持つ所いらないわね。
  - chat: [RTOS屋十五年, 夏に車に置いたら全部溶けた]
  - say: 夏の車で全部溶けたの。……それは、どっち派でも負けね。
  - ask:
      q: きのこの山とたけのこの里、どっち派？
      options:
      - c: きのこの山
        r:
        - '{from}、こっちね。いらっしゃい。'
        - 軸を持って、チョコの方から食べるの。キーボード、汚れないわよ。
      - c: たけのこの里
        r:
        - '{from}もたけのこなのね。処理落ちと同じ。'
        - 指についたチョコ、キーボードに付けないでね。それだけお願い。
      - c: どっちも食べる
        r:
        - '{from}、平和な人ね。'
        - でも、袋が一個しかなかったら、どっち取る？ ……答えなくていいわ。
      npc: [[処理落ち愛好会, 1], [カーネル読み, 0], [RTOS屋十五年, 2], [新卒二年目, 1], [DDD警察, 0], [夜勤明けの人, 1]]
  - chat: [処理落ち愛好会, たけのこ優勢]
  - say: {face: annoyed, text: たけのこが多いわね……ここでも負けるの。}
# 最初の子と郵便受け
- - say: で、さっきの Dockerfile の続きね。かっこで囲む形に直したの。そしたら、私のプログラムが箱の中で最初の子になるの。
  - say: 最初の子は番号が 1。PID 1 っていうの。
  - chat: [カーネル読み, PID 1 には変な決まりがある]
  - say: PID 1 の変な決まり、あるの。ここだけちょっとオタクの話していい？
  - say: PID 1 には、自分で「受け取ります」って係を付けた合図しか、箱の中からは届かないの。外からの強制終了、SIGKILL だけは止められないけど。
  - say: 普通の子なら、係がなくても SIGTERM で止まるのに。
  - chat: [初見の旅人, 最初の子だけ耳が遠い]
  - say: 最初の子だけ耳が遠い、そう。うっかり止まらないようにしてあるの。最初の子が止まると、箱ごと全部止まるから。
  - chat: [新卒二年目, tini 入れてます]
  - say: {face: surprised, text: tini 入れてるの？ え、知ってるの。}
  - chat: [新卒二年目, 先輩に入れろって言われて、理由は知らないまま]
  - say: 理由は知らないまま、なのね。tini はね、最初の子の役だけやってくれる小さいプログラムなの。合図をちゃんと中に渡してくれる。
  - say: で、私の話。直して入れ替えたら、「shutting down」が出たの。
  - chat: [RTOS屋十五年, おめでとう]
  - say: ありがとう。……でもね、十回入れ替えて、二回だけ、また出てなかったの。
  - chat: [カーネル読み, まだあるのか]
  - say: まだあるのか、って。あったの。こっちは恥ずかしい方。
  - say: Go の signal.Notify はね、合図をチャンネルっていう受け口に入れてくれるの。郵便受けみたいなもの。
  - say: その郵便受け、作るときに何通まで入るか決めるの。私、0 にしてたの。
  - chat: [処理落ち愛好会, 入らない郵便受け]
  - say: 入らない郵便受け。そう、入らないの。その場で誰かが手で受け取らないと、合図は捨てられるの。
  - say: Go の説明書にも書いてあるの。送るときは待たないから、受け口の大きさは呼ぶ側で用意して、って。合図一個なら 1 で足りる。
  - say: 起動の準備で忙しいときに「閉めて」が来ると、誰も受け取らなくて、捨てられてたの。
  - chat: [新卒二年目, go vet で警告出ませんでした？]
  - say: {face: flustered, text: go vet で警告……出るの。三年前、CI が遅いって言われて、私が検査を全部外したの。どれが遅いのか、測らずに。}
  - chat: [処理落ち愛好会, 自分で耳ふさいでた]
  - say: 自分で耳ふさいでた。そう。機械はちゃんと言ってくれてたのに。
  - say: 直したのは、0 を 1 にしただけ。
  - chat: [DDD警察, 事後報告は]
  - say: 事後報告、書いたわ。片付けの記録は、始めたら「shutting down」、終わったら「shutdown complete」。
  - say: 入れ替えのたびに、止めたプロセスごとに complete が出たか照合するの。
  - say: それから、予約の途中で止める試験も足したの。途中の予約が、一回だけ残るか、やり直せる失敗になるか。
  - say: vet は毎回に戻して、遅い検査は測ってから夜に回した。
  - chat: [新卒二年目, 照合するの、うちのにも入れます]
  - say: 入れて。complete が出ないプロセスがあったら、教えてね。
# 締め（よる）
- - chat: [カーネル読み, ところでよるのバックアップは]
  - say: よるのバックアップ……来ると思った。
  - chat: [初見の旅人, よる？]
  - say: よるはね、私が作ってる小さい OS。九年分のソースが、このノート一台にしか入ってないの。
  - chat: [RTOS屋十五年, 今日の話より怖い]
  - say: 今日の話より怖い、分かってるの。だから今、外に送ってる。
  - say: 送れた。で、部屋の古い ThinkPad に戻してみる。戻せないとバックアップって言えないから。
  - chat: [処理落ち愛好会, ヒンジ折れてるやつ]
  - say: そう、ヒンジ折れてるやつ。起動に二分かかるけど、生きてるの。
  - say: ……戻った。全部ある。
  - chat: [新卒二年目, よかった]
  - say: うん。ほっとした。じゃあ、そっちの機械で起動してみるね。
  - say: yoru、って出た。時計の合図を入れる。
  - say: {face: surprised, text: 落ちた。}
  - chat: [処理落ち愛好会, 今日も落ちた]
  - say: でもね、こっちの機械でも、先週と同じ所で落ちたの。
  - chat: [カーネル読み, 再現した]
  - say: 再現した。別の機械でも、同じ所。私のコード、かなり怪しいわね。
  - say: 起きてる人たち、ありがとう。楽しかった。
  - say: 寝なさい。私は、たけのこの里の誘惑に耐えてから寝るけど。
  - chat: [処理落ち愛好会, 一個あげようか]
  - say: {face: shy, text: 一個あげようか、って……一個だけなら。}
