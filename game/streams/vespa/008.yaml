title: ぷっくりしたシールの抽選に、三回落ちた話
family: true
parts:
# また落ちた
- - say: こんばんは。聞いて。また落ちた。
  - chat: [最後尾はこちら, 何に]
  - say: 何に落ちたかって？ シールの抽選！ これで三回目！
  - chat: [初見の旅人, 初見です。シールの抽選？]
  - say: いらっしゃい！ シールの抽選？って思うよね。今ね、ぷっくりした立体のシールがすごい人気なの。
  - say: 「ボンボンドロップシール」っていうの。透明で、ぷくっとふくらんでて、つやつやしてるやつ。
  - chat: [緑ペンラ二年目, 先輩こんばんは！ 私も落ちました]
  - say: 二年目も落ちたの！？ 仲間だ。落ちた仲間。
  - chat: [初見の旅人, シールで抽選になるの？]
  - say: シールで抽選、なるの。お店に並べてもすぐなくなるから、抽選で売るお店が増えたの。
  - chat: [晴海の生き残り, こんばんは。シールなら昔ビックリマンがあった]
  - say: 「昔ビックリマンがあった」。晴海、それ今日絶対言うと思ってた！
# 平成の女の子
- - chat: [初見の旅人, なんで今シールなの？]
  - say: なんで今シールか？ 去年の夏にね、SNSで「平成女児」って言葉が流行ったの。
  - say: 平成のころに小学生だった女の子が好きだったもの、ってこと。シール帳とか、キラキラした文房具とか。
  - chat: [同人誌即売会帰り, シール帳持ってた]
  - say: 即売会帰りもシール帳持ってたでしょ！ その人たちが大人になって、もう一回集め始めたの。
  - say: そこにぷっくりシールが来て、一気に火が付いた感じ。今年の2月には、累計で1500万枚出荷されたって。
  - chat: [初見の旅人, 1500万！？]
  - say: 1500万枚、すごいよね。私が持ってるの、そのうち三枚だけど。
  - say: この前、お店の前で開店前から並んでる人たちがいてね。私、バイトの癖で最後尾を探しちゃった。
  - chat: [解釈違いです, 偽物も出てるらしい]
  - say: 偽物、出てるの。それに転売も。シールまで高い値段で売られてるの見ると、ほんとに悲しくなる。
  - say: 好きな人が普通の値段で買えないの、いやだよね。
# 交換のレート
- - chat: [同人誌即売会帰り, 子どもの頃、シールの交換で揉めた]
  - say: シールの交換で揉めた、揉めるよね！ どのシールが何枚分、っていうのがあるの。
  - chat: [初見の旅人, 何枚分？]
  - say: 何枚分っていうのはね、たとえば、キラキラのやつ一枚と、普通のやつ三枚で交換、みたいな。子どもの中だけの決まり。
  - chat: [同人誌即売会帰り, ぷっくりは普通のシール五枚分だった]
  - say: ぷっくりは普通の五枚分！ 強い！
  - chat: [緑ペンラ二年目, 今もイベントでシール帳を見せ合ってる人いますよ]
  - say: 今もシール帳を見せ合ってる人、いるいる！ この前、物販のバイトのあと、駅のベンチで大人の人たちが見せ合ってて。
  - say: 「これと、これ、どう？」って、すっごい真剣な顔で交換してたの。
  - say: 私、横で見てて、なんか声かけたくなっちゃって。
  - chat: [最後尾はこちら, かけたんでしょ]
  - say: かけたんでしょって……かけた。「いいですね！」って。そしたら一枚くれた。
  - say: やさしかった。私なにも出せなくて、持ってた缶バッジを一個あげたの。
  - chat: [解釈違いです, レートが合ってない]
  - say: レートが合ってない、合ってないよね。でも向こう、ちょっと喜んでた。たぶん。
  - say: 私ね、ランダムのグッズは苦手なんだけど、交換する文化は好きなの。知らない人と話すきっかけになるから。
  - chat: [最後尾はこちら, 苦手って言いながら引いてる]
  - say: {face: shy, text: 苦手って言いながら引いてる……う、引いてる。この前、推しが出るまで十四個引いた。}
  - say: 苦手なのは本当なの。引いてるときの自分が嫌いなの。でも引くの。
# シール集めてた？
- - say: みんなはどう？ 子どもの頃、シール集めてた？
  - ask:
      q: 子どもの頃、シールを集めてた？
      options:
      - c: 集めてた
        r:
        - '{from}、仲間だ！ シール帳、まだ実家にある？'
        - 交換した思い出ある人、あとでチャットに書いて。読みたい！
      - c: ちょっとだけ
        r:
        - '{from}はちょっとだけ派。お気に入りの一枚とかあった？'
      - c: 集めてない
        r:
        - '{from}は集めてない派。じゃあ今から始めよう！ 抽選、一緒に落ちよう！'
      npc: [[同人誌即売会帰り, 0], [緑ペンラ二年目, 0], [最後尾はこちら, 2], [晴海の生き残り, 0], [解釈違いです, 1]]
  - say: 集めてた人が多いね！ やっぱりみんな通ってるんだ。
  - chat: [晴海の生き残り, 集めてた。ビックリマン]
  - say: 晴海はやっぱりビックリマン！
  - chat: [初見の旅人, ヴェスパさんは何集めてた？]
  - say: 私が何集めてたか？ 魔界にいた頃は光る石。シールなんてなかったから、川で拾った光る石を箱にためてたの。
  - chat: [解釈違いです, 魔界の平成女児]
  - say: 魔界の平成女児って、平成じゃないけどね！ もっと前！
  - say: で、人間の町に来て最初にハマったのがビックリマンだったの。石がシールに変わった。
  - chat: [晴海の生き残り, 石からシールか]
  - say: 石からシール。うん、箱は同じ箱使ってた。
# ビックリマンの話
- - chat: [初見の旅人, ビックリマンって？]
  - say: ビックリマンはね、チョコのお菓子にシールが一枚入ってるの。80年代にすごい流行ったの。
  - say: 1985年の「悪魔VS天使」っていうシリーズで大ブームになって。
  - chat: [晴海の生き残り, ヘッドが出ると教室がざわついた]
  - say: ヘッドが出ると教室がざわついた。ヘッドって、一番キラキラしてる、当たりのシールね。
  - chat: [晴海の生き残り, 小遣いでは足りなかった]
  - say: 小遣いでは足りなかった？ 晴海、またお小遣い足りてない！
  - say: でもね、ちょっと悲しい話もあって。シールだけ抜いて、チョコを捨てちゃう子が出たの。
  - say: もったいないよね。社会問題になって、1988年には公正取引委員会っていう国の役所から注意が出たの。
  - say: そこから少し下火になったんだって。
  - chat: [最後尾はこちら, 今のランダムのグッズと同じ]
  - say: 今のランダムのグッズと同じ、そう、それ思った。中身が分からない袋を買って、当たりを探すの。今のランダムのアクスタのご先祖みたい。
  - chat: [解釈違いです, さっきの十四個もそれ]
  - say: さっきの十四個もそれ。ご先祖からずっと引かされてる。
  - chat: [最後尾はこちら, 家賃]
  - say: 「家賃」って一言だけ！？ 言わないで！ モーラに借りたの！ もう返したから！
  - chat: [最後尾はこちら, 帳面に赤字で書かれてた]
  - say: 帳面に赤字で書かれてた？ それはモーラの帳面の話でしょ！
# そういえば、プリクラ
- - chat: [同人誌即売会帰り, シール帳にプリクラも貼ってた]
  - say: シール帳にプリクラ、貼ってた貼ってた！ プリクラもシールだもんね。
  - chat: [初見の旅人, プリクラっていつからあるの？]
  - say: プリクラはいつからか？ 1995年の7月から。最初は「プリント倶楽部」って名前だったの。
  - say: 作ったのは佐々木美穂さんっていう女の人。その年の2月の展示会で、試しに置いたら行列ができたんだって。
  - chat: [最後尾はこちら, 展示会で行列。分かる]
  - say: 展示会で行列、分かるんだ。最後尾はこちらは、行列を見ると全部分かる人だから。
  - say: 2年後の1997年には、5万台以上置かれてたの。
  - chat: [解釈違いです, 最初は目が大きくならなかったんでしょ]
  - say: 最初は目が大きくならなかった、そうなの！ 最初はただ写真がシールになるだけ。今みたいに盛れないの。
  - chat: [初見の旅人, 落書きは何書いてた？]
  - say: 落書きに何書いてたか？ 私ね、日付書いてた。
  - chat: [晴海の生き残り, 日付だけか]
  - say: 日付だけかって、日付だけ。ハートとか書く場所に、2002年の何月何日、って。
  - chat: [同人誌即売会帰り, 事務的]
  - say: {face: laugh, text: 事務的！？ 事務的だよね！ 一緒に撮った子に「それ書類？」って言われた！}
  - chat: [緑ペンラ二年目, 最近撮りました？]
  - say: 最近撮ったか？ うーん、去年かな。遠征仲間と。やっぱり日付書いちゃった。
  - say: 2002年のやつ、まだシール帳に貼ってあるの。日付しか書いてないから、誰と撮ったか分からないのもある。
# 待って、何だっけ
- - say: 待って、何の話してたっけ。プリクラの前。
  - chat: [最後尾はこちら, 抽選に落ちた話]
  - say: 抽選に落ちた話。そうだ、落ちた話だ。思い出したらまた悲しくなってきた。
  - chat: [晴海の生き残り, たまごっちも品薄だった]
  - say: たまごっちも品薄だった、あ、たまごっちね！ 1996年の11月に出て、最初は6万個の予定だったのに、100万個作ることになったの。
  - say: 全然足りなくて、お店に行列ができたの。でもね、そのあとブームが終わって、今度は余っちゃったの。
  - say: 1999年には、すごい数を処分して、大きな損になったんだって。
  - chat: [最後尾はこちら, 作りすぎた段ボール]
  - say: 作りすぎた段ボールって、段ボールで考えないで。でも、たぶん倉庫に段ボールが山だったんだと思う。
  - chat: [解釈違いです, ヴェスパは育てたの？]
  - say: 私も育てたか？ 育てた。四日で死なせた。
  - say: 毎日決まった時間にご飯あげるの、私にはむりだったの。電池も切れたまま、まだ引き出しに入ってる。
  - chat: [緑ペンラ二年目, 捨てられないやつですね]
  - say: そう、捨てられないやつ。電池替えたら生き返るかなって、毎年一回思うの。思うだけ。
# そういえば、アイス
- - chat: [同人誌即売会帰り, 今ガリガリ君食べてる]
  - say: 今ガリガリ君食べてる？ いいなあ！ 何味？
  - chat: [同人誌即売会帰り, ソーダ]
  - say: ソーダ、一緒！ 私もガリガリ君はソーダ。夏のイベントで並んでるときに食べるのが好きなの。
  - chat: [初見の旅人, もう秋だけど]
  - say: もう秋だけど？ 秋でも食べるよ。冬はこたつでパピコを半分ずつ。
  - chat: [最後尾はこちら, 誰と半分ずつ]
  - say: 誰と半分ずつかって？ ……一人で、両方。
  - chat: [解釈違いです, 半分ずつの意味]
  - say: {face: annoyed, text: 半分ずつの意味！？ 一個ずつ食べてるから半分ずつなの！}
  - chat: [晴海の生き残り, わしは「あずきバー」]
  - say: 晴海はあずきバーなんだ。硬いやつ。歯、気をつけてね。
  - chat: [晴海の生き残り, 歯は丈夫だ。腰が悪いだけで]
  - say: 歯は丈夫で、腰が悪いだけ。そこは丈夫なんだ。よかった。
# 当たったら何を貼る
- - chat: [解釈違いです, 当たったら、シール帳に何を貼るの]
  - say: 当たったら何を貼るか、決めてるの！ まず緑のシールだけで一ページ作る。
  - say: 緑のシールって、探すと意外と少ないの。ピンクと水色ばっかり。黄緑も同じページに入れる。
  - chat: [緑ペンラ二年目, 私は黄緑のページ作ります]
  - say: 二年目は黄緑のページを作るんだ。じゃあ二人で並べたら、きれいなグラデーションになるね。
  - chat: [同人誌即売会帰り, シール帳自体も今かわいいの多い]
  - say: シール帳自体もかわいいの、多いよね！ この前、文房具屋さんで見たら、昔の平成っぽい柄のやつが並んでて、思わず手に取った。
  - say: 値段見て、そっと戻した。シール帳だけで結構するの。
  - chat: [晴海の生き残り, 昔はノートに貼っていた]
  - say: 昔はノートに貼っていた？ それでいいのかも。最初はノートでいいか。キャンパスノートなら家に何冊もあるし。
  - chat: [解釈違いです, 雑]
  - say: 雑って、雑じゃないよ、続けるのが大事なの。……続くかな。
  - chat: [最後尾はこちら, 四日]
  - say: 四日って言わないで！ たまごっちの話はもう終わったの！
# おしまい
- - chat: [緑ペンラ二年目, 次の抽選、いつですか？]
  - say: 次の抽選？ 来週！ 二年目も出す？
  - chat: [緑ペンラ二年目, 出します]
  - say: 出すんだ！ じゃあどっちかが当たったら、交換しよ。シール帳持って。
  - chat: [緑ペンラ二年目, はい！]
  - chat: [最後尾はこちら, 抽選の締切、何時？]
  - say: 締切何時かって？ えっと、待って、見る。あ、明日の朝までだった。
  - chat: [解釈違いです, 今出して]
  - say: 今出して？ 今出す！ 配信切ったらすぐ出す！ じゃあね、みんなおつかれさまでした！
