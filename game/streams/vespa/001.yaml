title: 冬コミの申込を、締切の十分前に出した話
parts:
# バイト帰り
- - say: あ、もう映ってる？ 映ってるね。こんばんは！
  - chat: [最後尾はこちら, おつかれ]
  - chat: [晴海の生き残り, こんばんは]
  - say: 最後尾はこちら、おつかれ！ 晴海もこんばんは！
  - say: ごめんね、ちょっと息切れてる。バイトから走って帰ってきた。
  - chat: [最後尾はこちら, 走る必要あった？]
  - say: 走る必要あった？って、あった！ 配信の時間、自分で言っちゃったから！
  - chat: [初見の旅人, 初見です]
  - say: 初見さんだ！ いらっしゃい！ 初見の旅人、ゆっくりしてってね。
  - say: 私ね、イベントの物販とか列整理のバイトしてるの。今日も六時間立ってた。
  - chat: [初見の旅人, 列整理？]
  - say: 列整理？ 行列を作る係ね。「最後尾はこちら」って札を持って、一番後ろに立つの。
  - chat: [初見の旅人, あれ、さっきの人の名前]
  - say: あ、気付いた？ さっきの人の名前と同じだって。そう、ややこしいよね！ この人、私のバイト仲間なの。
  - chat: [最後尾はこちら, 今日は札、正しい向きだった]
  - say: 「今日は札、正しい向きだった」……今日は！ 今日はって言わないで！
  - chat: [晴海の生き残り, 前は逆さまだったのか]
  - say: 晴海、前は逆さまだったのかって……一回だけ！ 一回だけ逆さまに持って、四十分立ってたの。
  - say: それでもみんな首かしげながら並んでくれたんだよ。優しくない？
  - chat: [最後尾はこちら, 優しいのはお客さん]
  - say: {face: laugh, text: そう、お客さんが優しかった！ 私は何もしてない！}
# 冬コミ、三日間
- - say: で、今日話したかったのはね、冬コミ！
  - chat: [初見の旅人, コミケ？ 人がいっぱいのやつ？]
  - say: 人がいっぱいのやつ？って、そう、人がいっぱいのやつ！
  - say: 好きな人が自分で作った本を、自分で配るお祭りね。漫画も小説もあるよ。
  - say: で、今年の冬は三日間やるの。12月の29、30、31！
  - say: 三日間は8年ぶりなんだって！ ずっと二日間だったから。
  - chat: [初見の旅人, なんで増えたの？]
  - say: なんで増えたかっていうと、冬は申込が多いのと、会場が工事でホールが減ってて。だから日にちで増やすって。
  - chat: [最後尾はこちら, 狭いのに三日。列が三日分]
  - say: 「列が三日分」って、もう仕事の目になってる！
  - say: でね、私もサークルで申し込んだの。本出す側で。
  - chat: [解釈違いです, 締切の何分前？]
  - say: なんで「何分前」って聞くの！ 何日前かもしれないでしょ！
  - chat: [解釈違いです, あなたが何日前に出すのは解釈違い]
  - say: {face: annoyed, text: 私が何日も前に出すのは解釈違い！？ ひどい！ 合ってるけど！}
  - chat: [最後尾はこちら, 十分前。休憩室]
  - say: 十分前、休憩室……なんで知ってるの！
  - chat: [最後尾はこちら, 隣でおにぎり食べてた]
  - say: 隣でおにぎり食べてた？ そうだった！ 隣にいた！
  - say: 休憩、十五分しかないの。画面開いたら締切まで十二分。
  - say: サークル名打って、ジャンル選んで、カット貼って。手が震えてた。
  - chat: [初見の旅人, カットって？]
  - say: カットっていうのは、サークルの小さい看板の絵ね。カタログに載るやつ。
  - say: で、この人、その横で鮭おにぎり食べてたの！ 一口ちょうだいって言ったのに、くれなかった！
  - chat: [最後尾はこちら, 休憩中のおにぎりは渡さない]
  - say: 休憩中のおにぎりは渡さないって、ケチ！
# そういえば、おにぎりって何派？
- - say: あ、待って。そういえばさー、みんなコンビニのおにぎり、何買う？
  - chat: [晴海の生き残り, 梅]
  - chat: [初見の旅人, ツナマヨ一択]
  - chat: [緑ペンラ二年目, 先輩こんばんは！ 私は明太子です]
  - say: 梅にツナマヨに明太子。ばらばらだね！ 二年目、こんばんは！ 明太子、いいね！
  - say: 晴海は梅なんだ。っぽい！ 晴海っぽい！
  - chat: [晴海の生き残り, 何が「っぽい」んだ]
  - say: 何が「っぽい」かって？ なんか、すっぱいのに文句言わない感じ？
  - chat: [晴海の生き残り, 文句は言う]
  - say: {face: laugh, text: 「文句は言う」って、言うんだ！}
  - say: 私はね、ファミマの紅しゃけ。遠征の朝は絶対これを二個買うの。
  - say: 一個は電車で、もう一個は列に並んでから食べる予定なの。予定はね。
  - chat: [最後尾はこちら, 電車で二個とも食べる]
  - say: 電車で二個とも食べるって、そう、食べちゃうの！ 毎回！ で、列でお腹がすくの！
  - say: 列でお腹鳴るとさ、前の人に聞こえるんだよね。あれ恥ずかしい。
  - chat: [オハイオの字幕班, hi！ おにぎりはアメリカでも売ってる]
  - say: オハイオの字幕班、いらっしゃい！ アメリカでもおにぎり売ってるの！？ どこで？
  - chat: [オハイオの字幕班, 日本のスーパー。高い]
  - say: 日本のスーパーで、高いんだ。いくら？
  - chat: [オハイオの字幕班, 3ドルくらい]
  - say: 3ドル！？ 紅しゃけ二個で6ドルかあ。遠征のたびに買ってたら大変だ。
# ファミマ派です
- - chat: [初見の旅人, コンビニはファミマ派？]
  - say: コンビニ？ ファミマ派！ ファミチキも、夜中の二時に歩いて買いに行くくらい好き。
  - say: でもね、昔はサンクスに通ってたの。
  - chat: [晴海の生き残り, サンクスか。懐かしい]
  - say: 晴海、サンクス懐かしいでしょ！ 2018年に全部ファミマに変わったの。
  - say: 看板が変わっても、レジの店員さんが同じ人でね。それがちょっとうれしかった。
  - chat: [緑ペンラ二年目, いい話です]
  - say: いい話でしょ！ で、気付いたら同じ店でファミチキ買ってた。
  - chat: [最後尾はこちら, 私はセブン]
  - say: 最後尾はこちらはセブン。知ってる。休憩室から一番近いもんね。
  - say: みんなはどこ派？ ……あ、待って、これ聞くとチャットが止まらなくなるやつだ。
  - chat: [解釈違いです, 話がそれてる]
  - say: え、話それてる？
  - chat: [解釈違いです, 申込の話してた]
  - say: {face: surprised, text: 申込の話してた？ あ、そうだ！ 待って、何の話してたっけ。申込！}
  - say: そう、申込は出したの。十分前だけど、出したは出した。
  - chat: [緑ペンラ二年目, 出せてよかったです！]
  - say: 「出せてよかったです」って、二年目、ありがと。そう言ってくれるの二年目だけだよ。
  - chat: [解釈違いです, で、原稿は？]
  - say: 原稿は？って、まだ当落出てないから！
  - chat: [解釈違いです, 受かってから描いたら間に合わない]
  - say: {face: shy, text: 受かってから描いたら間に合わない……それは、そう。うん。描きます。}
# 夏は雨で、本が波打った
- - say: 夏の話もさせて。夏のコミケは落選しちゃって、友達の机に私の本を置いてもらったの。
  - chat: [初見の旅人, 置いてもらう？]
  - say: 置いてもらうっていうのはね、委託っていうの。友達のサークルで、私の本も一緒に売ってもらうの。
  - say: で、夏は二日とも雨だったでしょ。降ったりやんだり。
  - say: 暑くなかったのだけはよかった。去年までの夏、ほんとに暑かったもんね。
  - say: でもね、私、本を紙袋に入れて持ってった。
  - chat: [晴海の生き残り, 雨の日に紙袋]
  - say: 雨の日に、紙袋。ビニール袋、家に山ほどあったのに。
  - say: 八部、波打った。ページがぺこぺこになってるの。
  - say: もうやけになって「波打ち版です」って言って並べたの。
  - say: そしたら一人だけ「波打ち版ください」って買ってくれた！
  - chat: [同人誌即売会帰り, 限定版だ]
  - say: {face: smug, text: 限定版！ 八部しかない限定版だぞ！}
  - chat: [緑ペンラ二年目, 一冊ほしいです]
  - say: 一冊ほしい？ 二年目、まだ七部あるよ！
  - chat: [解釈違いです, 全部で何部売れたの]
  - say: 全部で何部売れたか……三十部持ってって、二十二部。
  - chat: [最後尾はこちら, 声ちっさ]
  - say: 声ちっさって、小さくもなるよ！ でも二十二人が読んでくれたんだからね！
  - chat: [初見の旅人, 何の本なの？]
  - say: 何の本かって？ 『坂の本』！ アニメの舞台になった町の坂を、スマホで測ってくるの。
  - chat: [晴海の生き残り, 出た坂]
  - say: 出たって言わないで！ 初見さんがいるの！ アニメの坂ってね、本物よりきつく描いてあることが多いの。それを確かめに行く本！
# コミケ、行ったことある？
- - say: ねえ、みんなはどう？
  - ask:
      q: コミケ、行ったことある？
      options:
      - c: ある
        r:
        - '{from}、行ったことあるんだ！ 仲間だ！ 何日目に行ってる？'
        - 冬は三日あるから、どこかで会えるかもね！
      - c: ない。気になってる
        r:
        - '{from}は気になってる派！ いらっしゃい！ 一回来てみてほしいな。'
        - 一日だけでも来てみて。歩き方なら教える！
      - c: 行かない派
        r:
        - '{from}は行かない派。それもいいと思う！'
        - 人の多さ、ほんとにすごいからね。通販で買える本もいっぱいあるよ。
      npc: [[晴海の生き残り, 0], [初見の旅人, 1], [最後尾はこちら, 2], [オハイオの字幕班, 1], [緑ペンラ二年目, 0]]
  - say: 行ったことある人と、気になってる人が多いね！
  - chat: [最後尾はこちら, 行かない。人が多い所は仕事で行く]
  - say: 最後尾はこちらは、人が多い所が職場だもんね。
  - chat: [晴海の生き残り, わしは晴海の頃から行ってる]
  - say: 始まった、晴海の「晴海の頃から」！
  - chat: [初見の旅人, 晴海って？]
  - say: 晴海って何かって？ 昔のコミケの会場ね。東京の晴海にあった見本市の会場。この人、そこから通ってるの。
  - chat: [晴海の生き残り, C17からだ]
  - say: C17から！？ 私はC19から！ 1981年の12月、ちょうど晴海に移った回！
  - say: ……数字だけ見ると、晴海の方が先。うん。そうなんだけど。
  - chat: [晴海の生き残り, わしの勝ち]
  - say: 「わしの勝ち」じゃないよ。証拠は？ C17のカタログ出して！
  - chat: [晴海の生き残り, 実家の押し入れ]
  - say: 実家の押し入れ？ 出せないものは数えません！
  - chat: [晴海の生き残り, お前の日誌も自分で書いたやつだろう]
  - say: {face: annoyed, text: 私の日誌も自分で書いたやつだろうって？ 日誌は記録なの！ ……もう、この話いっつも終わらないんだから。}
# 一回目は会議室だった
- - chat: [オハイオの字幕班, 一回目のコミケはどこ？]
  - say: 一回目のコミケ？ 1975年の12月。虎ノ門の消防会館の、会議室！
  - say: 会議室だよ、会議室。サークルは32！ 来た人は700人くらい！
  - chat: [最後尾はこちら, 札一本で足りる]
  - say: {face: laugh, text: 一本で足りる！ 札で数えるのやめて！}
  - say: それが去年の冬の50周年は30万人。サークルの申込も3万を超えたの。
  - chat: [初見の旅人, 32から3万]
  - say: そう、32から3万！ 申込が多すぎて、急に別のホールにも机を並べたんだって。
  - chat: [最後尾はこちら, 長机、一本けっこう重い]
  - say: 長机が重いのは知ってる！ 私も運ぶもん！ 段ボールなら四箱いっぺんにいけるよ。
  - chat: [オハイオの字幕班, コミケは政府がやってるの？]
  - say: 政府がやってるの？って、ちがうちがう！ 準備会っていう、ファンが集まった人たちがやってるの。
  - say: 準備会の言葉でね、「コミックマーケットに『お客様』はいません」っていうのがあるの。
  - chat: [初見の旅人, 客いないの？]
  - say: 客いないの？って思うよね。売る人も買う人もスタッフも、みんな「参加者」なの。
  - chat: [最後尾はこちら, スタッフも？ 時給は？]
  - say: スタッフの時給？ スタッフさんも参加者なの。お給料で来てるんじゃないんだって。
  - chat: [最後尾はこちら, は？ 無給で列整理？]
  - say: {face: laugh, text: 「は？ 無給で列整理？」って、すっごいびっくりしてる！}
  - chat: [最後尾はこちら, 私なら時給二千円でも夏は嫌]
  - say: 時給二千円でも夏は嫌、分かる。真夏の列整理はほんとにきついもん。だから私、スタッフさんには麦茶を渡すことにしてる。
# 配信の中でホテルを取る
- - chat: [緑ペンラ二年目, 先輩、冬のホテルは取りました？]
  - say: 冬のホテル？ ……取って、ない。
  - chat: [最後尾はこちら, 夏の二の舞]
  - chat: [初見の旅人, 夏は何があったの？]
  - say: 夏に何があったか？ ホテルが仮予約のままだったの。当日の夜に気付いて、ネットカフェに泊まった。
  - chat: [初見の旅人, かりよやく？]
  - say: 仮予約っていうのは、途中まで入力して、最後のボタンを押してないやつ。予約じゃないの、あれ。
  - chat: [解釈違いです, 今取って]
  - say: 今！？ 配信中に！？
  - chat: [晴海の生き残り, 今取れ]
  - say: 晴海まで今取れって！ 分かった、取る！ 見られてたら最後まで押せる気がする！
  - say: えっと、会場の近く……一泊二万円！ 無理！
  - chat: [最後尾はこちら, 一駅離すと下がる]
  - say: 一駅……あ、ほんとだ。下がった。
  - chat: [最後尾はこちら, 二駅でもっと下がる]
  - say: 二駅でもっと下がる？ なんでそんなに詳しいの！
  - chat: [最後尾はこちら, 毎年あんたの予約を横で見てるから]
  - say: {face: shy, text: 毎年見られてた。}
  - say: カプセル、一泊5800円！ これにする！
  - say: 名前、電話番号……到着予定時刻？ 分かんないよ、会場の帰りだもん。
  - chat: [最後尾はこちら, 片付け手伝うなら20時]
  - say: 片付け手伝うなら20時？ 手伝う前提になってる！ 手伝うけど！ じゃあ20時！
  - say: で、最後のボタン。「予約を確定する」。
  - chat: [緑ペンラ二年目, 押してください！]
  - say: 押した！ 「予約が確定しました」って出た！ 仮じゃない！
  - say: 取れた。……あ、でも駅からけっこう遠い方だった。
  - say: 待って、地図もう一回見るね。歩いて、えっと、十八分？ 荷物あるのに？
  - say: まあいいや。泊まれるだけ、夏よりまし！
# 近くにファミマある？
- - chat: [初見の旅人, そのホテルの近くにコンビニある？]
  - say: ホテルの近くにコンビニ？ 待って、地図見る。あ、ファミマある！ 歩いて三分！
  - say: 紅しゃけ二個買う！ で、一個は会場で食べる！
  - chat: [最後尾はこちら, 電車で二個食べる]
  - say: {face: laugh, text: 食べる！ たぶん食べる！ もう三個買う！}
  - chat: [解釈違いです, ホテルは取れた。で、原稿は？]
  - say: 原稿は明日から！ 明日の朝から！
  - chat: [最後尾はこちら, 明日の朝はバイト]
  - say: {face: surprised, text: 明日の朝はバイト……そうだった！ じゃあ明日の夜から！}
  - chat: [晴海の生き残り, 次はC17の話をしてやる]
  - say: C19の話ね！ 私の方の！ ……まあいいや、どっちでも聞く。
  - chat: [初見の旅人, 楽しかった、また来ます]
  - say: 楽しかった？ 初見の旅人、ありがとう！ 次は坂の話もするからね！
  - say: じゃあ今日はここまで！ みんな、おつかれさまでした！
