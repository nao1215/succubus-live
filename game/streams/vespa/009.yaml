title: 押し入れからDSが出てきた。中にラブプラス
parts:
# 押し入れ
- - say: こんばんは！ ちょっと聞いて、今日ね、押し入れ片付けてたの。
  - chat: [最後尾はこちら, 段ボール何箱]
  - say: 段ボール何箱かって？ 九箱！ 一番奥から、DS が出てきた。
  - chat: [晴海の生き残り, こんばんは。DSとは懐かしい]
  - say: 晴海、こんばんは！ 懐かしいでしょ。で、中に刺さってたソフトがね、ラブプラス。
  - chat: [初見の旅人, 初見です。ラブプラス？]
  - say: いらっしゃい！ ラブプラスはね、ゲームの中の彼女と、毎日会っておしゃべりするゲーム。2009年に出たの。付き合ってからが始まりなの。
  - chat: [初見の旅人, ギャルゲーってやつ？]
  - say: ギャルゲーってやつ？ そう、その仲間！ かわいい女の子と仲良くなるゲームを、まとめてそう呼ぶの。
  - chat: [解釈違いです, エロゲとは違うの？]
  - say: {face: annoyed, text: その言い方！ 美少女ゲームって言って！ 配信なんだから！}
  - say: 成人向けのも全年齢のもあるけど、ここではまとめて「美少女ゲーム」って呼ぶね。成人向けのは、箱にちゃんと18歳以上って書いてある。
  - chat: [最後尾はこちら, その箱、棚卸しで数えたことある]
  - say: 数えたことあるの！？ どこのバイト！？ ……で、ラブプラスとか、これから話すときメモは、成人向けじゃない方ね。
  - say: あ、遊び方とか攻略の話はリゼの枠ね。私は、ファンと町とグッズの方の話。そっちならいくらでもする。
# 伝説の樹
- - chat: [晴海の生き残り, ときメモは知っている。樹の下のやつだ]
  - say: 晴海、ときメモ知ってるんだ！ そう、樹の下のやつ！
  - say: 『ときめきメモリアル』、1994年の5月。最初は PC エンジンっていうゲーム機で出たの。
  - say: 高校の三年間を過ごして、卒業式の日に、伝説の樹の下で女の子から告白されたらゴール。
  - chat: [緑ペンラ二年目, 先輩こんばんは！ 伝説の樹って何ですか？]
  - say: 二年目、こんばんは！ 伝説の樹っていうのはね、学校の校庭にある木で、言い伝えがあるの。
  - say: 卒業式にその木の下で、女の子から告白されて生まれたカップルは、ずっと幸せになれるって。
  - chat: [緑ペンラ二年目, 三年かけて、最後の一日なんですね]
  - say: そうなの！ 三年かけて、最後の一言を待つの。私、この話に弱いの。
  - say: だって私なんか、九年かけて「おつかれさまです」しか言えてないんだよ。樹の下で待たれても、たぶん「おつかれさまです」って言う。
  - chat: [最後尾はこちら, 卒業式にそれは失礼]
  - say: {face: shy, text: 卒業式に「おつかれさまです」は失礼！ 分かってる！ 分かってるけど出ちゃうの！}
  - chat: [初見の旅人, 誰が好きだったの？]
  - say: 誰が好きだったか？ 虹野沙希！ 運動部のマネージャーの子。「根性」が好きで、がんばってる人を応援する子なの。
  - say: ここからオタクの話ね！ メインヒロインの藤崎詩織って子がいてね。1996年に、その詩織が、キャラの名前のまま CD を出したの！
  - chat: [緑ペンラ二年目, キャラがCDデビュー？]
  - say: そう、キャラがデビュー！ 歌ってる声優さんの名前を前に出さないで、詩織として出したの。
  - say: これね、私の発見日誌だと「バーチャルアイドル」の欄に書いてある。VTuber のずっと前だよ。
  - chat: [晴海の生き残り, 出た発見日誌]
  - say: 出た発見日誌、じゃない！ 1996年のページ、ちゃんとある！ ……字が汚いだけ！
# 熱海の布団二枚
- - chat: [オハイオの字幕班, hi! dating sim の話？]
  - say: オハイオの字幕班、ハーイ！ dating sim の話、そう！ そっちだと恋愛のゲーム、そう呼ぶんだっけ。
  - chat: [オハイオの字幕班, そう呼ぶこともある。読むのが中心なら visual novel かな]
  - say: 読むのが中心なら visual novel。なるほど、そっちの方がしっくりくるのもあるね！
  - say: で、ラブプラスに戻るね。2010年に『ラブプラス+』っていう続きが出て、彼女と熱海に一泊旅行するお話が入ったの。
  - chat: [オハイオの字幕班, 熱海は北海道？]
  - say: 熱海は北海道？ 違う違う！ 静岡！ 東京から電車ですぐの、海と温泉の町！
  - say: そしたらね、熱海の町が本当に組んだの。2010年の7月10日から、町じゅうでキャンペーン。
  - say: 私、初日に行ったんだ。坂の町って聞いてたから、どうしても行きたくて。
  - chat: [最後尾はこちら, また坂]
  - say: また坂、じゃない！ でね、ゲームに出てくる旅館の大野屋さんが本物でね、入口に「私立 十羽野高校 御一行様」って看板が出てたの。
  - chat: [緑ペンラ二年目, とわの高校？]
  - say: 十羽野高校はね、ゲームの中の学校の名前。それを本物の旅館が、団体の客みたいに迎えたの！
  - say: しかもね、大野屋さんに泊まる人は、希望したら布団を二枚敷いてもらえたの。彼女の分。
  - chat: [緑ペンラ二年目, やさしい……]
  - say: やさしいでしょ！ 町ぐるみで「彼女がいる」って扱ってくれたの。私、あの話が一番好き。
  - chat: [最後尾はこちら, 布団二枚で料金は二人分？]
  - say: 料金は二人分か？ そこ、調べてない！ 布団の枚数しか見てなかった！ 最後尾、いつも聞くとこが違うの！
  - say: 町にスタンプラリーもあってね、スタンプ六個。……私、五個で終わった。
  - chat: [晴海の生き残り, 一個足りない]
  - say: 一個足りない、言わないで！ 伊豆山神社の石段を測ってたら、時間がなくなったの。
  - chat: [最後尾はこちら, スタンプラリー最後まで押せたことないでしょ]
  - say: {face: shy, text: 最後まで押せたことない、それ前にも言われた……。今回もない……。}
# そういえば、お土産
- - chat: [同人誌即売会帰り, 熱海のお土産何買った？]
  - say: 熱海のお土産？ 限定のキーホルダー！ 今だったら絶対ご当地のアクスタ買ってる。
  - say: 私ね、旅行のお土産は、ご当地のアクスタって決めてるの。その町の名物を持ったキャラのやつ。
  - chat: [同人誌即売会帰り, うちの机、もうアクスタ置くとこない]
  - say: 置くとこない！ 分かる！ 私なんか、パソコンの前にも並んでて、画面の下の方が見えないの。
# 泣きゲーと、もう一個の言葉
- - chat: [解釈違いです, ラブプラスもいいけど、泣きゲーの話は]
  - say: 泣きゲーの話！ する！ 解釈違いです、今日は殴り合わない日にしよう。
  - chat: [初見の旅人, 泣きゲー？]
  - say: 泣きゲーはね、遊んだ人を泣かせにくる美少女ゲームのこと。物語を読むタイプのやつ。
  - say: 有名なのが Key っていうブランドの『Kanon』と『AIR』。1999年と2000年。
  - chat: [解釈違いです, 泣ければ名作ってわけでもない]
  - say: 名作かどうかの話はしてない！ ……泣いたのは好きだけど！ 今は棚の分け方の話！
  - say: 泣かせる方とは別に、お話よりえっちな場面がメインのやつは「抜きゲー」って呼ばれてるの。
  - chat: [最後尾はこちら, 言った]
  - say: {face: shy, text: 言ったけど！ 私が付けた名前じゃないぞ！ ジャンルの名前なの！ 店の棚もそうなってるの！}
  - chat: [初見の旅人, サキュバス的にはどっち派？]
  - say: サキュバス的にどっち派？ 聞くと思った！ 私が遊んだら、本業の見学になっちゃうでしょ！
  - say: 泣く方！ 泣く方の話をします！ 話戻すよ！
# 移植で増えるもの
- - say: でね、『Kanon』は1999年に18歳以上向けで出て、次の年の1月には大人向けの場面を外した版が出たの。
  - chat: [オハイオの字幕班, ドリームキャストのやつ！]
  - say: そう、ドリームキャスト！ 2000年の9月に移植されて、そこで声が付いたの！ パソコン版は声がなかったから。
  - chat: [緑ペンラ二年目, 声なしだったんですか]
  - say: 声なしだった！ 全部文字で読んでたの。移植で全員しゃべるようになって……主人公だけ、しゃべらないままなんだけど。
  - chat: [緑ペンラ二年目, 主人公だけ声なしは寂しいですね]
  - say: 寂しい？ 私は逆に好き！ 主人公は自分だからね。自分の声で読めるの。
  - say: 私ね、声が付いたのを初めて聴いたとき、自分が頭の中で読んでた声と全然違ってて、一回ゲーム止めた。
  - chat: [晴海の生き残り, アニメは観た覚えがある]
  - say: 晴海、観たんだ！ 『Kanon』は2002年に東映アニメーション、2006年に京都アニメーションで、二回もアニメになったの。
  - say: 『AIR』は2005年に京アニで。私、最終回、正座して観てた。終わったら足がしびれて立てなかった。
  - chat: [オハイオの字幕班, 鳥の詩！]
  - say: 鳥の詩！ 『AIR』の主題歌！ ファンの間だと「国歌」って呼ばれてるの。なんで国歌かは、いろんな説がある。
  - say: 私の友達、カラオケでこれ入れると立つの。私も一緒に立つ。客席の専門だから。曲の作りの話はエラに聞いて。
# 同人からFateへ
- - chat: [晴海の生き残り, 月姫はコミケで出たのだろう]
  - say: 晴海、そこ振ってくれるの！ そう、月姫はコミケ！ 自分たちで作った同人ゲームなの。2000年の12月、C59 で完全版が出たの。
  - say: で、その月姫を作ったサークルが TYPE-MOON。そのあと会社になって、最初に出した商業の作品が『Fate/stay night』。2004年の1月。
  - chat: [緑ペンラ二年目, Fate！ 私FGOから入りました]
  - say: FGO から入った！ 二年目世代はそうだよね。コミケで同人ゲーム出してた人たちが、あそこまで行ったんだよ。
  - say: 私、月姫は C59 の列に並んで買ったの。発見日誌に、ちゃんと書いてある。
  - chat: [晴海の生き残り, わしもいた]
  - say: 晴海もいた！？ 本当！？ どこに並んでた？ 何時に？
  - chat: [晴海の生き残り, カタログは実家にある]
  - say: {face: laugh, text: カタログは実家にある！ 出た、実家！ 今日も引き分け！}
  - say: でね、Fate の PC 版も最初は18歳以上向けで、2007年にプレステ2で、大人向けの場面を外した版が出たの。
  - say: ここからオタクの話ね。Fate には「魔力供給」っていう言葉があるの。
  - chat: [初見の旅人, まりょくきょうきゅう？]
  - say: 魔力供給はね、作中だと、魔力が足りない相手に魔力を分けてあげること。
  - say: で、PC 版だと、それがそういう場面の理由になってて。……そこまで！ 中身は言わない！
  - chat: [最後尾はこちら, そういう場面]
  - say: そういう場面って繰り返さないで！ それでね、オタクの間で何でも「魔力供給」って言うネタになったの。
  - chat: [解釈違いです, 二次創作で魔力供給を理由にするのは甘え]
  - say: {face: laugh, text: 甘え！ 字書きの目線、厳しい！ 理由があれば何でも書けると思うなってこと！？}
  - chat: [オハイオの字幕班, サキュバスの魔力供給は？]
  - say: サキュバスに魔力供給って言わないの！ それ私の本業のど真ん中！
  - say: 私がやったら、もらった方が三日寝込むよ！ ……ふふ、言っちゃった。今のはちょっとうまくない？
# 文学、芸術、人生
- - chat: [オハイオの字幕班, Fate は去年 Steam で英語になった]
  - say: 去年じゃないかも、2024年の8月！ Switch と Steam で、英語でも出たの。Vita 版をもとにして。
  - chat: [オハイオの字幕班, あ、2024。ごめん]
  - say: いいよ、私もよく一年ずれる！ 自分の年もずれるし！
  - chat: [解釈違いです, Fateは文学、AIRは芸術]
  - chat: [緑ペンラ二年目, CLANNADは人生！]
  - say: 出た！ 「Fateは文学、AIRは芸術、CLANNADは人生」！ ネットで言われてた言葉ね。
  - say: 『CLANNAD』はね、Key の三本目で、2004年。これは最初から全年齢で作ったの。
  - chat: [オハイオの字幕班, CLANNAD は2015年に Steam で英語。クラファンだった]
  - say: クラウドファンディングで英語にしたんだよね！ 14万ドルの目標が、一日かからずに集まったって。
  - chat: [オハイオの字幕班, 私も出した]
  - say: 出したの！？ じゃあオハイオの字幕班も、人生に出資したんだ。
# 一か月以上会えない彼女
- - chat: [緑ペンラ二年目, ラブプラスってスマホにもありましたよね？]
  - say: スマホのもあった！ 『ラブプラス EVERY』。2019年の10月31日に始まったの。
  - say: でもね、始まって二日で長いメンテナンスに入っちゃったの。彼女に会えるようになったのが、12月11日。
  - chat: [初見の旅人, 一か月以上会えない彼女]
  - say: 一か月以上会えない彼女！ 遠距離恋愛だよもう！
  - say: で、次の年の8月5日にサービスが終わったの。一年もたなかった。
  - say: ……ただ私、DS の方の彼女にも、四日で会いに行かなくなってたの。
  - chat: [最後尾はこちら, ログボと同じ]
  - say: ログボと同じ、そう、四日！ 私が続けられないの、全部四日なの！
  - say: だから今日出てきた DS、電源入れるのが怖いの。熱海の年から、十六年会いに行ってないんだよ。
  - chat: [解釈違いです, 向こうも待ってない可能性]
  - say: 向こうも待ってない可能性！？ やめて！ そっちの方が怖い！
# どこから入った？
- - say: みんなはどう？ ギャルゲーとか美少女ゲームとか、どこから知った？
  - ask:
      q: ギャルゲー・美少女ゲーム、どこから知った？
      options:
      - c: アニメから
        r:
        - '{from}はアニメから！ 京アニのを観た人、多いよね。'
      - c: ゲームから
        r:
        - '{from}はゲームから！ 遊び方の話は、リゼの枠でたっぷりね！'
      - c: コミケや同人から
        r:
        - '{from}、コミケから！ 仲間だ！ 列で会ってたかも！'
      - c: 通ってない
        r:
        - '{from}は通ってない派。それでいいの！ 今日の話で、ちょっとでも気になったらうれしい。'
      npc: [[晴海の生き残り, 2], [緑ペンラ二年目, 1], [解釈違いです, 2], [オハイオの字幕班, 0], [最後尾はこちら, 3]]
  - say: コミケからの人、けっこういる！ さすが遠征隊！
  - chat: [最後尾はこちら, 通ってない。棚卸しで箱は運んだ]
  - say: 通ってないけど、箱は運んだ！ 一番現場の関わり方してる！
# 名前を呼んでくれる
- - chat: [緑ペンラ二年目, ときメモは去年Switchで出ましたよね]
  - say: そう、2025年の5月8日！ 1995年のプレステ版をもとに、きれいにしてSwitchで出したの。
  - say: しかもね、自分の名前を登録すると、キャラが声で呼んでくれる機能が付いてるの。
  - chat: [初見の旅人, 名前呼ばれた？]
  - say: 名前呼ばれたか？ ……まだ。自分の名前を新しく作るのに、ネットにつないで設定がいるの。買って一年半、まだしてない。
  - chat: [最後尾はこちら, ホテルの本予約と同じ]
  - say: {face: shy, text: ホテルの本予約と同じ……同じだ……。仮のまま置いてる……。}
  - chat: [緑ペンラ二年目, 先輩、推しより先にゲームに名前呼ばれちゃいますね]
  - say: 推しより先にゲームに！？ 二年目、今日いちばん刺さったの、それ！
  - say: ……でもさ、ミナミより先に詩織に呼ばれるのも、ちょっといいかもしれない。
  - chat: [晴海の生き残り, いいのか]
  - say: いいのかって、晴海、よくない！ よくないけど、呼ばれたい！
# おしまい
- - say: よし、今日はここまで！ DS は、配信が終わったら充電する。
  - chat: [最後尾はこちら, 充電器ある？]
  - say: 充電器……。押し入れのどこかにある。たぶん。じゃあね、みんな！ また来てね！
