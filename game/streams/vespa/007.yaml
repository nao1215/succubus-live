title: 「コスプレ」という言葉ができた頃と、私の2メートルの槍
family: true
parts:
# もうすぐハロウィン
- - say: こんばんは！ もうすぐハロウィンだね。町がオレンジになってる。
  - chat: [緑ペンラ二年目, 先輩こんばんは！ 何か仮装しますか？]
  - say: 二年目、こんばんは！ 仮装するか？ しない。コスプレで一年中してるから。
  - chat: [最後尾はこちら, 渋谷には行く]
  - say: 渋谷には行く！ 見に行くだけ。人が多い所に行きたいの、私。
  - chat: [最後尾はこちら, 仕事で行く側としては来ないでほしい]
  - say: 来ないでほしい？ そっか、最後尾はこちらは警備のバイトで入る年もあるもんね。
  - chat: [初見の旅人, 初見です。仮装とコスプレって違うの？]
  - say: いらっしゃい！ 仮装とコスプレって違うの？ うーん、いい質問。私の感じだとね。
  - say: 仮装は、魔女とかおばけとか、なんとなくの格好。コスプレは、アニメとかゲームの決まったキャラになりきること。
  - chat: [解釈違いです, 境目はあいまい]
  - say: 境目はあいまい、あいまいだね。ハロウィンでアニメのキャラやる人もいるし。
  - chat: [初見の旅人, ヴェスパさんは何のキャラやるの]
  - say: 何のキャラやるか？ 槍を持ってるキャラ！ 槍が好きなの。
  - chat: [晴海の生き残り, こんばんは。また槍か]
  - say: 晴海、こんばんは。「また槍か」って、またって言わないで。
  - chat: [オハイオの字幕班, こんばんは。こっちのハロウィンは近所の家が本気]
  - say: オハイオの字幕班、こんばんは！ 近所の家が本気？ 家を飾るの？
  - chat: [オハイオの字幕班, 庭にガイコツが十体いる家がある]
  - say: 庭にガイコツが十体！ 夜道で見たら叫ぶやつ！
  - chat: [最後尾はこちら, 片付けが大変そう]
  - say: 片付けが大変そうって、すぐ片付けの心配する！ でも分かる、十体はしまう場所ないよね。
# 「コスプレ」って誰が言い出したの
- - chat: [初見の旅人, コスプレって言葉はいつからあるの？]
  - say: コスプレって言葉はいつからか、それね、ちゃんと始まりがあるの。1983年。
  - say: 高橋信之さんっていう人が、アニメの雑誌の連載で使ったのが最初って言われてる。
  - chat: [晴海の生き残り, コスチュームプレイの略だな]
  - say: そう、コスチュームプレイの略。でもね、それって英語としてちょっと変だって、担当の人に言われたんだって。
  - say: だから連載の名前は『コスプレ大作戦』にしたの。縮めちゃえって。
  - chat: [オハイオの字幕班, 今は英語で cosplay と言う]
  - say: 今は英語で cosplay って言う、そうなの！ 変だから縮めた言葉が、英語になってるの。
  - chat: [オハイオの字幕班, 辞書にも載ってる]
  - say: 辞書にも載ってる！ 高橋さん、びっくりしただろうね。
  - say: 私なんか、自分で作った言葉、自分の日誌の中でしか通じないのに。
# トリトンの思い込み
- - chat: [晴海の生き残り, 日本のコスプレの第一号は『海のトリトン』と聞いた]
  - say: 第一号は『海のトリトン』、出た、その話！ それね、ちょっと違うらしいの。
  - chat: [晴海の生き残り, 違うのか]
  - say: 違うのかって？ 1978年の、SF の大会でね。SF の本の表紙の絵みたいな格好をした人たちがいたの。
  - say: それを周りの人が「トリトンだ」って思い込んで。本人たちもあんまり強く否定しなかったんだって。
  - say: そう。それで「第一号はトリトン」って話が広まったの。
  - chat: [晴海の生き残り, 四十年以上信じてた]
  - say: {face: laugh, text: 四十年以上信じてた！？ でも晴海のせいじゃないよ！}
  - chat: [解釈違いです, 誤解のまま広まるのは二次創作あるある]
  - say: 誤解のまま広まるのは二次創作あるある。それはあるね。
# 私が初めて見たオタク
- - say: 私ね、初めて人間のオタクの人たちを見たの、1981年の新宿なの。
  - chat: [初見の旅人, 1981年？]
  - say: 1981年？って思うよね。長生きなの、私。サキュバスだから。
  - say: 新宿駅の東口に「アニメ新世紀宣言」っていうイベントがあって、1万人以上集まったの。
  - chat: [晴海の生き残り, ガンダムの映画の前だな]
  - say: そう、晴海の言う通り、ガンダムの映画の前のイベント。人だかりがすごくて、何だろうと思って近づいたの。
  - say: そしたら、手作りの衣装で来てる人がいたの。
  - say: その頃からいたんだよ！ 何て呼ぶのか誰も知らなかったけどね。
  - chat: [最後尾はこちら, 1万人の駅前。駅員さん大変そう]
  - say: 駅員さんの心配するんだ。でも、ほんとに大変だったと思う。
  - say: でもね、ほんとに、あの日の人だかり、今でも覚えてるの。みんな同じ方を向いて、知らない人同士でしゃべってて。
  - say: 私、魔界ではそういうの見たことなかったから。好きなものの話で、知らない人と盛り上がれるんだって。
  - say: それで、次の日からいろんなイベントに顔を出すようになったの。
  - chat: [晴海の生き残り, わしもその頃から通ってる]
  - say: 晴海もその頃から？ C17からでしょ。知ってる！ もう百回聞いた！
  - chat: [晴海の生き残り, 百一回目を話してやろう]
  - say: {face: laugh, text: 百一回目はいらない！ 槍の話させて！}
# そういえば、買って後悔したもの
- - chat: [同人誌即売会帰り, 槍って自分で作るの？]
  - say: 槍は自分で作る！ 材料を買ってきて。で、その材料が、かなり後悔した買い物なの。
  - chat: [初見の旅人, なんで？]
  - say: なんで後悔したかって、長い棒をね、切らずに、長いまま買っちゃったの。私の背より長いやつ。
  - say: で、電車に乗れなかった。
  - chat: [晴海の生き残り, 乗れないだろうな]
  - say: 乗れないよね。お店から家まで、四十分、肩に担いで歩いたの。
  - say: そしたら途中で小学生に「勇者だ！」って言われた。
  - say: ちょっとうれしかった。肩はずっと痛かったけど。
  - chat: [最後尾はこちら, 私は財布を三つ買ったのを後悔してる]
  - say: 最後尾は財布を三つ！？ なんで三つ？
  - chat: [最後尾はこちら, セールだった]
  - say: セールだったから？ セールだったら三つ買うんだ。中身は一つ分しかないのに。
  - chat: [最後尾はこちら, それは言わないで]
  - say: {face: smug, text: 「それは言わないで」！ やっと私が言う側になれた！}
  - chat: [オハイオの字幕班, 私はVHSのデッキを四台買った]
  - say: VHSのデッキを四台！ ダビング用だ！
  - chat: [オハイオの字幕班, 今は全部動かない]
  - say: 今は全部動かないんだ。でも捨てられないよね、それ。
# 禁止された時代
- - chat: [晴海の生き残り, 昔はコスプレ禁止の会もあったな]
  - say: コスプレ禁止の会、あった！ 80年代の終わりごろからね、混雑とかマナーの問題で、禁止する即売会が増えたの。
  - chat: [初見の旅人, 禁止！？]
  - chat: [晴海の生き残り, 着替える場所もなかった]
  - say: そうそう、着替える場所もなかったから、家から着てくる人もいて、問題になったりしたの。
  - say: でもね、コミケのコスプレの人、1991年は200人くらいだったのが、1997年には8000人くらいになったんだって。
  - say: 禁止されても、好きな人は増えるんだね。
  - say: 最近だと、今年の夏のコミケの更衣室、登録した人だけで9000人近く。
  - chat: [最後尾はこちら, 更衣室の列、見たことある]
  - say: 更衣室の列、見たことある？ 長いでしょ！ 女の人の方が多くてね、男の人の倍近くいるの。
  - chat: [オハイオの字幕班, 海外からも来る]
  - say: 海外からも来る、そう、海外の人も多い。2003年に名古屋で始まった「世界コスプレサミット」っていうのもあるの。
  - say: 最初は、テレビ局が海外のコスプレイヤー5人を招いた番組だったんだって。
  - chat: [オハイオの字幕班, 今はたくさんの国から来る]
  - say: 今はたくさんの国から。5人からだよ。すごいよね。
# 振り回さなければいい
- - chat: [緑ペンラ二年目, 先輩の槍、コミケに持って行けるんですか？]
  - say: 私の槍、コミケに持って行けるか？ 今はね！ 昔はダメだったの。30センチより長い物は持ち込めなかった。
  - chat: [初見の旅人, 30センチって定規くらい？]
  - say: 30センチは、そう、定規くらい。剣も杖も槍も、ほとんどダメ。
  - say: それが2011年の夏に、長さだけで禁止する決まりから、「振り回さない」っていう扱い方を重く見る形に変わったの。
  - chat: [解釈違いです, 物じゃなくて、やることを決めた]
  - say: 物じゃなくて、やることを決めた。そう、それ。この直し方、私ほんとに好きなんだよね。作れる衣装が一気に増えたし。
  - say: あ、でも今行く人は、その回の注意事項をちゃんと読んでね。持ち込みとか、撮っていい場所とか、回ごとに書いてあるから。私も毎回読み直してる。
  - chat: [最後尾はこちら, その槍は何センチ]
  - say: その槍は何センチか……2メートル。
  - chat: [最後尾はこちら, 定規何本]
  - say: {face: laugh, text: 定規何本って、定規で数えないで！ 七本くらい！}
  - say: 電車に乗れるように三つに折れるようにしたの。真ん中に金具付けて。
  - say: でも一個付け方を間違えててさ、電車の中でするする伸びた。
  - chat: [晴海の生き残り, 振り回してる]
  - say: 振り回してる？ 振り回してない！ 勝手に伸びたの！
  - chat: [ガチャ爆死太郎, 周りの人びっくりしたでしょ]
  - say: 周りの人びっくりした？ した！ 隣のおじさんが一歩下がった。全力で謝って、次の駅で降りて縮めたの。
  - say: {face: shy, text: 長ければいいってわけじゃないね。自分で運べないの、作ってから気付いた！}
# ハロウィン、何かする？
- - ask:
      q: ハロウィン、何かする？
      options:
      - c: 仮装して出かける
        r:
        - '{from}は仮装派！ 何になるの？ 槍持つなら、振り回さないでね！'
      - c: お菓子を買うくらい
        r:
        - '{from}はお菓子派。ハロウィン限定のお菓子、つい買っちゃうよね。'
      - c: 何もしない
        r:
        - '{from}は何もしない派。それもいい。家でゆっくりが平和だよね。'
      npc: [[緑ペンラ二年目, 1], [晴海の生き残り, 2], [最後尾はこちら, 2], [同人誌即売会帰り, 0], [オハイオの字幕班, 0]]
  - say: 仮装して出かける人と、何もしない人が同じくらいだね！
  - chat: [オハイオの字幕班, アメリカは子どもが家を回る。うちにも来る]
  - say: 子どもが家を回る、あ、トリック・オア・トリートだ！ お菓子あげるの？
  - chat: [オハイオの字幕班, 去年は60人来た]
  - say: 去年は60人来た！？ 列整理が要るね。
  - chat: [オハイオの字幕班, 去年はナルトが12人いた]
  - say: ナルトが12人！ 見たい！
  - say: 私の家、マンションだから誰も来ないの。一回お菓子用意して待ってたけど、結局自分で全部食べた。
  - chat: [同人誌即売会帰り, 今年はフリーレンでしょ]
  - chat: [緑ペンラ二年目, チェンソーマンもありそう]
  - chat: [オハイオの字幕班, 写真撮ったら見せる]
  - say: 今年はフリーレンとか、チェンソーマンとか？ 写真撮ったら見せて見せて！ 楽しみにしてる。
  - chat: [解釈違いです, 去年はレゼの人が多かった]
  - say: 去年はレゼの人が多かった、あ、そうかも！ 『チェンソーマン』のレゼの映画、去年すごかったもんね。
  - chat: [初見の旅人, そんなに？]
  - say: そんなに？って、最初は50億円くらいって見込みだったのに、100億円を超えたの。
  - chat: [同人誌即売会帰り, 冬コミでもレゼいっぱいいた]
  - say: 冬コミでもレゼいっぱい、いたいた！ 映画が当たると、次のイベントの衣装がすぐ変わるの。すごい速さで。
  - chat: [緑ペンラ二年目, 衣装って何日くらいで作るんですか]
  - say: 衣装って何日で作るか？ 人によるかな。私は槍だけで二か月かかった。服は一週間。
  - chat: [最後尾はこちら, 順番が逆]
  - say: 順番が逆？ 槍が本体なの、私の場合は。
  - say: 服は……なんとかなる！ エラに裾上げしてもらうし。
  - chat: [晴海の生き残り, 人任せだな]
  - say: 人任せって、だってエラの裾上げ、ほんとにきれいなんだもん。自分でやると斜めになるの。
# おしまい
- - chat: [解釈違いです, ハロウィンの話してたら、原稿の話を忘れてた]
  - say: 原稿の話を忘れてた？ 忘れててよかったのに！
  - chat: [解釈違いです, 思い出した]
  - say: 思い出した！？ 思い出さないで。ちゃんとやるってば。
  - say: じゃあ今日はここまで！ 渋谷に行く人は、人に押されないように気をつけてね。
  - say: おつかれさまでした！
