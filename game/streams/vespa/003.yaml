title: 推しの色が、緑から黄緑に変わった日
parts:
# 法被を洗った
- - say: こんばんは！ あ、今日ね、法被を洗ったの。
  - chat: [初見の旅人, 初見です。はっぴ？]
  - say: いらっしゃい！ はっぴ、分かる？ お祭りで着る、あの上着！ 私、推しのライブにそれ着ていくの。
  - chat: [緑ペンラ二年目, 先輩こんばんは！ 緑のやつですね]
  - say: 二年目、こんばんは！ そう、緑のやつ。背中に「ミナミ」って刺繍してあるの。
  - chat: [最後尾はこちら, 洗いすぎ]
  - say: 洗いすぎ？ そうなの、洗いすぎてね、「ミ」のとこがほつれてきてる。
  - chat: [晴海の生き残り, 「ナミ」になる]
  - say: {face: surprised, text: 「ナミ」になる！？ やめて！ 別の人になっちゃう！}
  - chat: [最後尾はこちら, エラに直してもらえば]
  - say: エラに直してもらう、そう、頼もうと思ってる。前に衣装の裾上げもやってもらったの。
  - say: 毒は吐かれるけどね。「ヴェスパ様の縫い目は、迷路でございますね」って。
  - say: エラ、言いそうでしょ！ でも直してくれるの。優しいの。
# 色が変わった
- - chat: [初見の旅人, 推しの人の色が緑なの？]
  - say: 推しの色？ そう！ アイドルのグループって、一人ずつ色が決まってることが多いの。メンバーカラー、略してメンカラ。
  - say: 客席でペンライトをその色にして振ると、「あなたを応援してます」って分かるの。
  - say: で、私の推しのミナミは緑。……だったの。
  - chat: [晴海の生き残り, メンカラ変更事件]
  - say: 「メンカラ変更事件」、晴海、覚えてた！ そう、事件！
  - say: 2018年にね、何の前触れもなく、ミナミの色が緑から黄緑になったの。
  - chat: [初見の旅人, ほぼ同じでは]
  - say: ほぼ同じでは？って、ちがうの！ 全然ちがうの！
  - say: ペンライトだとね、緑はちょっと青っぽく光るの。黄緑は黄色に寄るの。
  - say: 客席から見たら、ほんとに別の色なんだよ。私、最初の日、自分の手元だけ浮いてた。
  - say: しかもね、その前の月に、法被に刺繍を入れたばっかりだったの。緑の糸で、一万二千円。
  - chat: [緑ペンラ二年目, 私は最初から黄緑を振ってます]
  - say: 二年目は最初から黄緑かあ。黄緑が当たり前の世代なんだよね。
  - say: 私は今も緑を振る。黄緑は緑の一種だから。
  - chat: [解釈違いです, 解釈違いです。黄緑は黄緑]
  - say: {face: angry, text: 来た、「黄緑は黄緑」！ 黄緑は緑の仲間！ 名前に緑って入ってるでしょ！}
  - chat: [解釈違いです, 入ってるだけ]
  - say: 入ってるだけ？ 入ってればいいの！
# そういえば、お茶は緑
- - chat: [最後尾はこちら, この人、自販機でも緑のボタン押す]
  - say: 自販機でも緑のボタン、押す！ ほんとに押す！
  - chat: [初見の旅人, お茶は何派なの]
  - say: お茶は何派か？ ペットボトルなら伊右衛門。味も好きだけど、ラベルが緑だから。
  - say: 自販機に緑のボタンが二つあると、三分くらい悩むの。後ろに人が並んじゃって。
  - say: バイトの目で見ると、ああいう人ほんとに困るんだけどね。私なんだけど。
  - chat: [晴海の生き残り, お～いお茶]
  - say: 晴海はお～いお茶なんだ。それも緑だね！ 仲間！
  - chat: [晴海の生き残り, 色で選んでない]
  - say: 色で選んでない？ 選んでなくても緑なの！
  - chat: [オハイオの字幕班, こんばんは。アメリカのお茶は甘い]
  - say: オハイオの字幕班、いらっしゃい！ え、アメリカのお茶って甘いの？
  - chat: [オハイオの字幕班, 緑茶に砂糖が入ってるのが普通に売ってる]
  - say: {face: surprised, text: 緑茶に砂糖！？ 本当！？ どこで見たの？}
  - chat: [オハイオの字幕班, うちの近くのスーパー。蜂蜜味もある]
  - say: 蜂蜜味もある！？ ハチミツ注意報だ！ 推しのグループ名と一緒！
  - chat: [最後尾はこちら, こじつけ]
  - say: こじつけって言われても、いいの！ 飲んでみたい！
  - say: あとね、ファミレスのドリンクバーではメロンソーダ。緑だから。三杯は飲む。
  - chat: [最後尾はこちら, 黄緑のメロンソーダは？]
  - say: 黄緑のメロンソーダ？ ……緑の一種だから、飲む。
  - chat: [解釈違いです, 都合がいい]
  - say: {face: laugh, text: 都合がいいって？ そう、都合がいいの！ 推しの色は都合よく広がるの！}
# 地下から武道館
- - chat: [同人誌即売会帰り, 最近は地下から大きくなるグループ多いよね]
  - say: 地下から大きくなるグループ、多い！ CUTIE STREET とか。「かわいいだけじゃだめですか？」の。
  - chat: [初見の旅人, それ聞いたことある、動画で流れてた]
  - say: 動画で流れてた？ でしょ！ 2024年の9月に出た曲で、そこから一気に広まって。
  - say: 去年はレコード大賞の新人賞で、今年の8月には初めての武道館を二日間やったの。
  - chat: [緑ペンラ二年目, 行きました！]
  - say: 二年目、武道館行ったの！？ どうだった？
  - chat: [緑ペンラ二年目, 客席の色がすごかったです。全員分の色があって]
  - say: 客席に全員分の色かあ。いいなあ。想像しただけでいい。
  - chat: [最後尾はこちら, 武道館の物販は列がえぐい]
  - say: 物販の列がえぐい、それはそう。武道館の物販、私も前に一回入ったけど、朝から段ボールしか見てなかった。
# 晴海の親衛隊
- - chat: [晴海の生き残り, 武道館もいいが、法被は親衛隊の頃からあるぞ]
  - say: 出た、晴海の親衛隊の話！ 武道館から急に80年代に飛んだ！
  - chat: [初見の旅人, しんえいたい？]
  - say: 親衛隊って何か？ 80年代のアイドルにはね、ファンが作った応援の団体があったの。それが親衛隊。
  - say: 名前が強いよね。守る隊だもん。
  - chat: [晴海の生き残り, わしは入ってない。見てただけ]
  - say: 「入ってない、見てただけ」って、毎回それ言うよね！ ほんとに入ってないの？
  - chat: [晴海の生き残り, 入る金がなかった]
  - say: 入る金がなかった？ またお小遣いがない！ 晴海、いつもお金ない！
  - say: ここからちょっとオタクの話ね。親衛隊の格好って、時期で変わってたって言われてるの。
  - say: 70年代の終わりごろは、特攻服にハチマキ。
  - chat: [初見の旅人, 特攻服って暴走族の？]
  - say: そう、暴走族の、あの長いやつ！ それが80年代の前半には法被になって、後半はハチマキと腕章だけになったんだって。
  - say: じゃあ私の法被は、80年代前半の子孫だね！
  - chat: [解釈違いです, 自分で血筋を作った]
  - say: 自分で血筋を作った？ 作ってない！ たぶん合ってる！
  - chat: [晴海の生き残り, バラードでペンライトが揺れるのを「光の絨毯」と言った]
  - say: 「光の絨毯」、それ好き！ 客席の光が全部揺れて、ステージから見ると絨毯みたいだったって話でしょ。
  - chat: [晴海の生き残り, 緑の光る棒が出た年もあったらしい]
  - say: え、緑の光る棒が出た年があった！？ 本当！？
  - chat: [晴海の生き残り, と聞いた。持ってない]
  - say: 聞いただけで持ってないんだ！ でも緑だ！ 80年代から緑は推されてたんだ！
  - chat: [解釈違いです, それは解釈違いです]
  - say: 「それは解釈違いです」、また言った！ 今日よく出るね！
# 黄緑も緑の親戚
- - chat: [緑ペンラ二年目, 先輩、色が変わった日のミナミちゃんの話してください]
  - say: 色が変わった日の話？ いいよ、二年目のために話す！
  - say: 色が変わって最初のライブでね、客席に緑と黄緑が混ざってたの。
  - say: そしたらミナミがステージから見て、言ったの。
  - say: 「緑のままの人もいるね。黄緑も、緑の親戚だよ」って。
  - chat: [緑ペンラ二年目, その話好きです]
  - say: 二年目もその話好き？ でしょ！ 私それで救われたの。一万二千円の刺繍が、無駄じゃなくなった。
  - say: これ、ほんとはチェキ会で本人に言いたいことなんだけど、まだ言えてないの。
  - chat: [最後尾はこちら, 九年]
  - say: 九年って言わないで！
  - chat: [解釈違いです, 今のは殴れない]
  - say: {face: smile, text: 今のは殴れない？ 殴れないでしょ！}
# 当たったのに、入金を忘れた
- - chat: [緑ペンラ二年目, また大きいホールでやってほしいです]
  - say: また大きいホールで、やってほしいね！ でも大きいホールの話になると、私、思い出すことがあって。
  - chat: [晴海の生き残り, あれか]
  - say: 「あれか」って、晴海、なんで知ってるの！
  - chat: [晴海の生き残り, チケットの話になると毎回言ってる]
  - say: {face: shy, text: チケットの話になると毎回……言ってた！}
  - say: 2019年にね、ハチミツ注意報が初めて大きいホールでやったの。抽選で、私、当たったの！
  - chat: [初見の旅人, おめでとう！]
  - say: おめでとう、ありがとう！ で、当たったら、お金を払う締切があるでしょ。夜の11時59分まで。
  - say: その日ね、バイトで十時間立ってて、帰ってお風呂も入らずに寝ちゃったの。
  - say: 寝過ごした。スマホの通知、三回来てたのに。
  - chat: [初見の旅人, え]
  - say: 起きたら日付が変わってた。自動で取り消し。当たったのに、なかったことになったの。
  - chat: [解釈違いです, 当たってからの入金忘れは、落ちるより重い]
  - say: 落ちるより重い、そうなの、重いの！ 誰のせいにもできないの！ 自分にしか怒れない！
  - say: その日、会場の外まで行ったの。中には入れないけど、音がちょっとだけ漏れてくるの。
  - say: 緑の法被着て、外で一人で、小さい声でコールしてた。
  - chat: [最後尾はこちら, 警備の人に声かけられたでしょ]
  - say: 警備の人に？ かけられた！ 「どうされました？」って。「ファンです」って言ったら、「ああ」って分かってくれた。
  - chat: [最後尾はこちら, 警備の人はそういう人を毎回見てる]
  - say: 警備の人は毎回見てるって、毎回いるんだ！ 外でコールする仲間が！
# 目覚まし、何個かける？
- - say: で、それから目覚ましを七つかけてるの。
  - chat: [初見の旅人, 七つ！？]
  - say: そう、七つ！ 五分おきに、全部違う音で。
  - say: スヌーズでいいじゃんってよく言われるんだけど、スヌーズは止めたの覚えてないの。七つあれば、どれか一個は覚えてる。
  - chat: [最後尾はこちら, 七つ目、名前ついてる]
  - say: 七つ目の名前？ 「最後の砦」。これ、最後尾はこちらがくれた時計なの。
  - chat: [初見の旅人, その時計、もらったやつなんだ]
  - say: うん、もらったやつ。入金忘れた次の月にね、私の机に置いてあったの。裏に「最後の砦」ってテプラで貼ってあって。
  - chat: [最後尾はこちら, 机の上が散らかってたから置いただけ]
  - say: {face: smile, text: 散らかってたから置いただけ？ うそ。照れてる。最後尾はこちらが照れてる！}
  - chat: [最後尾はこちら, 照れてない]
  - say: みんなはどう？ 目覚まし、いくつかけてる？
  - ask:
      q: 朝の目覚まし、いくつかけてる？
      options:
      - c: 一つ
        r:
        - '{from}は一つで起きられる人！ すごい、その体ちょうだい！'
        - 一つで起きられるの、ほんとに尊敬する。
      - c: 二つか三つ
        r:
        - '{from}は二つか三つ派。分かる、保険かけたくなるよね！'
      - c: 四つ以上
        r:
        - '{from}、仲間だ！ 名前付けてる？ 付けると楽しいよ！'
      - c: かけない
        r:
        - '{from}はかけない派！ 自然に起きるの！？ どうやって！？'
        - 私、目覚ましなしだと次の日の夕方まで寝る自信ある。
      npc: [[晴海の生き残り, 3], [最後尾はこちら, 0], [緑ペンラ二年目, 1], [同人誌即売会帰り, 2], [解釈違いです, 1]]
  - say: 二つか三つが多いね！ 四つ以上の仲間も一人いる！
  - chat: [晴海の生き残り, かけない。年を取ると勝手に起きる]
  - say: 晴海は「年を取ると勝手に起きる」。それは早起きっていうより……あ、ごめん、言わない！
  - chat: [晴海の生き残り, 言え]
  - say: 言えって言われても言わない！ 晴海の朝が元気なのはいいこと！
  - chat: [最後尾はこちら, 一つ。時給がかかってるので起きる]
  - say: 最後尾は一つ。時給がかかってるから起きる。時給で起きる人だ！
# おしまい
- - say: じゃあ今日はここまで！ 明日、エラに法被を持っていく！
  - chat: [緑ペンラ二年目, 「ミ」を直してもらってください]
  - say: 「ミ」を直してもらう！ 「ナミ」にはしない！
  - chat: [解釈違いです, 糸の色は？]
  - say: 糸の色？ 緑。……あ、でも黄緑にしたらミナミ喜ぶかな。どうしよう。
  - chat: [緑ペンラ二年目, 両方の糸で縫うのは？]
  - chat: [最後尾はこちら, どれでもいいから早く寝ろ]
  - say: 両方の糸で縫う、と、早く寝ろ。待って、みんな意見がばらばら。決まんない。
  - say: エラに聞いてから決める。じゃあね、みんなおつかれさまでした！
