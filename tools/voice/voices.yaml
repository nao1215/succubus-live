    pim:   {voice: af_bella,    speed: 1.15}
    ella:  {voice: bf_isabella, speed: 0.95}
    nox:   {voice: af_nicole,   speed: 1.15}
    vespa: {voice: af_heart,    speed: 1.1}
    gyal:  {voice: af_nova,     speed: 1.1}   # ゲスト（Rabbit Run のギャル）。2026-10-27 試聴の B 案をユーザーが選んだ
