# 台詞の声（tools/voices.py が読む）。2026-10-27 に決めた。
# モデル：Irodori-TTS v4.1-Small-MF（MIT、https://huggingface.co/Aratako/Irodori-TTS-v4.1-Small-MF）。CPU で 1 文あたり実時間とほぼ同じ。
# 声の作り方：caption（声の説明の文）だけで、参照なしに ref_text を読ませた合成の声から、高さが6人で散る1本を選び（design_seed）、
#   それを参照音声 <id>.flac として残した。台詞は「参照音声＋caption」で読ませるので、行が変わっても同じ声になる。
#   実在の人の声は使っていない（モデルの規約「Do not use this model to clone or impersonate the voice of any individual」を守る）。
#   参照音声を作り直すと声が変わるので、消したら assets/voice/<id>/ も全部作り直すこと。
# 高さ（声の中央値、2026-10-27 に測った）：モーラ 約185Hz < リゼ 約224Hz < ノクス 約270Hz < エラ 約285Hz < ヴェスパ 約340Hz < ピム 約460Hz
model: Aratako/Irodori-TTS-v4.1-Small-MF
revision: null   # 決めた版に固定したいときはコミットの sha を書く
speakers:
  lise:   # 2026-10-28 作り直し（ユーザー「幼そう」→ 試聴 D を選んだ。約224Hz）。前の声は design_seed 22・約235Hz
    ref: lise.flac
    design_seed: 3
    caption: 二十代前半の女性。涼しく落ち着いた声で、甘さはなく、気だるげにそっけなく話す。
    ref_text: 起きてないわ。座ってるだけ。楽をしたい人は、バグ技を見つけるのが上手いの。私が言うんだから、本当よ。
    duration_scale: 1.1
  mora:
    ref: mora.flac
    design_seed: 55
    caption: 低く落ち着いた声の三十代の女性。淡々と、感情を抑えて、冷静にはっきり話す。
    ref_text: 番号札の数字ってね、順番じゃないの。窓口ごとに別の帳面で数えてるの。私はそれが許せない。
    duration_scale: 1.0
  pim:
    ref: pim.flac
    design_seed: 22
    caption: 明るく元気な若い女性。高めの声で、早口で、はきはきと楽しそうに話す。
    ref_text: 娘が寝た三十秒後に、夫が廊下の真ん中を踏みました！ 図まで描いて貼ってあるのにです！
    duration_scale: 0.88
  ella:
    ref: ella.flac
    design_seed: 22
    caption: 上品で丁寧な口調のお嬢様のような若い女性。柔らかく澄んだ声で、ゆったりと優雅に話す。
    ref_text: 率直に申し上げます。その転調は、作法として最悪でございます。そして最高でございます。
    duration_scale: 1.05
  nox:
    ref: nox.flac
    design_seed: 22
    caption: 内気な若い女性。小声で、ぼそぼそと、ささやくように早口で話す。
    ref_text: それ、確認なしで消えるの。先に何を指してるか見て。待って、ここ好きなの。
    duration_scale: 0.85
  vespa:
    ref: vespa.flac
    design_seed: 11
    caption: 元気いっぱいの若い女性。張りのある大きな声で、テンション高く、勢いよく話す。
    ref_text: 任せて！ 壁サークルは、壁際に並ぶ大手のことだよ！ ここからオタクの話ね！ 行こう！
    duration_scale: 0.95
  gyal:   # ゲスト（Rabbit Run のギャル。成人、明るく活発）。2026-10-27 試聴の B 案をユーザーが選んだ
    ref: gyal.flac
    design_seed: 7
    caption: ハイテンションな若い女性。張りのある明るい声で、語尾を伸ばしながら、早口でノリノリに話す。
    ref_text: はいはーい、映ってる？ マジ寒いじゃん、この部屋。ウケる！ ほら、動いてないと凍るって！
    duration_scale: 0.88
# 読み違える書き方の言い換え（読み上げに渡す文字列だけを変える。ファイル名のハッシュは表示の文字列のまま）。
# [表示, 読み] の組。上から順に置き換える。
readings:
- [二〇二五年, 二千二十五年]
- [ｗｗｗ, '']
- [ｗｗ, '']
- ['1-1', いちのいち]
- [$FF, エフエフ]
- ['888', はちはちはち]
- [emacs, イーマックス]
- [OAM, オーエーエム]
