# 2026-10-27 の試聴で決めた声と速さ。bf_ は英国英語のパイプライン（lang b）で読む。
# 音声の鍵は表示する英語（lang/en.yaml で訳した後の文字列）。置き場は日本語と同じ assets/voice/<id>/。
