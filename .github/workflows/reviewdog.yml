name: reviewdog
on: [pull_request]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # reporter: github-pr-review posts review comments on the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@7abf25e1607ec65838b73d0484ff31f8e9499d80 # v1.81.2
        with:
          reporter: github-pr-review
          # An actionlint error fails the job, not only a comment on the pull request.
          fail_level: error
