name: Release

# On a tag vX.Y.Z, once verify.yml has passed on the tagged commit: exports the game for each
# desktop OS, and publishes the zips with their checksums, a keyless cosign signature of the
# checksums (checksums.txt.sigstore.json) and build provenance as a GitHub release, its notes
# taken from CHANGELOG.md. A tag vX.Y.Z-rc.N makes a prerelease; other tags stop.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    # contents: create the release. id-token: the keyless cosign signature and the provenance.
    # attestations: publish the build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the long export: a tag without its section in CHANGELOG.md stops here.
      - name: Take the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # vX.Y.Z, or vX.Y.Z-rc.N for a prerelease
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?'; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          version=${TAG#v}
          mkdir -p dist
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "::error::CHANGELOG.md has no section ## [$version]"
            exit 1
          fi

      - uses: nao1215/setup-gozen@1c378fc446f62ecb29a7bcd40aea6dff8565d698 # v0.1.1
        id: gozen

      - name: Export the desktop zips
        env:
          GOZEN_VERSION: ${{ steps.gozen.outputs.version }}
        run: |
          make desktop GOZEN=gozen
          cd dist && sha256sum succubus-live_*.zip > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the certificate in the bundle names this workflow and the tag, through GitHub's OIDC.
      - name: Sign checksums.txt
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/succubus-live_*.zip
            dist/checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=
          case $TAG in *-*) pre=--prerelease ;; esac
          # shellcheck disable=SC2086 # $pre is one flag or nothing
          gh release create "$TAG" --verify-tag $pre --title "$TAG" --notes-file dist/notes.md \
            dist/succubus-live_*.zip dist/checksums.txt dist/checksums.txt.sigstore.json
