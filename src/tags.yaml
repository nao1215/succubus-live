# 声の keywords の並び（上から先に判定）：
#   1. safe（視聴者の子どもの話、未成年の視聴者）… 下ネタの返しが付かないよう必ず先頭
#   2. lewd（下ネタ）
#   3. tease・troll・meta・request・rival・faction・praise（年齢・見た目・荒らし・メタ・要望・ほかの配信者・雑談の派閥・褒め）
#   4. その人の得意領域の match
#   5. chat（挨拶・相づち・草・888・眠い・風邪・仕事終わった・ご飯・テスト・誕生日）

