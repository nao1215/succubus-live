# 自由コメントの判定（JavaScript の正規表現、大文字小文字は区別しない）。全員で共通。
# 声では `- tag: kiss` のように名前で使い、返しの台詞（alts）だけを各キャラで書く。名前は全部の組を通して一意。
# 組（safe / lewd / tease / ...）は書き手と tools/kwtest.py の目印。ゲームは組を見ない（名前だけ）。
# 書ける正規表現は gozen の反応の本に開ける範囲だけ（tools/import_stream.py の Rx）：| ( ) (?: ) (?<! ) (?! ) [字の並び] \b ? .
#   + * {n} ^ $ (?= ) \d \s と、[0-9] のような範囲は使わない（[0123] と並べて書く）。記号だけ・絵文字だけの語も使わない（正規化で空になり、何にでも当たる）。
# 直したら python3 tools/kwtest.py で、例文の漏れと普通の雑談への誤反応がないことを確かめる。例文は src/research/expected-comments.md から。
