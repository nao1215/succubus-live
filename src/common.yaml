generic:
  # 未成年と申告した視聴者・子どもが出る回で、下ネタのコメントに返す断り（性的でない）。voice に safe_refusal がない人だけが使う
  safe_refusal:
  - ['{name}、その話はここではしないよ。普通にお話ししよう。']
  first: ['初めまして、{name}。ゆっくりしていって。']
  streak: ['{name}、{days}日続けて来てくれてるね。']
  stayed: ['{name}、最後まで見てくれてありがとう。']
  greet:
  - null
  - - '{name}、また来てくれたんだ。'
  - - '{name}、いつもありがとう。'
  - - '{name}、待ってた。'
  - - '{name}。あなたが来ると、配信が始まった気がする。'
  keywords:
  - match: おは
    say:
    - おはよう、{name}。
  - match: かわい|可愛|美人|きれい|綺麗
    say:
    - ありがとう、{name}。
  - match: 初見|はじめまして
    say:
    - いらっしゃい、{name}。ゆっくりしていって。
  echo:
  - 「{text}」……もう少し聞かせて、{name}。
  tips:
  - - '{name}、ありがとう。'
  - - '{name}、ありがとう！ 大事に使うね。'
  - - '{name}……！ ありがとう。びっくりした。'
  - - '{name}。……本当に、ありがとう。'
# 視聴者の投げ銭に添えるコメント
tipTexts: [いつもありがとう, 今日の話よかった, 推しです, '', 続きが聞きたい, 勉強になった]
