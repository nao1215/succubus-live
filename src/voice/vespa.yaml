- 'あ、そうだ！ 言おうと思ってたことあったんだ！'
- 'チャット流れ早い！ みんな元気だね！'
- 'えーっと、何の話しよっか！'
- 'ちょっと休憩！ 遠征隊のみんなも水分とって！'
- '話変えていい？ 変えるぞ！'
- '喉がガラガラ。喋りすぎた。いつものことだけど！'
- '眠くなってきた。もうちょっとだけ話すね！'
- '静かになったね。みんな生きてる？ 隊長は生きてるぞ！'
- 'チャット全部拾えなくてごめん！ 目が二つしかないの！'
- 'まあいいや、次！'
- 'ペンライト、机の上で転がってる。あとで拾う！'
- 'ちょっと座り直すね。ずっと同じ姿勢だった！'
- 'お菓子食べたくなってきた。我慢！'
- 'スマホ光った！ ただの通販のお知らせだった。'
- '一回深呼吸！ よし、エンジンかかった！'
- 'あれ、マイク入ってる？ 入ってるね！ 大丈夫！'
- 'なんか語りすぎたかも。語るけど！'
- '遠征隊のみんな、まだついてきてる？ 置いていかないぞ！'
- 'そうそう、そうなんだよね。で、次！'
- '暑くなってきた！ 喋ってるだけなのに！'
- 'くしゃみ出そうで出ない！ むずむずする！'
- 'よーし、まだまだいくぞ！'
