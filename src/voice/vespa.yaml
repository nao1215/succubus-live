- match: 前略|プロフ|黒歴史|mixi|ミクシィ
  alts:
  - ['{name}、その話はやめて！ 前略プロフの「推しへの百の質問」、ウェブの保存に残ってたの！ 見つけたのは晴海！']
  - ['黒歴史はね、2016年にサービスが終わっても消えないの！ 好きな言葉の欄に「萌え〜」って書いてた！']
- match: 生成AI|AI絵|AIイラスト|画像生成|AI art|stable diffusion|midjourney
  alts:
  - ['AI の絵そのものより、学ばせた絵を描いた人に聞いてないのが苦手なんだ、{name}。']
  - ['絵の話なら、私は「この線、何度も描き直したんだろうな」って見るのが好き！']
- match: ミーム|流行語|バズ|トレンド|meme|trend|viral|エッホ|エビ揉め
  alts:
  - ['流行りは現地で確かめる！ {name}、それどこで流行ってた？ すぐ見に行く！']
  - ['エッホエッホ、{name}が流行りの話してるって伝えなきゃ！ 使いたかっただけ！']
  - ['エビ揉め、知ってる？ 英語の歌詞が「エビ揉め！」に聞こえる空耳！ 一回聞こえると戻れないの！']
- match: 限界オタク|尊い|しんどい|メロい|沼
  alts:
  - ['分かる！ もう好きしか言えない！']
  - ['沼にはまったね、{name}！']
- match: 新規|同担|同担拒否|解釈違い|厄介|ガチ恋
  alts:
  - ['同担拒否は、同じ推しを好きな人と仲良くしたくない人のこと。気持ちは分かる！ でも現場では優しくね！']
  - ['同担の話かあ。うちの後輩、もう推しに名前覚えてもらったんだって。うらやましいな！']
- match: 炎上|騒動|事件|引退|卒業|活動休止
  alts:
  - ['{name}、その話は、発表されたことだけ話すね。噂は、本人を傷つけるから。']
  - ['その件は、まだ分からないこともあるし、本人の話を待ちたいね！']
# ---- 挨拶・雑談 ----
- match: リゼ|lise
  alts:
  - ['リゼはね、私の推しの話を寝ながら最後まで聞いてくれるの！ 起きてるのかは分からない！']
  - ['{name}、ゲームの話はリゼの枠で！ 私が語ると、限定版のおまけの話しかしないから！']
- match: モーラ|mora
  alts:
  - ['モーラにはね、家賃を借りたことがあるの。アクスタ十四個の月。帳面に赤字で書かれた！']
  - ['{name}、モーラに「今月グッズにいくら使った？」って聞かれるのが一番怖いんだ！']
- match: ピム|\bpim\b
  alts:
  - ['ピム、遠征から帰った日に何食べれば楽か、すぐ教えてくれるの！']
  - ['ピムの規則帳に「ヴェスパの遠征は月二回まで」って書いてあった！ 守ってない！']
- match: エラ(?!ー)|\bella\b
  alts:
  - ['エラにアイドルの曲の話をすると、和音から説明が始まるの！ 私はコールの入れどころが聞きたいの！']
  - ['{name}、エラは私の法被のほつれを直してくれるの。毒を吐きながら！']
- match: ノクス|\bnox\b
  alts:
  - ['ノクスはね、目覚まし七つの設定を手伝ってくれたの！ 頼もしい！']
  - ['ノクスのパソコンの壁紙、推しなんだぞ。あ、言っちゃった。内緒ね、{name}！']
- match: 間違|訂正|違うよ|ちがうよ|wrong|correction
  alts:
  - ['間違えた？ 待って、調べる！']
  - ['{name}、どこで見たの？ 公式の発表？ 雑誌のインタビュー？ 確かめたら、ちゃんと言い直すぞ！']
- match: 悲し|つらい|辛い|落ち込|\bsad\b
  alts:
  - ['{name}、おつかれさま。今日はここで、ゆっくりしていってね。']
  - ['そっか、{name}。無理しないでね。好きなもの、一個だけでも見て寝よう！']
# ---- 挨拶・相づち・日常の報告（判定は src/tags.yaml で全員共通。得意領域より後ろ） ----
- tag: morning
  alts:
  - ['おはよう、{name}！ 起きたばかり？ 今日の推しの供給、チェックした？']
  - ['おはよう！ 私は目覚まし七つで起きた！ 七つ目で！']
- tag: first
  alts:
  - ['初見さん、いらっしゃい！ {name}、ここは流行りとオタクの話の配信！ 知らない言葉は何でも聞いて！']
  - ['{name}、初めまして！ 発見日誌に、今日の日付書いとくね！']
- tag: hello
  cases:
  - if: {hour: [23, 5]}
    alts:
    - ['{name}、夜ふかし組！ 私もだぞ！']
  - if: {mem: {kinoko_takenoko: '*'}}
    alts:
    - ['{name}！ {mem.kinoko_takenoko}派の！ 覚えてるぞ！']
  - if: {visits: [10, null]}
    alts:
    - ['{name}、おかえり！ 遠征隊の常連だね！']
  - if: {visits: [0, 1]}
    alts:
    - ['{name}、いらっしゃい！ 初めて？ ゆっくりしてって！']
  alts:
  - ['こんにちは、{name}！ お昼食べた？ 私はバイトの休憩で、鮭のおにぎり！']
  - ['{name}、いらっしゃい！ ゆっくりしていってね！']
  - ['こんばんは、{name}！ 夜は深夜アニメの時間だね！']
  - ['こんばんは！ 今日も一日おつかれさま、{name}！ あ、配信だと言える！']
  - ['{name}、いらっしゃい！']
- tag: bye
  alts:
  - ['おやすみ、{name}！ 寝る前に、チケットの入金の締切だけ確かめてね！ 本当に！']
  - ['おやすみ！ 推しの夢、見られるといいね！']
- tag: lol
  alts:
  - ['笑った！ {name}、今のうまくなかった？']
  - ['草！ {name}が笑うと、私もつられる！']
  - ['あはは！']
- tag: nod
  alts:
  - ['でしょ、{name}！ この話、分かってくれる人がいると止まらなくなる！']
  - ['それな！ {name}、分かってくれてうれしい！']
  - ['それな！']
  - ['わかる！']
- tag: clap
  alts:
  - ['888！ ありがと！']
  - ['{name}、拍手もらった！ 撤収前の拍手、うれしいんだよね！']
  - ['ありがと！']
- tag: tired
  alts:
  - ['{name}、お疲れ！ 今日は早めに寝よう！']
  - ['お疲れ！']
  - ['寝よ寝よ！']
- tag: sick
  alts:
  - ['{name}、熱か！ 今日の予定は気になるだろうけど、無理しないでね！']
  - ['体調悪いときは、推しの写真一枚だけ見て寝よう！ お大事に！']
- tag: workdone
  alts:
  - ['{name}、仕事の日か！ 今日の現場はどう？']
  - ['お仕事お疲れ！ 帰り道に推しの曲一曲だけ聴いて！']
  - ['おつかれ！']
- tag: meal
  alts:
  - ['{name}、ご飯いいね！ 何食べてるの？']
  - ['ご飯の話！ 私はたぶん今夜も、イベント帰りのおにぎり！']
  - ['何食べた？']
- tag: study
  alts:
  - ['勉強の方はどう？ 一段落したら、好きなものの話しよう！']
  - ['{name}、勉強がんばれ！ 終わったら好きなアニメ一話、ご褒美にしよ！']
  - ['何の勉強？']
- tag: birthday
  alts:
  - ['{name}、誕生日おめでとう！ 今日の日付、覚えとくね！']
  - ['おめでとう！ 何かお祝いするの？']
echo:
- '{name}、それ、どういうこと？ もうちょっと聞きたい！'
- '{name}の「{text}」、それ初めて聞いた！ どこで見たの？'
- そうなんだ、{name}！ もう少し聞かせて！
tips:
- - '{name}、ありがとう！ 遠征費、いただきました！'
- - '{name}、二千円！ ありがとう！'
  - チェキ一枚と、ちょっとおつり！ 次は「おつかれさまです」以外を言うぞ！
- - '{name}……一万円！？ 本当！？ ありがとう！'
  - '{name}、ありがとう！ 遠征の交通費に使わせてもらうね！'
- - '{name}！？ 五万円！？'
  - ちょっと待って、手が震えてる。
  - ありがとう。そのかわり、{name}の推し活の予算も、ちゃんと残しておいてね。約束だぞ！
# 回と回のあいだに挟む、つなぎの一言（どの回の前にも挟めるように、次の題に触れない。差し込みなし、時間帯の言葉なし）
bridges:
