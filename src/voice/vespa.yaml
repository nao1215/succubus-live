# ヴェスパの声：挨拶（覚えの段ごと）、自由コメントへの返し、投げ銭の読み上げ。全部の回で共通。2026-10-27 バイブルの作り直しに合わせて書き直し（前の版は src/old/voice-v4/vespa.yaml）。
# 得意領域はポップなサブカル（アニメ・漫画・アイドル・推し活・コスプレ・同人・VTuber 業界・流行り）。
# 勢いのある「〜だね」「〜だぞ」「任せて！」。相手は名前を呼び捨て。好きな話で声が弾み、自分で言って自分で笑う。
# 人となり：見つけるのは得意で続けるのは苦手。推しの前だと「おつかれさまです」しか言えない（推しには「おつかれさまの人」と呼ばれている）。発見日誌、坂を測る癖、緑の法被、目覚まし七つ、物販のバイト。
# 下ネタには笑って怒るか、照れるか、短く切って流す（毎回うまい返しにしない）。未成年のキャラ・実在の人物・推しを性的な話にしない。
# 未成年と申告した視聴者・子どもが出る回では safe_refusal を返す（2026-10-27 二回目のレビュー。前の版は src/old/voice-v9/vespa.yaml）。
greet:
- null
- - '{name}！ また来てくれたんだね。今日も一緒に行こう！'
- - '{name}、来た！ 三回目だよね。'
  - 発見日誌に{name}の日付、書いておいたぞ！ 最初に来た日のやつ！
- - '{name}！ 最近、推しの現場に行けた？'
  - 行けたなら、あとで感想聞かせて！ 私はまた「おつかれさまです」しか言えなかった！
- - '{name}！ 待ってたぞ！'
  - '{name}、待ってたぞ！ 今日もよろしくね！'
# 遊ぶ人が書いた言葉の入る台詞（「{text}」など）で、字幕はその台詞のまま、声はこの一言（gozen の voice_fallback。2026-10-28）
fallback: 'もうちょっと聞きたい！'
first:
- いらっしゃい、{name}！ ここは流行りとオタクの話をする配信だよ。知らない言葉が出たら、遠慮なく聞いてね！
- '{name}、初めまして！ 隊長のヴェスパだよ。来てくれる人はみんな「遠征隊」！ よろしくね！'
streak:
- '{name}、{days}日連続！ すごい！ 私、ログボ四日で切れる人だから、尊敬しかない！'
- '{days}日続けて来てくれてる！ {name}、それはもう古参だね。新しく来た人には優しくしてね！ 私も気をつける！'
stayed:
- '{name}、最後までありがとう！ 楽しかったね！ また遊びに来て！'
- '最後までありがとう！ またね！'
# 未成年と申告した視聴者・子どもが出る回で、下ネタ（tags.yaml の lewd の組）に返す性的でない断り
safe_refusal:
- ['はい、そこまで！ {name}、その話はしないよ。次の話いこう！']
- ['{name}、そのお願いは聞けないな！ それより、最近ハマってるもの教えて！']
- ['その話はなし！ 普通にお喋りしよう、{name}！']
keywords:
