  alts:
  - ['子どもの話だね！ プリキュアの映画で、親子でペンライト振ってるのを見ると、私までうれしくなるんだ。']
  - ['子どもに聞かれると、説明に困ることあるよね！']
  - ['{name}は昔、何ごっこしてた？']
  - ['子どもの頃に好きだったもの、大人になってまた好きになるの、いいよね。平成女児のシール集め、私も大好き！']
- tag: minor
  remember: {minor: 1}
  alts:
  - ['{name}、学生さんだね！ いらっしゃい！ 推し活は、お小遣いの範囲でね！']
  - ['学生さんか！ {name}、遠征は家の人に言ってからね！ 私はパスポートすら切れてるけど！']
