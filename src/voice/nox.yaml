# ノクスの声：挨拶（覚えの段ごと）、自由コメントへの返し、投げ銭の読み上げ。全部の回で共通。
# 2026-10-27 二度目の作り直し（前の版は src/old/voice-v4/nox.yaml）。bible の person に合わせた。
# 返しの形：まず相手のコメントを受け止める（「分かる」「それはつらい」「いい質問」）→ 一言でかみ砕く → ノクスらしい一言（自分のやらかし、×3.7、よる、EAGAIN、THANKS）。
# 2026-10-27 夜：台帳のソフト・鍵・穴の話の反応を、リゼの voice から移してノクスの口調に直した（前の版は src/old/voice-v6/nox.yaml）。
# 用語や比喩だけで返さない。下ネタには、照れる・短く断る・流して続ける・聞き返すを混ぜ、担当分野の言葉の冗談は一部だけ。露骨な描写はしない。
# 2026-10-27 二回目のレビューで直した（前の版は src/old/voice-v9/nox.yaml）。
greet:
- null
- - '{name}、いらっしゃい。また来てくれたのね。うれしい。'
- - '{name}、こんばんは。'
  - 最近、何か壊れた？ 壊れてなくても、ゆっくりしていって。
- - '{name}さん。来てくれたのね。'
  - 今日もいっぱい壊れ方の話をするわ。分からない所は、遠慮なく止めて。
- - '{name}さん。'
  - あなたがいると、話すのが少し楽しくなるの。……THANKS に、もう名前あったかしら。なかったら足すわ。
first:
- いらっしゃい、{name}。ここは、プログラムの壊れ方と直し方の話をする配信。知らない言葉が出たら、そのまま「？」って打ってね。
streak:
- '{days}日続けて来てくれたのね。ありがとう。'
stayed:
- '{name}、最後までいてくれたのね。ありがとう。今夜、楽しかった。'
safe_refusal:
- ['その話はここまで。さっきの続き、聞く？']
- ['{name}、その話はしないの。今日の話の続きをするね。']
keywords:
# ---- 子どもの話・未成年の視聴者（下ネタより先に判定する。判定は src/tags.yaml） ----
- tag: kids
  alts:
  - ['子どもの話ね、{name}。……寝かしつけ、おつかれさま。私が寝かしつけられるのは、バグだけなの。しかもすぐ起きる。']
  - ['子どもの「なんで？」って、すごいのよ、{name}。', '答えられない所が、だいたい私の分かってない所なの。']
  - ['{name}、近くで小さい子が寝てる？', 'じゃあ、もっと小声で話すね。……これ以上小さくできるかは、確かめてないけど。']
  - ['子どもって、同じこと何回でもやるのよね。見てる方も覚えちゃう。']
- tag: minor
  remember: {minor: 1}  # 未成年と申告した視聴者。覚えたら会話の途中で解除しない（下ネタには safe_refusal を返す）
  alts:
  - ['学生さんなのね、{name}さん。いらっしゃい。分からない言葉が出たら聞いてね。']
  - ['{name}さん、若いのね。夜更かしは、私みたいになるから、ほどほどに。']
  - ['学生さんなのね。プログラミング、やってみたいなら、最初は小さいのでいいの。動いたらうれしい、が一番大事。']
# ---- 下ネタへの反応 ----
# 2026-10-27 二回目のレビュー：何でも担当分野の言葉に置き換える返しを減らし、照れる・短く断る・流して続ける・聞き返す、を混ぜた。
# 担当分野の言葉の冗談は各項目に多くて一つ。言い直させる・膨らませる返しは置かない。
# 未成年と申告した視聴者・子どもが出る回では、gozen の変換が下の safe_refusal を先に返す。
- tag: body
  alts:
  - ['{name}、見てるのね。', '画面、明るさほぼ最低なのに。……あなたの目、暗視機能付きなの？']
