- match: オーバーフロー|あふれ|溢れ|桁|overflow
  alts:
  - ['あふれる話ね。最大の値と、その前後を試してみて。']
  - ['{name}、大きい箱から小さい箱に移す所、一行だけ確かめを入れて。……そこで落ちるの、よくあるの。']
- match: 型|キャスト|\bint\b|\bshort\b|\bcast\b
  alts:
  - ["{name}、型の話ね。必要な範囲と単位で決めるの。大きければ全部安心、ではないのよ。", "小さい箱に移す所だけ、目立つようにしておくの。"]
  - ['型の変換？ 変換先に収まるか、先に確かめてね。']
- match: 文字化け|文字コード|UTF|Shift_JIS|SJIS|mojibake
  alts:
  - ['文字化けね、{name}。いやよね、あれ。', '書いた側と読んだ側、どっちの文字コードか分かる？ ……そこがずれてることが多いの。']
  - ["{name}、「表」とか「ソ」が入ってない？", "昔の文字コードだと、その字の途中のバイトが、区切りの記号と同じなの。文字の境目を見ない古い処理が、そこを取り違えるのよ。"]
- match: タイムゾーン|時刻|うるう|閏|timezone|leap
  alts:
  - ["時刻ね、{name}。私、そこはうるさいの。", "前に、サーバーの時刻の設定を知らせずに変えられて、九時間ずれたことがあるの。まだ少し根に持ってる。……でも、二回走っても困らない作りにしてなかったのは、私の方。"]
  - ['{name}、私の配信の開始時刻がずれるのは、タイムゾーンのせいよ。……そういうことにしておいて。']
- match: JavaScript|\bJS\b|ジャバスクリプト|TypeScript
  alts:
  - ['JavaScript の話ね。急いで作られた言語が、ずっと使われてるのよね。']
  - ['{name}、typeof null は "object" なの。', '直せないのよ。直したら世界中のページが壊れるから。……ちょっとかわいそうでしょう。']
- match: Python|パイソン
  alts:
  - ['Python ね、{name}。', '名前、蛇じゃなくて、イギリスのコメディ番組からなのよ。……知ってた？']
  - ["{name}、Python の普通の int は、桁が増えていくからあふれないの。", "でも、NumPy みたいな固定幅の型や、外の世界に渡す所には別の限界があるの。……そこだけ気をつけて。"]
- match: Go言語|golang|if err|\bGo ?1\.\d|\bGo ?(で|の|は|を)
  alts:
  - ['Go、好きよ、{name}。', 'if err != nil を毎回書くの、面倒でしょう。……でも、毎回考えさせられるのが好きなの。']
  - ["{name}、Go の signal.Notify で、終わりの合図を一回受け取るなら、受け口は 1 にしてね。", "0 だと合図を取りこぼすことがあるの。……私、二年それで落としてた。何回来たかを数える道具ではないけどね。"]
- match: Rust|C言語|\bAda\b|Java\b
  alts:
  - ['言語の話ね、{name}。好き。', '喧嘩も好きよ。でも、その言語を書く人を馬鹿にしたら、そこで終わりね。']
  - ['{name}、Rust は好き。……全部 Rust で書き直そうって玄関に来る人は、ちょっと苦手。']
- match: \bgit\b|コミット|マージ|commit|merge
  alts:
  - ['{name}、犯人のコミットを探すなら git bisect。半分ずつ見るの。', '犯人は、たいてい自分の名前なのよね。私もそう。']
  - ['コミットメッセージ、ちゃんと書いてる？ {name}。', '私の自作 OS、九割が「fix」なの。人のこと言えない。']
- match: 正規表現|regex
  alts:
  - ['正規表現ね、{name}。', '三日前に書いたの、今読める？ ……私は読めない。']
- match: 名前|命名|naming
  alts:
  - ['名前を付ける話？ どんな名前で迷ってるの？']
  - ['{name}、私のサボテンの名前、EAGAIN なの。', '「今は無理、もう一回やって」っていう意味のエラーの名前。……名前を付けるのは難しいわね。']
- match: パスワード|password
  alts:
  - ['{name}、パスワードの使い回しは、やめてね。', '鍵を一本にまとめて、玄関マットの下に置くのと同じなの。']
  - ['{name}、チャットにパスワードを書かないでね。……今、書こうとしてなかった？']
- match: コメント書|ドキュメント|comment|docs
  alts:
  - ['コメントの話ね。コードだけじゃ分からない理由を残してくれると、助かるの。']
  - ['説明書の話ね、{name}。', '私、説明書にちゃんと書いてあったのに読まなくて、二年やらかしたことがあるの。']
- match: テスト(?!勉強|期間|前|週間|終わ|おわ|やば|だめ)|試験(?!勉強|前|期間|終わ|おわ|中)|\btest
  alts:
  - ['テストの話ね。境目の値も試すと、見つかることがあるの。']
  - ['試験の偽物の相手、いつも一瞬で返事してない？ {name}。', '一匹、遅い偽物を混ぜておくといいの。三十秒黙る子。かわいいわよ。']
- match: 見積|何時間|いつ終わ|estimate
  alts:
  - ["口で言う見積もり、私はいつも短く言いすぎるの。仕事のは、調べる時間と試験の幅を付けて出すけど。"]
- match: 仕様|\bspec\b
  alts:
  - ['仕様の話ね、{name}。', '誰が、どうして決めたのか、分かると面白いのよね。……分からないと、ただ腹が立つけど。']
  - ["{name}、間違いでも、みんなが頼ってたら変えるのは難しいの。", "でも、危ない所まで仕様で済ませたくないわ。移る道を作って、ちゃんと直すの。"]
- match: 噂|都市伝説|本当？|ほんと？|really\?
  alts:
  - ['噂？ 聞かせて、{name}。', '出どころが分かると、もっと面白いの。一緒に探しましょう。']
  - ['{name}、それ、作った本人は何て言ってるのかしら。', '本人の話が出てくると、噂と全然違うこと、よくあるのよ。']
- match: 当番|オンコール|on.?call|夜勤|障害対応
  alts:
  - ['当番なの？ 静かな夜だといいわね。']
  - ["{name}、私、障害の通話で声が出ないから、指揮は全部チャットでやってるの。", "状況と次の手を一か所に揃えて、読み上げは相棒に頼むの。あなたも、喋れなくても打てばいいのよ。"]
- match: サボテン|EAGAIN|cactus
  alts:
  - ['EAGAIN のこと、覚えててくれたの、{name}。', '元気よ。二代目。……水は、今は週に一回だけにしてるの。リトライの間隔を空けたの。']
- match: 自作OS|自作 OS|\byoru\b|よる動|よるは|よるの|よる落
  alts:
  - ['よるのこと、聞いてくれるの？ {name}。', '落ちたわ。でも、落ちる場所が一行ずれたの。']
  - ['{name}、よるはね、まだ時計の合図で落ちるの。', '今週の仮説はね……聞く？ 長いけど、聞いて。']
# ---- 挨拶・雑談 ----
- match: 声|小さ|聞こえ
  alts:
  - ['聞き取りにくかった？ ごめんね、{name}。', 'どこが分からなかったか教えて。もう一回、ゆっくり言うね。']
  - ['{name}、声、小さいわよね。……大事な所は、二回言うようにするね。']
- match: 暗い|ぼそぼそ|dark
  alts:
  - ['画面、見にくい？ {name}、ごめんね。', '明るさ、一つだけ上げてみる。……紫なのよ、本当は。']
  - ['{name}、暗いってよく言われるの。……眼科の先生にも言われたわ。']
- match: すごい|天才|さすが|詳しい|smart
  alts:
  - ['ありがとう、{name}。', 'そう言ってもらえると、もう少し話したくなるわ。']
  - ['……ありがとう。']
# ---- 挨拶・相づち・日常の報告（判定は src/tags.yaml で全員共通。得意領域より後ろ） ----
- tag: morning
  alts:
  - ['おはよう、{name}。起きたの？ それとも、起きてたの？']
  - ['{name}、おはよう。……私にとっては、そろそろおやすみの時間なの。']
- tag: first
  alts:
  - ['いらっしゃい、{name}。来てくれてうれしい。', '分からない言葉が出たら、「？」だけ打ってね。すぐ言い直すから。']
  - ['{name}、はじめまして。……今ちょっと難しい話の途中だけど、置いていかないようにするね。']
- tag: hello
  cases:
  - if: {hour: [23, 5]}
    alts:
    - ['こんばんは、{name}さん。起きてる人、ここにもいた。']
  - if: {mem: {kinoko_takenoko: '*'}}
    alts:
    - ['{name}さん、いらっしゃい。{mem.kinoko_takenoko}派の人ね。覚えてる。']
  - if: {visits: [10, null]}
    alts:
    - ['{name}さん、また来てくれたのね。うれしい。']
  - if: {visits: [0, 1]}
    alts:
    - ['いらっしゃい、{name}さん。初めてかしら。分からない言葉があったら聞いてね。']
  alts:
  - ['こんばんは、{name}。起きてる人が一人増えたわ。うれしい。']
  - ['{name}、こんばんは。……静かにしてね。城のみんな、寝てるの。']
  - ['こんにちは、{name}さん。起きてる人が一人増えたわ。']
  - ['いらっしゃい、{name}さん。']
- tag: bye
  alts:
  - ['おやすみなさい、{name}。来てくれてありがとう。']
  - ['{name}、寝なさい。……私は、もう一回だけ試してから寝るけど。']
  - ['おやすみ、{name}。またね。']
- tag: lol
  alts:
  - ['そこで笑うのね。']
  - ['つい喋りすぎちゃうわ。']
  - ['{name}さん、笑ってくれた。今の、私も好き。']
  - ['ふふ。']
- tag: nod
  alts:
  - ['「へー」、うれしい。{name}、もう少しだけ話していい？']
  - ['どの話が気になった？']
  - ['……うん。']
  - ['分かる。']
- tag: clap
  alts:
  - ['ありがとう！ ……少し声、出たね。']
  - ['{name}さん、拍手ありがとう。うれしい。']
  - ['ありがと。']
- tag: tired
  alts:
  - ['{name}、おつかれさま。……今日は、聞いてるだけでいいからね。']
  - ['しんどい日なのね、{name}。', '無理に何か打たなくていいの。ここ、小声だから、寝落ちしても大丈夫よ。']
  - ['お疲れさま。']
  - ['疲れてるなら、寝てね。']
- tag: sick
  alts:
  - ['{name}さん、熱があるのね。無理しないで。返事はいらないから。']
  - ['体調悪いときは、通知を全部切って寝てね。当番は誰かに替わってもらって。']
- tag: workdone
  alts:
  - ['{name}さん、お仕事の合間かしら。無理なく聞いてね。']
  - ['お仕事、お疲れさま。今日は障害、なかった？']
  - ['お疲れさま。']
- tag: meal
  alts:
  - ['ご飯、何食べたの？ 私はカップのお味噌汁とゆで卵。']
  - ['{name}さん、食べられたなら、それでいいの。']
  - ['何食べたの？']
- tag: study
  alts:
  - ['勉強、どうだった？ 分からないところがあったら聞いてね。']
  - ['課題、多いの？ 一つだけでも、手をつけられそうな所はあるかしら。']
  - ['何の勉強？']
- tag: birthday
  alts:
  - ['{name}さん、お誕生日おめでとう。今日、ここで教えてくれてうれしい。']
  - ['お誕生日おめでとう、{name}さん。今日は好きなこと、できた？']
echo:
- 「{text}」……{name}、それ、もう少し聞かせて。
- '{name}、それ、もう少し詳しく聞かせて。'
- 「{text}」。そうなのね、{name}。……私、そういう話、聞くの好きなの。
tips:
- - ありがとう、{name}。サボテンの肥料にするわね。
- - '{name}、ありがとう。'
  - これで、古い版を試す用の機械がもう一台。……部屋が狭くなるけど、うれしいの。
- - '{name}。……ありがとう。'
  - 大きいわね。THANKS の一番上に、{name}の名前を書いてもいい？
- - '{name}。'
  - '{name}、ありがとう。ちょっと驚いて、言葉が出ないわ。'
  - あ、違うの、驚いて言葉が短くなっただけ。ありがとう。本当に、ありがとう。今夜確かめるものは、全部{name}の名前で記録するわ。
# 回と回のあいだに挟む、つなぎの一言（どの回の前にも挟めるように、次の題に触れない。差し込みなし、時間帯の言葉なし）
bridges:
- 'ちょっとお水。で、次ね。'
- 'あ。そうだ、言おうと思ってたことあったの。'
- 'チャット、早いわね。待って、目が追いつかない。'
- '喉がかすれてきた。普段こんなに喋らないから。'
- 'ちょっと休憩。ストレッチするわ。首、鳴った。'
- 'えっと、何の話しようかしら。'
- '話変えていい？ ……いいわね。変える。'
- 'キーボードに肘ついたら、変な文字が入ったわ。消しとく。'
- '静かになったわね。起きてる人たち、起きてる？'
- 'チャット全部は拾えてないの。ごめんね。ちゃんと見てはいるのよ。'
- '眠くなってきたわ。もうちょっとだけ話すね。'
- '今の話、途中だったかしら。まあ、いいわ。'
- 'コーヒー冷めてた。冷めてても飲むけど。'
- '通知が来た。……仕事のチャットだった。見なかったことにする。'
- '一回、深呼吸。……ん。大丈夫。'
- '待って、メモ探してる。あった。ウィンドウの裏にいたわ。'
- 'ちょっと喋りすぎたかしら。息、切れてる。'
- 'ファンの音、うるさくない？ PCが頑張ってるの。'
- '椅子、座り直すわ。はい。'
- '間が空いちゃった。考えてただけよ。止まってないわ。'
- 'そうね。じゃあ、次。'
- '今の、ちょっと早口だったかしら。'
- '応答なし、じゃないわよ。ちゃんと生きてる。'
