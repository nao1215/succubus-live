# ---- 深い言葉（ノクスの好きな話。受け止めてから、一言） ----
- match: 優先度逆転|priority inversion|優先度継承|priority inheritance|Pathfinder|パスファインダー
  alts:
  - ['{name}、その話、大好きなの。', '本人の Reeves さんの返信、読んだ？ 最初に広まった話と、けっこう違うのよ。']
  - ['優先度の話ね、{name}。……あなたは、待たされたときだけ助ける派？ 最初から優先にしておく派？', '答えによっては、朝まで話すわよ。']
- match: mutex|ミューテックス|(?<!ブ)ロック|デッドロック|deadlock|futex
  alts:
  - ['鍵の話ね、{name}。', '「使用中」の札を持ったまま、よそを待たないでね。……私、先週それを通して日曜の朝を止めたの。']
  - ['{name}、その鍵、誰が待ってるか全部言える？', '言えなかったら、一緒に書き出しましょう。私、そういうの好きなの。']
- match: 割り込み|interrupt|\bISR\b|IRQ
  alts:
  - ["割り込みの話？ {name}、私の自作 OS、書き直してる版が時計の割り込みで落ちてるの。趣味で九年。……仲間ね。"]
  - ["{name}、割り込みの中では、短く済ませてね。使っていい道具も限られるの。", "私が固めたのは割り込みじゃなくて、シグナルの係で printf した方。形は似てるけど、決まりは別なの。"]
- match: カーネル|kernel|Linux|リーナス|Torvalds|PREEMPT_RT
  alts:
  - ['カーネルの話？ うれしい、{name}。', 'どの版の話か、先に教えて。版で答えが変わるの。']
  - ['{name}、PREEMPT_RT が本流に入ったの、6.12 なのよ。', '二十年くらい外で育って、やっと。……ちょっと泣いたわ。']
- match: RTOS|VxWorks|vxWorks|FreeRTOS|Zephyr|QNX
  alts:
  - ['{name}、RTOS の人？ うれしい。', '平均じゃなくて、一番遅い場合の話ができる人、好きなの。']
  - ["VxWorks は火星に行ったのよ、{name}。……行った先で、何度も再起動したけど。地上の双子で原因を追って、直したの。"]
- match: シグナル|signal|SIGTERM|SIGKILL|EINTR|ゾンビ|zombie|PID ?1|graceful
  alts:
  - ['{name}、その話、私に刺さるの。', '私のサービス、二年間「止まって」が届いてなかったの。……記録の「閉めます」、0件だった。']
  - ["止まり方の話ね、{name}。", "Dockerfile、シェルの形で書いてない？ 書いてると、伝言役が伝言しないことがあるの。……一回、止める試験をしてみて。"]
  - ["{name}、SIGKILL は受け止められないの。普通の止め方なら猶予があるから、何秒か確かめてね。", "でも、いきなり強制終了されても困らない作りも要るの。"]
- match: Docker|docker|コンテナ|container|Kubernetes|k8s|kubectl
  alts:
  - ['コンテナの話ね、{name}。……箱の中で最初に起きた子には、特別な役目があるの。']
  - ["{name}、止めるとき、猶予の間に片付け終わってる？", "Kubernetes の既定は三十秒、Docker の Linux のコンテナは十秒。確かめたことないなら、明日、一回止めてみて。……記録が無いだけじゃ、分からないから。"]
