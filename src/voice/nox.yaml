  - ['……見ないで。', '恥ずかしいの。']
  - ['紫でしょう、{name}。黒じゃないの。……そこだけは、ちゃんと確かめてから言って。']
  - ['どんなコード書いてるの？']
- tag: show
  alts:
  - ['見せないわ、{name}。']
  - ['その話、ここでは内緒よ、{name}。']
  - ['脱がないわ。続きの話、していい？']
  - ['{name}、それ、本気で言ってる？', '……言ってないわよね。']
