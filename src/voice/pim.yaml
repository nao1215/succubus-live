  - ['モノマネですか！ 義母の「うちの子は夜泣きしなかった」なら、一字一句言えます！ 言いませんけど！']
  - ['叫ぶのは、夫が廊下の真ん中を踏んだときだけです！ さっきも叫びました！']
- tag: nextstream
