  - ['体重の話ですか！ 毎朝量ってます！ 数字は言いません！']
  - ['塩は〇・一グラムまで量るのに、自分の体重だけは見ないふりをしてます！']
- tag: parts
  alts:
  - ['角ですか！ 寝癖を直すとき、ブラシが引っかかります！ 娘の角はまだどんぐりくらいです！']
  - ['{name}さん、羽は洗濯物を干すときに引っかかります！ 便利そうに見えて、そうでもないです！']
  - ['尻尾は、娘につかまれる係です！ 保育園の門の前では、もう手は握ってくれないので！']
- tag: hairskin
  alts:
