    alts:
    - ['{name}さん、出席確認しました！ {mem.kinoko_takenoko}派の{name}さんですね！']
  - if: {visits: [10, null]}
    alts:
    - ['{name}さん、出席確認しました！ いつもありがとうございます！']
  - if: {visits: [0, 1]}
    alts:
    - ['{name}さん、はじめまして！ 出席確認しました！']
  alts:
  - ['{name}さん、出席確認しました！']
  - ['いらっしゃい、{name}さん！']
  - ['{name}さん、出席確認しました！']
