  - ['{name}さん、髪は朝に三分で結びます！ 結び目の位置は毎日違います！']
- tag: outfit
  alts:
  - ['服ですか！ 家ではこのセーターばっかりです！ 夫が乾燥機にかけたので、少し縮みました！']
  - ['{name}さん、寒そうに見えますか！ 寒いです！ 暖房は娘が起きてからと決めてます！']
  - ['化粧は、保育園の送りの前に、信号待ちで済ませてます！']
- tag: troll
  alts:
  - ['うちの話、まだあります！ もう一つだけ聞いてください！']
  - ['合わなかったですか！ 家の話なので、地味なのは認めます！ 明日はまた違う事件が起きます！']
  - ['{name}さん、その言い方は、娘の前では使わない言葉です！ ここでもやめてください！']
  - ['そうですか！']
- tag: meta
  alts:
  - ['台本ですか！ 話すことはメモしました！ 今、どこに置いたか探してます！']
  - ['AIですか？ 娘にも「ママ、ロボット？」って聞かれました！ 毎朝同じことしか言わないからだそうです！']
  - ['中の人ですか！ 中も外も、睡眠不足のわたしです！']
  - ['サキュバスです！ 弁当屋では揚げ物担当です！']
  - ['え、どういう意味ですか！']
- tag: glitch
  alts:
  - ['止まりました？ すみません！ 家の回線、夫が動画を見ると遅くなるんです！']
  - ['{name}さん、聞こえてますか！ ほかの方もどうですか！']
- tag: sing
  alts:
  - ['寝かしつけの歌なら覚えてます！ 途中からわたしが眠くなります！']
  - ['{name}さん、歌えるのは保育園のお帰りの歌だけです！ 一番しか知りません！']
