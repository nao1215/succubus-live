# ピムの声：挨拶（覚えの段ごと）、自由コメントへの返し、投げ銭の読み上げ。全時間帯で共通。
# 2026-10-27 第四版：担当は家庭持ちの生活ネタ（子育て・家事・夫婦・家計・町中華）。英語・言語の話題への反応は外した（前の版は src/old/voice-v4/pim.yaml）。
# 2026-10-27 v10：Codex 二回目のレビューで直し（前の版は src/old/voice-v9/pim.yaml）。下ネタへの返しを家事の言葉への言い換えから、断る・照れる・流す・聞き返すに分けた。safe_refusal を足し、minor は remember で覚える。離席の芝居と後付けの「……」を bridges から外した。
# keywords の順：子どもの言葉（自前）→ 子ども・未成年（tag:）→ 下ネタ → いじり・荒らし・褒め・要望・メタ（どれも tag: で src/tags.yaml の共通の判定）→ 生活の話題 → 挨拶・雑談。
greet:
- null
- - '{name}さん、出席確認しました！'
- - '{name}さん、また来てくれましたね。いらっしゃいませ。今日も家の話です。'
- - '{name}さん、出席です！ おかえりなさい！'
  - 最近よく来てくれますね！ うれしいです！
- - '{name}さん！ 出席確認……しなくても分かります！'
  - ……訂正します！ 確認はします！ {name}さん、出席です！ いつもありがとうございます！
# 遊ぶ人が書いた言葉の入る台詞（「{text}」など）で、字幕はその台詞のまま、声はこの一言（gozen の voice_fallback。2026-10-28）
fallback: '気になります！ もう少し教えてください！'
first:
- '{name}さん、はじめまして！ 出席確認しました！ 名簿のいちばん新しい行に書きました！'
- いらっしゃいませ、{name}さん！ ここは、家の話をする配信です！ 子どもと、夫と、家計と、町中華です！ 分からない言葉が出たら聞いてください！
streak:
- '{name}さん、{days}日連続の出席です！ 皆勤賞の規則を、今から作ります！'
- '{days}日続けて来てくれてます、{name}さん！ うれしいです！ 無理はしないでくださいね！'
stayed:
- '{name}さん、最後まで聞いてくれてありがとうございます！ 名簿に花丸を付けます！'
- '{name}さん、最後までいてくれました！ ありがとうございます！ お茶でも飲んで休んでください！'
# 未成年と申告した視聴者・子どもが出る回（family: true）で、下ネタのコメントに返す性的でない断り（tools/import_stream.py が lewd の組の反応すべての前に足す）
safe_refusal:
- ['{name}さん、そのお願いはお受けしません。普通にお話ししましょう。']
- ['その話はしません。{name}さん、今日は何してました？']
- ['{name}さん、その話はここではしないです。ほかのこと、聞かせてください。']
keywords:
# ---- 子どもの言葉を含むコメントは、必ず先にここで受ける（下ネタの返しが子どもの話に付かないように） ----
- match: '子ども|子供|こども|娘|息子|育児|子育て|ミミ(?!ズ)|イヤイヤ期|赤ちゃん|赤ん坊|乳児|幼児|\btoddlers?\b|\bkids?\b|\bbaby\b|parenting'
  alts:
  - ['子育ての話ですね、{name}さん！ うちのミミは今、規則帳の矛盾を見つける係です！ 第五条と第九条がけんかしてるそうです！']
  - ['子育てって、決めても、そのとおりにはいきませんね！']
  - ['{name}さんのお家の話、聞かせてください！ 副担任の皆さんの話が、いちばん参考になります！']
- match: '寝かしつけ|夜泣き|昼寝|添い寝|ねんトレ|寝ない|\bsleep training'
  alts:
  - ['寝かしつけ、長かったです！']
  - ['うちは、いつの間にか寝るようになってました！']
  - ['寝ない日って、時計を何度も見ちゃいますよね。']
- match: '授乳|母乳|ミルク|粉ミルク'
  alts:
  - ['授乳、お疲れさまです、{name}さん。少し座れましたか？']
  - ['{name}さん、片手で打ってますか？ 返事はゆっくりで大丈夫です。']
  - ['夜中のミルク、外が明るくなってくると、ちょっと泣きたくなりますよね。']
- match: '離乳食|\bweaning'
  alts:
  - ['{name}さん、うちは新しい食べ物を一日一つ、平日の午前にしてました！ 夫は土曜に三つ同時にあげました！ キウイでした！']
  - ['離乳食、作っても食べない日ありますよね。うちは床が一番食べてました！']
- match: 'はちみつ|ハチミツ|蜂蜜'
  alts:
  - ['はちみつは一歳になってからです、{name}さん。保健センターの紙にも書いてあります。']
  - ['{name}さん、義母に白湯にはちみつを入れられそうになったことがあります。止めました。気まずかったです。']
- match: 'おむつ|オムツ|\bdiapers?\b'
  alts:
  - ['{name}さん、うちの園、おむつ一枚ずつに名前なんです！ スタンプがにじむと「ミ三」になります！']
  - ['おむつ、サイズが変わる時期に買い置きが余りますよね！ うちは一袋、まだ押し入れにあります！']
- match: '保育園|幼稚園|保活|連絡帳|お迎え|送り迎え|役員|PTA|保護者会|運動会|お遊戯会|名前付け|お名前'
  alts:
  - ['{name}さん、役員はじゃんけんで決まりました！ 最初はグーのグーを、そのまま出しました！ 一人負けです！ 優しい拍手をもらいました！']
  - ['連絡帳は、二回読み直してから出します、{name}さん！ 一回、夫の愚痴を書いて出したので！']
  - ['{name}さん、名前は右上、ひらがな、黒です！ 夫は体操服の背中にカタカナで書きました！ ユニフォームです！']
  - ['園のこと、いろいろありますよね！ うちは役員の引き継ぎを十二ページ書いて、長すぎて止められました！']
- match: 'お熱|発熱|熱が出|病児保育|呼び出し|お迎え要請'
  alts:
  - ['{name}さん、保育園の電話は、だいたい揚げ物の最中に鳴ります！ うちの園は37.5度です！']
  - ['お熱の日は大変ですね、{name}さん！ 連絡先の一番上、夫にしてみてください！ 二番目に回ってくるだけかもですけど！']
- match: '言い間違い|とうもころし|えべれーたー|成長|大きくなっ|手を離|反抗期'
  alts:
  - ['{name}さん、うちの「とうもころし」は、八月三日に引退しました！ 引退試合もなしにです！ 記録しといて、よかったです！']
  - ['成長は寂しいです、{name}さん！ でも規則帳に書きました！ 「寂しくなったら、先輩に言う」！ 夫には読ませません！']
- match: '児童手当|無償化|副食費|給食費|学資|教育費'
  alts:
  - ['{name}さん、児童手当は2024年の十月から、偶数月の年六回です！ 家計簿の規則の書き直しに、二時間かかりました！']
  - ['全部無料と思っていたら、おかず代の請求は来ました！']
- match: '育休|産休|ワンオペ|子持ち様|時短勤務'
  alts:
  - ['ワンオペの日は、コメント欄の皆さんが副担任です、{name}さん！ よろしくお願いします！']
  - ['{name}さん、子持ち様って言われる前に、自分の心の中で三回くらい言ってます！ 悪いのは、シフト表の空いてる欄です！']
  - ['{name}さん、無理しないでください。聞くだけなら、いつでも聞きます。ミュートで聞いてても、出席扱いです。']
# ---- 子どもの話・未成年の視聴者（下ネタより先に判定する。判定は src/tags.yaml） ----
- tag: kids
  alts:
  - ['{name}さん、お子さんの話ですね！ 聞かせてください！ うちも毎日いろいろあります！']
  - ['{name}さんのお家も、毎日大変ですよね！ うちは今朝、靴下が片方ありませんでした！']
- tag: minor
  remember: {minor: 1}
  alts:
  - ['{name}さん、学生さんですね！ 出席確認しました！ 宿題が終わってから見てくださいね！']
  - ['{name}さん、若い！ わたしが学生のころは、教科書を前の日にそろえられませんでした！']
  - ['{name}さん、学生さんは寝る時間を削らないでください！ わたしは削ってます！ 悪い見本です！']
# ---- 下ネタ（判定は src/tags.yaml で全員共通）。短く断る・照れる・流して続ける・聞き返す。家事の言葉に言い換えるのは一部だけ。子どもの話は出さない。条件つきの誘いは書かない ----
- tag: body
  alts:
  - ['その話より、今夜のご飯を決めたいです！']
  - ['そこは見ないでください！ 顔を見てください、顔を！']
  - ['{name}さん、その話をするなら、夫が曜日をまちがえた話をします！ 水曜にお茶を二つ持ってきたんです！']
  - ['油がはねた跡です。痛いんですよ！']
  - ['{name}さん、急に何ですか！ 照れるので、やめてください。']
- tag: show
  alts:
  - ['見せません！']
  - ['{name}さん、それ、本気で言ってます？']
  - ['見せられるのは、冷蔵庫の献立表までです、{name}さん！ 夫も読まない献立表です！']
  - ['脱ぎません！ そのお願いはおしまいです。']
- tag: sex
  alts:
  - ['わたしは既婚です！ お相手はしません！']
  - ['{name}さん、だめです。普通にお話ししましょう。']
  - ['今のは、聞かなかったことにします！']
  - ['{name}さん、そういうのは受け付けてません！ 次のコメント読みます！']
  - ['{name}さん、そういうのは、情緒のある人に言ってください！ わたしはお茶を飲みながら献立を考える妻です！']
- tag: drain
  alts:
  - ['精気のお仕事の話は、配信の外です！']
  - ['吸うのも搾るのも、今日はお休みです！']
  - ['吸いません！ うちは、そういうお店じゃないです！']
  - ['そういう注文は受けてません！']
- tag: underwear
  alts:
  - ['{name}さん、聞かないでください！ 顔が熱いです。']
  - ['パンツの色は、言いません！']
  - ['{name}さん、それ、なんで知りたいんですか？']
  - ['下着の話はここまで！']
- tag: virgin
  alts:
  - ['{name}さん、わたしは既婚です！ 結婚記念日には、毎年同じ町中華に行きます！ 天塩2です！']
  - ['その話は内緒です、{name}さん！']
  - ['その質問には答えません！']
- tag: marry
  alts:
  - ['{name}さん、結婚はしてます！ 申込書は受け付けません！ 夫は門番です！ 門で止められます！']
  - ['{name}さん、ごめんなさい。夫がいます！']
  - ['{name}さん、結婚すると、靴下が丸まったまま干されます！ それでもいいですか！ わたしは、まあ、いいです！']
  - ['ありがとうございます、{name}さん！ 既婚なので、出席点だけお渡しします！']
- tag: kiss
  alts:
  - ['キス、しません！']
  - ['今、返事しそうになりました！ しませんよ！']
  - ['{name}さん、急に言われると照れます。しませんけど！']
  - ['キスのお申し込みは、お受けしません、{name}さん！ 火曜と金曜は、夫とほうじ茶の日です！']
- tag: horny
  alts:
  - ['{name}さん、ムラムラしたら、洗濯物を畳んでください！ 山が一つ消えるころには落ち着きます！']
  - ['{name}さん、お水飲んで、ちょっと休んでください。']
  - ['{name}さん、今日は何曜日ですか！ 火曜と金曜以外は、ニンニクも禁止ではありません！ 関係ないです！']
  - ['はい、次の話いきます！']
- tag: lewd
  alts:
  - ['{name}さん、下ネタは受け付けてません！ 代わりに、ほうじ茶の淹れ方なら話せます！']
  - ['{name}さん、それには答えません。']
  - ['{name}さん、今の、聞こえなかったことにします！']
  - ['えっ。えっと、その話はしません！']
- tag: genital
  alts:
  - ['{name}さん、その言葉は、規則帳では「伏せ字」の章に入ります！ 章ごと閉じます！']
  - ['{name}さん、今、唐揚げを揚げてるつもりで聞き流しました！ ジュワーです！']
  - ['その言葉は読みません！']
  - ['{name}さん、それ、どういうつもりで書きました？']
# ---- 年齢・見た目のいじり、荒らし、メタ、要望、ほかの配信者、褒め（判定は src/tags.yaml で全員共通） ----
- tag: old
  alts:
  - ['おばさんで合ってます！ でも、ここではピムさんでお願いします！ 保育園ではずっとミミちゃんのママなので！']
  - ['{name}さん？ その呼び方、覚えましたからね！ 名前の方も覚えてください！']
  - ['規則が多すぎるのは認めます！ 娘にも言われました！ 減らす相談をしたら、また一条増えました！']
  - ['年のことは、夫にも言われたことないです！ 言われたら、たぶん正座してもらいます！']
  - ['はい、聞こえてます！']
- tag: age
  alts:
  - ['年齢は内緒です、{name}さん！ 雑費の中身と同じくらい内緒です！']
  - ['ガラケーを使っていた世代です！ 年齢はそこまでです！']
  - ['何歳かは言いません！ 保育園の書類には、毎年ちゃんと書いてます！']
  - ['内緒です！']
- tag: ugly
  alts:
  - ['{name}さん、うちの娘はこの顔が好きだそうです！ わたしはそっちを信じます！']
  - ['今日は唐揚げの日だったので、髪がまだ油の匂いです！ 顔の話はそのあとにしてください！']
- tag: weight
