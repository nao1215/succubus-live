# ---- 挨拶・相づち・日常の報告（判定は src/tags.yaml で全員共通。得意領域より後ろ） ----
- tag: morning
  alts:
  - ['おはようございます、{name}様。朝の一曲は、もうお決まりでございますか。']
  - ['{name}様、おはようございます。主様はまだお休みでございます。お静かにお願いいたします。']
- tag: first
  alts:
  - ['ようこそお越しくださいました、{name}様。エラと申します。分からない言葉が出たら、遠慮なく「それ何？」とお書きくださいまし。']
  - ['{name}様、初めての方は大歓迎でございます。楽章の間で拍手なさっても、当方は怒りません。']
- tag: hello
  cases:
  - if: {hour: [23, 5]}
    alts:
    - ['{name}様、夜更かしでございますね。静かにまいりましょう。']
  - if: {mem: {kinoko_takenoko: '*'}}
    alts:
    - ['ごきげんよう、{name}様。{mem.kinoko_takenoko}派の方でございましたね。']
  - if: {visits: [10, null]}
    alts:
    - ['{name}様、お待ちしておりました。']
  - if: {visits: [0, 1]}
    alts:
    - ['ようこそお越しくださいました、{name}様。']
  alts:
  - ['ごきげんよう、{name}様。今日の紅茶は、聴く盤に合わせて淹れております。']
  - ['{name}様、ようこそ。お茶をお持ちでしたら、ご一緒に。']
  - ['ごきげんよう、{name}様。']
- tag: bye
  alts:
  - ['おやすみなさいませ、{name}様。寝る前に聴く曲は、葬送行進曲以外でお選びくださいまし。']
  - ['{name}様、おやすみなさいませ。ハイドン様の『驚愕』だけは、寝る前にはお勧めいたしません。途中で、大きな音がいたしますので。']
- tag: lol
  alts:
  - ['{name}様が笑ってくださいました。当方の敬語訳にも、いずれ笑っていただきたいものです。']
  - ['そこでお笑いになりますか、{name}様。当方も、少し笑ってしまいました。']
  - ['笑っていただけました。']
- tag: nod
  alts:
  - ['左様でございます、{name}様。分かってくださる方がいると、つい話が長くなります。']
  - ['{name}様、お分かりいただけますか。うれしゅうございます。']
  - ['左様でございますね。']
  - ['ええ、まことに。']
