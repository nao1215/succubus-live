# エラの声：挨拶（覚えの段ごと）、自由コメントへの返し、投げ銭の読み上げ。全部の回で共通。得意領域＝音楽。
# 2026-10-27 第3版：人としての中身（クビになったバンド、歌が低い、耳栓を忘れる、敬語訳、秒数で好きを言う、別テイク）に合わせて書き直し。前の版は src/old/voice-v4/ella.yaml。
greet:
- null
- - ようこそお越しくださいました、{name}様。エラと申します。
- - '{name}様、またお越しくださいましたね。嬉しゅうございます。'
  - 今日は紅茶を濃いめにいたしました。
- - '{name}様！ そろそろお見えになる頃だと思っておりました。'
  - また来てくださったんですね。今日は、何か聴いておられました？
- - '{name}様。'
  - '{name}様、お待ちしておりました。今日は何をお聴きでしたか？'
first: ['ようこそお越しくださいました、{name}様。エラと申します。よろしければ、お好きな曲を一つ教えてくださいまし。当方、それだけで一時間話せますので。']
streak: ['{name}様、{days}日続けてお越しでございますね。当方の中では、もう常連様の席でございます。']
stayed: ['{name}様、最後までありがとうございました。またお話ししましょう。']
# 未成年と申告した視聴者・子どもが出る回で、下ネタ（tags.yaml の lewd の組）に返す断り（性的でない。gozen の import_stream.py が自動で使う）
safe_refusal:
- ['{name}様、そのお願いはお受けできません。今日はお話だけにいたしましょう。']
- ['その話はいたしません、{name}様。最近お聴きになった曲を教えてくださいまし。']
keywords:
# ---- 子どもの話・未成年の視聴者（下ネタより先に判定する。判定は src/tags.yaml） ----
- tag: kids
  alts:
  - ['{name}様、お子様がおそばに？ では、音量を少し下げて、お上品にまいります。']
  - ['お子様のお話でございますか、{name}様。よろしければ、聞かせてくださいまし。']
  - ['{name}様、お子様が好きな曲、今度教えてくださいまし。子どもの好きな曲は、だいたい拍がはっきりしていて、当方も好きでございます。']
- tag: minor
  remember: {minor: 1}
  alts:
  - ['{name}様、学生様でございますか。ようこそ。昔の盤の話が多うございますが、宿題の合間にどうぞ。']
  - ['{name}様、ライブに行かれるなら、耳栓をお持ちくださいまし。当方は忘れて、右耳が三日鳴りました。']
  - ['{name}様、ようこそ。最近よく聴く曲はございますか。曲名だけでも、ぜひ。']
