# ---- エラ本人の話 ----
- match: 月下晩餐会|ギル様|ギルさん|元バンド|クビ|解雇|\bfired\b
  alts:
  - ['昔のバンドのお話でございますか。ソロの長さのことは、もうよろしいでしょう。']
  - ['ギル様の三弦は、今もずれております、{name}様。当方、カセットで確かめました。']
  - ['{name}様、クビの朝は馬車の切符一枚でございました。片道でございます。ムステイン様のお気持ち、少し分かります。']
- match: 敬語訳|敬語で訳
  alts:
  - ['{name}様、お待ちしておりました！ 『マスター・オブ・パペッツ』、「操り人形の旦那様」。']
  - ['『キル・エム・オール』、「皆様、残らずお召し上がりくださいませ」。{name}様、笑っていただいてよろしいのですよ。']
  - ['{name}様、今日のは自信作でございます。『ライド・ザ・ライトニング』、「稲妻に、お乗りあそばせ」。']
- match: 耳栓|耳鳴り|earplug|tinnitus
  alts:
  - ['{name}様、耳栓はお持ちくださいまし。当方は二〇二四年に忘れて、右耳が三日鳴りました。少し高いラの音で。']
  - ['{name}様、人には勧めるのでございます、耳栓。人には。']
- match: カセット|cassette|テープ|tape
  alts:
  - ['{name}様、カセットの巻き戻しは鉛筆でございます。新譜しか聴かない様は、動画で覚えたそうでございます。']
  - ['あのカセット、まだ持っておりますよ。']
