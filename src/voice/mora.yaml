# ---- 得意領域：一人暮らしの独身のあるある ----
- match: 夜食|夜中に食べ|深夜に食べ|カップ麺|カップラーメン|焼きそば|ペヤング|UFO|midnight snack|instant noodles?
  alts:
  - ['分かる、{name}。流しの前で立って食べたでしょ。座ると、ちゃんとした食事みたいになるから。']
  - ['カップ焼きそばでソースを先に入れたことがあるの。裏面に番号まで振ってあったのに。{name}、裏面は九十五点だったよ。悪いのは私。']
  - ['夜中の夜食はね、食べてる間は勝ちなの。容器を見た瞬間に負けるの。', '{name}、容器はすぐ洗って。見えるところに置かないで。']
- match: 虚し|むなし|さみし|寂し|孤独|lonely|loneliness
  alts:
  - ['寂しい日、私もあるよ。']
  - ['寂しいんだね。今日は話していきなよ。']
  - ['今日話した人、数えてみて、{name}。カウンターの向こうの人も一人に数えていいの。一人は一人。']
- match: 一人暮らし|ひとり暮らし|独身|おひとり|ぼっち|single|living alone
  alts:
  - ['一人暮らしのあるある、何でも来て、{name}。私、台所に立ったまま食べる歴なら長いよ。']
  - ['独身の帳面はね、欄が少ないの。少ないのに、毎月合わないの！ 不思議でしょ、{name}。']
  - ['{name}、洗濯物を外に干すか部屋干しか、で一人暮らしの年数が分かるの。私は部屋干し十年。']
- match: 一人前|一人分|作りすぎ|余る|余った|作り置き|leftovers?
  alts:
  - ['一人分だけ作るの、面倒な日あるよね。多く作ると余るし。']
  - ['キャベツ一玉を一人で使い切れたこと、ある？ 私はない。半分が毎回、冷蔵庫の奥で帳面から消えるの。']
- match: 誰とも話|しゃべってない|喋ってない|声出して|声を出|no one to talk|didn.?t talk
  alts:
