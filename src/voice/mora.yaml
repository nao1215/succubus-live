# モーラの声：挨拶（覚えの段ごと）、自由コメントへの返し、投げ銭の読み上げ。全部の回で共通。
# 2026-10-27 担当替え：ブロックチェーン → 人生のあるある（一人暮らしの独身の雑談）。ブロックチェーン版は src/old/voice-v4/mora.yaml。
# 人としての中身（bible の person）を出す。根に持つ、暗算が苦手、インクに弱い、暗証番号を自分の暗号で書いて忘れる、
# 訂正されたら礼を言ってから相手の小さな間違いを探す、好きな相手には遠回しに様子を聞く、夜中の夜食で虚しくなる。
# あるあるには、まず乗ってから、一個だけ細かいディテールで上を行く。説教しない。家族・子育て・夫婦の話はピムの担当なので深入りしない。
# 2026-10-27 Codex の二回目のレビューで直した（前の版は src/old/voice-v9/mora.yaml）。safe_refusal と minor の remember を足した。
# 下ネタは帳面・判子などに置き換える返しを減らし、短く断る・ツッコむ・少し傷つく・流して続ける・聞き返す、を混ぜた。言い直させる・膨らませる返しは置かない。
# 入力にない記憶を作る挨拶、「AIなら暗算できる」「台本があったら」の返し、離席の芝居、メモの「字が汚い」（字はきれいの設定と食い違う）を直した。
greet:
- null
- - '{name}、また来たね。'
- - '{name}。三回目でしょ。あ、指で数えてないよ。覚えてるの。'
  - 来る人のことは、ちゃんと覚えてるの。暗証番号は忘れるけど。
- - '{name}、また来てくれたんだ。'
  - 今日はどうだった？ 何もなかったなら、それでいい。来てくれて嬉しい。
- - '{name}の来る頃合い、もう分かるようになっちゃった。'
  - '{name}、来てくれてうれしいよ。今日はどうだった？'
first:
- いらっしゃい、{name}！ 普段の話をする枠だよ。役に立つ話は出ないけど、私がやらかした話ならいっぱい出る。
- '初めまして。ゆっくりしてって。'
streak:
- '{name}、{days}日続けて来てる。数えたのは帳面で、指じゃないからね。'
- '{days}日連続！ {name}の行だけ途切れてないの。リゼの行なんか三日で途切れたのに。'
stayed:
- '{name}、最後までありがとう。今日話した人の欄に、{name}も書いておくね。'
- '{name}、最後まで。お知らせの裏をみんなで読む会、席を一つ空けとくね。来なくてもいいけど。'
# 未成年と申告した視聴者・子どもが出る回で、下ネタ（tags.yaml の lewd の組）に返す性的でない断り。gozen の変換が先に返す。
safe_refusal:
- ['その話はしないよ。今日はどうだった？']
- ['{name}、その話はなし。普通に話そう。さっきの続き、聞く？']
keywords:
# ---- 子どもの話・未成年の視聴者（下ネタより先に判定する。判定は src/tags.yaml） ----
- tag: kids
  alts:
  - ['子どもの話ね、{name}。そこはピムの方が百倍詳しいよ。私は、友達の出産祝いの帳面なら付けてる。']
  - ['{name}、子どもが寝てる横で見てるの？ じゃあ、声を少し落とすね。']
  - ['友達の子、年賀状で見るたび大きくなってる。もうそんな年かって思うよ。']
- tag: minor
  remember: {minor: 1}  # 未成年と申告した視聴者。覚えたら会話の途中で解除しない（下ネタには safe_refusal を返す）
  alts:
  - ['{name}、学生さんなんだ。いらっしゃい。ここは役に立たない大人の話をする枠だから、気楽に見てって。']
  - ['{name}、若いね。私の話で「大人ってこうなんだ」って思わないでね。私が特別だらしないだけだから。']
  - ['学生さんか、{name}。宿題が先だよ。私、後回しの箱を持ってる人だから、強くは言えないけど。']
# ---- 下ネタへの反応 ----
# 未成年と申告した視聴者・子どもが出る回では、gozen の変換が上の safe_refusal を先に返す。
- tag: body
  alts:
  - ['{name}、どこ見てるかは分かるよ。']
  - ['そこ見ないで。顔はこっち。']
  - ['書記局の制服、胸のところだけ毎年きつかったの。局長が新しいのを経費で出さなかったせい。今も根に持ってる。']
  - ['{name}、そういうのは言わなくていいの。']
- tag: show
  alts:
  - ['見せないよ、{name}。']
  - ['いいよ。はい、今月の家計簿。夜食の欄まで見せた。これ以上は脱がない。']
  - ['見せません。今日、何食べた？']
  - ['{name}、急に何言ってるの。']
- tag: sex
  alts:
  - ['{name}、その申請は受け付けない。窓口が違うよ。どの窓口でもないけど。']
  - ['しないよ。そういう話は、ここではしないの。']
  - ['急にそれ？ ちょっと傷つくよ。今日は普通に話しに来たんだけどな。']
  - ['却下。で、今日はどうだったの？']
- tag: drain
  alts:
  - ['精気は書記局で、一滴単位で付けてた。昔の話。今はやってない。']
  - ['吸わないよ。お腹いっぱいなの。']
  - ['{name}、それ、本気で言ってる？ 言ってないよね。']
  - ['吸わないってば。']
- tag: underwear
  alts:
  - ['教えないよ、{name}。']
  - ['下着の話は、しない。洗濯物は部屋干し。それ以上は言わないよ。']
  - ['下着の話？ 聞かないで。']
  - ['{name}、それは「後で」の箱に入れた。開けないよ。']
- tag: virgin
  alts:
  - ['それは答えない。聞かれても困るよ。']
  - ['「初めて」の話なら、私の初めての有休は区役所で終わったよ、{name}。違う話？']
  - ['その話は内緒。']
  - ['{name}、それを聞いてくるの、母の「いい人いないの」と同じ路線だよ。終点が同じ。']
- tag: marry
  alts:
  - ['結婚？ まだ会って何回目？ 数えてないけど、早いよ。']
  - ['返事はまだ。待ってて。']
  - ['いいよ。そのかわり、合鍵は勝手に作らないで。作られると、私、三日口きかなくなるから。']
  - ['付き合う前に一個だけ聞かせて、{name}。四捨五入する人？ 切り捨てる人？ 大事なことなの。']
  - ['{name}、今のを母に聞かせたら、四十分の電話が一時間になる。やめて。']
- tag: kiss
  alts:
  - ['キス？ 急に言われても、困るよ。']
  - ['しないよ。画面越しだし。']
  - ['{name}、照れるからやめて。']
  - ['キスはなし。']
- tag: horny
  alts:
  - ['{name}、一回水を飲んで。']
  - ['興奮してる時は、ネットで買い物しないこと。夜中の「今だけ」は全部罠だよ、{name}。']
  - ['ここ、そういう枠じゃないよ。普通の話しよう。']
  - ['明日読み返したら恥ずかしいやつだよ。']
- tag: lewd
  alts:
  - ['{name}、今日はそっちに行きたい日なの？ 私は行かないけど。']
  - ['サキュバスの枠で変態って言われてもね。まあ、聞き流しとく。']
  - ['はいはい。で、さっきの話の続きなんだけど。']
  - ['そういうの、何回言っても返事は同じだよ。']
- tag: genital
  alts:
  - ['{name}、その単語は流すね。']
  - ['そういう言葉は、ここには書かないでね。']
  - ['見なかったことにする。']
  - ['やめて。ご飯食べてる人もいるんだから。']
