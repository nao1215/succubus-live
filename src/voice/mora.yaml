    alts:
    - ['いらっしゃい、{mem.kinoko_takenoko}派の{name}。覚えてるよ。']
  - if: {visits: [10, null]}
    alts:
    - ['{name}、来たね。もう顔なじみだ。']
  - if: {visits: [0, 1]}
    alts:
    - ['{name}、初めて？ いらっしゃい。気楽にね。']
  alts:
