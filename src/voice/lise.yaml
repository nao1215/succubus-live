# リゼの声：挨拶（覚えの段ごと）、自由コメントへの返し、投げ銭の読み上げ。全部の回で共通。
# 2026-10-27 作り直し（v4）。気だるく言い切る短文。チャットの言葉を一度繰り返してから返す。
# 2026-10-27 夜：得意領域をゲームだけに戻した。ブロックチェーンとセキュリティ一般の反応はノクスの voice に移した（前の版は src/old/voice-v6/lise.yaml）。
# ずる・増殖・ボットの話では声の温度が一段上がり、「入れる前に見せて」と止める。ずるの手口そのものは教えない。
# 下ネタには涼しく返す。短く断る・流して続ける・聞き返す・たまに照れる。ゲームの言葉に引きずり込むのは一部だけ。露骨な描写はしない。
# v9（2026-10-27）：Codex の二回目のレビューで直した。性的な含みの強い返し（寝てる間に終わる、初回は優しく）と、性的な話を増やす「もう一回言って」を外した。
# safe_refusal と minor の remember を足した。カラーの重なり方を CGB モードと昔のソフトで分けた。離席の芝居と後付けの「……」を減らした。前の版は src/old/voice-v9/lise.yaml。
greet:
- null
- - '{name}、また来たのね！ 続きから遊ぶ人ね。'
- - '{name}。あなた、毎日いるわね。'
  - ログインボーナスでも出したほうがいいかしら。出さないけど。
- - '{name}、来たわね。じゃあ始めましょうか。'
  - もう始まってたわね。あなたが来たから、今のがタイトル画面だったことにするわ。
- - '{name}。今日は、あなたが来るまで起きてたの。'
  - '寝てたけど、あなたの名前で起きたわ。'
# 遊ぶ人が書いた言葉の入る台詞（「{text}」など）で、字幕はその台詞のまま、声はこの一言（gozen の voice_fallback。2026-10-28）
fallback: 'うん、聞いてるわ。'
first: ['あら、初めての人！ {name}ね、いらっしゃい。座って聞いてて。分からないところは「それ何？」って書いて。何回でも答えるから。']
streak: ['{name}、{days}日続けて来てるわね。えっ、私が連続ログインの報酬を出す側なの？ 何がいい？ 何も出ないけど。']
stayed: ['{name}、最後までいたのね！ エンディングまで見た人には、本当は特別な一枚絵が出るのよ。今日は私の顔で我慢して。ありがとう。']
# 未成年と申告した視聴者（minor で覚える）・子どもが出る回（family: true）では、下ネタにこの断りを返す（tools/import_stream.py が lewd の組の前に足す）。
# 性的な代案や「大人になったら」のような条件付きの誘いは置かない。
safe_refusal:
- ['そのお願いは聞かないわ。ここで話していきなさい、{name}。']
- ['その話はしないわ。さっきのゲームの話、続けていい？']
- ['それは、答えなくていい話よ。{name}、今日は何して遊んでた？']
keywords:
# ---- 子どもの話・未成年の視聴者（下ネタより先に判定する。判定は src/tags.yaml） ----
- tag: kids
  alts:
  - ['{name}、お子さんの話ね。最近はどんなゲームが好きなのかしら。']
  - ['子どもと見てるなら、お行儀よくするわ。']
- tag: minor
  remember: {minor: 1}
  alts:
  - ['学生なのね、{name}。いらっしゃい。宿題の途中なら、忘れないうちに済ませておいで。']
  - ['{name}、若いのね。徹夜でゲームは、私みたいになるからやめておきなさい。']
  - ['学生さんは、ガチャにお金を入れないこと。それだけ約束して、{name}。']
# ---- 下ネタへの反応 ----
# 2026-10-27 v9：ゲームの言葉に言い換えて返す型（6人とも同じ考え方だった）を減らした。ゲームの言葉は一つの反応に多くて一つ。
# 短く断る、照れる、流して続ける、聞き返す、甘やかして寝かせる、を混ぜる。未成年と申告した人・子どもの回では、上の safe_refusal が先に返る。
