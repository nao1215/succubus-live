    alts:
    - ['{name}、また来たのね。座って。']
  - if: {visits: [0, 1]}
    alts:
    - ['いらっしゃい、{name}。初めてね。寝転がって聞いてて。']
  alts:
  - ['いらっしゃい、{name}。座って。立ってると疲れるわ。']
