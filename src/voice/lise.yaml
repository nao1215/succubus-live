# 深い言葉（ハード・バグ技・開発史）
- match: スプライト0|sprite ?0|sprite zero
  alts:
  - ['スプライト0ね、{name}。一日一回しか鳴らない時計よ。X=255では鳴らないの。']
  - ['{name}、0番を待ってぐるぐる回るコードは、来ないと永遠に待つのよ。', '待ち合わせに来ない人を待つ私みたいね。']
- match: OAM|スプライト|sprite
  alts:
  - ['{name}、横一列に八枚までよ！ 九枚目は、そこにいるのに描かれないの。九人目の会へようこそ。']
  - ['OAMは毎フレーム全部送り直すの。513サイクル。', '{name}、差分だけ送りたい気持ちは分かるわ。忘れっぽい子なのよ。']
  - ['使わない枠はYを$EF以上にして隠してね、{name}。0のままだと、左上にドクロが出るわ。経験者よ。']
- match: ちらつ|フリッカー|flicker
  alts:
