# モーラ 003（2026-10-27 夜 新規）。バイブルの案「熱が出た夜」と likes の stories（health_fever、home_fridge、bath_shower_tub、bath_phone、bath_after）から。
# 2026-10-27 Codex の二回目のレビューで直した（お風呂の温度の全員紹介と「心臓に悪い」の断定をやめ、本人の入り方の話に。話を忘れて戻る所を二つとも直した。チャットの割合）。直す前は src/old/episodes-v9/mora/003.yaml。
# 流れ：声がかすれてる → 先週の熱、ゼリーがなかった → 置き配の箱 → チャットの「熱のときお風呂入る？」からお風呂の入り方へ脇道 → 戻ってリゼの差し入れで締め。
# 出典は src/sources/mora/003.md。
title: 熱が出た夜、買い置きのゼリーがなかった
parts:
- title: 挨拶と、かすれた声
  beats:
  - say: こんばんは。始めるね。
  - chat: [夜勤明けの人, こんばんは。声かすれてない？]
  - say: 声かすれてる、分かる？ 先週ね、熱を出したの。もう治ったよ。
  - chat: [実家に帰れてない, 大丈夫？ 無理しないで]
  - say: 無理しないで、ってありがとう。もう平気。声だけまだ戻ってないの。
  - chat: [ポイントで生きてる, 色っぽい声になってる]
  - say: 色っぽい声？ なってないよ。のど飴なめながら喋ってるだけ。龍角散の。
  - say: 配信の前に一個なめるの。今日は三個目。
  - say: 袋の裏にね、一日何個までって書いてないか探したの。書いてなかった。だから三個目。
- title: 冷蔵庫のゼリー
  beats:
  - say: 一人暮らしで熱が出るとね、まず困るのが買い物なの。
  - say: スポーツドリンクを買いに行く元気がないの。コンビニまで三分なのに。
  - chat: [夜勤明けの人, 分かる。三分が遠い]
  - say: 三分が遠い、ほんとそれ。だから私、冷蔵庫にいつもゼリーを一個入れてるの。熱が出たとき用に。
  - chat: [定時退社したい, 準備がいい]
  - say: 準備がいいでしょ。で、先週の夜。熱が三十八度出て、冷蔵庫を開けたの。
  - say: ゼリーがなかった。
  - chat: [ポイントで生きてる, なんで]
  - say: なんでかって、前の日にね、期限が来てたの。だから元気なうちに食べちゃったの。
  - say: 買い足す前の一日に、ちょうど熱が来たの。間が悪いでしょ。
  - say: 冷蔵庫にあったのは、卵と納豆と、賞味期限の切れた卵。
  - chat: [実家に帰れてない, 卵が二回出てきた]
  - say: 卵が二回出てきた、うん。古いのと新しいの、両方あったの。どっちがどっちか、熱の頭じゃ分からなかった。
  - chat: [定時退社したい, 自分はマヨネーズとビールだけ]
  - say: マヨネーズとビールだけ？ ビールはうちにもある。黒ラベル。でも熱のときは飲まないよ。
  - chat: [毎朝おはよう係, うちは調味料しかない]
  - say: 毎朝おはよう係のとこは調味料しかない。分かる。あれ開けると、ちょっと寒いよね。
  - say: 結局その夜は、卵を一個ゆでて食べたの。新しい方だと信じて。
  - say: 次の日も平気だったから、たぶん新しい方だった。古い方は、まだ冷蔵庫にいる。
- title: 置き配の箱が重い
  beats:
  - say: で、ネットで頼んだの。スポーツドリンクを。
  - say: 普通の通販。で、置き配にしたの。玄関の前に置いてもらうやつ。
  - say: 人と話す元気もなかったから。
  - say: で、届いたって通知が来て、玄関を開けたの。
  - say: 二リットルが六本入った箱だった。
  - chat: [手帳は三冊目, 熱の人が頼む量じゃない]
  - say: 熱の人が頼む量じゃない、って言われても、箱で頼んだ方が安かったの。熱でも値段は見ちゃうの。
  - say: 持ち上がらないの、それが。十二キロあるから。
  - chat: [実家に帰れてない, どうしたの]
  - say: どうしたか？ 引きずって入れた。廊下を。パジャマで。
  - chat: [ポイントで生きてる, 見たかった]
  - say: {face: annoyed, text: 見たかった、じゃないの。熱のパジャマは誰にも見せない。}
  - say: 上下そろいの綿のパジャマだよ。夢も何もないから。ばらばらだと落ち着かなくて、そろいで買うの。
  - chat: [手帳は三冊目, 置き配ができる前は不在票地獄だった]
  - say: 不在票地獄！ そうそう、昔は、いないとポストに不在票が入ってたでしょ。
  - say: で、再配達の電話をするの。自動の音声に、番号を打ち込んで。
  - say: 伝票番号が長いの。途中で一桁間違えて、最初からやり直すの。
  - chat: [定時退社したい, 今はアプリでできる]
  - say: 今はアプリでできるもんね。でもね、私、不在票をもらうとちょっとほっとしてたの。
  - chat: [初見の旅人, なんで]
  - say: なんでって、誰かが私の部屋まで来てくれたんだな、って。会えてないけど。
  - chat: [実家に帰れてない, ちょっと分かる]
  - say: 実家に帰れてない、ちょっと分かる？ よかった。変な話だと思ってた。
- title: 脇道：熱のときお風呂は？
  beats:
  - chat: [毎朝おはよう係, 熱のときお風呂入る？]
  - say: 熱のときお風呂入るか？ 入らなかった。シャワーも無理だった。
  - say: そもそも私、普段もほとんどシャワーなの。一人分のお湯を張るの、もったいなくて。
  - chat: [定時退社したい, 湯船派です。疲れが取れない]
  - say: 湯船じゃないと疲れが取れない、って人もいるね。分かるよ。私も、たまに湯船を張るときは、バスクリンを入れるの。年に数回。
  - say: 年に数回だから、一箱がなかなか減らないの。三年目の箱がある。
  - chat: [手帳は三冊目, お風呂にスマホ持ち込む？]
  - say: お風呂にスマホ？ 持ち込まない。前に手帳を持って入ったら、湿気で全部のページが波打ったの。
  - say: それから、紙も電話も持ち込まない。お風呂ではなんにもしないの。
  - chat: [名無しの使い魔, 防水のスマホなのに]
  - say: スマホは防水でも、私の手帳は防水じゃないから。持ち込むとセットで持ち込みたくなるの。
  - say: シャワーだけなのに、十五分かかるの。何してるんだろうね、あの十五分。
  - chat: [夜勤明けの人, お風呂上がりは何飲む？]
  - say: お風呂上がりは何飲むか？ 牛乳！ コーヒー牛乳じゃなくて、白い方。
  - ask:
      q: お風呂上がり、まず何を飲む？
      options:
      - c: 水かお茶
        r:
        - '{name}は水かお茶。ちゃんとしてる。'
        - 体にはそれがいいんだろうね。私は分かってて牛乳にしちゃう。
      - c: 牛乳かコーヒー牛乳
        r:
        - '{name}は牛乳かコーヒー牛乳。仲間だ。白い方？ 茶色い方？'
        - 腰に手は当てる？ 私は一人のときだけ当てる。
      - c: ビールか炭酸
        r:
        - '{name}はビールか炭酸。大人だね。'
        - お風呂上がりのビール、おいしいのは知ってる。私は飲むと、そのまま寝ちゃうの。
      - c: 何も飲まない
        r:
        - '{name}は何も飲まないの？ そのまま寝ちゃうタイプ？'
        - 一杯だけでも飲んでね。夜中に喉がからからになるから。
      npc:
      - [手帳は三冊目, 0]
      - [夜勤明けの人, 1]
      - [定時退社したい, 2]
      - [名無しの使い魔, 1]
      - [ポイントで生きてる, 2]
  - chat: [ポイントで生きてる, 牛乳飲んでるとこ見たい]
  - say: 牛乳飲んでるとこも見せないよ。パジャマと一緒。
  - say: で、熱の夜の話ね。スポーツドリンクは飲めたの。
- title: 夜中の心細さと、下の部屋
  beats:
  - say: でも夜中になると、熱って上がるでしょ。
  - chat: [夜勤明けの人, 夜中が一番つらい]
  - say: 夜中が一番つらい、そうなの。で、ちょっと心細くなるの。一人だと。
  - say: 寝てるとね、天井の木の模様が顔に見えてくるの。三つくらい。
  - say: で、その顔が全部こっちを見てる気がして、余計に寝られないの。
  - chat: [夜勤明けの人, 熱のときの夢も変]
  - say: 熱のときの夢、変だよね。私も見た。番号札を取ったら、私の番号だけ何も書いてないの。
  - chat: [ポイントで生きてる, 区役所に呪われてる]
  - say: 区役所に呪われてる？ そうかもね。起きたら汗びっしょりだった。
  - chat: [初見の旅人, 誰かに連絡した？]
  - say: 誰かに連絡したか。母に連絡しようかと思ったけど、やめた。
  - say: 心配して、たぶん電車で来ちゃうから。夜中に。
  - say: で、来たら来たで「いい人はいないの」って言うの。熱の私に。
  - chat: [ポイントで生きてる, 看病しながら言うのは強い]
  - say: 看病しながら言うの、強いでしょ。だから連絡しなかった。
  - say: 代わりにね、床を二回、こつこつって叩いたの。
  - chat: [手帳は三冊目, 下はリゼの部屋だっけ]
  - say: そう、下はリゼの部屋。夜中はだいたい起きてるから。
  - say: 三回返ってきた。こつこつこつって。
  - chat: [毎朝おはよう係, かわいい]
  - say: かわいいでしょ。それだけで、ちょっと寝られたの。
  - say: 決めてあるわけじゃないのよ、その合図。二回叩いたら三回返ってくる。それだけ。
  - say: 何の意味かは、お互い聞いたことないの。聞いたら、たぶん恥ずかしくなるから。
  - say: で、朝起きたらね、玄関の前に袋が置いてあったの。
  - chat: [実家に帰れてない, リゼだ]
  - say: うん、リゼ。桃の缶詰と、ゼリーが三個。それと、なぜかゲームの攻略本が一冊。
  - chat: [夜勤明けの人, 寝込んでる間に読めってこと？]
  - say: 寝込んでる間に読めってこと？ たぶんそう。そのゲーム、私やってないんだけど。
  - say: 桃缶はね、開けたら一人で一缶全部いったよ。熱のときの桃缶、おいしいよね。
  - chat: [定時退社したい, 風邪のときはりんごのすりおろし]
  - say: 定時退社さんは、風邪のときはりんごのすりおろし。いいね。実家だと母がやってくれた。今は誰もすってくれない。
- title: 脇道：入院したときと、注射を見る派
  beats:
  - chat: [初見の旅人, 病院は行った？]
  - say: 病院？ 熱が下がらなかったら行こうと思ってたけど、下がったから行かなかった。
  - chat: [夜勤明けの人, 入院したことある？]
  - say: 入院したことあるか？ ある。盲腸で五日。
  - say: 書記局にいた頃ね。病室で暇だったから、仕事の帳簿を持ってきてもらって付けてたの。
  - say: そしたら看護師さんに取り上げられた。「寝てください」って。
  - chat: [定時退社したい, 看護師さんが正しい]
  - say: 看護師さんが正しい、分かってるよ。でも暇なんだよ、五日。点滴なんて、ぽたぽた落ちるのを見てるしかないの。
  - chat: [夜勤明けの人, 注射のとき針見る派？]
  - say: 注射のとき針見る派か。見る。どこに刺してるか確かめたいの。
  - chat: [定時退社したい, 見たら倒れる]
  - say: 見たら倒れる人もいるね。倒れるのはだめだよ。見なくていいよ、それは。
  - chat: [ポイントで生きてる, 刺されるの好きなの？]
  - say: {face: annoyed, text: 刺されるのが好き？ 好きじゃないよ。見てるだけ。あんたはすぐそっちに行くね。}
  - say: サキュバスでも注射は痛いの。
  - chat: [夜勤明けの人, 採血の人が上手だと嬉しい]
  - say: 採血の人が上手だと嬉しい！ 一回で入ると「上手ですね」って言いたくなる。言わないけど。
  - chat: [名無しの使い魔, 言ってあげて]
  - say: 言ってあげて、か。今度言う。たぶん言えないけど。
  - say: 盲腸のときの看護師さんにも、お礼をちゃんと言えなかったの。退院の日、帳簿を返してもらうのに必死で。
  - chat: [初見の旅人, 桃缶の話もうちょっと聞きたい]
  - say: 桃缶の話をもうちょっと？ あれで助かったの、ほんとに。熱のとき、ちゃんと食べられたのはあれだけだったから。
  - say: でもさ、あの夜は本当に、最初に何したらいいか分からなかったの。みんなはどうしてる？
  - ask:
      q: 一人で熱が出たら、まず何する？
      options:
      - c: とにかく寝る
        r:
        - '{name}は、とにかく寝る。寝るのが結局早く治るって聞くね。'
        - 私は寝る前に冷蔵庫を開けて、ゼリーがなくて、目が覚めちゃった。
      - c: 誰かに連絡する
        r:
        - '{name}は誰かに連絡する。頼れる人がいるんだ。いいね。'
        - 私は床を叩いた。あれも連絡のうちに入れていい？
      - c: 通販か出前を頼む
        r:
        - '{name}は通販か出前。私と同じ。'
        - 量には気をつけてね。私は二リットル六本で廊下を引きずった。
      npc:
      - [夜勤明けの人, 0]
      - [実家に帰れてない, 0]
      - [毎朝おはよう係, 1]
      - [ポイントで生きてる, 2]
- title: 締め：ゼリーを二個買った
  beats:
  - chat: [初見の旅人, リゼにお礼した？]
  - say: リゼにお礼？ したよ。攻略本も返した。読まずに。ゼリーは三個とも食べた。
  - say: で、治ってからね、新しくゼリーを買ったの。二個。
  - chat: [手帳は三冊目, なんで二個？]
  - say: なんで二個かって、一個は熱のとき用。もう一個は、元気なうちに期限が来たら食べる用。
  - chat: [実家に帰れてない, それ結局両方食べるやつ]
  - say: 結局両方食べるやつ、って？ たぶん両方食べる。元気なうちに。
  - say: はい、今日はここまで。のど飴、四個目いくね。おやすみ。
