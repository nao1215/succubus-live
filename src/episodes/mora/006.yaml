# モーラ 006（2026-10-27 夜 新規）。バイブルの案「喫茶店のマスターの靴箱」と likes（chain_cafe、chain_sutaba_order、sweets_best_ever、sweets_pudding）から。
# 2026-10-27 Codex の二回目のレビューで直した（プリンの全員紹介をやめた。コーヒー屋の全員紹介は6人の中でこの回にだけ残す。チャットの割合）。直す前は src/old/episodes-v9/mora/006.yaml。
# 流れ：今日の仕事 → マスターの靴箱と中敷き → 消えかけたレシート → チャットの「マスターの店のコーヒーは？」から好きなコーヒー屋（chain_cafe）とプリン（sweets_pudding）へ脇道 → 戻らずにプリンの話のまま、作業の続きで終わる。
# 出典は src/sources/mora/006.md。
title: 喫茶店のマスターが、今年も靴箱でレシートを持ってきた
parts:
- title: 挨拶と、今日の仕事
  beats:
  - say: こんばんは。今日はね、仕事しながらの配信。
  - chat: [夜勤明けの人, こんばんは。何の仕事？]
  - say: 夜勤明けさん、何の仕事だと思う？ 記帳代行。お店のレシートを預かって、帳簿にまとめる仕事ね。
  - chat: [初見の旅人, 初見です。帳簿ってなに？]
  - say: 初見さん、いらっしゃい。帳簿はね、ざっくり言うと、いつ何にいくら使ったかを書いた表。税金の申告に使うの。
  - say: で、今日はね、喫茶店のマスターの一年分。毎年来るお客さんなの。
  - chat: [手帳は三冊目, マスターの話好き]
  - say: マスターの話好き？ 私も好き。マスター、毎年同じ持ってき方をするの。
  - say: 来る日も毎年同じ。三月の最初の月曜。電話もしないで、お昼すぎにドアを叩くの。
  - say: 三月の最初の月曜はね、私、手帳に何も書かないようにしてる。空けておくの。
- title: 靴箱と中敷き
  beats:
  - say: レシートを、靴の箱に全部入れて持ってくるの。一年分。
  - chat: [ポイントで生きてる, 靴箱w]
  - say: 笑うよね、靴箱。毎年同じ靴箱。もう角がやわらかくなってるの。
  - say: で、その箱の底にね、古い靴の中敷きが一枚入ってるの。
  - chat: [初見の旅人, なんで]
  - say: なんで中敷きか？ 分からない。最初の年から入ってた。毎年レシートと一緒に出てくるの。
  - chat: [手帳は三冊目, 聞いたことある？]
  - say: 聞いたことあるか。一回聞いたよ。「中敷き入ってましたよ」って。マスター、「ああ」って言って、そのまま持って帰った。
  - chat: [定時退社したい, で、次の年も入ってた？]
  - say: 次の年も？ 入ってた。同じの。
  - say: 戻してるの。たぶん、箱の一部だと思ってるんだよね。
  - say: で、今年開けたら、中敷きが二枚になってたの。
  - chat: [名無しの使い魔, 左右そろった]
  - say: 左右そろった？ そろったのかな。でも色が違うの。
  - say: 別の靴だね。聞くのはやめた。来年、三枚になってたら聞く。
  - chat: [夜勤明けの人, 箱をあげたら？]
  - say: 箱をあげたら、って、あげたの！ 前に、ちゃんとした書類の箱をプレゼントしたの。ふたが付いてて、日付を書ける札も付いてるやつ。
  - say: マスター、すごく喜んでくれたの。「いい箱だね」って。
  - say: で、次の年も靴箱で来た。
  - chat: [手帳は三冊目, もらった箱はどこへ]
  - say: もらった箱はどこへ行ったか。聞いたらね、お店のスプーンとフォークを入れてるって。
  - say: 一回お店で見たけど、すごくきれいに並んでた。
  - say: 私の思ってた使い方じゃないけど、まあいいや。
  - chat: [定時退社したい, マスターとはどうやって知り合ったの？]
  - say: マスターとどうやって知り合ったか？ 書記局をやめたあと、最初に来てくれたお客さんなの。お店の常連さんが紹介してくれて。
  - say: 最初の年はね、レシートが紙袋に入ってたの。二年目から靴箱。
  - say: 進化なのかな。袋より箱のほうが、ちょっと助かるのは確か。
- title: 消えかけたレシート
  beats:
  - say: でね、今年は困ったことがあって。レシートの字が消えかけてたの。
  - chat: [定時退社したい, 感熱紙のやつ？]
  - say: そう、感熱紙。レジのレシートって、熱で字を出す紙なの。だから光とか熱で、だんだん薄くなるの。
  - say: マスター、靴箱を店の窓ぎわの棚に置いてたんだって。日が当たるところ。
  - say: 一年間、日光浴。春のレシートなんて、ほとんど白い紙だった。
  - chat: [手帳は三冊目, どうするの、それ]
  - say: どうするのかって、光に透かしたり、斜めから見たりして読むの。読めないのはマスターに聞く。
  - chat: [ポイントで生きてる, マスター覚えてるの？]
  - say: マスターが覚えてるか？ 「豆だな」って。全部「豆だな」って言うの。
  - chat: [定時退社したい, 喫茶店だから大体豆w]
  - say: 喫茶店だから大体豆、そう。大体合ってるのが悔しいところ。
  - say: でもね、一枚だけ「豆だな」じゃないのがあったの。ほとんど白い紙で、金額だけ読めた。
  - say: 聞いたら、マスター、ちょっと黙って「それは花だな」って。奥さんの誕生日だったんだって。
  - say: それ以上は聞かなかった。勘定科目は、交際費じゃなくて、私の判断で事業と関係ない方に入れた。
  - chat: [窓口十二年, 2019年から税率が二つになって面倒になったやつ]
  - say: 2019年から税率が二つ、そう。持ち帰りは8%、店で食べると10%。一枚のレシートに両方載ってたりするの。
  - say: マスターの店、豆の持ち帰りも売ってるから、混ざるんだよね。
  - say: 大変だけど、そういうのを分けるのは、わりと好きなの。
  - chat: [手帳は三冊目, 手書きの領収書もある？]
  - say: 手書きの領収書もある。業者さんのね。宛名が「上様」になってるやつ。
  - chat: [初見の旅人, 上様って誰]
  - say: 上様って誰か？ 名前を書かないときに使う宛名なの。殿様みたいでしょ。
  - say: マスター、上様って柄じゃないんだけどね。いつもエプロンだし。
- title: 脇道：レシートはもらう派？
  beats:
  - chat: [定時退社したい, 自分はレシートもらわない派]
  - say: 定時退社さんはレシートもらわない派か。私はもらう。財布に入れて、夜に手帳に写すの。
  - say: 財布はパンパンにならないよ。夜に全部出すから。
  - chat: [名無しの使い魔, コンビニのレシート、捨てる箱に直行]
  - say: 捨てる箱に直行。あの箱ね。レジの横の。あれに入れる人、すごく多いよね。
  - chat: [夜勤明けの人, 「レシートいりません」が言えなくて受け取る]
  - say: 「レシートいりません」が言えない、分かる！ 言う前に渡されるの。で、受け取って箱に入れるの。
  - chat: [手帳は三冊目, 最近はアプリにレシートが来る]
  - say: アプリにレシートが来る、来るね。あれはあれで便利なんだけど、紙のほうが好き。
  - say: 触ると安心するの。お金が減ったのが手で分かる気がして。
  - say: 私、現金派なの。お財布の中は、一万円札一枚と、千円札が何枚か。
  - chat: [定時退社したい, キャッシュレスにしなよ]
  - say: キャッシュレスにしなよ、って言われる。でもね、残高が画面の中だけだと、減った気がしなくて怖いの。
  - chat: [夜勤明けの人, 給料日に何する？]
  - say: 給料日に何するか。銀行に通帳の記帳をしに行くの。
  - say: アプリで見られるのは分かってるの。でもね、機械に通帳を入れると、ジジジって音がするでしょ。
  - say: あの音が好きなの。数字が印字される音。
  - chat: [手帳は三冊目, あの音いいよね]
  - say: あの音いいよね、って！ 分かってくれる人がいた。
  - say: 音のために、月に一回ね。ついでにお金も下ろすから、無駄じゃないよ。
- title: 脇道：好きなコーヒー屋さんは？
  beats:
  - chat: [毎朝おはよう係, マスターのお店のコーヒーおいしい？]
  - say: マスターのお店のコーヒー、おいしいか？ おいしいよ。ちゃんとネルで淹れてるの。布でこすやつ。
  - chat: [夜勤明けの人, モーラは普段どこのコーヒー？]
  - say: 私は普段どこか、って。ドトール。ミラノサンドのAと、ブレンドのM。
  - say: ミラノサンドA、おいしいよね！ 値段も気にしなくていいし、一人でもすぐ座れるし。
  - chat: [ポイントで生きてる, スタバは行かないの？]
  - say: スタバは、行くよ、たまに。でも注文は「本日のコーヒーのトール」だけ。
  - say: 呪文みたいな注文は唱えられないの。前の人が長い注文してると、聞いてるだけで緊張する。
  - chat: [夜勤明けの人, 家ではどうしてる？]
  - say: 家では、インスタント。ネスカフェのゴールドブレンドを一杯。
  - say: お湯を沸かしてる間に、だんだん目が覚めてくるの。
  - chat: [手帳は三冊目, 一日何杯？]
  - say: 一日何杯か。三杯までって決めてるの。で、四杯飲む。
  - say: 決めた意味ないって？ 決めておかないと五杯になるの。だから意味はあるの。
  - chat: [初見の旅人, 他の配信者さんはどこ派？]
  - say: ほかの配信者はどこ派か、ね。ヴェスパはスタバ。季節の新しいのが出ると、すぐ行くんだって。
  - say: ピムとリゼはコメダ。
  - say: リゼはたぶん、あの深いソファで寝てる。
  - say: ノクスはタリーズ。エラは個人の喫茶店。エラっぽいでしょ。カップとお皿の話を三十分できる人だから。
  - ask:
      q: 好きなコーヒー屋さんは？
      options:
      - c: スターバックス
        r:
        - '{name}はスターバックス。ヴェスパと同じだね。'
        - 注文、長いの頼める？ 私は本日のコーヒーしか言えない。
      - c: ドトール
        r:
        - '{name}はドトール。仲間だ。'
        - ミラノサンドはA派？ 私はA。生ハムとか、いろいろ挟まってるのがいいの。
      - c: コメダ珈琲店
        r:
        - '{name}はコメダか。ピムとリゼと一緒。'
        - コメダのソファに座ると、立ち上がるのに気合いがいるよね。
      - c: 個人の喫茶店
        r:
        - '{name}は個人の喫茶店。エラと同じだ。'
        - 近所にいいお店があるの、いいなあ。マスターと話したりする？
      npc:
      - [夜勤明けの人, 1]
      - [ポイントで生きてる, 0]
      - [定時退社したい, 1]
      - [手帳は三冊目, 3]
      - [毎朝おはよう係, 2]
      - [名無しの使い魔, 0]
- title: プリンは固め？ とろとろ？
  beats:
  - chat: [手帳は三冊目, マスターのお店、甘いものある？]
  - say: マスターのお店に甘いもの？ ある！ 手作りのプリン。前にね、帳簿のお礼っておまけで出してくれたの。
  - say: それが今まで食べた甘いもので、たぶん一番おいしかった。
  - say: 固いの。スプーンを入れると、跡がそのまま残るくらい。
  - chat: [ポイントで生きてる, とろとろ派です]
  - say: ポイントで生きてるは、とろとろ派か。コンビニのはだいたいとろとろだよね。おいしいのは知ってる。
  - chat: [定時退社したい, 固め派です。昔のプリンが好き]
  - say: 固め派、昔のプリン。分かる！ 喫茶店の、カラメルが苦いやつ。卵とカラメルの味がするの。
  - say: マスターのは、カラメルがちょっと焦げてるの。わざとなのか聞いたら「たまたま」って。毎回たまたまなの。
  - chat: [ポイントで生きてる, とろとろの方がエロい]
  - say: {face: annoyed, text: とろとろの方が、何？ プリンにそういうこと言わないで。プリンは悪くない。}
  - chat: [ポイントで生きてる, 固いのは？]
  - say: 固いのは、って、固いのも悪くないよ。ポイントで生きてる、ほんとに今日しつこいね。
  - ask:
      q: プリンは固め？ とろとろ？
      options:
      - c: 固め
        r:
        - '{name}は固め派ね。同じだ。'
        - 喫茶店で固めのプリンを見つけると、それだけで入っちゃうんだよね。
      - c: とろとろ
        r:
        - '{name}はとろとろ派か。'
        - リゼにも勧められたことあるよ。おいしいのは分かってる。でも固めに戻っちゃうの。
      - c: どっちも好き
        r:
        - '{name}は、どっちも好き。平和な人だね。'
        - その日の気分で選べるの、ちょっとうらやましい。
      npc:
      - [定時退社したい, 0]
      - [ポイントで生きてる, 1]
      - [名無しの使い魔, 0]
      - [夜勤明けの人, 2]
      - [手帳は三冊目, 0]
- title: 終わり：作業の続き
  beats:
  - chat: [毎朝おはよう係, 今日もマスターのお店行きたくなった]
  - say: マスターのお店に行きたくなった？ でしょ。私もプリンの話してたら食べたくなった。
  - chat: [初見の旅人, 帳簿は終わりそう？]
  - say: 帳簿は終わりそうか……まだ春のレシートが残ってるの。白い紙のやつ。
  - say: このあとも透かして読むよ。
  - chat: [ポイントで生きてる, 中敷きの件、マスターに聞いて]
  - say: 中敷きの件は、来年ね。三枚になってたら聞くって決めたから。
  - chat: [手帳は三冊目, 二枚でも聞いていいのでは]
  - say: 二枚でも聞いていい？ 二枚だと、まだ「たまたま」かもしれないでしょ。いや、たまたまで中敷きは増えないか。
  - say: 配信はここまでにするね。おやすみ。あ、また白いのが出てきた。
