# モーラ 002（2026-10-27 夜 新規）。旧 001 の「待合で鳴った、母の電話」とバイブルの案「母の電話は『お母さんだけど』から始まる」から。
# 2026-10-27 Codex の二回目のレビューで直した（マナーモードの選択肢、話を忘れて戻る所、チャットの割合）。直す前は src/old/episodes-v9/mora/002.yaml。
# 流れ：留守電三件 → マナーモードの話（net_ringtone）→ 母の第一声と番号表示 → LINE の送り間違い（net_burn）で脇道 → 戻って「いい人はいないの」→ 折り返しの約束。
# 出典は src/sources/mora/002.md。
title: 母からの電話は、いつも「お母さんだけど」から始まる
parts:
- title: 挨拶と、留守電が三件
  beats:
  - say: こんばんは。始めるよ。
  - chat: [実家に帰れてない, こんばんは。今日は何してた？]
  - say: 今日何してたか？ 今日はね、スマホを見たら留守電が三件入ってたの。全部、母。
  - chat: [ポイントで生きてる, 三件w]
  - say: 一件目は「お母さんだけど、また電話する」。二件目は「お母さんだけど」だけ。
  - say: 三件目は、「生きてる？」。
  - chat: [実家に帰れてない, うちも来る、それ]
  - say: 実家に帰れてないの家にも来るって。来るでしょ。生きてるよ。生きてるけど、マナーモードなの。
  - chat: [手帳は三冊目, 留守電って消す派？ 残す派？]
  - say: 留守電、消す派か残す派か。私は残しちゃう。消すボタンを押すのが、なんか悪い気がして。
  - say: だから母の留守電、去年の分からずっと入ってるの。全部「お母さんだけど」で始まるやつ。
  - say: 一回いっぱいになったの。そしたら母から「留守電が入らない」って電話が来た。
  - chat: [ポイントで生きてる, 電話で言われるんだw]
  - say: そう、電話で言われるの。出られたの、その一回は。たまたま。
  - say: で、仕方ないから古いのを消したの。三年前の「お母さんだけど、みかん届いた？」とか。
  - say: 消すときね、一件ずつ最後まで聞いちゃうの。で、全部「お母さんだけど」なの。
- title: 脇道：スマホは音も振動も切ってる？
  beats:
  - say: 私ね、スマホ、ずっと音も振動も切ってるの。だから電話に気づかない。
  - chat: [定時退社したい, 自分もずっとマナー]
  - say: 定時退社さんもずっとマナーか。私、一回ね、ちゃんと鳴るようにしたことがあるの。母の電話に出ようと思って。
  - say: で、初めて鳴ったのが、歯医者の予約の確認の電話。
  - chat: [ポイントで生きてる, 母じゃないw]
  - say: そう、母じゃないの。部屋で急に鳴るでしょ。びっくりして椅子から立ったの。誰もいないのに。
  - chat: [夜勤明けの人, 立つのは分かる]
  - say: 夜勤明けさん、立つのは分かるって。立つよね！ で、すぐ全部切った。
  - say: 着信音って、自分の部屋で聞くと、すごく大きいの。お店で聞くと平気なのに。
  - ask:
      q: スマホ、普段の着信はどうしてる？
      options:
      - c: 音も振動も切る
        r:
        - '{name}は、音も振動も切る。仲間だね。'
        - 静かで平和だけど、気づいたら留守電が三件あるんだよね。
      - c: 着信音を鳴らす
        r:
        - '{name}は着信音を鳴らす派。ちゃんとしてる。'
        - 電車で鳴っちゃったときの、あの慌て方は知らなくていいよ。いや、知ってるか。
      - c: 振動だけにする
        r:
        - '{name}は振動だけ。いいとこ取りだね。'
        - 私もそれ試したけど、机の上で震えると、すごい音がするの。結局びっくりした。
      npc:
      - [定時退社したい, 0]
      - [実家に帰れてない, 0]
      - [毎朝おはよう係, 1]
      - [夜勤明けの人, 2]
  - chat: [毎朝おはよう係, 母親専用の着信音にすれば]
  - say: 母親専用の着信音？ それ、昔やってたよ。ガラケーの頃、母だけ黒電話の音にしてたの。
  - say: 着メロの時代ね。母から来るとジリリリって鳴って、職場の人がみんな振り向いたの。
  - chat: [夜勤明けの人, 職場で黒電話は目立つw]
  - say: 職場で黒電話、目立つよ。で、みんな「お母さん？」って言うの。分かっちゃうの、全員に。
- title: 母の第一声
  beats:
  - say: で、今日の話ね。夜にやっと折り返したの。
  - say: 母の第一声、何だと思う？
  - chat: [夜勤明けの人, もしもし]
  - chat: [実家に帰れてない, お母さんだけど]
  - say: {face: surprised, text: 「もしもし」と、「お母さんだけど」。実家に帰れてない、当たり。「お母さんだけど」。}
  - say: 私からかけてるのに、だよ？ 画面にも「母」って出てるのに。
  - chat: [手帳は三冊目, うちの親はフルネームで名乗る]
  - say: 手帳は三冊目の親は、フルネームで名乗る？ それは上だね。
  - chat: [初見の旅人, なんで名乗るんだろう]
  - say: なんで名乗るのかって、昔の電話はね、かかってきた番号が出なかったの。出てみるまで誰か分からない。
  - say: 番号が出るようになったのは、全国だと1998年。
  - chat: [窓口十二年, 意外と最近]
  - say: 意外と最近？ もう三十年近く前だよ。でも母はその前の作法のままなの。
  - say: かわいいよ。用件はかわいくなかったけど。
  - ask:
      q: 親からの電話、第一声はなんて言う？
      options:
      - c: もしもし
        r:
        - '{name}の家は「もしもし」。普通だね。うらやましい。'
        - うちの母は、もしもしの前に名乗るの。順番が逆なんだよ。
      - c: 今いい？
        r:
        - '{name}の親は「今いい？」か。気を使う人だね。'
        - でも「今いい？」って聞いて、だめって言っても話し始めるでしょ。
      - c: 名乗る
        r:
        - '{name}も名乗られる側か。名乗る、仲間だ。'
        - 番号出てるのにね。もう名乗らないと落ち着かないんだと思う。
      - c: いきなり用件
        r:
        - '{name}の親は、いきなり用件。強いね。'
        - 前置きなしで「あれどこにしまった？」から始まるやつ。それも分かる。
      npc:
      - [夜勤明けの人, 0]
      - [ポイントで生きてる, 1]
      - [実家に帰れてない, 2]
      - [手帳は三冊目, 2]
      - [定時退社したい, 3]
- title: 用件は保険証
  beats:
  - say: で、用件はね、「紙の保険証、本当に使えなくなったの？」って。
  - chat: [窓口十二年, ああ]
  - say: 窓口十二年の「ああ」が全部分かってる。使えなくなったよ、って。期限が切れても少しの間は使えたけど、それも7月で終わったの。
  - chat: [六法は枕, 8月からは原則マイナ保険証か資格確認書]
  - say: 八月からは、マイナ保険証か資格確認書。そう、それ。六法、今日は早いね。試験前？
  - chat: [六法は枕, 試験前なので]
  - say: 試験前なので、だって。試験前だと優しくなるの？ 毎週試験にしてほしい。
  - say: で、「資格確認書っていう紙が届いてるはずだよ」って言ったら、母は「来てない」って。
  - chat: [実家に帰れてない, 絶対来てる]
  - say: 絶対来てる、ね。来てるの。母はね、封筒を開けないでお菓子の缶に入れておく人なの。
  - chat: [夜勤明けの人, モーラと同じじゃん]
  - say: {face: shy, text: 「モーラと同じじゃん」って、言わないで。私は靴の箱で、母は缶。同じだね。}
  - say: 電話しながら缶を開けてもらったら、一番上にあったの。
  - say: まだ新しい封筒。母、「あら」って言ったよ。それだけ。
- title: 脇道：LINE を送る相手を間違えた
  beats:
  - chat: [毎朝おはよう係, お母さんとLINEはしないの？]
  - say: お母さんとLINE？ してるよ。でもね、前にやらかしたことがあって。
  - say: リゼにお金を貸してたの。八千円。返してって送ろうとしたの。
  - chat: [初見の旅人, リゼって？]
  - say: 初見さん、リゼはね、下の部屋に住んでる子。ゲーム配信してる。いつも眠そうな子ね。
  - say: で、「八千円返して」って送ったら、送り先が母だったの。
  - chat: [ポイントで生きてる, 最悪の誤爆]
  - say: 最悪の誤爆だよ。既読がすぐ付いた。いつもは三日付かないのに。
  - say: 五分後に電話が来て、出たら「いくら困ってるの」って。
  - say: 優しいの。説明するのに二十分かかった。
  - say: 「リゼちゃんって誰」から始まって、下の部屋の子で、ゲームの人で、って。最後は「その子、ちゃんと食べてるの」って心配してた。
  - chat: [定時退社したい, 結局八千円は返ってきた？]
  - say: 八千円は返ってきたか？ ゲームの中の石が三千個返ってきた。
  - say: 「レートで言えばお得」って言われたの。私、そのゲームやってないのに。
  - chat: [名無しの使い魔, 誤爆したことある、上司に「了解ぴょん」]
  - say: {face: surprised, text: 上司に「了解ぴょん」？ それは上司、どうしたの？}
  - chat: [名無しの使い魔, 「了解」で返ってきた]
  - say: 「了解」で返ってきた。大人だね、上司。私なら一日考える。
- title: 最後の一分で、そこに着く
  beats:
  - say: で、母の電話ね。保険証の話が済んで、そのあと近所の犬の話になったの。
  - say: 犬の名前が途中で二回変わったの。たぶん二匹いる。たぶんね。
  - chat: [手帳は三冊目, 聞き返さないの？]
  - say: 聞き返さないのって？ 聞き返すと、もう一周するの。だから聞かない。
  - say: 私はその間に、手帳に「犬、たぶん二匹」って書いてた。次に聞かれたとき困らないように。
  - say: 次の電話で、犬の話は一回も出なかったけどね。
  - say: で、四十分くらい話して、最後の一分。来たの。
  - chat: [夜勤明けの人, 「いい人いないの」]
  - say: {face: annoyed, text: 夜勤明けさん、正解。来た。「で、いい人はいないの？」。}
  - say: 保険証から、犬を二匹通って、そこに着くの。毎回、違う道で同じところに着くの。
  - chat: [ポイントで生きてる, ここにいるって言って]
  - say: 「ここにいる」って？ 言わないよ。あんたを紹介したら、母、ポイントカード作らされるでしょ。
  - chat: [実家に帰れてない, なんて答えたの]
  - say: なんて答えたか。「今、ご飯作ってる」って言った。作ってなかったけど。
  - say: そしたら母、「ちゃんと座って食べなさいよ」って。
  - chat: [夜勤明けの人, バレてる]
  - say: うん、バレてる。私、一人だと流しの前で立って食べるから。なんで知ってるんだろう。
- title: 脇道：実家に帰るのは正月だけ、お雑煮
  beats:
  - chat: [毎朝おはよう係, 実家にはよく帰るの？]
  - say: 実家によく帰るか？ 正月だけ。お盆は帰らないの。
  - say: 帰るとね、母が座布団を出してくれるの。私の分だけ、ふかふかのやつ。
  - say: で、お雑煮が出てくるの。角餅のすまし。鶏肉と小松菜と、なるとが一枚。
  - chat: [定時退社したい, なると入るの珍しい]
  - say: なると、珍しい？ うちは一枚だけ入ってるの。二枚入ってたことはない。
  - chat: [名無しの使い魔, うちは丸餅の白味噌]
  - say: 丸餅の白味噌！ リゼのお雑煮もそれなんだって。エラが作るから。
  - say: エラ、昔仕えてたお屋敷が京都風だったんだって。それでリゼの分も作ってあげてるの。
  - say: 一回食べてみたいんだよね。お餅が丸いのも、なんかかわいいし。
  - chat: [ポイントで生きてる, 香川はあんこの餅が入る]
  - say: 香川はあんこの餅、そうそう、あん餅！ ヴェスパがそれなの。
  - say: 白味噌にあんこのお餅。最初に聞いたとき、私、聞き間違えたと思ったもん。
  - say: でもヴェスパ、毎年うれしそうに話すから、おいしいんだと思う。
  - chat: [実家に帰れてない, うちの雑煮の味、もう三年食べてない]
  - say: 家の雑煮、もう三年食べてないの？ 三年かあ。
  - say: 母のお雑煮って、自分で作っても同じ味にならないんだよね。
  - say: 私も一回作ったけど、なんか違った。なるとは同じなのに。
  - say: たぶんお出汁なんだよね。母に聞いたら「適当」って言われた。分量を聞いてるのに。
  - say: 帳面に「適当」って書いたよ。読み返しても、何も分からない。
- title: 締め：折り返しの約束
  beats:
  - say: 誰とは言わないけど。前に、お母さんから電話来てたって言ってた人。
  - chat: [実家に帰れてない, まだ折り返してない]
  - say: まだ折り返してない？ まだかあ。知ってたけど。
  - chat: [実家に帰れてない, モーラは毎回出るの？]
  - say: 私は毎回出るか？ 三回に一回。
  - chat: [実家に帰れてない, 人のこと言えないじゃん]
  - say: {face: annoyed, text: 人のこと言えない？ 言えないよ！ 分かってて言ってるの。}
  - say: 出なかった分、次の電話が長くなるの。利子みたいに。
  - chat: [実家に帰れてない, じゃあうちは三年分の利子だ]
  - say: 三年分の利子！ 一晩で終わらないよ、それ。
  - chat: [実家に帰れてない, 今週かける]
  - say: 今週かける？ よし。じゃあ私も、次はちゃんと一回目で出る。約束。
  - say: あ、ちなみにね。先週、私の方から一回かけたの。用事もないのに。
  - chat: [ポイントで生きてる, えらい]
  - say: えらいでしょ。そしたら母の第一声、「なんで電話してきたの？」。
  - chat: [夜勤明けの人, ｗｗｗ]
  - say: 草生えてる。こっちが聞きたいよ。そのあと普通に一時間しゃべったけど。
  - say: はい、今日はここまで。スマホ、今日だけは音が鳴るようにしとく。おやすみ。
