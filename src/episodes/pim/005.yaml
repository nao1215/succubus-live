title: 保育料はタダのはずなのに、給食費の紙が来た（児童手当とふるさと納税の豚の話も）
family: true
# 2026-10-27 夜 v8：10〜15分の雑談の形に作り直し。もとは v7 の 001 の「無償化と給食費」「児童手当・新NISA・ふるさと納税」。
# 本題：家に届いた紙と家計。脇道：好きなコーヒー屋（likes・ほかの配信者の答え）、コンビニスイーツと雑費（stories.sweets_konbini）。
# 税の数字は年を言う。銘柄は言わない。性的な話は出さない（保育園と子どものお金の回なので family: true）。
# 2026-10-27 v10：Codex 二回目のレビューで直し（前の版は src/old/episodes-v9/pim/005.yaml）。カフェの全員紹介は mora/006 にだけ残すので、ここは本人の話と視聴者への質問だけ。ワンストップ特例の条件を正した（出典 src/sources/pim/facts.md）。
parts:
- title: オープニング：郵便受けの紙
  beats:
  - say: ピムです！ こんにちは。
  - say: さっき郵便受けを見たら、保育園から紙が来てて。
  - chat: [定時退社したい, こんにちは。紙って何の]
  - say: 定時退社したいさん、出席確認しました！ 何の紙かっていうと、請求です。給食費の。
  - chat: [上の子もう中二, あー、副食費]
  - say: 先輩、出席確認しました。「副食費」、そうです、それです。
  - chat: [初見の旅人, 初見です。保育園って今タダじゃないの？]
  - say: 初見の旅人さん、いらっしゃいませ！ 保育園って今タダじゃないのか。わたしも、そう思ってたんですよ。
  - say: 2019年の十月から、三歳から五歳は保育料がタダになったんです。
  - say: やったー、って思ってたら、紙が来て。「副食費」って書いてあって。
  - chat: [初見の旅人, 副食費？]
  - say: 副食費は、ざっくり言うと、おかず代です。そこはタダじゃなかったんです。
  - chat: [上の子もう中二, 上の子がちょうどその年で、同じ紙が来た]
  - say: 上の子がちょうどその年で、同じ紙が！ 最初見たとき、何かの間違いかと思いました。
  - chat: [上の子もう中二, みんな一回は保育園に電話する]
  - say: 「みんな一回は電話する」……しました。電話しました、わたし。
  - say: 「タダって聞いてたんですけど」って。恥ずかしかったです。
  - chat: [ガチャ爆死太郎, 言いたくなるのは分かる]
  - say: 言いたくなるの、分かってくれます？ 園の人、慣れてる感じでした。毎年何人も電話してくるんだと思います。
- title: 本題っぽいもの：児童手当と家計簿
  beats:
  - chat: [税理士事務所の繁忙期, こんにちは。お金の話してる？]
  - say: {face: surprised, text: 'あ、税理士事務所の繁忙期さん、出席確認しました。お金の話、してます……。来ちゃいました？'}
  - chat: [税理士事務所の繁忙期, 来ちゃだめなの]
  - say: 来ちゃだめじゃないです！ お金の話のときに来られると、ちょっと緊張するだけです。
  - say: 繁忙期さん、税理士さんの事務所で働いてる人で、いつも年を聞いてくるんですよ。
  - chat: [税理士事務所の繁忙期, 何年の話？]
  - say: ほら、「何年の話？」って聞いてきた。2019年の十月です。無償化の話です。
  - chat: [税理士事務所の繁忙期, よろしい]
  - say: 「よろしい」、よかった……。じゃあついでに児童手当の話もしますね。
  - say: 2024年の十月から変わったんですよ。所得制限がなくなって、高校生の年まで延びて。
  - say: 振込も、偶数月の年六回になりました。
  - chat: [税理士事務所の繁忙期, 第三子以降は月三万]
  - say: 第三子以降は月三万、そうです。うちは一人なので、そこは関係ないんですけど。
  - say: 振込の月が変わったので、家計簿を全部書き直しました。二時間かかりました。
  - chat: [定時退社したい, 家計簿つけてるんだ]
  - say: 家計簿、つけてます。結婚してから一日も空けてないんです。
  - chat: [初見の旅人, アプリ？]
  - say: アプリじゃなくて、家族共用のパソコンの表計算です。カードの明細は勝手に入るようにしてて。
  - say: 表が一回壊れたとき、ノクスさんに直してもらったんですよ。関数を。
  - chat: [ガチャ爆死太郎, ノクスさんに頼んだの？]
  - say: 頼みました、ノクスさんに。お礼に唐揚げを三回持って行きました。むね肉が好きなんですって。
  - chat: [手伝う派の夫, こんにちは。児童手当って何に使ってる？]
  - say: 手伝う派の夫さん、こんにちは。児童手当の使い道は、全部、娘の口座に入れてます。
  - chat: [上の子もう中二, えらい。うちは途中から生活費に溶けた]
  - say: 生活費に溶けた……溶けるんですか。
  - chat: [上の子もう中二, 三人目のとき溶けた]
  - say: 三人目のときに。三人なら溶けますよ……。それは仕方ないです。
  - chat: [税理士事務所の繁忙期, 投資はしてる？]
  - say: 投資は、新NISAで、ちょっとだけです。2024年からの制度です。
  - chat: [ガチャ爆死太郎, 何買ってる？]
  - say: 何買ってるかは、言わないことにしてます。人に勧めるのも、上がるとか下がるとかも言わないです。
  - chat: [ガチャ爆死太郎, ケチ]
  - say: ケチって言われても、いいです。ガチャ爆死太郎さんに言ったら、全部ガチャに行きそうなので。
  - chat: [ガチャ爆死太郎, 否定はしない]
  - say: 否定しないんだ……。2024年の八月五日、日経平均が一日で四千円以上下がったじゃないですか。
  - say: あの日、夫に「売る？」って聞かれたんです。
  - chat: [税理士事務所の繁忙期, で？]
  - say: で、どうしたか。何もしませんでした。家計簿にも「何もしなかった」って書きました。
  - chat: [税理士事務所の繁忙期, 何もしないのが一番難しい]
  - say: 何もしないのが一番難しい、本当に。夫はその日、アプリを三回開いてました。
- title: 脇道：コーヒー屋さん
  beats:
  - chat: [定時退社したい, 家計簿つけるときコーヒーとか飲むの？]
  - say: 家計簿のときにコーヒー？ 家では緑茶なんです。コーヒーは普段飲まなくて。
  - chat: [定時退社したい, 意外]
  - say: 意外ですか？ でも、コメダに行ったときだけ飲むんですよ。ミルクと砂糖を入れて。
  - chat: [夜勤明けの人, コメダいいよね]
  - say: コメダいいですよね！ 朝のモーニングが好きなんです。
  - say: 飲み物を一杯頼むと、トーストとゆで卵が付いてくるんですよ。
  - chat: [初見の旅人, それで元取れるの？]
  - say: {face: smug, text: '元が取れるか？ 取れてます。たぶん。計算はしてないです。'}
  - say: 娘を保育園に送った日に、たまに一人で行くんです。月に一回くらい。
  - chat: [夜勤明けの人, 一人コメダいいな]
  - say: 一人コメダ、いいんですよ。新聞読んでる人の隣で、ゆで卵をむくんです。
  - say: 殻が一回でつるっとむけると、その日はいい日です。
  - chat: [ガチャ爆死太郎, 失敗したら？]
  - say: 失敗したら？ 殻を全部お皿のすみに集めて、見なかったことにします。
  - chat: [初見の旅人, ピムさんスタバは行かないの？]
  - say: スタバは、ほとんど行かないです。名前が長くて、注文する前に疲れちゃって。
  - chat: [手伝う派の夫, 呪文みたいなやつ]
  - say: 呪文みたいなやつ、そうそう。わたし、メニューの前で三回くらい言い直しました。
  - chat: [初見の旅人, 結局何頼んだの]
  - say: 結局何を頼んだか。「いちばん上のやつ」って言いました。店員さん、優しかったです。
  - ask:
      q: 好きなコーヒー屋さん、どこですか？
      options:
      - c: スタバ
        r:
        - 'スタバですね。'
        - '{name}さん、注文、すらすら言えますか？ コツがあったら教えてください。'
      - c: コメダ
        r:
        - 'コメダですね！'
        - '{name}さん、仲間です！ モーニング、行きました？'
      - c: ドトールかタリーズ
        r:
        - 'ドトールかタリーズですね。'
        - '{name}さん、どっちも駅の近くにありますよね。何を頼むんですか？'
      - c: 個人の喫茶店
        r:
        - '個人の喫茶店なんですね。'
        - '{name}さん、いいなあ。どんなお店か、ちょっと知りたいです。'
      npc: [[夜勤明けの人, 1], [初見の旅人, 0], [定時退社したい, 2], [ガチャ爆死太郎, 1]]
  - say: コメダが多い！ 仲間がいっぱいです。
- title: また飛ぶ：雑費の中身
  beats:
  - chat: [夜勤明けの人, 家計簿の雑費って何入ってるの]
  - say: 雑費の中身？ え、なんで今それを。
  - chat: [上の子もう中二, 前に七割スイーツって言ってた]
  - say: {face: annoyed, text: '「前に七割スイーツって言ってた」……先輩、覚えてなくていいことを覚えてますね。'}
  - say: ……はい。コンビニのスイーツです。夏はほぼミニストップのハロハロです。
  - chat: [初見の旅人, ハロハロ好きなんだ]
  - say: ハロハロ、好きなんです。1995年からあるって知って、夫に言ったんですよ。
  - say: 「歴史があるから、これは雑費じゃない」って。
  - chat: [ガチャ爆死太郎, じゃあ何費]
  - say: じゃあ何費か、夫にもそう聞かれました。答えられなくて、次の月も雑費に入れました。
  - chat: [手伝う派の夫, うちの妻も「その他」がスイーツ]
  - say: 奥さんも「その他」がスイーツ。やっぱり。みんな、そこに隠すんですね。
  - chat: [税理士事務所の繁忙期, 金額は把握してる？]
  - say: 金額は……把握してないです。見たくないので。
  - chat: [税理士事務所の繁忙期, それはちょっと]
  - say: 「それはちょっと」、分かってます。分かってるんですけど、雑費だけは見ないでいたいんです。
- title: 戻る：ふるさと納税の豚
  beats:
  - say: えっと……何の話でしたっけ。給食費から、どこまで来ました？
  - chat: [税理士事務所の繁忙期, 家計の話。ふるさと納税は？ 冷凍庫のやつ]
  - say: {face: surprised, text: 'ふるさと納税の、冷凍庫のやつ？ え、なんで知ってるんですか。'}
  - chat: [税理士事務所の繁忙期, 前に聞いた]
  - say: 前に聞いた……言いましたっけ。言ってましたね。
  - say: 豚肉の返礼品を三つの町に頼んだら、同じ週に三箱届いたんです。
  - chat: [初見の旅人, 冷凍庫パンパン]
  - say: 冷凍庫パンパン、豚で埋まりました。アイスを入れる場所がなくなって。
  - chat: [町中華の跡取り, 豚ならうちで引き取ったのに]
  - say: 町中華の跡取りさん、出席確認しました！ 豚なら引き取ったのに？ もっと早く言ってください。
  - say: それからは、届く月をずらして頼んでるんですよ。
  - say: で、今年。九月に頼んだ鶏と、十二月に頼んだ豚が、どっちも三月に届きました。
  - chat: [ガチャ爆死太郎, ずらした意味ｗ]
  - say: ずらした意味、ないですよね。向こうで揃っちゃったんです。
  - chat: [税理士事務所の繁忙期, ワンストップの申請書は出した？]
  - say: ワンストップの申請書、出しました。一月九日に。
  - chat: [税理士事務所の繁忙期, ぎりぎり。翌年の一月十日必着だよ]
  - chat: [初見の旅人, ワンストップって何]
  - say: ぎりぎりでした。で、ワンストップって何か。ふるさと納税の分を、確定申告しないで済ませる仕組みです。
  - say: ただ、使えるのは、もともと確定申告が要らない人で、寄付先が五つの自治体までのときです。
  - chat: [税理士事務所の繁忙期, 医療費控除とかで確定申告するなら、特例は無効。寄付も申告に書く]
  - say: 医療費控除とかで確定申告するなら、特例は使えない。うちは二人とも確定申告しないので、特例の方です。
  - say: で、申請書は一月十日までに届けないといけないんです。
  - say: 十二月に書いて、安心して、引き出しにしまってたんですよ。
  - chat: [上の子もう中二, 書いて安心するやつ]
  - say: 書いて安心するやつ、それです。九日に、郵便局まで走りました。唐揚げの匂いのまま。
  - chat: [税理士事務所の繁忙期, 間に合わなかったら確定申告ね]
  - say: 間に合わなかったら確定申告。はい。今年は十二月のうちに出します。
- title: 思い出した：十二月のシフト
  beats:
  - say: あ、十二月で思い出しました。パートのシフトの話。
  - chat: [税理士事務所の繁忙期, 年収の壁？]
  - say: 年収の壁、そうです。毎年十二月になると、お店の店長の顔が曇るんですよ。
  - say: 壁を超えないように、みんな十二月のシフトを減らすので。
  - chat: [町中華の跡取り, 年末にパートさん減るの、うちの店でもある]
  - say: 跡取りさんのお店でもある……。お店が一番人が欲しい月に、いなくなっちゃうんです。
  - chat: [税理士事務所の繁忙期, でも2025年分から変わったよ]
  - say: 2025年分から、変わりましたね。扶養に入れる目安が、百三万円から百二十三万円になって。
  - chat: [税理士事務所の繁忙期, 本人の所得税は2025年分なら160万まで]
  - say: 本人の所得税は百六十万まで、そうそう。でも社会保険の百三十万円の壁は、そのまま残ってるんですよね。
  - chat: [税理士事務所の繁忙期, 正解。2026年分はまた変わってるから気をつけて]
  - say: {face: annoyed, text: '正解！ でも2026年分はまた変わる？ 毎年変わると、覚えるのが追いつかないです。'}
  - chat: [税理士事務所の繁忙期, 毎年変わる。だから年を言うの]
  - say: 毎年変わるから、年を言う。だから繁忙期さん、いつも年を聞くんですね。今やっと分かりました。
  - say: 去年、店長に「十二月、出られます」って言ったら、泣きそうな顔してました。
  - chat: [定時退社したい, 喜んだんだ]
  - say: 喜んでくれました。でもわたし、計算を一回間違えてて。
  - chat: [税理士事務所の繁忙期, 何を]
  - say: 何をって、交通費を収入に入れてたんです。歩いて通ってるのに。
  - chat: [税理士事務所の繁忙期, 歩きなら交通費ないでしょ]
  - say: 歩きなら交通費はないです。表に「交通費」って欄を作ってたら、なんか入れたくなっちゃって。
  - chat: [ガチャ爆死太郎, 空欄が許せない人だ]
  - say: 空欄が許せない人、そうなんです。空いてると落ち着かなくて。まあ、直したので大丈夫です。
- title: 締め
  beats:
  - chat: [税理士事務所の繁忙期, そろそろ仕事戻る]
  - say: 仕事に戻るんですね。繁忙期さん、ありがとうございました。
  - chat: [税理士事務所の繁忙期, 二月と三月は来れないから、それまでに質問あれば]
  - say: 二月と三月は来れない、繁忙期ですもんね。がんばってください。
  - chat: [上の子もう中二, 給食費の紙はちゃんと払ってね]
  - say: 給食費の紙、ちゃんと払います。明日、口座に入れておきます。
  - chat: [初見の旅人, 今日コメダ行ってくる]
  - say: 初見さん、今日コメダ！ いってらっしゃい！ モーニングは午前中だけなので、気をつけてください。
  - say: じゃあ、今日はこのへんで。ピムでした。
