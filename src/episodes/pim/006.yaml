title: 夫婦で決めた「二人の日」は火曜と金曜（なのに夫が火曜にニンニクマシマシで帰ってきた）
# 2026-10-27 夜 v9：ユーザーの指示「ピムの性処理はもっとボカすか。健全にするか」で健全に書き直し。前の版は src/old/episodes-v8/pim/006.yaml。
# 「二人の日」＝夫婦でお茶を淹れて一週間の話をして、ちょっと夜ふかしする夜。中身はそれ以上言わない（大人が聞けば察する程度）。
# 性の行為・体の部位・時間・回数は出さない。夜の狩猟団が下ネタを振り、ピムが「ほうじ茶です」で健全に戻すのが繰り返しの笑い。
# 子ども（娘・保育園）は出さない（夫婦の回は子どもの回と分ける決まりのまま）。
# 2026-10-27 v10：Codex 二回目のレビューで直し（前の版は src/old/episodes-v9/pim/006.yaml）。「何の話してましたっけ」をやめ、チャットが話を戻す。水曜の件は「言葉の使い方なら勝てる」の勝ち負けをやめ、寝ぼけて先に出た一言にした。
# 脇道：カップヌードルは何味（likes の答え、ほかの配信者の答え）、いい夫婦の日（11月22日、1988年に余暇開発センターが提唱）。
parts:
- title: オープニング：今日は夫婦の話
  beats:
  - say: ピムです。こんにちは。
  - say: 今日は夫婦の話をします。夫の愚痴が八割です。
  - chat: [夜の狩猟団, 待ってた]
  - say: 夜の狩猟団さん、出席確認しました。「待ってた」って、何をですか。
  - chat: [夜の狩猟団, 夫婦の夜の話]
  - say: {face: annoyed, text: '夫婦の夜の話……期待しないでください。今日は健全です。お茶の話です。'}
  - chat: [手伝う派の夫, こんにちは。夫の愚痴、ちょっとこわい]
  - say: 手伝う派の夫さん、こんにちは。夫の愚痴がこわい？ 夫の話なので、こわがっていいです。
  - chat: [初見の旅人, 初見です。サキュバスの配信？]
  - say: 初見の旅人さん、いらっしゃいませ！ サキュバスの配信か、って。サキュバスです。主婦です。
  - say: 夫はインキュバスで、お城の門番をしてます。
  - chat: [初見の旅人, サキュバスとインキュバスの夫婦って、毎晩すごそう]
  - say: {face: annoyed, text: '「毎晩すごそう」、みんなそう言うんですよ。実際は、毎晩洗濯物をたたんでます。'}
  - chat: [好感度ノーマル止まり, こんにちは。夫婦回だ]
  - say: 好感度ノーマル止まりさん、出席確認しました！ はい、夫婦回です。
- title: 本題っぽいもの：火曜のニンニクマシマシ
  beats:
  - say: まず、先週の火曜の話なんですけど。
  - say: 夫が帰ってきたら、門のところからもう匂ったんです。ニンニクが。
  - chat: [町中華の跡取り, こんにちは。二郎だ]
  - say: 町中華の跡取りさん、出席確認しました。「二郎だ」、正解です。二郎系です。
  - say: ああいうお店って、食べる前に「ニンニク入れますか？」って聞かれるんですよ。
  - say: そこでヤサイとかアブラとか、追加を言うんです。ネットだと「呪文」って呼ばれてて。
  - chat: [初見の旅人, 呪文ってそういうことか]
  - say: 呪文、そういうことです。で、夫はそこで「ニンニクマシマシ」って言ったそうです。火曜日に。
  - chat: [初見の旅人, 火曜だと何かあるの？]
  - say: 火曜だと何かあるか。うち、火曜と金曜はニンニク禁止なんです。夫婦で決めてて。
  - chat: [夜の狩猟団, 分かった]
  - say: 「分かった」って、分からないでください。まだ何も言ってないです。
  - chat: [好感度ノーマル止まり, なんで火曜と金曜？]
  - say: なんで火曜と金曜か。その日は「二人の日」なんです。
  - say: 夜に二人でお茶を淹れて、一週間の話をして、ちょっと夜ふかしする日です。
  - chat: [夜の狩猟団, つまり……]
  - say: {face: smug, text: 'つまり……ほうじ茶です。'}
  - chat: [ガチャ爆死太郎, ほうじ茶ｗ]
  - say: ほうじ茶です、笑わないで。隣に座って話すので、ニンニクは困るんですよ。
  - chat: [初見の旅人, 曜日決めてるの！？]
  - say: 曜日、決めてます。決めないと、夫が毎晩「ちょっと話そう」って夜中まで起きてるので。
  - chat: [夜の狩猟団, インキュバスだからね]
  - say: 「インキュバスだから」、関係ないです。あの人はただの夜型です。
  - say: わたし、パートで朝早いんですよ。お弁当屋さんの揚げ場なので。
  - chat: [定時退社したい, どうやって決めたの]
  - say: どうやって決めたか。一週間の予定を全部並べて、次の朝に二人とも早く起きなくていい日を探しました。
  - say: 夫の最初の案は「毎晩」、わたしの最初の案は「年末に一回」でした。
  - chat: [ガチャ爆死太郎, 差がすごいｗ]
  - say: 差がすごい、すごかったです。話し合いの空気が凍りました。
  - say: そこから二人で寄せて、火曜と金曜。三時間かかりました。
  - chat: [好感度ノーマル止まり, ちゃんと話し合ってるのいいな]
  - say: 話し合ってるのいい、って言ってもらえた。決まった日、夫が花を一本買ってきたんですよ。
  - chat: [好感度ノーマル止まり, 優しいじゃん]
  - say: {face: shy, text: '優しいじゃん、って。優しいんです。そういうところはあるんです。'}
  - chat: [定時退社したい, 曜日決めてる夫婦って珍しくない？]
  - say: 曜日を決めてる夫婦、珍しいかもです。でも、決めないと話す時間ってなくなりません？
  - say: 平日って、ご飯食べて、片付けて、お風呂で、もう寝る時間なんですよ。
  - chat: [手伝う派の夫, 分かる。うち、会話が「ゴミ出した？」だけの日ある]
  - say: 会話が「ゴミ出した？」だけ！ それです！ 業務連絡だけで一日が終わるんです。
  - chat: [税理士事務所の繁忙期, こんにちは。繁忙期は業務連絡すらない]
  - say: 税理士事務所の繁忙期さん、出席確認しました。業務連絡すらない……三月はそうなりますよね。
  - chat: [好感度ノーマル止まり, 11月22日がいい夫婦の日だよね]
  - say: 11月22日、いい夫婦の日。語呂合わせで、1988年に余暇開発センターっていうところが言い出したそうです。
  - say: 年に一回なんですよ、いい夫婦の日。
  - say: うちは週に二回やってるので、年に百回くらい、いい夫婦です。
  - chat: [ガチャ爆死太郎, 計算が強引ｗ]
  - say: 計算が強引、でいいです。数えたことはないです。
  - chat: [夜の狩猟団, で、二人の日って本当にお茶だけ？]
  - say: {face: annoyed, text: '本当にお茶だけか？ お茶だけです。あとおせんべい。夜の狩猟団さん、その先は聞かないでください。'}
  - say: で、話を戻すと、火曜にマシマシです。
  - chat: [町中華の跡取り, 聞かれたら答えるのがお店の作法ではある]
  - say: 聞かれたら答えるのがお店の作法……。それは守ってるんですよね。家の決まりを破ってるだけで。
  - chat: [手伝う派の夫, 曜日を忘れてたのでは]
  - say: 曜日を忘れてた説。当たりです。玄関に入って、「あ、火曜か」って言いました。
  - chat: [夜の狩猟団, で、どうなったの]
  - say: どうなったか。どうにもなりません。その日は、お茶は別々の部屋で飲みました。
  - say: 夫、ベランダで一人で歯を三回磨いてました。
  - chat: [手伝う派の夫, 三回はかわいい]
  - say: 三回はかわいい……三回目のとき、わたしもちょっと思いました。思っただけですけど。
- title: 脇道：カップヌードルは何味
  beats:
  - chat: [ガチャ爆死太郎, 二郎の話してたらカップ麺食べたくなった]
  - say: カップ麺食べたくなった、分かります。わたしも今、ちょっとお腹すいてきました。
  - chat: [ガチャ爆死太郎, カップヌードル何味派？]
  - say: 何味派か？ しょうゆです。普通のやつ。
  - chat: [夜勤明けの人, こんにちは。シーフード一択]
  - say: 夜勤明けさん、出席確認しました。シーフード一択なんですね。
  - say: 夫もシーフードなんですよ。家に買い置きするとき、毎回それで揉めます。
  - chat: [初見の旅人, 両方買えばいいのでは]
  - say: 両方買えばいい、って思うじゃないですか。夫がしょうゆの方も食べるんです。シーフードが先になくなったからって。
  - chat: [夜勤明けの人, しょうゆは少数派なのか]
  - say: しょうゆは少数派、みたいです。くやしいので、今度シーフードも食べてみます。
  - say: カップヌードルって、三分を計らなくても待てるんですよ、わたし。
  - chat: [好感度ノーマル止まり, ピムさん何でも計りそうなのに]
  - say: 何でも計りそう？ 料理は全部量るんですけど、カップヌードルだけは何となくで食べます。
  - chat: [町中華の跡取り, 父もカップ麺は時間見ない]
  - say: お父さんも時間見ない！ 休みの日はカップ麺なんでしたっけ。
  - chat: [町中華の跡取り, そう。二分で食べ始める]
  - say: 二分で食べ始める！ かためが好きなんですかね。
  - chat: [夜勤明けの人, 夜勤明けは五分待って伸ばす派]
  - say: 五分待って伸ばす派もいるんですね。それはそれでおいしそうです。
  - ask:
      q: カップヌードル、何味が好きですか？
      options:
      - c: しょうゆ
        r:
        - 'しょうゆですね！'
        - '{name}さん、仲間です！ 少数派同士です。'
      - c: シーフード
        r:
        - 'シーフードですね。'
        - '{name}さん、夫と同じですね。買い置き、取られないようにしてください。'
      - c: カレー
        r:
        - '{name}さん、カレー！ 誰もいなかったです。新しい派です。'
      - c: カップ麺は食べない
        r:
        - 'カップ麺は食べないんですね。'
        - '{name}さん、そういう人もいますよね。'
      npc: [[ガチャ爆死太郎, 2], [夜勤明けの人, 1], [初見の旅人, 0], [夜の狩猟団, 1]]
  - say: シーフードが多い……。しょうゆ、やっぱり少数派でした。
- title: 戻る：水曜日の件
  beats:
  - chat: [夜の狩猟団, で、夫婦の夜の話の続きは？]
  - say: 「夫婦の夜の話の続き」じゃなくて、二人の日です。言い方を変えないでください。
  - say: 先月、水曜日にあったことがあって。水曜日ですよ。
  - chat: [定時退社したい, 決まりの曜日じゃない]
  - say: 決まりの曜日じゃないんです。わたしがもう寝てたら、夫が肩をとんとんしてきて。
  - say: 「起きて。今日、金曜だよね？」って。お茶を二つ持って。
  - chat: [好感度ノーマル止まり, 曜日まちがえてるｗ]
  - say: 曜日、まちがえてるんです。わたし、寝ぼけたままカレンダーを指さしました。
  - say: 夫、じっと見て、「あ、水曜か」って。それで、お茶を二つとも自分で飲みました。
  - chat: [夜勤明けの人, 二つともｗ]
  - say: 二つともです。しかも自分の部屋に戻るとき、「おやすみ」って言ったんですよ。
  - chat: [夜勤明けの人, 起こしておいてｗ]
  - say: {face: annoyed, text: '起こしておいて、ですよね！'}
  - say: わたし、曜日より先に、「おやすみじゃないです」って言っちゃいました。
  - say: もう目が覚めてるんですけど、って。
  - chat: [ガチャ爆死太郎, そっちｗ]
  - say: 「そっち」って言われても、そっちが先に出ちゃったんです。寝ぼけてたので。
  - say: 夫は「ごめん、おやすみ」って、もう一回言って戻っていきました。
  - chat: [夜勤明けの人, そのあと寝られた？]
  - say: そのあと寝られたか。寝られませんでした。そのまま朝になって、唐揚げを揚げに行きました。
  - chat: [初見の旅人, 起こす前にLINEで聞けば？]
  - say: LINEで聞けば？って、来るんですよ、LINEは。同じ家にいるのに、「今日、二人の日だっけ？」って。
  - chat: [初見の旅人, 歩いて聞きに来ればいいのにｗ]
  - say: '寝てる日はLINEでいいんです。起きてる日は、それこそ歩いて来てほしい。'
  - say: 歩いて聞きに来ればいいのに、ですよね。隣の部屋まで五歩。五歩をLINEで済ませるんです。
  - chat: [初見の旅人, 既読つけたらOKってこと？]
  - say: 既読つけたらOK？ 違います。既読は「読んだ」だけです。「いいよ」じゃないです。
  - chat: [税理士事務所の繁忙期, うちの所長も既読で返事した気になってる]
  - say: 所長さんも、既読で返事した気に……いますよね、そういう人。
  - chat: [夜の狩猟団, 返事は何て送ったの]
  - say: 何て返したか。「水曜です」って送りました。スタンプなしで。
  - chat: [手伝う派の夫, スタンプなしはこわい]
  - say: スタンプなしはこわい、そうなんです。次の日、夫は自分から正座してました。わたしが「ガルドさん」って呼ぶ前に。
  - chat: [手伝う派の夫, 正座ｗ]
  - say: うち、わたしが夫を「さん」付けで呼ぶと、本気で怒ってる合図なんですよ。
  - say: 夫はそれが分かってるので、呼ばれる前に座るんです。
- title: また飛ぶ：「座ってるだけでいいよ」
  beats:
  - say: あと、夫がよく言うことがあって。
  - say: わたしが疲れてると、「疲れてるなら、今日は座ってるだけでいいよ」って。
  - say: お茶もおせんべいも、俺がやるからって。
  - chat: [好感度ノーマル止まり, 優しいじゃん]
  - say: {face: annoyed, text: '優しいじゃん、って言うでしょう。優しいんです。それが嫌なんです。「だけでいい」が。'}
  - chat: [好感度ノーマル止まり, 楽させようとしてくれてるのでは]
  - say: 楽させようとしてくれてる、分かってます。優しさなのは分かってるんです。
  - say: でも、お茶の葉の量とか、お湯の温度とか、わたしが決めてるんですよ。
  - say: 「座ってるだけでいい」って言われると、それが軽く見られた気がして。
  - chat: [夜の狩猟団, サキュバスなら楽な方がうれしいのでは]
  - say: サキュバスなら楽な方がうれしい？ 違うんです。サキュバスにも、ちゃんとやりたい気持ちはあるんです。お茶を。
  - chat: [夜の狩猟団, お茶を]
  - say: お茶をです。夜の狩猟団さん、今、別の言葉を入れようとしましたね。
  - chat: [町中華の跡取り, 父も「半チャンでいいよ」って言われると怒る]
  - say: {face: surprised, text: '「半チャンでいいよ」で怒るんですか？'}
  - chat: [町中華の跡取り, 半チャンも全力で振ってるのにって]
  - say: 半チャンも全力で振ってる……お父さんの気持ち、分かります。
  - say: わたしもお弁当屋さんで「冷めててもいいよ」って言われると、揚げ直したくなります。
  - say: ……なんか言ってて、自分が面倒な妻だなって思いました。
  - chat: [手伝う派の夫, 俺も妻に「晩ごはん適当でいいよ」って言っちゃってた]
  - say: 「晩ごはん適当でいいよ」……あ、それ、作る側は困るやつです。
  - chat: [手伝う派の夫, 気をつかったつもりだった]
  - say: 気をつかったつもり、それは伝わってると思いますよ。
  - say: でも「適当」って言われると、何が適当なのか一時間くらい迷うんです。
  - chat: [手伝う派の夫, 次から「どうしたい？」って聞く]
  - say: {face: smile, text: '次から「どうしたい？」って聞く。それ、いいと思います。夫にも言ってみます。'}
  - chat: [夜の狩猟団, 座ってるだけでいいって言われたら、どうしたいって返せばいいのでは]
  - say: 「どうしたい？」って返せばいい……夜の狩猟団さん、今日はまともなこと言いますね。
  - ask:
      q: 「疲れてるなら座ってるだけでいいよ」って言う夫、どう思いますか？
      options:
      - c: 優しいと思う
        r:
        - '{name}さん、夫の味方ですね。優しさとして受け取る練習、わたしもした方がいいのかも。'
      - c: ちょっと失礼
        r:
        - '{name}さん、わたしと同じ気持ちです。'
      - c: 二人とも面倒くさい
        r:
        - '{name}さん、たぶん合ってます。うちは面倒くさい二人です。'
      npc: [[夜の狩猟団, 2], [好感度ノーマル止まり, 0], [ガチャ爆死太郎, 2], [手伝う派の夫, 0], [町中華の跡取り, 1]]
- title: 締め
  beats:
  - say: 優しいと、面倒くさいが同じ数……。面倒くさい二人、当たってます。そろそろ時間です。
  - chat: [夜の狩猟団, ところで今日は何曜日？]
  - say: 今日は何曜日か……。金曜日です。
  - chat: [夜の狩猟団, あっ]
  - say: {face: annoyed, text: '「あっ」じゃないです。今夜は豚の生姜焼きと、ほうじ茶です。'}
  - chat: [町中華の跡取り, ニンニクは？]
  - say: ニンニクは、入れません。金曜なので。
  - say: {face: shy, text: '……夫、もうお湯わかしてるかもです。ピムでした。'}
