title: 夫が洗濯物を干してくれた……って言っちゃう話（結婚記念日の町中華と、喜多方の計画も）
# 2026-10-27 夜 v8：10〜15分の雑談の形に作り直し。もとは v7 の 002 の前半（洗濯、「手伝う」、結婚記念日、喜多方）。
# 本題：夫の洗濯と、やり直してしまうわたし。脇道：靴下の色（likes・stories.fac_sock_color、ほかの配信者の答え）、洗濯物をたたむか（stories.home_laundry_fold）。
# 夫婦の話だが、「二人の日」の話は出さない（それは 006）。
# 2026-10-27 v10：Codex 二回目のレビューで直し（前の版は src/old/episodes-v9/pim/007.yaml）。洗濯表示は 2024年の改正で43種類（出典 src/sources/pim/facts.md）。「何の話してたっけ」をやめ、チャットの質問でそのまま次へ。
parts:
- title: オープニング：ベランダの靴下
  beats:
  - say: ピムです！ こんにちは。
  - say: 今朝、すごく珍しいことがあって。夫が洗濯物を干してくれたんです。
  - chat: [手伝う派の夫, こんにちは。えらいじゃん]
  - say: 手伝う派の夫さん、出席確認しました。「えらいじゃん」、えらいんですよ。ベランダに出るまでは。
  - chat: [手伝う派の夫, 何があった]
  - say: 何があったか。靴下が全部、丸まったまま干してありました。
  - chat: [ガチャ爆死太郎, こんにちは。丸まった靴下は乾かない]
  - say: 「丸まった靴下は乾かない」！ ガチャ爆死太郎さん、分かってくれますか。
  - say: あと、シャツが全部裏返しでした。
  - chat: [手伝う派の夫, ……裏返しはだめなの？]
  - say: {face: surprised, text: '裏返しはだめなの、って……え、そこからですか？'}
  - chat: [手伝う派の夫, うちの妻は裏返しで干せって言う]
  - say: 奥さんは裏返しで干せって言う。あ、言いますね。色あせしないように、わざと裏で干す家もあります。
  - say: じゃあ裏返しはいいです。うちのやり方と違っただけでした。
  - say: でも靴下は、どこの家でもだめだと思います。
  - chat: [上の子もう中二, こんにちは。丸まった靴下はうちの中学生もやる]
  - say: 先輩、出席確認しました。丸まった靴下、中学生もやるんですか。
  - chat: [上の子もう中二, 脱いだ形のまま洗濯機に入ってる]
  - say: 脱いだ形のまま……。それ、夫と同じです。
  - say: 夫、去年の冬はセーターを乾燥機に入れたんですよ。
  - chat: [夜勤明けの人, こんにちは。縮んだ]
  - say: 「縮んだ」、はい、縮みました。袖が夫の腕の半分くらいになって。
  - say: 洗濯表示見なかったの？って聞いたら。
  - say: {face: annoyed, text: '「四角の中に丸があってバツが付いてるのは、おにぎり禁止だと思ってた」って。'}
  - chat: [ガチャ爆死太郎, おにぎり禁止ｗｗ]
  - say: おにぎり禁止、ですよ。何を禁止してると思ったんでしょうね、セーターに。
  - say: 四角に丸は、乾燥機のことなんです。バツが付いてたら、入れちゃだめ。
  - chat: [初見の旅人, 初見です。あの記号そういう意味だったんだ]
  - say: 初見の旅人さん、いらっしゃいませ！ あの記号、そういう意味なんです。
  - chat: [初見の旅人, 家紋だと思ってた]
  - say: 家紋だと思ってた……。洗濯物に家紋は付いてないです。
  - say: 洗濯表示って、2016年の十二月に新しくなったんですよ。
  - say: 前は二十二種類だったのが、四十一種類に。
  - chat: [夜勤明けの人, 倍近い]
  - say: 倍近い、そうなんです。しかも2024年にまた二つ増えて、今は四十三だそうです。
  - say: 手洗いの温度のとか、アイロンのとか。わたしも全部は覚えてないです。
  - say: 夫はおにぎりだけ覚えてます。
  - chat: [町中華の跡取り, こんにちは。桶の数字は？]
  - say: 町中華の跡取りさん、出席確認しました！ 桶の数字ですね。
  - say: 桶の数字は、お湯の温度の上限です。40なら40度まで。
  - chat: [町中華の跡取り, 父は厨房の白衣、全部一番熱いので洗ってる]
  - say: お父さんの白衣は全部一番熱いので。白衣は、たぶんそれでいいんだと思います。セーターはだめでした。
- title: 本題っぽいもの：「干してくれた」って言っちゃう
  beats:
  - chat: [手伝う派の夫, でも干してくれただけ、えらいと思うけどなあ]
  - say: 「干してくれただけ、えらい」……そこなんですよ、手伝う派の夫さん。
  - say: わたし今、「干してくれた」って言いましたよね。
  - chat: [手伝う派の夫, 言ってた]
  - say: 言ってましたよね。「くれた」って言った時点で、洗濯はわたしの仕事ってことになってるんです。
  - chat: [手伝う派の夫, あ、「手伝う」と同じだ]
  - say: 「手伝う」と同じ、そうなんです。手伝う、って言うと、家事の持ち主はわたしになっちゃうので。
  - chat: [手伝う派の夫, 名前変えようかな]
  - say: 名前変えようかな、って！ 変えなくていいですよ。その名前のまま来てください。
  - chat: [定時退社したい, ピムさんは旦那に「やって」って言ってるの？]
  - say: 旦那に「やって」って言ってるか。言ってます。「手伝うじゃなくて、やって」って。
  - chat: [手伝う派の夫, で、旦那さんがやると？]
  - say: 旦那さんがやると……。
  - chat: [手伝う派の夫, やり直すでしょ]
  - say: {face: surprised, text: '「やり直すでしょ」って、なんで分かるんですか！'}
  - chat: [手伝う派の夫, うちもそう。やり直されると、もういいかってなる]
  - say: やり直されると、もういいかってなる……うわあ……。
  - say: 夫も去年、ほとんど同じこと言ってました。
  - say: 「どうせやり直すなら、最初からピムがやった方が早いでしょ」って。
  - chat: [夜勤明けの人, 刺さってる]
  - say: 刺さってる、刺さってます。今朝も、靴下を全部干し直しました。夫が見てる前で。
  - chat: [手伝う派の夫, 言いすぎた、ごめん]
  - say: 言いすぎた、ごめんって、いえ、言いすぎじゃないです。本当のことなので。
  - say: 夫がやらなくなった理由の半分は、わたしなんですよね。分かってるんです。
  - chat: [好感度ノーマル止まり, こんにちは。靴下だけ二人で干し直したら？]
  - say: 好感度ノーマル止まりさん、出席確認しました。靴下だけ二人で干し直す……？
  - chat: [好感度ノーマル止まり, 一人でやり直すからダメなんじゃない？]
  - say: 一人でやり直すからダメ。あ、なるほど。二人でやれば、やり直しじゃなくなりますね。
  - say: それなら、夫にも頼めそうです。
- title: 脇道：靴下の色と、たたむかどうか
  beats:
  - chat: [ガチャ爆死太郎, 靴下って何色？]
  - say: 靴下の色？ うちは家族全員、白です。
  - chat: [夜勤明けの人, 白は汚れが目立つ]
  - say: 白は汚れが目立つ、目立ちます。でも洗えば白に戻るので、わたしは好きなんです。
  - say: ただ、全員白なので、誰のか分からなくなるんですよ。
  - say: サイズで分けようとしたら、夫とわたし、同じサイズでした。
  - chat: [ガチャ爆死太郎, 足のサイズ同じなのか]
  - say: 足のサイズ、同じだったんです。夫の方が大きいと思ってたのに。
  - say: だから今、夫の靴下のかかとに、黒いペンで点を一個打ってます。
  - chat: [定時退社したい, 旦那さん気づいてる？]
  - say: 旦那さん気づいてるか？ 気づいてないです。半年くらい。
  - chat: [夜勤明けの人, 全部同じ黒にすれば？]
  - say: 全部同じ黒にすれば、って。モーラさんとエラさんとノクスさんが、それなんですよ。
  - say: 片方なくしても困らないって、モーラさんが言ってました。
  - chat: [初見の旅人, 黒が楽なのは分かる]
  - say: 黒が楽なのは分かる、楽ですよね、絶対。
  - say: リゼ様とヴェスパさんは、色とか柄なんです。ヴェスパさんは緑が多いって。
  - chat: [ガチャ爆死太郎, 色柄は片方なくすとつらい]
  - say: 色柄は片方なくすとつらい？ リゼ様は「左右違っても、柄なら言い訳になる」っておっしゃってました。
  - chat: [夜勤明けの人, リゼ様それでいいのかｗ]
  - ask:
      q: 靴下の色、そろえてますか？
      options:
      - c: 全部同じ黒
        r:
        - '全部同じ黒ですね。'
        - '{name}さん、モーラさんたちと同じですね。片方なくしても平気なやつです。'
      - c: 色や柄
        r:
        - '色や柄で選ぶんですね。'
        - '{name}さん、リゼ様とヴェスパさんの側ですね。左右、そろってますか？'
      - c: 白
        r:
        - '白ですね！'
        - '{name}さん、うちと同じです！ 誰のか分からなくなりません？'
      - c: 気にしたことない
        r:
        - '気にしたことない、ですか。'
        - '{name}さん、それも楽でいいですね。'
      npc: [[ガチャ爆死太郎, 0], [夜勤明けの人, 0], [手伝う派の夫, 3], [初見の旅人, 1]]
  - chat: [手伝う派の夫, たたむのは誰がやってる？]
  - say: 黒が多いですね。……たたむのは誰か？ わたしです。夫がたたんでくれた日もあったんですけど。
  - say: タオルが四つ折りだったんですよ。うち、三つ折りなんです。
  - chat: [上の子もう中二, まさか]
  - say: そのまさかです。全部たたみ直しました。
  - chat: [手伝う派の夫, それは旦那さんやらなくなる]
  - say: それは旦那さんやらなくなる、はい。次の週から、たたまなくなりました。
  - say: ……今日、さっきから同じ話しかしてないですね、わたし。
  - chat: [ガチャ爆死太郎, やり直しの話しかしてないｗ]
  - say: やり直しの話しかしてない、してないです。自分で言ってて、ちょっと耳が痛いです。
- title: 夫のいいところ：結婚記念日
  beats:
  - chat: [好感度ノーマル止まり, 旦那さんのいいところはないの？]
  - say: 旦那さんのいいところ？ ありますよ。あります。
  - say: 結婚記念日だけは、毎年二人で外食するんです。毎年同じお店で。
  - chat: [好感度ノーマル止まり, おしゃれなとこ？]
  - say: おしゃれなとこ……町中華です。
  - chat: [町中華の跡取り, それでいい]
  - say: 「それでいい」って、跡取りさんにそう言ってもらえると、ほっとします。
  - say: 夫は毎年、瓶ビールを頼むんです。そのお店では、わたしはお茶なんですけど。
  - chat: [夜勤明けの人, ピムさん飲まないの？]
  - say: わたしは飲まないのか。家で土曜に一本だけです。外だと、帰りに娘を迎えに行くので。
  - say: お店のおばさんが、毎年グラスを二つ持ってきてくれるんですよ。
  - chat: [町中華の跡取り, うちの母もそうする]
  - say: 跡取りさんのお母さんもそうする！ わたし、あの二つ目のグラス、毎年うれしくて。
  - chat: [夜勤明けの人, 店の人、覚えてくれてるんだ]
  - say: {face: shy, text: '店の人、覚えてくれてるみたいです。何も言わなくても二つ来るので。'}
  - say: わたしは毎年、天津飯の塩です。
  - say: 一年目に塩を頼んだら、夫が「え、塩？」って言ったんですよ。甘酢派だったので。
  - chat: [ガチャ爆死太郎, で？]
  - say: で、どうなったか。わたしのを一口食べて、二年目から夫も塩になりました。
  - chat: [町中華の跡取り, 伝票は？]
  - say: {face: smug, text: '伝票ですか？ 毎年「天塩2、ビ1」です。'}
  - chat: [町中華の跡取り, ビ1ｗ]
  - say: ビ1、です。帰り道で夫が毎年、「来年も天塩2な」って言うんです。それだけなんですけど。
- title: また飛ぶ：喜多方の計画書
  beats:
  - chat: [町中華の跡取り, そういえば喜多方はまだ？]
  - say: 喜多方はまだ……まだです。跡取りさん、覚えてました？
  - chat: [初見の旅人, 喜多方？]
  - say: 喜多方っていうのは、福島の喜多方です。朝からラーメン屋さんが開いてる町なんですよ。朝ラーって言って。
  - chat: [初見の旅人, 朝からラーメン]
  - say: 朝からラーメン、です。坂内食堂っていうお店が、朝七時に開くんです。
  - say: そこに一人で行って、熱いラーメンを、伸びる前に最後まで食べたいんです。
  - chat: [夜勤明けの人, 一人で？]
  - say: 一人で？って、一人でです。ここ何年も、ラーメンを熱いうちに食べ終えたことがなくて。
  - say: 家族の分を先に取り分けてると、自分のが伸びちゃうんですよ。
  - chat: [上の子もう中二, 分かる。母親の麺はいつも伸びてる]
  - say: 母親の麺はいつも伸びてる……先輩も。そうなんですよね。
  - say: 計画書はあるんです。始発の時刻も、お店の開く時刻も、帰りの電車も書いてあって。
  - chat: [手伝う派の夫, 行けばいいのに]
  - say: 行けばいいのに、ですよね。……家が回らないので。って、ずっと言ってたんです。
  - say: 先週、計画書を開いたら、付箋が貼ってあって。夫の字で。
  - chat: [好感度ノーマル止まり, なんて]
  - say: なんて書いてあったか。「始発、ダイヤ変わってた。二分早い」。
  - chat: [好感度ノーマル止まり, 旦那さん……]
  - say: 旦那さん……ですよね。こっそり時刻表で確かめてたんですよ。献立表は読まないのに。
  - say: その下にもう一行あって。「その日の家のことは全部やる。やり直し禁止」。
  - chat: [手伝う派の夫, やり直し禁止ｗ]
  - say: {face: shy, text: 'やり直し禁止、だそうです。わたしの方が言われちゃいました。'}
  - chat: [町中華の跡取り, 行ってきて。報告して]
  - say: 行ってきて、報告して、って。行きます。来月、行こうと思ってます。
  - chat: [手伝う派の夫, その日、丸まった靴下があったら？]
  - say: その日、丸まった靴下があったら……触りません。たぶん。がんばります。
- title: 締め
  beats:
  - say: よし、今日はこのへんで。
  - say: 夕方、靴下を取り込むとき、夫を呼んでみます。二人で。
  - chat: [好感度ノーマル止まり, 報告待ってる]
  - say: 報告待ってる、はい、また話します。
  - chat: [ガチャ爆死太郎, 喜多方の報告もな]
  - say: 喜多方の報告も、そっちもです。ピムでした！
