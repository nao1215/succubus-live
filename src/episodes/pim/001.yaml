title: 【子育て回】娘の昼寝中に小声で雑談。保育園のおむつ、一枚ずつ名前を書いてます
family: true
# 2026-10-27 夜 v8：10〜15分の雑談の形に作り直し。もとは v7 の 001（src/old/episodes-v7/pim/001.yaml）の冒頭・名前付け・おやつの規則。
# 本題：保育園の名前付け。脇道：きのこの山とたけのこの里（likes の答えと stories）、おやつの決まりの穴。
# 子どもの回なので、性的な話・夜の狩猟団は出さない（family: true）。
# 2026-10-27 v10：Codex 二回目のレビューで直し（前の版は src/old/episodes-v9/pim/001.yaml）。きのこたけのこの全員紹介は、この回にだけ残す。
parts:
- title: オープニング：寝かしつけのあと
  beats:
  - say: ピムです。小声でやります。
  - say: 隣の部屋で、娘がやっと寝ました！ 寝かしつけ四十二分です。
  - chat: [上の子もう中二, こんにちは。四十二分は長いね]
  - say: 上の子もう中二さん、出席確認しました！ 「長いね」って、長かったです！
  - say: うち、来てくれた人の名前を呼ぶのが挨拶なんです。出席確認です。
  - chat: [上の子もう中二, 知ってる。毎回されてる]
  - say: 「毎回されてる」。はい、毎回してます！ 先輩は皆勤賞です。
  - say: 絵本読んで、歌って、背中をとんとんしてたら、腕が痛くなっちゃって。
  - chat: [手伝う派の夫, こんにちは。とんとんは腕にくる]
  - say: 手伝う派の夫さん、こんにちは！ 「とんとんは腕にくる」、きますよね。今、左手でマウス持ってます。
  - chat: [手伝う派の夫, 旦那さんは？]
  - say: {face: annoyed, text: '旦那さんは、って。それ聞いちゃいます？ 聞いてくださいよ。'}
  - say: 寝息が聞こえて、そーっと立ったんですよ。その直後です。
  - say: 夫が廊下を歩いてきたんです。
  - chat: [上の子もう中二, あっ]
  - say: そう、「あっ」です。うちの廊下、真ん中の板が鳴るんです。ぎいって。
  - say: 鳴る場所、紙に描いて壁に貼ってあるんですよ。赤い丸で。
  - chat: [手伝う派の夫, 踏んだ？]
  - say: ど真ん中を踏みました。
  - chat: [ガチャ爆死太郎, 狙ってるだろそれ]
  - say: 狙ってないと思います！ 思いたいです！
  - say: 娘の眉毛がぴくって動いて、わたしの心臓が止まりました。
  - chat: [夜勤明けの人, 起きた？]
  - say: 起きませんでした。眉毛だけで済みました。
  - chat: [夜勤明けの人, で、旦那さん何しに来たの]
  - say: 何しに来たか？ 「お昼なに？」です。
  - chat: [定時退社したい, それだけｗ]
  - say: それだけなんです！ 献立表、冷蔵庫に貼ってあるのに。
  - say: 毎週日曜に書いてるんです。夫は一回も読んでません。
  - chat: [手伝う派の夫, ごめん、うちも妻に聞いちゃう]
  - say: {face: surprised, text: 'え、「うちも妻に聞いちゃう」？ 手伝う派の夫さんもですか！'}
  - chat: [手伝う派の夫, 聞いた方が会話になるかなって]
  - say: 「聞いた方が会話になる」……。あれ、会話だったんですか。
  - say: 毎日まったく同じ会話してますけど、会話ではありますね。うん。
  - chat: [寝てない育休中, こんにちは。いま授乳おわった]
  - say: 寝てない育休中さん、出席確認しました。授乳おわったところ？ お疲れさまです。
  - say: 小声なので、流し聞きでどうぞ。
- title: 本題っぽいもの：おむつ一枚ずつに名前
  beats:
  - say: で、昨日の夜なんですけど。
  - say: 保育園の持ち物に、名前を二時間書いてました。
  - chat: [上の子もう中二, 新学期でもないのに？]
  - say: 新学期じゃないんです。おむつの新しい袋を開けたんです。うちの園、一枚ずつに名前なんですよ。
  - chat: [寝てない育休中, 一枚ずつ！？]
  - say: 一枚ずつです。育休中さんにも、たぶんそのうち来ます。
  - chat: [寝てない育休中, こわい]
  - say: こわいですよね。大丈夫です、手は慣れます。心はまだ慣れてません。
  - chat: [手伝う派の夫, スタンプ使わないの？]
  - say: スタンプ、使ってます！ お名前スタンプ。ゴムの判子に名前が並んでるやつです。
  - say: 布用と紙用とおむつ用で、インクが三つあるんです。ちょっと自慢です。
  - chat: [初見の旅人, 初見です。おむつにも押せるんだ]
  - say: 初見の旅人さん、いらっしゃいませ！ そう、おむつにも押せるんですよ。
  - say: ただ、たまににじむんです。にじむと「ミミ」が「ミ三」になります。
  - chat: [ガチャ爆死太郎, ミ三ちゃんｗ]
  - say: ミ三ちゃんです。先生はちゃんとミミのだって分かってくれます。
  - chat: [ガチャ爆死太郎, 次はミ四ちゃん]
  - say: {face: annoyed, text: 'ミ四ちゃんって！ 増やさないでください！ 一人で手一杯です！'}
  - chat: [上の子もう中二, 名前はどこに書く派？]
  - say: {face: smug, text: 'どこに書く派か？ 右上です。ひらがなで、黒。これは譲れません。'}
  - say: 決めとかないと、夫が好きな所に書くんですよ。
  - say: 去年、夫に体操服の名前を頼んだら。
  - chat: [手伝う派の夫, 何した]
  - say: 背中に、でっかく、カタカナで「ミミ」。
  - chat: [定時退社したい, ユニフォームじゃん]
  - say: ユニフォームなんです！ 背番号がないだけです。
  - say: でも運動会で、遠くからでもすぐ見つかったんですよ。くやしいけど便利でした。
  - chat: [手伝う派の夫, 結果オーライでは]
  - say: 結果はオーライでした。わたしの気持ちはオーライじゃないです。
  - chat: [上の子もう中二, 中学になると名前書かなくてよくなるよ]
  - say: {face: surprised, text: '中学は名前書かなくていいんですか、先輩！ 楽になります？'}
  - chat: [上の子もう中二, かわりに体操服がなくなる]
  - say: なくなるんですか！？
  - chat: [上の子もう中二, 学校に置いてくる。いま三着目]
  - say: 学校に置いてきて、三着目……！ 名前、何のために書いてるんですか、それ。
  - chat: [上の子もう中二, 名前があっても本人が拾わない]
  - say: 名前があっても本人が拾わない……。先の話を聞くと、今からこわいです。
  - ask:
      q: 子どもの持ち物の名前付け、何でやってますか？
      options:
      - c: スタンプ
        r:
        - 'スタンプ派ですね！'
        - '{name}さん、仲間です！ にじんだら、ミ三ちゃんです。'
      - c: シール
        r:
        - '{name}さん、シールは速いですよね。乾燥機ではがれません？ うちは三枚飛びました。'
      - c: 全部手書き
        r:
        - '全部手書きですか！'
        - '{name}さん、すごい……。手首、大事にしてください。'
      - c: やったことない
        r:
        - '名前付け、まだやったことないんですね。'
        - '{name}さん、いいんです。今日は遠い国の話だと思って聞いてください。'
      npc: [[上の子もう中二, 2], [手伝う派の夫, 1], [初見の旅人, 3], [寝てない育休中, 3]]
  - say: やったことない、が多いですね。手伝う派の夫さんはシール。乾燥機、大丈夫でした？
  - chat: [手伝う派の夫, 乾燥機かけないでって言われてたのに、かけた]
  - say: {face: smug, text: 'かけないでって言われてたのに、かけた。やっぱり。'}
  - chat: [手伝う派の夫, 二枚はがれて洗濯槽に張り付いてた]
  - say: 洗濯槽に張り付いてた！ 洗濯機に名前が付いちゃいましたね。保育園に行けます。
  - chat: [手伝う派の夫, 行かなくていい]
- title: 脇道：きのこの山とたけのこの里
  beats:
  - chat: [ガチャ爆死太郎, 二時間も名前書いてて何食べてたの]
  - say: 何食べてたのって、え、なんで食べてた前提なんですか。
  - chat: [ガチャ爆死太郎, 絶対なんか食べてる]
  - say: 絶対って……。きのこの山を食べてました。
  - chat: [夜勤明けの人, きのこ派か]
  - say: きのこ派です！ そういえば、これ聞いてくださいよ。
  - say: うち、家の中が割れてるんです。ミミがたけのこの里派なんですよ。
  - chat: [定時退社したい, 親子で割れてるｗ]
  - say: 割れてます。四歳なのに、もう派閥があるんです。
  - chat: [初見の旅人, 旦那さんは？]
  - say: 夫ですか？ 「両方好き」って言うんです。だからどっちにも数えてません。
  - chat: [ガチャ爆死太郎, ずるい男だ]
  - say: ずるいですよね！ 揉めないところにいるんです。
  - say: 箱を二つ買うと、おやつ代が倍になるじゃないですか。
  - say: だから一回、すぎのこ村を探したんです。家族の仲直り用に。
  - chat: [初見の旅人, すぎのこ村って何]
  - say: すぎのこ村が何かっていうと、昔あった、きのことたけのこの兄弟みたいなお菓子だそうです。
  - say: わたしも名前しか知らないんですけど。今は売ってないんですって。
  - chat: [上の子もう中二, 名前だけ聞いたことある]
  - say: 先輩も名前だけですか！ わたしも探して初めて知りました。
  - say: で、お店を三軒回って……当然、売ってませんでした。
  - chat: [夜勤明けの人, そりゃないｗ]
  - say: そりゃない、です。仲直りの案、消えてました。
  - chat: [手伝う派の夫, きのこの良さは？]
  - say: {face: smile, text: 'きのこの良さ！ クラッカーのところがサクッとして、持つところがあるんです！'}
  - say: 手が汚れないので、書きものしながら食べられるんですよ。
  - chat: [上の子もう中二, たけのこの方が口の中でほろっとするよ]
  - say: 「たけのこの方がほろっとする」……先輩、たけのこ派なんですか！？ 敵がここにも！
  - chat: [上の子もう中二, 下の子に合わせてたらそうなった]
  - say: 下の子に合わせて、ですか。分かります……。子どもに寄っていくの、分かります。
  - say: 配信してる人だと、リゼ様とノクスさんがきのこ派なんです。
  - say: モーラさんとエラさんとヴェスパさんは、たけのこ。三対三です。
  - chat: [ガチャ爆死太郎, エラさんたけのこなの意外]
  - say: 意外ですよね！ 「チョコが多いのは正義」っておっしゃってました。
  - say: エラさん、正義って言葉、お菓子にも使うんだって思いました。
  - ask:
      q: きのこの山とたけのこの里、どっち派ですか？
      options:
      - c: きのこの山
        r:
        - 'きのこ派ですね！'
        - '{name}さん、仲間です！ うちの家だと、一対一で並びました。'
      - c: たけのこの里
        r:
        - 'たけのこ派ですね。'
        - '{name}さん、ミミと同じですね。今日はミミの味方が増えました。'
      - c: すぎのこ村
        r:
        - 'すぎのこ村ですか！'
        - '{name}さん！ どこで売ってたか、あとで教えてください。本気です。'
      - c: どっちも好き
        r:
        - 'どっちも好き、ですか。'
        - '{name}さん、夫と同じところですね。ずるい席です。'
      npc: [[ガチャ爆死太郎, 1], [手伝う派の夫, 3], [夜勤明けの人, 0], [初見の旅人, 2]]
  - chat: [初見の旅人, すぎのこ村って押してみた]
  - say: {face: surprised, text: 'みんな、ばらばら！ え、すぎのこ村を押した人がいる！ 初見さん！'}
  - chat: [初見の旅人, 名前が気に入った]
  - say: 名前が気に入った、ですか。名前で選ぶの、ありですね。
- title: 脇道の脇道：おやつの決まりに穴
  beats:
  - chat: [定時退社したい, ミミちゃんおやつは何時なの]
  - say: ミミのおやつは三時です。うち、家の決まりをノートに書いてるんですよ。
  - say: 「規則帳」って呼んでて。おやつは三時、っていうのは第五条です。
  - chat: [初見の旅人, 家に規則帳があるの？]
  - say: 家に規則帳、あるんです。百条を超えました。夫は読んでません。
  - chat: [ガチャ爆死太郎, 献立表と同じ扱いｗ]
  - say: 同じ扱いです……。でね、この前、夫がミミの前で余計なこと言ったんですよ。
  - say: 「ママの規則帳は穴だらけだからね」って。
  - chat: [手伝う派の夫, それ言っちゃだめなやつ]
  - say: 言っちゃだめなやつですよね！ 四歳は全部覚えますから。
  - say: 次の日、「おやつの決まりです」って言ったら、ミミが「それ穴だらけ？」って。
  - chat: [夜勤明けの人, 覚えてるｗ]
  - say: 覚えてました。しかも当たってたんです。
  - chat: [上の子もう中二, どこが]
  - say: どこがって、第九条が「お出かけの日は、好きなときにおやつ」なんです。
  - chat: [上の子もう中二, お出かけの日の三時は？]
  - say: {face: annoyed, text: '「お出かけの日の三時は？」、それ！ それをミミに聞かれたんです！'}
  - chat: [手伝う派の夫, で、どうしたの]
  - say: どうしたか？ 第九条の二を作りました。「ただし、ママがいいと言ったとき」。
  - chat: [ガチャ爆死太郎, ずるくない？]
  - say: ずるくない？って、ミミにも言われました。「それ、ずるい」。
  - say: {face: shy, text: 'はい。ずるいです。自分にだけ逃げ道を作りました。'}
  - chat: [上の子もう中二, 四歳に負けてる]
  - say: 負けてます。毎日負けてます。
- title: 戻る：何の話でしたっけ
  beats:
  - say: ……待ってください。何の話してましたっけ。
  - chat: [夜勤明けの人, おむつの名前]
  - say: あ、そうだ、おむつの名前です！ おやつの話になったの、どこからでした？
  - chat: [ガチャ爆死太郎, きのこから]
  - say: きのこからでした。全部、ガチャ爆死太郎さんのせいです。
  - chat: [ガチャ爆死太郎, ごめんて]
  - chat: [寝てない育休中, 靴下にも名前書くの？]
  - say: 靴下にも書きます。左右、両方です。
  - say: 片方だけ書くと、書いてない方がなくなるんですよ。
  - chat: [寝てない育休中, なんで書いてない方が]
  - say: なんで書いてない方が、ですよね。分からないんです。ほんとに。
  - chat: [上の子もう中二, うちは洗濯機の中から三日後に出てくる]
  - say: 洗濯機から三日後！ 出てきます！ うちもこの前、出てきました。
  - chat: [手伝う派の夫, 洗濯機が食べてる説]
  - say: 洗濯機が食べてる説。食べてますね。名前を書いてない方だけ選んで。
  - say: 名前を書いた方は、ちゃんと残るんです。あれだけは不思議です。
  - chat: [寝てない育休中, メモした。靴下は両方]
  - say: メモしてくれたんですね、靴下は両方。育休中さん、今日はそれだけ覚えてってください。
- title: 締め
  beats:
  - say: あ、隣で布団の音がしました。起きたかもです。
  - chat: [上の子もう中二, 起きたね]
  - say: たぶん起きました。今日はこのへんで！
  - say: 先輩、体操服の話、来年また聞かせてください。四着目になってたら。
  - chat: [上の子もう中二, なってると思う]
  - say: 四着目、なってそうですね……。
  - chat: [初見の旅人, すぎのこ村、探してみる]
  - say: すぎのこ村、探してくれるんですか！ 見つけたら本当に教えてください。家の平和がかかってます。
  - say: 廊下は、赤い丸をよけて行きますね。
  - chat: [夜勤明けの人, フラグ]
  - say: フラグじゃないです、大丈夫です、よけますから。
  - say: ……ぎいって鳴りました。
  - say: {face: shy, text: 'わたしが踏みました。丸の位置、ちょっとずれてたみたいです。ピムでした！'}
