# リゼ 006：Switch 2の値段と、2万3千円の変な買い物
# 2026-10-27 夜、10〜15分の雑談配信の形に作り直した（v8）。材料は旧001の「二万三千円とSwitch 2」「実家からの電話と切り忘れた配信」「GTA6」。
# 出典は src/sources/lise/001.md（Switch 2 の値段、マリオカート ワールド、シルクソング、GTA6 の延期）。フラッシュカート・母の電話・8時間の切り忘れは作り話。
# 脇道の共通の話題：Switch派かPS派か（fac_ps_switch）、ゲーム機の並べ方（gear_game_console の stories）。
# v9（2026-10-27）：Codex の二回目のレビューで直した。「買えない」の意味を、二万三千円では一台分に足りない、に戻した（資金不足の言い訳にしない）。
# 積みゲーの選択肢の6〜9本の抜けを「6本以上」で埋めた。PS・パソコンの全員分の並べと、話を忘れる所を外した。前の版は src/old/episodes-v9/lise/006.yaml。
# v10（2026-10-27 夜）：返事をするコメントを、リゼが軽く読んでから返す形にした（音声だけで何に返しているか分かるように）。ask のあとの一言を票の多い方に合わせた。前の版は src/old/episodes-v10/lise/。
title: Switch 2の値段と、2万3千円の変な買い物
lobby:
- 40年前のゲーム機のための物を、2万3千円で買っちゃったの。
- 2万3千円。モーラに怒られたわ。
- あと、母からの電話のあとにやらかした話も。
parts:
- title: 入り（母からの電話）
  beats:
  - say: こんばんは。ちょっと聞いて、先週の話なんだけど。
  - chat: [毎朝おはよう係, こんばんは]
  - chat: [ログボだけ勢, どうした]
  - say: どうしたって、母から電話が来たの。「あなた、まだゲームしてるの」って。
  - chat: [ログボだけ勢, 親は言うよね]
  - say: 親は言うのよね。だから「してないわ。ゲームの話をしてるの」って言ったの。
  - say: そしたら「もっと悪いじゃない」って。
  - chat: [定時退社したい, 草]
  - chat: [初見のうさぎ, お母さん強い]
  - say: お母さん強い、でしょう。強いのよ。言い返せなかったわ。
  - say: 「お仕事は？」って聞かれて、「ゲームのバグを探してる」って言ったら。
  - say: 「虫取りなの？」って。
  - chat: [ログボだけ勢, 虫取りw]
  - say: 虫取りで笑わないで。まあ、虫取りの方が聞こえはいいわね。
  - say: で、その電話のあと、ふて寝したのよ。配信を切り忘れて。
  - chat: [寝落ち常習犯, 何時間？]
  - say: 何時間って、八時間。
  - chat: [寝落ち常習犯, 仲間だ]
  - say: 寝落ちさんは仲間ね。画面には、ソファと毛布の端しか映ってなかったらしいわ。
  - say: 起きたら、見てる人がいつもより多かったの。
  - chat: [初見のうさぎ, なんで？]
  - say: なんでかは分からないの。コメントはほとんど「生きてる？」と「寝息が聞こえる」だったわ。
  - chat: [切り抜き職人A, あの回の切り抜き、伸びてます]
  - say: 切り抜きが伸びてる？ 知ってるわよ。あなたが切ったんでしょう。
  - chat: [切り抜き職人A, はい]
  - chat: [初見のうさぎ, 切り抜きのタイトルは？]
  - chat: [切り抜き職人A, 「サキュバス、八時間スプライト0のヒット待ち」]
  - say: 「サキュバス、八時間スプライト0のヒット待ち」。これね。前にマリオの画面の上の話をしたとき、合図を待ち続ける話をしたの。
  - say: 私が起きるのを、みんなが八時間待ってたってことらしいわ。
  - chat: [初見のうさぎ, 全然分からんけど面白い]
  - say: 全然分からんけど面白い？ 分からなくていいの。うまいこと言われて悔しいだけだから。
  - say: 寝てるところは切らないでって言ったのに。まあ、いいわ。
  - chat: [ログボだけ勢, お母さんは昔から厳しいの？]
  - say: 昔から厳しかったわね、母は。子どもの頃、夜中までファミコンやってたら、コンセントを抜かれたの。
  - chat: [レトロゲー老人, 一番やられたくないやつ]
  - say: 一番やられたくないやつ、でしょう。セーブの直前だったのよ。
  - chat: [ログボだけ勢, それは泣く]
  - say: それは泣く、ええ、泣いたわ。次の日から、母が寝た音を確かめてから始めるようになったの。
  - chat: [定時退社したい, 反省してないw]
  - say: 反省してない、って言われると、してないわね。だから今もゲームの話してるの。
- title: 本題（2万3千円の買い物）
  beats:
  - say: で、本題。この前、変な物を買ったの。
  - say: 昔のファミコンで、自分で作ったゲームを動かせるカセット。
  - chat: [初見のうさぎ, そんなのあるの？]
  - say: そんなのあるのよ。中に好きなゲームのデータを入れて、本体に挿すと動くの。
  - say: 二万三千円。
  - chat: [積みゲー千本, 高い]
  - say: 「高い」って、高いわよね。モーラにもそう言われたわ。
  - say: 「報告がまた重複だった月に買う物じゃない」って。
  - chat: [定時退社したい, モーラさん正論]
  - say: モーラさん正論、ね。正論だから困るの。
  - chat: [ガチャ爆死太郎, その金でSwitch 2買えたじゃん]
  - say: その金でSwitch 2が買えた？ 買えないわ。日本語だけの本体で四万九千九百八十円よ。
  - chat: [ガチャ爆死太郎, 半分もいかないか]
  - say: そう、半分もいかないの。マリオカートのセットだと五万三千九百八十円。
  - chat: [初見のうさぎ, 高くなったなあ]
  - say: 高くなったわよね。ソフトもよ。アメリカだとマリオカート ワールドだけで七十九ドル九十九セント。
  - chat: [積みゲー千本, 円にするとやばい]
  - say: 円にするとやばい、やばいわよね。計算するのやめたわ、怖いから。
- title: 脇道（Switch派かPS派か、ゲーム機の並べ方）
  beats:
  - chat: [初見のうさぎ, リゼさんSwitch派？PS派？]
  - say: うさぎさん、Switch派かPS派かって聞かれても、全部持ってるの。ファミコンからSwitch 2まで。
  - chat: [ログボだけ勢, さっき買えないって言ってなかった？]
  - say: さっき買えないって言ってた？ 持ってるわよ。二万三千円じゃ一台分にも足りない、って話ね。
  - chat: [ログボだけ勢, まぎらわしいw]
  - say: まぎらわしかったわね、ごめんね。でも、もう一台欲しいのは本当。寝室用に。
  - chat: [定時退社したい, ソファで寝てるのに寝室あるの]
  - say: ソファで寝てるのに寝室、ね。ないわね。言ってみただけ。
  - say: で、どれを一番やるかっていうと、Switch。寝ながらできるから。
  - chat: [積みゲー千本, 俺はPS5。テレビの前でちゃんと座る]
  - say: 千本さんはPS5を、テレビの前でちゃんと座ってやるの。えらいわね。
  - say: うちのエラも、PSは正座でやってるわ。
  - say: ゲーム機は、ソファから手が届く順に並べてあるの。
  - say: そしたら、発売の順とほぼ逆になったのよ。
  - chat: [レトロゲー老人, 一番遠いのがファミコン？]
  - say: そう、一番遠いのがファミコン。一番古いのが一番遠いの。取りに行くのに一番歩くのよ。
  - chat: [ログボだけ勢, 歩くって何歩？]
  - say: 何歩かっていうと、五歩くらい。
  - chat: [ログボだけ勢, 近いじゃん]
  - say: 近いじゃん、って。私には遠いのよ。
  - ask:
      q: 今よく遊ぶのは、どれ？
      options:
      - c: Switch
        r:
        - Switchね、{name}。寝転んでできるもの。分かるわ。
      - c: PlayStation
        r:
        - PSなのね、{name}。大きいテレビでやる派？ 正座してる？
      - c: パソコン
        r:
        - パソコンね、{name}。セールの時期は気をつけてね。
      - c: スマホ
        r:
        - スマホね、{name}。いつでもどこでも。ガチャのやめどきだけ決めておいて。
      npc:
      - [ログボだけ勢, 3]
      - [積みゲー千本, 2]
      - [レトロゲー老人, 0]
      - [ガチャ爆死太郎, 3]
      - [初見のうさぎ, 0]
      - [定時退社したい, 1]
  - say: スマホとSwitch、半々くらいね。
- title: 戻る（安く出す人たち）
  beats:
  - chat: [作業用BGM勢, でもシルクソングは安かったよね]
  - say: シルクソングは安かった、そう、それ。値段の話の続きね。ちょうどよかった。
  - say: シルクソングは十九ドル九十九セントで出したの。日本だと二千三百円。
  - chat: [作業用BGM勢, 安すぎる]
  - say: 安すぎる、よね。高くしても売れたと思うのに、安く出したのよね。そういうの好きよ。
  - chat: [積みゲー千本, 安いから積んでる]
  - say: 安いから積んでる、じゃないの。積まないで遊んであげて。
  - chat: [積みゲー千本, 千本あるから順番待ち]
  - say: 千本の順番待ち。私のソファの周りより多いわね。
  - chat: [積みゲー千本, セールのたびに増える]
  - say: セールのたびに増える、分かるわ。私もセールに弱いの。
  - say: 定価では買わないのに、半額って出ると、とりあえず買っちゃうのよ。
  - chat: [ガチャ爆死太郎, で、やらない]
  - say: で、やらない。やらないわね。タイトル画面まで行けばいい方。
  - chat: [積みゲー千本, タイトル画面見たら半分遊んだことにしてる]
  - say: タイトル画面を見たら半分遊んだことに？ それいいわね。私も今日からそうするわ。
  - chat: [手帳は三冊目, 積みゲーって何本ある？]
  - say: 手帳さん、積みゲーの数は数えたことないの。数えたら、モーラが帳簿に書くでしょう。
  - ask:
      q: 買ったのにまだ遊んでないゲーム、何本くらいある？
      options:
      - c: 0本
        r:
        - 0本なの、{name}？ 全部遊んでるのね。どうやってるのか教えて。
      - c: 1〜5本
        r:
        - 数本ね、{name}。それくらいなら、そのうち遊べるわ。たぶん。
      - c: 6本以上
        r:
        - 6本以上ね、{name}。私と同じくらいかしら。数えてないけど。
      - c: 数えたくない
        r:
        - 数えたくないのね、{name}。分かるわ。見なかったことにしましょう。
      npc:
      - [積みゲー千本, 3]
      - [ガチャ爆死太郎, 2]
      - [手帳は三冊目, 1]
      - [ログボだけ勢, 3]
      - [初見のうさぎ, 0]
  - say: 数えたくない人、多いわね。私もそっちに入れておいて。
  - chat: [RTA走者見習い, GTA6は？]
  - say: GTA6はまだよ。十一月十九日の予定。
  - say: 去年の十一月に、今年の五月から延びたの。
  - chat: [RTA走者見習い, また延びそう]
  - say: また延びそう？ 延びても、ちゃんと作ってくれるなら私は待つわ。
  - chat: [定時退社したい, うちの会社の締め切りも延びてほしい]
  - say: 会社の締め切りは延びないの？
  - chat: [定時退社したい, 延びない。むしろ早まる]
  - say: むしろ早まる、って。それは大変ね。今日は早く寝て。
- title: また飛ぶ（買ってよかったのか）
  beats:
  - chat: [初見のうさぎ, で、二万三千円のは何に使ったの]
  - say: 二万三千円のは何に使ったか。昔、自分で作ったゲームを入れたの。
  - say: 古いテレビにつないで、もう一回実機で動かしたのよ。
  - chat: [同人誌即売会帰り, ドクロのやつ？]
  - say: そう、ドクロのやつ。画面の左上にドクロが出るやつ。ちゃんと出たわ。
  - say: 古いテレビだと、ちょっとにじんで見えるの。それが可愛かったのよ。
  - chat: [初見のうさぎ, ドクロ？]
  - say: 初見さんには「ドクロ？」よね。昔のバグなの。説明すると長いから、また今度ね。
  - chat: [初見のうさぎ, 気になるw]
  - say: 気になったら、また来て。
  - chat: [ガチャ爆死太郎, それならいい買い物じゃん]
  - say: いい買い物って、そう言ってくれる？ じゃあ、いい買い物だったことにするわ。
  - chat: [手帳は三冊目, モーラさんにはなんて言うの]
  - say: モーラにって、言わないわ。もう帳簿には付けられてるけど。
  - chat: [ログボだけ勢, バレてるやん]
  - say: そう、バレてるのよ。最初から。
  - chat: [レトロゲー老人, カセットは何十年たっても動くのがいいよな]
  - say: 何十年たっても動く、そうなのよ。電源を入れたら、今でも動くの。
  - say: 今のゲームは、サーバーが閉じたら遊べなくなるのもあるでしょう。
  - chat: [元・金策業者, あのMMOみたいに]
  - say: あのMMOみたいに、そう。私のボットが捕まったゲームも、もうないの。
  - chat: [初見のうさぎ, 遊べなくなるの止める署名あったよね]
  - say: 署名、あったわね。ヨーロッパの「ゲームを消さないで」っていう署名。
  - say: 百四十万を超えて集まって、今年の一月に、EUが百二十九万件くらいを有効だって確かめたの。
  - chat: [初見のうさぎ, すごい数]
  - say: すごい数よね。私も署名したわ。ちゃんと読んでからね。
  - chat: [規約は同意だけ, 俺も押した。読まずに]
  - say: 読まずに押した？ 読んで。押す前に読んで。
  - chat: [規約は同意だけ, 今から読む]
  - say: 今から読む、ね。えっと、まあ、押しちゃったなら、あとで読んで。
- title: 締め
  beats:
  - chat: [寝落ち常習犯, 今日は切り忘れないでね]
  - say: 今日は切り忘れないで、ね。気をつけるわ。最後にちゃんと押すから見てて。
  - chat: [切り抜き職人A, 切り忘れたら切り抜きます]
  - say: 切り忘れたら切り抜く？ やめて。いや、寝息のところ以外ならいいわ。
  - chat: [初見のうさぎ, お母さんによろしく]
  - say: 母によろしく、ね。伝えたら、また「まだゲームしてるの」って言われるわ。
  - chat: [ログボだけ勢, お母さんにこの配信見せたら？]
  - say: この配信を母に見せる？ 嫌よ。絶対「もっと悪いじゃない」って言われるもの。
  - chat: [初見のうさぎ, 見せたら意外と喜ぶかもよ]
  - say: 意外と喜ぶかも、って。そうかしら。うーん、考えておくわ。
  - say: 見せるなら、寝てない回にするわ。
  - chat: [寝落ち常習犯, 寝てない回あるの？]
  - say: 寝てない回があるのかって、今日とか。今日は起きてたでしょう。最後まで。
  - say: 次は、ゲームボーイとスーファミの、絵の枚数の話をしようかしら。決めてないけど。
  - say: じゃあ、おつかれさま。ちゃんと切るわね。
