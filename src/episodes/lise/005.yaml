# リゼ 005：一番好きなファミコンのゲームと、苦手なゲーム
# 2026-10-27 夜、10〜15分の雑談配信の形に作り直した（v8）。材料は旧001の「好きなメーカー、苦手なゲーム」「音を鳴らすとボタンが誤作動する」。
# 出典は src/sources/lise/001.md（ギミック！、サンソフト5B、北欧版、酒井智巳のインタビュー、DMCとコントローラの読み取り、Bee 52、バトルトード）。
# 脇道の共通の話題：ゲームの難易度（fac_difficulty）、スマホの壁紙（net_home_screen）。入りは rec_life_lucky の stories。
# v9（2026-10-27）：Codex の二回目のレビューで直した。視聴者が「ギミック！」と具体的に振ったのに話を忘れる所をやめ、そのまま続けた。難易度の全員分の並べも外した。前の版は src/old/episodes-v9/lise/005.yaml。
# v10（2026-10-27 夜）：返事をするコメントを、リゼが軽く読んでから返す形にした（音声だけで何に返しているか分かるように）。ask のあとの一言を票の多い方に合わせた。前の版は src/old/episodes-v10/lise/。
title: 一番好きなファミコンのゲームと、苦手なゲーム
lobby:
- 好きなゲームを聞かれたら、ずっと迷わず同じのを答えてるの。
- 苦手なゲームも、すぐ言えるわ。
- あと、音楽が鳴るとボタンが勝手に押される、変なファミコンの話。
parts:
- title: 入り（スマホの壁紙）
  beats:
  - say: はい、こんばんは。今日は機嫌がいいの。
  - chat: [毎朝おはよう係, こんばんは]
  - chat: [ログボだけ勢, 珍しい。何かあった？]
  - say: 珍しいって何よ。何があったかっていうと、スマホの壁紙を替えたの。それだけ。
  - chat: [ログボだけ勢, それだけで機嫌いいのw]
  - say: それだけで機嫌いいのよ。見るたびに嬉しいもの。
  - chat: [初見のたぬき, 初見です。何の壁紙？]
  - say: たぬきさん、いらっしゃい。何の壁紙か？ 緑のふわふわした子。ゆめたろうっていうの。
  - chat: [初見のたぬき, 知らない子だ]
  - say: 知らない子、よね。ファミコンの、ギミック！ってゲームの主人公なの。
  - chat: [レトロゲー老人, ギミック！の壁紙は分かってる]
  - say: 「ギミック！の壁紙は分かってる」って。分かってくれる人がいるわね。今日はその話をするつもりだったの。
  - chat: [ログボだけ勢, 壁紙ってアプリ並べてるの？]
  - say: 並べてないわ、アプリ。百個くらい、ぐちゃぐちゃに置いてある。
  - say: ゆめたろうの顔だけ隠れないように、そこだけ空けてあるのよ。
  - chat: [喫茶店の常連, こだわりの場所がそこ]
  - say: こだわりの場所がそこ、って。そう、そこしかこだわってないの。
- title: 本題（ギミック！）
  beats:
  - say: 好きなゲームを聞かれたら、私はずっとギミック！って答えてるの。
  - say: 1992年の、サンソフトのゲーム。
  - say: ゆめたろうが、頭の上に星を出して、投げて進むの。
  - chat: [初見のたぬき, 星を投げるだけ？]
  - say: 星を投げるだけ、じゃないの。投げた星に乗れるのよ。それで高い所に行ったりするの。
  - say: 跳ね返るから、狙ってないのに当たったりして。それが気持ちいいの。
  - chat: [RTA走者見習い, 難しいけどね]
  - say: 難しいけど、ね。難しいのよ。私、最後まで行けてないの。正直に言うと。
  - chat: [ログボだけ勢, 好きなのにクリアしてないw]
  - say: 好きなのにクリアしてない、って笑わないで。好きなのと、クリアできるのは別なの。
  - say: で、何がいいかっていうと、曲がいいのよ。本当にいいの。
  - say: カセットの中に、音を足すチップが入ってるの。
  - say: だからファミコンなのに、音がすごく厚いのよ。
  - chat: [作業用BGM勢, 作業用に今でも流してる]
  - say: BGM勢さんも作業用に流してるの。分かる。私も寝るときに流してるわ。
  - chat: [作業用BGM勢, 寝るとき他に何流してる？]
  - say: 寝るときのほかの音ね。RTAの配信の録画が多いわね。誰かがゲームを速く走ってるやつ。
  - say: 解説の声がずっと続くでしょう。あれ、すごく眠れるの。
  - chat: [RTA走者見習い, 走ってる側としては複雑]
  - say: 走ってる側としては複雑？ ごめんね。褒めてるのよ、一応。
  - chat: [作業用BGM勢, RTA in Japanとか？]
  - say: そう、RTA in Japan。夏と冬に一週間ずっとやってるでしょう。あれを流しっぱなしにしてるの。
  - say: 寝て起きると、違うゲームが走られてるのよ。
  - chat: [RTA走者見習い, 去年の夏は任天堂のゲーム出なかったよね]
  - say: 去年の夏は任天堂のゲームが出なかった、そうだったわね。だから寝ても起きても知らないゲームばっかりで、それはそれで新鮮だったわ。
  - chat: [作業用BGM勢, 私は雨の音派]
  - say: 雨の音もいいわね。今度やってみる。
  - chat: [ログボだけ勢, 俺は無音]
  - say: 無音で寝られるの、うらやましいわ。私は何か鳴ってないと落ち着かないの。
  - chat: [喫茶店の常連, 換気扇の音がいい]
  - say: 換気扇の音。それは考えたことなかったわ。
  - say: まあいいわ、ギミック！の話の途中だったわね。
  - chat: [初見のたぬき, カセットに音のチップ？]
  - say: そう、カセットに音のチップ。昔のカセットって、本体だけじゃできないことを、中の部品で手伝うのがあったの。
  - say: ギミック！は、音を手伝う部品が入ってるの。
  - chat: [レトロゲー老人, 海外版はそれが無いんだよね]
  - say: 海外版には無い、そうなの。海外では北欧だけで出たのよ。
  - say: その海外版には、音のチップが入ってないの。
  - say: だから曲を、普通の音で鳴るように作り直してあるのよ。
  - chat: [作業用BGM勢, 北欧版の曲も好き]
  - say: 北欧版の曲、私も好き。音が少ないのに、ちゃんと同じ曲に聞こえるの。
- title: 脇道（難易度どれ選ぶ）
  beats:
  - chat: [初見のたぬき, 難しいゲームって苦手じゃないの？]
  - say: 難しいゲームは苦手じゃないのか？ 苦手よ。難易度を選べたら、いつも一番やさしいのにするわ。
  - chat: [RTA走者見習い, 甘え]
  - say: 甘えていいのよ。ゲームなんだから。
  - say: 「やさしい」って書いてあるのに選ばないの、もったいないじゃない。
  - chat: [ログボだけ勢, わかる。やさしいで十分]
  - say: やさしいで十分、でしょう。やさしいで一回クリアして、気が向いたら上げればいいの。
  - chat: [RTA走者見習い, 気が向いたことある？]
  - say: 気が向いたこと？ ないわ。
  - chat: [喫茶店の常連, 城の人は？ エラさんとか]
  - say: 城の人なら、エラは一番難しいの。しかも何も言わずに選ぶの。
  - say: 横で見てたら、何回死んでも表情が変わらないのよ。怖いでしょう。
  - chat: [RTA走者見習い, エラさんかっこいい]
  - say: エラさんかっこいい、ね。かっこいいけど、真似したくないわ。
  - chat: [初見のたぬき, ギミック！は難易度選べないの？]
  - say: ギミック！は難易度を選べないの。だから私は途中まで。それでいいの。
  - ask:
      q: ゲームの難易度、どれを選ぶ？
      options:
      - c: やさしい
        r:
        - やさしいね、{name}。仲間。何も恥ずかしくないわ。
      - c: ふつう
        r:
        - ふつうね、{name}。まずはそこからよね。
      - c: むずかしい
        r:
        - むずかしいのね、{name}。エラと同じ。
        - 何回死んでも平気な顔でいられる？
      - c: 一番上の難易度から
        r:
        - いきなり一番上なの、{name}？ 私には無理。見てるだけで疲れるわ。
      npc:
      - [ログボだけ勢, 0]
      - [RTA走者見習い, 3]
      - [レトロゲー老人, 1]
      - [喫茶店の常連, 0]
      - [作業用BGM勢, 1]
      - [初見のたぬき, 0]
  - say: やさしいが一番多いわね。安心したわ。
- title: 戻る（ボタンが勝手に押される）
  beats:
  - chat: [エラッタ収集家, そういえばギミック！、上押しっぱなしで止まるやつ]
  - say: 上押しっぱなしで止まるやつ？ あ、それ。上を押してるのに止まるやつね。
  - say: あれ、音を鳴らす仕組みが関係してるの。その話、したかったのよ。
  - chat: [初見のたぬき, 止まる？]
  - say: 止まるのよ。ファミコンって、音を鳴らすためにデータを取りに行く仕組みがあるの。
  - say: それが、コントローラーのボタンを読んでる途中に割り込むことがあるのよ。
  - say: そうすると、押してないボタンを押したことにされちゃうの。
  - chat: [初見のたぬき, こわ]
  - say: こわいでしょう。ドクターマリオだと、音楽が鳴ってる間に、回すボタンが変に効いたりするの。
  - chat: [RTA走者見習い, 悪魔城もそれだよね]
  - say: 悪魔城もそれ、そう、北米版の悪魔城ドラキュラ。
  - say: 攻撃が当たった音のときに上を押してると、それがスタートに化けて、止まるの。
  - chat: [ログボだけ勢, 一番いいとこで止まるのか]
  - say: 一番いいとこで止まる、そうなの。盛り上がった瞬間に止まるのよ。
  - chat: [規約は同意だけ, 押してないのに同意したことになるやつだ]
  - say: {face: smile, text: 押してないのに同意したことになる？ それはあなたが毎日やってることでしょう。}
  - say: ギミック！にも似たことがあって、上を押してると止まったりするのよ。
  - chat: [初見のたぬき, 直せないの？]
  - say: 直せないのかっていうと、ボタンを何回か読んで、同じになるまで読み直すの。そういう直し方があるのよ。
  - say: でもギミック！は、その読み直しが、本体によってはうまく効かないらしいの。
  - chat: [エラッタ収集家, ドクターマリオのは、ヨーロッパの本体だと起きないですね]
  - say: そうそう、ヨーロッパの本体だと起きないの。ヨーロッパ向けの本体は、そこが直ってるの。
  - chat: [初見のたぬき, 国で違うの面白い]
  - say: 国で違うの、面白いわよね。同じゲームなのに、国で起きたり起きなかったりするの。
- title: また飛ぶ（作った人の名前）
  beats:
  - chat: [作業用BGM勢, ギミック！って新しい版出たよね]
  - say: 新しい版、あったわね。2023年に出たの。
  - say: でもね、作った酒井智巳さんが、その新しい版には関わってなかったって、インタビューで話してたの。
  - chat: [初見のたぬき, 作った人なのに？]
  - say: 作った人なのに、そうなの。それだけは寂しいわ。
  - say: 好きなゲームを作った人の名前は、ちゃんと表に出ててほしいのよ。
  - chat: [朝五時の報告者, 名前が載らないのはつらいですよね]
  - say: 名前が載らないのはつらい、って。あなたが言うと、なんか違う意味に聞こえるわね。
  - chat: [朝五時の報告者, 他意はないです]
  - say: 他意はない、分かってるわ。分かってて言ったの。
- title: 苦手なゲーム（バトルトード）と、好きな不良
  beats:
  - chat: [レトロゲー老人, じゃあ苦手なゲームは？]
  - say: 苦手なのは、バトルトード。すぐ言えるわ。
  - chat: [RTA走者見習い, 難しいからでしょ]
  - say: 難しいから、もあるけど、それだけじゃないの。
  - say: あれ、昔のゲーム機をパソコンでまねするソフトを作る人たちを、すごく困らせたのよ。
  - say: タイミングが少しずれただけで、ゲームが止まっちゃうの。
  - chat: [初見のたぬき, 作った人が悪いの？]
  - say: 作った人が悪いのか？ 悪くはないの。実機では動いてたんだもの。
  - say: ただ、作る人たちが寝られなかったのよ。それで私は苦手なの。
  - chat: [RTA走者見習い, 俺は好き]
  - say: 走者見習いさん、好きなのね。いいのよ、好きで。私の苦手は、私の勝手な理由だから。
  - chat: [ログボだけ勢, 好きなメーカーは？]
  - say: 好きなメーカーはね、コードマスターズ。イギリスの会社。
  - say: 任天堂の許可を取らずに、ファミコンのゲームを出してたの。
  - chat: [初見のたぬき, 大丈夫なのそれ]
  - say: 大丈夫なのかって、揉めたわよ。でも腕はすごかったの。
  - say: 許可がないと本体の鍵が開かないから、自分たちの回路で開けてたのよ。
  - say: Bee 52ってゲームでは、ファミコンが「絵が多すぎる」って出す合図を、時計がわりに使ってたの。
  - chat: [処理落ち愛好会, タイトル画面のやつね]
  - say: そう、タイトル画面のやつ。誰も使わない所を使うのが、好きなの。
  - chat: [朝五時の報告者, 許可なしを好きって言っていいんですか]
  - say: 許可なしを好きって言っていいのか？ 仕組みを調べるのは好きよ。人のものを取るのとは話が別。
- title: 締め（中古屋の箱の底）
  beats:
  - chat: [初見のたぬき, ギミック！持ってるの？]
  - say: 持ってるわよ、ギミック！。中古屋の箱の底から出てきたの。
  - say: 値札が、ほかのカセットと同じ値段だったのよ。
  - chat: [レトロゲー老人, それは当たり]
  - say: それは当たり、でしょう。レジまで、誰かに取られる気がして両手で持ってたわ。
  - chat: [初見のたぬき, 中古のゲームって当たり外れある？]
  - say: 中古の当たり外れ？ あるわよ。電池が切れてて、セーブが消えるのもあるし。
  - say: 私は箱の底の方から見るの。上の方はみんなが見たあとだから。
  - chat: [レトロゲー老人, 分かる。下の方に掘り出し物ある]
  - say: 下の方に掘り出し物、でしょう。しゃがむのが面倒だけど、そこだけは頑張るの。
  - chat: [ログボだけ勢, 今どこにあるの、ギミック！]
  - say: 今どこにあるかっていうと、家に帰って、すぐ枕の下に入れたわ。
  - chat: [ログボだけ勢, やっぱり枕]
  - say: うん、やっぱり枕。
  - say: 次は、Switch 2の値段と、私が買ったもっと変な物の話をするわ。
  - say: じゃあ、おつかれさま。今日はギミック！の曲を流して寝るわ。
