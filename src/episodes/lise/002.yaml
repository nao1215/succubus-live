# リゼ 002：マリオ3のキノコは、ブロックの中から出てない
# 2026-10-27 夜、10〜15分の雑談配信の形に作り直した（v8）。材料は旧001の「マリオ3の優先の手品」「0と$FF」「ドクロのバグ」。
# 出典は src/sources/lise/001.md。ドクロの自作ソフトは作り話（バイブルの person.life）。
# 脇道の共通の話題：きのこの山とたけのこの里（fac_kinoko_takenoko、派閥は likes/_factions.yaml）、コンビニのからあげクン（chain_konbini_hot の stories）。
# v9（2026-10-27）：Codex の二回目のレビューで直した。6人のきのこ・たけのこの並べ（pim/001 だけに残す）、階段で揚げ物（mora/008 と重なる）、初見を追い出す返し、001 と食い違うクリボーの断言、赤字の数字の回収を外した。前の版は src/old/episodes-v9/lise/002.yaml。
# v10（2026-10-27 夜）：返事をするコメントを、リゼが軽く読んでから返す形にした（音声だけで何に返しているか分かるように）。ask のあとの一言を票の多い方に合わせた。前の版は src/old/episodes-v10/lise/。
title: マリオ3のキノコは、ブロックの中から出てない
lobby:
- マリオ3でブロックを叩くと、キノコがにゅっと出てくるでしょう。
- あれ、中から出てるように見えて、実は違うの。
- あと、私が昔作ったゲームの、恥ずかしいバグの話もするわ。
parts:
- title: 入り（からあげクンと階段）
  beats:
  - say: はい、こんばんは。映ってるわね。
  - chat: [毎朝おはよう係, こんばんは]
  - chat: [ログボだけ勢, 口もぐもぐしてない？]
  - say: もぐもぐ？ してたわ。からあげクン食べてたの。
  - chat: [ログボだけ勢, 夜中のローソンか]
  - say: そう、夜中のローソン。帰り道、信号で止まるたびに一個食べるの。
  - say: うちまで信号三つしかないのに、着く前に箱が空になるのよ。
  - chat: [レトロゲー老人, 信号で止まりすぎでは]
  - say: 止まりすぎって言われても、止まるのよ。青になっても、食べ終わるまで渡らないから。
  - chat: [ログボだけ勢, 信号を待ってない、からあげを待ってる]
  - say: からあげを待ってる、か。そう言われるとそうね。
  - say: もう一回戻ってもう一箱買おうか迷って、やめたわ。面倒で。
  - chat: [ログボだけ勢, そこは面倒なんだw]
  - say: そこは面倒なのよ。歩くのが面倒なの。食べるのは面倒じゃないの。
  - chat: [喫茶店の常連, からあげにレモンかける派？]
  - say: レモンはかけないわ。衣がしなっとするでしょう。
  - say: しなっとすると噛む回数が増えるのよ。面倒なの。
  - chat: [喫茶店の常連, かけた方がさっぱりするのに]
  - say: さっぱりするって、エラもそう言うのよ。あの子、絞ってからお皿を出してくるの。
  - say: だから最近は、先に一個だけ取ってから渡してるわ。
  - chat: [ログボだけ勢, 自衛してて草]
  - say: かけたい人は、自分の分だけにかけてくれたらいいのよ。
  - chat: [レトロゲー老人, 大皿に勝手にかける人は揉める]
  - say: 大皿に勝手にかける人ね。揉めるわね。私は揉める前に一個取るの。
  - say: からあげクンは最初からレモンかかってないから、平和なのよ。
- title: 本題の入り（シールの重なり方）
  beats:
  - say: さて、今日は昔のゲームの、ちょっとした手品の話。
  - say: 前に、ファミコンは動く絵を横に八枚までって話したでしょう。
  - chat: [初見の猫, 初見です。それ知らない]
  - say: 初見の猫さん、いらっしゃい。知らなくて大丈夫よ。
  - say: 画面の上を動く絵のこと、スプライトっていうの。シールだと思って。
  - say: で、今日はシールが重なったときの話。
  - say: 二枚重なったら、どっちが上に見えると思う？
  - chat: [初見の猫, 後から貼った方？]
  - say: 後から貼った方、そう思うわよね。でも逆なの。番号が若い方が手前に来るの。
  - chat: [ログボだけ勢, 若い方が上]
  - say: {face: annoyed, text: 「若い方が上」って、その言い方やめて。別の業界の話に聞こえるわ。}
  - chat: [規約は同意だけ, どの業界？]
  - say: どの業界かは、あなたは知らなくていいの。
  - say: で、シールには「背景の後ろに回る」って印も付けられるのよ。
  - chat: [初見の猫, 後ろに回るとどうなるの]
  - say: 後ろに回ると、壁紙の向こうに行くから、自分は見えなくなる。ここまでは普通ね。
- title: 脇道（キノコ → きのこの山とたけのこの里）
  beats:
  - chat: [ログボだけ勢, キノコの話って聞いて、きのこの山食べたくなった]
  - say: キノコの話できのこの山が食べたくなった？ 分かる。私、きのこの山派なの。
  - chat: [喫茶店の常連, え、たけのこ一択でしょ]
  - say: 「たけのこ一択」って、来たわね、たけのこの人。
  - say: きのこは持つ所があるでしょう。寝ながら食べても、指にチョコが付かないの。
  - chat: [喫茶店の常連, たけのこのサクサクがいいのに]
  - say: サクサクなのは認めるわ。でも、つまむ所がないでしょう。
  - chat: [喫茶店の常連, つまむ所って何]
  - say: つまむ所って何って、きのこの軸よ。あそこを持てば、寝転んでても平気なの。
  - say: 家だと、両方入った袋をエラに渡すの。あの子、たけのこ派だから。
  - say: で、きのこだけ選んで、私のお皿に分けてもらってる。
  - chat: [レトロゲー老人, 侍女さんに仕分けさせてるw]
  - say: 仕分けさせてるって言わないで。たけのこはエラが食べるから、ちょうどいいのよ。
  - chat: [初見の猫, 私はチョコだけ先に食べる派]
  - say: {face: surprised, text: チョコだけ先に？ 何それ。きのこの傘だけかじるの？}
  - chat: [初見の猫, そう。残ったクラッカーは後で]
  - say: クラッカーは後で、って。それ、後のクラッカーがただのクラッカーじゃない。
  - chat: [喫茶店の常連, 第三勢力きた]
  - chat: [初見の猫, 平和な食べ方です]
  - ask:
      q: きのこの山派？ たけのこの里派？
      options:
      - c: きのこの山
        r:
        - きのこね、{name}。持つ所がある方。仲間ね。
        - 軸を持って食べてね。それが一番楽なの。
      - c: たけのこの里
        r:
        - たけのこなのね、{name}。エラが喜ぶわ。
        - サクサク派ね。私の袋のたけのこ、あげてもいいわよ。
      - c: どっちも好き
        r:
        - どっちもね、{name}。平和な人ね。
        - 袋を開けたら仕分けを手伝って。
      - c: 食べたことない
        r:
        - ないの、{name}？ チョコのお菓子よ。私は指が汚れにくい、きのこの方が好きなの。
      npc:
      - [ログボだけ勢, 0]
      - [喫茶店の常連, 1]
      - [レトロゲー老人, 0]
      - [初見の猫, 2]
      - [規約は同意だけ, 1]
      - [毎朝おはよう係, 1]
  - say: たけのこがちょっと多いのね。悔しいけど、いい感じに割れたわ。
  - chat: [ログボだけ勢, 傘だけ食べる人がいて動揺してる]
  - say: 傘だけ食べる人に動揺してる？ 私も。今日一番の驚きかもしれないわ。
  - say: きのこ派の理由、だいたい「手が汚れない」なのよ。
  - chat: [喫茶店の常連, きのこ派、ものぐさしかいないじゃん]
  - say: ものぐさしかいないって、失礼ね。手を汚したくない派、って言って。
  - chat: [規約は同意だけ, で、キノコはどこから出てくるの]
  - say: あ、キノコがどこから出るか。そうだった、マリオの話してたのよね、私。
  - say: どこまで話したっけ。シールが後ろに回るところね。
- title: 戻る（マリオ3の手品）
  beats:
  - say: スーパーマリオブラザーズ3で、ブロックを叩くと。
  - say: キノコが下から、にゅっと生えてくるでしょう。
  - chat: [初見の猫, うん、出てくる]
  - say: あれ、ブロックの中から出てるように見えるわよね。
  - say: でも本当は、キノコはブロックの絵の前を通ってるの。
  - chat: [初見の猫, じゃあなんで隠れて見えるの]
  - say: なんで隠れて見えるかっていうとね、ブロックの所に、もう一枚シールを置いてるの。後ろに回る印を付けたやつ。
  - say: その子は背景の後ろだから、自分は見えない。
  - say: でも番号が若いから、キノコより手前にいる扱いなの。
  - say: そうすると、キノコの方まで隠れて、背景が見えるのよ。
  - chat: [初見の猫, 見えない子がキノコの前に立ってる？]
  - say: {face: smile, text: そう、それ。見えない子が、キノコの前に立ってるの。}
  - chat: [ログボだけ勢, ややこしすぎる]
  - say: ややこしいわよね。私も最初、三回読み直したわ。
  - say: 分かった瞬間、一人で「ずるい」って声出たもの。
  - chat: [コマ送り勢, 1-2の音符ブロックで角が欠けるやつだ]
  - say: {face: surprised, text: 1-2の音符ブロック、知ってるの？ それ、コマ送りで見たの？}
  - chat: [コマ送り勢, 見た]
  - say: 見たのね。音符ブロックは角が丸いのに、隠す子は四角いの。
  - say: だからキノコが出てくるとき、角だけ四角く欠けて見えるのよ。
  - chat: [初見の猫, 手品の種が見えちゃってる]
  - say: そう、手品の種が見えちゃってる。角の四つだけね。そういうの見つけると嬉しくなるのよ。
  - chat: [処理落ち愛好会, 隠す子も同じ行の枠は食うよね]
  - say: そう、隠す子も枠を食うの。見えなくても、八枚のうちの一枚に数えられるの。
  - say: だからキノコが出る行に敵が多いと、別の子が消えたりするのよ。
  - chat: [処理落ち愛好会, キノコ出すたびに誰か消えるのか]
  - say: キノコを出すたびに？ 消えることもある、ね。いつもじゃないわ。
  - chat: [ログボだけ勢, キノコのために犠牲になるクリボー]
  - say: キノコの犠牲になるクリボー？ クリボーならいいんじゃない？ いや、困るわね。
  - chat: [レトロゲー老人, 見えないクリボーに当たるやつ]
  - say: 見えないクリボーに当たるやつね。当たるのは、こっちなのよ。クリボーに優しくしておくわ。
  - chat: [初見の猫, これ作った人はどうやって思いついたの]
  - say: 猫さん、どうやって思いついたかは分からないわ。ここからは私の勝手な想像だけど、誰かが偶然見つけたんじゃないかしら。
  - say: 「あれ、なんか消えた」って。そこから「使える」って。
  - chat: [ログボだけ勢, バグを仕様にしたやつだ]
  - say: そう、バグを仕様にしたやつ。私、そういうの大好きなの。
  - chat: [レトロゲー老人, 今度マリオ3やるとき見てみるわ]
  - say: 老人さん、見てみて。一回気づくと、もうそこしか見えなくなるから。
- title: また飛ぶ（0と$FF、ドクロのバグ）
  beats:
  - chat: [エラッタ収集家, 使わないシールはどこに置くんでしたっけ]
  - say: 使わないシールの置き場所？ それ聞くの、意地悪ね。分かってて聞いてるでしょう。
  - chat: [エラッタ収集家, はい]
  - say: 「はい」じゃないわよ。使わないシールは、画面の外に追い出すの。数字で言うと$FF。
  - say: 0にしちゃうと、画面の左上の角に出ちゃうのよ。
  - chat: [初見の猫, なんで今それ聞いたの？]
  - say: なんで今聞いたか？ 私が昔、それで失敗したのを、この人は知ってるの。
  - say: 何年か前、城の使い魔たちと、ファミコンのゲームを作ったのよ。
  - chat: [初見の猫, 今でも作れるの？]
  - say: 今でも作れるのよ。趣味で作ってる人、けっこういるの。
  - say: 即売会で三十本だけ売ったの。一本千五百円。
  - say: 私の担当は、敵を並べる所。
  - say: そしたら、買ってくれた人から写真が届いたの。
  - say: 「左上にドクロが山盛りで出てます」って。
  - chat: [ログボだけ勢, ドクロw]
  - say: 使わないシールを、全部0にしてたの。で、左上に集合してた。
  - chat: [ログボだけ勢, なんでドクロの絵なの]
  - say: なんでドクロかって、仮置きの絵よ。あとで替えるつもりだったの。
  - say: 替えなかったわ。
  - chat: [定時退社したい, 仮のやつって本番まで残るよね]
  - say: 仮のやつ、本番まで残るのよ。しかもその行が満員になって、本物の敵まで消えてたの。
  - chat: [定時退社したい, テストプレイで気づかなかったの]
  - say: テストプレイで気づかなかったのかって？ テストプレイ、私がやってたのよ。
  - say: 左上が変だなって、メモを書きかけて寝たの。
  - chat: [朝五時の報告者, 書きかけで寝るのは昔からなんですね]
  - say: {face: annoyed, text: 書きかけで寝るのは昔から、って。朝五時さんに言われたくないわ。}
  - say: お金の方も、部品代にも足りなかったわ。
  - chat: [手帳は三冊目, 赤字w]
  - say: 赤字よ。モーラに帳簿を見せるの、嫌だったもの。
  - say: で、直した版を送りますって連絡したの。
  - say: そしたら、ほとんどの人が「ドクロのままでいい」って。
  - chat: [同人誌即売会帰り, 優しい世界]
  - say: {face: shy, text: 優しい世界でしょう。今でも一本、手元に置いてあるの。}
  - chat: [ログボだけ勢, どうせ枕の下でしょ]
  - say: 枕の下って、なんで分かるのよ。
  - chat: [同人誌即売会帰り, ドクロ版欲しい]
  - say: ドクロ版は売らないわ。あれは手元の一本だけ。
  - chat: [同人誌即売会帰り, 次また作らないの？]
  - say: 次ね。作りたいわね。今度は左上から先に確かめるわ。
- title: 締め
  beats:
  - say: そろそろ終わるわね。
  - chat: [喫茶店の常連, たけのこ派から最後に一言]
  - say: たけのこ派から最後に一言？ 何よ。
  - chat: [喫茶店の常連, エラさんによろしく]
  - say: エラによろしくね。伝えておくわ。たぶん無言でうなずくだけだけど。
  - chat: [初見の猫, キノコの話面白かった。また来ます]
  - say: また来ます、ね。ありがと。次来たら、きのこかたけのこか、もう一回聞くからね。
  - chat: [規約は同意だけ, ツール消しました]
  - say: ツール消しました？ 本当？ よかった。パスワードも変えた？
  - chat: [規約は同意だけ, それは明日]
  - say: それは明日、ね。忘れたら、また聞くわ。
  - say: 次は、画面の上の点数のところがなんで動かないのか、の話をするわ。
  - say: じゃあ、おつかれさま。お腹すいたから、もう一回ローソン行こうかしら。……いや、寝るわ。
