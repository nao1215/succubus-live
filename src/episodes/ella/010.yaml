# エラ 010：曲のイントロが短くなった話と、七〇年代からの流行りの移り変わり（2026-10-27 新しく足した回）
# 出典は src/sources/ella/010.md。城の出来事は架空。
# 共通の話題：サブスクかCD・レコードか（fac_music_sub）、朝のラジオ（morning_tv）。
title: 最近の曲はなぜイントロが短いのか、とMTVが始まった夜
parts:
- title: 始まり（イントロをもう少し短く）
  beats:
  - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: 聞いてくださいまし。今日、また言われたんです。
  - chat: [ヘドバンで首やった, 何を]
  - say: 何を、ですよね。当方、城下のゲーム会社から、ゲームの曲のお仕事をいただいているんですけど。
  - say: そこの担当の方が、毎回おっしゃるんです。「イントロを、もう少し短く」って。
  - chat: [新譜しか聴かない, 長いんでしょ]
  - say: 長いんでしょ、って。長くないです！ 十六小節でございますよ。
  - chat: [ピアノ教室の先生, ゲームのタイトル画面なら長い]
  - say: ゲームのタイトル画面なら長い……先生まで。
  - chat: [鍵盤を売った, ソロが長いって言われてクビになった人だから]
  - say: {face: annoyed, text: 'ソロが長くてクビになった人だから？ その話は、今は関係ございません。'}
  - chat: [武道館二階東, 関係ある]
  - say: 関係ある、と。……ちょっとだけ、関係あるかもしれません。
  - chat: [ヘドバンで首やった, 担当の人、どんな人なの]
  - say: 首やった様、担当の方は、悪い方ではないんです。お菓子もくださいますし。
  - say: ただ、曲を聴くとき、毎回最初の五秒くらいで「うん」って言って止めるんです。
  - chat: [新譜しか聴かない, 五秒ｗ]
  - chat: [ピアノ教室の先生, それはつらい]
  - say: 五秒、笑いごとじゃございません。先生だけです、つらいと言ってくださるの。十六小節のうち、一小節目しか聴いていただけていないと思います。
  - chat: [鍵盤を売った, 最初の五秒に全部入れるしかない]
  - say: 最初の五秒に全部入れる。それができたら苦労しないんです。
  - chat: [初見の旅人, 初見です。イントロって短い方がいいんですか？]
  - say: 初見の旅人様、いらっしゃいませ。イントロは短い方がいいのか。それがですね、実際、最近の曲はイントロがとても短いんです。
  - say: 今日はその話をしようと思います。腹が立つので。
- title: 本題（二十秒から五秒へ）
  beats:
  - say: アメリカのオハイオ州立大学の方が、二〇一七年に調べた研究がございまして。
  - say: アメリカの年間の上位十曲を、一九八六年から二〇一五年まで調べたそうです。
  - chat: [新譜しか聴かない, 結果は]
  - say: 結果は。八〇年代の半ばは、イントロが平均で二十秒以上あった。
  - say: それが、二〇一五年には、五秒くらいになっていたそうです。
  - chat: [初見の旅人, 五秒！]
  - chat: [武道館二階東, 昔の曲はイントロでラジオのDJがしゃべってたもんな]
  - say: 昔はイントロでラジオのDJがしゃべってた。そうなんです！ DJの方が曲紹介をイントロの上でしゃべって、歌が始まる直前にぴたっと止める。あれ、好きでした。
  - chat: [鍵盤を売った, ラジオ今も聴く？]
  - say: ラジオ、今も聴きます。朝は、テレビをつけないで、NHK-FMを小さくつけております。
  - say: それから、bayfmの『POWER ROCK TODAY』。伊藤政則様の番組でございます。
  - chat: [武道館二階東, マサ伊藤！]
  - say: マサ伊藤！ そうです！ 武道館様も聴いておられます？
  - chat: [武道館二階東, 何十年聴いてるか分からない]
  - say: 何十年聴いてるか分からない。当方も、新しいバンドの名前は、あの番組で知ることが多いんです。
  - chat: [新譜しか聴かない, 新譜はこっちが教えてるのに]
  - say: 新譜はこっちが教えてるのに、と。新譜様にも、たくさん教わっております。ありがとうございます。
  - chat: [新譜しか聴かない, 素直でこわい]
  - say: 素直でこわい。こわくはございません。で、イントロでございます。
  - chat: [新譜しか聴かない, 今はすぐ歌が来ないと飛ばされる]
  - say: すぐ歌が来ないと飛ばされる。そこなんです。研究した方も、配信で聴くようになって、すぐ飛ばされるからじゃないかと言っておられます。
  - chat: [ピアノ教室の先生, 曲の速さも上がってるんだっけ]
  - say: 曲の速さも上がってる、そうみたいです、先生。テンポも少し速くなっている、と。
  - chat: [新譜しか聴かない, 自分もイントロ長いと飛ばす]
  - say: {face: surprised, text: '新譜様も、イントロが長いと飛ばすんですか！'}
  - chat: [新譜しか聴かない, 飛ばす]
  - say: 飛ばす、と。……実は、当方も、移動中はイントロ飛ばすんです。
  - chat: [武道館二階東, おい]
  - chat: [鍵盤を売った, 言ってることとやってること]
  - say: 「おい」「言ってることとやってること」。家ではちゃんと最初から聴きます！ 外は時間がないので、つい。
  - chat: [ヘドバンで首やった, じゃあ担当の人正しいじゃん]
  - say: じゃあ担当の人が正しい。正しいんでしょうね。くやしいですけど。
- title: 脇道（サブスクか、CDか）
  beats:
  - chat: [作業用BGM勢, 自分はサブスクでずっと流してるからイントロ気にしたことない]
  - say: 作業用BGM勢様、いらっしゃいませ。サブスクでずっと流しているから、イントロは気にしない。サブスク派でいらっしゃる。
  - chat: [作業用BGM勢, エラは？]
  - say: 当方は、ですか。家ではレコードかCDでございます。外では、取り込んだCDをシャッフルで。
  - chat: [新譜しか聴かない, サブスク使いなよ]
  - say: サブスク使いなよ、と言われましても。なんだか、持っていないと消えてしまう気がして。
  - chat: [ピアノ教室の先生, それは分かる。昔、配信から消えたアルバムがあった]
  - say: 配信から消えたアルバム、ありますよね！ 聴けなくなるの、本当に困るんです。
  - chat: [武道館二階東, 俺は全部CD。棚が三つ]
  - say: 全部CDで、棚が三つ！ 地震のとき、こわくございません？
  - chat: [武道館二階東, 一回倒れた。ジャケット割れた]
  - say: {face: sad, text: '一回倒れて、ジャケットが割れた。ケースが割れるの、悲しいですよね。中が無事でも。'}
  - chat: [作業用BGM勢, サブスクなら割れない]
  - say: サブスクなら割れない。それは、そうなんですけど。
  - say: 割れたケースも、なんだか捨てられないんです。当方、テープで留めて棚に戻します。
  - chat: [武道館二階東, 俺もテープで留めてる]
  - say: 武道館様もテープで留めてる。お仲間でございます。棚の中が、だんだん継ぎはぎになっていくんです。
  - ask:
      q: 皆様、音楽はサブスクで聴く派ですか、CDやレコードを買う派ですか。
      options:
      - c: サブスク
        r:
        - 'サブスク。{name}様、便利ですものね。'
        - 当方も、新しい曲を探すときは、正直ちょっと使っております。
      - c: CD・レコード
        r:
        - 'CD、レコード！ {name}様、お仲間です！ 置き場所、困っておられません？'
      - c: 両方
        r:
        - '両方。{name}様、いいとこ取りでございますね。'
        - 好きなものだけ買う、というの、無理がなくていいですね。
      - c: ラジオやYouTube
        r:
        - 'ラジオやYouTube。{name}様、普段は何を流しておられます？'
        - 当方は朝、NHK-FMを小さくつけております。
      npc:
      - [作業用BGM勢, 0]
      - [新譜しか聴かない, 0]
      - [武道館二階東, 1]
      - [ピアノ教室の先生, 2]
      - [鍵盤を売った, 3]
  - say: 当方は、レコードを買う派でございまして。
  - say: 当方の部屋は、床が傾いてきております。
  - chat: [鍵盤を売った, 床傾いてるの？]
  - say: サブスクの方が多いですね。で、床が傾いてるのか。傾いております。レコードが重くて。水平器を買ったら、毎朝それを見て落ち込むようになりました。
  - chat: [ヘドバンで首やった, 直しなよ]
  - say: 直しなよ、と。直すお金を、モーラ様が出してくださらないんです。
  - chat: [ピアノ教室の先生, 水平器毎朝見るのやめたら]
  - say: 水平器を見るのをやめたら？ 見ないと、余計に気になるんです。床の話はこのくらいにして、MTVでございます。
- title: 本題に戻る（ディスコの夜と、MTVの夜）
  beats:
  - say: 曲の作りって、聴き方が変わるたびに変わってきたんです。
  - say: 一九八一年の八月一日。アメリカで、MTVというテレビ局が始まりました。一日中、音楽のビデオを流す局です。
  - chat: [初見の旅人, 最初に流れたのは？]
  - say: 最初に流れたのは。バグルスの『ラジオ・スターの悲劇』。英語の題だと、「ビデオがラジオのスターを殺した」。
  - chat: [新譜しか聴かない, 狙いすぎ]
  - say: 狙いすぎ、ですよね！ 当方、こういう所が大好きなんです。
  - say: そこから、見た目で売れる曲が増えていきます。ビデオに、ものすごくお金をかけるようになったり。
  - chat: [武道館二階東, その二年前にディスコが爆破されてたよね]
  - say: その二年前にディスコが爆破。ああ、一九七九年の！ 武道館様、よくご存じで。
  - chat: [初見の旅人, 爆破？]
  - say: 爆破、本当なんです。シカゴの野球場で、ディスコのレコードを持ってきたら入場料が九十八セント、というイベントがあったんです。
  - say: 集めたレコードを、試合と試合の間に、グラウンドで爆破した。
  - chat: [初見の旅人, ええ……]
  - say: ええ……ですよね。そうしたら、お客さんがグラウンドに大勢なだれ込んでしまって。二試合目は中止。ホームのチームの負けになりました。
  - chat: [ヘドバンで首やった, 野球が巻き込まれてる]
  - say: 野球が巻き込まれてる。かわいそうなのは、野球の選手の方々でございます。
  - chat: [新譜しか聴かない, それでディスコ終わったの？]
  - say: それで終わったの？ って、「ディスコが死んだ夜」なんて言われますけど、当方はそうは思っていなくて。
  - say: ダンスの曲は、そのあともずっと形を変えて続いておりますから。
  - chat: [武道館二階東, 92年にニルヴァーナがマイケル・ジャクソンを1位から降ろしたのもあった]
  - say: ニルヴァーナがマイケル・ジャクソンを一位から降ろした。ありました。一九九二年の一月。『ネヴァーマインド』が、マイケル様の『デンジャラス』を抜いて一位に。
  - chat: [ピアノ教室の先生, あれは事件だった]
  - say: 先生も「あれは事件だった」。事件でしたね。
  - chat: [新譜しか聴かない, 今だとYouTubeの再生回数で決まるよね]
  - say: 今はYouTubeの再生回数で決まる。そうですね。それで思い出したんですけど、『江南スタイル』ってございましたでしょう。
  - chat: [初見の旅人, PSYの？]
  - say: PSYの、そうです。二〇一四年に、あの動画の再生回数が、YouTubeの数えられる上限を超えてしまったんです。
  - chat: [新譜しか聴かない, 上限あるの？]
  - say: 上限、あるんです。当時の数え方だと、二十一億回ちょっとが上限で。それを超えそうになった。
  - say: YouTubeの方は、「何か月か前に、もっと大きな数まで数えられるようにしてあった」と説明されたそうです。
  - chat: [ヘドバンで首やった, 気付いて直してたのえらい]
  - say: 気付いて直してたのえらい。ちゃんと備えておられたんですね。当方の配信の再生回数は、そんな心配、一生要りませんけど。
  - chat: [武道館二階東, で、ニルヴァーナの話は]
  - say: で、ニルヴァーナの話は。あ、はい。えっと……一九九二年の頃のことは、当方、あまり覚えておりませんで。
  - chat: [鍵盤を売った, 覚えてないのか]
  - say: 覚えてないのか、と言われますと。その頃、城下で録音のお手伝いを始めたばかりで、ばたばたしておりまして。
  - chat: [武道館二階東, 俺は覚えてる。レコード屋のグランジの棚が急に広くなった]
  - say: {face: surprised, text: 'レコード屋のグランジの棚が急に広くなった。棚が！ それ、すごく分かりやすいです。'}
  - say: 棚の広さで流行りが分かるの、いいですね。当方、そういう覚え方、大好きです。
  - chat: [新譜しか聴かない, 今はおすすめ欄の並びで分かる]
  - say: 今はおすすめ欄の並びで分かる。今はそうなんでしょうね。棚より、ずっと速く変わりそうです。
- title: 締め（十六小節を十二小節に）
  beats:
  - chat: [初見の旅人, で、イントロ短くするんですか？]
  - say: で、イントロを短くするのか。うーん。
  - chat: [新譜しか聴かない, 短くしな]
  - say: 短くしな、と。……十二小節にしてみます。
  - chat: [ヘドバンで首やった, 四小節しか減ってない]
  - say: 四小節しか減ってない。当方にとっては、大きな一歩なんです。
  - chat: [ピアノ教室の先生, 最初の五秒に一番いい音を置けば]
  - say: 最初の五秒に、一番いい音を。……それ、もったいなくないですか。
  - chat: [新譜しか聴かない, もったいながってるうちは長くなる]
  - say: {face: annoyed, text: 'もったいながってるうちは長くなる。新譜様、今日はずいぶん鋭いですね。'}
  - chat: [新譜しか聴かない, いつも]
  - say: 「いつも」。いつもでございましたね。
  - chat: [武道館二階東, 担当の人が五秒で止めなかったら勝ち]
  - say: 担当の方が五秒で止めなかったら勝ち。勝ち負けにしないでくださいまし。……でも、止められなかったら、ちょっとうれしいです。
  - chat: [作業用BGM勢, 作業終わったので寝ます]
  - say: 作業が終わったので寝る。お疲れ様でございました、作業用BGM勢様。おやすみなさいませ。
  - chat: [武道館二階東, 今日は何聴いて寝るの]
  - say: 何を聴いて寝るの、と。何にしましょう。棚を見てから決めます。
  - say: 本日もありがとうございました。ごきげんよう。
