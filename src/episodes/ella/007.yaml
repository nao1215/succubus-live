# 常連のお孫さん（運動会）の話が出る回なので、性的な冗談は置かない（family: true）。
# エラ 007：メガデスの最後のアルバムが、初めて全米一位になった話（2026-10-27 雑談の形に作り直し）
# 前の版の 002 の「二〇二六年」「締め　二通目の手紙」と、耳栓の話を材料にした。出典は src/sources/ella/007.md。月下晩餐会・ギル様・城の出来事は架空。
# 共通の話題：健康診断（health_checkup）、旅の荷物（travel_pack）、最後に泣いたのはいつ（rec_last_cry）。
title: メガデスの最後のアルバムが、四十年目で初めて全米一位になった
family: true
parts:
- title: 始まり（健康診断の結果）
  beats:
  - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: 今日、健康診断の結果が届きまして。
  - chat: [ヘドバンで首やった, どうだった]
  - say: どうだった、って。だいたい大丈夫だったんですけど。聴力の検査で、右の耳の高い音だけ、少し落ちておりました。
  - chat: [ピアノ教室の先生, え、大丈夫？]
  - say: 先生、ご心配ありがとうございます。大丈夫です、日常には困らない程度でございます。
  - say: ただ、心当たりがありまして。二〇二四年の夏に、城下のフェスで耳栓を忘れたんです。
  - chat: [新譜しか聴かない, 人には耳栓って言うのに]
  - say: 人には耳栓って言うのに。人には言うんです。人には。
  - say: そのとき、右耳が三日くらい、ずっと鳴っておりまして。それが、今になって数字で出てきた感じです。
  - chat: [鍵盤を売った, 自分も片耳ちょっと悪い。ライブハウスで働いてたから]
  - say: ライブハウスで働いていて、片耳が。鍵盤を売った様も。……皆様、本当に耳栓はお持ちくださいね。これは真面目なお願いです。
  - chat: [初見の旅人, ライブの耳栓ってあるんですか？]
  - say: ライブの耳栓、ございます。音楽用の耳栓は、音を全部消すのではなくて、うるさすぎる分だけ下げてくれるんです。
  - chat: [初見の旅人, 知らなかった]
  - say: 知らない方、多いんです。検査の方に「音楽のお仕事ですか」って聞かれて、何も言えませんでした。
  - chat: [武道館二階東, 耳栓はいつも何個持ってる？]
  - say: 武道館様、何個かは数えておりませんけど。旅に出るときは、必ず鞄に入れます。入れたか、三回確かめるんです。
  - say: それでも、着いた先で鞄を開けると、入っていないことがあって。
  - chat: [ヘドバンで首やった, どこ行ったの]
  - say: どこへ行ったと思います？ 家に帰ると、玄関の小皿の上にあるんです。
  - chat: [新譜しか聴かない, 三回確かめたのに]
  - say: 三回確かめたのに。三回とも、入れたつもりだったんです。不思議です。
  - chat: [武道館二階東, 首から下げとけば]
  - say: 首から下げとけば。あ、それいいですね。紐を付けて、首から。
  - chat: [ヘドバンで首やった, ヘドバンしたら飛んでく]
  - say: ヘドバンしたら飛んでく。首やった様は、まず首を治してくださいまし。
- title: 本題（最後のアルバムで、初めての一位）
  beats:
  - say: それで本日は、今年の一月のお話でございます。
  - say: メガデス様が、最後のアルバムと、最後のツアーを発表なさいまして。
  - chat: [新譜しか聴かない, それは聴いた。新譜だから]
  - say: {face: smile, text: 'それは聴いた、新譜だから。新譜様が、メガデス様を！'}
  - chat: [新譜しか聴かない, 新譜は全部聴くって決めてるから]
  - say: 新譜は全部聴くって決めてる。そういう決め方、当方けっこう好きでございます。
  - say: アルバムの名前は、ただの『Megadeth』。今年の一月二十三日に出ました。
  - say: それが、アメリカのアルバムの順位で、一位になったんです。
  - chat: [武道館二階東, 初めての一位なんだよね]
  - say: 初めての一位、なんです！ 四十年くらいやってきて、最後の一枚で、初めて。
  - chat: [ピアノ教室の先生, それまでの最高は？]
  - say: それまでの最高は。一九九二年の『Countdown to Extinction』の、二位でございます。
  - chat: [武道館二階東, そのときの一位がビリー・レイ・サイラス]
  - say: そのときの一位がビリー・レイ・サイラス。そうなんです。カントリーの方に、一位を取られたんです。
  - chat: [新譜しか聴かない, オールド・タウン・ロードに出てた人？]
  - say: 『Old Town Road』に出てた人、そう、その方です。リル・ナズ・X様の曲で、一緒に歌っておられた。
  - chat: [ヘドバンで首やった, 宿敵カントリー]
  - say: 宿敵カントリー、とまでは申しませんけど……当方の中では、少しだけ。
  - chat: [新譜しか聴かない, オールド・タウン・ロードってカントリーのチャートから外されたんだよね]
  - say: カントリーのチャートから外された、そうなんです！ 二〇一九年。最初はカントリーのチャートに入ったのに、「今のカントリーらしさが足りない」と外されて。
  - say: そのあと、ビリー・レイ・サイラス様が加わった版が出て、全米の一位を十九週続けた。
  - chat: [初見の旅人, 十九週！]
  - chat: [武道館二階東, メガデスの一位を止めた人が、また一位取ってる]
  - say: 十九週！ メガデスの一位を止めた方が、また一位。九二年と、二〇一九年と。当方、あの方には、ちょっと頭が上がりません。
  - chat: [新譜しか聴かない, あの曲のビート、30ドルで買ったやつらしいよ]
  - say: {face: surprised, text: 'あの曲のビートは三十ドルで買ったもの？ え、そうなんですか。'}
  - chat: [新譜しか聴かない, ナイン・インチ・ネイルズのサンプル使ってるやつ]
  - say: ナイン・インチ・ネイルズの音を使ってる。当方、それは知りませんでした。ナイン・インチ・ネイルズとカントリー、意外なところでつながるんですね。
  - chat: [ピアノ教室の先生, 音楽って変なとこでつながる]
  - say: 変なとこでつながる、本当に。それからこのアルバム、最後のほうに、驚く曲が入っておりまして。
  - say: 'あ、メガデス様の、最後のアルバムの方でございます。'
  - chat: [鍵盤を売った, ライド・ザ・ライトニング]
  - say: 鍵盤様、先に言われてしまいました。そうです。メタリカ様の『Ride the Lightning』を、メガデス様が演っておられる。
  - chat: [初見の旅人, ライバルの曲を？]
  - say: ライバルの曲を、ですよね。でもムステイン様は、あの曲を作った方のお一人でもあるんです。
  - say: メタリカにいた頃に、一緒に書いた曲なんですよ。
  - chat: [武道館二階東, それを最後のアルバムに入れたのか]
  - say: それを最後のアルバムに。そうなんです。当方、初めて聴いたとき、泣いてしまいました。
  - chat: [ヘドバンで首やった, 最近泣いたのそれ？]
  - say: 首やった様、そうです。最近泣いたのは、それが最後です。
  - chat: [新譜しか聴かない, 敬語訳は？]
  - say: 敬語訳。『Ride the Lightning』。「稲妻に、お乗りあそばせ」。
  - chat: [ヘドバンで首やった, 乗りたくない]
  - chat: [ピアノ教室の先生, 乗せたくない]
  - say: 乗りたくない、乗せたくない。皆様、冷たいです。
- title: 脇道（最後に泣いたのはいつ）
  beats:
  - chat: [鍵盤を売った, 泣いたって、どの辺で？]
  - say: どの辺で泣いたか。最初のギターが鳴った所で、もうだめでした。ムステイン様の弾き方で、あのリフが鳴るんです。
  - chat: [ヘドバンで首やった, 聴きたくなってきた]
  - say: 聴きたくなってきた、ぜひ。十一曲目でございます。……あ、でも、一曲目から順番に聴いてくださいね。
  - chat: [新譜しか聴かない, 自分は飛ばして聴いた]
  - say: 飛ばしたんですか。……まあ、新譜様らしいです。
  - chat: [初見の旅人, みんな最近泣いたのいつですか]
  - chat: [武道館二階東, 先週、孫の運動会]
  - say: {face: surprised, text: '先週、お孫さんの運動会で！ 武道館様、おじいさまでいらしたんですか。'}
  - chat: [武道館二階東, 言ってなかったっけ]
  - say: 言ってなかったっけ、って。初耳でございます。四十年分の会場の話は伺っておりましたけど。
  - chat: [新譜しか聴かない, 泣いてない。泣くような曲聴いてない]
  - say: 泣くような曲は聴いてない。新譜で泣ける曲、ございませんか。
  - chat: [新譜しか聴かない, 泣くより踊る]
  - say: 泣くより踊る。それもいいですね。
  - chat: [ヘドバンで首やった, 玉ねぎ切ったとき]
  - say: 玉ねぎを切ったとき。それは泣いたうちに入りません。
  - chat: [ヘドバンで首やった, 入るよ。涙出たし]
  - say: 涙が出たから入る。……まあ、入れておきましょうか。
  - chat: [鍵盤を売った, 夜勤明けに朝日見たとき]
  - say: 夜勤明けの朝日。それはちょっと分かります。何でもない朝日で、急にくることありますよね。
  - chat: [初見の旅人, 自分は映画でした]
  - say: 旅人様は映画。何の映画でしょう。
  - chat: [初見の旅人, すみません、ご飯できたので抜けます]
  - say: ご飯ができた。あ、お食事でしたか。いってらっしゃいませ。ゆっくり召し上がってくださいまし。
  - chat: [ピアノ教室の先生, 最後のツアーは日本来るの？]
  - say: 最後のツアーは日本に来るか。あ、そうでした。ツアーの話をしようと思っていたんです。
- title: 本題に戻る（最後のツアー）
  beats:
  - say: ツアーは、地域ごとに日程が少しずつ足されているところでございます。
  - chat: [武道館二階東, 日本来る？]
  - say: 武道館様も気になりますよね。当方が調べた限りでは、まだ分かりません。
  - chat: [鍵盤を売った, 来たら行く？]
  - say: 行きます、来てくださったら。今度は耳栓を、玄関の小皿じゃなくて、ちゃんと鞄に入れて。
  - chat: [新譜しか聴かない, 最前列狙う？]
  - say: 最前列を狙うか。最前列は、抽選の神様次第でございます。当方、抽選とは仲が悪いので。
  - chat: [ヘドバンで首やった, 最前列でかぶりつき]
  - say: 最前列でかぶりつき。行ってみたいですね。いつも後ろのほうでございますから。
  - chat: [武道館二階東, 前は前で首が痛い。見上げるから]
  - say: 前は前で、見上げて首が痛い。そうなんですか。武道館様、最前列もご経験が。
  - ask:
      q: 好きなバンドの「最後のツアー」。皆様は、行かれますか。
      options:
      - c: 行く。何があっても
        r:
        - '何があっても行く。{name}様、そのお覚悟、すてきです。耳栓と、首のお守りを。'
        - 当方も、行けるなら這ってでも参ります。
      - c: 行かない。最後を見たくない
        r:
        - '最後を見たくない。{name}様のお気持ちも、分かります。'
        - 当方も、オジー様のときは、観る前の晩ちょっと迷いましたから。
      - c: 「最後」って言って戻ってくるから様子見
        r:
        - '「最後」って言って戻ってくるから様子見。{name}様、長くメタルを見てこられた方の言葉ですね。'
        - 戻ってきてくださったら、それはそれでうれしいですしね。
      npc:
      - [武道館二階東, 0]
      - [新譜しか聴かない, 2]
      - [鍵盤を売った, 1]
      - [ヘドバンで首やった, 0]
      - [ピアノ教室の先生, 2]
  - chat: [鍵盤を売った, 見たくないって押したけど本当は行きたい]
  - say: 行く派と様子見派が、同じくらいですね。で、鍵盤様は、見たくないを押したけど本当は行きたい。そういうときは、だいたい行ったほうがいいと、当方は思います。
  - chat: [武道館二階東, 最後のツアーって言って戻ってきたバンド、結構あるよね]
  - say: 最後と言って戻ってきたバンド。ございますね。当方、何組か思い浮かびます。名前は申しませんけど。
  - chat: [ヘドバンで首やった, 言わないのかよ]
  - say: 言わないのかよ、と言われましても。言うと、ファンの方に怒られそうなので。
  - chat: [新譜しか聴かない, 戻ってきたら嬉しいくせに]
  - say: 戻ってきたら嬉しいくせに。嬉しいです。それはもう、すごく。
- title: 締め（ギル様からの二通目）
  beats:
  - say: それから、最後に当方の話を一つだけ。
  - say: 先週、ギル様から、二通目の手紙が届きまして。
  - chat: [武道館二階東, 月下晩餐会の？]
  - chat: [新譜しか聴かない, 返事してないのに二通目来たの]
  - say: 月下晩餐会の、です。返事してないのに二通目、来たんです。中に、その夜に演奏する曲の表が入っておりまして。
  - say: 八曲。その中の一曲が、当方が最初の部分を書いた曲でございました。
  - chat: [鍵盤を売った, おお]
  - say: で、曲の表の下に、作った人の名前が書いてあって。
  - chat: [ヘドバンで首やった, 名前あった？]
  - say: 名前、ございました。ギル様の名前の隣に。
  - chat: [鍵盤を売った, よかった！]
  - say: よかった、んですけど。「作曲・ギル、エラー」って。
  - chat: [ヘドバンで首やった, エラー]
  - chat: [新譜しか聴かない, 伸ばし棒ｗｗｗ]
  - say: {face: annoyed, text: '笑いますよね、伸ばし棒。一本、多いんです。四十年経っても、名前を間違えるんですよ、あの方。'}
  - chat: [ピアノ教室の先生, わざと？]
  - say: わざとか。分かりません。わざとなのか、本当に覚えていないのか。どちらでも腹が立ちます。
  - say: でも、載ってはおりました。
  - chat: [鍵盤を売った, で、返事は？]
  - say: で、返事は。……今、書いている途中でございます。
  - chat: [武道館二階東, 何て書いてるの]
  - say: 何を書いているかと申しますと。一行目の「拝啓」で、もう二日止まっております。
  - chat: [ピアノ教室の先生, 拝啓のあとは季節の挨拶]
  - say: 拝啓のあとは季節の挨拶。先生、そこなんです。何を書けばいいのか分からなくて。
  - chat: [ヘドバンで首やった, 秋なのでチューニングが狂いやすいですね、とか]
  - say: {face: laugh, text: '「秋なのでチューニングが狂いやすいですね」。それ、ギル様は怒ると思います。'}
  - chat: [鍵盤を売った, 怒らせればいいじゃん]
  - say: 怒らせればいい。……ちょっと、書きたくなってきました。
  - chat: [新譜しか聴かない, 進んでない]
  - say: 進んでない、と。進んでおりません。続きは、また。それでは皆様、ごきげんよう。
