# エラ 008：ゼルダの、敵に見つかったときのピアノの話（2026-10-27 新しく足した回。前の版の 001 の脱線を広げた）
# 出典は src/sources/ella/008.md。城の出来事は架空。
# 共通の話題：初めて遊んだゲーム（child_game_first）、仕事の失敗（work_mistake）。
title: ゼルダの音楽は、なぜ敵に見つかるとドキッとするのか
parts:
- title: 始まり（直した茶碗）
  beats:
  - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: 本日は、お茶の茶碗が新しくなっております。……新しくはないですね。直ってまいりました。
  - chat: [ヘドバンで首やった, 割ったの？]
  - say: 割りました。だいぶ前なんですけど、金継ぎに出していたのが、やっと戻ってきまして。
  - chat: [初見の旅人, 金継ぎって？]
  - say: 金継ぎって何か。割れた器を漆でくっつけて、継ぎ目に金を塗る直し方でございます。継ぎ目が金色の線になるんです。
  - chat: [初見の旅人, おしゃれ]
  - chat: [武道館二階東, なんで割ったの]
  - say: おしゃれでしょう。で、なんで割ったか。それが……ゲームをしていて、驚いて落としたんです。
  - chat: [レトロゲー老人, 何のゲーム]
  - say: 何のゲームか、レトロゲー老人様。ゼルダの『ブレス オブ ザ ワイルド』でございます。
  - chat: [ヘドバンで首やった, あー、敵に見つかったときのピアノ]
  - say: {face: surprised, text: '敵に見つかったときのピアノ！ それです！ 分かってくださる！'}
  - chat: [レトロゲー老人, あれは心臓に悪い]
  - say: 心臓に悪いですよね！ 野原を歩いていて、急に、ぽろろろって。
  - chat: [初見の旅人, 驚いて茶碗落とすの、ちょっと見たかった]
  - say: 茶碗を落とすの、見たかった？ 見せられるものではございません。お茶が床に全部いきましたので。
  - chat: [ヘドバンで首やった, 主様の茶碗？]
  - say: 首やった様、鋭い。主様の、お気に入りの茶碗でございました。
  - chat: [新譜しか聴かない, ゼルダやったことない]
  - say: ゼルダをやったことがない。あら、そうでございますか。では今日は、新譜様にも分かるようにお話しします。
  - chat: [新譜しか聴かない, ゲームの曲の話？]
  - say: そう、ゲームの曲の話。今日はゲームの音楽の日でございます。紅茶は、軽めのダージリンで。
- title: 本題（音楽のない野原）
  beats:
  - say: あのゲーム、広い野原を歩くんですけど、その野原に、ほとんど曲が流れていないんです。
  - chat: [新譜しか聴かない, え、無音？]
  - say: 無音か、というと、無音ではないんです。風の音、草の音、川の音。それが聞こえている。
  - say: で、ときどき、ぽろん、ぽろんとピアノが少しだけ鳴る。
  - chat: [レトロゲー老人, 昔のゼルダはずっと曲鳴ってたよね]
  - say: 昔のゼルダはずっと曲が鳴ってた。そうなんです。昔は野原でも、ずーっと勇ましい曲が鳴っておりました。それも好きですけど。
  - say: 作った方々のお話だと、野原の曲をやめて、まわりの音そのものを曲の代わりにしたかったそうなんです。
  - chat: [夜勤明けの人, 今こっち風すごい。窓ガタガタいってる]
  - say: 夜勤明け様、いらっしゃいませ。お疲れ様でございます。風で窓がガタガタ？ 大丈夫ですか。
  - chat: [夜勤明けの人, 大丈夫。うるさいだけ]
  - say: 大丈夫、うるさいだけ。よかった。当方、風の強い夜は、窓が鳴る音の高さを当てるんです。
  - chat: [新譜しか聴かない, 何それ]
  - say: 何それ、ですよね。ひゅーって鳴るでしょう。あれ、だいたいラとシの間なんです。
  - say: 一度、台風の夜にピアノで合わせていたら、隣の厨房の方々も起きてきてしまって。
  - say: 皆で、窓の音を当てる会になりました。
  - chat: [ヘドバンで首やった, 平和な台風]
  - chat: [武道館二階東, 誰が一番当たったの]
  - say: 平和な台風でございましょう。誰が一番当たったか。料理長でございます。当方、一番外しました。
  - chat: [夜勤明けの人, 今のこっちの窓は何の音？]
  - say: 夜勤明け様の窓は何の音か。画面越しだと聞こえないんです。鳴らしてみてくださいまし。……あ、寝てくださいまし、やっぱり。
  - chat: [夜勤明けの人, 寝ます]
  - chat: [ピアノ教室の先生, なんでピアノにしたんだろ]
  - say: なんでピアノか。先生、それがいいお話なんです！
  - say: 持ち歩けない、大きな楽器にしたかったって。広い世界の感じを出すために。
  - chat: [ピアノ教室の先生, あー、なるほど]
  - chat: [ヘドバンで首やった, 笛とかだと旅の感じになるもんね]
  - say: 笛だと旅の感じになる。そうそう、そうなんです！ 首やった様、今日は冴えておられる。
  - say: それで、静かなところへ、敵に見つかると、急に曲が始まる。
  - chat: [初見の旅人, 静かだから余計にびっくりするんですね]
  - say: 静かだから余計にびっくり。そうなんです。ずっと鳴っていたら、驚かないんですよ。
  - chat: [新譜しか聴かない, ホラー映画の静かなとこと同じだ]
  - say: ホラー映画の静かなとこと同じ。そう、同じでございます！ 静かになったら、何か来る。
  - chat: [初見の旅人, 自分それでいつもコントローラー投げそうになります]
  - say: コントローラーを投げそうに。投げてはいけませんよ。当方は茶碗を落としましたけど。
  - chat: [武道館二階東, 茶碗はいくらで直ったの]
  - say: 茶碗はいくらで直ったか……それは、聞かないでくださいまし。モーラ様にも、まだ申し上げておりません。
  - chat: [武道館二階東, ライブの前の暗転みたいなもんか]
  - say: ライブの前の暗転みたいなもの。あ、近いです。静かになった瞬間って、どきどきしますもんね。
  - say: あと、大事な建物に近づくと、音楽が鳴り始めるでしょう。
  - say: 作った方々は、どのくらい近づいたら鳴らすか、どのくらいの大きさで鳴らすか、一か月くらい試したそうです。
  - chat: [新譜しか聴かない, 一か月？]
  - say: 一か月？ はい、一か月。当方、そういう話を聞くと、もう、うれしくて。
- title: 脇道（初めてのゲーム）
  beats:
  - chat: [レトロゲー老人, エラが初めてやったゲームは何？]
  - say: 当方が初めてやったゲーム。ファミコンの『ドラゴンクエスト』でございます。
  - chat: [レトロゲー老人, 渋い]
  - say: 渋い、でしょう。それで、最初に流れる序曲が大好きで。あれが聴きたくて、電源を何回も入れ直したんです。
  - chat: [ヘドバンで首やった, 進めろ]
  - say: 進めろ、と。進みませんでした。最初の町を出る前に、序曲を何十回も聴いておりました。
  - chat: [レトロゲー老人, すぎやまこういちの序曲はね、いい]
  - say: すぎやまこういち様の序曲、いいですよね！ 一九八六年のファミコンで、あの音の数で、ちゃんとオーケストラみたいに聞こえるんです。
  - chat: [初見の旅人, ファミコンって音少ないんですか]
  - say: 旅人様、そう、ファミコンは音が少ないんです。同時に鳴らせる音が、ざっくり言うと四つか五つくらい。
  - say: その少ない音で、あの堂々とした感じを出しているのが、当方には不思議で。
  - chat: [レトロゲー老人, 電源入れ直したくなる気持ちは分かる]
  - chat: [新譜しか聴かない, ゲームしてない]
  - say: ゲームしてない。していないですね。音楽を聴く機械でございました。
  - chat: [武道館二階東, 俺はインベーダー。喫茶店のテーブルのやつ]
  - say: {face: surprised, text: 'インベーダー、喫茶店のテーブルの！ 本物でございますか。'}
  - chat: [武道館二階東, 百円玉積んでた]
  - chat: [初見の旅人, 自分はポケモンでした]
  - say: 百円玉を積んで。……旅人様はポケモン！ 何色でした？
  - chat: [初見の旅人, 緑。友達がみんな赤だったので]
  - say: 友達がみんな赤だったので、緑。お友達と交換しないと、そろわないんでしたっけ。
  - chat: [初見の旅人, そうです。通信ケーブルで]
  - say: 通信ケーブルで。つないで交換。それ、当方には一番うらやましい遊び方です。
  - chat: [ヘドバンで首やった, 自分はゲームボーイのテトリス]
  - say: ゲームボーイのテトリス！ あの曲、ロシアの民謡が元なんですよね。
  - chat: [ヘドバンで首やった, 民謡なんだ。ずっとゲームの曲だと思ってた]
  - say: ずっとゲームの曲だと思ってた。当方も、知ったときは驚きました。民謡の方が、ずっと先輩なんです。
  - chat: [レトロゲー老人, Aタイプのやつね]
  - say: Aタイプのやつ、それでございます。主様も、最初はゲーム&ウオッチだったそうです。皆様は、どの機械でした？
  - ask:
      q: 皆様が初めて遊んだゲームは、どの機械でございましたか。
      options:
      - c: ファミコンかそれより前
        r:
        - 'ファミコンかそれより前。{name}様、当方と同じ時代でございます。カセットの端子、ふーってしました？'
        - 当方は、綿棒で拭く派でございました。
      - c: スーファミ・プレステ・64のころ
        r:
        - 'スーファミ、プレステ、64のころ。{name}様、時のオカリナの世代でいらっしゃるかも。'
      - c: DSやWii以降
        r:
        - 'DSやWii以降。{name}様、お若い。'
        - 当方、新譜しか聴かない様と同じ顔で見てしまいそうです。
      - c: スマホのゲーム
        r:
        - 'スマホのゲーム。{name}様、今はそれがいちばん多いのかもしれませんね。'
        - スマホのゲームの曲も、ちゃんと聴くといいのがたくさんございますよ。
      npc:
      - [レトロゲー老人, 0]
      - [武道館二階東, 0]
      - [新譜しか聴かない, 3]
      - [ヘドバンで首やった, 1]
      - [初見の旅人, 2]
  - say: 'そういえば、『時のオカリナ』の野原の曲のお話もございます。'
  - say: あの野原の曲、ちょっと面白い作りなんですよ。
  - chat: [新譜しか聴かない, で、時のオカリナの野原の何が面白いの]
  - say: ファミコンかそれより前の方が多いですね。で、時のオカリナの野原の何が面白いか。あっ、そうでした。そっちに戻ります。
- title: 本題に戻る（つなぎ合わせる野原の曲）
  beats:
  - say: 『時のオカリナ』の、ハイラル平原という野原の曲。作曲の近藤浩治様が、講演でお話しになっているんです。
  - say: 短いフレーズを十二個用意しておいて、そこから八個をその場で選んで、つないで鳴らしていたと。
  - chat: [初見の旅人, 毎回違う曲になるってことですか]
  - say: 毎回違う曲になる、そうです。同じ曲なのに、並びが毎回ちょっと違う。だから何時間聴いても飽きにくい。
  - chat: [レトロゲー老人, だから飽きなかったのか]
  - say: だから飽きなかったのか、と。そう思うと、うれしくなりません？
  - say: それから、スーパーマリオワールドの、ヨッシーに乗ったとき。
  - chat: [ヘドバンで首やった, ドラムが入るやつ！]
  - say: ドラムが入るやつ！ そうです！ ヨッシーに乗ると、曲にドラムが足されて、降りると消える。
  - say: 曲を変えているのではなくて、ドラムの音だけを出したり消したりしているんです。
  - chat: [新譜しか聴かない, 細かい]
  - say: 細かい、んです。当方、こういう細かいのが大好きで。
  - say: 近藤様は、同じやり方を、十年以上あとのスーパーマリオサンシャインのヨッシーでも使ったそうです。
  - chat: [レトロゲー老人, 気に入ってたんだな]
  - say: 気に入ってたんだな。気に入っておられたんでしょうね。当方も、自分の好きなやり方は何回も使ってしまいます。
  - chat: [新譜しか聴かない, エラの場合は敬語訳]
  - say: 当方の場合は敬語訳。それは、やり方ではなくて、ただの癖でございます。
  - chat: [ピアノ教室の先生, エラも劇伴作ってるんでしょ。そういうのやる？]
  - say: 当方の劇伴で、そういうのをやるか。やろうとしたんです。でも、当方の場合は失敗の話がございまして。
  - say: 城下のゲームの曲で、繰り返しのつなぎ目が、一拍ずれたまま納品してしまったんです。
  - chat: [武道館二階東, ばれた？]
  - say: ばれた？ いえ、誰も気付かなかったんです。発売されて、今もそのまま。
  - chat: [鍵盤を売った, 気付かれないならセーフ]
  - say: 気付かれないならセーフ……なんでしょうか。当方だけ、そのゲームの音が聞こえるたびに、肩がびくっとします。
  - chat: [ヘドバンで首やった, 敵に見つかったときのピアノみたいに]
  - say: {face: laugh, text: '敵に見つかったときのピアノみたいに。本当ですね。自分の曲で驚いております。'}
- title: 締め（目覚まし）
  beats:
  - chat: [レトロゲー老人, 主様の目覚ましもエラが作ってるんだっけ]
  - say: 主様の目覚まし、作っております。実は、時のオカリナの話を聞いてから、同じ作りにしてみたんです。
  - say: 短いフレーズをいくつも作って、毎朝、違う並びで鳴るように。
  - chat: [新譜しか聴かない, 起きるの？]
  - say: 起きるの？ と。起きてくださいません。
  - chat: [ヘドバンで首やった, ｗｗｗ]
  - chat: [鍵盤を売った, 飽きないから気持ちよく寝られるのでは]
  - say: 飽きないから、気持ちよく寝られる……そうかもしれません。それは考えておりませんでした。
  - chat: [レトロゲー老人, 敵に見つかったピアノにすればいい]
  - say: 敵に見つかったピアノを目覚ましに。それ、いいかもしれません。明日、試してみます。茶碗を持っていないときに。
  - chat: [ヘドバンで首やった, リゼ様に茶碗落とされたらどうするの]
  - say: 主様が驚いて茶碗を落としたら。そのときは、また金継ぎに出します。
  - chat: [武道館二階東, 茶碗二つ目]
  - say: 茶碗二つ目。金の線が増えていきますね。それはそれで、きれいかもしれません。
  - say: 本日もありがとうございました。ごきげんよう。
