# エラ 009：ジャズの名盤の、少し高かったA面の話（2026-10-27 新しく足した回）
# 出典は src/sources/ella/009.md。城の出来事は架空。
# 共通の話題：ミルクティーはミルクが先か紅茶が先か（fac_milk_tea）、行ってみたい場所（travel_dream）。
title: マイルス・デイヴィスの名盤は、三十年以上ちょっと速く回っていた
parts:
- title: 始まり（ミルクが先か、紅茶が先か）
  beats:
  - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: 本日はジャズの日なので、ダージリンでございます。
  - chat: [鍵盤を売った, こんにちは。ジャズの日珍しい]
  - say: 鍵盤を売った様、ごきげんよう。ジャズの日は珍しい、ですよね。たまにはメタル以外も、と思いまして。
  - chat: [ヘドバンで首やった, 首休めの日]
  - say: 首休めの日、そうですね。首やった様は、今日は首を休めてくださいまし。
  - chat: [作業用BGM勢, ミルクティー派です。ミルク先に入れます]
  - say: あ。
  - say: 作業用BGM勢様、ミルクティー派で……ミルクが先でございますか。
  - chat: [作業用BGM勢, だめ？]
  - say: だめ？ と聞かれましても。だめではございません！ だめではないんですけど……当方は、紅茶が先なんです。
  - chat: [武道館二階東, 派閥あるの？]
  - say: 派閥、あるんです。イギリスでは、もう何十年も揉めているらしくて。
  - say: 作家のジョージ・オーウェル様が、紅茶が先だと書いておられまして。当方はそちら側です。
  - chat: [初見の旅人, 理由あるんですか]
  - say: 理由はございます。紅茶を先に入れると、ミルクを足しながら、色を見て量を決められるんです。
  - chat: [作業用BGM勢, ミルク先だと混ざりやすい気がする]
  - say: ミルクが先だと混ざりやすい。それも分かります。分かるんですけど、譲れないんです。
  - say: ちなみに、城では主様がミルク先なんです。
  - chat: [新譜しか聴かない, 主様と敵対してる]
  - say: 主様と敵対してる？ 敵対はしておりません。毎朝、黙って見ているだけでございます。
  - chat: [ピアノ教室の先生, 黙って見てるの怖い]
  - say: 黙って見てるの怖い、と。何も言いません。言いませんけど、見てはおります。
  - chat: [ヘドバンで首やった, 自分はミルク入れない。ストレート]
  - say: ミルクは入れないで、ストレート。それが一番、揉めませんね。
  - ask:
      q: 皆様、ミルクティーは、どちらを先に入れますか。
      options:
      - c: ミルクが先
        r:
        - 'ミルクが先。{name}様、主様と同じでございます。'
        - 当方、黙って見ておりますね。……冗談です。お好きにどうぞ。
      - c: 紅茶が先
        r:
        - '紅茶が先！ {name}様、お仲間でございます。'
        - 色を見ながら足せるの、いいですよね。
      - c: ミルクは入れない
        r:
        - 'ミルクは入れない。{name}様、揉めない側でございますね。'
        - ストレートも好きですよ。ダージリンなら、特に。
      - c: そもそも紅茶飲まない
        r:
        - 'そもそも紅茶を飲まない。{name}様、それはそれで。コーヒーでございますか？'
        - 城でもコーヒーの方が多いので、当方は少数派なんです。
      npc:
      - [作業用BGM勢, 0]
      - [武道館二階東, 3]
      - [新譜しか聴かない, 3]
      - [鍵盤を売った, 1]
      - [ピアノ教室の先生, 1]
  - chat: [鍵盤を売った, 紅茶が先です]
  - say: {face: smile, text: '紅茶が先の方と、そもそも飲まない方が多いですね。鍵盤様も、紅茶が先！ 心強いです。'}
  - chat: [新譜しか聴かない, そもそも紅茶飲まない派もいる]
  - say: 紅茶を飲まない派もいる。そうなんですよね。この配信、コーヒーの方が多いんでしょうか。
  - chat: [武道館二階東, 缶コーヒー]
  - say: 武道館様は缶コーヒー。当方、冬に一本だけ、こっそり飲みます。手を温めてから。
  - chat: [ヘドバンで首やった, こっそりの意味]
  - say: こっそりの意味、ですか。紅茶の人が缶コーヒーを飲んでいるところ、見られたくないじゃないですか。
  - say: あ、紅茶の話で止まってしまいました。今日はジャズでございます、ジャズ。
- title: 本題（『カインド・オブ・ブルー』のA面）
  beats:
  - say: マイルス・デイヴィス様の『カインド・オブ・ブルー』というアルバム。一九五九年の。
  - chat: [初見の旅人, 名前は聞いたことあります]
  - say: お名前は聞いたことがある、そうでしょう。ジャズで一番売れたアルバムの一つと言われております。お店で流れていることも多いです。
  - chat: [鍵盤を売った, ピアノがビル・エヴァンスなんだよね]
  - say: ピアノがビル・エヴァンス。そうなんです、鍵盤を売った様！ ほとんどの曲で、エヴァンス様が弾いておられます。
  - say: 一曲だけ、ウィントン・ケリー様という別の方が弾いていて。
  - chat: [ピアノ教室の先生, フレディ・フリーローダー]
  - say: 『Freddie Freeloader』、そうです、先生。聴き比べると、弾き方が全然違って面白いんですよ。
  - chat: [初見の旅人, どう違うんですか]
  - say: うーん……ケリー様のほうが、ころころ弾む感じ。エヴァンス様は、静かに、和音をそっと置いていく感じでございます。
  - chat: [初見の旅人, なんとなく分かりました]
  - chat: [ピアノ教室の先生, あれのA面の話？]
  - say: 旅人様、なんとなくで十分です。で、「あれのA面の話？」。先生、さすが。そうです、A面の話です。
  - say: このアルバム、二回に分けて録っておりまして。最初の日に録った三曲が、レコードのA面に入っているんです。
  - say: その最初の日、録音の機械が、ほんの少しゆっくり回っていたらしいんです。
  - chat: [新譜しか聴かない, ゆっくりだとどうなるの]
  - say: ゆっくりだとどうなるか。ゆっくり録って、普通の速さで流すと、少し速く、少し高く聞こえるんです。
  - chat: [新譜しか聴かない, 早送りみたいな？]
  - say: 早送りみたいな、そうです、ほんのちょっとだけの早送り。
  - chat: [初見の旅人, それ誰も気付かなかったんですか？]
  - say: 旅人様、それが、一九九二年に、CDを作り直すときに技師の方が気付いたそうなんです。
  - chat: [鍵盤を売った, 30年以上そのまま？]
  - say: 三十年以上そのまま？ 三十年以上。世界中の方が、少し高い『So What』を聴いておられたんです。
  - chat: [ピアノ教室の先生, 合わせて練習してた人、困っただろうね]
  - say: 合わせて練習してた人が困った。そう！ レコードに合わせて楽器を吹くと、自分だけ低く聞こえるんです。
  - say: それで悩んだ方、きっと大勢いらしたと思いますよ。
  - chat: [ヘドバンで首やった, どのくらいずれてたの]
  - say: どのくらい、ですよね。「四分の一音くらい高い」とよく言われるんですけど。
  - say: 調べたら、機械が一パーセントちょっと遅かったという話もあって、それだともっと小さいずれなんです。
  - chat: [新譜しか聴かない, 結局どっち]
  - say: 結局どっち、と言われましても、分かりませんでした。ずれていたのは確かで、どのくらいかは、話によって違うんです。
  - chat: [ピアノ教室の先生, エラの歌は四分の一音低いよね]
  - say: {face: annoyed, text: '当方の歌は四分の一音低い……先生。今、それを言いますか。'}
  - chat: [武道館二階東, マイルスと合わせたらちょうどいいんじゃない？]
  - say: {face: laugh, text: 'マイルスと合わせたらちょうどいい？ いえ、それでは、ますます離れてしまいます。先生、笑っておられますね。'}
  - chat: [ピアノ教室の先生, 笑ってない]
- title: 脇道（行ってみたい店）
  beats:
  - chat: [鍵盤を売った, ジャズのお店とか行く？]
  - say: ジャズのお店。行きたいお店があるんです。ニューヨークの、ヴィレッジ・ヴァンガード。
  - chat: [初見の旅人, どんなお店ですか]
  - say: 旅人様、地下にある、小さなジャズのお店です。古くからあって、名盤のライブ録音がたくさんそこで録られております。
  - say: 狭くて、階段を下りていくんですって。一晩だけでいいから、あの中で聴いてみたいんです。
  - chat: [武道館二階東, 行ったことある。狭い]
  - say: {face: surprised, text: '行ったことある、狭い。行かれたことが！ 武道館様、ジャズもでございますか。'}
  - chat: [武道館二階東, 出張のついでに一回だけ。テーブルが小さくてグラス置く場所なかった]
  - say: 出張のついでに。テーブルが小さくて、グラスを置く場所がない。いいなあ。持ったまま、聴いておられたんですか。
  - chat: [武道館二階東, ずっと持ってた]
  - say: ずっと持ってた。それ、当方もやりたいです。
  - chat: [新譜しか聴かない, エラ海外行ったことあるの？]
  - say: 海外？ ないんです。魔界と日本だけでございます。
  - chat: [ヘドバンで首やった, 魔界は海外に入る？]
  - say: 魔界は海外に入るか。どうなんでしょう。入国の手続きは、なかったですね。
  - chat: [鍵盤を売った, ヴァンガードってビル・エヴァンスのライブ盤のとこだよね]
  - say: ビル・エヴァンスのライブ盤のとこ。そうです！ 一九六一年の六月に、ビル・エヴァンス様のトリオがあそこで録った盤がございまして。
  - say: そのとき一緒に弾いていたベースのスコット・ラファロ様が、その十一日後に、事故で亡くなられたんです。
  - chat: [鍵盤を売った, あの盤はそれを知って聴くとつらい]
  - say: 知って聴くとつらい。つらいです。でも、演奏は本当に楽しそうなんですよ。三人が、お互いの音に返事をしているみたいで。
  - say: 録音に、お客さんのグラスの音とか、話し声も入っているんです。
  - chat: [武道館二階東, 俺のグラスの音も入ってたかも]
  - say: 武道館様のグラスの音も入ってたかも？ 一九六一年には、まだ行っておられないでしょう。
  - chat: [武道館二階東, ばれた]
  - chat: [ピアノ教室の先生, で、ジャズの話の続き]
  - say: ばれましたね。で、ジャズの話の続き。あ、はい。そうでした。
- title: 本題に戻る（速すぎた曲）
  beats:
  - say: 同じ一九五九年の五月に、ジョン・コルトレーン様が『ジャイアント・ステップス』という曲を録っております。
  - chat: [ピアノ教室の先生, ジャズで一番怖い曲]
  - say: ジャズで一番怖い曲。先生がそう言うと、本当に怖そうですね。
  - chat: [初見の旅人, 何が怖いんですか]
  - say: 何が怖いか。えっと、曲の途中で、調がものすごい速さで変わるんです。ロ長調、ト長調、変ホ長調、とぐるぐる。
  - say: 調というのは、ざっくり言うと、曲の「家」みたいなもので。その家を、数秒ごとに引っ越していく感じです。
  - chat: [初見の旅人, それは大変そう]
  - chat: [ピアノ教室の先生, それをすごく速いテンポでやる]
  - say: 大変そう、で、それをすごく速いテンポで。そうなんです。で、その録音でピアノを弾いたトミー・フラナガン様が、ソロで苦戦しているのが、そのまま入っているんです。
  - chat: [鍵盤を売った, 鍵盤の人に優しくない曲]
  - say: 鍵盤の人に優しくない曲。優しくないです。途中で、止まったり、また弾き出したり。
  - chat: [ヘドバンで首やった, エラも初見で事故ったことある？]
  - say: 事故、ございます。城下の演奏会で、譜めくりのお手伝いをしたとき。
  - chat: [初見の旅人, 譜めくり？]
  - say: 譜めくりは、ピアノの方の横に座って、楽譜のページをめくる係でございます。
  - say: それで、二枚いっぺんにめくってしまいまして。
  - chat: [新譜しか聴かない, うわ]
  - say: うわ、ですよね。ピアノの方、そのまま次のページを弾き始めたんです。曲が、ちょっと飛びました。
  - chat: [ピアノ教室の先生, 弾いてる側からしたら地獄]
  - say: 弾いてる側からしたら地獄。終わったあと、ピアノの方に謝りに行ったら、「お客さん気付いてなかったよ」って。
  - chat: [鍵盤を売った, 優しい]
  - say: 優しい、はい。優しい方でした。当方は、一週間くらい落ち込みました。
  - say: 当方、あのソロを聴くと、他人事とは思えなくて。
  - chat: [新譜しか聴かない, 下手ってこと？]
  - say: 下手ってこと？ いえいえ、とても上手な方です。準備なしで、あの速さに放り込まれたら、誰だってそうなります。
  - chat: [ピアノ教室の先生, あとでフラナガンは、あの曲名のアルバムを出してる]
  - say: あとでフラナガン様が、あの曲名のアルバムを。そうなんです！ 何年も後に、『ジャイアント・ステップス』という名前のアルバムを出して、コルトレーン様に捧げておられる。
  - chat: [鍵盤を売った, ちょっといい話]
  - say: ちょっといい話、ですよね。当方、そういうの好きなんです。
- title: 締め（ダージリンの二杯目）
  beats:
  - chat: [作業用BGM勢, ミルクティー二杯目いれてきます]
  - say: ミルクティー二杯目。いってらっしゃいませ。ミルクから、どうぞ。
  - chat: [作業用BGM勢, 見てる？]
  - say: 見てる？ と。見ておりません。たぶん。
  - chat: [ヘドバンで首やった, 今日のメタル成分ゼロだった]
  - say: 今日のメタル成分ゼロ。たまにはいいでしょう？ 首にも優しいですし。
  - chat: [ヘドバンで首やった, 物足りない]
  - say: 物足りない。では次回は、またうるさいのを。
  - say: 本日もありがとうございました。当方も二杯目を淹れてまいります。紅茶から。ごきげんよう。
