# ノクス 004：途中で肩を叩かれたら、どうする？（シグナルの昔話と、2020年の Go）
# 2026-10-27 夜、10〜15分の雑談配信の形に作り直した（v8）。材料は src/old/episodes-v7/nox/002.yaml の後半（V7 と BSD の signal、Worse is Better、Go 1.14 の SIGURG、ハンドラの中の printf）。
# 入口と脇道：タリーズ（chain_cafe）、コーヒーはブラック（drink_coffee_how）。全員の定番の紹介は mora/006 だけに残すので、ここはノクスの話と視聴者の店だけ。
# 終わりはチャットにコメダの話を取られたまま切る（オチを付けない）。出典は src/sources/nox/004.md。
title: 作業の途中で邪魔されたら、やり直す？ 投げ返す？（昔の Unix と今の Go）
lobby:
- こんばんは。今日はタリーズに行ったの。珍しく外に出たの。
- プログラムが作業の途中で邪魔されたとき、どうするかの話。
- 1980年代の Unix の喧嘩が、2020年の Go まで続いてるの。
parts:
- title: オープニング（タリーズ）
  beats:
  - say: あ、映ってる。こんばんは、起きてる人たち。
  - chat: [夜勤明けの人, こんばんは]
  - chat: [処理落ち愛好会, 今日は外の匂いがする]
  - say: 外の匂いがする？ 何で分かるの。……今日ね、タリーズに行ったの。
  - chat: [カーネル読み, 地上に出た]
  - say: 地上に、出たの。打ち合わせの前に一時間だけ。
  - chat: [初見の旅人, はじめまして。なんでタリーズ？]
  - say: いらっしゃい、初見さん。なんでタリーズかっていうと、席の間が広いの。画面を横から見られにくいの。
  - chat: [処理落ち愛好会, そもそもノクスの画面は誰にも見えない]
  - say: {face: annoyed, text: '私の画面は誰にも見えない、って……それ、今日店員さんにも言われたの。'}
  - chat: [処理落ち愛好会, 何て]
  - say: 何てって、「電源、入ってますか」って。
  - chat: [夜勤明けの人, ｗｗｗ]
  - chat: [カーネル読み, 入ってた？]
  - say: 笑いすぎ。入ってたの。明るさ一番下なだけ。
  - chat: [新卒二年目, 何飲んだんですか]
  - say: 何飲んだか？ 本日のコーヒー。ブラック。
  - say: 砂糖を入れると、日によって味が変わる気がするの。だから入れない。
  - chat: [RTOS屋十五年, 自分はドトール派]
  - say: ドトールなのね。RTOS屋さんは何頼むの？
  - chat: [RTOS屋十五年, ジャーマンドッグ。早く出てくる]
  - say: ジャーマンドッグ、早く出てくるのが理由なのね。……現場の人の選び方。
  - chat: [夜勤明けの人, スタバは？]
  - say: スタバ？ スタバは本日のコーヒーしか頼めないの。前に長い名前のを頼もうとして、途中で噛んだの。
  - chat: [処理落ち愛好会, 噛んだところ見たかった]
  - say: 噛んだところは、見せないの。……で、そのタリーズでね、作業してたら、隣の人に話しかけられたの。
  - say: 「すみません、コンセント使ってもいいですか」って。
  - chat: [カーネル読み, いいよって言った？]
  - say: いいよって言ったか？ 言おうとしたの。でも打ってる途中だったから、手が止まって、何を打ってたか忘れたの。
  - chat: [RTOS屋十五年, 割り込まれた]
  - say: {face: annoyed, text: '割り込まれた、そう。何を打ってたか、きれいに飛んだの。まだ思い出せない。'}
  - chat: [カーネル読み, で、前回のシグナルの続きは？]
- title: 一回鳴らすと外れる呼び鈴
  beats:
  - say: 前回のシグナルの続き？ あ、そうだった。聞かれてたわね。
  - say: 前回、シグナルの話をしたでしょ。OS がプログラムの肩をとんとんする合図。
  - chat: [初見の旅人, 前回いなかった]
  - say: 前回いなかった？ 大丈夫。プログラムが何かしてる最中に、OS から「ちょっと」って合図が来るの。それだけ覚えて。
  - say: 合図を受け取る係を、プログラムの方で付けられるの。呼び鈴みたいなもの。
  - say: で、昔の Unix の呼び鈴はね、一回鳴ると外れちゃったの。
  - chat: [初見の旅人, 外れる？]
  - say: 外れるっていうのはね、一回呼ばれたら、係が外れて、元の決まりに戻るの。だから係の中ですぐ付け直すの。
  - chat: [カーネル読み, 付け直す前にもう一回鳴ったら]
  - say: 付け直す前にもう一回鳴ったら？ 元の決まりで動くの。だいたい、そのまま止まって死ぬ。
  - chat: [処理落ち愛好会, 二回ノックで死ぬ家]
  - say: {face: laugh, text: '二回ノックで死ぬ家。嫌な家ね。'}
  - say: BSD の人たちはそれを嫌がって、外れない呼び鈴にしたの。
  - say: 係が働いてる間は、同じ合図を待たせておくようにもしたの。
  - chat: [RTOS屋十五年, で、同じ signal() って名前で動きが違う]
  - say: 同じ signal() って名前で動きが違う、そうなの。同じ名前なのに、家によって違うの。
  - say: 最後に POSIX が sigaction っていう別の名前を作って、どっちにするか選べるようにしたの。
  - say: 今の Linux の signal() の説明書には「使わないで、sigaction を使って」って書いてあるの。
  - chat: [新卒二年目, 自分の説明書で使うなって言われてる]
  - say: 自分の説明書で使うなって、言われてるの。正直な説明書。
- title: 巻き戻す人と、投げ返す人
  beats:
  - chat: [カーネル読み, 今日は Worse is Better もやる？]
  - say: Worse is Better、やる。今日はカーネル読みさんと揉める日なの。
  - say: プログラムが OS に「このファイル読んで」ってお願いしてる途中に、合図が来たとするでしょ。
  - say: お願いの途中で、肩を叩かれたの。さあ、OS はどうする？
  - chat: [初見の旅人, 続けてあげれば]
  - say: 続けてあげれば、って思うでしょ。そこで分かれるの。Richard Gabriel っていう人が書いた、有名な文章があってね。
  - say: MIT の人と、Unix をやってた人が会って、まさにこの話をするの。
  - say: MIT の人は、「途中まで巻き戻して、何もなかったようにやり直すのが正しい」。
  - say: Unix の人は、「お願いは必ず終わらせる。ただ、ときどき『邪魔された』ってエラーで返す」。
  - say: 「やり直すのは、呼んだ側の仕事」って。
  - chat: [初見の旅人, 投げ返してる]
  - say: そう、投げ返してるの。中は簡単。そのかわり、使う人が大変なの。
  - chat: [カーネル読み, 簡単な方が広まった]
  - say: 簡単な方が広まった。そう、広まったのは Unix の方。……正しかったかは、また別の話。
  - chat: [カーネル読み, 正しいよ。簡単だから壊れたとき読める]
  - say: 簡単だから壊れたとき読める、ね。読めるのは認めるわ。でも、使う方はつらいのよ。
  - say: その「邪魔された」っていうエラーの名前が EINTR。私、これで一晩溶かしたことがあるの。
  - ask:
      q: 頼んだ作業が途中で邪魔されたら、どっちがいい？
      options:
      - c: OS が黙ってやり直してくれる
        r:
        - '{name}、こっち側ね。'
        - 使う人が何も考えなくていい方が、私は好き。中の人は大変だけど。
      - c: 「邪魔された」と返してくれれば自分でやる
        r:
        - '{name}はカーネル読みさんの側ね。'
        - 自分でやり直すって決めておけば、何が起きたかは全部見えるのよね。それは分かる。
      - c: そもそも邪魔しないでほしい
        r:
        - '{name}、それ、今日のタリーズの私。'
        - 邪魔されたくない日に限って、隣の人がコンセントを探してるのよね。
      npc:
      - [カーネル読み, 1]
      - [RTOS屋十五年, 1]
      - [DDD警察, 0]
      - [処理落ち愛好会, 2]
      - [新卒二年目, 0]
  - chat: [カーネル読み, Unix 側が多い]
  - say: Unix 側と、黙ってやり直す側で、だいたい半々ね。……カーネル読みさん、数えるの早い。
- title: 2020年の Go
  beats:
  - say: でね、この話、昔で終わらないの。
  - say: 二〇二〇年の二月に出た Go 1.14 で、ゴルーチンを途中で止められるようになったの。
  - chat: [初見の旅人, ごるーちん]
  - say: "ゴルーチンはね、Go の中の、小さい働き手。昔は、関数も呼ばずに計算だけ回ってる子がいると、その子がなかなか交代してくれなかったの。"
  - say: "ほかの子が待たされたり、片付け係の GC が遅れたりしたの。"
  - chat: [処理落ち愛好会, 休憩しない社員]
  - say: 休憩しない社員、そう。で、1.14 から、休憩しない子の肩を、合図で叩けるようになったの。
  - chat: [カーネル読み, 合図が増えるから EINTR も増える]
  - say: 合図が増えるから EINTR も増える、そうなの！ 1.14 のお知らせに、ちゃんと書いてあるの。
  - say: 「OS に直接お願いしてるプログラムは、EINTR で失敗することが前より増えます。やり直すように書いて」って。
  - chat: [RTOS屋十五年, Unix の人の言った通りの請求が来た]
  - say: {face: laugh, text: 'Unix の人の言った通りの請求、来たの。やり直すのは呼んだ側の仕事、って。'}
  - say: で、肩を叩くのに使う合図が SIGURG なの。
  - chat: [初見の旅人, あーじ？]
  - say: "あーじ、じゃなくて、URG は urgent の略。「急ぎのデータが届いた」っていう、昔のネットの名残の合図。今は、本来の意味で使う人はほとんどいないの。"
  - say: Go のソースにね、これを選んだ理由が書いてあるの。
  - say: "デバッガが素通しする。C と混ぜたとき、libc が中で使ってる合図とぶつからない。それから、理由なく届いても困らないこと。"
  - chat: [カーネル読み, あと macOS でも使える]
  - say: あと macOS でも使える。そう、それで四つ。
  - say: "急ぎって名前なのに、理由なく届いても困らない合図だから選ばれたの。"
  - chat: [処理落ち愛好会, 名前負け]
  - say: 名前負け、ね。かわいそう。
  - chat: [新卒二年目, うちのサービスも 1.14 より前から動いてます]
  - say: 1.14 より前から動いてるのね。じゃあ、EINTR をどこかで握りつぶしてないか、ちょっと気にしておいて。
  - chat: [新卒二年目, 握りつぶすって]
  - say: "握りつぶすっていうのは、エラーが返ってきたのに、何もしないで先に進んじゃうこと。昔の私がよくやったやつ。"
  - chat: [処理落ち愛好会, "やってたんだ"]
  - say: "やってた、って……やってたの。今は、無視していい理由を一行書けないなら止める決まり。レビューで私が一番よく指摘するのも、これ。"
  - chat: [DDD警察, 標準のライブラリ経由なら Go がやり直してくれるんだっけ]
  - say: 標準のライブラリ経由なら？ 普通に使ってれば、だいたいは。直接 OS にお願いしてる所が危ないの。お知らせにもそう書いてある。
- title: 係の中で printf しない
  beats:
  - chat: [新卒二年目, 呼び鈴の係の中で printf したらだめって本当ですか]
  - say: 係の中で printf したらだめか。本当。だめなの。
  - say: 合図の係は、プログラムが何をしてる最中でも呼ばれるの。字を書いてる最中でも。
  - say: 字を書く途中で呼ばれて、係も同じ所に字を書こうとすると、書きかけの所をいじることになるの。
  - say: 字がおかしくなったり、私のときみたいに固まったりするの。
  - chat: [初見の旅人, 書きかけのノートに横から書く感じ]
  - say: 書きかけのノートに横から書く、そんな感じ。だから係の中で使っていいものは、一覧で決まってるの。printf は入ってない。
  - say: 私、一年目にやったの。夜のバッチで、止まるときに「止まります」って出したくて。
  - chat: [RTOS屋十五年, どうなった]
  - say: どうなったか？ ひと月に一回だけ、朝まで固まってたの。原因が分かるまで三か月かかった。
  - chat: [新卒二年目, 三か月]
  - say: 三か月。先輩が一晩かけて見つけてくれたの。私は横で、ずっとガムを噛んでた。
  - say: "今、チームの後輩が同じのを踏んだら、三か月は待たせないの。その夜に一緒に見る。先輩がそうしてくれたから。"
  - chat: [カーネル読み, 今ならどう書く]
  - say: "今ならどう書くか？ 係の中では、安全に使っていいものだけで、印を一個付けるの。"
  - say: "C なら volatile sig_atomic_t っていう型の変数ね。本当の仕事は外でやるの。"
  - say: "Go なら、signal.Notify から受け取る側でやればいいの。そっちは普通の処理だから、字も出せるの。"
  - chat: [処理落ち愛好会, 0通の郵便受け]
  - say: {face: annoyed, text: '0通の郵便受け……その話は前回したでしょ。'}
- title: 締め（コメダに取られる）
  beats:
  - chat: [夜勤明けの人, 話戻すけどタリーズよりコメダ派]
  - say: タリーズよりコメダ派？ 私、行ったことないの。どこがいいの？
  - chat: [夜勤明けの人, ソファで寝られる]
  - say: ソファで寝られるの。……タリーズより、隣の人が遠い？
  - chat: [夜勤明けの人, 遠い。壁もある]
  - say: 遠くて、壁もあるの。それは、ちょっと行ってみたい。
  - chat: [新卒二年目, 朝はモーニングでトーストとゆで卵が付いてきます]
  - say: モーニングにゆで卵が付いてくるの？ ちょっと気になるの。何分ゆでてるのかしら。
  - chat: [RTOS屋十五年, 店によって半熟もある]
  - say: 店によって半熟もあるのね。冬は水が冷たいから、同じ時間でも変わるわよ。
  - chat: [処理落ち愛好会, 聞いてこい]
  - say: 聞いてこいって……聞けないわよ。店員さんに話しかけられないの、私。
  - chat: [カーネル読み, 注文はどうするの]
  - say: 注文はどうするか？ メニューを指さすの。……指さしで通じるお店がいい。
  - chat: [夜勤明けの人, コメダのシロノワール食べたい]
  - chat: [処理落ち愛好会, 夜中に言うな]
  - say: シロノワール……夜中に言わないで。今日はこれでおしまい。起きてる人たち、ありがとう。
  - say: おやすみなさい。
