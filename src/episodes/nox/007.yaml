# ノクス 007：速くするために確認を一個外したら（2018年のビットコインのソフトの穴）と、穴の当番の夜
# 2026-10-27 夜、10〜15分の雑談配信の形に作り直した（v8）。材料は src/old/episodes-v7/nox/003.yaml の「速くするために外した確認」「穴の当番の夜」。
# 入口：プリン（sweets_pudding、sweets_best_ever の Heartbleed の朝のプリン）。脇道：エナジードリンク（drink_energy）。
# 手口（どんな取引を作るか）は話さない。終わりはゆで卵を思い出して途中で切る。出典は src/sources/nox/007.md。
title: 遅いからって確認を一個外したら、何が起きる？（2018年の穴と、私の徹夜の夜）
lobby:
- こんばんは。今日は、遅い確認を外していいかの話。
- 2018年に、速くするために外した確認が、大きな穴になったことがあるの。
- 私が初めて徹夜で穴をふさいだ夜の、プリンの話もする。
parts:
- title: オープニング（プリン）
  beats:
  - say: あ、映った。こんばんは、起きてる人たち。
  - chat: [夜勤明けの人, こんばんは。今コンビニのプリン食べてる]
  - say: 夜勤明けさん、今プリン食べてるの？ いいわね。かため？ とろとろ？
  - chat: [夜勤明けの人, かため]
  - say: かためなのね。私はとろとろの方。
  - chat: [処理落ち愛好会, かための方がプリンだろ]
  - say: 「かための方がプリンだろ」って……かためのは、スプーンががんばりすぎるの。とろとろは、スプーンが楽そうでいいの。
  - chat: [カーネル読み, スプーンの気持ち]
  - say: スプーンの気持ち。大事なのよ、スプーンの気持ち。
  - chat: [処理落ち愛好会, じゃあコンビニのスイーツで一番は]
  - say: コンビニのスイーツで一番？ ローソンのプレミアムロールケーキ。スプーンで食べる形なのが好き。
  - chat: [処理落ち愛好会, 結局スプーン]
  - say: 結局スプーン、ね。スプーンで食べられるものが好きなの。キーボードを汚さないから。
  - chat: [カーネル読み, 理由がいつもキーボード]
  - say: {face: annoyed, text: '理由がいつもキーボードって……キーボードは大事なの。'}
  - chat: [新卒二年目, 今まで一番おいしかったプリンありますか]
  - say: 一番おいしかったプリン？ ある。……名前は覚えてないけど。
  - say: 二〇一四年の四月にね、Heartbleed っていう大きな穴が公開されたの。
  - chat: [初見の旅人, はじめまして。はーとぶりーど？]
  - say: いらっしゃい、初見さん。Heartbleed はね、ネットの暗号の部品に見つかった穴なの。世界中で、みんなが慌てて直したの。
  - say: "前の職場でね、その夜、穴をふさいで、鍵を作り直して、お客さんの証明書を百二十枚入れ替えたの。古いのは失効させて。"
  - chat: [RTOS屋十五年, 百二十]
  - say: 百二十枚。終わったのが朝で。そしたら先輩が、コンビニのプリンを黙って机に置いてくれたの。
  - chat: [夜勤明けの人, いい先輩]
  - say: そう、いい先輩なの。あれがいちばんおいしかった。
  - say: でも名前を見る前に食べちゃって。何のプリンだったか、分からないの。
  - chat: [処理落ち愛好会, 聞けばいいのに]
  - say: 聞けばいいのに、って……聞けないの。先輩に話しかけるの、苦手なの。
  - chat: [カーネル読み, 次の日なんか言われた？]
  - say: 次の日に言われたのは、「ノクスさん、一言も喋らなかったね」って。全部チャットに打ってたの。
- title: 新卒さんのプルリク
  beats:
  - chat: [新卒二年目, 相談いいですか]
  - say: 新卒さん、相談？ いいわよ。当番の話？
  - chat: [新卒二年目, 先週、遅い確認を一個外すプルリクを出して]
  - chat: [新卒二年目, LGTM もらって入りました]
  - say: {face: surprised, text: '遅い確認を外して、LGTM もらって入った……え。誰の LGTM？'}
  - chat: [新卒二年目, AI のレビュー]
  - say: AI のレビュー。来るのよね、すぐ。……どんな確認だったの？
  - chat: [新卒二年目, 同じ確認がもう一つ先の処理にもあるから、ここは要らないと思って]
  - say: 同じ確認が先にもあるから要らない、と思ったのね。うん。それ、よくあるの。
  - say: 外すこと自体は悪くないの。ただね、似た話で、すごく大きな穴になったのがあるの。
  - chat: [カーネル読み, 2018年のあれ]
  - say: 2018年のあれ、そう。CVE-2018-17144。
  - chat: [初見の旅人, しーぶい……]
  - say: CVE っていうのは、見つかった穴に付く、通し番号みたいなもの。
  - say: ビットコインの本家のソフトの話なの。
  - say: 二〇一二年から、「一つの取引の中で、同じお金を二回使ってないか」を確かめる処理があったの。
  - say: それを、二〇一七年に出た版で外したの。速くするために。
  - chat: [処理落ち愛好会, 新卒と同じ]
  - chat: [新卒二年目, 胃が]
  - say: 「新卒と同じ」って言われて、胃が……胃はまだ早いの。最後まで聞いて。
- title: そういえば（エナジードリンク）
  beats:
  - chat: [定時退社したい, 胃といえば当番の夜ってエナドリ飲む？]
  - say: 当番の夜にエナドリ？ 飲まないの。
  - chat: [定時退社したい, 意外]
  - say: 意外でしょ。前の職場で、障害の夜に四本飲んだことがあるの。
  - say: そしたら手が震えて、コマンドの打ち間違いが増えたの。一回はちょっと危なかった。
  - chat: [RTOS屋十五年, 四本は飲みすぎ]
  - say: "四本は飲みすぎ、そう、飲みすぎなの。あの日から飲んでない。今は、危ないコマンドは打つ前に相棒に読んでもらうの。"
  - chat: [初見の旅人, じゃあ何飲むの]
  - say: じゃあ何飲むか？ コーヒー。あとガム。キシリトールのボトルのやつ。
  - say: 噛む速さで、自分がどれくらい焦ってるか分かるの。
  - chat: [処理落ち愛好会, 焦るとガムが速くなる]
  - say: 焦るとガムが速くなる、そう、速くなるの。音がマイクに乗るくらい。
  - chat: [夜勤明けの人, 自分は夜勤のとき缶コーヒー三本]
  - say: 夜勤のとき缶コーヒー三本。……ジョージアのブラック？
  - chat: [夜勤明けの人, ボス]
  - say: ボスなのね。私、夜中の自販機はジョージアのブラックをよく押すの。好みが分かれるわね。
- title: 別の所の assert
  beats:
  - chat: [新卒二年目, で、2018年のは何で外したんですか]
  - say: 2018年のは何で外したか。外したときの理由がね、「別の所でも見てるから」だったの。新卒さんと同じ。
  - say: その別の所が、assert だったの。
  - chat: [初見の旅人, あさーと？]
  - say: "assert はね、「ここでは、この条件が成り立つはず」を確かめる、プログラムの中の約束。成り立たなかったら止まるの。"
  - chat: [RTOS屋十五年, 本番で assert を消してたら？]
  - say: "本番で消してたら？ このソフトは消さない作りなの。でもどっちにしても、assert は外から来たおかしな物を断る道具じゃないの。"
  - say: "外した最初の版では、同じ入力を二回使う取引が、採掘された頁に入って届くと、その assert で落ちたの。"
  - chat: [カーネル読み, 落ちるのも困るけど]
  - say: "落ちるだけ、じゃないのよ。そういう頁が一つ届くだけで、世界中の機械を落とせたかもしれない。それだけで大きな穴。お金はまだ増えないけど。"
  - say: "でも次の版で周りを作り直したときに、その assert が確かめる中身が弱くなっちゃったの。"
  - say: 条件によっては、止まらずに通っちゃう形になったの。お金を増やせる形に。
  - chat: [処理落ち愛好会, こわ]
  - say: "こわ、って。怖いでしょ。外したときは落ちる穴で、周りが変わったら、お金の穴になったの。"
  - chat: [RTOS屋十五年, 組み込みだと assert は本番で消すことも多い]
  - say: "組み込みだと本番で消すことも多い、そうなの。だから、外から来たものの確かめは、普通の確認で断るの。assert は、自分のコードの中の約束を見る方。"
  - chat: [DDD警察, assert を確認だと思ってたのが間違い]
  - say: assert を確認だと思ってたのが間違い？ 半分はそう思う。……でも、書いた人もそう思ってなかったんじゃないかしら。
  - say: 私が好きなのは、この穴の報告の時刻の表なの。
  - say: 九月十七日の午後に匿名の報告が来て、三時間たたないうちに、お金を増やせる方の穴にも誰かが気づいて。
  - say: 次の日には、直した版が出てるの。
  - chat: [カーネル読み, 分単位で書いてある]
  - say: 分単位で書いてある、そう、分単位なの。読むと、あの人たちが寝てないのが分かるの。
  - ask:
      q: 「別の所でも見てるから」って、遅い確認を外したことある？
      options:
      - c: ある
        r:
        - "{name}も。その別の所が、今も同じ条件を見てるか、試験で見張っておいてあげて。"
        - 周りのコードが変わると、見てくれなくなることがあるの。今日の話みたいに。
      - c: 外そうとして止めた
        r:
        - '{name}、迷ったのね。何が気になって止めたの？'
        - なんとなく嫌だった、もけっこう当たるのよ。
      - c: 遅い確認なんて見たことない
        r:
        - '{name}の所、速いのね。うらやましい。'
        - それか、もうだれかが外したあとかも。……冗談よ。たぶん。
      npc:
      - [新卒二年目, 0]
      - [RTOS屋十五年, 1]
      - [定時退社したい, 0]
      - [処理落ち愛好会, 2]
      - [DDD警察, 1]
- title: 新卒さんへ
  beats:
  - say: 外したことある人と、止めた人が同じくらいね。みんな一回は迷ってるの。
  - chat: [新卒二年目, 自分のはどうすれば]
  - say: "新卒さんのは、どうすればいいか。まず、もう本番で動いてる？ 何を守る確認だったの？"
  - chat: [新卒二年目, "本番です。注文の金額の確認でした"]
  - say: "お金に触るのね。じゃあ、今夜のうちに当番の人とリードの人に知らせて。安全だって分かるまで、戻すかどうかを一緒に決めてもらうの。"
  - say: "外していいのは、外した確認と先の確認が同じ条件を見てて、どの入口から来ても、お金を動かす前にそこを通るって試験に残ってから。"
  - say: "速くなった量も測ってね。"
  - chat: [新卒二年目, AI のレビューを信じちゃだめですか]
  - say: "AI のレビューを信じちゃだめか？ だめじゃないの。でも、確認を外す変更は、人が一人は読む決まりにした方がいいの。"
  - say: "私のチームはそうしてる。朝四時の私の LGTM のあとで決めたの。"
  - say: "一回見つけただけじゃ、まだ外さないの。リードの人と一緒に見てね。"
  - chat: [新卒二年目, "今から当番に連絡します"]
  - chat: [カーネル読み, "外した確認が断るはずだった入力を、試験で入れてみれば"]
  - say: "そうね、それが一番。試験の環境でね。どの入口から来ても、お金を動かす前に断れるか、リードの人と確かめて。止まらなかったら、戻すのは決まり。"
  - chat: [処理落ち愛好会, 新卒の胃は]
  - chat: [新卒二年目, ちょっと楽になりました]
  - say: 新卒さんの胃、ちょっと楽になったの？ よかった。
- title: 穴の当番の夜
  beats:
  - chat: [定時退社したい, ノクスって穴が出た夜も呼ばれるの？]
  - say: "穴が出た夜も呼ばれるか？ 呼ばれるの。今は、チームの穴の当番の指揮をしてるの。"
  - chat: [初見の旅人, 穴の当番？]
  - say: "穴の当番はね、使ってる部品に大きな穴が見つかって、公開された夜に、うちの機械とお客さんの所を直して回る係。"
  - say: "最初は、前の職場の Heartbleed の夜。あの夜いちばん時間がかかったの、直すことじゃなかったの。"
  - chat: [RTOS屋十五年, 版を数えること]
  - say: 版を数えること、そう。どの機械が、どの版の部品を使ってるか、全部数えるの。
  - say: "でもね、数え終わるのを待ってたら遅いの。外から触れる所と、もう危ないって分かってる所から先に塞いだの。残りは、別の人と数えながら。"
  - say: "分からない機械は、「影響なし」に入れないの。「まだ分からない」の方に入れるの。"
  - chat: [新卒二年目, うちも全部は言えない気がします]
  - say: "全部は言えない気がする？ 言えないのが普通なの。だから、何もない日に一覧を作っておくの。"
  - say: "今のチームは、普段から更新してて、穴の夜は最初の一時間で「分かった範囲と、まだ分からない範囲」を出すの。"
  - chat: [処理落ち愛好会, ノクスの部屋の十一台は]
  - say: {face: flustered, text: "仕事の機械は言えるの。私の部屋の十一台は……言えない。"}
  - chat: [処理落ち愛好会, 言えない人]
  - say: 言えない人なの。人には数えろって言うのに。
  - chat: [カーネル読み, 去年の npm のときは]
  - say: 去年の npm のとき、二〇二五年の九月ね。あれも夜中に数えたの。
  - chat: [初見の旅人, えぬぴーえむ？]
  - say: npm はね、JavaScript の部品を配ってる、大きな棚みたいな所。みんなそこから部品を持ってくるの。
  - say: そこで、よく使われてる部品の作者さんが、偽物のメールで乗っ取られたの。
  - say: 「二段階の認証を更新してください」っていう、本物そっくりのメール。
  - chat: [処理落ち愛好会, 引っかかるなよ]
  - say: 引っかかるなよ、って言うけど、引っかかるわよ。忙しい日に、本物そっくりのが来たら、私も分からない。
  - say: で、その人の部品に、暗号資産を盗むためのコードが入れられちゃったの。chalk とか debug とか、週に二十億回以上ダウンロードされてる部品に。
  - chat: [新卒二年目, その日、うちのチームも大騒ぎでした]
  - say: 新卒さんのチームも大騒ぎだったの。……そのとき寝られた？
  - chat: [新卒二年目, 朝までロックファイル見てました]
  - say: 朝までロックファイル……おつかれさま。ロックファイルっていうのはね、初見さん、どの部品のどの版を使ってるかを書いた一覧のこと。
  - chat: [初見の旅人, それがあれば数えられる？]
  - say: "それがあれば数えられるか？ 候補は、すぐ絞れるの。"
  - chat: [初見の旅人, "一覧があれば終わり？"]
  - say: "終わりじゃないの。ロックファイルは「何を入れるつもりだったか」だから、実際に配った物も見るの。"
  - say: "悪い版は数時間で取り下げられたけど、その数時間に入れた人を探すの。"
  - chat: [新卒二年目, うちは入ってませんでした]
  - say: {face: smile, text: '入ってなかったの？ よかった……。聞いてる私の胃まで痛かったの。'}
- title: 締め（卵）
  beats:
  - chat: [夜勤明けの人, プリンもう一個買ってこようかな]
  - say: プリンもう一個？ 夜中の二個目は……いいと思う。私が止める理由はないもの。
  - chat: [定時退社したい, とろとろのにしなよ]
  - chat: [夜勤明けの人, かためを貫く]
  - say: とろとろにしなよ、って言われても、かためを貫くのね。いいわよ、かためで。
  - say: 私もそろそろ何か食べようかな。今日、卵をゆで……
  - say: {face: surprised, text: 'あ。鍋、火にかけっぱなし。'}
  - chat: [処理落ち愛好会, おい]
  - chat: [RTOS屋十五年, 七分過ぎてる]
  - say: 七分、過ぎてる。ごめん、今日はここで切るね。おやすみなさい。
