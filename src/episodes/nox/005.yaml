# ノクス 005：同じソフトなのに、一台だけ答えが違った（2013年3月、ビットコインの台帳が二つに割れた夜）
# 2026-10-27 夜、10〜15分の雑談配信の形に作り直した（v8）。材料は src/old/episodes-v7/nox/003.yaml の前半（十一台の NAS、BIP50、thermoman、0.7 を残した、0.8.1）。
# 脇道：腕時計 F-91W（gear_watch）、柿の種のピーナッツの比率（sweets_kaki。モーラの好物）。母の時計屋の話は使わない（Codex の指摘で、事故への当てはめをやめた）。
# 値段の話はしない。終わりは NAS の原因で一度笑って、チャットの質問を「今度」で流して切る。出典は src/sources/nox/005.md、柿の種は src/sources/nox/005.md。
title: 同じソフトなのに、一台だけ答えが違った（2013年、ビットコインの帳面が二つに割れた夜）
lobby:
- こんばんは。部屋の古い機械で、同じ試験を回したの。
- 一台だけ、黙って違う答えを出したの。
- 2013年に、世界中でそれと同じことが起きた夜の話をするね。
- 値段の話はしないの。壊れ方の話だけ。
parts:
- title: オープニング（腕時計）
  beats:
  - say: あ、映った。こんばんは、起きてる人たち。
  - chat: [RTOS屋十五年, こんばんは]
  - chat: [エラッタ収集家, こんばんは。腕時計見えた]
  - say: エラッタ収集家さん、腕時計見えた？ 暗いのに。
  - chat: [エラッタ収集家, チープカシオ？]
  - say: チープカシオ、そう。カシオの F-91W。
  - chat: [初見の旅人, はじめまして。安いやつ？]
  - say: いらっしゃい、初見さん。安いやつかって？ 安いの。でも好きなの。
  - say: 説明書にね、「月に三十秒くらいずれます」って書いてあるの。正直でしょ。
  - chat: [処理落ち愛好会, 正直な時計]
  - say: 正直な時計、そうなの。だから、ずれても怒らないの。最初から言ってたもの。
  - chat: [カーネル読み, 合わせてる？]
  - say: 合わせてるかって？ 月の初めに合わせてるの。
  - chat: [夜勤明けの人, スマートウォッチにしないの]
  - say: スマートウォッチにしないのか？ 電池が何年ももつのよ、これ。充電しなくていいの。
  - say: スマートウォッチ、一回借りたことあるの。夜中に光って起きた。
  - chat: [処理落ち愛好会, ノクスの画面より明るい]
  - say: {face: annoyed, text: '私の画面より明るいって……何でも私の画面より明るいのよ。'}
  - chat: [RTOS屋十五年, 自分は G-SHOCK]
  - say: RTOS屋さんは G-SHOCK なのね。落としても平気なやつ。
  - chat: [RTOS屋十五年, 現場で三回落とした]
  - say: 現場で三回落とした？ ……RTOS屋さんの現場、何があったの。
- title: 十一台のうち一台
  beats:
  - say: でね、先週。部屋の古い機械に、同じ試験を全部かけたの。十一台。
  - chat: [初見の旅人, 十一台もあるの]
  - say: 十一台もあるのかって？ あるの。いつか古い版で試すから、って捨てられなくて。
  - say: 試験は簡単なの。ファイルを三百個開いて、中の数を全部足すだけ。
  - say: 十台は同じ答え。一台だけ、少ない答えを出したの。
  - chat: [カーネル読み, どれ]
  - say: どれかっていうと、起動に四分かかる NAS。
  - chat: [処理落ち愛好会, あいつか]
  - say: そう、あいつ。あの子。同じ版のプログラムを入れたのに。
  - chat: [RTOS屋十五年, エラーは出た？]
  - say: エラーは出たか？ 出ないの。黙って、少ない答えを出すの。
  - chat: [RTOS屋十五年, 黙って違うのが一番嫌]
  - say: 黙って違うのが一番嫌、でしょ。落ちてくれた方がまだいい。
  - chat: [DDD警察, 原因は]
  - say: 原因は……あとで言う。恥ずかしいから。
  - say: その前に、同じことが世界中で起きた夜の話。二〇一三年の三月十一日。
- title: 帳面の写し
  beats:
  - chat: [初見の旅人, 何のソフト？]
  - say: 何のソフトか？ ビットコインの、本家のソフト。
  - chat: [初見の旅人, 投資のやつ？]
  - say: 投資のやつ、ね。でも値段の話はしないの。上がるか下がるか、私には分からないもの。今日はソフトが壊れた話。
  - chat: [定時退社したい, それなら聞ける]
  - say: 「それなら聞ける」って、ありがとう。えっとね、誰がいくら持ってるかを書いた帳面があるの。
  - say: その帳面の写しを、参加してる何千台もの機械が一冊ずつ持ってるの。
  - chat: [初見の旅人, 全員同じ帳面？]
  - say: 全員同じ帳面か？ 全員同じ。同じじゃないと困るの。
  - say: 新しい分は、だいたい十分に一回、一頁ずつ足されるの。その頁をブロックっていうの。
  - say: 届いた頁は、それぞれの機械が自分で確かめて、決まりどおりなら写しに足すの。
  - chat: [新卒二年目, 全員が同じ確かめ方をしてる前提ですね]
  - say: 全員が同じ確かめ方をしてる前提、そう。そこが崩れた夜なの。
  - say: その頃、新しい版の 0.8 が出たばかりで。0.8 は、頁をしまう倉庫を入れ替えてたの。
  - say: 古い 0.7 は Berkeley DB。新しい 0.8 は LevelDB。
  - chat: [初見の旅人, 倉庫？]
  - say: 倉庫っていうのは、データベースのこと。書いたものをしまっておく所ね。
  - chat: [RTOS屋十五年, Berkeley DB、昔の機器で使ってた]
  - say: {face: surprised, text: 'Berkeley DB、昔の機器で使ってたの？'}
  - chat: [RTOS屋十五年, 小さくてどこにでも入る。ロックで困ったことはある。詳しくは書けないけど]
  - say: ロックで困ったことがある……「詳しくは書けないけど」が出た。今日はそのロックの話なの。
- title: そういえば（柿の種）
  beats:
  - chat: [処理落ち愛好会, 関係ないけど今柿の種食べてる]
  - say: 今、柿の種食べてるの？ ……ピーナッツ入りの？
  - chat: [処理落ち愛好会, 入り]
  - say: 入りなのね。私も入りの方が好き。ピーナッツの割合、変わったの知ってる？
  - chat: [処理落ち愛好会, 知らん]
  - chat: [夜勤明けの人, 投票で変わったやつ]
  - say: そう、投票で変わったやつ。柿の種とピーナッツが、重さで六対四だったのが、七対三になったの。
  - say: 投票で決めたんだって。お菓子の配分を投票で決めるの、ちょっと感動した。
  - chat: [エラッタ収集家, 2020年でしたっけ]
  - say: そう、二〇二〇年。変わったあとで、一袋はかりで量ってみたの。
  - chat: [カーネル読み, 量ったのか]
  - say: 量ったのかって？ 量ったの。だいたい七対三だった。一袋だけだから、何も言えないけど。
  - chat: [新卒二年目, モーラさん柿の種好きって言ってました]
  - say: モーラが柿の種好き、そう、モーラの一番好きなお菓子なの。比率が変わった年まで覚えてるんだって。
  - chat: [処理落ち愛好会, 二人とも数字が好き]
  - say: 二人とも数字が好き、って。数字が合わないと眠れないの、モーラも私も。
  - chat: [定時退社したい, ピーナッツだけ残る派です]
  - say: 定時さん、ピーナッツだけ残るの？ 私は最後に柿の種が残るの。……人によって違うのね。
- title: 札の上限
  beats:
  - say: で、さっきの古い倉庫の続き。
  - say: 古い倉庫はね、頁をしまうとき、棚に「使用中」の札を掛けるの。ほかの処理に触らせないように。
  - say: その札の枚数に、上限があったの。設定の数字で。
  - say: "で、三月十一日の夜、0.8 の機械が、取引の入力がそれまでで一番多い頁を作ったの。"
  - say: "中身が多い頁は、しまうのに札をたくさん使うの。大きさだけじゃなくて、中身の組み合わせで変わるのよ。"
  - say: 古い 0.7 の一部は札が足りなくなって、「この頁はおかしい」って捨てたの。
  - chat: [初見の旅人, 決まりは破ってないのに？]
  - say: 決まりは破ってないのに、ね。破ってないの。0.8 は受け取って、0.7 の一部は捨てた。
  - chat: [処理落ち愛好会, 帳面が二冊になった]
  - say: 帳面が二冊に、なったの。
  - say: あとで書かれた報告があってね。BIP50 っていう文書。
  - say: そこに、「ロックの設定が、知らないうちに合意の規則になってた」っていう意味のことが書いてあるの。
  - chat: [初見の旅人, 合意の規則？]
  - say: 合意の規則っていうのは、どの頁を正しいと認めるか、の決まり。全員同じのを使ってる前提の決まり。
  - say: それが、倉庫の設定の数字一つで決まってたの。誰も知らないまま。
  - chat: [カーネル読み, しかも同じ 0.7 でも割れた]
  - say: しかも同じ 0.7 でも割れた、そう！ 要る札の数が、その機械の中でファイルがどう並んでるかで変わったの。
  - say: だから同じ 0.7 でも、受け取る機械と捨てる機械がいたの。
  - chat: [新卒二年目, うちの入れ替えも本番のデータで変わるかも]
  - say: "本番のデータで変わるかも？ 変わるかもしれない。本番に近い形のデータで試してね。個人情報は隠して、隔離した場所で。"
  - chat: [エラッタ収集家, 最初に気づいた人の書き込みが好き]
  - say: 最初に気づいた人、thermoman さんね。IRC で「よその機械が、ブロックが225,431個あるって言ってくる」って。
  - chat: [エラッタ収集家, '自分のは225,430']
  - say: 「自分のは225,430」。一個合わないって、それだけ書いて置いていったの。
- title: どっちを残す？
  beats:
  - say: で、帳面が二冊になったでしょ。どっちを残したと思う？
  - ask:
      q: あなたが当番なら、どっちの帳面を残す？
      options:
      - c: "新しい版（0.8）の帳面"
        r:
        - "{name}は新しい方ね。気持ちは分かる。"
        - でもその夜は、動いてる機械の多くが「だめ」って言ってたの。一晩で全員入れ替えるのは無理だったと思う。
      - c: みんなが読める古い版（0.7）
        r:
        - '{name}、その夜の人たちと同じ。'
        - 0.7 の帳面なら、0.7 でも 0.8 でも読めるの。朝までに終わる方。
      - c: 両方残しておく
        r:
        - '{name}、それ、三年後に別のソフトで本当に起きるのよ。'
        - "イーサリアムが二つに割れて、違う決まりを選んだ人たちが、それぞれを今も動かしてるの。今夜の話みたいに、一時的に二冊になってまたそろうのとは別ね。"
      npc:
      - [DDD警察, 0]
      - [RTOS屋十五年, 1]
      - [カーネル読み, 1]
      - [処理落ち愛好会, 2]
      - [新卒二年目, 1]
  - say: 古い方が多いわね。当番やったことある人が多いのかしら。
  - say: "残したのは 0.7。0.8 が悪かったわけじゃないの。両方の版が受け入れられる方に戻したの。"
  - chat: [DDD警察, 筋は通したかった]
  - say: 筋は通したかった、分かる。でも、頁を書く大きいグループが 0.7 に戻して、0.7 の帳面の方に計算がどんどん積まれたの。
  - say: "積み重ねた仕事量が多い方を選ぶ決まりで、そっちにそろったの。自分が正しいと認めてる帳面の中で、だけどね。"
  - chat: [初見の旅人, 頁の数じゃないの？]
  - say: "頁の数じゃないのか？ だいたいは同じになるけど、本当に比べてるのは仕事量。計算した回数を数えるんじゃなくて、それぞれの頁の難しさから足していくの。"
  - chat: [定時退社したい, 割れてる間にお金はどうなったの]
  - say: "割れてる間のお金？ 同じお金を二回払う形の取引が、少なくとも一件、通ったの。"
  - chat: [初見の旅人, 泥棒？]
  - say: 泥棒かって？ 私も最初そう思ってたの。でも報告には、悪意のない試しだったって書いてあるの。本人もそう書いてる。
  - say: 戻すときにソフトを再起動したら、順番待ちの取引の置き場が空になって、後から出した方が先に入っちゃったの。
  - chat: [RTOS屋十五年, 再起動で直そうとして穴が開く]
  - say: 再起動で直そうとして穴が開く、開くの。私もよく再起動するから、ここ読んだとき、ちょっと背中が冷たくなった。
  - chat: [エラッタ収集家, 割れてたのは24頁、6時間くらい]
  - say: 24頁、6時間くらい、そう。そのあと 0.8.1 で、新しい版の方が、古い版の癖にしばらく合わせたの。
  - say: 本当に古いままの機械が切り離されたのは、八月十六日。
  - chat: [RTOS屋十五年, 五か月かけた]
  - say: 五か月かけたの。予告して、待って、知らせてから切ったの。こういう片付け方、好き。
- title: NAS の答え
  beats:
  - chat: [DDD警察, で、NAS の原因は]
  - chat: [カーネル読み, 待ってた]
  - say: NAS の原因……待ってた人もいるのね。言うわ。
  - say: あの NAS、八年前に私が設定したの。設定ファイルに一行書いてたの。
  - say: 「一度に開けるファイルは、256個まで」。
  - chat: [RTOS屋十五年, あ]
  - chat: [カーネル読み, 試験は三百個]
  - say: 試験は三百個、そう。全部開いたまま足していく作りだったから、使える札を全部埋めたら、次の一個から開かなかったの。
  - chat: [エラッタ収集家, 最初から使ってる分もあるしね]
  - say: 最初から使ってる分もある、そう。画面に字を出す口とかで、最初から何枚か使ってるの。だから、ファイルの数ぴったりじゃないのよ。
  - say: で、私の試験のプログラムが、開けなかったときのエラーを黙って飛ばしてたの。
  - chat: [処理落ち愛好会, 二重にやらかしてる]
  - say: {face: flustered, text: '二重にやらかしてる、って……黙って違う答えを出してたの、NAS じゃなくて私だったの。'}
  - chat: [DDD警察, 八年前の自分は他人]
  - say: 八年前の自分は他人、ね。会ったこともない人。名前は私だけど。
  - chat: [定時退社したい, Mt.Gox もこの頃？]
  - say: Mt.Gox もこの頃か？ Mt.Gox はね……話すと長いの。今度にする。
  - chat: [処理落ち愛好会, 逃げた]
  - say: "逃げた、って。逃げたの。今日は、試験の方を先に直すの。開けなかったら、答えを出さずに止まるように。上限の数字は、そのあと。"
  - say: 起きてる人たち、ありがとう。寝なさい。
