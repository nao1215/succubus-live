# ヴェスパ 004：アメリカのファンが、アニメに自分で字幕を付けていた頃（2026-10-27 新しく。材料は前の001の字幕班の節と、バイブルの海外のファン文化）
# 本題：1977年のアメリカのアニメクラブ、ダビングを重ねたテープ、1986年の最初のファンサブ、Robotech（1985年）の「許す派・許さない派」、Anime Expo。
# 脇道（共通の話題）：好きなコーヒー屋（chain_cafe：スターバックス。drink_coffee_how：ミルクたっぷり、ラテはオーツミルク）。ほかの配信者の店は並べない（全員分は mora/006 だけ。2026-10-27 二回目のレビュー）。
title: アメリカのファンが、アニメに自分で字幕を付けていた頃
parts:
- title: 向こうは朝
  beats:
  - say: こんばんは！ 今日はね、ちょっと海外の話をしたくて。
  - chat: [オハイオの字幕班, good morning]
  - say: オハイオの字幕班、おはよう！ そっち朝なんだ。
  - chat: [オハイオの字幕班, 朝の6時。出勤前]
  - say: 朝の6時、出勤前に来てくれたの！？ うれしい。遅刻しないでね。
  - chat: [初見の旅人, 初見です。海外の人？]
  - say: いらっしゃい！ 海外の人？って、そう、この人はアメリカのオハイオに住んでるの。
  - say: 90年代に、日本のアニメのテープで日本語を覚えたんだって。
  - chat: [オハイオの字幕班, 最初に覚えた言葉は「逃げちゃダメだ」]
  - say: {face: laugh, text: '最初に覚えた言葉が「逃げちゃダメだ」。何回聞いても笑っちゃう。'}
  - say: 「こんにちは」より先にそれだもん。日本に来たとき、どこで使うの。
- title: テープに字幕を付けた人たち
  beats:
  - chat: [初見の旅人, 名前の字幕班って何？]
  - say: 名前の「字幕班」って何か？ そこから話すね。昔のアメリカって、日本のアニメが英語でほとんど見られなかったの。
  - say: だからファンが、自分たちで字幕を付けたの。それを「ファンサブ」っていうの。
  - chat: [オハイオの字幕班, ファンのサブタイトル。fan sub]
  - say: そうそう、fan sub。で、その前の話がまた面白くてさ。
  - say: アメリカで最初のアニメのクラブは、1977年にできたって言われてるの。
  - say: 日本から届いたテープを、みんなでダビングして回したんだって。
  - chat: [初見の旅人, ダビングって？]
  - say: ダビングっていうのは、テープからテープに写すこと。コピーね。で、コピーのコピーのコピー、ってなっていくの。
  - chat: [オハイオの字幕班, 15回とか20回コピーしたテープもあった]
  - chat: [最後尾はこちら, 映るの？]
  - chat: [オハイオの字幕班, ほぼ雪]
  - say: {face: laugh, text: '20回コピーして、映るの？って聞いたら「ほぼ雪」！ 画面ずっと雪なのに観てたんだ！'}
  - say: でも分かる。ちょっとでも動いてたら観たいもん。
  - say: しかも字幕がないでしょ。だから台詞を英語に訳した冊子を横に置いて、読みながら観たの。
  - chat: [オハイオの字幕班, 2ドルか3ドルで売ってた]
  - say: その冊子、2ドルか3ドルで売ってたんだって。冊子とテレビを、こう、行ったり来たりするの。私なら首がおかしくなる。
  - chat: [晴海の生き残り, 日本でも似たことはあった。録画を回した]
  - say: 日本でも録画を回した？ あったよね！ 晴海の頃もテープ回してたんだ。
  - chat: [晴海の生き残り, 三倍で録ると画面が汚い]
  - say: 三倍で録ると画面が汚い！ 三倍モード！ 懐かしい！
  - chat: [初見の旅人, 三倍モード知らない]
  - say: 初見さん、三倍モード知らないか。ビデオテープに、普通の三倍の長さを録れる設定があったの。その代わり画面がぼやけるの。
  - say: 私ね、三倍で録った深夜アニメのテープ、まだ段ボールに四十本あるの。デッキはもう家にないのに。
  - say: 捨てようとすると、ラベルの自分の字が目に入って、戻しちゃう。
- title: そういえば、朝のコーヒー
  beats:
  - chat: [オハイオの字幕班, 今コーヒー飲みながら見てる。ダンキン]
  - say: コーヒー飲みながら、ダンキン！ ドーナツの！ そっちだと朝はそこなんだ？
  - chat: [オハイオの字幕班, 職場の近くにある。スタバより安い]
  - say: 職場の近くで、スタバより安いんだ。私はね、スタバ派なの。
  - chat: [初見の旅人, 何頼むの]
  - say: 何頼むか？ ラテ。ミルクをオーツミルクに替えるくらい。甘いのはあんまり頼まない。
  - say: スタバってね、遠征先でも同じ味なのが安心するの。知らない町で迷っても、とりあえず入れる。
  - say: 普通でしょ。でもね、旅行先で、その土地だけのフラペチーノがあると頼んじゃう。
  - chat: [最後尾はこちら, 甘いの頼まないって言った]
  - say: 甘いの頼まないって言った？ それは別なの！ その土地だけ、って書いてあったら別！
  - chat: [解釈違いです, 限定に弱いだけ]
  - say: {face: shy, text: '限定に弱いだけ……弱い。限定って文字に、ほんとに弱い。'}
  - say: 前にね、宮城の限定のやつ頼んで、写真撮ってたら、氷が全部溶けた。
  - say: 撮るのに十五分かかったの。角度が決まらなくて。坂を測るのと同じ癖が出ちゃった。
  - chat: [晴海の生き残り, わしは喫茶店のブレンドだ]
  - say: 晴海は喫茶店のブレンド。っぽい！ 新聞置いてあるお店でしょ。
  - say: 私も家だとミルクたっぷり、砂糖なし。朝これがないと声が出ないの。
  - chat: [最後尾はこちら, 出なくていい日もある]
  - say: 声が出なくていい日もある！？ ひどい！
- title: 最初の字幕のテープ
  beats:
  - chat: [オハイオの字幕班, 最初に字幕を付けたテープの話は？]
  - say: 最初の字幕のテープ！ そうそう、そうなんだよね！ 字幕が付いた最初のテープは、1986年って言われてるの。
  - say: 『ルパン三世』の一話に、パソコンで字幕を付けたの。
  - chat: [オハイオの字幕班, 100時間以上かかった]
  - say: 100時間以上！？ 30分くらいのアニメ一話にだよ。好きじゃないとできないって。
  - chat: [オハイオの字幕班, テープの最初に「売るな、レンタルに出すな、オークションに出すな」と入れた]
  - say: 「売るな、レンタルに出すな、オークションに出すな」、それ好き！ 英語でね、not for sale, rent, or auction って入ってたんでしょ。
  - say: この rent はね、レンタル屋さんに置いてお金を取るな、ってこと。友達にただで回すのはいいの。
  - chat: [初見の旅人, なんでそんなこと書くの]
  - chat: [オハイオの字幕班, 勝手に売る業者がいた]
  - say: なんで書くのかっていうと、勝手に売る業者。ファンがただで回してるテープを、勝手に売る人がいたんだって。
  - say: 転売に怒るのは、昔のアメリカでも同じだったんだね。
- title: 許す派、許さない派
  beats:
  - chat: [晴海の生き残り, Robotech の話はしないのか]
  - say: Robotech の話、晴海、それ振っちゃう！？ 喧嘩になるよ！
  - chat: [初見の旅人, ロボテック？]
  - say: ロボテックはね、1985年にアメリカのテレビでやってたアニメなの。全85話。
  - say: でも中身はね、日本のアニメ三本なの。『マクロス』と『サザンクロス』と『モスピーダ』。
  - chat: [初見の旅人, 三本を一本に？]
  - say: 三本を一本に！ 別々の三本を、一つの話になるようにつないだの。
  - chat: [オハイオの字幕班, あれはひどい]
  - say: 「あれはひどい」、出た、許さない派！
  - say: 私はね、許す派。乱暴だけど、あれでアメリカの子どもにマクロスが届いたんだもん。
  - say: 私も一回、英語の吹き替えのを観たの。マクロスなのに知らない名前ばっかりで、ずっと笑ってた。
  - chat: [オハイオの字幕班, ミンメイの話が途中で別の話になる]
  - say: ミンメイの話が途中で別の話に、なるけど！ なるけど、観た子がいたでしょ！
  - chat: [オハイオの字幕班, 私も観た。好きだった]
  - say: {face: surprised, text: '観てて、好きだったの！？ じゃあ許してるじゃん！'}
  - chat: [オハイオの字幕班, 好きだけど許さない]
  - say: 好きだけど許さない！ それは分かる。分かっちゃった。
  - chat: [解釈違いです, 私もそれ]
  - say: 「私もそれ」って、解釈違いですまでそっち側なの！？
  - chat: [解釈違いです, 二次創作の人間だから、つなぎ方には厳しい]
  - say: 二次創作の人だから、つなぎ方には厳しい。そっか、書く人の目線だとそうなるんだ。
  - chat: [初見の旅人, 誰がつないだの？]
  - say: 誰がつないだか？ Harmony Gold っていう会社でね、話をまとめたのは Carl Macek さんって人。
  - say: 向こうのファンの間だと、いい意味でも、悪い意味でも有名な人なんだって。
  - chat: [晴海の生き残り, マクロスは日本でも最初は数字が低かった]
  - say: マクロス、日本でも最初は数字が低かった、そうなの！ 日曜のお昼過ぎにやってて、平均6%くらいだったんだって。
  - say: でもね、山形テレビだと水曜の夕方にやってて、36%って数字が残ってるの。
  - chat: [初見の旅人, 6倍！？]
  - say: 6倍！？って、待って、そこは比べないで！ 山形の方、平均なのか一番高かった回なのか、私まだ確かめられてないの。
  - say: とにかく山形ではすごく見られてた、ってとこまで！
  - chat: [オハイオの字幕班, ヴェスパはマクロスで何が好き？]
  - say: マクロスで何が好きか？ 映画！ 1984年の『愛・おぼえていますか』。テレビのまとめじゃなくて、全部描き直してあるの。
  - say: 私ね、映画館でミンメイ見て、初恋しちゃったの。
  - chat: [最後尾はこちら, 人じゃない]
  - say: 人じゃない？ 人じゃなくてもいいの！ 帰りの電車で、ずっと歌口ずさんでた。
  - chat: [オハイオの字幕班, Robotech だと輝の名前がリック・ハンター]
  - say: {face: annoyed, text: 'そう！ 輝がリック・ハンターなの！ そこは私も許してない！'}
  - chat: [解釈違いです, 許す派が揺れてる]
  - say: 許す派が揺れてる？ 揺れてない。いや、ちょっと揺れたかも。
- title: アメリカの大きいイベント
  beats:
  - chat: [初見の旅人, アメリカにもコミケみたいなのある？]
  - say: アメリカにもコミケみたいなの、あるよ！ Anime Expo っていうの。ロサンゼルスで、毎年夏。
  - say: 一回目は1992年でね、ホテルで1750人くらいだったんだって。
  - chat: [オハイオの字幕班, 兄が行った]
  - say: お兄さんが行ったの！？ 一回目に！？ 写真ある？
  - chat: [オハイオの字幕班, 実家にある]
  - chat: [晴海の生き残り, 実家はそういう所だ]
  - say: {face: laugh, text: '「実家にある」と「実家はそういう所だ」！ 古いものはだいたい実家にある！'}
  - chat: [オハイオの字幕班, 2025年は41万人]
  - say: 2025年は41万人！？ すごい増えた！ あ、でもそれ延べでしょ？
  - chat: [初見の旅人, のべ？]
  - say: 延べっていうのは、同じ人が二日来たら、二人って数えるの。だから41万人の別々の人じゃないのね。
  - chat: [オハイオの字幕班, 入口を通った数で数えてる]
  - say: 入口を通った数で数えてるんだ。コミケも延べで数えてるから、そこは同じなんだ。
  - say: 向こうのコスプレの写真、毎年見てるの。槍持ってる人、けっこういるんだよ！ 仲間！
  - chat: [オハイオの字幕班, 来年はヴェスパも来て]
  - say: 来年は私も？ 行きたいの！ 行きたいんだけど。
  - chat: [最後尾はこちら, パスポート]
  - say: {face: shy, text: 'パスポート……切れてた。2024年に切れてたのに、今年まで気付かなかった。'}
  - say: 取り直すから！ 写真撮るとこからだけど！
  - say: 前の写真、十年前のなの。髪型が違いすぎて、自分でも誰か分からなかった。
- title: 海外のイベント、行ってみたい？
  beats:
  - say: みんなはどう？ 海外のアニメのイベント、行ってみたい？
  - ask:
      q: 海外のアニメのイベント、行ってみたい？
      options:
      - c: 行きたい
        r:
        - '{name}は行きたい派！ 一緒にパスポート取りに行こ！'
        - 向こうのコスプレ、気合いがすごいんだって。見たいよね。
      - c: 行ったことある
        r:
        - '{name}、行ったことあるの！？ どこ？ あとで教えて！'
      - c: 日本のイベントで十分
        r:
        - '{name}は日本で十分派。分かる、日本のも行ききれないもんね。'
        - 海外の人がこっちに来てくれるのも、うれしいしね。
      npc:
      - [晴海の生き残り, 2]
      - [オハイオの字幕班, 1]
      - [初見の旅人, 0]
      - [緑ペンラ二年目, 0]
      - [最後尾はこちら, 2]
  - say: 行きたい人と、日本で十分の人が同じくらいだね！
  - chat: [晴海の生き残り, 飛行機は腰に悪い]
  - say: 飛行機は腰に悪い？ 晴海は腰が心配だもんね。湿布、まだ三枚？
  - chat: [晴海の生き残り, 二枚に減った]
  - say: 二枚に減った！ よかった！
  - chat: [最後尾はこちら, 向こうの列整理の時給は気になる]
  - say: 向こうの列整理の時給が気になる！？ 行く理由がそこなの！？
- title: おしまい
  beats:
  - chat: [オハイオの字幕班, そろそろ出勤する]
  - say: そろそろ出勤？ もうそんな時間？ いってらっしゃい！ ダンキンこぼさないでね。
  - chat: [オハイオの字幕班, もう飲んだ]
  - say: もう飲んだの！？ 早い！
  - chat: [解釈違いです, 次は Robotech の続きで殴り合おう]
  - say: 次は Robotech の続きで殴り合い？ いいよ。私は許す派のまま行くからね。
  - say: 次はオハイオの字幕班が出勤前じゃない日にしよう。時間気にしながらだと負けそう。
  - say: よし、明日パスポートの写真撮ってくる。スタバでラテ飲んでから。
  - chat: [最後尾はこちら, 写真の前に飲むと口にミルクつく]
  - say: {face: surprised, text: '写真の前に飲むと口にミルクがつく、それはある！ 飲むのは撮ってから！'}
  - say: じゃあ今日はここまで！ みんな、おつかれさまでした！
