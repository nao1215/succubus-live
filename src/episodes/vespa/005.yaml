# ヴェスパ 005：アニメの舞台の町に行って、坂を測っている話（2026-10-27 新しく。材料は前の001の『坂の本』の節と、バイブルの聖地巡礼）
# 本題：『坂の本』。大洗（あんこう祭の人数）、鷲宮（初詣の人数、特別住民票）、飛騨市の特別上映会、豊郷と鎌倉の踏切（来る側のマナー）。
# 脇道（共通の話題）：温泉（bath_onsen：伊香保の石段を測った）、肉まんか豚まんか（fac_nikuman：豚まん。551。エラも豚まん派。ほかの人数は並べない）。
title: アニメの舞台の町に行って、坂を測っている話
family: true  # 子どもの頃の自由研究（寮の階段）の話がある回。この回の間は性的な返しを選ばない
parts:
- title: 駅の前の坂
  beats:
  - say: こんばんは！ 今日ね、駅から家までの坂、測ってみたの。
  - chat: [晴海の生き残り, こんばんは。また坂か]
  - say: 「また坂か」って、晴海、久しぶりなんだって！ 前の坂とは別！ 家の前のは初めて！
  - chat: [初見の旅人, 初見です。坂を測る？]
  - say: いらっしゃい！ 坂を測る？ そう、スマホに角度を測るアプリがあってね、それを地面に置くの。
  - say: で、四度だった！ 毎日上ってる坂なのに、測ったの初めて。
  - chat: [最後尾はこちら, 四度は坂って言わない]
  - say: 四度は坂って言わない？ 言うよ！ 自転車だとちょっときついもん。
  - chat: [初見の旅人, なんで測るの？]
  - say: なんで測るのか？ えっとね、私、アニメの舞台になった町に行って、そこの坂を測る本を作ってるの。『坂の本』。
  - chat: [同人誌即売会帰り, 夏に買った]
  - say: 夏に買ってくれたの！？ ありがとう！ 波打ってなかった？
  - chat: [同人誌即売会帰り, ちょっと波打ってた]
  - say: {face: shy, text: 'ちょっと波打ってた！？ ごめん！ それ雨の日のやつだ！'}
- title: アニメは坂をきつく描く
  beats:
  - chat: [初見の旅人, 測ってどうするの]
  - say: 測ってどうするかっていうと、アニメの中の坂と比べるの。
  - say: ある町の坂、測ったら八度だったのね。でもアニメの画面で見ると、十二度くらいに見えるの。
  - chat: [初見の旅人, アニメの方がきつい？]
  - say: そう、アニメの方がきついの！ たぶん、登ってる感じを出したいんだと思う。画面だと坂って平らに見えやすいから。
  - chat: [解釈違いです, 坂はキャラの気持ちでもある。しんどい日は坂がきつい]
  - say: しんどい日は坂がきつい……うわ、それいい。それいいな。
  - chat: [解釈違いです, あなたの本は気持ちを無視して測ってる]
  - say: 私の本は気持ちを無視して測ってる？ 無視してない！ 測ったあとで気持ちを考えてるの！
  - chat: [解釈違いです, 順番が逆]
  - say: 順番が逆？ 逆でもいいでしょ！ 本で殴り合お！
  - chat: [初見の旅人, 今まで一番きつかった坂は？]
  - say: 一番きつかった坂？ ある港町の、階段みたいな坂。十五度あった。
  - chat: [最後尾はこちら, 十五度は階段]
  - say: 十五度は階段って、階段じゃないの、坂なの！ 地図に坂の名前が書いてあったもん。
  - say: 地図で坂に名前が付いてると、すごくうれしいの。誰かが名前を付けるくらい、みんなが通ってた坂なんだなって。
  - chat: [晴海の生き残り, 名前の由来は調べたのか]
  - say: 名前の由来？ 調べようとして、近くのおばあちゃんに聞いたの。そしたら、ぜんぜん違う坂の話をしてくれて。
  - say: 三十分くらい聞いてた。楽しかったけど、結局その坂の名前の意味は分からなかった。
  - chat: [解釈違いです, 取材としては失敗]
  - say: 取材としては失敗……かな。でもみかんもらった。
  - chat: [同人誌即売会帰り, みかんは成功]
  - say: みかんは成功、だって。うん、みかんは成功。
  - chat: [初見の旅人, なんで坂なの？ 建物とかじゃなくて]
  - say: 建物じゃなくて、なんで坂か。なんでだろうね。たぶん、子どもの頃の自由研究かな。
  - say: 魔界の学校の寮でね、階段の段の高さを全部測ったことがあるの。そしたら一段ずつ全部違ってて。
  - say: 先生に「なんで違うの」って聞いたら、「建てた人が違うから」って言われたの。
  - say: それがなんか、ずっと頭に残ってて。坂も、誰かが作ったり、みんなが歩いて削れたりしてできてるでしょ。
  - chat: [解釈違いです, その先生の話、ちょっと小説にしたい]
  - say: 先生の話を小説に！？ しないで！ 先生、たぶん覚えてないから！
- title: 聖地巡礼って
  beats:
  - chat: [初見の旅人, 聖地巡礼ってよく聞くけど何？]
  - say: 聖地巡礼っていうのは、アニメの舞台になった場所に、ファンが行くこと。行ったらその景色とアニメの絵を見比べるの。
  - say: 私が一番好きなのは大洗。茨城の海の町ね。『ガールズ&パンツァー』の舞台。
  - chat: [晴海の生き残り, 戦車の町だな]
  - say: そう、戦車の町！ でもね、大洗って坂が少ないの。測るものがなくて、ちょっとさみしい。
  - chat: [最後尾はこちら, じゃあ何しに行くの]
  - say: じゃあ何しに行くのかって？ 町の人に会いに！ 商店街ごと迎えてくれるの。お店の前にキャラのパネルが立ってたりして。
  - say: 秋の「あんこう祭」ってお祭り、例年は2〜3万人くらいだったのが、2012年に6万人になったんだって。
  - say: で、2015年には11万人！ 倍どころじゃないの！
  - chat: [最後尾はこちら, 11万の町の祭り。トイレが足りない]
  - say: {face: laugh, text: '「トイレが足りない」！？ 最初に心配するのそこなの！'}
  - chat: [同人誌即売会帰り, 大洗で何食べた？]
  - say: 大洗で何食べたか？ しらす丼！ 海の町だから、しらすがふわっふわなの。
  - say: 一軒目は「今日はしらす上がってないです」って言われてね。漁がない日もあるんだって。二軒目でやっと食べた。
  - say: あとね、ふるさと納税も大洗町にしてるの。あんこう鍋のセットが届くの。
  - chat: [初見の旅人, ふるさと納税って？]
  - say: ふるさと納税はね、好きな町にお金を送ると、税金が少し安くなって、その町のものが届く仕組み。ざっくり言うとね。
  - chat: [最後尾はこちら, 一人で鍋したの？]
  - say: 一人で鍋したのかって……一人でこたつで食べた。坂のない町の鍋、すっごくおいしかった。
  - chat: [晴海の生き残り, 坂は関係ない]
  - say: 坂は関係ない。うん、関係ないね。言いたかっただけ。
- title: そういえば、温泉の石段
  beats:
  - chat: [同人誌即売会帰り, 坂じゃないけど伊香保の石段とか測りそう]
  - say: 伊香保の石段、測りそう？ 測った！ 365段、全部！
  - say: 一段ずつアプリを置いてたら、後ろの観光の人たちがずっと待っててね。
  - say: 途中で気付いて、「すみません、どうぞ！」って横によけたの。
  - chat: [最後尾はこちら, 列を作ってる]
  - say: 列を作ってる……作ってた。私が列の先頭だった。
  - chat: [晴海の生き残り, 温泉には入ったのか]
  - say: 温泉には入った！ 上り切ってから入ったら、お湯が熱くて。いつもの43度のシャワーより熱かった。
  - chat: [初見の旅人, 温泉どこが好き？]
  - say: どこが好きか？ 伊香保！ 石段があるから！ あとは遠征の帰りのスーパー銭湯。サウナだけ入るの。
  - chat: [同人誌即売会帰り, 草津派]
  - chat: [晴海の生き残り, 箱根]
  - say: 草津も箱根も、坂多そう！ 行きたい！
  - chat: [解釈違いです, 温泉を坂で選んでる]
  - say: {face: smug, text: '温泉を坂で選んでる？ 選んでる。坂があるとお湯がおいしい気がするの。'}
  - chat: [最後尾はこちら, お湯は飲まない]
  - say: お湯は飲まない、飲まないね！ 言葉のあや！
- title: 鷲宮と、迎える町
  beats:
  - chat: [同人誌即売会帰り, 鷲宮は行った？]
  - say: 鷲宮？ 行った！ 埼玉の鷲宮神社。『らき☆すた』っていうアニメに出てきた神社なの。
  - chat: [晴海の生き残り, 初詣の人が増えた所だな]
  - say: そう、初詣の人が増えた所！ お正月の三が日の人が、2007年に9万人だったのが、2011年には47万人。
  - say: 5倍だよ！ しかも町が、主人公の一家に「特別住民票」を出したの。アニメのキャラに！
  - chat: [初見の旅人, キャラが住民に？]
  - say: キャラが住民に！ そういう遊び心！ お祭りにはキャラの神輿まで出たんだよ。
  - chat: [最後尾はこちら, 初詣の列整理、しんどそう]
  - say: 初詣の列整理、しんどそうだよね。私、そこで初詣したことあるの。人に流されて、お参りする前に出口に着いた。
  - chat: [晴海の生き残り, 並び直したのか]
  - say: 並び直したかって？ 並び直した！ おみくじ中吉！
  - say: あと岐阜の飛騨市も好き。『君の名は。』の舞台。
  - say: 市が、来る人より先に、住んでる人に観てもらう上映会を開いたの。
  - chat: [解釈違いです, それはいい]
  - say: 「それはいい」でしょ。自分の町がどう描かれてるか、住んでる人が先に知ってるって大事だと思う。
- title: 住んでる人の道
  beats:
  - say: ただ、ちょっとだけ真面目な話もするね。
  - say: 聖地って、住んでる人にとっては普通の道なの。毎日の通学路だったりするの。
  - say: 滋賀の豊郷小学校の古い校舎は、『けいおん!』の舞台に似てるって人が集まったんだけど。
  - say: 2010年に町が、迷惑なことが続くなら閉めることもある、って知らせを出したの。
  - say: 私も前に行ったけど、写真一枚撮って、すぐ離れた。すぐ近くに住んでる人もいるからね。
  - chat: [晴海の生き残り, 騒ぐ者がいたか]
  - say: 騒ぐ人がいたか？ うん。あと、神奈川の鎌倉高校前の踏切。『スラムダンク』のオープニングの所。
  - say: 去年の10月、中国の大型連休のころは、警備員さんが7人で見てたって。
  - chat: [最後尾はこちら, 踏切に7人。分かる。必要]
  - say: 「踏切に7人、必要」。最後尾はこちらが言うと説得力ある。
  - say: 写真は決められた場所から。道はふさがない。それだけで全然違うの。
  - chat: [初見の旅人, 気をつけます]
  - say: 気をつけます、ありがと！ 初見の旅人、行くときは地図に書いてある撮影場所を見てね。
- title: 聖地巡礼、したことある？
  beats:
  - ask:
      q: アニメや漫画の舞台になった場所、行ったことある？
      options:
      - c: ある
        r:
        - '{name}、どこ行った？ 坂あった？'
        - あとでチャットに町の名前書いて。行きたい所に足す！
      - c: ないけど行ってみたい
        r:
        - '{name}、いいね！ 最初は近い所からでいいよ。'
        - 町のご飯も食べてきてね。それも半分くらい目的だから！
      - c: 興味ない
        r:
        - '{name}は興味ない派。それでいいよ！'
        - 私の坂の話だけ聞いてって。それなら家でできるから。
      npc:
      - [晴海の生き残り, 0]
      - [初見の旅人, 1]
      - [最後尾はこちら, 2]
      - [同人誌即売会帰り, 0]
      - [解釈違いです, 0]
  - say: 行ったことある人が多いね！ あとで町の名前、教えて！
  - chat: [最後尾はこちら, 興味ない。でも人が集まる所はバイトで行く]
  - say: 最後尾はこちら、興味ないけどバイトで行く。実は聖地っぽい所にいっぱい行ってそう。
- title: 帰りの豚まん
  beats:
  - chat: [同人誌即売会帰り, 遠征の帰りって何買う？]
  - say: 遠征の帰りに何買うか？ 大阪の帰りなら絶対、551の豚まん！ 新大阪で六個入りを買うの。
  - chat: [晴海の生き残り, 肉まんだろう]
  - say: 「肉まんだろう」、出た、肉まん派！ 大阪だと豚まんって言うの。私、大阪に行きすぎて戻らなくなった。
  - chat: [初見の旅人, どっちでもよくない？]
  - say: どっちでもいい？ よくないんだよ、これが！ エラも豚まん派でね、「豚の饅頭を肉と申すのは雑でございます」って。
  - chat: [解釈違いです, 言い方が強い]
  - say: 言い方が強い？ 強いでしょ！ 私はそこまで言わないけど、気持ちは分かる。
  - chat: [同人誌即売会帰り, 新幹線で食べると匂う]
  - say: 新幹線で食べると匂う、匂うの！ 前に新幹線で開けたら、隣の人が振り向いたの。
  - say: で、一個あげたら仲良くなって。その人、今は遠征仲間のグループにいる。
  - chat: [最後尾はこちら, 豚まんで仲間を増やしてる]
  - say: {face: laugh, text: '豚まんで仲間を増やしてる？ 増やしてる！ 匂いで集めてる！'}
- title: おしまい
  beats:
  - say: じゃあ今日はここまで！ 次の聖地、どこにしようかな。
  - chat: [晴海の生き残り, 坂の多い所にしろ]
  - say: 坂の多い所にしろ？ 晴海が坂をすすめてくれた！ うれしい！
  - chat: [晴海の生き残り, 早く終わらせたいだけだ]
  - say: 早く終わらせたいだけ！？ ひどい！ でも行く！
  - chat: [解釈違いです, 冬の本の原稿は？]
  - say: 冬の本の原稿？ 次の聖地に行ってから描くの！ 取材だから！
  - chat: [解釈違いです, 締切は待たない]
  - say: {face: shy, text: '締切は待たない。知ってる。ちゃんと描く。'}
  - say: みんな、ありがとう！ 駅の坂も測ってみてね！ おつかれさまでした！
