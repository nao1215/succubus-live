# ヴェスパ 006：晴海さんに、VTuberを一から説明してみた（2026-10-27 新しく。材料はバイブルの VTuber の知識と、晴海の「バーチャル演歌歌手」）
# 本題：VTuber とは何か、キズナアイ（2016年12月）、2018年の増え方、にじさんじの1期生、「中の人」の話をしない作法、グッズの売上、痛バッグ。
# 脇道（共通の話題）：きのこの山かたけのこの里か（fac_kinoko_takenoko：たけのこ）。ほかの配信者の派閥は並べない（全員分の紹介は pim/001 だけ。2026-10-27 二回目のレビュー）。
title: 晴海さんに、VTuberを一から説明してみた
parts:
- title: バーチャル演歌歌手
  beats:
  - say: こんばんは！ 聞いて、昨日すっごい笑ったことがあって。
  - chat: [晴海の生き残り, こんばんは]
  - say: 晴海、ちょうどよかった。昨日の晴海の話なんだけど。
  - say: 晴海さ、昨日のチャットで、VTuber のこと「バーチャル演歌歌手」って言ったでしょ。
  - chat: [晴海の生き残り, 違うのか]
  - say: {face: laugh, text: '「違うのか」って、違う！ 演歌じゃない人の方が多い！ 歌う人もいるけど！'}
  - chat: [初見の旅人, 初見です。VTuberって何？]
  - say: いらっしゃい！ VTuberって何か？ ちょうどいいや、晴海と一緒に聞いてて。
  - say: VTuber っていうのは、絵とか3Dのキャラの姿で、動画や配信をする人のこと。
  - say: 声と動きは本物の人なんだけど、画面に映るのはキャラなの。
  - chat: [晴海の生き残り, 着ぐるみのようなものか]
  - say: 着ぐるみのようなもの？ あ、近い！ 近いけど、着ぐるみって言うとちょっと怒られるかも。
  - say: 中に人がいる前提の言い方になっちゃうからね。そこはふわっとしておくのが優しさなの。
  - chat: [晴海の生き残り, 難しいな]
  - say: 難しい？ 難しくないよ。晴海が昔観てたアニメのキャラが、生放送でしゃべってくれる感じ。
  - chat: [晴海の生き残り, それは、いいな]
  - say: 「それは、いいな」って！ でしょ！
- title: 最初の一人
  beats:
  - chat: [初見の旅人, いつからいるの？]
  - say: いつからいるか？ 有名なのはキズナアイ。2016年の12月に始めて、「世界初のバーチャルYouTuber」って名乗ったの。
  - chat: [晴海の生き残り, 自分で名乗ったのか]
  - say: 自分で名乗った！ そういうとこが好き。
  - say: で、2018年に一気に増えたの。春に1000人を超えて、年末には6000人。
  - say: その頃、毎日新しい子が出てきて、追いかけるの大変だった。
  - say: 私も一回、自分でやってみようとしたの。顔の動きを読むソフト入れたら、パソコンがすごい音出して、熱くなって、やめた。
  - chat: [最後尾はこちら, 日誌に書いてたでしょ]
  - say: 'あ、毎日増えてた子たちの名前のこと？'
  - say: 日誌に？ 書いてた。でも途中で書くのが追いつかなくなって、名前だけのページがある。
  - chat: [緑ペンラ二年目, 先輩こんばんは！ にじさんじも2018年ですよね]
  - say: 二年目、こんばんは！ にじさんじも2018年、そう、2月。最初は8人でデビューしたの。
  - chat: [晴海の生き残り, 8人。おニャン子より少ないな]
  - say: おニャン子より少ない？ 晴海、比べる相手が80年代なのよ。
  - chat: [晴海の生き残り, おニャン子は11人で始まった]
  - say: 11人で始まった、それはそうなんだけど！ そこは合ってるけど！
  - chat: [初見の旅人, おニャン子って？]
  - say: おニャン子クラブはね、80年代の、夕方のテレビ番組から生まれたアイドルのグループ。晴海の青春だね。
  - chat: [晴海の生き残り, 見てただけだ]
  - say: 毎回「見てただけ」って言う！
- title: そういえば、きのこ？ たけのこ？
  beats:
  - chat: [同人誌即売会帰り, 今たけのこの里食べながら見てる]
  - say: 待って、たけのこの里食べながら見てる！？ 仲間だ！
  - chat: [初見の旅人, きのこ派です]
  - say: 初見さん、きのこ派。あ、敵だ。
  - chat: [初見の旅人, 敵！？]
  - say: {face: laugh, text: '冗談、冗談！ でもね、私はたけのこの里。下のクッキーがさくさくなのが好きなの。'}
  - chat: [晴海の生き残り, きのこは持つ所がある。手が汚れない]
  - say: 晴海はきのこなんだ！ 持つ所があって手が汚れない、ね。夏のイベントだと、それはちょっと分かる。
  - say: 列でたけのこ食べてたら、手がチョコだらけになって、カタログ触れなくなったことあるもん。
  - chat: [最後尾はこちら, じゃあきのこにすれば]
  - say: じゃあきのこにすれば？ しない！ 手は洗えばいいの！
  - ask:
      q: きのこの山とたけのこの里、どっち派？
      options:
      - c: きのこの山
        r:
        - '{name}はきのこ派。持つ所があるのはいいよね。認める！ 食べないけど！'
      - c: たけのこの里
        r:
        - '{name}、たけのこ派！ ようこそ！ さくさくの方へ！'
      - c: どっちも好き
        r:
        - '{name}はどっちも派。平和な人だ。'
        - 争いに疲れたら、そっちに行こうかな。
      - c: どっちも食べない
        r:
        - '{name}、まさかの不参加！ じゃあ何食べるの？ あとで教えて。'
      npc:
      - [晴海の生き残り, 0]
      - [初見の旅人, 0]
      - [同人誌即売会帰り, 1]
      - [緑ペンラ二年目, 1]
      - [最後尾はこちら, 3]
  - say: きのことたけのこ、ちょうど同じ数！ 戦争は続くね！
  - chat: [最後尾はこちら, 食べない。休憩はおにぎり]
  - say: 最後尾は食べない、休憩はおにぎり。そうだよね。お菓子食べてるの見たことない。
  - chat: [緑ペンラ二年目, 先輩、たけのこです！]
  - say: 二年目はたけのこ！ 信じてた！
- title: 中の人の話
  beats:
  - chat: [晴海の生き残り, で、そのぶいちゅーばーの、キャラの中には誰がいるんだ]
  - say: キャラの中に誰がいるか、そこ！ そこはね、晴海、聞かないのが決まりなの。
  - chat: [晴海の生き残り, なぜだ]
  - say: なぜかっていうと、キャラと声と、その人が話すこと、全部まとめて一人なんだよ。中を覗こうとすると、その一人が壊れちゃうの。
  - chat: [晴海の生き残り, アイドルの素顔を詮索しない、みたいなものか]
  - say: アイドルの素顔を詮索しない、そう、それに近い！ 晴海、今のは分かりやすかった。
  - chat: [初見の旅人, 声優さんとは違うの？]
  - say: 声優さんと違うの？ うーん、似てるとこもあるけど、VTuber は自分で考えて、自分の言葉でしゃべる人が多いかな。雑談とか、ゲームとか。
  - chat: [解釈違いです, ヴェスパにも中の人いるの？]
  - say: {face: surprised, text: '私に中の人！？ いないよ！ 私はサキュバス！ 中も外も私！'}
  - chat: [最後尾はこちら, 中身は段ボール運ぶ人]
  - say: 中身は段ボール運ぶ人？ それも私！ 全部私！ 話戻すね！
- title: チャットの言葉
  beats:
  - chat: [晴海の生き残り, さっきから「草」と書いてる者がいる。何だ]
  - say: 「草」が何か？ あ、それね、笑ってるってこと！ 「w」って書くでしょ、それが並ぶと草が生えてるみたいに見えるから。
  - chat: [晴海の生き残り, わしの頃は「（笑）」だった]
  - say: 晴海の頃は「かっこわらい」だった？ それ、今やるとちょっと怖いんだよ。真顔っぽくて。
  - chat: [切り抜き職人A, こんばんは。てぇてぇも教えてあげて]
  - say: 切り抜き職人A、こんばんは！ てぇてぇも教えて、ね。「尊い」が崩れた言葉。仲良くしてるのを見て、いいなあってなる気持ち。
  - chat: [晴海の生き残り, 尊い。それは分かる]
  - say: 「尊い。それは分かる」って、分かるんだ！
  - chat: [初見の旅人, 切り抜きって？]
  - say: 切り抜きっていうのは、長い配信の面白いところを短く切って、動画にすること。この人それが得意なの。
  - chat: [切り抜き職人A, 今日の「バーチャル演歌歌手」は切る]
  - say: {face: laugh, text: '「バーチャル演歌歌手」を切る！？ 切っちゃだめ！ 晴海が有名になっちゃう！'}
  - chat: [晴海の生き残り, なってもいい]
  - say: 有名になってもいいの！？
  - chat: [初見の旅人, スパチャってのもよく見る]
  - say: スパチャはスーパーチャット。配信の中で送れる投げ銭のこと。お金と一緒にコメントが目立って出るの。
  - say: 私、初めて送ったのが読まれたとき、自分の名前なのに画面の前で噛んだ。送った側なのに！
  - chat: [晴海の生き残り, おひねりだな]
  - say: おひねりだな、って、そう、おひねり！ 晴海、今日なんか分かるの早いね。
  - chat: [晴海の生き残り, 昔のものに置き換えれば分かる]
  - say: 昔のものに置き換えれば分かる。それ、いい覚え方。
  - chat: [初見の旅人, ヴェスパさんはいつから見てるの？]
  - say: 私がいつから見てるか？ にじさんじの最初の頃から。2018年の春くらいかな。
  - say: 最初は、地下アイドルの配信を見るついでだったの。おすすめに出てきて、なんとなく開いたら止まらなくなって。
  - say: 夜中に雑談の配信を流しながら寝ちゃうのが、今も毎日の決まりみたいになってる。
  - say: ログインボーナスは四日で切れるのに、これは続いてるの。寝てるだけだからかな。
  - chat: [緑ペンラ二年目, 寝落ち、分かります]
  - say: 二年目も寝落ち分かる？ 分かるよね。朝起きたら、知らない人の配信になってるの。
- title: 売上の半分はグッズ
  beats:
  - chat: [最後尾はこちら, VTuberの会社って儲かってるの？]
  - say: VTuberの会社って儲かってるの？って、気になるのそこなんだ。でもね、それ面白い数字があるの。
  - say: 2022年の調べだと、VTuber の売上の半分くらいがグッズなんだって。
  - say: そう、アクリルスタンドとか、缶バッジとか。私の部屋にもいっぱいある。
  - chat: [初見の旅人, アクリルスタンド？]
  - say: アクリルスタンドはね、透明な板にキャラが印刷してあって、机に立てて飾るやつ。みんなアクスタって呼ぶ。
  - say: あと、カードゲームね。ホロライブのカードが2024年に出て、すっごい売れたの。
  - chat: [緑ペンラ二年目, ホロカ、友達がやってます]
  - say: ホロカ、友達がやってる？ やってる人多いよね。会社のグッズの売上が、一年で6割以上増えたんだって。
  - chat: [最後尾はこちら, グッズの段ボール、増えてる]
  - say: グッズの段ボールが増えてるって、現場で実感してるんだ！
  - say: 缶バッジの箱、重いもんね。私、痛バッグに缶バッジ六十個入れて、肩痛めたもん。
  - chat: [初見の旅人, 痛バッグ？]
  - say: 痛バッグっていうのは、推しの缶バッジをいっぱい付けて見せるカバン。透明な所にずらって並べるの。
  - say: 整骨院の先生に「何を背負ってるんですか」って聞かれた。
  - chat: [晴海の生き残り, 何と答えた]
  - say: 何と答えたか？ 「推しです」って。先生、それ以上何も聞かなかった。
  - chat: [最後尾はこちら, 重さ半分にしろって言われたでしょ]
  - say: 重さ半分にしろって？ 言われた。半分にしたら、空いた所に新しいのが入った。
  - chat: [解釈違いです, 減ってない]
  - say: 減ってない。減ってないね。先生にはまだ言ってない。
- title: 終わったもの
  beats:
  - chat: [緑ペンラ二年目, ホロアースは終わっちゃいましたね]
  - say: ホロアース、終わっちゃったね。今年の6月で。
  - chat: [初見の旅人, ホロアースって？]
  - say: ホロアースはね、ネットの中の町で、アバターで歩いたり、ライブを見たりできる場所だったの。
  - say: 5月に、6月で終わりますって発表があって。私、最後の日もログインしてた。
  - say: 誰もいない広場で、一人でぐるぐる歩いてたの。
  - chat: [晴海の生き残り, 晴海の会場がなくなった時みたいだな]
  - say: 晴海の会場がなくなった時みたい……うん。場所がなくなるのって、さみしいよね。
  - say: でもね、戻ってくるものもあるの。キズナアイ、2022年のライブのあとお休みしてたでしょ。
  - chat: [緑ペンラ二年目, 去年戻ってきましたよね！]
  - say: 去年戻ってきた、そう、2025年の2月！ 戻ってきたとき、ほんとにうれしかった。
  - say: 休む前のライブも覚えてるよ。画面の前で、ペンライト振ってた。一人で。
  - chat: [同人誌即売会帰り, たけのこ食べ終わった]
  - say: {face: laugh, text: 'たけのこ食べ終わった！？ 今それ言う！？ 早い！'}
- title: 晴海の推し
  beats:
  - chat: [晴海の生き残り, で、わしは誰を見ればいいんだ]
  - say: 「わしは誰を見ればいいんだ」！？ え、晴海、見る気になってる！？
  - chat: [晴海の生き残り, 演歌を歌う子はいるのか]
  - say: 演歌を歌う子？ いるかも！ 探す！ 歌が上手い子なら、何人か知ってる。
  - chat: [緑ペンラ二年目, 昭和の歌を歌う枠、けっこうあります]
  - say: 昭和の歌を歌う枠、あるよね！ 晴海、それ絶対好きだよ。
  - say: チャットに歌詞の続きが流れたりするの。晴海、絶対書き込むでしょ。
  - chat: [晴海の生き残り, 字が小さいと読めんぞ]
  - say: 字が小さいと読めない？ チャットの字の大きさ、変えられるから。今度教えるね。
  - say: 晴海がハマったら面白いだろうな。「晴海の頃から見てる」って言い出しそう。
  - chat: [晴海の生き残り, まだ見てない]
  - say: まだ見てない、って。そうだね。うん。
- title: おしまい
  beats:
  - say: じゃあ今日はここまでかな。晴海に送るリスト、あとで作る。
  - chat: [解釈違いです, そのリストより原稿]
  - say: リストより原稿？ リスト作るのは五分だから！
  - chat: [最後尾はこちら, 五分で済んだことない]
  - say: 五分で済んだことない……済まないかもしれない。まあいいや。
  - say: みんな、ありがとう！ たけのこ派の人は、明日たけのこ買ってね！ おつかれさまでした！
