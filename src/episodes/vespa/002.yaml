# ヴェスパ 002：推しの前だと「おつかれさまです」しか言えない（2026-10-27 10〜15分の雑談に作り直し。前の版は src/old/episodes-v7/vespa/002.yaml）
# 本題：昨日はバイトで別のグループの「はがし」をやって遅いと注意された。その前の日、自分の推しのチェキ会でまた「おつかれさまです」。2005年の長机の握手会、2021年のオンラインのお話し会で固まった話。
# 脇道（共通の話題）：お風呂の温度（bath_temp：43度のシャワー。bath_phone：お風呂でコールの練習）。ほかの人の温度は並べない（全員分の紹介は ella/003 だけ。2026-10-27 二回目のレビュー）。
title: 推しの前だと「おつかれさまです」しか言えない
parts:
- title: あいさつより先に
  beats:
  - say: こんばんは！ 今日も来てくれてありがとう！
  - chat: [最後尾はこちら, おつかれ。昨日のはがし、遅かったね]
  - say: {face: surprised, text: '「昨日のはがし、遅かったね」！？ 一言目それ！？ こんばんはより先に！？'}
  - chat: [晴海の生き残り, こんばんは。何が遅いって？]
  - say: 晴海、何が遅いかなんて聞かなくていいの！
  - chat: [初見の旅人, 初見です。はがしって何？]
  - say: いらっしゃい！ はがしって何か？ えっとね、アイドルのイベントで、ファンが一人ずつ少しだけ話せる時間があるの。
  - say: で、時間が来たら「お時間です」ってファンを離す係がいるの。それが「はがし」。
  - chat: [初見の旅人, ファンをはがす]
  - say: 「ファンをはがす」、字にすると怖いね！ でも優しくはがすんだよ。
  - say: 昨日ね、バイトでそれやったの。私の推しじゃない、別のグループで。
  - chat: [最後尾はこちら, 班長に二回注意されてた]
  - say: 班長に二回注意されてた？ 一回半！ 二回目は途中で終わったから半分！
  - chat: [最後尾はこちら, 半分でも注意は注意]
  - say: 半分でも注意は注意って……だってさ、ファンの人が話してる途中なんだもん。
  - say: 「あの、先週の」まで言ってる人、はがせないよ。続き気になるでしょ？
  - chat: [最後尾はこちら, 続きを聞くのはアイドルの仕事]
  - say: {face: thinking, text: '続きを聞くのはアイドルの仕事。う、それはそう。'}
  - chat: [最後尾はこちら, 次の人の時間が減る]
  - say: 次の人の時間が減る、か。そっか。次の人も、家で言うこと練習してきてるもんね。
  - say: 私みたいに。
  - chat: [最後尾はこちら, あんたは練習しても言えないけど]
  - say: {face: annoyed, text: '「練習しても言えないけど」って！ 今ちょっといいこと言ってたのに！'}
- title: 九年、おつかれさまです
  beats:
  - chat: [初見の旅人, ヴェスパさんも推しがいるの？]
  - say: 私の推し？ いるよ！ 「ハチミツ注意報」っていう地下アイドルの、緑担当のミナミ。
  - chat: [初見の旅人, 地下アイドル？]
  - say: 地下アイドルっていうのは、テレビより、小さいライブハウスで活動してるアイドルのことね。地下でやるとは限らないよ。
  - say: で、おとといがミナミのチェキ会だったの。
  - chat: [初見の旅人, チェキ会？]
  - say: チェキ会はね、その場で写真が出てくる小さいカメラ、チェキっていうの。それで推しと一枚撮って、少しお話しできる会。
  - say: ハチミツ注意報だと、一枚1500円で三十秒くらい。
  - chat: [晴海の生き残り, で、何を話したんだ]
  - say: 何を話したか？ ……「おつかれさまです」。
  - chat: [最後尾はこちら, 知ってた]
  - chat: [晴海の生き残り, 何年目だ]
  - say: 「知ってた」って言わないで。何年目かっていうと、九年目。九年、ずっと「おつかれさまです」。
  - chat: [初見の旅人, 九年！？]
  - say: そう、九年！ 配信だとこんなに喋れるのにね！ 本人を前にすると、頭が真っ白になるの。
  - say: ミナミが「来てくれてありがとう」って笑うでしょ。で、口から出るのが「おつかれさまです」。
  - chat: [緑ペンラ二年目, 先輩こんばんは！ ミナミちゃん、先輩のこと覚えてますよ]
  - say: 二年目、こんばんは！ え、ミナミが私のこと覚えてる！？ ほんと！？
  - chat: [緑ペンラ二年目, 「おつかれさまの人、今日も来てたね」って]
  - say: {face: flustered, text: 'おつかれさまの人！？ 私そう呼ばれてるの！？'}
  - chat: [最後尾はこちら, それ認知って言っていいの？]
  - say: それ認知って言っていいのかって？ 認知だよ！ 覚えられてるもん！ 名前じゃないけど！
  - chat: [初見の旅人, 認知？]
  - say: 認知っていうのは、推しに顔とか名前を覚えてもらうこと。ファンの間でそう言うの。
  - chat: [緑ペンラ二年目, ちなみに私、この前名前呼ばれました]
  - say: え。名前呼ばれた？
  - chat: [緑ペンラ二年目, 二か月目で]
  - say: 二か月！？ おめでとう！ おめでとうだけど、二か月！？
  - chat: [最後尾はこちら, 声震えてる]
  - say: 声震えてる？ 喜びで震えてるの！
  - chat: [緑ペンラ二年目, 先輩も名前言えばいいのに]
  - say: 名前言えばいいのにって、言えたら九年かかってないのよ！
- title: 練習はお風呂で
  beats:
  - chat: [解釈違いです, 練習はどこでしてるの]
  - say: 練習はどこで？ お風呂！ シャワー浴びながら言うの。響くから、ちょっと上手く聞こえるんだよね。
  - chat: [同人誌即売会帰り, お風呂何度派？]
  - say: お風呂何度派か、それ聞く？ 私、43度のシャワー！
  - say: 熱くないと目が覚めないの。で、十分で出る。
  - say: 湯船は温泉に行ったときだけ。カラスの行水ってやつ。
  - chat: [同人誌即売会帰り, 自分は湯船。肩まで浸かる]
  - say: 即売会帰りは肩まで浸かる湯船派かあ。いいなあ。私ね、湯船だと五分で飽きちゃうの。
  - say: スマホ持ち込んでも、画面が曇って推しの顔が見えなくなるし。
  - chat: [晴海の生き残り, わしは45度]
  - say: {face: surprised, text: '45！？ 晴海、熱くないの？ 私、絶対入れないや。'}
  - chat: [晴海の生き残り, 江戸っ子だからな]
  - say: 江戸っ子だから？ 晴海、江戸っ子だったっけ？
  - chat: [晴海の生き残り, 気持ちは]
  - say: 気持ちは江戸っ子！
  - say: でね、お風呂でコールの練習もしてたら、前に隣から壁を叩かれたの。トンって。
  - say: 次の日、お菓子持って謝りに行ったの。そしたら隣の人もアイドルのファンでさ。
  - say: 別のグループのコールを教えてもらった！
  - chat: [緑ペンラ二年目, 仲良くなってる！]
  - say: 仲良くなった！ 今は小さい声で練習してる。お互いに。
- title: みんなは喋れる？
  beats:
  - chat: [解釈違いです, で、家で練習した文は本番で出たの？]
  - say: 練習した文、本番で出たかって？ 出ない！ そうなの、そこなんだよね。
  - say: お風呂だとすらすら言えるのに、ミナミの顔見たら全部消えるの。
  - say: ねえ、みんなはどう？ 好きな人の前で喋れる？
  - ask:
      q: 好きな人や推しの前で、ちゃんと喋れる？
      options:
      - c: 喋れる
        r:
        - '{name}は喋れる人！ すごい、尊敬する！'
        - コツあったら、あとでチャットに書いて。メモする！
      - c: 頭が真っ白になる
        r:
        - '{name}、仲間だ！ 真っ白組、こっちに集合！'
        - 真っ白になるくらい好きってことだからね。そういうことにしとこ！
      - c: 会いに行かない。見てるだけでいい
        r:
        - '{name}は見てる派。それもいいよね。'
        - 遠くから拍手してる人も、ステージからちゃんと見えてるんだって。
      npc:
      - [緑ペンラ二年目, 0]
      - [晴海の生き残り, 2]
      - [最後尾はこちら, 0]
      - [解釈違いです, 1]
      - [オハイオの字幕班, 1]
  - say: 喋れる人と、真っ白になる人が同じくらいだね！ 私は真っ白組！
  - chat: [解釈違いです, 真っ白。好きな作家さんの前で「新刊ください」しか言えない]
  - say: 「新刊ください」しか言えない、分かる！ 壁サークルの前のやつ！
  - chat: [初見の旅人, 壁サークル？]
  - say: 壁サークルは、即売会で、壁際に並ぶ大きいサークルのこと。人気だから長い列ができるの。
  - chat: [オハイオの字幕班, 私も声優さんのサイン会で Thank you しか言えなかった]
  - say: オハイオの字幕班まで、Thank you しか言えなかった！ 英語でも真っ白になるんだ！
  - chat: [オハイオの字幕班, 日本語の練習を一か月したのに]
  - say: {face: laugh, text: '日本語の練習を一か月！ 分かる！ 練習した人ほど言えないの！'}
- title: 長机の握手会
  beats:
  - say: でもね、こういう会って、最初はすごく小さかったんだよ。私の好きな話があるの。
  - say: AKB48の、いちばん最初の握手会。2005年の12月。
  - chat: [初見の旅人, 最初から大きかったんじゃないの？]
  - say: 最初から大きかった？ ぜんぜん！ 劇場ができて八日目でね、その日、機械が壊れて公演が中止になったの。
  - say: でも、ファンが何十人か来てたの。
  - say: そしたら会議用の長い机を並べて、急いで握手会をやったんだって。
  - chat: [晴海の生き残り, 来た人を帰さなかったのか]
  - say: 来た人を帰さなかったの！ 私この話ほんとに好き！
  - chat: [最後尾はこちら, はがしは？]
  - say: はがしは？って、いなかったんだって！ 最初のころは、はがしのバイトもいなかった。
  - chat: [最後尾はこちら, 数十人ならいらない]
  - say: 「数十人ならいらない」。プロの見立てが出た！
  - say: それが2009年には、500人くらいの会場に4000人以上来て、外に1キロの列。
  - chat: [最後尾はこちら, 1キロ。札十本と拡声器]
  - say: 1キロなら札十本と拡声器って、具体的！ 本物の答えだ！
  - chat: [ガチャ爆死太郎, ヴェスパと握手したい]
  - say: ガチャ爆死太郎、私と握手したい？ いいよ！ 握手は得意！ 握力45キロあるから！
  - chat: [ガチャ爆死太郎, 45キロで握らないでね]
  - say: {face: laugh, text: '45キロで握らないでって、加減するよ！ 毎週バイトで手を添えてるもん！ ……はがす方だけど！'}
- title: 画面の向こうで固まった
  beats:
  - chat: [緑ペンラ二年目, 先輩、オンラインのお話し会は行きました？]
  - say: オンラインのお話し会？ 行った。2021年に。会えない時期だったから、スマホで話す会になってたの。
  - chat: [初見の旅人, ビデオ通話みたいな？]
  - say: そう、ビデオ通話みたいなの。一人ずつ順番に、画面の向こうのミナミと話すの。
  - say: 画面越しなら言えると思ったんだよね。家だし、緊張しないと思って。
  - chat: [最後尾はこちら, で？]
  - say: で？って……「おつかれさまです」って言った瞬間に、うちのWi-Fiが止まった。
  - say: 私の顔、「おつかれさまです」の口のまま、三十秒止まってたの！
  - chat: [緑ペンラ二年目, ミナミちゃん覚えてるかもしれません]
  - say: {face: flustered, text: 'ミナミが覚えてるかも！？ 覚えてないで！ 止まった顔は忘れて！'}
  - chat: [オハイオの字幕班, 韓国にも似たのがある。ヨントン]
  - say: 韓国のヨントン、聞いたことある！ ビデオ通話のサイン会でしょ？
  - chat: [オハイオの字幕班, 一人一分か二分。アルバムを買って抽選]
  - chat: [オハイオの字幕班, 妹は四十枚買って一回当たった]
  - say: 一人一分か二分で、妹さんは四十枚買って一回！？ 二分のために！
  - say: 枚数で比べる仕組みは、正直ちょっと苦手なんだけどね。好きな人は否定しないよ。
  - say: でも二分しゃべる妹さんのこと考えたら、応援しちゃうな。
  - chat: [オハイオの字幕班, 二分ずっと泣いてたらしい]
  - say: 二分ずっと泣いてた、分かる！ 私なら二分ずっと「おつかれさまです」！
- title: 九秒の文
  beats:
  - chat: [解釈違いです, 九年練習した文があるなら、今声に出して]
  - say: 九年練習した文を、今！？ 配信で！？
  - chat: [晴海の生き残り, 言え]
  - chat: [最後尾はこちら, 計る]
  - say: 晴海は「言え」、最後尾は「計る」って。計らないで！ いや、やっぱり計って。
  - say: 「ミナミ、2018年に『黄緑も緑の親戚だよ』って言ってくれてありがとう。あれからずっと緑を振ってます」
  - chat: [最後尾はこちら, 九秒]
  - say: 九秒だった！？ 三十秒もいらないじゃん！
  - chat: [初見の旅人, 黄緑って？]
  - say: 黄緑っていうのは、ミナミの色ね。昔は緑だったのに、2018年に急に黄緑に変わったの。
  - say: で、緑を振ってた私たちに、ステージから「黄緑も緑の親戚だよ」って言ってくれたの。
  - say: 刺繍入れたばっかりの法被、無駄にならなかったんだよ。
  - chat: [緑ペンラ二年目, 先輩、泣きそうです]
  - say: {face: shy, text: '泣きそう？ 泣かないで二年目！ 私も泣きそうになるから！'}
  - say: でも本番だと、この九秒が出てこないの。だから最初の一言だけ、みんなで決めて！
  - ask:
      q: 次のチェキ会、最初の一言はどれにする？
      options:
      - c: 「緑の親戚」のお礼
        r:
        - '{name}、九年分のやつだ！'
        - 分かった、最初に言う。言えなかったら二枚目で言う！ あ、二枚買う前提になってる！
      - c: 「いつもありがとう」だけ
        r:
        - '「いつもありがとう」だけ、ね！'
        - '{name}は短く派！ 短いのなら言えそう！'
        - おつかれさまですの次くらいには、口が覚えてるかもしれない。
      - c: 「おつかれさまです」でいい
        r:
        - '{name}、それはずるい！'
        - でもそうだよね。おつかれさまですも、ちゃんと届いてたんだもんね。ちょっと楽になった！
      npc:
      - [緑ペンラ二年目, 0]
      - [解釈違いです, 0]
      - [晴海の生き残り, 1]
      - [最後尾はこちら, 2]
      - [オハイオの字幕班, 0]
  - say: 「緑の親戚」のお礼が多いね！ 九年分のやつ、みんな言えって！
  - chat: [最後尾はこちら, おつかれさまですに一票]
  - say: 最後尾はこちら、おつかれさまですに一票。絶対そこだと思った！
- title: おしまい
  beats:
  - say: よし、次のチェキ会は今週の土曜。最初の一言は九年分のやつ！
  - chat: [最後尾はこちら, 土曜はバイト。はがしは別の人]
  - say: 土曜はバイトで、はがしは別の人？ よかった！ 最後尾はこちらにはがされたら、絶対笑っちゃう。
  - chat: [同人誌即売会帰り, 前の日のお風呂で練習して]
  - say: 前の日のお風呂で練習、する！ 43度で！ 小さい声で！
  - chat: [晴海の生き残り, 言えたら報告しろ]
  - say: 言えたら報告？ する！ 次の配信の最初に言う！
  - chat: [晴海の生き残り, 言えなかったら？]
  - say: 言えなかったら？ それも最初に言う！
  - say: みんな、今日も来てくれてありがとう！ おつかれさまでした！
  - chat: [緑ペンラ二年目, 言えてる！]
  - say: {face: laugh, text: '「言えてる！」って、ここだと言えるの！ じゃあね！'}
