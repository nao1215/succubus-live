category: factions
name: 派閥ができる論争（ネットで何度も燃える定番）
# ユーザー「ネットで論争とか調べると派閥ができて面白い。PC派とか」。
# X、5ch、Togetter、知恵袋、まとめ、Reddit で毎年のように蒸し返される定番。why は燃える理由、sides は各派閥のよく見る言い分・ミーム。
# 6人の所属は src/bible/likes/_factions.yaml（共闘する二人、いじり合う二人）。出典は src/sources/common-topics.md。
# 回で使うときは、正しさを決めない。派閥同士のいじり合いとチャットの参戦で遊ぶ。
topics:
# ── 食べ物
- id: fac_kinoko_takenoko
  q: きのこの山とたけのこの里、どっち派？
  options: [きのこの山, たけのこの里, すぎのこ村]
  why: 明治の二つの菓子。明治自身が「国民総選挙」を何度も開き、公式が対立を煽るので毎回燃える。2001年と2018年（たけのこ約693万票、きのこ約676万票）はたけのこが勝ち、2019年にきのこが約602万票対457万票で初勝利して「ノーサイド協定」が結ばれた。負けた側は「組織票」と言う。
  sides:
    きのこの山: クラッカーのサクッと感、チョコとクラッカーを別々に食べられる、持つ所がある。「たけのこは数で勝ってるだけ」。
    たけのこの里: クッキーとチョコが一体でチョコが多い、しっとり。「勝ってるのはおいしいから」。
    すぎのこ村: 第三勢力として名前を出すと両方から「誰？」と言われる（1987年発売、1年ほどで消えた姉妹品）。
- id: fac_karaage_lemon
  q: 唐揚げにレモン、かける？ かけない？
  options: [かける, かけない, 自分の皿だけ]
  why: 大皿で出てくる唐揚げに、聞かずに全部かける人がいるから。味の好みより「聞いてからかけろ」のマナーの話になって燃える。ウェザーニュースの1.3万人の調査でも、かける派とかけない派はほぼ半々。
  sides:
    かける: さっぱりする、油っぽさが消える、居酒屋がレモンを添えているんだからかけるもの。
    かけない: 衣がしなしなになる、レモン味になる。「勝手にかけるのは戦争」。
    自分の皿だけ: 取り分けてから各自で絞る、が平和条約。「レモンを絞る前に聞いて」。
- id: fac_medamayaki
  q: 目玉焼きに何をかける？
  options: [醤油, ソース, 塩こしょう, ケチャップ, マヨネーズ, 何もかけない]
  why: 家庭ごとの当たり前が違い、他の家の答えを聞いて初めて驚く。地方差もあると言われ、調査記事が毎年出る。LINEの2020年の調査（5256人）では8地域のうち7地域で醤油が1位、近畿だけ塩こしょうが僅差で1位。
  sides:
    醤油: ご飯に合う、白身の焦げに醤油。
    ソース: 関西はソースと言われがちだが、調査では近畿の1位は塩こしょう。黄身とソースが合う。
    塩こしょう: 卵の味が分かる。「大人は塩こしょう」。
    ケチャップ・マヨネーズ: 子どもの頃からこれ。言うとだいたい驚かれる。
- id: fac_anko
  q: つぶあん派？ こしあん派？
  options: [つぶあん, こしあん]
  why: 好みがはっきり分かれ、まんじゅう・たい焼き・おはぎのたびに蒸し返す。アンパンマンの中身はどっちか（つぶあんと紹介されることが多い）、まで話が広がる。All Aboutの1000人調査（あんパン）でもこしあん53.9%、つぶあん46.1%とほぼ互角。
  sides:
    つぶあん: 小豆の皮の食感、豆を食べている感じ。
    こしあん: 舌ざわりがなめらか、上品、手間がかかっている。「皮が歯に挟まるのが嫌」。
- id: fac_subuta_pine
  q: 酢豚にパイナップルはあり？ なし？
  options: [あり, なし]
  why: 甘いおかずとフルーツの組み合わせに強い拒否感を持つ人がいて、ポテトサラダのりんご、ピザのパイナップル（海外のハワイアンピザ論争。2017年にアイスランド大統領が「できるなら禁止したい」と言って騒ぎになった）と一緒に語られる。
  sides:
    あり: 肉がやわらかくなる、甘酸っぱさが合う、口直し。
    なし: 温かい果物が許せない、おかずに果物を入れるな。「パイナップルだけよける」。
- id: fac_curry_spicy
  q: カレーは甘口？ 中辛？ 辛口？
  options: [甘口, 中辛, 辛口]
  why: 家族で鍋が一つなので、誰に合わせるかで毎回もめる。辛口を名乗るのが大人の証のようになり、甘口派がからかわれる。2018年のプラネットの調査では中辛48.8%、辛口36.3%。
  sides:
    甘口: 味が分かる、子どもと同じ鍋にできる。「辛さは味じゃなくて痛み」。
    中辛: 家族の平和の妥協点。
    辛口: 甘口は子ども。辛くないとカレーじゃない。
- id: fac_ramen_hardness
  q: ラーメンの麺の硬さは？
  options: [バリカタ, カタ, 普通, やわめ]
  why: 豚骨ラーメンの店や家系の「お好み」で注文の作法がある。硬めが通という空気が反発を呼び、「普通が店の味」論が出る。All Aboutの2022年の500人調査では「ふつう」47.2%、硬め系の合計48.6%で真っ二つ。
  sides:
    バリカタ・カタ: 伸びる前に食べ切れる、替え玉前提。「やわめは素人」。
    普通: 店主がいちばんおいしいと思う硬さ。「通ぶるな」。
    やわめ: スープを吸った麺が好き。言うと笑われるので小声で頼む。
- id: fac_nikuman
  q: 肉まん？ 豚まん？ 呼び方はどっち？
  options: [肉まん, 豚まん]
  why: 関西では「肉」が牛肉を指すので豚まん、と言われる。551蓬莱の豚まんも有名。ウォーカープラスの調査では全国は肉まん68%・豚まん31%だが、近畿は67%が豚まん。呼び方の東西論争の代表。
  sides:
    肉まん: 全国のコンビニの表示がこれ。「中身が肉なら肉まん」。
    豚まん: 関西で肉と言えば牛。「豚なのに肉まんはおかしい」。
- id: fac_mac_name
  q: マクドナルドの略は「マック」？ 「マクド」？
  options: [マック, マクド]
  why: 東のマック、西のマクド。呼び方の東西論争で必ず最初に出る。Jタウン研究所の投票（2015〜16年、2033票）では三重県が境目で、四国はほぼ半々。
  sides:
    マック: 短い、全国区。「マクドは言いにくい」。
    マクド: 関西の当たり前。「マックはパソコン」。
- id: fac_hiyashi_chuka
  q: 冷やし中華に何をかける？ マヨネーズは？
  options: [そのまま, マヨネーズ, からし]
  why: 東海地方ではマヨネーズを添えるのが普通と言われ、他の地方の人が驚く。愛知のスガキヤが冷やしラーメンにマヨネーズを添えたのが始まりという説が有名。地方の当たり前のずれで燃える。
  sides:
    そのまま: 酢醤油のタレで完成している。
    マヨネーズ: 東海では当たり前。まろやかになる。「かけないのが信じられない」。
    からし: 皿の端にからし、が昔の店の作法。
- id: fac_potato_size
  q: マックのポテトはSかMかLか。揚げたてを頼む？
  options: [S, M, L, ポテトは頼まない]
  why: 「S2個の方がLより得」「Lは冷める」といった都市伝説めいた比較が毎年流れる（公式の重さはS74g・L170gで、重さあたりの値段は実はLが安い）。全サイズ150円（2016〜18年ごろ）やM・L250円（2024年〜）のセールのたびに再燃。
  sides:
    S: 熱いうちに食べ切れる。量の割に得という説を信じている。
    M: 普通。考えたことがない。
    L: 一人で抱えるのが幸せ。「冷めても食べる」。
- id: fac_sweet_tamagoyaki
  q: 卵焼きは甘い？ しょっぱい（だし巻き）？
  options: [甘い, しょっぱい・だし巻き]
  why: 家のお弁当の味がそのまま正義になる。関東の砂糖、関西のだし、と言われ、結婚すると家庭内で燃える。Jタウン研究所の投票では「しょっぱい」が多数だったのは大阪と兵庫だけで、それも僅差。
  sides:
    甘い: お弁当の味、子どもの頃の味。
    しょっぱい・だし巻き: おかずなんだから甘いのはおかしい。「甘いのはお菓子」。
- id: fac_sushi_order
  q: 寿司は醤油をネタにつける？ シャリにつける？ 最初に何を頼む？
  options: [ネタにつける, シャリにつける, 気にしない]
  why: 「通の食べ方」を語る人と「好きに食べさせて」の人がぶつかる。テレビやネットの寿司の作法の記事が毎回燃える。
  sides:
    ネタにつける: シャリが崩れない、醤油を吸いすぎない。
    シャリにつける: 崩れても気にしない。「作法の押しつけが嫌」。
    気にしない: 回転寿司で作法を言う方が無粋。
- id: fac_natto_mix
  q: 納豆はタレを入れる前に混ぜる？ 後に混ぜる？
  options: [前に混ぜる, 後に混ぜる]
  why: 北大路魯山人が「何も加えずに練るほどうまい」と書いた話（よく言われる「424回」は後から付いた説）や、タレの前に混ぜると粘りが出るという説で、回数まで含めて言い合いになる。
  sides:
    前に混ぜる: 粘りがふわふわになる。
    後に混ぜる: 面倒。タレと一緒で十分。
# ── 生活
- id: fac_toilet_paper
  q: トイレットペーパーの向きは、紙が手前（外）に垂れる？ 奥（壁側）に垂れる？
  options: [手前に垂れる, 奥に垂れる, どっちでもいい]
  why: 海外では over/under 論争として有名で、1891年のセス・ウィーラーの特許の図面（手前に垂れている）が2015年に拡散したほどの定番。米国の人生相談コラム（アン・ランダーズ）では1977年にこの話題で約1万5千通の手紙が来た。調査ではおおむね7割が手前派。家族やシェアハウスで直し合う。
  sides:
    手前に垂れる: 端がつかみやすい。特許の図がそうなっていると言う人がいる。
    奥に垂れる: 見た目がすっきり、猫や子どもに転がされない。
    どっちでもいい: 直す人がいることに驚く。
- id: fac_escalator
  q: エスカレーターはどっちに立つ？ 歩く？
  options: [左に立つ, 右に立つ, 歩かない（両側に立つ）]
  why: 東京は左、大阪は右に立つと言われる。鉄道会社や自治体が「歩かないで」と呼びかけ、埼玉県（2021年10月1日施行）や名古屋市（2023年10月1日施行）は「立ち止まって乗る」条例まで作った（罰則なし）が、急ぐ人とぶつかり毎年燃える。
  sides:
    左に立つ: 東京の当たり前。右は急ぐ人のため。
    右に立つ: 関西の当たり前。
    歩かない: 本来は危ない、二列で立てば輸送量も上がる、の説。急ぐ人からは嫌がられる。
- id: fac_wari_kan
  q: 割り勘派？ 奢る・奢られる派？
  options: [きっちり割り勘, 多く払う側, 奢られたい, 飲んだ分だけ]
  why: デート代、先輩と後輩、飲まない人の負担で、毎年 X で「奢り奢られ論争」が燃える。
  sides:
    きっちり割り勘: 対等が気楽、貸し借りなし。
    多く払う側: 年上・誘った方が払う。
    飲んだ分だけ: 飲まない人が損する割り勘の方が不公平。
- id: fac_bath_order
  q: お風呂は体から洗う？ 頭から洗う？
  options: [頭から, 体から, 顔から]
  why: 誰も迷わず答えるのに、答えが割れると驚く定番。汚れが上から落ちるから頭から、という理屈が出る。
  sides:
    頭から: 泡が上から流れて体もついでに洗える。
    体から: 冷えないうちに体を、髪は最後にトリートメントを置く。
- id: fac_towel
  q: バスタオルは毎回洗う？ 何回か使う？
  options: [毎回洗う, 数回使う]
  why: 「体を拭いたあとはきれいだから洗わない」派と「雑菌」派の言い合い。洗濯物の量の話と混ざる。
  sides:
    毎回洗う: 湿ったまま置くと臭う。
    数回使う: 体はきれいになったあと。フェイスタオルで十分という人も。
- id: fac_sock_color
  q: 靴下の色はそろえる？ 何色？
  options: [全部同じ黒, 色や柄を楽しむ, 白]
  why: 片方なくなる問題の解決策として「全部同じ靴下」がバズる一方、白い靴下はダサいかどうか、スーツに白はありか、が燃える。
  sides:
    全部同じ黒: 片方なくしても困らない、ペアを探す時間がゼロ。
    色や柄: 足元くらい楽しみたい。
    白: 清潔感、学生の頃の名残。「スーツに白は論外」と言われる。
- id: fac_miso_soup_place
  q: 食卓のご飯と味噌汁、どっちが左？
  options: [ご飯が左, 味噌汁が左, 気にしない]
  why: 和食の配膳は「ご飯が左、汁物が右」が基本とされるが、知らない家・気にしない家が多く、SNS で正解が回るたびに燃える。大阪には味噌汁を左奥に置く配置もあると言われ、「どっちが正解か」がさらにややこしくなる。
  sides:
    ご飯が左: 作法。左が上座、主食は左。
    気にしない: 利き手で取りやすい方でいい。
- id: fac_heating
  q: 家の暖房はエアコン？ こたつ？ 石油ストーブ？
  options: [エアコン, こたつ, 石油ストーブ, ガスファンヒーター, 我慢]
  why: 電気代の値上がりのたびに「何がいちばん安いか」の比較が出回り、寒冷地と都会の常識の違いで燃える。
  sides:
    エアコン: 部屋全体が暖まる、灯油を買いに行かなくていい。
    こたつ: 安い、出られなくなる幸せ。
    石油ストーブ: 寒冷地の常識、上でやかんやお餅。
# ── 機械とネット
- id: fac_pc_phone
  q: ネットやゲームはPC派？ スマホ派？
  options: [PC, スマホ, タブレット]
  why: 総務省の調査でネットに使う機器はスマホ（54.2%）が2017年に初めてPC（48.7%）を上回った。若い人ほどスマホだけでPCを持たない、という話題が出るたびに「PCがないと何もできない」「スマホで足りる」で割れる。ゲームでも PC ゲーマーと家庭用機・スマホ勢がいじり合う。
  sides:
    PC: 画面が大きい、キーボード、仕事も作業も全部できる。「スマホで長文を打つのは修行」。
    スマホ: どこでもできる、PCは起動が面倒。「PC持ってなくても困らない」。
- id: fac_iphone_android
  q: iPhone 派？ Android 派？
  options: [iPhone, Android]
  why: 日本は世界的に見て iPhone の比率が高い国で（MMD研究所の2025年9月の調査で iPhone 48.3%・Android 51.4%とほぼ半々、10〜20代女性では iPhone が多い）、学生の間では「Android だと LINE やAirDropで浮く」という話まで出る。Android 派は自由さと値段で言い返す。
  sides:
    iPhone: 周りがみんな使っている、AirDrop、長く使える、売るとき高い。
    Android: 安い、自由、ファイルが扱いやすい、機種を選べる。「林檎信者」と言い返す。
- id: fac_win_mac
  q: パソコンは Windows 派？ Mac 派？ Linux 派？
  options: [Windows, Mac, Linux]
  why: スタバで MacBook を開く人のいじり（「ドヤリング」）、仕事のソフトは Windows、開発者は Mac か Linux、で毎回割れる。
  sides:
    Windows: 会社もゲームも Windows、安い、自作できる。
    Mac: きれい、壊れにくい、iPhone とつながる。
    Linux: 自由。言うと「また始まった」と言われる。
- id: fac_ps_switch
  q: ゲーム機は PlayStation 派？ Switch 派？ Xbox？ PC？
  options: [PlayStation, Nintendo Switch, Xbox, PC]
  why: 昔からのハード戦争（ソニー派を「ゴキ」、任天堂派を「妊娠」、Xbox派を「痴漢」と呼ぶ5chゲハ板の蔑称まであった）。独占のソフトと値段のたびに燃える。
  sides:
    PlayStation: グラフィック、大作。
    Switch: 家族で遊べる、携帯もできる、任天堂のソフト。
    PC: 一番性能がいい、Steam のセール。「PC 版待ち」。
- id: fac_tab_space
  q: インデントはタブ？ スペース？
  options: [タブ, スペース]
  why: プログラマーの宗教戦争の代表。ドラマ『シリコンバレー』（2016年、シーズン3第6話）でタブ派の主人公がスペース派の恋人と別れる場面まで作られた。2017年の Stack Overflow の調査の分析でスペース派の方が年収が約8.6%高いという結果が出て、また燃えた（分析者自身「相関にすぎない」と注記）。
  sides:
    タブ: 幅を人それぞれに設定できる、一文字で済む。
    スペース: どの環境でも同じに見える。言語の規約（Python の PEP 8 など）がスペース。
- id: fac_vim_emacs
  q: エディタは vim？ emacs？ VS Code？
  options: [vim, emacs, VS Code, その他]
  why: 1980年代から続く「エディタ戦争」。「vim の終わり方が分からない」ミームが定番（Stack Overflow の「Vim の終わり方」の質問は2017年に100万人が見たと公式ブログが発表）。今は VS Code が多数派で、古い派閥同士が懐かしく殴り合う。
  sides:
    vim: 手がホームポジションから動かない、どのサーバにもある。
    emacs: エディタというより OS。
    VS Code: 拡張が便利、最初から使える。「宗教戦争はもう終わった」。
- id: fac_dark_light_mode
  q: 画面はダークモード？ ライトモード？
  options: [ダーク, ライト]
  why: 目にやさしいのはどっちか、で調査や記事が分かれ、プログラマーの「ダークモードじゃないと人権がない」ミームも出る。
  sides:
    ダーク: 夜に目が楽、電池が持つ（有機ELなら）、かっこいい。
    ライト: 明るい場所で読みやすい、紙に近い。
- id: fac_line_reply
  q: LINE の既読スルーは失礼？ 気にしない？
  options: [失礼, 気にしない, 未読スルーの方が失礼]
  why: 既読が付く仕組みのせいで「読んだのに返さない」が見える。返信の速さの価値観で恋人・友達・グループで燃える。
  sides:
    失礼: 読んだなら一言でも返して。
    気にしない: 返すことがないから返さないだけ。
- id: fac_ebook
  q: 本は紙？ 電子書籍？
  options: [紙, 電子書籍, 両方]
  why: 紙のにおい・所有感と、場所を取らない便利さ。漫画の電子化、本屋の閉店の話とからんで燃える。
  sides:
    紙: 手触り、本棚に並べる喜び、貸し借りができる。
    電子書籍: 場所を取らない、夜中に買える、持ち歩ける。「部屋の床が抜ける」。
# ── 分野別（ゲーム・音楽・オタク・家庭・お金）
- id: fac_shibari
  q: ゲームの縛りプレイや攻略を見ない遊び方は正義？ 攻略は見ていい？
  options: [初見は攻略を見ない, すぐ攻略を見る, 縛りで遊ぶ]
  why: 「攻略を見るのはずる」「時間がもったいない」の価値観の違い。配信者に指示を書き込む「指示厨」の問題と一緒に燃える。
  sides:
    初見は見ない: 自分で発見する楽しみを奪われたくない。
    すぐ見る: 大人は時間がない。詰まったら見る。
    縛り: 遊び尽くした後の自分ルール。
- id: fac_difficulty
  q: ゲームの難易度は「やさしい」を選ぶ？ 高難度が正義？
  options: [やさしいで遊ぶ, ふつう, 高難度]
  why: 死にゲーに簡単モードを入れるべきかの論争が繰り返し起きる（2019年の『SEKIRO』では海外で大論争になった）。「簡単モードで遊ぶのは恥ずかしくない」派と「作り手の意図」派。
  sides:
    やさしい: 話を見たい、疲れている。
    高難度: 苦労して勝つのがゲーム。「イージーは別のゲーム」。
- id: fac_music_sub
  q: 音楽はサブスク？ CDやレコードで持つ？
  options: [サブスク, CD・レコード, 両方]
  why: サブスクの配分がアーティストに少ない話、レコードの再ブーム、「アルバムを一枚通して聴かなくなった」話で燃える。
  sides:
    サブスク: 何でも聴ける、安い、発見がある。
    CD・レコード: 持っている安心、音、ジャケット、配信が消える心配がない。
- id: fac_live_phone
  q: ライブでスマホを掲げて撮る？ 撮らない？
  options: [撮る, 撮らない]
  why: 撮影可のライブが増えて、前の人のスマホで見えない問題が起きる。「目で見ろ」派と「思い出を残したい」派。
  sides:
    撮る: 許可されている、後で見返したい、推しのため。
    撮らない: 目に焼き付けたい、後ろの人の迷惑。
- id: fac_oshi_hako
  q: 推しは一人（単推し）？ 箱推し？ 同担拒否？
  options: [単推し, 箱推し, 同担拒否, DD（誰でも大好き）]
  why: 同じ人を推すファン同士の距離感の問題。「同担拒否」を公言する人がいて、それ自体が燃える。
  sides:
    単推し: 一人に全部を注ぐ。
    箱推し: グループ全体の関係が好き。
    同担拒否: 同じ推しのファンと関わりたくない。言うと怖がられる。
    DD: 誰でも好き。「浮気者」と言われる。
- id: fac_anime_original
  q: 原作を先に読む派？ アニメから入る派？
  options: [原作が先, アニメが先, 気にしない]
  why: アニメ化の改変、「原作読んでないにわか」のマウントで燃える。実写化の話になるとさらに燃える。
  sides:
    原作が先: 作者の意図をそのまま受け取りたい。
    アニメが先: 声と動きで好きになって原作に行く。「にわか」と言われても気にしない。
- id: fac_spoiler
  q: ネタバレは許せる？ 許せない？
  options: [絶対だめ, 平気, 先に知りたい]
  why: 映画の公開直後や漫画の早バレで毎回燃える。研究（2011年、カリフォルニア大学サンディエゴ校。短編小説で、ネタバレを先に読んだ人の方が楽しめた）で「ネタバレされても楽しめる」という結果が紹介されると、それもまた燃える。
  sides:
    絶対だめ: 初見の驚きは一回しかない。
    平気・先に知りたい: 安心して見られる、どう描くかを見る。
- id: fac_kaji
  q: 家事は「手伝う」？ 「やる」？ 分担は半々？
  options: [半々にする, 得意な方がやる, 手伝うでいい]
  why: 「手伝う」という言葉が持ち主を決めつける、という指摘がバズり、毎年のように燃える。「名もなき家事」の一覧も回る（2017年の大和ハウスの調査で、夫は分担を「夫3割・妻7割」、妻は「夫1割・妻9割」と答えたのが話題になった）。
  sides:
    半々: 二人の家なんだから二人の仕事。
    得意な方: 平等より回る方がいい。
    手伝う: 言い方が気になる人の方が細かい、という反論。
- id: fac_cash_cashless
  q: 現金派？ キャッシュレス派？
  options: [現金, キャッシュレス]
  why: 「現金のみ」の店、レジで小銭を数える人、ポイント還元、災害時の停電で、毎回燃える。
  sides:
    現金: 使いすぎない、停電でも使える、手数料を店に払わせない。
    キャッシュレス: 速い、ポイント、記録が残る。「小銭は重い」。
- id: fac_morning_night
  q: 朝型？ 夜型？
  options: [朝型, 夜型]
  why: 「朝活」「早起きは成功者の習慣」の自己啓発と、夜型の人の反発。体質の研究（東京医大の約8000人の分析で、夜型の人の早起きは仕事の効率の低下と関連）も持ち出されて言い合いになる。
  sides:
    朝型: 頭が冴える、一日が長い。
    夜型: 静か、集中できる、朝は人間じゃない。
- id: fac_dog_cat
  q: 犬派？ 猫派？
  options: [犬, 猫, どっちも]
  why: 永遠の二択。猫の日（2月22日）・犬の日（11月1日）のたびに写真合戦になる。ペットフード協会の推計では飼われている数は猫が犬を上回っている（2022年は犬約705万頭、猫約884万頭）。
  sides:
    犬: 呼べば来る、一緒に散歩、忠実。
    猫: 気まぐれがいい、散歩がいらない、ツンデレ。
- id: fac_punctual
  q: 待ち合わせの「5分前行動」は当たり前？
  options: [5分前に着く, 時間ちょうど, 少し遅れる]
  why: 日本の時間感覚の厳しさの話。「5分前は遅刻」の部活の常識と、早く来られると困る派で割れる。マイナビの2016年の調査（605人）では、5分以上早く来るのをマナー違反と思う人は23.5%。
  sides:
    5分前: 社会人の常識、遅れるより待つ方が気楽。
    ちょうど: 早く来られると相手に気を遣わせる。
- id: fac_umbrella_rain
  q: 少しの雨なら傘をささない？
  options: [すぐさす, 少しならささない]
  why: 海外の人は傘をささない、日本人は小雨でもさす、という比較がバズる。ビニール傘の大量消費の話（日本の傘は年1.2〜1.3億本、うち約8000万本がビニール傘と言われる）と混ざる。
  sides:
    すぐさす: 濡れるのが嫌、髪が崩れる。
    ささない: 小雨くらいで荷物を増やしたくない。
# ── 2026-10-27 追加（調べて見つかった定番）
- id: fac_zoni
  q: お雑煮は角餅？ 丸餅？ すまし汁？ 白味噌？
  options: [角餅のすまし, 丸餅の白味噌, 丸餅のすまし, あん餅（香川）]
  why: 正月のたびに出身地の当たり前がぶつかる。糸魚川静岡構造線あたりから西は丸餅、東は角餅、東はすまし・西は味噌の傾向と言われる。香川の白味噌にあんこ餅は、四国新聞のアンケートで52%。
  sides:
    角餅のすまし: 関東の当たり前。焼いた角餅が香ばしい。
    丸餅の白味噌: 京都・関西の正月。甘い白味噌がごちそう。
    あん餅: 香川。言うと全国から「お菓子？」と言われるが、地元では普通。
- id: fac_milk_tea
  q: ミルクティーはミルクが先？ 紅茶が先？
  options: [ミルクが先, 紅茶が先, ミルクは入れない]
  why: イギリスの古い定番。ジョージ・オーウェルが1946年の随筆『一杯のおいしい紅茶』で「最も論争の多い点」と書き、自分は紅茶が先派だった。
  sides:
    ミルクが先: カップが割れない、混ざりやすい、という昔からの言い分。
    紅茶が先: 濃さを見ながらミルクの量を決められる（オーウェル）。
- id: fac_onigiri_name
  q: 「おにぎり」？ 「おむすび」？
  options: [おにぎり, おむすび]
  why: 呼び方の地域差の定番。2013年の調査では全国はおにぎり89%だが、山口（45%）や広島（38%）はおむすびが多め。コンビニの表示でも割れる。
  sides:
    おにぎり: 全国の多数派、コンビニの棚。
    おむすび: 丁寧、昔話の「おむすびころりん」。
- id: fac_gif
  q: GIF は「ジフ」？ 「ギフ」？
  options: [ジフ, ギフ]
  why: 作者のスティーブ・ウィルハイトが2013年に「ジフ」と宣言したが、同じ年の3万人超の投票では7割が「ギフ」。2014年にオバマ大統領も「ギフ」と言った。
  sides:
    ジフ: 作った人がそう言っている。
    ギフ: Graphics の G は硬い g。みんなギフと言っている。
- id: fac_potesara
  q: ポテトサラダはお惣菜で十分？ 手作りしたい？
  options: [惣菜で十分, 手作りしたい]
  why: 2020年夏、スーパーで「母親ならポテトサラダくらい作ったらどうだ」と言われたという投稿が拡散し、惣菜で済ませることと母親像の押しつけで大論争になった。
  sides:
    惣菜で十分: 手間の割に安い、プロの味、人に言われる筋合いはない。
    手作りしたい: 家の味がある、具を自分で決めたい（ただし他人に強いない）。
- id: fac_dress_color
  q: 2015年に流行った「あのドレス」、青と黒に見えた？ 白と金に見えた？
  options: [青と黒, 白と金]
  why: 2015年2月に Tumblr から世界に広まった写真。BuzzFeed の投票では3分の2超が白と金、Current Biology の1400人の調査では青と黒57%・白と金30%。実物は青と黒。見え方の違いで家族や職場が割れた。
  sides:
    青と黒: 実物の色。「白と金に見える人の目はどうなってるの」。
    白と金: 影の中にあると脳が補正するから、という説。「何度見ても白と金」。
