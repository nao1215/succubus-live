# 共通の雑談の話題（全員に聞ける身近な問い）。2026-10-27。
# ユーザーの言葉：「全員に共通のトピックがあったほうがいい。例えば、好きなお菓子とか、きのこたけのこのどちらがいいかとか、好きなコーヒー屋さんとか。
#   ずっと一つのトピックを話すのは怖いし、人間味が欲しい」「お風呂は42度ぐらいとか」「ネットで論争とか調べると派閥ができて面白い」「スマホはどれとか」
#   「話題が60で済むはずがない。500ぐらいいけそう」。
#
# 使い方（src/WRITERS.md「喋り方と会話」）：各回に1〜2個を混ぜる。本題にせず、挨拶・チャットの振り・脱線から入る。
#   答えは各人の src/bible/likes/<id>.yaml に一行ずつ決めてある（回によって変えない）。エピソード（stories:）は持ちネタとして一回ずつ使う。
#   ほかの配信者の答えに触れてよい（派閥の組み合わせは likes/_factions.yaml）。
#
# 形：
#   id: 分類の接頭辞_名前（全分類で一意）。likes の鍵になる。
#   q: 問い（チャットがそのまま書き込める言い方）。
#   options: 選ぶ問いの選択肢（無ければ自由に答える問い）。
#   why / sides: 派閥ができる論争だけ。燃える理由と、各派閥のネットでよく見る言い分。出典は src/sources/common-topics.md。
#   era: 時代が出る問い（1980〜2026）。年代で答えが変わることを台詞に生かす。
files:
  - food.yaml          # 食べ物（好物・定番・食べ方）
  - sweets.yaml        # お菓子・スイーツ・アイス
  - drinks.yaml        # 飲み物・お酒
  - chains.yaml        # お店・チェーン（コンビニ・ファストフード・ファミレス・カフェ・スーパー）
  - cooking.yaml       # 家のご飯と料理
  - morning.yaml       # 朝と身支度の習慣
  - bath_sleep.yaml    # お風呂と寝る
  - seasons.yaml       # 季節と天気と行事
  - home.yaml          # 家と家電・掃除・洗濯
  - money.yaml         # お金と買い物
  - travel.yaml        # 移動と旅行
  - school.yaml        # 学生時代
  - childhood.yaml     # 子どもの頃
  - net.yaml           # スマホの使い方・ネット・SNS
  - gear.yaml          # 持ち物の機種・銘柄（スマホ・PC・イヤホン・家電・財布・キャリア）
  - media.yaml         # テレビ・ラジオ・映画・本・音楽の聴き方
  - health.yaml        # 体と健康
  - people.yaml        # 人付き合い・恋愛（軽く）
  - work.yaml          # 仕事とバイト
  - factions.yaml      # 派閥ができる論争（ネットで何度も燃える定番。分野別）
  - versus.yaml        # 究極の二択（軽い方）
  - eras.yaml          # 時代の話（ポケベル・ガラケー・プリクラ・Wi-Fi…）
  - records.yaml       # 「最後に〇〇したのいつ」「人生で一番〇〇」
  - qbox.yaml          # 質問箱・マシュマロの定番（もしも・自分のこと）
