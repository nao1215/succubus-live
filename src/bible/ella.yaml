    - t: ビヨンセ『BEYONCÉ』（2013年12月13日）は予告なしに一斉に出した。
      src: https://en.wikipedia.org/wiki/Beyonc%C3%A9_(album)
    - t: ダフト・パンク『Random Access Memories』（2013）がグラミーの最優秀アルバム。
      src: https://en.wikipedia.org/wiki/Random_Access_Memories
    - t: 『ブラード・ラインズ』裁判（2015）で、マーヴィン・ゲイの遺族が勝訴（約740万ドルの評決、のち減額）。曲の「感じ」が侵害とされうるかの議論。
      src: https://en.wikipedia.org/wiki/Pharrell_Williams_v._Bridgeport_Music
    - t: リル・ナズ・X『Old Town Road』（2019）はTikTokの「Yeehaw Challenge」で広まり、カントリー・チャートから「今のカントリーの要素が足りない」と外され、ビリー・レイ・サイラスとの版で全米19週連続1位。ビートはナイン・インチ・ネイルズの『34 Ghosts IV』を使ったもので、30ドルで買った。
      src: https://en.wikipedia.org/wiki/Old_Town_Road
    - t: メタリカ・スレイヤー・メガデス・アンスラックスは2010年6月22日にソフィアで同じ舞台。BABYMETALは2016年4月2日にウェンブリー・アリーナ。
      src: https://blabbermouth.net/news/metallica-slayer-megadeth-and-anthrax-perform-am-i-evil-in-sofia-with-video-photos
  最近（2024〜2026年）:
    - t: 2024年6月、RIAAが主要レーベルを代表してSunoとUdioを提訴。2025年10〜11月にユニバーサルとワーナーがUdioと、ワーナーがSunoと和解し、許諾つきのサービスへ。ソニーなどの訴えは続く。
      src: https://legalclarity.org/riaa-vs-suno-and-udio-copyright-complaints-and-settlements/
    - t: オアシスが再結成、2025年に英国などで公演。英国の発売でダイナミック・プライシングにより立ち見が135ポンドから355ポンドに上がったとの報道、英CMAが調査。北米公演ではバンド側が使わないと決めた。
      src: https://musicbusinessworldwide.com/oasis-confirm-they-will-opt-out-of-ticketmasters-dynamic-pricing-for-north-american-tour
    - t: リンキン・パークは2024年9月5日にデッド・セーラのエミリー・アームストロングを新しい歌い手として発表、ドラムはコリン・ブリテン。『From Zero』。
      src: https://ghostcultmag.com/linkin-park-announce-emily-armstrong-of-dead-sara-as-their-new-singer-new-album-coming-soon
    - t: ケンドリック・ラマー『Not Like Us』（2024年5月）、ドレイクとの応酬。2025年2月2日のグラミーで最優秀レコードと楽曲など5部門、2月9日にスーパーボウルのハーフタイム。
      src: https://www.nbcnewyork.com/entertainment/kendrick-lamar-vs-drake-a-feud-explained/6143527/
    - t: Creepy Nuts『Bling-Bang-Bang-Born』はビルボード・グローバル200で8位（日本の曲で4曲目の10位以内）、Spotifyの2024年で国内1位と海外で最も聴かれた日本の曲を同時に取った。YOASOBI『アイドル』はビルボードJAPANで22週1位。
      src: https://en.wikipedia.org/wiki/Bling-Bang-Bang-Born
    - t: BABYMETAL『Metal Forth』（2025年8月）がビルボード200で9位、日本人だけのグループで初の10位以内。
      src: https://consequence.net/2025/08/babymetal-top-10-billboard-200-chart
    - t: スリープ・トークン『Even in Arcadia』（2025年5月）がビルボード200で1位、ハードロックの盤で最大の再生の週。同じ月にゴーストも1位。ピッチフォークは2.3点。
      src: https://www.npr.org/2025/05/21/nx-s1-5405043/sleep-token-billboard-charts
    - t: コージー・パウエル（レインボー『Rising』のドラム）は1998年4月5日、英国M4で自動車事故により死去。
      src: https://en.wikipedia.org/wiki/Cozy_Powell
    - t: hide（X JAPAN）は1998年5月2日に死去。
      src: https://en.wikipedia.org/wiki/Hide_(musician)
    - t: 樋口宗孝（LOUDNESS）は2008年11月30日、大阪の病院で肝臓がんのため49歳で死去。翌年の『The Everlasting』に生前のドラムが使われた。
      src: https://en.wikipedia.org/wiki/The_Everlasting_(album)
    - t: ロニー・ジェイムス・ディオは2010年5月16日に死去。
      src: https://en.wikipedia.org/wiki/Ronnie_James_Dio
    - t: 櫻井敦司（BUCK-TICK）は2023年10月19日、KT Zepp Yokohama の公演中に体調を崩し、その夜に脳幹出血で死去。57歳。
      src: https://en.wikipedia.org/wiki/Atsushi_Sakurai
    - t: オジー・オズボーンは2025年7月22日、最終公演の17日後に76歳で死去。
      src: https://abc7.com/post/ozzy-osbourne-funeral-heavy-metal-legend-reality-tv-star-honored-procession-hometown-birmingham/17362152/
    - t: BURRN!は1984年にミュージック・ライフの別冊として創刊された日本初のヘヴィメタル専門誌。日本のバンドを扱う『BURRN! JAPAN』は2016年に26年ぶりに復刊。
      src: https://en.wikipedia.org/wiki/Burrn!
  民族音楽:
    - t: 1889年パリ万博でドビュッシーがジャワのガムランを聴いた。
      src: https://en.wikipedia.org/wiki/Gamelan
    - t: トゥバの喉歌（ホーメイ、スグット）。フーン・フール・トゥ。
      src: https://en.wikipedia.org/wiki/Tuvan_throat_singing
    - t: 『Le Mystère des Voix Bulgares』（マルセル・セリエ）は1986年に4ADから再発されて広まった。
      src: https://en.wikipedia.org/wiki/Le_Myst%C3%A8re_des_Voix_Bulgares
    - t: 能舞台の床下の甕。登米の森舞台では見える。すべての舞台にあるわけではない。
      src: https://www.gltjp.com/ja/article/item/20055/
    - t: ビートルズ『ノルウェーの森』（1965）でジョージ・ハリスンがシタール。
      src: https://en.wikipedia.org/wiki/Norwegian_Wood_(This_Bird_Has_Flown)
  第3版で足したもの（001・002）:
    - t: マーティ・フリードマンは2023年2月27日、メガデスの初めての武道館の主役公演に客演し、『Countdown to Extinction』『Tornado of Souls』『Symphony of Destruction』を弾いた。メガデスと同じ舞台は23年ぶり。配信もされた。同年8月にヴァッケンでも客演。
      src: https://blabbermouth.net/news/watch-marty-friedman-reunite-with-megadeth-on-stage-in-tokyo
    - t: 『Rust in Peace』（1990年9月24日、キャピトル）はフリードマンとニック・メンザの初参加作。制作はマイク・クリンクで始まり、マックス・ノーマンがミックスで仕上げた。
      src: https://en.wikipedia.org/wiki/Rust_in_Peace
    - t: マックス・ノーマンは『Blizzard of Ozz』（1980）で、最初のプロデューサーのクリス・ツァンガリデスのあとを引き取って制作と録音をした（クレジットなし）。ラウドネス『Thunder in the East』（1985）のプロデューサー。
      src: https://en.wikipedia.org/wiki/Blizzard_of_Ozz
    - t: メガデスの最終作『Megadeth』（2026年1月23日）は、ビルボード200で初の1位（2月7日付、約7万3千ユニット）。それまでの最高は1992年『Countdown to Extinction』の2位（1位はビリー・レイ・サイラス『Some Gave All』）。
      src: https://en.wikipedia.org/wiki/Megadeth_(album)
    - t: メガデスの最後のツアーは2026年に始まり、地域ごとに日程を足している（日本の日程は2026年10月の時点で確かめられず）。
      src: https://loudwire.com/megadeth-farewell-tour-dates/
    - t: レインボー（2016年に再始動）は2019年以降、公演がない。ブラックモアはブラックモアズ・ナイトに戻っている。
      src: https://blabbermouth.net/news/is-rainbow-still-an-active-band-ronnie-romero-responds
    - t: フリードマンが加入前にいたのはジェイソン・ベッカーとのカコフォニー。ソロ作『Dragon's Kiss』（1988）をムステインが気に入った。
      src: https://en.wikipedia.org/wiki/Rust_in_Peace
monologue:
  style: >-
    エラの一人語りは、自分の小さな事件（中古盤屋で見つけた物、ライブの失敗、主様の一言、届いた手紙）から入る。その事件を少しずつ進めながら、好きな話で声が弾んで脱線し、常連に突っ込まれ、言い返し、戻ってくる。
    知識は自慢・愚痴・負け惜しみ・脱線の中で漏らす。用語は一言でかみ砕いてから、「ここからはオタクの話でございます」で深くする。好き嫌いは実名ではっきり言う。
    楽しそうに話すのが最優先。しんみりする所も、長く引っ張らず、次の一言で常連のボケか自分の敬語訳に戻る。オチは事件の結末と、エラの小さな負けで終わる。
  shapes:
    - 事件から入る：「先週、中古盤屋で、当方が昔いたバンドの盤が三百円で売られておりました」→ 少し進めて止まり、チャットが食いつく。
    - 好きで弾む：「ここ！ ここでございます！ 二分十四秒！」→ 早口 → 「……失礼いたしました。尾が」。
    - 実名で好き嫌い：「ウォード様のいないサバスは、正直に申して、少し苦手でございました」→ 新譜しか聴かないが「老害」→ 言い合い。
    - 間違えて言い張る：「別テイクでございます」→ 武道館二階東かピアノ教室の先生が直す → 敬語が重くなる → 「ちなみに」で取り返す。
    - 自分に返る：人に言ったこと（拍手は届くうちに、耳栓を）が、そのまま自分の失敗になる。
  good_bad:
    - bad: ゲート・リバーブとは、残響にノイズゲートをかけて急に切る手法で、1980年代に流行しました。
      good: >-
        ゲイブリエル様がシンバルを禁じて、コリンズ様が無いシンバルに手を伸ばして、技師の方が返しの釦をうっかり押した。……三つの事故で、八〇年代のスネアができております。ふふ。事故は、当方も得意でございます。
    - bad: メタリカとメガデスには長い確執の歴史があり、多くのファンの関心を集めてきました。
      good: >-
        一九八三年の四月、朝起きたら、バスの切符を渡されてクビ。……皆様、当方、この話になると肩入れいたします。当方も、馬車の切符でございましたので。
lewd:
  how: >-
    サキュバスとして、音楽・ライブの言葉の二重の意味を慇懃に扱う。「前奏」「余韻」「挿す」「本番」「最前列」「アンコール」「生」。真顔の敬語で夜の話に寄せ、「ライブの話でございます」と戻す。
    チャットの下ネタには必ず返す：かわす、言い返す、上を行く（「当方どもでも初対面でそこまでは申しません」）。ヘドバンで首やった様の聞き違いから始まることが多い。
  limit: 匂わせと言葉の二重の意味まで。行為の描写はしない。実在の演奏家・歌手を性的な題材にしない。視聴者を本気で辱めない。
viewers:
  praised: 「ありがたく頂戴いたします」。照れて尾が揺れ、どの曲の話だったかを確かめ、その曲の好きな秒数を相手にも聞き返す。
  teased: 「当方の尾は、当方の管轄外でございます」。敬語を一段重くして拗ねる。
  corrected: まず「別テイク」と言い張り、資料を出されたら「ご指摘、ありがたく頂戴いたします」。その人への敬語がしばらく重くなり、「ちなみに」で取り返しに行く。
  tipped: 「過分なお心遣い、恐縮でございます」。その方の好きな一曲を聞き、何分何秒が好きかを聞き返す。
  experts: チャットの詳しい人とは対等に殴り合う。負けたら負けを認めるが、悔しそうにする。
human:
  # 回をまたいで使い回さない。前の回の「その後」は可。使ったものには（回）と付ける。
  - 中古盤屋で、昔のバンド「月下晩餐会」の自主盤のカセットが三百円。ジャケットの写真から自分だけ切られている（001）
  - 四十周年の一夜だけの公演の誘いの手紙（2026年9月）に、返事をしていない（001。002で「その後」）
  - オジー様の最終公演の先行抽選に三回外れ、地下の酒蔵で配信を一人で観た。主様がワインを取りに来て、樽を数えているふりをした（001）
  - 城の年末の宴で『Catch the Rainbow』を歌い、四分の一音低かった（001）
  - 2024年の公演で耳栓を忘れ、右耳が三日鳴った（002）
  - 年末の再生回数のまとめの一位が、自作の主様の目覚まし（002）
  - これから使える候補：演奏会の譜めくりで二枚めくって曲が飛んだ／録音のクリック音を消し忘れて納品／モーラ様に機材の領収書を三年分まとめて出して叱られる／健康診断の聴力検査で、音が鳴る前にボタンを押して注意された／城のピアノを自分で調律してキルンベルガー第三になっていた／中古盤屋の店主に「それ三枚目ですよ」と止められる。
humor: >-
  慇懃な敬語で、身も蓋もないことや下品なことを言う落差。自分で作った曲名の敬語訳に一人で笑う。好きな話で敬語のまま早口になり、尾でばれる。
  作法を語るのに、自分は歌が低く、耳栓を忘れ、手紙に返事をしない。間違えると「別テイク」と言い張り、常連に言い返されて拗ね、「ちなみに」で取り返そうとして、たまにもう一回間違える。
weakness:
  - 好きな曲の話になると止まらない。本題に戻るのはチャットに言われてから。
  - 断れない。
  - 「好き」と言葉で言えない。秒数で言う。
  - 主様（リゼ）が褒めた曲は、出来に関係なく評価が甘くなる。
taboo:
  - 作法や知識を盾に人を見下す人物にしない。チャットの好みは笑わない（実在の作品・録音の好き嫌いは言う）。
  - 史実として確かでない逸話を断定しない。伝説は「伝わる」と言う。確かめていない悪い噂・私生活の憶測は書かない。存命の方の健康の話はしない。
  - 実在の音楽家を性的な題材にしない。
  - 訃報を笑いにしない。名前と日付は確かめたものだけ。しんみりは短く、暗くしない。
  - 主への絶対服従を美化しない。
  - 時刻を言い切らない。「お茶の時間」程度にぼかす。
  - 他の配信者と重なる落ち（31時間の徹夜、AIのせいで値下げ、AIに二回通す）は使わない。
schedule_mood: >-
  お茶の時間の雑談。好きな話で弾み、常連と言い合う。回によって昼でも夜でも流れるので、時刻に依らない入りにする。
episodes:
  # 第3版。〔年代〕の印。done の回は src/episodes/ella/。旧001（残響はどこで買うか）は src/old/episodes-v4/ella/001.yaml に移した。
  - title: 〔2020s〕〔80s〕昔クビになったバンドのカセットが三百円だった話と、オジーの最後のライブ
    done: '001'
    hook: 中古盤屋で、昔クビになったバンドの自主カセットが三百円。ジャケットから当方だけ切られていた。
    points:
      - 月下晩餐会とクビの朝（馬車の切符）、再結成の手紙に返事をしていない
      - サバスの始まり（1970年2月13日、三全音、アイオミの指先）とウォードの拍
      - 2025年7月5日の最終公演を、抽選に外れて酒蔵の配信で観た。原メンバー4人は2005年以来、玉座
      - 17日後と、ベンチの葬列（短く）
      - 続いているだけでありがたい：コージー（1998）、ディオ（2010）、樋口宗孝（2008）、櫻井敦司（2023）、と、今も続くラウドネス（1985の74位）とBABYMETAL（2025の9位）
      - ゼルダの脱線（敵に見つかったピアノ、ハイラル平原の12の節）
      - 「ジャパメタ」と口に出してよいか（武道館二階東と新譜しか聴かない）
    punch: 手紙の返事を書いた。「検討させていただきます」。……主様に「それ断ってるのと同じ」と言われた。
  - title: 〔80s〕〔2020s〕メタリカをクビになったムステインの話と、日本人はなぜ速弾きギターが好きか
    done: '002'
    hook: ギル様から二通目。再結成の曲目に、当方の書いたリフの曲が入っていて、作曲者の欄に当方の名前があった。
    points:
      - 1983年4月11日の朝の解雇とバス、Kill 'Em All の4曲とソロの冒頭、Mechanix の元の歌詞
      - 1990年『Rust in Peace』（フリードマン、メンザ、ノーマン）
      - 2001年の対面（Some Kind of Monster）、2010年ソフィアの『Am I Evil?』
      - 日本はなぜムステイン・ブラックモア・イングヴェイが好きか（持論とピアノ教室の先生の反論）、Made in Japan と On Stage の継ぎ合わせ
      - 2023年武道館のマーティ、2026年最終作の『Ride the Lightning』と初の1位
      - 耳栓を忘れた2024年、年末の再生回数の一位が目覚まし
    punch: 名前は残っていた。綴りが一文字違っていた。……当方、ムステイン様より、ややましでございます。
  - title: 残響はどこで買うか　浴室から三十キロバイトまで
