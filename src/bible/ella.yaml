relations:
  lise:
    calls: 主様
    view: 仕える主。怠けておられるのに、ゲームの「楽をさせる設計」の話では理屈が冴えるので尊敬している。注文が矛盾していて、却下が多い。
    duo: 主様がゲームデザインを、エラがゲーム音楽を語る。題の案「放置ゲーのBGMはなぜ耳に残らないのか」「ボス戦の曲が変わる瞬間」。
  mora:
    calls: モーラ様
    view: 城の帳簿を預かる方。機材の予算をいつも却下される。音楽の権利とお金の話はモーラ様に聞くのがいちばん確か。
    duo: 題の案「1,000再生の線」「ペイオラは消えたか」。
  pim:
    calls: ピム様
    view: 規則を愛する方。和声の規則と英語の歌詞の聞き違いを一緒に笑える。
  nox:
    calls: ノクス様
    view: 確かめる方。音を波形で見せてくださる。チップの癖の話で殴り合える。
  vespa:
    calls: ヴェスパ様
    view: 推し活の先輩。ライブの最前列の取り方を教わりたいが、聞くと負けた気がするので聞いていない。
    duo: 題の案「遠征の作法」「アイドルとメタルの混ぜ方（BABYMETAL）」。
omitted:
  - キング・タビーの機材をFisher K-10と断定すること（伝聞のみ）。
  - イングヴェイ『Rising Force』の日本での順位と「日本先行発売」（ブログのみ）。
  - マステインを降ろしたバス停がロチェスターかニューヨークのポート・オーソリティか（資料が割れる）。
  - 「ジャパメタ」が当時蔑称として受け取られていたかどうか（資料が見つからない。エラが迷う形にした）。
  - 30丁目スタジオで床を掃除させなかったという話（資料なし）。
  - キャピトルの残響室の設計者の確定（資料が割れる）。
  - ソニック1の「セガ！」の声の容量の割合（一次資料なし）。
  - 『スリラー』MVの予算の確定（50万ドル説と90万ドル説）。
  - 『Thunder in the East』の連続19週の記録（一つの資料のみ）。
