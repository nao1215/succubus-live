    - t: 『Kill 'Em All』（1983年5月、ロチェスターのミュージック・アメリカ・スタジオ）でマステインの名は『The Four Horsemen』『Jump in the Fire』『Phantom Lord』『Metal Militia』の4曲に残る。ハメットのソロの多くは冒頭4小節がマステインの原型。
      src: https://en.wikipedia.org/wiki/Kill_%27Em_All
    - t: 『The Four Horsemen』はマステインの『The Mechanix』（ガソリンスタンドでの情事の歌詞）をヘットフィールドが書き換え、中間部を足したもの。元の歌詞はメガデス1作目（1985）の『Mechanix』。
      src: https://en.wikipedia.org/wiki/Kill_%27Em_All
    - t: 解雇のあと、ロサンゼルス行きのバスの中でメガデスの名を思い付いた（政治のビラの一句から、とされる）。同年ロサンゼルスでメガデス結成。
      src: https://en.wikipedia.org/wiki/Megadeth
    - t: 『Some Kind of Monster』で、2001年9月13日、サンフランシスコのリッツ・カールトンでマステインとウルリッヒが対面。コーチのフィル・トウルが立ち会った。マステインは場面を外すよう求めたとされる。
      src: https://en.wikipedia.org/wiki/Metallica:_Some_Kind_of_Monster
    - t: 2010年6月22日、ソフィア（ブルガリア）のソニスフィアで四組がそろい、『Am I Evil?』でマステインがメタリカの舞台に。1983年4月以来。
      src: https://blabbermouth.net/news/metallica-slayer-megadeth-and-anthrax-perform-am-i-evil-in-sofia-with-video-photos
    - t: メガデスは2025年8月14日に最終作と最終ツアーを発表。最終作『Megadeth』（2026年1月23日）の11曲目に、メタリカ『Ride the Lightning』の新しい版。マステインはその曲の作者の一人。
      src: https://www.kerrang.com/megadeth-new-album-self-titled-tracklist-bonus-track-ride-the-lightning-metallica-reimagined
  日本とギター英雄:
    - t: ディープ・パープル『Made in Japan』は1972年8月15〜17日、大阪フェスティバルホールと武道館（17日）。当初は日本だけで出す約束だった。
      src: https://en.wikipedia.org/wiki/Made_in_Japan_(Deep_Purple_album)
    - t: レインボー『On Stage』（1977）は1976年12月の大阪と武道館（16日の昼夜）とドイツ公演の継ぎ合わせ。オリコン6位、日本でゴールド。
      src: https://en.wikipedia.org/wiki/On_Stage_(Rainbow_album)
    - t: イングヴェイは『Rising Force』（1984）でアルカトラスから独立。欧州と日本で長く支持され、90年代は日本のポニーキャニオンから出した。日本で先に火が付いたとよく語られる（日本の順位は確かめられず）。
      src: https://en.wikipedia.org/wiki/Yngwie_Malmsteen
    - t: マーティ・フリードマンは1999年12月にメガデス脱退、2003年から東京に住む。『ヘビメタさん』、『ROCK FUJIYAMA』（2006〜07）、ももいろクローバーZの『Moon Pride』などに参加。日経エンタテインメント!でJ-POPの連載。
      src: https://en.wikipedia.org/wiki/Marty_Friedman
  1990年代:
    - t: エイフェックス・ツイン『Selected Ambient Works 85-92』（1992）。
      src: https://en.wikipedia.org/wiki/Selected_Ambient_Works_85%E2%80%9392
    - t: ポーティスヘッド『Dummy』（1994）は1995年のマーキュリー賞。
      src: https://en.wikipedia.org/wiki/Dummy_(album)
    - t: ゴールディ『Timeless』（1995）はジャングル／ドラムンベースをアルバムの形にした代表作。
      src: https://en.wikipedia.org/wiki/Timeless_(Goldie_album)
    - t: レディオヘッド『OK Computer』（1997）。
      src: https://en.wikipedia.org/wiki/OK_Computer
    - t: 植松伸夫『片翼の天使』（『FFVII』、1997）はシリーズで初めて合唱の声が入った戦闘曲として知られる。
      src: https://en.wikipedia.org/wiki/One-Winged_Angel
    - t: 宇多田ヒカル『First Love』（1999）は日本で最も売れたアルバム。
      src: https://en.wikipedia.org/wiki/First_Love_(Hikaru_Utada_album)
  2000年代:
    - t: ナップスターは2001年3月の差し止め命令を受け、同年7月に全体を止めた。のちの和解で過去分2600万ドルと前払い1000万ドル。
      src: https://en.wikipedia.org/wiki/Napster
    - t: iTunes Music Store は2003年4月28日（Mac）に開業、最初の18時間で約27.5万曲、5日で100万曲超。2009年1月にDRMをやめた（iTunes Plus）。
      src: https://en.wikipedia.org/wiki/ITunes_Store
    - t: 2005年『ギター・ヒーロー』（ハーモニックス、レッドオクタン）。のちの『デス・マグネティック』のゲーム版の件につながる。
      src: https://en.wikipedia.org/wiki/Guitar_Hero_(video_game)
    - t: OK Go『Here It Goes Again』（2006年7月31日にYouTube）は、ルームランナー8台を一続きの撮影で。振付はクラッシュの姉トリッシュ・シーと共同、2007年のグラミーの短編MV賞。
      src: https://en.wikipedia.org/wiki/Here_It_Goes_Again
    - t: レディオヘッド『In Rainbows』（2007年10月）は値段を買い手が決める形で直販した。
