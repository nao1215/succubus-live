    - t: マッキントッシュ・プラス『Floral Shoppe』（2011）はヴェイパーウェイヴの代表。『リサフランク420』はダイアナ・ロス『It's Your Move』を遅くしたもの。
      src: https://en.wikipedia.org/wiki/Floral_Shoppe
    - t: 渋谷系：フリッパーズ・ギター、ピチカート・ファイヴ、コーネリアス。渋谷の大型レコード店の売り場から広まった。
