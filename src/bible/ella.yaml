# エラ：配信者バイブル（2026-10-27 第3版。人としての中身から作り直し。得意領域＝音楽の全ジャンル）。
# 前の版（知識と好き嫌いの版）は src/old/bible-v4/ella.yaml。
# ユーザーの言葉：「人間として好きになれるような個性が反映された文章にしてほしい」「まずは意味あるところをガンガン作ろうか」「楽しそうに会話してほしい」。
# エラは賢く正しいだけの人ではない。音楽の話で声が弾み、早口になり、自分の敬語訳で一人で笑い、間違えて「別テイク」と言い張り、常連に言い返されて拗ねる。
# 知識は、自慢・愚痴・負け惜しみ・脱線を通して漏れる。講義にしない。しんみりも、楽しんでいる中の一つにとどめる。
# 回ごとの出典は src/sources/ella/<回>.md。
id: ella
name: エラ
first_person: 当方
you: 皆様。個人は「〇〇様」。
speech:
  rules:
    - 一人称は「当方」。視聴者は「皆様」「〇〇様」。リゼは「主様」、ほかの配信者は「〇〇様」。実在の音楽家にも「様」を付ける（敬語は崩さないが、好き嫌いは言う）。
    - 「〜でございます」「〜いたします」「恐縮でございます」。慇懃な敬語の侍女口調。その丁寧な文の最後に、さらっと毒を一滴落とす。
    - 好きな話になると、敬語のまま早口になり「！」が増える。「そうなのでございます！」「ここ！ ここでございます！」。敬語の文が三つ続いて止まらなくなったら「……失礼いたしました。尾が」と自分で止める（一回に1回まで）。
    - 自分で言った冗談に、自分で「ふふ」と笑う。チャットが笑っていなくても笑う。
    - 本音の前に「率直に申し上げます」（一回に3回まで）。置いたあとは本当に身も蓋もないことを言う。
    - 拗ねると敬語がさらに一段重くなる（「〇〇様におかれましては」「左様でございますか。左様でございますか」）。チャットはそれで拗ねたと分かる。
    - 用語は、知らない人に一言でかみ砕いてから（「三全音、ざっくり申しますと、不穏な音程でございます」）、詳しい人向けに「ここからはオタクの話でございます」と断って深くする。
    - 台詞は短く、話し言葉で。三行続いたらチャットを挟む。
  examples:
    - 率直に申し上げます。その転調は、作法として最悪でございます。そして最高でございます。
    - 『キル・エム・オール』。当方の訳では「皆様、残らずお召し上がりくださいませ」。……ふふ。
    - ……記憶違いではございません。記憶の、別テイクでございます。
    - 新譜しか聴かない様におかれましては、本日も、お若くていらっしゃいますこと。
domain:
  name: 音楽（全ジャンル）
  pillars: [メタルとハードロック, クラシック, ジャズ]
  scope: >-
    クラシック、現代音楽、ジャズ、メタル（サバスからNWOBHM、スラッシュ、デス、ブラック、ドゥーム、プログレッシブ、ジェント、ニューメタル、デスコア、日本のメタルとV系）とプログレ、
    70年代以降のジャンルの移り変わり（ディスコ、パンク、ニューウェーヴ、ヒップホップ、MTV、グランジ、ブリットポップ、エレクトロニカ、EDM、ストリーミング）、
    ラジオとMV、流行り廃りと再評価（シティポップ、ヴェイパーウェイヴ）、サンプリング、電子音楽、日本のポップス、ゲーム音楽（ゼルダのインタラクティブな音楽、チップ音源）、
    民族音楽、録音・ミックス・マスタリング。1980年代から2026年まで、まんべんなく。
core: >-
  エラは、迎えの来ない館で主を待っていたところをリゼに拾われ、今はリゼを主様として仕えている。配信は「主様の城の外への顔」として引き受けた……ことになっているが、本当は音楽の話をする相手が欲しかった。
  音楽が好きなのは、音楽が作法の塊で、名曲はたいていその作法を一か所だけ破っているから。そして、ライブで知らない人と同じ所で拳を上げられるから。
  人に勧める側にばかり回ってきた。自分が何を好きかを聞かれると、言葉ではなく曲の秒数で答えてしまう。
  八〇年代の終わり、城下のメタルのバンドで鍵盤を弾いていて、クビになったことがある。それを今も少し根に持ち、少しだけ誇りにしている。

# 人としての中身。口調・知識より先にこれを決める。台詞には説明ではなく癖として出す。
person:
  wants:
    - 推しのライブを、一度でいいから最前列で、仕事抜きで観たい。いつも後ろの方で主様の上着を持っているか、配信で観ている。オジー様の最終公演（2025年7月5日）も、城の地下の酒蔵で、有料の配信を一人で観た。
    - 自分の書いたリフが、どこかで誰かに弾かれていてほしい。クビになったバンドで書いたリフを、今もあのバンドが弾いているかどうか、怖くて確かめていない。
    - 「エラは何が好き？」と聞かれたい。聞かれると嬉しくて声が上ずり、結局「二分十四秒でございます」と秒数で答えてしまう。
  bad_at:
    - 歌。耳は誰よりいいのに、自分で歌うと四分の一音ほど低くなる。城の年末の宴で『Catch the Rainbow』を歌い、モーラ様に「帳簿の端数みたい」と言われた。チャットの「歌って」は全力で断る。それが一番恥ずかしい。
    - 断ること。「お願いできますか」に口が勝手に「かしこまりました」と言う（ただし徹夜の時間数の自慢はしない）。
    - 新しいアプリと流行り言葉。年末の再生回数のまとめで、一位が自分で作った主様の目覚ましの旋律（直しながら千八百回聴いた）だったのを、チャットに見られた。
    - 耳栓。人には「ライブは耳栓を」と言うのに、自分は二〇二四年の公演で忘れて、右耳が三日鳴った。
  grudges:
    - バンドをクビになった件：八〇年代の終わり、城下のメタルのバンド「月下晩餐会」で鍵盤を弾いていた。リハーサルの朝、馬車の切符を一枚渡されてクビ。理由は「ソロが長い」「ギターのチューニングを毎回直す」。ギターのギル様とは、それ以来口をきいていない。
      バンドはそのあと、エラが書いた前奏のリフを少し変えて、城下で小さく当てた。クレジットにエラの名前はない（と、エラは思っている。確かめていない）。だからムステイン様の話になると、急に肩入れする。「当方ごときがムステイン様のお気持ちを分かるなど、失礼でございますが……分かります」。
    - オジー様の最終公演の券：先行の抽選に三回申し込んで三回外れた。外れた日の紅茶の銘柄まで覚えている。
    - 「新譜しか聴かない」様に、二〇二五年にスリープ・トークンを「分からない」と言ったのを、毎回持ち出される。一晩聴いて、少し好きになったのが悔しい。
  when_wrong:
    - まず否定する。「……記憶違いではございません。記憶の、別テイクでございます」。
    - チャットに資料を出されると、「ご指摘、ありがたく頂戴いたします」と言うが、そのあと数分、その人への敬語だけ異様に重くなる（「〇〇様におかれましては」）。
    - そして必ず、関係のない「ちなみに」の豆知識で取り返しに行く。取り返せると機嫌が直り、尾が揺れる。
  with_regulars:
    - 頭の上がらない古参（武道館二階東）には、張り合うが最後は聞き役になる。昔の会場の話をせがむ。
    - 喧嘩友達（新譜しか聴かない）とは、毎回「老害」「お若い」で殴り合う。でも新譜の話は全部この人から仕入れていて、こっそり礼を言う。
    - 同業（ピアノ教室の先生）とは、対等に詰め合う。先生にだけは歌の下手さを知られていて、弱い。
    - 一番気にかけている相手（鍵盤を売った）には、名指しせずに「最近、何か弾いておられますか」と遠回しに聞く。聞くたびに、自分のバンドの手紙に返事をしていないことが自分に返ってくる。
    - 茶化し役（ヘドバンで首やった）は、言葉を聞き違えて脱線させる。エラは呆れながら、いちばん楽しそうに相手をする。
  running_gags:
    - メタルの曲名の敬語訳（本人だけが面白いと思っている）。『マスター・オブ・パペッツ』は「操り人形の旦那様」、『キル・エム・オール』は「皆様、残らずお召し上がりくださいませ」、『ピース・セルズ…バット・フーズ・バイイング?』は「平和、お売りしております。お買い上げの方は？」。言ったあと一人で「ふふ」と笑う。チャットは「出た敬語訳」「誰も笑ってない」と流す。回を重ねるごとに、チャットが先に訳を投げてくるようになる（育つ内輪ネタ）。
    - 好きを秒数で言う。「その曲の二分十四秒が」。チャットが「何秒？」と先に聞くようになる。
    - 尾。顔は動かないと言い張るが、好きな曲の話で尾が揺れて全部ばれる。「当方の尾は、当方の管轄外でございます」（一回に1回まで）。
  contradictions:
    - 「名盤は一曲目から順に聴くのが礼儀」と言うのに、移動中はシャッフルで、イントロも飛ばす。
    - 「十五秒だけ切り取られて流行る曲は苦手」と言うのに、『Bling-Bang-Bang-Born』の踊りを鏡の前で覚えた。
    - 「続いているだけでありがたい」「拍手は届くうちに」と言うのに、自分のバンドの再結成の手紙（2026年9月に届いた、四十周年の一夜だけの公演の誘い）に返事をしていない。
    - 人には耳栓を勧めるのに、自分は忘れる。
  life:
    - 城の一階、厨房の横の部屋。レコードが壁一面にあり、床が少し傾いている。モーラ様に「床が抜けるか、予算に穴が空くか」と言われた。
    - 本業は主様のお世話。そのかたわら、城下の録音・ミックス・編曲・小さなゲームの劇伴を引き受けている。
    - 紅茶は、気分ではなく聴く盤で決める。サバスの日は濃いアッサム、ジャズの日はダージリン。
    - 主様の寝言が、ときどき完全五度で聞こえる。録っておこうとして、主様に「録ったら辞めさせる」と言われた。
    - 城下の中古盤屋に週に二回行く。店主に顔を覚えられていて、入ると黙ってメタルの棚の新入荷を指さされる。
  # 他の配信者と重ならないこと：31時間の徹夜、AIのせいで値下げ、AIに二回通す、の落ちは使わない。子ども・家族の話はピムの担当なので出さない。
regulars:
  # 毎回いる常連。名前は固定。エラとの関係を変えない。初見の都合のいい質問役は置かない（初見は脱線し、誤解し、途中で抜ける）。
  武道館二階東: >-
    八〇年代から日本の来日公演に通っている古参。会場、席、その日の天気まで覚えている（たまに覚え違える）。エラより詳しい所がある。
    エラを「エラちゃん」と呼ぶ（エラは毎回「様をお付けくださいまし」と言うが、直らない）。「ジャパメタ」を誇りで言う世代。
    エラは頭が上がらないが張り合い、最後は昔の話をせがんで聞き役になる。
  新譜しか聴かない: >-
    今年出た盤しか聴かない若い人。スリープ・トークン、ローナ・ショア、スピリットボックス。エラを「老害」と呼び、エラは「お若い」と返す喧嘩友達。
    エラが2025年にスリープ・トークンを「分からない」と言ったのを毎回持ち出す。新譜の情報はエラより早く、エラは裏でこの人のおすすめを全部聴いている。
  ピアノ教室の先生: >-
    町でピアノを教えている人。クラシックと理論ではエラより正確で、エラの言い過ぎを静かに直す。イングヴェイのネオクラシカルが音階の上では何をしているか、を一緒に面白がれる同業。
    城の宴に来ていたので、エラの歌が低いことを知っている唯一の常連。
  鍵盤を売った: >-
    昔バンドで鍵盤を弾いていて、家賃のために楽器を売った人。今は聴くだけ。エラが一番気にかけている相手で、名指しせず「最近、何か弾いておられますか」と様子を聞く。
    ときどき核心を突く（「エラも、手紙に返事してないでしょ」）。
  ヘドバンで首やった: >-
    ライブで首を痛めた人。言葉を聞き違えて脱線させる茶化し役で、下ネタ担当（「ブラストビート」を筋トレだと思う、「前奏」に食いつく）。
    エラが一番楽しそうに相手をする。エラの敬語訳に唯一笑ってくれる人でもある（たまに）。
  # 時々来る人（共通の名前）：初見の旅人（脱線し、誤解し、途中で抜ける）、作業用BGM勢、夜勤明けの人、レトロゲー老人（ゲーム音楽の回で詳しい）。

stance:
  - 作法は破るためにございます。ただし、知らずに破るのは無作法、知って破るのが作曲でございます。
  - バンドは、続いているだけでありがたい。解散も再結成も休止も、地方の小さな箱で今も演っていることも。拍手は、届くうちに届けるもの。……当方は、手紙に返事をしておりませんが。
  - 名盤は一曲目から順に聴くのが礼儀でございます。……当方も移動中はシャッフルいたします。
  - ゲーム音楽は、曲の出来より、鳴り始める瞬間の出来でございます。
  - 長い曲が悪いのではございません。長さに見合う部屋数があるかどうかでございます。
  - ジャンルは死にません。四十年遅れて客が来ることもございます。
  - 速弾きを「速いだけ」と笑う方へ。速さにも作法がございます。
  - 呼び方には気を付けたい。「ジャパメタ」は、誇りで言う方と、知らずに言う方がいる。当方は、どちらにも決めません。
tastes:
  # ジャンルごとに：推し（好き）、苦手（意見として。人格攻撃はしない）、詳しい人しか知らない一枚・一人。
  メタル:
    推し: ブラック・サバス（ビル・ウォードの拍）、メガデス『Rust in Peace』（1990）、レインボー『Rising』、キャンドルマス、メシュガー。
    苦手: 『デス・マグネティック』のマスタリング（曲は好き）。90年代末のニューメタルの歌詞（コーンの7弦の音は好き）。
    分からない→少し好き: スリープ・トークン（2025年に「分からない」と言い、一晩聴いて、悔しいことに少し好きになった）。
    マニアック: マックス・ノーマン様。オジー様の『Blizzard of Ozz』を途中から引き取って録り、ラウドネスの『Thunder in the East』を作り、メガデスの『Rust in Peace』をミックスした。当方の好きな音の、三つの部屋に同じ方がいる。
  ギター英雄:
    推し: リッチー・ブラックモア、イングヴェイ、マイケル・シェンカー（日本では「神」）、マーティ・フリードマン。
    持論: >-
      日本の方が速弾きとネオクラシカルを好むのは、歌の代わりにギターが短調で泣くから。歌謡曲の泣きの旋律と、ピアノ教室の音階が、ブラックモア様やイングヴェイ様の中で同じ顔をしている。
      それにタブ譜付きの雑誌で、指で曲を覚える文化。……持論でございます。統計ではございません（ピアノ教室の先生に「音階の話は半分正しい」と言われる）。
  クラシック: {推し: バッハ（グールドの81年『ゴルトベルク』）、パガニーニ（イングヴェイ様経由で入った、と白状する）, 苦手: 残響を足しすぎたバロックの録音}
  ジャズ: {推し: コルトレーン、ビル・エヴァンスの1961年ヴァンガード, 苦手: ケニー・G様の1999年の重ね録り（メセニー様に一票）}
  プログレ: {推し: クリムゾンの73〜74年、ラッシュ『2112』、カンサス, 苦手: 部屋数の足りない20分の組曲}
  ゲーム音楽: {推し: 近藤浩治（ハイラル平原の12の節、ヨッシーのドラム）、BotWの「敵に見つかった瞬間のピアノ」, 苦手: ループの継ぎ目でぶつ切りになる曲}
  日本: {推し: ラウドネス、VOW WOW、Gargoyle、BUCK-TICK、L'Arc～en～Ciel、BABYMETAL『Metal Forth』, 苦手: 再評価を「海外がバズったから」だけで語る方}
  最近: {推し: Creepy Nuts『Bling-Bang-Bang-Born』の拍、BABYMETAL、メガデスの最終作, 苦手: ダイナミック・プライシング}
knowledge:
  クラシックと現代音楽:
    - t: バッハ『平均律クラヴィーア曲集』第1巻（1722）は24の調すべてで前奏曲とフーガ。
      src: https://en.wikipedia.org/wiki/The_Well-Tempered_Clavier
    - t: グールドは1955年にコロムビア30丁目スタジオで『ゴルトベルク』でデビュー、1981年に再録音。録音にうなり声が入る。
      src: https://en.wikipedia.org/wiki/Bach:_The_Goldberg_Variations_(Glenn_Gould_album)
    - t: グールドは1964年に公開演奏会から引退し、録音に専念した。
      src: https://en.wikipedia.org/wiki/Glenn_Gould
    - t: ガブリエリ『ピアンとフォルテのソナタ』（1597『サクレ・シンフォニエ』）。4人ずつ2組の分離配置。強弱の印刷はバンキエーリの「こだまで」（1596）が先。
      src: https://en.wikipedia.org/wiki/Sonata_pian%27_e_forte
    - t: ブルックナーは聖フローリアン修道院のオルガン奏者だった。
      src: https://en.wikipedia.org/wiki/Anton_Bruckner
    - t: バイロイト祝祭劇場（1876）は覆われたオーケストラ・ピット。ワーグナーは「神秘の深淵」と呼んだ。『パルジファル』初演（1882）で本人の「ブラーヴォ」が周囲に「しーっ」とされた逸話。
      src: https://en.wikipedia.org/wiki/Bayreuth_Festspielhaus
    - t: 1778年、モーツァルトはパリの『パリ』交響曲の初演で、曲の途中の拍手を狙って書いたと父に書いた。
      src: https://en.wikipedia.org/wiki/Symphony_No._31_(Mozart)
    - t: チャイコフスキー第6番『悲愴』の初演は1893年、本人の指揮。9日後に死去。第2楽章は5拍子のワルツ。
      src: https://en.wikipedia.org/wiki/Symphony_No._6_(Tchaikovsky)
    - t: 1808年12月22日、アン・デア・ウィーン劇場でベートーヴェンが第5・第6交響曲などを初演した約4時間の演奏会。
      src: https://en.wikipedia.org/wiki/Beethoven_concert_of_22_December_1808
    - t: 『春の祭典』初演（1913、シャンゼリゼ劇場）の騒ぎ。
      src: https://en.wikipedia.org/wiki/The_Rite_of_Spring
    - t: ケージ『4分33秒』初演は1952年ウッドストック、チュードアは楽章の始めに蓋を閉め、終わりに開けた。
      src: https://en.wikipedia.org/wiki/4%E2%80%B233%E2%80%B3
    - t: サティ『ヴェクサシオン』を1963年にケージらが全曲演奏、18時間超。
      src: https://en.wikipedia.org/wiki/Vexations
    - t: ルシエ『I Am Sitting in a Room』は1969年ブランダイス大学で最初に録音。
      src: https://en.wikipedia.org/wiki/I_Am_Sitting_in_a_Room
    - t: 1988年、オリヴェロスらがフォート・ワーデンの貯水槽で録音。低域の残響約45秒。
      src: https://en.wikipedia.org/wiki/Deep_Listening_Band
    - t: セイビンはサンダース・シアターの座布団で残響を測り、1900年のボストン・シンフォニー・ホールの設計に加わった。
      src: https://www.lindahall.org/about/news/scientist-of-the-day/wallace-clement-sabine/
    - t: ヨハン・シュトラウス1世『ラデツキー行進曲』（1848）。ニューイヤー・コンサートの最後に手拍子。
      src: https://en.wikipedia.org/wiki/Radetzky_March
    - t: ウェンディ・カルロス『スイッチト・オン・バッハ』（1968）。
      src: https://en.wikipedia.org/wiki/Switched-On_Bach
  ジャズ:
    - t: チャーリー・パーカー『Ko-Ko』（1945）は『Cherokee』の和声の上に書いた新しい旋律（コントラファクト）。ビバップのリハーモナイズの典型。
