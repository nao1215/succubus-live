      src: https://en.wikipedia.org/wiki/Michael_Jackson%27s_Thriller_(music_video)
    - t: マイケルとジャネット『スクリーム』（1995）は700万ドルでギネスの「最も高いMV」。監督ロマネクは異論を述べている。
