  流行り廃りと再評価:
    - t: 『プラスティック・ラブ』（1984）は2017年7月の非公式アップロードで約2400万回、のちに削除。フル尺の公式MVは2021年。写真家レヴェンソン「皆アルゴリズムを言うが、人は写真に何かを見た」。
