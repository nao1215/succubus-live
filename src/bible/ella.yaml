    - t: ヴェノム『Black Metal』（1982）がジャンル名の由来。
      src: https://en.wikipedia.org/wiki/Black_Metal_(Venom_album)
    - t: ポゼストの『Seven Churches』（1985）、デスの『Scream Bloody Gore』（1987）がデスメタルの初期の基準。タンパのモリサウンド・スタジオとスコット・バーンズ。
      src: https://en.wikipedia.org/wiki/Death_metal
    - t: ストックホルムのサンライト・スタジオ（トーマス・スコグスベリ）とBoss HM-2。エントゥームド『Left Hand Path』（1990）。
      src: https://en.wikipedia.org/wiki/Swedish_death_metal
    - t: ダークスローン『A Blaze in the Northern Sky』（1992）はノルウェーのブラックメタルの、わざと荒い録音の典型。
      src: https://en.wikipedia.org/wiki/A_Blaze_in_the_Northern_Sky
    - t: キャンドルマス『Epicus Doomicus Metallicus』（1986）がエピック・ドゥームの名の元。
      src: https://en.wikipedia.org/wiki/Epicus_Doomicus_Metallicus
    - t: ドリーム・シアター『Images and Words』（1992）と『Pull Me Under』。
      src: https://en.wikipedia.org/wiki/Images_and_Words
    - t: ジェントの語はメシュガーのギターの音の擬音。ソードンダルが元とされ、ペリフェリーのミーシャ・マンソーがフォーラムで広めた。
      src: https://en.wikipedia.org/wiki/Djent
    - t: メシュガー『Catch Thirtythree』（2005）は全ドラムをハーケのキットのサンプル（Drumkit From Hell）で打ち込んだ。
      src: https://sabian.com/?p=2616
    - t: コーンのデビュー作（1994）はロス・ロビンソンのプロデュース、7弦ギター。ニューメタルの起点。
      src: https://en.wikipedia.org/wiki/Korn_(album)
    - t: ラウドネス『Thunder in the East』（1985、マックス・ノーマン制作）はビルボード200で74位。
      src: https://en.wikipedia.org/wiki/Thunder_in_the_East
    - t: BABYMETALは2016年4月2日にウェンブリー・アリーナで日本の歌手として初めて主役公演。
      src: https://en.wikipedia.org/wiki/Babymetal
    - t: 『デス・マグネティック』（2008）は音割れで苦情。Guitar Hero版の方が圧縮が少ない。
      src: https://en.wikipedia.org/wiki/Death_Magnetic
    - t: 2025年7月5日、ヴィラ・パークの『Back to the Beginning』。音楽監督モレロ。オジーは玉座に座って歌い、サバス原メンバー4人は2005年以来。War Pigs / N.I.B. / Iron Man / Paranoid。4万人超、約1.9億ドルを寄付。
      src: https://loudwire.com/black-sabbath-final-show-setlist/
    - t: オジーは2025年7月22日に76歳で死去。7月30日、バーミンガムで葬列、ブラック・サバス・ベンチで停止。
      src: https://abc7.com/post/ozzy-osbourne-funeral-heavy-metal-legend-reality-tv-star-honored-procession-hometown-birmingham/17362152/
    - t: 『When the Levee Breaks』のドラムはヘッドリィ・グランジの階段、M160が2本、ビンソン・エコーレック（アンディ・ジョンズの証言）。
      src: https://www.musicradar.com/news/led-zeppelin-iv-interview-andy-johns-bonham-page
  プログレ:
    - t: キング・クリムゾン『クリムゾン・キングの宮殿』（1969）。メロトロン。
      src: https://en.wikipedia.org/wiki/In_the_Court_of_the_Crimson_King
    - t: イエス『危機（Close to the Edge）』（1972）は表題曲がLPの片面を占める。
