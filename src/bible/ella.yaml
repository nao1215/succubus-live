  70年代からのジャンルの移り変わり:
    - t: 1979年7月12日、コミスキー・パークのディスコ・デモリッション・ナイト。スティーヴ・ダール。外野に穴、ホワイトソックスの没収試合。ディスコの終わりの象徴とされる。
      src: https://www.npr.org/2016/07/16/485873750/july-12-1979-the-night-disco-died-or-didnt
    - t: 1976年12月1日、セックス・ピストルズがテムズ・テレビの『Today』でビル・グランディの前で悪態をつき、パンクが全国の騒ぎになった。
      src: https://en.wikipedia.org/wiki/Today_(1968_TV_programme)
    - t: ヒップホップの誕生日とされる1973年8月11日、セジウィック通り1520番地のクール・ハーク。
      src: https://en.wikipedia.org/wiki/1520_Sedgwick_Avenue
    - t: シュガーヒル・ギャング『ラッパーズ・ディライト』（1979）。
      src: https://en.wikipedia.org/wiki/Rapper%27s_Delight
    - t: 1992年1月11日付のビルボード200で、ニルヴァーナ『ネヴァーマインド』がマイケル・ジャクソン『デンジャラス』を1位から降ろした。
      src: https://www.billboard.com/?p=8093902
    - t: 1995年8月14日、ブラーの『カントリー・ハウス』がオアシスの『ロール・ウィズ・イット』に勝って1位（ブリットポップ戦争）。
      src: https://en.wikipedia.org/wiki/Country_House_(Blur_song)
    - t: 『Loveless』（1991）の制作費25万ポンド説はメロディ・メイカーの推測で関係者は否定、シールズは「クリエイションはそれ以前から苦しかった」と反論。
      src: https://faroutmagazine.co.uk/loveless-how-my-bloody-valentine-made-a-massively-expensive-masterpiece/
    - t: フューチャー『Acid Tracks』（1987）とTB-303。
      src: https://en.wikipedia.org/wiki/Acid_Tracks
    - t: 2017年の研究（レヴェイエ＝ゴーヴァン）で、米トップ10のイントロは80年代半ばの約20秒から2015年には約5秒に。
      src: https://prsformusic.com/m-magazine/news/streaming-making-pop-songs-faster-shorter-new-study-reveals
    - t: 2024年4月からSpotifyは年間1,000再生未満の曲を録音原盤の分配から外した。
      src: https://musicbusinessworldwide.com/changes-to-spotifys-royalty-model-including-the-1000-annual-streams-royalty-policy-are-officially-live
    - t: Spotifyの音量正規化の既定は -14 LUFS。
      src: https://support.spotify.com/us/artists/article/loudness-normalization/
  ラジオとMV:
    - t: ペイオラ：1959〜60年の下院の調査。アラン・フリードは有罪、ディック・クラークは持ち株を手放して切り抜けた。以後DJから選曲権が取り上げられ、ペイオラは軽罪に。
