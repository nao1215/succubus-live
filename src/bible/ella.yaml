    - t: ビースティ・ボーイズ『Rhymin & Stealin』（1986）がレヴィーのドラムを使った。
      src: https://www.stereogum.com/2028283/led-zeppelin-when-the-levee-breaks-samples/franchises/breaks-with-tradition/
    - t: ベーシック・チャンネル（フォン・オズワルド、エルネストゥス）とダブ・テクノ。
      src: https://en.wikipedia.org/wiki/Basic_Channel
    - t: シェール『ビリーヴ』（1998）とオートチューン。開発者ヒルデブランドは石油探査の技術者。
      src: https://en.wikipedia.org/wiki/Auto-Tune
  ゲーム音楽:
    - t: ファミコンの2A03は矩形波2、三角波1、ノイズ1、DPCM1。
      src: https://www.nesdev.org/wiki/APU
    - t: DPCMの読み出しとコントローラー読み取りが重なると1ビット落ちて右が押される。PALの2A07で修正。
      src: https://www.nesdev.org/wiki/Standard_controller
    - t: 日本のファミコンはカートリッジから音を足せた（VRC6、VRC7、N163など）。『悪魔城伝説』日本版はVRC6、北米版は本体の音源だけ。
      src: https://www.nesdev.org/wiki/Expansion_audio
    - t: コナミのSCC（1987〜）はMSXのカートリッジの波形メモリ音源。『グラディウス2』『スペースマンボウ』。
      src: https://en.wikipedia.org/wiki/Konami_SCC
    - t: YM2612は6チャンネル目をDACに切り替えてPCMを鳴らせる。時間はZ80が管理。
      src: https://en.wikipedia.org/wiki/Yamaha_YM2612
    - t: スーパーファミコンのエコーはEDL×16ms（最大240ms）、1段2048バイト、最大30KB、64KBの共有メモリから取る。8タップFIR。
      src: https://nesdev.nes.science/f12/t6535.xhtml
    - t: Amigaの『Ultimate Soundtracker』（1987、カルステン・オバルスキ）がMODとトラッカーの始まり。4チャンネル。
      src: https://en.wikipedia.org/wiki/Ultimate_Soundtracker
    - t: 近藤浩治のGDC講演：時のオカリナのハイラル平原は12の節から8つを選んでつなぐ。SMWのヨッシーのドラム。
      src: https://www.gamedeveloper.com/game-platforms/gdc-koji-kondo-s-interactive-musical-landscapes
    - t: BotWの若井：野には音楽を置かない「環境BGM」、ピアノ。岩田：祠に近づく距離と音量を試した。片岡：昼夜の奥行き。
      src: http://nintendoeverything.com/breath-of-the-wild-composers-on-changing-up-zeldas-music-formula-and-more/
    - t: TotKの大橋：風の神殿の曲を最後の飛び降りから逆算した。
      src: https://www.zeldadungeon.net/tears-of-the-kingdom-composer-masato-ohashi-discusses-the-challenges-and-joys-of-creating-the-games-soundtrack/
    - t: すぎやまこういち『ドラゴンクエスト』（1986）、植松伸夫『ファイナルファンタジー』（1987）。
      src: https://en.wikipedia.org/wiki/Koichi_Sugiyama
    - t: 古代祐三『ベア・ナックルII』（1992）はPC-88で自作の環境を使って作曲。
      src: https://en.wikipedia.org/wiki/Yuzo_Koshiro
    - t: 田中宏和『メトロイド』（1986）。
