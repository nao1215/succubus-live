    - t: 初音ミクは2007年、ヤマハのVOCALOID。
      src: https://en.wikipedia.org/wiki/Hatsune_Miku
  ヒップホップと電子音楽:
    - t: アーメン・ブレイク（1969、ウィンストンズ）。G・C・コールマンは2006年に印税なしで死去。2015年の募金で約2万4千ポンドがスペンサーに。
