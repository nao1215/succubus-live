    - t: ビル・エヴァンス・トリオのヴィレッジ・ヴァンガード録音は1961年6月25日。スコット・ラファロは11日後に事故死。
      src: https://en.wikipedia.org/wiki/Sunday_at_the_Village_Vanguard
    - t: キース・ジャレット『ケルン・コンサート』（1975）は、用意されたはずのピアノとは違う、状態の悪い小型のピアノで弾かれた。
      src: https://en.wikipedia.org/wiki/The_K%C3%B6ln_Concert
    - t: ケニー・Gが1999年にアームストロングの『この素晴らしき世界』に自分の演奏を重ね、パット・メセニーが強く批判した。
      src: https://en.wikipedia.org/wiki/Kenny_G
  メタル:
    - t: ブラック・サバスのデビュー作は1970年2月13日（金曜）発売。表題曲の冒頭は三全音。
      src: https://en.wikipedia.org/wiki/Black_Sabbath_(album)
    - t: アイオミは17歳で工場の事故で指先を失い、洗剤の容器で指サックを作り、弦を下げて弾いた。
      src: https://en.wikipedia.org/wiki/Tony_Iommi
    - t: NWOBHMの語は1979年5月『サウンズ』誌、ミュージック・マシンでのサムソン、アイアン・メイデン、エンジェル・ウィッチの公演評。編集長アラン・ルイスの見出し、書いたのはジェフ・バートン。
