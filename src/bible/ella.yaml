    - t: 『ジャイアント・ステップス』は1959年5月アトランティック・スタジオ。B・G・E♭を長三度で巡るコルトレーン・チェンジズ。フラナガンは「和音は問題なかった、あの速さとは知らなかった」。
      src: https://en.wikipedia.org/wiki/Giant_Steps_(composition)
    - t: 『カインド・オブ・ブルー』（1959）は30丁目スタジオ。最初のセッションでテープ機が遅く回り、A面3曲が約四分の一音高く出回った。
