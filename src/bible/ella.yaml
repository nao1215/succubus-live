    - t: ブルーノート盤の溝の外にRVGの刻印。
      src: https://en.wikipedia.org/wiki/Rudy_Van_Gelder
    - t: マイルス『ビッチェズ・ブリュー』（1970）はテオ・マセロがテープを切り貼りして構成した。
      src: https://en.wikipedia.org/wiki/Bitches_Brew
    - t: オーネット・コールマン『フリー・ジャズ』（1960年12月録音）は二つのカルテットを左右に分けた。
