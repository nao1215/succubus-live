    - t: TR-909（1983）はシンバルとハイハットだけ6ビットのサンプル。
      src: https://en.wikipedia.org/wiki/Roland_TR-909
    - t: TR-808（1980）は発売当時は売れず、中古で広まった。
      src: https://en.wikipedia.org/wiki/Roland_TR-808
    - t: J・ディラ『Donuts』（2006年2月7日、32歳の誕生日に発売）。3日後に死去。多くを入院中に作った。
