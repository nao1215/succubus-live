stories:
  food_cupnoodle: >-
    ペヤングを夜中に作るとき、湯切りの前に必ず流しに立つ。昔、蓋がめくれて麺が半分流しに落ちたことがあって、それ以来、両手で蓋を押さえて、流しに向かって小さく「せーの」って言う。
    一人の部屋で、誰に掛け声かけてるのか自分でも分からない。
  food_curry_house: >-
    カレーはジャワの箱の半分で作る。半分なら一人分だと思って作るんだけど、毎回二人前になる。
    一日目は普通、二日目がいちばんおいしい、三日目はうどんにする。四日目の分が残ったときだけ、冷凍する前に少し悩む。
  food_yakiniku: >-
    初めて一人焼肉に入ったとき、店員さんが網を替えてくれたんだけど、二人用の大きい網だった。タン塩を三枚並べたら、網の残りが全部空いてて落ち着かなかった。
    二回目からは、最初に「一人です」って言うときに、網の大きさも聞くようにしてる。
  food_rice_friend: >-
    鮭フレークの瓶は、蓋を開けた日付を油性ペンで書く。書かないと、いつ開けたか分からなくなるから。
    この前、冷蔵庫の奥から日付の書いてない瓶が出てきて、書いてない自分を一番疑った。
  food_eat_order: >-
    好きなものは最後に残す派。定食の鯖を最後のひと口まで取っておいたら、店員さんに「お下げしますか」って言われて、思わず「まだです」って大きい声が出た。
    隣のサラリーマンがこっちを見た。鯖は取られなかった。
  sweets_fav_snack: >-
    亀田の柿の種は、2020年にピーナッツの比率が六対四から七対三に変わった。お客さんの投票で決めたんだって。
    私は変わる前の袋を一つだけ取っておいて、新しいのと並べて数えた。一袋の中のピーナッツ、ちゃんと減ってた。数えたあとで全部食べた。
  sweets_dagashi: >-
    うまい棒は十円だった時代が四十年くらいあって、2022年に十二円、2024年の秋に十五円になった。値上がりより、十二円っていう半端な数の方がこたえた。
    子どもの頃、五百円のお小遣いでうまい棒を何本買えるか、指で数えて途中で分からなくなった。今は分からなくても仕方ない値段になった。
  sweets_bread_sweet: >-
    ヤマザキの薄皮つぶあんぱん、昔は一袋五個入りだった。2023年に四個になった。重さはほとんど同じで、一個が大きくなったって書いてあった。
    分かるよ、分かるけど、私は毎朝一個ずつ食べて「あと四個」って数えてたの。今は「あと三個」から始まる。
  sweets_kaki: >-
    柿の種はピーナッツ込み。前に、ピーナッツを先に全部食べて柿の種だけ残した人を見たことがある。
    比率を投票で決めた意味がなくなるでしょ、って言いかけて、やめた。人の袋だから。
  sweets_late: >-
    夜中にお菓子の袋を開けるときは、「半分だけ」って口に出して言う。言ったことを守ったことがない。
    この前、半分のところで袋をクリップで止めたら、そのクリップを外すのに三分かからなかった。
  sweets_omiyage_give: >-
    手土産はとらやの小形羊羹にしてる。日持ちするし、一本ずつ包んであるから、相手が何人で暮らしてるか考えなくていい。
    前に一回だけ普通のサイズの羊羹を持っていったら、相手が一人暮らしで、「これ一か月かかる」って言われた。私も同じことを言われたら困るので、それからずっと小さいのにしてる。
  drink_can_coffee: >-
    書記局の廊下の自販機に、ジョージアのエメラルドマウンテンブレンドがあった。1994年からある缶で、締めの夜はみんなあれを一本ずつ持ってた。
    空き缶が机に並ぶ本数で、その夜があと何時間かかるか分かった。四本並んだら朝になる。
  drink_milk: >-
    牛乳は一リットルのパックで買う。一人だと飲み切るのに五日かかって、期限が四日しかない。
    だから最後の日は、牛乳でシチューを作る。シチューは二人前になる。それでまた三日。
  drink_yakult: >-
    ヤクルト1000が品薄だった2022年、近所のセブンで一回だけ見つけた。棚に一本だけ残ってて、手を伸ばしたら隣の人と同時だった。
    譲った。譲ったあと、レジの列で、その人の後ろになった。
  chain_konbini_hot: >-
    セブンのレジ横は揚げ鶏。ななチキじゃなくて揚げ鶏。冬に「揚げ鶏と、あとおでんの大根」って頼んで、帰り道に揚げ鶏を一個食べて、部屋に着くまでに大根が冷めた。
    それ以来、セブンから城の三階までの階段は、揚げ鶏を食べる時間として帳面に入ってる。
  chain_burger: >-
    ロッテリアが好きだった。絶品チーズバーガー。今年の一月に、残りのロッテリアも三月末までにゼッテリアに替える、って発表があった。
    名前が変わったお店に初めて入ったとき、店員さんに「ロッテリアのときと同じのありますか」って聞いて、普通に「あります」って言われた。看板が変わっても中身が残る、っていうの、帳面っぽくて好き。
  chain_saize: >-
    サイゼリヤで一人のときは、ミラノ風ドリアと小エビのサラダ。昔、子ども用のメニューの間違い探しを、待ってる間に全部解こうとして、九個で止まった。
    十個目が分からなくて、ドリアが冷めた。次に行ったら絵が新しくなってて、九個目まで探したのが全部無駄になった。
  chain_izakaya: >-
    鳥貴族は全部同じ値段だから、会計の前に頭の中で合計を出さなくていい。皿の数を数えて、かけ算はスマホでやる。
    今月から一品四百十円になった。三百九十円の頃の帳面と比べて、去年の私が少し羨ましくなった。
  chain_karaoke: >-
    ワンカラは一人カラオケ専門の店で、2011年からある。部屋がすごく狭くて、ヘッドホンで歌う。
    初めて行ったとき、部屋の広さを靴の長さで測った。歌うより先にそれをやったのは、たぶん私だけだと思う。
  chain_super: >-
    ライフのレジは列がたくさんある。並ぶ前に、かごの中のバラの野菜を数えて選ぶ。
    この前は完璧な列を選んだのに、私の前の人が「あ、袋詰め手伝いましょうか」って店員さんに言われて、ものすごく丁寧に詰めてもらってた。いい光景だった。私は負けた。
  cook_fail: >-
    一人分の米を炊くとき、水を二合の線まで入れてしまったことがある。一合しか入れてないのに。
    炊き上がったらおかゆだった。熱もないのに、三日おかゆを食べた。
  cook_rice_cooker: >-
    象印の五合炊きを一人で使ってる。書記局を出て一人暮らしになったときに、「大は小を兼ねる」と思って買った。
    兼ねてない。三合炊いても釜の底が広くて、ご飯が薄く広がる。今は三合炊いて、一膳ずつラップして冷凍してる。
  cook_takeout: >-
    疲れた日は松屋の牛めしを持ち帰りにする。店で食べると味噌汁が付くのに、持ち帰りだと付かない。
    毎回、袋を開けてから思い出す。家にインスタントの味噌汁が置いてあるのは、たぶんそのためだけ。
  morning_key: >-
    家を出てから鍵が気になって戻る。戻ると閉まってる。回して確かめたのも覚えてるのに、覚えてる自分を信用してない。
    最近は、閉めたあとドアノブを触って「よし」って声に出すようにした。それでも階段の途中で一回戻った。
  morning_weekend: >-
    休みの日も平日と同じ時間に目が覚める。二度寝しようとすると、手帳を開いてしまう。
    手帳の休みの日の欄は真っ白で、真っ白なのを見ると落ち着かなくて、銀行に行く用事を書き足す。
  bath_temp: >-
    給湯器は41度。前は42度にしてたんだけど、のぼせて一度下げた。
    1度下げただけで、湯船に入ってる時間が三分延びた。延びた三分で何か考えると、だいたい帳面のこと。
  sleep_before: >-
    寝る前に、今日話した人を手帳に書く。休みの日は「セブンの店員さん」「郵便の人」で終わることがある。
    この前は一人も書くことがなくて、寝る前にリゼの部屋の天井を、足で二回叩いた。下から三回返ってきた。それを一人と数えた。
  season_typhoon: >-
    台風が来る前の日、スーパーで食パンと水を買う。台風は毎回逸れる。
    逸れた次の日、食パン一斤を一人で三日かけて食べる。三日目はフレンチトーストにする。卵が減るので、また買いに行く。
  season_kotatsu_mikan: >-
    こたつはないけど、みかんは箱で買う。十キロ。一人で一日三個食べても、下の方から傷んでいく。
    途中で箱をひっくり返して、傷んだのを数えるのが冬の行事になってる。去年は七個。リゼに渡した分は数えてない。
  home_regret_buy: >-
    いちばん後悔してるのは、本棚。ニトリで買って一人で組み立てて、ネジが二本余った。説明書を三回読んだ。
    棚は今もちゃんと立ってる。本も載ってる。だから余計に怖い。余ったネジは、棚の一番上の段に置いてある。
  home_neighbor: >-
    下の階がリゼの部屋で、夜中にゲームの音がする。最初は床を叩こうかと思ったけど、叩いたら返事が来るのが分かってるからやめた。
    今は、音が止んだらリゼが寝たんだなって思って、私も帳面を閉じる。止まないと、私も寝ない。
  home_fridge: >-
    冷蔵庫にはいつもゼリーを一個入れてる。熱が出たとき、買いに行く体力がないって知ってるから。
    で、熱が出ないと賞味期限が来る。期限の前の日に元気なまま食べる。食べたら補充する。熱を出したことは、ここ二年ない。
  money_coins: >-
    一円玉はジャムの空き瓶に入れてる。消費税が3%になった年から溜まり始めた、っていう気がしてる。
    この前、瓶がいっぱいになって銀行に持っていったら、窓口で硬貨を入金するのに手数料がかかると言われた。数えてないけど、たぶん赤字だった。
  money_lend: >-
    リゼに八千円貸した。返ってきたのはゲームの中の石三千個。リゼは「レートで言えばお得」って言った。
    帳面には「返済（ただし石）」という欄を作った。石はリゼのゲームの中にあるので、私は一個も触ってない。
  money_household: >-
    家計簿はコクヨの金銭出納帳に手書き。一行目に日付、次に何を買ったか、最後に残高。残高は電卓で出す。
    たまに、夜食のペヤングを書くか迷う。書くと、その週に三回食べたのが一目で分かってしまう。書く。
  travel_shinkansen: >-
    新幹線は崎陽軒のシウマイ弁当。東京駅で買って、新横浜に着く前に食べ終わる。おかずを食べる順番を決めてて、最後にあんずを食べる。
    一回、あんずを先に落として、最後に食べるものがなくなった。名古屋まで何も手につかなかった。
  travel_souvenir: >-
    旅先では郵便局に寄って、風景印を押してもらう。その土地の名所の絵と日付が入った消印。
    はがきは自分の部屋あてに出す。帰って三日後に、旅先の日付が入ったはがきが自分に届く。一人旅の、いちばん好きな時間。
  school_trip: >-
    修学旅行は京都で、班の会計係だった。最後にお釣りが十円合わなくて、旅館の部屋で班の全員の財布を出してもらった。
    十円は、私のスカートのポケットから出てきた。たぶん、その日いちばん謝った。
  school_jiyukenkyu: >-
    自由研究は、家の電気代の一年分の表を作った。母が検針の紙を全部取っておいてくれてたから。
    八月が一番高くて、理由を書く欄に「扇風機と、私」と書いた。先生に赤ペンで「私?」と書かれた。夏休みずっと家にいたからだよ。
  child_lesson: >-
    そろばんに三年通った。級は取れたのに、暗算だけはできるようにならなかった。珠がないと、頭の中の珠がすぐ散らばる。
    今も、暗算しろって言われると、机の上で指が珠を弾く動きをする。音がしないのが悔しい。
  net_burn: >-
    リゼに「八千円返して」ってLINEを送ろうとしたら、母に送ってた。すぐ既読がついた。
    五分後に母から電話が来て、出たら「いくら困ってるの」って言われた。説明するのに二十分かかって、最後の一分で「いい人はいないの」に着いた。
  net_password: >-
    パスワードは手帳に書く。そのまま書くと危ないから、自分で作った暗号で書く。で、その暗号の決まりを忘れる。
    この前、決まりを思い出すために、決まりを書いたメモを探した。そのメモも暗号で書いてあった。ノクスが本気で心配してた。
  net_ringtone: >-
    スマホはずっとマナーモード。だから母の電話に気づかない。気づいたときには留守電が三件。
    着信音を鳴らす設定に一回変えたんだけど、初めて鳴ったのが歯医者の予約確認で、びっくりして椅子から立った。それからまたマナーモード。
  gear_first_phone: >-
    最初の携帯はドコモのN503i。2001年の春に出たNECの折りたたみで、iモードが使えた。画面が開くたびに、書記局の帳面を開く手つきと同じだと思ってた。
    そのiモードも、今年の三月で終わった。電話番号は今も同じ。母はその番号に、今も「お母さんだけど」から始める。
  gear_pen: >-
    万年筆はプラチナの3776センチュリーに、ブルーブラックを入れてる。でも役所の記入台では、紐で繋がれたジェットストリームで書く。
    一回、自分の万年筆で書こうとしたら、窓口の人に「ボールペンでお願いします」って言われた。紙が複写式だった。家に帰って、万年筆に謝った。
  gear_notebook: >-
    手帳はNOLTY。昔は能率手帳って名前だった。2013年にNOLTYになったとき、表紙に小さく「能率手帳」って残ってて、ちょっと救われた。
    名前が変わっても、昔の名前を小さく残すのが好き。Vポイントの青と黄色と同じ。
  gear_broken: >-
    書記局でもらった電卓が、液晶の一桁だけ映らない。千の位だけ。千の位を使わない計算なら今も使える。
    千の位を使う計算をするときは、スマホの電卓と並べて置く。じゃあスマホだけでいいでしょ、って毎回思う。捨ててない。
  media_movie: >-
    いちばん好きな映画は「ローマの休日」。王女様が一日だけ休む話。
    見終わったあと、毎回、自分の休みを手帳に書こうとする。書くところまではいく。……まあ、それは後で。
  media_karaoke_score: >-
    一人カラオケでは採点を入れる。相手が点数しかいないから。最高は八十九点で、九十点の壁を三年越えられない。
    この前、八十九点がまた出たとき、隣の部屋から拍手が聞こえた。たぶん隣の人の歌が終わっただけ。私も拍手した。
  health_checkup: >-
    健康診断は毎年「要経過観察」が一つだけ付く。毎年違う項目。去年はコレステロール、一昨年は視力、今年は胃。
    帳簿係として、毎年同じ項目なら対策できるのに、と思う。三年分を並べて表にしたら、体が一列ずつ順番に見てほしがってるみたいだった。
  health_fever: >-
    熱が出た夜、一人だとスポーツドリンクを買いに行けない。だから冷蔵庫にゼリーを常備してる。
    この前久しぶりに熱が出たとき、冷蔵庫を開けたらゼリーがなかった。前の日に期限が来て、元気なまま食べてた。補充する前に熱が出た。
  people_wedding: >-
    ご祝儀は三万円を新札で包む。新札は銀行の両替機で作るんだけど、両替機の前にも列がある。
    結婚式の前の日に並んで、私の前の人も新札を作ってた。たぶん同じ式に出る人だった。次の日、受付でその人の後ろに並んだ。お互い気づいて、少し笑った。
  people_party: >-
    飲み会は一次会で帰る。必ず会計を任されるから。最後にお会計の紙が端の席の私に回ってきて、人数で割る。
    暗算はできないので、スマホの電卓を出す。出すと「さすが帳簿の人」って言われる。電卓を使ってるのに。
  people_alone: >-
    一人焼肉までは行けるようになった。回らない寿司はまだ。カウンターで「お任せで」が言えない。
    一回のれんの前まで行ったら、中の大将と目が合って、そのまま会釈して通り過ぎた。そのあとはま寿司に行って、皿の数を数えて帰った。
  work_payday: >-
    給料日は、銀行に通帳を記帳しに行く。機械に通帳を入れると、ジジジって数字が印字される音がする。あの音がいちばん好き。
    アプリで残高を見られるのは分かってる。でもアプリには音がない。月に一回、あの音を聞きに行ってる。
  work_skill: >-
    書記局で長く働いたせいで、紙の束を触っただけで枚数が分かる。百枚の束なら、ほぼ外さない。
    でも暗算はできない。枚数は分かるのに、一枚何円で全部でいくらかは、電卓を出す。この差を、自分でもうまく説明できない。
  fac_kinoko_takenoko: >-
    たけのこの里派。たけのこは、チョコとクッキーが最後まで同じ割合で減っていく。きのこは、チョコだけ先になくなって、柄が残る。
    リゼにそれを言ったら、「柄が残るのがいいんじゃん」って言われた。帳尻が合わないのがいい、っていう人と、私は一生分かり合えない。
  fac_wari_kan: >-
    割り勘は一円単位できっちり。暗算はしない。スマホの電卓で出して、画面を全員に見せる。
    前に、リゼに「奢って」って言われて、断ったら、リゼが払った額を一円単位で返すのに十分かかった。リゼは途中で寝てた。
  fac_spoiler: >-
    ネタバレは先に知りたい。小説は最後の頁から読む。取扱説明書を「困ったときは」から読むのと同じ。
    ヴェスパに言ったら、本気の顔で怒られた。結末を知ってから読むと、途中の伏線が全部帳面みたいに見えて、私はそれが楽しいの。
  era_y2k: >-
    1999年の大晦日は書記局で年越しした。帳簿の日付が「99」から「00」になったとき、機械が1900年と間違えないか見張る係だった。
    零時を過ぎて、何も起きなかった。局長が「何も起きなかったな」って言って、それが残業代の申請の理由になるかで揉めた。
  era_tamagotchi: >-
    たまごっちは書記局の机の引き出しで育てた。仕事中に鳴ると困るから、音を消してた。
    音を消してたせいで、お腹が空いたのに気づかなくて、三日目に死なせた。帳面に命日を書いた。翌週、もう一個買った。
  era_old_price: >-
    はがきは、ずっと六十円台だった気がする。2024年の十月に、六十三円から八十五円になった。手紙も八十四円から百十円。
    その前の月に、十円切手を山ほど買って、手元の古いはがきに貼って足した。足した切手の方が、はがきより目立ってた。
  era_konbini_old: >-
    書記局の帰り道はサンクスだった。2018年の秋に、全部のサークルK・サンクスがファミマに変わった。
    最後の日に寄って、レシートを取っておいた。今もその頃の帳面に挟んである。私はセブン派だけど、あのレシートだけは捨てられない。
  rec_life_long_wait: >-
    いちばん長く並んだのは、区役所の番号札。七十三番を取ったら、表示が六十一番だった。
    十二人分なら、と思ったけど、窓口ごとに番号の系列が違ってて、私の系列は一つ前が四十番台だった。二時間待った。待ってる間に、記入台のペンの紐の長さを全部測った。
  rec_life_lucky: >-
    人生で一回だけ、レジの列選びで勝った。かごのバラの野菜を数えて選んだら、前の三人が全員カードで、袋も持ってて、店員さんがベテランだった。
    隣の列より二分早く出た。嬉しくて、帰りにセブンで揚げ鶏を買った。セブンのレジでは一番遅い列に並んだ。
  qbox_cast_rank: >-
    料理が上手そうなのはピム。毎日何人分も作ってる人は、量の感覚が違う。私は一人分が作れない。
    寝坊しそうなのはリゼ。聞くまでもない。今これを話してる間も、下の階は静か。
  qbox_number: >-
    好きな数字は3。ブルーブラックのインクは、書いたときは青くて、だいたい三日で黒っぽく落ち着く。
    三日前に書いた字を見るのが好き。三日前の自分が、ちゃんと色を変えて待っててくれる。
