stories:
  food_fav: >-
    ニラレバを家で作るとき、レバーを〇・一グラムまで量って下処理を三十分しました。町中華の跡取りさんに写真を見せたら「うちの父、量ってないよ」と言われました。
    夫は横から火を全開にして、もやしを全部焦がしました。家族の評価は夫の勝ちでした。
  food_curry_house: >-
    甘口のカレーに、自分の皿だけ一味を足します。一回〇・二グラムと決めて、はかりに小皿をのせて量ります。
    ある日娘が真似をして自分の皿に一味を振り、泣いて牛乳を一杯半飲みました。それ以来、一味は娘の手の届かない棚の三段目です。
  food_bento: >-
    峠の釜めしの器を三つ取ってあります。一つは娘の砂場用、一つはご飯を一合炊けるか試した用、一つは何にも使っていません。
    使っていない一つを捨てようとしたら、夫に「それは計画書の付録だろ」と言われて、捨てられなくなりました。
  food_local: >-
    行田のゼリーフライを保育園のママ友に勧めたら、ゼリーを揚げると思われて引かれました。おからのコロッケみたいなもので、小判の形だから「銭フライ」がなまった説があると説明したら、三分かかりました。
    最後に「衣は付いてません」と言ったら、余計に分からなくなっていました。
  food_rice_amount: >-
    家族の茶碗の量を決めています。わたしは百五十グラム、夫は二百五十グラム、娘は八十グラムです。
    夫は量ったあとにもう一杯よそいます。量った意味を聞いたら「最初の一杯がうまい」と言われました。
  food_mayo: >-
    夫は唐揚げにマヨネーズをかけます。まんぷく亭で毎朝揚げている唐揚げをお土産に持って帰ると、目の前でかけます。
    揚げた人の前でかける勇気がすごいと思います。でも娘も真似してかけるようになって、二対一で負けています。
  sweets_kaki: >-
    亀田の柿の種が6対4から7対3に変わったとき、本当に変わったか一袋数えました。柿の種が百十二粒、ピーナッツが三十八粒でした。
    重さの比べなので数では合わないと気づいたのは、数え終わったあとです。夫はそのあいだにピーナッツだけ食べていました。
  sweets_ice: >-
    雪見だいふくは二個入りなので、娘と一個ずつ分けます。ところが娘は自分の一個を半分食べたところで、わたしの一個を見ます。
    結局わたしは一個半を娘に渡して、半分を食べています。二個入りなのに、わたしの取り分は毎回半分です。
  sweets_konbini: >-
    雑費の欄の七割がコンビニスイーツです。中でも夏はミニストップのハロハロで、1995年からあると知って「歴史があるから雑費じゃない」と言い張ったことがあります。
    夫に「じゃあ何費？」と聞かれて、答えられませんでした。翌月も雑費に付けました。
  sweets_donut: >-
    ミスドでは娘がポン・デ・リングを選びます。丸が八つつながっていて、娘は一個ずつちぎって数えながら食べます。
    「はち！」まで数えたら終わりのはずが、最後の一個をわたしにくれます。毎回くれるので、わたしのエンゼルフレンチはいつも半分しか食べられません。
  sweets_gummy: >-
    果汁グミを娘と分けるとき、一粒ずつ「ママ、ミミ、ママ、ミミ」と配ります。奇数だった日、最後の一粒を半分にかじって渡したら、怒られました。
    「ちぎったのはママの分」と言われました。正しい分け方を、娘の方が先に決めていました。
  drink_tea_bottle: >-
    十六茶はカフェインゼロなので、娘と同じボトルで飲めます。ただ娘は飲み口をくわえたまま話すので、半分くらい戻ってきます。
    わたしの分のボトルを別に買ったら、娘はわたしのボトルの方を飲みます。結局二本とも娘のものです。
  drink_tapioca: >-
    2019年の夏に一回だけタピオカに並びました。五十分並んで、ガルドと半分ずつ飲みました。
    ガルドはストローで一気にタピオカを吸って、喉に詰まらせかけました。門番が咳き込んでいる横で、わたしはタピオカの数を数えていました。三十一個でした。
  chain_konbini: >-
    ミニストップのイートインで、娘とソフトクリームを半分こします。わたしがスプーンで上半分を娘のカップに移すと、娘はコーンの方を欲しがります。
    コーンを渡すと、上のソフトもついて行きます。わたしの手には、空のカップが残ります。
  chain_famires: >-
    バーミヤンは偵察先です。チャーハンを頼んで、パラパラの具合と、米一粒あたりの油を見ます。
    娘が「パパのとおなじ」と言ったので、メモに「夫の味＝バーミヤン級」と書きました。褒めているのかけなしているのか、自分でも分かりません。
  chain_indie: >-
    城下の町中華の伝票を集めています。ある店のおばあさんは、ニラレバを「ニレ」と書きます。
    この前、跡取りさんに「うちの父はチャーハンを『チャ』の一文字です」と教えてもらいました。コレクションが一つ増えて、その日の配信は伝票の話だけで終わりました。
  chain_costco: >-
    コストコに一回だけ行きました。ディナーロールを買って、家に帰って冷凍庫を開けたら、ふるさと納税の豚が入っていました。
    ロールを一個ずつ袋に入れて、冷蔵庫の野菜室に詰めました。その週、野菜はベランダの段ボールで暮らしました。
  cook_frozen: >-
    ニチレイの本格炒め炒飯を買って、夫のチャーハンと並べて娘に出しました。どっちが美味しいか聞いたら、娘は両方を混ぜて食べました。
    比べる実験のはずが、新しい料理ができました。夫は「合作だな」と言いました。
  cook_fail: >-
    卵焼きを作るとき、砂糖を六グラム、ちゃんと量りました。量ったのは塩でした。
    はかりが正しくても、入れ物を間違えると意味がありません。それ以来、砂糖と塩の容器に大きく字を書いています。
  cook_tool: >-
    キッチンスケールは二台目です。一台目は落として、表示が「8888」のまま動かなくなりました。
    二台目は夫が誕生日にくれました。花でもアクセサリーでもなくはかりで、わたしは今までで一番喜びました。夫はそれ以来、プレゼントに迷うと台所用品を買ってきます。
  cook_mom: >-
    母のカレーは毎回味が違いました。ある日は甘くて、ある日は辛くて、ある日はなぜかおでんの味がしました。
    分量を聞いたら「冷蔵庫にあるだけ」と言われました。わたしが全部量るようになったのは、たぶんこの日からです。
  cook_egg: >-
    ゆで卵は七分と決めています。八分だと娘は「かたい」と言い、六分だと黄身が口のまわりについて、服まで汚れます。
    七分の卵を出したら、娘は白身だけ食べて黄身をわたしの皿に置きました。何分でも、黄身はわたしの分です。
  morning_alarm: >-
    パートの日は四時五十分に起きます。アラームは一個で、二個目を四時五十五分にかけています。
    一回、夫がわたしのアラームを止めて「寝かせてあげた」と言いました。その日は唐揚げの仕込みが十分遅れて、店長の顔が十二月みたいに曇りました。
  bath_onsen: >-
    結婚前に伊香保に行って、石段を数えながら上りました。三百六十五段あると聞いていたのに、わたしは四百三段まで数えました。
    2010年に下に足された三十八段まで数えていたと、あとで知りました。ガルドは途中で数えるのをやめて、温泉まんじゅうを食べていました。
  bath_salt: >-
    バブを入れると、娘が溶けるまでずっと見ています。溶け終わるまで湯船に入らないので、毎回五分くらい二人で洗い場で待ちます。
    冬は寒いので半分に割って入れたら、二回見られると娘が喜びました。それ以来、一個を半分ずつ使っていて、一箱が倍もちます。
  sleep_sheep: >-
    眠れないとき、羊ではなく冷凍庫の中身を数えます。豚こま三パック、ひき肉二パック、鮭四切れ。
    数えているうちに献立が決まって、決まると眠れなくなります。逆効果だと分かっているのに、やめられません。
  sleep_talk: >-
    寝言で「出席確認しました」と言っていたそうです。夫が「誰の？」と聞いたら、「ガルドさん、遅刻です」と答えたそうです。
    夫はそのあと、さん付けで呼ばれたので布団の上で正座したそうです。わたしは何も覚えていません。
  season_matsuri: >-
    夏祭りのベビーカステラは十二個入りなので、三人で四個ずつ分けます。なのに袋を開けると、毎回十三個か十四個入っています。
    おまけの分を誰が食べるか、毎年家族で揉めます。去年はじゃんけんで、わたしは最初にグーを出して負けました。
  season_halloween: >-
    ハロウィンに娘の衣装を作りました。娘は人間の子の仮装がしたいと言うので、まず角を隠す帽子を作りました。
    どんぐりくらいの角でも、帽子が三回浮きました。最後は毛糸の帽子を二枚重ねて、汗だくの人間の子ができました。
  home_best_buy: >-
    ラベルライターを買って、保育園の持ち物に名前を印刷しました。一晩で百二十枚。前の年は全部手書きでした。
    うれしくて、調味料の容器にも、夫のマグカップにも貼りました。夫は自分の枕に「ガルド」と貼られているのを見て、黙ってはがしました。
  home_laundry_fold: >-
    夫が洗濯物をたたんでくれた日、わたしは全部たたみ直しました。タオルの三つ折りが四つ折りだったからです。
    次の週から夫はたたまなくなりました。やらなくなった理由の半分はわたしだと、ちゃんと分かっています。
  home_storage: >-
    押し入れの奥に、娘の新生児のときの肌着が十二枚あります。もう着られないのに、たたみ直して箱に戻すのを年に二回やっています。
    この前、娘が一枚を見つけて「ちっちゃい」と笑いました。そのあと自分のぬいぐるみに着せていました。
  money_household: >-
    家計簿は一円まで合わせます。先月、三円合わない日があって、夜中に財布とレシートを全部出しました。
    三円は娘の貯金箱の中にありました。十円玉を入れたつもりが、一円玉だったんです。
  money_furusato: >-
    豚肉の返礼品が三つの町から同じ週に届いて、冷凍庫が豚で埋まりました。あれから届く月をずらしています。
    今年はずらしすぎて、十二月に頼んだ豚と、九月に頼んだ鶏が、どっちも三月に届きました。また冷凍庫が埋まって、第八十八条の二ができました。
  money_secondhand: >-
    メルカリで娘のサイズ80の服を売りました。一枚三百円で、送料を引くと手元に残ったのは九十円でした。
    それでも家計簿に「収入」と書けるのがうれしくて、十枚売りました。合計九百円で、ハロハロを一個買いました。雑費です。
  travel_want: >-
    喜多方の計画書は第七版です。坂内食堂は朝七時に開くので、始発に乗ればちょうど開店の時刻に着くように組んであります。
    この前、夫が冷蔵庫に貼った計画書の時刻のところに、鉛筆で小さな丸を付けていました。何の丸かは聞いていません。
  travel_sleep_through: >-
    高校生のとき、電車で寝過ごして熊谷まで行きました。財布に二百八十円しかなくて、帰りの運賃が足りるか、ホームで三回数えました。
    結局足りて、母に電話もしないで帰りました。家に着いたら母は普通に夕飯を作っていて、ちょっと寂しかったです。
  school_jiyukenkyu: >-
    小学四年の自由研究で、団地の階段の段数を全部の棟で数えました。八棟あって、一棟だけ二段多かったんです。
    先生に「なんで多いの」と聞かれて、答えられませんでした。今でも母に会うと、その棟の前を通るたびに数えます。
  school_baito: >-
    高校のとき、ヤオコーでレジを打っていました。お釣りを数えるのが店で一番速いと言われて、うれしくて毎日速さを測っていました。
    ある日速すぎて、お客さんに五百円多く渡しました。追いかけて返してもらって、その日から速さより正しさを測るようになりました。
  child_toy: >-
    シルバニアファミリーの家で、家具の配置を毎日決め直していました。台所はここ、寝室はここ、と紙に書いて家の横に貼りました。
    いとこが遊びに来て全部動かしたとき、泣いて紙を指さしました。今、娘が冷蔵庫の献立表を指さして笑っているのを見ると、血だなと思います。
  era_tamagotchi: >-
    たまごっちは学校に持って行けなかったので、母に預けていました。帰ったら死んでいました。母は「ちゃんと見てたよ」と言いました。
    あとでボタンの押し方を母は知らなかったと分かりました。見ているだけでは育たないと、そのとき知りました。
  child_otoshidama: >-
    子どもの頃、お年玉は母に「預かる」と言われました。わたしはノートに金額を書いて、毎年合計を出していました。
    今、娘のお年玉を同じように預かっています。娘はまだ数字が読めないのに、わたしのノートをのぞいて「ミミのぶん、ある？」と聞きます。あります。全部書いてあります。
  net_burn: >-
    保育園のクラスのグループLINEに、夫への連絡を送ってしまいました。「牛乳とトイレットペーパー。あと靴下は裏返さないで」。
    十秒で消しましたが、既読が四つ付いていました。次の日、送りのときに一人のお母さんに「うちもです」と小声で言われました。
  net_photo: >-
    スマホの写真が二万枚あって、九割が娘です。わたしが写っているのは、娘が勝手に撮った鼻の穴のアップくらいです。
    この前、娘が生まれた日の写真を見返したら、わたしが写っているのは一枚だけでした。だから最近は夫にスマホを渡して「わたしも入れて」と言っています。
  gear_first_phone: >-
    最初のケータイはauのペンギンのやつでした。待ち受けのペンギンが好きで、機種変更のときに手放すのが嫌で泣きました。
    今もauなのは家族割のためと言っていますが、半分はあのペンギンのせいだと思います。
  gear_notebook: >-
    家の規則帳は今、キャンパスノートの八冊目です。一冊目の第一条は「リゼ様を起こさない」でした。
    この前、娘が一冊目を見つけて、第一条の横にクレヨンでリゼ様の絵を描きました。条文より絵の方が分かりやすくて、少し悔しかったです。
  media_m1: >-
    M-1は毎年、娘を寝かしつけたあとに録画で見ます。2019年のミルクボーイは、ガルドと付き合い始めた年で、二人で並んで生で見ました。
    次の日から夫と「それはコーンフレークやないかい」をやり合っていました。今は娘が「やないかい」だけ言います。何のことかは知りません。
  media_cry: >-
    『ラヴ・ユー・フォーエバー』を娘に読むと、毎回同じページで声が出なくなります。娘は慣れていて、わたしが止まるとページを自分でめくります。
    最近は、止まる前に娘がめくるようになりました。気を使われているのか、早く先が見たいのかは、分かりません。
  media_karaoke_song: >-
    十八番は「おジャ魔女カーニバル!!」です。1999年に始まったアニメで、わたしは毎週見ていました。
    保育園の保護者の打ち上げで歌ったら、若いお母さんたちは知らなくて、先輩のお母さんだけ一緒に踊ってくれました。年が分かると言われました。
  health_age: >-
    保育園の運動会の親子競技で、娘を抱えて走りました。次の日は平気で、二日後に脚が動かなくなりました。
    筋肉痛が二日遅れて来るのを、初めて自分の体で確かめました。娘はその日、わたしの階段の降り方を真似して、ずっと笑っていました。
  health_hiccup: >-
    しゃっくりは水を七口で止めます。七口目までに止まらないと、もう一回最初から七口です。
    娘にやらせたら、三口目で水を噴きました。しゃっくりは止まりました。床は止まりませんでした。
  people_date: >-
    理想のデートは、町中華で二人とも熱いうちに食べ終わることです。結婚記念日に娘を義母に預けて行きました。
    ラーメンが来て五分で、義母から「ミミちゃん、ママって泣いてる」と電話が来ました。走って帰ったら、娘はもう寝ていました。ラーメンは伸びていました。
  people_fight: >-
    夫と喧嘩すると、わたしから謝ります。ただ謝る前に、同じことでまた喧嘩しないように条文を一つ作ってしまいます。
    「ごめんなさい、それで第九十二条ですが」と言ったら、夫に「謝ってるのか法律を作ってるのか」と言われました。両方です。
  work_worst_job: >-
    年末のまんぷく亭は、オードブルの唐揚げを朝から四百個揚げます。四百個目を数えたところで、店長が「あと百個追加」と言いました。
    その日、家に帰ったら夫が晩ご飯に唐揚げを買ってきていました。悪気がないのは分かっていたので、黙って三個食べました。
  work_skill: >-
    唐揚げを見ただけで何グラムか分かります。誤差は五グラムです。
    まんぷく亭の新人さんに見せたら「すごい」と言われて、規則にないので固まりました。三拍あとに小さく「うれしいです」と言ったら、新人さんも固まりました。
  fac_kinoko_takenoko: >-
    わたしはきのこの山派で、娘はたけのこの里派です。夫は両方好きと言うので、どっちにも数えていません。
    箱を二つ買うと家計簿の雑費が倍になるので、一回、すぎのこ村を探して家族の和解案にしようとしました。売っていませんでした。
  fac_toilet_paper: >-
    トイレットペーパーは奥に垂らします。手前に垂らしていた頃、娘が引っぱって転がして、一ロール全部が廊下まで出ていました。
    奥にしてからは、引っぱっても壁にこすれて止まります。正しさではなく、娘の腕力との勝負で決めた向きです。
  fac_sock_color: >-
    家族全員、靴下は白です。洗濯物の中で誰のか分からなくなるので、サイズで分けようとしたら、夫とわたしが同じサイズでした。
    今は夫の靴下のかかとに黒いペンで点を一つ打っています。夫は気づいていません。
  fac_escalator: >-
    エスカレーターは左に立ちます。でも保育園のお迎えに遅れそうな日だけ、右を歩きます。
    規則違反なのは分かっているので、歩きながら心の中で「訂正します」と言っています。延長保育の一分前に着いた日は、規則より娘の方が大事です。
  vs_cheese_beef: >-
    すき家のチーズ牛丼は娘が食べられる数少ない外の牛丼です。チーズをのせると、娘は牛肉よりチーズを先に全部食べます。
    残った牛丼がわたしに回ってきます。わたしはチーズ牛丼を頼んで、チーズのない牛丼を食べています。
  era_smartphone_first: >-
    初めてのスマホは2013年のAQUOS PHONE SERIE SHL22でした。それからずっとAQUOSで、今はAQUOS sense8です。
    機種変更のたびに店員さんに「iPhoneにしないんですか」と聞かれますが、操作を覚え直す時間がもったいないです。電池が二日もつことしか、わたしは見ていません。
  era_corona: >-
    2020年に冷凍庫の在庫表を始めました。買い物に行く回数を減らそうと思って、扉にマグネットで紙を貼りました。
    今も続いていて、紙は三十枚目です。夫はアイスを食べても書かないので、表ではアイスが永遠に残っています。
  rec_life_proud: >-
    娘の名前を書いたおむつの枚数が二千枚を超えました。一枚ずつ油性ペンで書いて、正の字で数えていました。
    おむつが取れた日、最後の一枚に書いた名前を写真に撮りました。夫は「それ、記念なの？」と言いましたが、記念です。
  rec_life_change: >-
    城の門の前で、買い物袋を四つ持っていたら、門番のガルドに「その荷物、重そうですね」と言われました。持ってくれるのかと思ったら、言っただけでした。
    次の日も同じことを言われて、三日目に持ってくれました。今思うと、手順書を読まないのはあの頃からです。
  qbox_cast_rank: >-
    料理が上手そうなのはエラさんです。作法の人なので、たぶん量らなくても量ったのと同じ味が出せる人です。
    寝坊しそうなのはリゼ様です。でもリゼ様の配信を流すと娘が寝るので、寝坊してくださっても、うちの家は助かっています。
