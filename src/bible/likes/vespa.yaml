  qbox_fear: 入金の締切。それと推しの前の沈黙
  qbox_stress_word: 「それ認知じゃない」
  qbox_happy_moment: 現地に着いて、最初の一歩を踏んだとき
  qbox_dream_now: チェキ会で「おつかれさまです」以外の文を言う
  qbox_first_stream: 見つけたものを誰かに見せたかった
  qbox_stream_routine: 発見日誌を開いて、今日の話の日付を確かめる
  qbox_viewer_name: 遠征隊。みんなついてくるから。私は隊長
  qbox_retire: 坂を測る旅をずっとする
  qbox_skill: 段ボールを四箱いっぺんに運べる
  qbox_cant: 決まった時刻に同じことを続けること
  qbox_collection: アクスタと、聖地の坂の角度
  qbox_three_words: 行く人。現地に行かないと気が済まない
  qbox_day_off: 遠征かバイト。家にいる日はほぼない
  qbox_cooking_for: 焼きそば。ソースはたっぷり
  qbox_word_fav: 「任せて！」。任せてから考える
  qbox_color: 緑。黄緑も緑の一種
  qbox_number: 七。目覚ましの数
  qbox_smell: 刷り上がったばかりの同人誌の匂い
  qbox_sound: コミケの開場の拍手。毎回ちょっと泣く
  qbox_animal: ミツバチ。現場から現場へ飛び回っている
  qbox_cast_rank: 料理はピム、寝坊はリゼ。予約を落とすのは私
  qbox_castle_secret: 城の見張り塔の階段。段の高さが全部違う
  qbox_human_world: 好きな人が自分で作った本を、自分で配る場所
  qbox_makai_food: 回転寿司。魔界にはお皿が回る店がない
stories:
  food_fav: >-
    新大阪の改札の中の551で、豚まんを六個入りで買うのが遠征の締め。新幹線で開けたら隣の席の人に匂いで振り向かれて、一個あげたら仲良くなった。その人、今は遠征隊のチャットにいる。
  food_cupnoodle: >-
    バイトの休憩は十五分しかないので、カップヌードルの三分は大事な時間。一回だけ「最後尾はこちら」に「三分測っといて」と頼んだら、きっちり三分で呼ばれて、その間に列の人数も数えてくれていた。
  food_spicy: >-
    中本の北極は意地で完食した。次の日は物販の設営で、段ボールを運ぶたびにお腹が鳴って、班長に「大丈夫？」と三回聞かれた。それ以来、辛いのはバイトの前の日には食べないことにしてる……一回は破った。
  food_onigiri: >-
    遠征の朝はファミマの紅しゃけを二個。一個は電車で、もう一個は待機列で食べる予定なのに、だいたい電車で二個とも食べて、列でお腹がすく。
  sweets_fav_snack: >-
    たけのこの里は、チョコとクッキーのバランスが全部。きのこ派のリゼに「持ち手がないのは不便」と言われて、こっちは「持ち手で食べるのはチョコが少ない証拠」と返した。エラが横でうなずいてて、三対三なのにこっちが勝った気がした。
  sweets_chips_brand: >-
    プリングルズは筒だから、痛バッグに入れても割れない。前にカルビーの袋を入れて行ったら、缶バッジ六十個に押されて粉になってた。粉は粉で美味しかった。
  sweets_candy: >-
    チェキ会の列に並ぶ前、ミンティアを必ず二粒。口の中がすっきりしたら喋れる気がするから。……九年間、すっきりした口で「おつかれさまです」と言ってる。
  sweets_best_ever: >-
    原宿で二時間並んだパンケーキ、たぶん普通に美味しいパンケーキだった。でも二時間並んだ分、一口目で「来てよかった！」って声が出た。並ぶのが調味料なの、私だけかもしれない。
  drink_tapioca: >-
    2018年の原宿で、タピオカの列に並んだ。並んでる間に列の人数を数えて、前の人に「あと十五分です」と言ったら、本当に十五分だった。店員さんに「バイトの人？」と聞かれた。
  drink_tea_bottle: >-
    ペットボトルのお茶は伊右衛門。理由は味もあるけど、ラベルが緑だから。黄緑のときもあるけど、黄緑は緑の一種なので問題ない。
  drink_drunk: >-
    打ち上げで飲むと、推しの話が始まって、最後は「黄緑も緑の親戚だよ」の話で泣く。最後尾はこちらは三回同じ話を聞いて、四回目で「もう覚えた」と言って先に言ってくれた。
  chain_konbini: >-
    昔はサンクスに通ってた。2018年にサンクスが全部ファミマになって、気づいたら同じ店でファミチキを買ってた。看板が変わっても店員さんが同じだったのが、ちょっとうれしかった。
  chain_sushi: >-
    くら寿司はビッくらポンのために行く。五皿で一回なので、食べる量を五の倍数にそろえる。この前は十四皿で止まって、あと一皿を誰が食べるかで遠征隊ともめた。
  chain_ramen_chain: >-
    チェキ会で「おつかれさまです」しか言えなかった日は、一蘭の一人の席に座る。仕切りがあって誰にも顔を見られないから、反省会にちょうどいい。替え玉を頼んだら、ちょっと元気になる。
  chain_famires: >-
    デニーズは深夜の作戦会議の場所。遠征隊の三人で、ほかの人の遠征の計画を朝の四時まで組んだ。全員の乗り換えは完璧だったのに、自分の帰りの電車だけ調べ忘れてた。
  chain_costco: >-
    コストコには行ったことがない。車がないから。……段ボール四箱運べるんだから、手で持って帰れるでしょ、と言われて、本気で考えた。電車でトイレットペーパーの大きいのを二つ抱えてる自分を想像して、やめた。
  cook_egg: >-
    ゆで卵は七分。目覚ましが七つだから七で覚えた。……と言ったらモーラに「関係ない」と言われた。関係なくても覚えられたらいいの。
  cook_fail: >-
    焼きそばのソースは目分量。一回、勢いでボトルを振ったら蓋が取れて、半分入った。真っ黒の焼きそばは、思ったより食べられた。ソース派の私でも、二口目でお茶を飲んだ。
  morning_alarm: >-
    目覚ましは七つ、全部別の時刻、全部別の音。最後の七つ目は「最後の砦」って名前で、最後尾はこちらにもらった時計。一回だけ六つ目で起きた日は、うれしくて配信で言った。
  morning_routine: >-
    朝はまず推しの投稿にいいねを押す。押し忘れた日に限って推しが「今日は早起き」って書いてて、二時間後に押した。たぶん誰も気づいてない。私だけ気づいてる。
  bath_onsen: >-
    伊香保温泉の石段、365段を全部測りながら上った。段ごとに傾斜計を置いてたら、後ろの観光客がずっと待ってて、途中で気づいて謝った。上り切ってから入ったお湯は熱くて、43度のシャワーより熱かった。
  sleep_dream: >-
    夢でやっとミナミに話しかけられた。言いたい文を言うつもりで口を開いたら、出てきたのが「最後尾はこちらです」。バイトの癖。起きてから一人で笑った。
  sleep_allnighter: >-
    冬コミの入稿の前の夜は毎回起きてる。解釈違いですから夜中の三時に「原稿は？」と来て、「今やってる！」と返したら「既読になるの早すぎる」と言われた。スマホを見てたのがばれた。
  season_valentine: >-
    推しのグループは、チョコを渡しちゃいけない決まり。だからバレンタインは手紙を書く。毎年「今年こそチェキ会で言う」と書いてる。もう九枚、同じことを書いてる。
  season_hatsumode: >-
    初詣は鷲宮神社。人混みに流されて、お参りする前に出口に着いた。もう一回並び直して、おみくじは中吉。「待ち人、来る」と書いてあって、推しのチェキ会のことだと思うことにした。
  season_rain: >-
    雨の日は苦手。夏コミで紙袋の本が八部波打った。今は紙袋の上からビニール袋を二重にかける。自分は濡れても平気。本だけ守る。
  home_neighbor: >-
    ワンルームでコールの練習をしてたら、隣から壁をトンと叩かれた。次の日、菓子折りを持って謝りに行ったら、隣の人もアイドルのファンで、別のグループのコールを教えてもらった。今は小声で練習してる。
  home_regret_buy: >-
    コスプレの槍の材料を、自分の背より長いまま買ってしまった。電車に乗せられなくて、店から家まで四十分歩いた。肩に担いで歩いてたら、小学生に「勇者だ」と言われた。悪くなかった。
  money_furusato: >-
    ふるさと納税は大洗町。届いたあんこう鍋のセットを、こたつで一人で食べた。坂のない町の鍋だけど、締めのラーメンを入れたら、ちゃんと豚骨じゃなくても美味しかった。
  money_gift: >-
    プレゼントを選ぶのは得意。相手の推しの色で選べばいいから。最後尾はこちらは推しがいないので、困って「時給の色」と言ったら、本人が「金」と答えた。金色のボールペンをあげた。
  money_receipt: >-
    レシートはもらう。遠征費をちゃんと記録しようと思って。財布に三か月分たまって、全部まとめてモーラに見せたら、モーラが黙って帳面に写してくれた。私の欄が赤い。
  travel_abroad: >-
    台北の同人誌即売会（FF）に一般参加で行った。言葉は分からないのに、サークルの人が見本を見せてくれて、指さしで買えた。帰りに屋台でパクチーを避けきれずに食べて、そこで平気になった。
  travel_seat: >-
    電車は絶対に窓側。坂の多い町が見えると、窓に傾斜計アプリを当てたくなる。窓に当てても測れない。分かってる。
  travel_sleep_through: >-
    夜の小田急で寝て、起きたら終点の小田原だった。新宿に帰るつもりだったのに。せっかくだからと小田原城の坂を測ってから帰った。損してない気がした。
  travel_hotel_first: >-
    ホテルに入ったら、最初に「本予約になってますか」とフロントで聞く。三回目くらいで受付の人に「チェックインできてるので、なってます」と笑われた。それでも聞く。
  school_jiyukenkyu: >-
    学舎の頃の自由研究で、寮の階段の段の高さを全部測った。段ごとに全部違って、先生に「なんで違うの」と聞いたら、「建てた人が違うから」と言われた。今の坂の本は、たぶんあそこから始まってる。
  school_teacher: >-
    暦の先生に「あなたは日付を書く練習をしなさい」と言われて、毎日日付だけ書くノートを作った。それが続いて、人間界に来てから発見日誌になった。続けるのが苦手な私が続いてる、唯一のもの。
  child_mistake: >-
    魔界の頃、「おつかれさま」は夜の挨拶だと思ってた。寮で夜に言うものだったから。人間界で昼に言われてびっくりした。……今は推しに昼も夜も言ってる。
  net_burn: >-
    推しへの返信と、晴海への「腰の具合どう？ あと話が長い」を同時に書いてた。送信の直前に宛先を見て、指が止まった。推しに「話が長い」は送ってない。セーフ。
  net_photo: >-
    写真は二万枚。半分が坂で、四分の一がアクスタ。推しの写真が少ないのは、現場で撮らない派だから。思い出は全部、発見日誌の文字で残ってる。
  gear_first_phone: >-
    初めての携帯はドコモのF501i。iモードの最初の機種で、1999年に出てすぐ買った。最初に開いたのは天気予報。発見日誌に「携帯でネットを見た」と書いてある。
  gear_notebook: >-
    発見日誌はコクヨのキャンパスノートで三十冊。表紙の色はなるべく緑。一冊だけ赤いのがあって、それはお店に緑がなかった日。中身は普通に大事。
  media_live: >-
    初めてのコンサートは、1987年のおニャン子クラブの解散コンサート、代々木。始まりを知らずに終わりから入った。それで「次は始まりから見る」と決めて、今の推しは結成の次の月から追ってる。
  media_first_cd: >-
    初めて買ったCDは「LOVEマシーン」。1999年の発売日に、渋谷のCD屋で買った。帰りに着メロも同じ曲にして、電車で鳴ったとき思わず腰が動いた。隣の人は見なかったことにしてくれた。
  media_horror: >-
    『リング』を公開の年に映画館で見て、その夜はテレビを布団で隠して寝た。次の朝、布団をどけたら録画の予約のランプが光ってて、悲鳴を上げた。予約したのは私。
  health_shoulder: >-
    痛バッグに缶バッジを詰めすぎて、肩がずっと痛い。整骨院の先生に「重さを半分に」と言われて、半分にしたら、空いた所に新しい缶バッジが入った。先生にはまだ言ってない。
  health_hiccup: >-
    チェキ会の列でなぜかしゃっくりが出る。息を止めて止めようとしてたら、ちょうど番が来て、「おつかれさまです」と一緒にしゃっくりが出た。ミナミが笑ってくれたので、あれは認知の日だと思ってる。
  people_best_friend: >-
    いちばん長い付き合いは、最後尾はこちら。初めてのバイトの日、隣で最後尾札を持ってて、私のが逆さまなのを四十分黙って見てた。休憩で「あれ逆」と言われて、そこから五年。
  people_first_love: >-
    初恋は1984年の劇場で見たミンメイ。人じゃないって言われるけど、帰りの電車で歌を口ずさんで、その日の発見日誌に二ページ書いた。今読むと、字が踊ってる。
  people_wedding: >-
    遠征仲間の結婚式で、余興の係をやった。ペンライトを全員分そろえて、新郎の推しの色と新婦の推しの色で客席を半分に分けた。式場の人に「初めて見ました」と言われた。
  work_mistake: >-
    最後尾札を逆さまに持って四十分立ってた。並ぶ人が首をかしげながら並んでくれて、列はちゃんとできてた。最後尾はこちらは今も配信で言う。「逆さでも人は並ぶ」って、私の中では教訓にしてる。
  work_skill: >-
    人数を見るだけで「今、二百四十人」と言える。バイトで鍛えた。初詣の行列で口に出して数えてたら、前の人に「スタッフさんですか」と聞かれて、つい「最後尾はこちらです」と言った。
  fac_escalator: >-
    大阪に遠征しすぎて、東京のエスカレーターでも右に立ってしまう。後ろの人に詰まられて、毎回「すみません」と左に移る。マクドも豚まんも、大阪から帰ってこない。
  fac_wari_kan: >-
    打ち上げではつい多めに払う。隊長だから。そのあと家賃が足りなくなって、モーラに借りる。モーラに「多く払う前に、家賃を払って」と言われた。正しい。
  fac_live_phone: >-
    ライブは撮らない。両手にペンライトを持ってるから物理的に無理。たまに隣の人が撮ってて、「ヴェスパさん映ってました」と送ってくれる。法被が緑すぎて、すぐ分かるらしい。
  era_pager: >-
    ポケベルは1990年代の半ばに持ってた。14106（アイシテル）は打つ相手がいなくて、推しのグループのファン仲間に「0840」ばっかり送ってた。返ってくるのも「0840」。平和だった。
  era_tamagotchi: >-
    たまごっちは四日で死なせた。毎日決まった時刻にご飯をあげるのが無理だった。その後も電池を替えずに引き出しに入れてあって、去年出てきた。捨てられない。
  era_smartphone_first: >-
    最初のスマホは2009年のiPhone 3GS。発売日に並んで、列の人数を数えてたら店員さんに「何人ですか」と聞かれた。答えたら合ってた。
  rec_last_lost: >-
    米沢嘉博記念図書館に行ったら、会員登録に身分証が要るのを忘れてた。財布の中を三回見て、看板の写真だけ撮って帰った。次は身分証を一番上に入れる。……まだ行けてない。
  rec_life_best_present: >-
    七つ目の目覚まし時計は、最後尾はこちらがくれた。入金を忘れた翌月に、黙って机に置いてあった。裏に「最後の砦」とテプラで貼ってあって、それがそのまま名前になった。
  qbox_one_day_other: >-
    一日入れ替われるならエラ。エラはいつもライブの後ろで主様の上着を持ってるから、その日は私が上着を持って、エラを最前に行かせたい。……私がエラの丁寧語をしゃべれるかは、自信ない。
  qbox_castle_secret: >-
    城の見張り塔の階段は、段の高さが全部違う。一回全部測ったら、上に行くほど低くなってた。建てた人が疲れたんだと思う。その数字は坂の本の付録に入れた。
  qbox_zombie: >-
    ゾンビが来たら、コスプレの槍を持つ。2メートルあるから届く。……コミケの規則は振り回さなければいいけど、ゾンビのときは振り回していい。そこは自分で決めた。
