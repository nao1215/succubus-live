  era_mail_address: 推しの名前と誕生日。推しが変わるたびに変えた
  era_sekimen: 前略プロフィール。百の質問はもう掘らないで
  era_wifi_first: 1990年代の終わり。ダイヤルアップの音を、つながった合図のファンファーレだと思ってた
  era_video: 録画の予約を一週ずらした。三倍モードの画質も覚えてる
  era_md: MD。現場に行く電車で聴く推しのセトリを作った
  era_famicom: ふーふーした。リゼに「意味ない」と言われた
  era_rental: TSUTAYA でアニメのビデオを借りて、延滞を三回
  era_phone_card: 2011年の震災の日、公衆電話に並んだ
  era_tamagotchi: 育てた。四日で死なせた
  era_y2k: 冬コミの戦利品を読みながら、何も起きないのを見てた
  era_bubble: バブルには縁がない。晴海のコミケのカタログの列にいた
  era_heisei_end: 渋谷で令和のカウントダウンを見ていた。人が多い所に行きたくて
  era_corona: オンラインのお話し会。Wi-Fi が止まって固まった
  era_smartphone_first: 2009年、iPhone 3GS。SoftBank で
  era_old_price: 切手。同人誌の通販の送料で毎回思い知る
  era_fashion: ルーズソックスは履いた。アムラーの眉は失敗した
  era_word: 「萌え〜」。前略プロフィールに書いた
  era_school_rule: イベントの徹夜の待機列。昔はあった
  era_new_thing: 新しい VTuber の略語。若いファンに教わる
  era_retro_want: 晴海の会場。もう行けない
  era_konbini_old: ココストア。名古屋の遠征で寄った店が、もうない
  # 「最後に」「人生で一番」
  rec_last_cry: 昨日のチェキ会。また「おつかれさまです」しか言えなかった
  rec_last_laugh: 晴海が VTuber を「バーチャル演歌歌手」と言った
  rec_last_angry: 推しのグッズの転売を見たとき
  rec_last_run: 終電に向かって。間に合わなかった
  rec_last_letter: 推しへのファンレター。月一回
  rec_last_lie: 「原稿は進んでる」
  rec_last_apology: モーラに、家賃のことで
  rec_last_new: 衣装の裾上げを自分でやってみた。エラに直された
  rec_last_lost: 身分証。米沢嘉博記念図書館の前で気づいた
  rec_last_photo: 坂。傾斜計アプリの画面ごと
  rec_life_best_meal: 遠征の帰りの新幹線で食べた551の豚まん
  rec_life_worst_meal: 寝過ごした朝に食べた、冷えたカップ麺
  rec_life_scared: 入金の締切の翌朝、メールを開いたとき
  rec_life_embarrassing: 前略プロフィールを晴海に掘り出されたこと
  rec_life_expensive: 緑の法被の刺繍。1万2000円
  rec_life_lucky: 推しのグループの初めての大きいホールに当選した日
  rec_life_unlucky: その当選の入金を忘れた日
  rec_life_far: 台北。人間界の中では、だけど
  rec_life_hot: C84（2013年夏）の待機列
  rec_life_late: 推しの対バンに一時間遅れて、出番が終わってた
  rec_life_proud: 発見日誌三十冊。続けるのが苦手な私が続いた
  rec_life_regret: パスポートを切らしたこと
  rec_life_change: 1981年の新宿のアニメ新世紀宣言の人だかり
  rec_life_long_wait: 2010年代の夏コミの企業ブースの列。六時間
  rec_life_best_present: 最後尾はこちらがくれた目覚まし時計。七つ目の「最後の砦」
  rec_this_year: C109 のホテルを本予約で取れたこと
  rec_this_year_buy: よかったのはコレクションケース、ダメだったのはランダムのアクスタ十四個
  rec_streak: 発見日誌。1981年から
  # 質問箱
  qbox_superpower: 瞬間移動。遠征費とホテルが要らなくなる
  qbox_island: 傾斜計アプリの入ったスマホ。島の坂を全部測る
  qbox_reborn: 推しのグループのスタッフ。物販の机の向こう側
  qbox_one_day_other: エラ。ライブの最前で主様の上着を持たずに観させてあげたい
