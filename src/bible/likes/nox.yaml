stories:
  food_nabe: >-
    常夜鍋の名前の由来が「毎晩食べても飽きないから」だと知って、本当に毎晩作った。二十三日目で飽きた。
    飽きた日を測量野帳に書いて、今は「二十二日までは本当」と人に言っている。
  food_eat_order: >-
    好きなものは最後に残す派。前の現場で、シウマイ弁当の杏を最後に残していたら、障害の電話が鳴った。
    戻ってきたら弁当は片付けられていて、杏だけがなかった。それから杏は最初に食べる。ほかは今も最後。
  food_cupnoodle: >-
    カップヌードルの三分を、キッチンタイマーで毎回計る。四分にすると麺が伸びたと感じるか、自分で目隠しして試した。
    結果は六回中四回当てた。チャットに言ったら「ほぼ偶然では」と言われて、拗ねた。
  food_onigiri: >-
    コンビニのおにぎりは、買ったら最初に半分に割って具がどこまで入っているかを見る。
    紅しゃけは端まで入っていることが多い、と記録をつけていたら、常連に「論文にして」と言われた。まだしていない。
  sweets_fav_snack: >-
    ルマンドの粉がキーボードの隙間に入って、HHKB のキーを一つ外して掃除した。外したキーが一個、今も見つからない。
    それでもルマンドはやめていない。袋を開けるときだけ、ThinkPad の蓋を閉める。
  sweets_chips: >-
    九州しょうゆは城下のローソンで見かけない日が多いので、箱で取り寄せている。届いた箱を機械の箱と間違えて、二週間開けなかった。
    開けたら、ちゃんとポテチだった。湿気てもいなかった。
  sweets_ice: >-
    ピノは一箱六粒なので、一粒ずつ時刻を記録しながら食べた夜がある。最後の一粒まで十一分。
    冬の地下だと溶けないので、記録がきれいに取れる。夏にやったら三粒目で机がべたべたになった。
  sweets_wagashi: >-
    とらやの「夜の梅」は名前で選んだ。切った断面の小豆を、夜に咲く梅に見立てた名前だと知って、もっと好きになった。
    でも羊羹の断面を見るとき、つい「小豆の分布に偏りがあるかしら」と数えてしまう。数えるとおいしさは変わらない。
  sweets_kaki: >-
    柿の種のピーナッツの比率は、六対四から七対三に変わった。投票で決めたと聞いて、少し感動した。
    変わったあと、自分で袋を開けて数えてから、比率が重さだと気づいた。はかりで量り直したら七対三に近かった。一袋だけなので、再現性はない。
  sweets_best_ever: >-
    人生でいちばん美味しかった甘いものは、2014年4月の Heartbleed の夜明けに、先輩がコンビニで買ってきたプリン。
    証明書を百二十枚入れ替え終わったところで、机に黙って置いてくれた。プリンの名前は覚えていない。それが悔しい。
  sweets_limited: >-
    限定の味は買わないようにしている。前に限定のからあげクンを好きになって、終わった日に本気で落ち込んだから。
    次に会えるか予測できないものを好きになるのは怖い。……推しが引退するのと同じ、とヴェスパが言いそう。
  drink_energy: >-
    前の現場で、障害の夜にエナドリを四本飲んだ。手が震えて、コマンドのタイプミスが三回出た。一回は危なかった。
    それから飲まない。代わりにキシリトールガムを噛む。噛む速さで、自分がどれくらい焦ってるか分かる。
  drink_hot_winter: >-
    コーンポタージュの缶の最後の粒を出すために、缶の飲み口の角度を変えて叩く実験をした。
    一番出たのは、飲み口を下にして横に軽く三回叩くやり方。結局、最後の二粒は出なかった。今も二粒は残る仕様だと思っている。
  drink_tapioca: >-
    タピオカに一回だけ並んだ。列の長さから「二十分」と見積もって、実際は六十五分かかった。×3.25。
    常連に報告したら「×3.7より当たってる」と褒められた。褒められたのに、なぜか悔しかった。
  chain_cafe: >-
    タリーズを選ぶのは、席の間が広くて画面を覗かれにくいから。でも画面の明るさを最低にしているので、そもそも誰にも見えない。
    一度、店員さんに「電源入ってますか」と聞かれた。入ってた。
  chain_saize: >-
    サイゼリヤの間違い探しは、全部見つけるまで帰らない。一回、最後の一個が見つからずに三時間いた。
    見つかったのはドリンクバーの四杯目のとき。見つけた瞬間、小さく「！」が出て、隣の席の人が振り向いた。
  chain_furniture: >-
    IKEA の LACK の机は、脚の間がちょうど機械を入れる棚の幅になっている。それを知って、部屋の古い機械を LACK に積んだ。
    今は三段。一番下の段に、起動に四分かかる NAS がいる。机としては一回も使っていない。
  chain_konbini_hot: >-
    からあげクンのレッドを、夜勤の人の常備食だと思っている。前の現場では、レッドを買ってくる人が当番の人だった。
    今もローソンでレッドを買っている人を見ると、「この人も当番かしら」と思って心の中で会釈する。
  cook_egg: >-
    ゆで卵は毎朝七分。再現性のためにタイマーも鍋も水の量も固定した。なのに冬は半熟になる。水道の水が冷たいから。
    季節で変わるバグとして測量野帳に記録している。直すなら水を量るときに温度も測ればいい。分かってる。でも、冬の半熟が好き。
  cook_leftover: >-
    作りすぎた豚汁を冷凍して、ラベルの日付を UTC で書いた。九時間ずれた日付を見て、いつのか分からなくなった。
    自分で書いたラベルで、九時間ずれ事件を一人で再現した。それから冷凍のラベルだけは日本時間で書く。
  cook_fail: >-
    冷めたゆで卵を電子レンジで温め直して、扉の中で破裂させた。音で隣のサーバー室の人が見に来た。
    その日から、ゆで卵は温め直さない。冷たいまま、マヨネーズで食べる。
  cook_measure: >-
    料理は全部量る。タニタのはかりで一グラム単位。インスタントコーヒーの小さじ一も、一回量って二グラムだと確かめた。
    ピムも量る派らしいので、いつか分量の書き方の流儀で喧嘩したい。
  morning_snooze: >-
    スヌーズは押さない。押すと次に鳴る時刻が頭から抜けて、起きる時刻が予測できなくなるから。
    代わりにアラームを三個、十五分おきに並べている。三個とも止めて寝た日が一回あって、その日は配信を一時間遅らせた。
  morning_routine: >-
    起きたら最初にゆで卵を七分。ゆでている間に、寝ている間の当番のチャンネルを読む。七分で読み終わるようにしている。
    障害があった日は七分で読み終わらない。その日の卵は、だいたい固ゆでになる。
  bath_temp: >-
    シャワーは38度。前に42度にしたら、上がってから画面の文字が揺れて見えて、コードを一行読み間違えた。
    モーラは41度にしているらしい。……熱くない？ 私は湯船に入らないので、比べる資格はないけど。
  sleep_dream: >-
    「よる」が起動して、タイマー割り込みを越えて、二行目を表示する夢を見た。起きて、少し泣いた。
    すぐ起動してみたら、やっぱり最初の割り込みで落ちた。でも夢の中の二行目が何だったか、思い出せない。それが一番悔しい。
  sleep_allnighter: >-
    最後に徹夜したのは穴の当番の夜。客の機械の版を一台ずつ数えて、全部数え終わったら朝の七時だった。
    それが悔しくて、今は機械と部品の一覧を普段から更新している。最初の一時間で「分かった範囲と、まだ分からない範囲」を出せるようになった。
  sleep_stuffed: >-
    サボテンの EAGAIN を枕元に置いて寝たことがある。朝起きたら、寝返りで鉢を倒していた。
    土を戻しながら、EAGAIN の名前の意味（今は無理、もう一回やって）を、自分が言われている気がした。
  season_newyear: >-
    年越しはいつも当番。年が変わる瞬間は、テレビじゃなくて機械の時刻のログを見ている。
    零時零分零秒の行が揃うと、ちょっと安心する（それだけで処理の順番まで正しいとは言えないのは分かってる）。一台だけ二秒遅れていた年があって、その一台は今も部屋にいる。
  season_obon: >-
    お盆に魔界の実家に帰ると、母の店の時計を全部合わせる。四十個くらいある。
    合わせ終わると母が「これで今日は全部正しい」と言う。帰る頃にはもう少しずつずれている。それを見ると、帰ってきた感じがする。
  season_valentine: >-
    前の現場で、バレンタインに全員へ配るチョコの数を数える係になった。人数と箱の数が一つ合わなくて、三回数え直した。
    合わなかった一つは、自分の分を数えていなかったから。自分の分は最後にもらえた。
  home_room: >-
    部屋には古い機械が十一台。一台捨てようとして電源を入れたら、ちゃんと起動して、捨てられなくなった。
    常連に「起動するかどうかを確かめるのが一番だめ」と言われた。分かってる。確かめずにはいられない。
  home_best_buy: >-
    今年いちばん買ってよかったのはラベルライター。十一台の機械に名前を貼った。
    貼ったら、名前を付けたせいで余計に捨てられなくなった。ラベルを貼る前に考えるべきだった。
  home_trash: >-
    ゴミの日を一回、UTC で考えて間違えた。日本時間で火曜の朝なのに、月曜の夜だと思って出し損ねた。
    それからゴミの日だけはカレンダーに日本時間で書いて、さらに前の晩にアラームを鳴らしている。
  money_subscription: >-
    前に試しに作ったクラウドの機械を消し忘れて、二年間、毎月数百円が引かれていた。気づいたのは確定申告の帳簿をつけたとき。
    人には「一時的なものには消す日を書いて」と言っているのに。今は作った日に、消す日の予定も一緒に入れる。
  money_gift: >-
    人へのプレゼントを選ぶのが苦手で、だいたいコクヨの測量野帳を渡す。表紙が硬くて立ったまま書けるから、と説明する。
    三回渡した人に、「家に三冊ある」と言われた。四回目は、ペンを付けた。
  travel_fav_place: >-
    上野の国立科学博物館に、日本で最初に使われた電子計算機の FUJIC がある。前に立って三十分動けなかった。
    真空管の数を数えようとして、係の人に「大丈夫ですか」と声をかけられた。大丈夫だった。数え終わらなかったけど。
  travel_airport: >-
    空港には三時間前に着く。自分の見積もりが平均で3.7倍外れるので、移動の時間にも掛けている。
    実際は二時間五十分、搭乗口の前で座っていた。外れた方向が逆だった。
  travel_trouble: >-
    箱根の宿に泊まった夜、当番の電話が鳴った。部屋の小さな机で、浴衣のまま朝まで打っていた。
    黒たまごは、そのあと寝不足で食べに行った。一個で寿命が七年延びると聞いて、七年分は取り戻したと思っている。
  school_jiyukenkyu: >-
    自由研究は、母の店の時計がそれぞれ一か月でどれだけずれるか記録した。一番ずれたのは、一番高い時計だった。
    母は「高いのは機嫌で動くの」と言った。研究の結論の欄に、そのまま書いた。先生は丸をくれた。
  school_kurohistory: >-
    学生の頃、自分で作った暗号で日記を書いていた。解き方を書いた紙を、別の暗号で書いた。
    今その日記を読もうとしても、どっちも解けない。……モーラの暗号の帳面の話を聞くと、他人事じゃない。
  child_toy: >-
    子どもの頃、母の店で分解していいのは、壊れた目覚まし時計だけだった。毎回分解して、毎回ネジが一本余った。
    母は余ったネジを瓶に入れていた。今思うと、あの瓶が私の最初のバグの記録。
  child_birthday_party: >-
    誕生日に、母が店の時計を全部、私の生まれた時刻に合わせて一斉に鳴らしてくれた。
    でも何個かは少しずれて鳴った。母は「それでいいの。合わせた日が違うだけ」と言った。あの年から、ずれた時計が嫌いじゃない。
  net_brightness: >-
    画面の明るさは最低。眼科で「暗すぎる」と言われて、一日だけ明るくした。
    その日のコードは読みやすかった。でも夜中に目が冴えて眠れなかった。次の日、最低に戻した。
  net_tab: >-
    ブラウザのタブはいつも八十枚くらい。閉じたら二度と見つからない気がして閉じられない。
    一回ブラウザが落ちて全部消えた。復元したら全部戻った。そのとき、少しだけ寂しかった。
  gear_watch: >-
    腕時計はカシオの F-91W。説明書に「月差±30秒」と正直に書いてあるのが好き。
    毎月一日に、母の店の時計と同じやり方で合わせる。合わせる前に何秒ずれているか記録している。今のところ毎月、約束の中に入っている。
  gear_headphone: >-
    マイクは Shure の SM58。声が小さいので音量をいつも一番上にしている。
    一度、隣のサーバー室のファンの音が全部配信に乗って、チャットが「風の音？」「ノクス外？」でいっぱいになった。地下だった。
  gear_broken: >-
    起動に四分かかる NAS を捨てられない。いつか古い版で再現するから、と言い続けて五年。
    この前、本当に古い版の再現に使った。四分待って起動したとき、小さく「！」が出た。だからもう一生捨てられない。
  media_m1: >-
    ミルクボーイの漫才は、「〇〇ちゃうか」で一個ずつ候補を消していく形が、障害の切り分けにそっくりだと思っている。
    前の現場で障害の通話に入っていたとき、頭の中で「ほな DNS ちゃうか」と言ってしまって、本当に DNS だった。
  media_first_cd: >-
    初めて買った CD は、1997年に人間界に来た年の電気グルーヴの「Shangri-La」のシングル。秋葉原の部品屋の店番の、最初の給料で買った。
    店の中で流したら、店長に「部品屋っぽくない」と言われた。次の日から、店長の方が口ずさんでいた。
  era_y2k: >-
    1999年の大晦日は、大学の計算機室で夜番のバイトをしていた。零時、何も起きなかった。
    「何も起きなかった」の裏で、何年も直していた人たちがいたと知ったのは、ずっと後。あの夜の何も起きなさを、今も一番好きな事故の報告だと思っている。
  era_heisei_end: >-
    改元の夜は当番だった。「令和」を一文字にした合字が、文字の規格に後から足されると聞いて、手元の機械で表示できるか一台ずつ確かめた。
    十一台中、ちゃんと出たのは四台。残りは四角い箱になった。部屋で一人で「豆腐が出た」と言っていた。
  era_rental: >-
    ゲオで映画の『ハッカーズ』を三回借りて、三回とも延滞した。返す日を UTC で考えていたわけではなく、ただ忘れていた。
    延滞料を合わせたら、DVD を買える値段になっていた。四回目は買った。
  rec_last_new: >-
    最近初めてやったことは、障害の通話で一言だけ声で「はい」と言ったこと。全員が一瞬黙った。
    怖くなってそのあと全部チャットに打った。でも「はい」は言えた。THANKS のファイルに自分の名前を足しそうになって、やめた。
  rec_streak: >-
    いちばん長く続いている習慣は、ゆで卵を七分。「よる」と同じで九年になる。
    九年分の卵の茹で上がりを測量野帳に書いてある。冬だけ半熟の印が並んでいて、季節がページで分かる。
  qbox_number: >-
    好きな数字は7。卵の分数で、素数。素数なのは、あとから気づいた。
    3.7 は好きな数字じゃない。……チャットが勝手に私の数字にした。
  qbox_cast_rank: >-
    料理が上手そうなのはピム。量る派だし、規則があるから。寝坊しそうなのはリゼ。
    でも私は昼に寝て夕方に起きるので、寝坊の基準が皆と違う。「夕方の六時に起きたら寝坊」と言ったら、誰にも通じなかった。
