stories:
  food_fav: >-
    オムライスは、ケチャップで字を書く派。配信の前に「おはよう」と書いたら、書いている途中で寝てケチャップの線が皿の外まで伸びていた。
    エラはそれを見て黙って写真を撮った。あとで見せられた字は「おはよ———」だった。
  food_cupnoodle: >-
    カップヌードル シーフードにお湯を入れて、三分の間に寝た。起きたら麺がスープを全部吸っていて、もう汁なしの別の料理だった。
    それが案外おいしかったので、今はわざと十五分置く。チャットには「放置の料理」と呼ばれている。
  food_bento: >-
    崎陽軒のシウマイ弁当に付いてる、ひょうちゃんの醤油入れを集めている。顔が一個ずつ違うのが、ガチャの思想そのものだと思う。
    今は二十二個。中身の残った一個が枕の下から出てきて、モーラに叱られた。
  food_okonomiyaki: >-
    もんじゃが好きな理由は、ひっくり返す工程がないから。友達と行った店で、ヘラを持ったまま寝て、土手が決壊した。
    鉄板の上の流れを見ながら、友達が「洪水のステージ」と言った。それ以来、その店では私の分は向こうが作る。
  sweets_choco: >-
    アルフォートの帆船を、舟ごと割らずに食べる遊びを一人でしている。チョコの面から少しずつかじると、最後まで舟の形が残る。
    九枚目で成功して、配信で見せようとしたら、寝ている間に溶けていた。
  sweets_winter_ice: >-
    こたつで雪見だいふくを開けると、二個のうち一個はエラの分として取っておく。取っておいた一個を、寝ぼけて食べたことが三回ある。
    エラは毎回「主様、当方の分は」とだけ言う。四回目はないように、今はエラの分を先に渡す。
  sweets_donut: >-
    ポン・デ・リングを、一粒ずつちぎって寝ながら食べる。八粒あるので、八回寝返りを打つ間にちょうど終わる。
    ちぎった一粒がソファの隙間に落ちて、二日後に見つかった。カチカチだった。
  sweets_late: >-
    夜中にコンソメパンチの袋を開けて、そのまま枕の横に置いて寝る。朝、袋の口がしけって、ポテチが柔らかくなっている。
    柔らかいポテチの方が好きだと気づいてからは、わざと開けて寝ている。モーラには「保存という概念を捨てた」と言われた。
  drink_yakult: >-
    ヤクルト1000は、睡眠の質をうたっている。それを知って、寝る係として飲まないわけにはいかないと思った。
    飲み始めて一週間、ポケモンスリープの点数を毎朝見た。前と変わらず満点近くで、比べようがなかった。
  drink_drunk: >-
    ほろよいを一本飲むと、だいたい二十分で寝る。「二度寝」の打ち上げで、居酒屋のソファ席で寝て、起きたら会計が終わっていた。
    奢られたい派なので、それは理想の結果だった。次の回から、二人は私の分を先に集めるようになった。
  chain_konbini_hot: >-
    からあげクンは1986年からある。城下のローソンで夜中に一箱買って、階段を一段上がるごとに一個食べる。
    二階の自分の部屋に着く前に箱が空になる。足りないので、モーラの三階まで上がって、ドアの前で引き返した。
  chain_sushi: >-
    くら寿司のビッくらポンは、皿を五枚入れると回る小さなガチャ。確率が出ていないので、行くたびに当たった回数を数えている。
    今のところ十九回で当たり四回。モーラは「皿の代金で割ると一回いくら」と計算し始めて、私の寿司が乾いた。
  chain_udon: >-
    丸亀製麺は毎月1日に釜揚げうどんが半額になる。その日だけは目覚ましを三個かける。
    先月は起きられて、店に着いたのが閉店の三十分前だった。それでも半額だったので、勝ちにしてる。
  chain_ramen_chain: >-
    一蘭は、席が仕切られていて、店員さんの顔も見えない。注文も紙に丸を付けるだけ。
    初めて行った日に、仕切りの中が落ち着きすぎて、ラーメンが来る前に寝た。のれんの向こうから「お待たせしました」と三回言われた。
  chain_furniture: >-
    寝床は無印良品の体にフィットするソファ。2002年からある、人をダメにすると呼ばれているやつ。
    三年使って、私の形に凹んだ。エラが中のビーズを足そうとしたら、形が変わるからやめてと本気で止めた。
  chain_drugstore: >-
    めぐりズムの蒸気でホットアイマスクは、箱で買う。温かいのが二十分くらい続く。
    付けたまま配信を始めてしまって、二十分「画面が暗い」と言われ続けた。私は見えてないので、ずっと「ロード中よ」と言っていた。
  cook_fail: >-
    電子レンジでゆで卵を作ろうとして、爆発させた。音でエラが走ってきて、私は布団をかぶって寝たふりをした。
    扉の内側は今も少しくもっている。ネットで調べたら、やってはいけない代表だった。調べたのは爆発の後。
  cook_bento_box: >-
    子どもの頃のお弁当のタコのウインナーは、足の数が毎回違った。母の切り方が日によって雑だったから。
    六本の日と四本の日があって、四本の日はイカだと言い張った。今思えば、仕様の書いてない上限だった。
  morning_alarm: >-
    目覚ましはねぼすけ号に鳴らさせている。ちゃんと時間どおりに鳴る。
    私が起きないので、そのうち隣の部屋のエラが起きるようになった。今は、エラを起こすための目覚ましになっている。
  morning_socks: >-
    靴下は右から履く。ソファの右側から足を下ろすので、右が先に床に着く。
    左右で違う柄を履いていることが多い。チャットに言われたら「柄物だから気づかなかったでしょう」と返す。気づかれてるから言われてる。
  bath_temp: >-
    お風呂は39度。熱いと、寝てしまう前にのぼせるから。ピムに41度以上は体に悪いと聞いて、もう一度下げようとした。
    エラに「主様、それはもう、ぬるま湯でございます」と止められた。39度が下限ということになった。
  bath_onsen: >-
    城崎温泉が好き。浴衣のまま外湯をはしごして、谷口屋の遊技場でスマートボールを打つ。
    去年は射的で一つも倒せなかった。店のおばあさんに「眠そうな目で狙うからよ」と言われた。目は生まれつき。
  sleep_pillow: >-
    枕は一個。中身より、下に何を置くかが大事。今の枕は、モーラが「どうせ下に物を入れるんでしょ」と言って選んだ大きいの。
    大きくしたら、下に置ける物が増えた。モーラは「そういう意味じゃない」と言った。
  sleep_dark: >-
    寝るときは真っ暗にしたいのに、ゲーム機の電源ランプがソファの周りに十個以上ある。全部に黒いテープを貼った。
    そのせいで、どれが点いているか分からなくなって、PS2を三日つけっぱなしにした。テープの上から少しだけ光っていた。
  sleep_talk: >-
    寝言で「重複です」と言うらしい。エラが録ろうとしたので、録ったら辞めさせると言った。
    録ってはいないけど、エラは真顔で再現できるようになった。それが一番似ている。
  sleep_stuffed: >-
    スライムのぬいぐるみを抱いて寝る。押すと形が変わるので、どの寝相にも合う。
    一度洗濯したら、少し縮んで目の位置がずれた。今はちょっと驚いた顔のスライムになっている。
  season_typhoon: >-
    台風の日は、停電に備えて携帯ゲーム機を全部充電する。ゲームボーイだけは電池なので、単三を八本並べる。
    去年は一度も停電しなかった。充電した分を全部遊んで、台風が過ぎる前に寝た。
  season_xmas: >-
    クリスマスはこたつでケンタッキー。予約はモーラが十二月の頭にしてくれる。
    受け取りの時間に起きられなくて、モーラが取りに行った。帰ってきたモーラに、レシートを渡されて手のひらを出された。
  home_regret_buy: >-
    ルームランナーを買った。運動のためじゃなくて、歩きながらゲームをしたかった。
    三日で、乗る前に寝るようになった。今は洗濯物が一番よく乾く場所になっている。
  home_neighbor: >-
    上の部屋のモーラが、締め日の夜中に電卓を叩く。トン、トン、と規則正しい。
    それを聞くと安心して寝られる。止まると心配で起きる。止まって十分たつと、合鍵の場所を確かめる。
  home_storage: >-
    ドリームキャストの箱を捨てられない。本体はとっくに出して使っているのに、箱だけ押し入れの奥にある。
    中に何を入れていたか忘れて、開けたら発泡スチロールの形に、昔の攻略本が一冊挟まっていた。
  money_gacha: >-
    一回だけ、天井まで回したことがある。欲しかったキャラは天井の二回手前で出た。
    天井で交換できる分が余ったので、要らないキャラと交換した。それ以来、やめどきが書いてないガチャの話をすると声が少し大きくなる。
  money_coins: >-
    小銭は、ファミコンのカセットの空き箱に入れている。重くなったらモーラに渡して、両替してもらう。
    この前渡した箱には、小銭と一緒に、なくしたと思っていたSwitchのカードが入っていた。モーラは「ちゃんと帳面に付けた」と言った。
  travel_want: >-
    宇治のニンテンドーミュージアムに行きたい。チケットは三か月前に申し込む抽選で、申し込む日を毎回忘れる。
    ねぼすけ号に知らせを鳴らさせることにした。鳴った日に、寝ていて申し込まなかった。
  travel_sleep_through: >-
    新宿から中央線に乗って、寝過ごして終点の高尾まで行った。改札の外に出て、山が近いことに驚いた。
    せっかくなので、駅前でそばを食べて帰った。帰りの電車でも寝て、新宿を一駅過ぎた。
  travel_late_train: >-
    終電を逃して、駅前のネットカフェに入った。リクライニングの席が思ったより寝心地がよかった。
    朝、店員さんに起こされて延長料金を払った。それ以来、終電を少しだけわざと逃すことがある。
  school_trip: >-
    修学旅行は京都。宿の夜に友達とゲームボーイの通信ケーブルで対戦していて、先生に没収された。
    ケーブルは最終日に返ってきた。先生が帰りのバスでテトリスをしていたのを、私は見ていた。
  school_kurohistory: >-
    ノートの最後のページに、自分で考えた裏技を書いていた。「タイトルでAを百回押すと」みたいなやつ。
    隣の子に本物だと言ったら、本当に百回押してくれた。何も起きなかった。今、その子に謝れるなら謝りたい。
  school_baito: >-
    学生の頃、ゲーム屋のレジでバイトしていた。中古の買い取りで、箱と説明書がそろっているかを見る係。
    説明書のはさみ込みのはがきまで見るので、店長に「そこは見なくていい」と言われた。今でも中古を買うと、はがきを探す。
  child_scold: >-
    子どもの頃、ファミコンを夜中までやっていて、母にコンセントを抜かれた。セーブの直前だった。
    次の日から、母が寝た音を確かめてから始めるようになった。母は今でも電話で「まだゲームしてるの」と言う。
  child_magazine: >-
    小遣いはファミマガに消えた。ウソ技のコーナーを、本気で試して日曜を一日つぶした。
    嘘だと分かって泣きそうになったけど、次の号でも同じように試した。嘘でも、試している時間は楽しかった。
  child_mistake: >-
    ドラクエ4の「さくせん」を、ずっと「さくせい」だと思っていた。作るものだと思っていた。
    友達に直されたとき、少し恥ずかしくて「どっちでも仲間は動くわ」と言った。今思うと、方針を作るという意味では合ってる。
  net_game_app: >-
    ポケモンスリープは、寝るだけで進む。私のために作られたとしか思えない。
    計測を始めてから寝ると、朝に寝顔が集まっている。昼寝の分も測っていたら、一日の睡眠が十四時間と出て、アプリの方が心配してきた。
  net_burn: >-
    グループLINEに、寝ぼけて「重複です」とだけ送った。前後の話はモーラとエラの夕飯の相談だった。
    モーラは「カレーが重複ってこと？」と返してきた。結局その日はカレーになって、本当に二日続いた。
  net_streamer: >-
    RTA in Japanの配信は、夏と冬に一週間ずっと流している。寝て起きると、違うゲームが走られている。
    2025年の夏は任天堂のゲームが出なかった。寝て起きても、ずっと知らないゲームなのが新鮮だった。
  fac_vim_emacs: >-
    エディタはemacs。中にテトリスが入っていて、M-x tetrisで始まる。
    さらに、勝手にテトリスを遊んでくれるautotetrisというのを足せる。入れたら、寝ている間もずっと積んでくれていた。理想の道具。
  fac_kinoko_takenoko: >-
    きのこの山派。持つ所があるので、寝ながら食べても指にチョコが付かない。
    たけのこ派のエラは「チョコの量が正義でございます」と言う。私は箱をエラに渡して、きのこだけ選んでもらっている。
  gear_carrier: >-
    自分のスマホは楽天モバイル。なのに、エラの回線だけは私名義のdocomoの家族回線になっている。
    エラを拾ったときに、とりあえず一番近い店で契約したから。毎月二つの請求が来て、片方はモーラに見られている。
  gear_game_console: >-
    ゲーム機は全部持っている。ファミコンからSwitch 2まで、ソファの周りに並んでいる。
    手が届く順に並べたら、発売の順とほぼ逆になった。一番遠いのがファミコンで、取りに行くのに一番歩く。
  gear_tv: >-
    ブラウン管の14インチを置いている。昔の光線銃のゲームは、液晶だと撃っても当たらないから。
    重すぎて、運んだのはモーラとエラの二人。私は持ち上げる掛け声だけかけた。
  gear_broken: >-
    赤い三つの光が点いたXbox 360を、修理に出さずに置いている。保証は延びていたのに、送る箱を用意するのが面倒だった。
    今では、見ると「直す気のない事は、置いておくと思い出になる」と思うようになった。モーラは「粗大ごみの日は木曜」と言う。
  media_horror: >-
    『SIREN』は、夜にやったのが悪かった。2003年のPS2のゲーム。一面の途中で、電源を切った。
    次の日の昼に続きをやろうとしたら、昼でも怖かった。今もディスクだけ持っていて、ケースは裏返して棚に入れてある。
  media_ad: >-
    「セガサターン、シロ！」が、今でも頭の中で鳴る。藤岡弘、が街の人を投げ飛ばすCM。
    サターンを買ったのは、正直あのCMのせい。今もソファから一番遠い所に置いてある。投げられたくないので。
  media_karaoke_song: >-
    カラオケの十八番は「ポケモン言えるかな？」。1997年の曲で、初代の151匹を歌う。
    全部言えたことはない。いつも八十匹目くらいで、画面の文字を目で追うのに疲れて寝る。一人カラオケだと、そのまま延長になる。
  health_walk: >-
    一日の歩数は三百歩くらい。ソファから冷蔵庫と、たまに上の階のモーラの部屋。
    ポケモンGOを入れたら、たまごが一つも孵らなかった。アプリから「歩いてみませんか」と通知が来た。
  people_gift_recv: >-
    一番嬉しかったのは、モーラがくれた大きい枕。「どうせ下に物を入れるんでしょ」と言いながら渡された。
    実際、下に置ける物が二つ増えた。モーラはそれを見て「そういうつもりじゃなかった」と言ったけど、取り上げはしなかった。
  work_mistake: >-
    頼まれたゲームの基板の電池を、逆向きに付けて返してしまった。届いた先で、セーブが一つも残らなかった。
    謝りに行って、ただで付け直した。それからは、付ける前に必ずスマホで電池の向きを写真に撮る。
  work_dream_job: >-
    生まれ変わったら、ゲームの会社の中で不具合を探す係（QA）になりたい。中にいれば、外の誰よりも先に見つけられる。
    そう言ったら、朝五時の報告者に「中の人も重複しますよ」と言われた。夢がないことを言う。
  era_wifi_first: >-
    家にネットが来たのは90年代のダイヤルアップ。テレホーダイで、夜11時から朝8時まで定額だった。
    11時にピーガーとつないで、そのまま朝まで起きていた。夜型になったのは、あれのせいだと思っている。
  era_tamagotchi: >-
    1996年の初代のたまごっちを持っていた。寝ている間にお世話をさぼって、何回も見送った。
    放置しても育つゲームが好きになったのは、たぶんその反動。たまごっちは、放置させてくれなかった。
  era_bubble: >-
    1988年2月10日、ドラクエIIIの発売日に並んだ。平日の朝で、列の中で立ったまま寝た。
    前の人が私の分まで進んでくれて、気づいたら店の入口だった。あの人の顔を覚えていないのが、今でも少し悔しい。
  era_corona: >-
    2020年の3月20日に出た『あつまれ どうぶつの森』を、その春ずっと遊んでいた。島で釣りをして、桟橋で寝た。
    ゲームの中でもベッドを一番に買った。家具の配置は全部ソファの周りに寄せた。
  era_konbini_old: >-
    昔、城下の帰り道にam/pmがあった。2011年にファミマに変わって、看板の色が変わった。
    同じ場所に今もファミマがあるけど、私はローソン派なので、深夜の帰り道の店が一軒減った気がしている。
  rec_last_letter: >-
    最後に書いた手紙は、サ終したMMOへのBAN解除のお願い。毎年同じ日に送っている。
    今は宛先がなくて戻ってくる。戻ってきたメールにも「お問い合わせありがとうございます」みたいな定型文が付いていればいいのに、と毎年思う。
  rec_life_lucky: >-
    中古屋の箱の底から、ギミック！のカセットが出てきた日。値札は他のと同じ値段だった。
    レジに持っていく間、誰かに取られる気がして、ずっと両手で持っていた。家に着いて、そのまま枕の下に入れた。
  qbox_number: >-
    好きな数字は8。昔のゲーム機で、横一列に並べられるスプライトの数。
    チャットで「エイトって言うと何かのアイドルっぽい」と言われて、そこから三十分そっちの話になった。私は寝ていた。
  qbox_castle_secret: >-
    城のお気に入りは、自分の部屋のソファ。真上がモーラの部屋で、静かなのに、誰かがいるのが分かる。
    エラが「城のどこが一番お好きですか」と聞いたとき、私が寝たまま天井を指さしたので、モーラの部屋だと思われた。訂正はしていない。
