stories:
  food_fav: >-
    城下の蕎麦屋で鴨南蛮を頼むと、大将が鴨を焼く音を聞きながら待つのが楽しみ。
    一度、焼く音が途中で止まったので「焦げております」と言ったら当たっていて、それから大将に厨房の音を相談されるようになった。
    当方は蕎麦を食べに行っているのか、音を聞きに行っているのか、分からなくなっている。
  food_karaage: >-
    唐揚げの大皿が出ると、当方は手羽だけを探す。宴で主様の皿に取り分けるとき、手羽を一つも渡さなかったのがばれた。
    主様に「エラの皿だけ骨が山になってる」と言われ、モーラ様に骨の数を数えられた。七本。
  food_spicy: >-
    CoCo壱番屋で5辛を頼み、汗一つかかずに食べたと思っていたら、尾の先だけ汗で湿っていた。
    店員の方に「大丈夫ですか」と聞かれたのは、顔ではなく尾を見てのことだった。
  food_bento: >-
    峠の釜めしの器を、捨てられずに筆立てにしている。今四つ。
    一つは鉛筆、一つはピック、一つは耳栓を入れる用にしたが、その器だけいつも空になっている。
  food_okonomiyaki: >-
    広島風のお好み焼きを、店の方が鉄板で層を重ねていくのを見て、思わず「三トラック目でございますね」と言った。
    店の方は何も言わずに四層目の卵を割った。当方は一人で頷いていた。
  sweets_chips_brand: >-
    城でポテトチップスの袋を並べたら、湖池屋は当方の一袋だけだった。
    「孤立しております」と申し上げたら、主様に「エラはいつも一人だけ違う盤を持ってくる」と言われた。褒められたのかは分からない。
  sweets_wagashi: >-
    とらやの羊羹「夜の梅」を、名前だけで選んだ。切ると小豆が梅の花のように見えるらしいと後で知った。
    最初に食べた夜は、ただ「夜」という字が当方どもに合うと思っただけでございます。
  sweets_kaki: >-
    柿の種とピーナッツは、今の袋だと7対3。昔は6対4だった。
    当方は昔の比率に合わせて、ピーナッツを別の袋から足している。主様に「それ、自分で比率を作ってるだけじゃん」と言われた。その通りでございます。
  sweets_best_ever: >-
    主様が一度だけ、厨房でスコーンを焼いてくださった。底が真っ黒だった。
    当方は黙って全部いただいた。「焦げてた？」と聞かれて「香ばしゅうございました」とだけ申し上げた。その一言は、今も嘘ではないと思っている。
  drink_coffee_tea: >-
    紅茶は聴く盤で決める。サバスの日は濃いアッサム、ジャズの日はダージリン。
    困るのは、主様が朝から盤を替えろと言う日。湯を沸かし直しているうちに、主様が二度寝なさる。
  drink_tea_bottle: >-
    生茶を選ぶのは、外で紅茶の味見の仕事が入った日のため。苦い茶を飲むと舌が鈍る。
    一度、自販機に生茶がなくて、仕方なく別のお茶を飲んだら、その日の紅茶の評価が全部辛くなった。依頼主に謝った。
  drink_drunk: >-
    酔うと敬語が一段重くなり、曲名の敬語訳が止まらなくなる。宴の翌朝、主様に「昨日、メタリカの全部の曲を訳してた」と言われた。
    覚えていない。ただ、一番出来がよかった訳だけは主様が覚えていて、教えてくださらない。
  chain_cafe: >-
    城下の個人の喫茶店は、店主が自分のレコードをかける。一度、針が飛んで同じ所を繰り返したまま、店主が気付かずにいた。
    当方は三周待ってから、そっと立って針を上げた。店主は「ありがとう」とだけ言って、その日のお代を取らなかった。
  chain_karaoke: >-
    ビッグエコーで、当方はタンバリンの係。主様が歌う間、拍を一つも外さずに叩く。
    三時間叩いて、主様に「エラも一曲」と言われたので、タンバリンを二倍の速さにして話をそらした。
  chain_indie: >-
    中古盤屋の店主は、当方が入ると黙ってメタルの棚を指さす。先日は指さしたあとで、首を横に振った。
    「今日はない」という意味だった。言葉なしで、ここまで通じる相手はほかにいない。
  cook_fail: >-
    主様の目覚ましの旋律を直しながらスコーンを焼いていて、二十分焦がした。
    煙で厨房の方々が駆けつけ、当方はヘッドホンをしていたので最後まで気付かなかった。旋律の方は、その日いい所まで直った。
  cook_measure: >-
    茶葉は0.1グラムの秤で量る。なのに塩は指でつまむ。
    ピム様に「量るなら全部量ってください！」と言われたが、塩は指の方が正確だと申し上げた。証拠はない。
  cook_tool: >-
    紅茶の蒸らしは三分の砂時計で計る。砂時計が見当たらない日は、三分の曲を一曲かける。
    サバスの『Paranoid』は三分に少し足りないので、その日の紅茶は少し薄い。
  morning_shoes: >-
    靴紐は毎朝ほどいて結び直す。結んであっても結び直す。
    主様に「それ、バンドのギターを毎回調弦し直してクビになったのと同じ癖じゃない？」と言われて、靴紐を持ったまま固まった。
  morning_routine: >-
    朝、一枚目の盤の最初の一音で、その日の紅茶が決まる。
    ある朝、針を落としたら盤が逆さまでB面の最後の曲が鳴った。その日の紅茶をどうしたか、主様に毎年聞かれる。正解はアールグレイ。
  bath_phone: >-
    浴室では絶対に歌わない。湯気の中で鼻歌が出たことがあり、浴室の残響のせいで、四分の一音低いのが自分でもはっきり聞こえた。
    それ以来、湯船ではハミングすら禁じている。数を数えるだけにしている。
  bath_onsen: >-
    城崎温泉の外湯を七つ回って、どの浴室の残響がいちばん長いか確かめた。
    手を叩いて回っていたら、三つ目の湯で常連の方に「お嬢ちゃん、拍手は湯から上がってから」と言われた。
  sleep_futon: >-
    床が傾いているので、ベッドを置いたら一晩で壁の方に寄っていった。
    今は布団。ただ、寝ている間に当方も少しずつ低い方へ転がっていて、朝はレコード棚の前で目が覚める。
  sleep_talk: >-
    主様に「エラ、寝言で『二分十四秒』って言ってた」と言われた。
    何の曲の二分十四秒なのか、当方にも分からない。今も、それらしい曲を探して二分十四秒の所だけ聴いて回っている。
  sleep_sheep: >-
    眠れない夜は、頭の中でゴルトベルク変奏曲を最初から弾く。たいてい途中の変奏で寝る。
    最後まで弾けた夜は一度だけで、その夜は朝まで眠れなかった。終わってしまったので。
  season_typhoon: >-
    台風の夜は、窓が鳴る音の高さを当てる。たいていラとシの間。
    ピアノで合わせてみたら、隣の厨房の方々も起きてきて、皆で窓の音程を当てる会になった。当方が一番外した。
  season_hanabi: >-
    花火は、光ってから音が届くまでの秒数を数える。三秒なら一キロくらい。
    主様に「きれいって言いなよ」と言われて、「一キロ先、きれいでございます」と申し上げた。
  season_valentine: >-
    主様に手作りのトリュフを渡したら、主様はそれをモーラ様と半分こしていた。
    翌年は二人分作った。主様は今度はノクス様と半分こした。当方は毎年、作る数を一つずつ増やしている。
  home_regret_buy: >-
    床の傾きを測るために水平器を買った。泡が毎日同じ所にいる。
    直すために買ったのに、直す予算はモーラ様が出してくださらないので、水平器は毎朝、当方を落ち込ませるだけの道具になった。
  home_neighbor: >-
    隣の厨房で朝の仕込みが始まると、包丁の音がちょうど四拍子になる。
    ある朝、それに合わせて鍵盤を弾いていたら、料理長が気付いて、わざと五拍子で刻み始めた。それから毎朝、拍子当ての勝負になっている。
  money_secondhand: >-
    メルカリで、同じ盤が三枚あるので一枚売ろうとした。写真を撮り、説明を書き、値段を付けた。
    そこで手が止まり、どの一枚も帯の色が少しずつ違うことに気付いて、出品を取り消した。今も三枚ある。
  money_gift: >-
    人への贈り物は、その方に合う一枚の盤を選ぶ。モーラ様には帳簿に合いそうなバッハを贈った。
    モーラ様は「ありがとう」と言って、それを機材費の欄に書いた。当方の機材費として。
  travel_hotel_first: >-
    宿の部屋に入ると、まず手を一つ叩いて残響を聞く。ある旅館では、叩いた瞬間に仲居の方が「はい」と返事をして入ってきた。
    呼んだのではございません、と説明するのに三分かかった。
  travel_pack: >-
    旅の荷物には必ず耳栓を入れる。入れたことを三回確かめる。
    それでも着いた先で鞄を開けると、ないことがある。家に帰ると、耳栓は玄関の小皿の上で待っている。
  school_festival: >-
    文化祭の有志のバンドで鍵盤を弾いた。ソロの所で気持ちが乗って、予定の三倍弾いた。
    終わったあと、ギターの子に「ソロが長い」と言われた。人生で一回目。二回目は、城下のバンドをクビになった朝だった。
  school_kurohistory: >-
    学生の頃、ノートの後ろに洋楽の曲名の敬語訳を書き溜めていた。百を超えていた。
    今も同じことを配信でやっている。黒歴史ではなく、ずっと続いている歴史でございます。
  school_reading_report: >-
    読書感想文に『ジャン・クリストフ』を選んだ。音楽家の話だったので。
    一巻で力尽き、残りは題名と表紙から想像で書いた。先生の評は「後半の展開が独特」。全部、当方の想像でございます。
  child_mistake: >-
    閉店の音楽を、ずっと「蛍の光」だと思っていた。あれは三拍子に直した『別れのワルツ』だと知ったのは大人になってから。
    知ってからは、閉店の音楽が流れると心の中で「ワルツでございます」と拍を取ってしまい、店を出るのが遅くなる。
  child_game_first: >-
    初めてのゲームはファミコンの『ドラゴンクエスト』。序曲が始まる所が聴きたくて、電源を何度も入れ直した。
    冒険はなかなか進まなかった。最初の町を出る前に、序曲を何十回も聴いていた。
  net_burn: >-
    主様宛てに「お茶の時間でございます」と送るつもりで、配信のチャット欄に書いた。
    チャットが一斉に「はい」「いただきます」と返してきた。その日は皆様に紅茶の淹れ方を話して終わった。
  net_ai: >-
    城下のゲームの劇伴で、仮の歌をAIに歌わせてみた。当方より音程が正しかった。
    悔しかったので、本番は当方が鍵盤で旋律を弾いて、誰にも歌わせなかった。
  gear_earphone: >-
    iPhone 15 Proにはイヤホンの穴がない。当方は有線のShure SE215を、USB-Cの変換でつないでいる。
    変換の小さな部品を三回なくした。今はイヤホンのコードに結び付けてある。見た目は気にしない。
  gear_broken: >-
    カセットデッキは巻き戻しだけが壊れている。早送りはできる。
    なので最後まで聴いたテープは、裏返してもう一度最後まで聴くしかない。昔のバンドのテープも、そうやって聴いた。
  media_karaoke_score: >-
    一度だけ、主様に言われてDAMの精密採点を入れた。画面の音程のバーに、当方の線が全部下にずれて並んだ。
    きれいに、同じ幅で、全部下。主様に「逆に正確」と言われた。慰めになっていない。
  media_movie: >-
    『スパイナル・タップ』は、アンプの目盛りが11まであって「一つ大きい」と言い張る場面が有名。
    当方は笑いながら、バンドがメンバーを入れ替えていく所で毎回少し胸が痛む。月下晩餐会の頃を思い出すので。
  media_live: >-
    初めてのライブは1984年3月の武道館、レインボー。二階の後ろの方だった。
    武道館二階東様に話したら「その日、俺もいた」と言われた。席を聞いたら、当方の三列前だった。四十年経ってから知った。
  media_bgm: >-
    作業中は無音にしている。音楽をかけると、どうしても聴いてしまって手が止まる。
    一度、主様の部屋の掃除中にサバスをかけたら、床を拭く手がドラムの拍になって、同じ所を三十分拭いていた。
  media_ad: >-
    ヨドバシカメラの歌は、元が『リパブリック讃歌』だと知って、悔しいほどよくできていると思った。
    店で流れていると、つい和声を数えてしまう。そのせいで、買いに来たケーブルを買い忘れた。
  health_dentist: >-
    歯医者のドリルの音の高さを当てるのが楽しみ。先生に「今のはミですね」と言ったら、先生が手を止めた。
    「次はファです」と言われた。先生も分かる方だった。それ以来、少し歯医者が好きになった。
  health_checkup: >-
    健康診断の聴力検査で、右の高い音だけ少し落ちていた。2024年に耳栓を忘れた方の耳。
    人には「耳栓を」と申し上げているのに。検査の方には「音楽のお仕事ですか」と聞かれて、何も言えなかった。
  people_best_friend: >-
    中古盤屋の店主とは、同じ盤の箱に同時に手を伸ばしたのが最初。当方が譲った。
    翌週行くと、その盤が取り置きされていて「先週の人に」と札が付いていた。それから十年以上の付き合い。
  people_wedding: >-
    城下の結婚式で伴奏をした。新郎の入場の曲が長すぎて、新郎が歩き終わっても曲が終わらない。
    当方は勝手に八小節切って、きれいに終わらせた。式の後、新郎の方から一番感謝された。ソロを短くするのは、今は得意。
  people_family_call: >-
    主様とは同じ城なので、連絡は呼び鈴。一回なら紅茶、二回ならお菓子、三回は急ぎ。
    たまに四回鳴る。四回の意味は決めていないのに、主様は毎回四回鳴らす。行くと、たいてい暇なだけ。
  work_mistake: >-
    城下のゲームの劇伴で、ループの継ぎ目が一拍ずれたまま納品してしまった。
    発売されたあと、誰も気付かなかった。当方だけが毎回、そのゲームの音を聞くと一拍目で肩が動く。
  work_skill: >-
    廊下の足音の拍で、向こうから来るのが誰か分かる。主様はゆっくりで、たまに止まる。モーラ様は一定。
    一度だけ外した日があり、それはモーラ様が主様の真似をして歩いていた日だった。
  rec_last_cry: >-
    メガデスの最終作の11曲目、メタリカの『Ride the Lightning』の新しい版で泣いた。
    クビになった方が、クビにした側の曲を自分の手でもう一度録った。当方は、自分のリフを今もあのバンドが弾いているか、まだ確かめていない。
  rec_last_new: >-
    城のピアノを自分で調律した。弾いてみたら、どこか昔の響きがした。
    ピアノ教室の先生に聞いてもらったら、古い調律法になっていると言われた。直すのにもう一日かかった。
  rec_life_long_wait: >-
    ライブの物販に四時間並んで、当方の番の一人前で、当方のサイズのTシャツだけが売り切れた。
    大きいサイズを買って、部屋着にしている。四時間並んだ部屋着なので、今も大事に着ている。
  qbox_skill: >-
    床に落ちた硬貨の音で、何円玉か当てられる。主様が試しに財布の中身を全部落とした。
    全部当てた。ただ、拾うのは当方だった。主様は落とすだけ落として、満足してお部屋に戻られた。
  qbox_number: >-
    好きな数字は4。サバスの原メンバーの数。2025年の最終公演で、その四人が久しぶりに同じ舞台に並んだ。
    配信の画面を一人で観ながら、指で四を数えた。数えるまでもないのに。
