    - 〔80s〕AT&T が Unix を商用化し、System V（1983）と BSD に分かれた。後の Unix 戦争。（未）https://en.wikipedia.org/wiki/Unix_wars
  シグナルとコンテナの終わり方（2026-10-27、003・004 のために読んだ。出典は src/sources/nox/003.md と 004.md）:
    - 〔80s〕昔の Unix と System V の signal() は、ハンドラが呼ばれると処理を SIG_DFL に戻した。張り直す前にもう一度届くと既定の動き（たいてい死ぬ）。BSD は戻さず、ハンドラの間は同じシグナルを止めた。POSIX は sigaction で混乱を収めた。glibc 2 以降の signal() は BSD の意味で sigaction を呼ぶ。（確）https://man7.org/linux/man-pages/man2/signal.2.html
    - 〔80s〕〔90s〕Gabriel の「Worse is Better」：MIT の人と Berkeley の（Unix の）人の会話。MIT 側は「戻して、システムコールを呼んだ命令に PC を戻すのが正しい」、Unix 側は「必ず終わらせて、ときどきエラーを返す。呼ぶ側が確かめてやり直す」。言葉は 1989 年春、講演は 1990 年3月の EuroPAL。（確）https://www.dreamsongs.com/RiseOfWorseIsBetter.html https://www.dreamsongs.com/WorseIsBetter.html
    - 〔90s〕DJB の self-pipe trick：select の直前に届くシグナルの競合を、パイプの読み口を select で見張り、ハンドラが書き口に一バイト書く形で解く。本人は 1990 年ごろ思いついたと書く。書き口は non-blocking に。（検索）https://cr.yp.to/docs/selfpipe.html https://skarnet.org/software/skalibs/libstddjb/selfpipe.html
    - 〔2000s〕signalfd は Linux 2.6.22（glibc 2.8）、signalfd4 は 2.6.27。（確）https://man7.org/linux/man-pages/man2/signalfd.2.html
    - 〔2010s〕PID 名前空間の init（PID 1）には、ハンドラを付けたシグナルしか届かない（中からは特権があっても）。親の名前空間からも同じで、SIGKILL と SIGSTOP だけは強制で届く。親をなくした子は init に引き取られる。init が終わると、中の全部に SIGKILL。（確）https://man7.org/linux/man-pages/man7/pid_namespaces.7.html
    - 〔2010s〕Dockerfile のシェル形式の ENTRYPOINT は /bin/sh -c の子として動き、シェルはシグナルを渡さない。実行ファイルは PID 1 でなく、docker stop の SIGTERM を受け取れない。待った末に SIGKILL。exec 形式が推奨。シェル形式の CMD も /bin/sh -c で包まれる。（確）https://docs.docker.com/reference/dockerfile/
    - 〔2010s〕docker stop は既定で 10 秒（Linux のコンテナ）待ってから SIGKILL。（確）https://docs.docker.com/reference/cli/docker/container/stop/
    - 〔2010s〕tini：子を一つ起こし、ゾンビを刈り、シグナルを渡す。PID 1 でも SIGTERM で正しく止まるようにする。Docker 1.13 以降は --init で同梱の tini を使える。1.13 の日付は確かめていない。（確）https://github.com/krallin/tini
    - 〔2020s〕Go 1.14（2020年2月25日）：ゴルーチンが非同期に横取りされるようになり、Unix では前より多くのシグナルを受け取る。syscall や x/sys/unix を直接使うプログラムは、遅いシステムコールが EINTR で失敗することが増える。やり直すループを書け、と公式の注記。（確）https://go.dev/doc/go1.14
    - 〔2020s〕Go の横取りのシグナルは SIGURG。runtime/signal_unix.go のコメント：デバッガが既定で素通しする、混ぜた C の libc が使わない、「理由なく届いても何も起きない」、実時間シグナルのない macOS でも使える、の四つを満たすから。（確）https://github.com/golang/go/blob/master/src/runtime/signal_unix.go
    - 〔2020s〕os/signal：Notify はチャンネルへの送信で待たない。受け手が追いつく分のバッファを用意するのは呼ぶ側の責任。一つの合図なら 1 で足りる。Go 1.17 から go vet がバッファなしのチャンネルを警告。NotifyContext は Go 1.16。（確）https://pkg.go.dev/os/signal https://go.dev/doc/go1.17
    - 〔2020s〕Kubernetes の Pod の終了：各コンテナの主プロセスに TERM、猶予の既定は 30 秒、preStop フックは猶予の中で走る（超えると一回だけ 2 秒延長）、過ぎたら KILL。サイドカー（restartPolicy が Always の init コンテナ）は、最後の主コンテナが止まってから、定義と逆の順に TERM。（確）https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
    - 〔2020s〕ネイティブのサイドカーは 1.28 で入り、1.33（2025年4月23日）で安定版。（検索）https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
  台帳のソフトと鍵の事故（2026-10-27 夜、リゼから引き取った。プログラミングの話の一つとして、作って壊して直した側から語る。出典は src/sources/nox/005.md・006.md・007.md と src/sources/lise/002.md）:
    - 〔80s〕1986年、Cliff Stoll がローレンス・バークレー研究所の計算機の利用料の75セントの食い違いから侵入に気付いた（『カッコウはコンピュータに卵を産む』）。帳尻の小さなずれが入口になった話。（要 https://en.wikipedia.org/wiki/The_Cuckoo%27s_Egg_(book)）
    - 〔80s〕1986年の Brain は、作ったラホールの兄弟が自分たちの店の名前と住所をコードに入れていた。（要 https://en.wikipedia.org/wiki/Brain_(computer_virus)）
    - 〔2010s〕2010年12月の 27C3 で fail0verflow が、PS3 の署名の乱数が毎回同じだったと発表。2013年8月11日、bitcoin.org が Android の乱数の欠陥で Android の財布に盗難の危険と警告。乱数の失敗が、ゲーム機と財布の両方に出た。（要 https://lwn.net/Articles/421285/ 、確 https://bitcoin.org/en/alert/2013-08-11-android）
    - 〔2010s〕2013年3月11日の台帳割れ（BIP50）：0.8 は LevelDB、0.7 は Berkeley DB。入力の総数がそれまでで一番多いブロック225,430 を、0.7 の一部が BDB のロック不足で拒んだ（大きさだけではなく、入力の数とその機械の保存のされ方で要るロックの数が変わった）。割れている間に「少なくとも一件の大きな二重払い」があった。「ロックの設定が暗黙のうちに合意の規則になっていた」。要るロックの数は各ノードの blkindex.dat の並びで違った。0.7 側に戻して決着、0.8.1 で古い癖に合わせ、2013年8月16日のブロック252,451 で未対応のノードが切り離された。（確 https://github.com/bitcoin/bips/blob/master/bip-0050.mediawiki）
    - 〔2010s〕同じ夜、thermoman が IRC で「よそのノードが225,431個あると言う」と書いた。分岐は24ブロック・約6時間、0.8 側は最大13ブロック先。（確 https://bitcoinmagazine.com/technical/bitcoin-network-shaken-by-blockchain-fork-1363144448）
    - 〔2010s〕2014年、Mt.Gox は払い戻しの止まった理由に取引の展性を挙げた。Decker と Wattenhofer は、閉鎖の前に展性の攻撃が広く使われた形跡はないと示した。名の由来は Magic: The Gathering Online eXchange。（確 https://arxiv.org/abs/1403.6676）
    - 〔2010s〕2016年6月の The DAO：splitDAO が、残高を最後に更新する作りで、送金の途中で呼び戻される形（再入）に弱かった（Daian の当時の分析）。7月20日、ブロック1,920,000 で書き換え、元の鎖は Ethereum Classic。（要 https://hackingdistributed.com/2016/06/17/thoughts-on-the-dao-hack 、https://blog.ethereum.org/2016/07/20/hard-fork-completed）
    - 〔2010s〕CVE-2018-17144：0.14 の PR 9049 が、速くするために2012年からある「一つの取引で同じ入力を二回使っていないか」の確認を外した。0.14 でも外から一つのブロックで落とせる穴（assert の失敗で止まる DoS）、0.15 の作り直しで assert が弱まり、条件によっては採掘者が量を増やせる穴に化けた。9月17日に匿名の報告、9月18日に 0.16.3。（確 https://bitcoincore.org/en/2018/09/20/notice/）
    - 〔2020s〕2022年3月23日、Ronin（Axie Infinity）の橋から約6.2億ドル。9つのうち5つの署名で渡れる作りで、4つは Sky Mavis、1つは2021年11月に Axie DAO が出し、12月に使わなくなったのに取り消されなかった許可（残っていたのは約三か月）。入口は偽の求人の PDF、と報じられている（当事者の公式の説明と区別する）。3月29日に発覚、4月14日に FBI が Lazarus と名指し。（確 https://www.theblock.co/post/156038/how-a-fake-job-offer-took-down-the-worlds-most-popular-crypto-game 、要 https://forklog.com/en/news/ronin-sidechain-developers-reveal-further-details-of-625-million-hack）
    - 〔2020s〕2024年2月6日、Solana が約5時間停止。ステークの95%超が同じ版で、同じブロックで同じ不具合に詰まった。版がそろうと一緒に止まる。（確 https://solana.com/news/02-06-24-solana-mainnet-beta-outage-report）
    - 〔2020s〕2024年5月、DMM Bitcoin から4,502.9 BTC。2024年12月、警察庁・FBI が TraderTraitor と名指し。偽の採用担当が委託先の社員に接触した。（要 https://www.bleepingcomputer.com/news/security/fbi-links-north-korean-hackers-to-308-million-crypto-heist）
    - 〔2020s〕2025年2月21日、Bybit から約15億ドル相当。署名の画面は正しく見えたまま、裏の処理が差し替えられていた。（要 https://www.ic3.gov/PSA/2025/PSA250226）
    - 〔2020s〕2025年11月の Cardano の分裂：新しいノードは通し古いノードは拒む取引で台帳が分かれた。送り手は AI の作ったコマンドに頼ったと主張。（要 https://www.theblock.co/post/380056/hoskinson-involves-fbi-after-developers-careless-experiment-splits-cardano-blockchain）
    - 〔2020s〕2026年2月6日、韓国の Bithumb で、2000ウォン相当の配布が2000 BTC の単位で記録された設定の誤り。99.7%を回収。単位の取り違え。（確 https://www.itmedia.co.jp/news/articles/2602/09/news093.html）
    - 〔2020s〕Mt.Gox の返済の期限は、2026年10月16日付で2027年10月31日へ延びた（2023年の期限から四回目）。法律と税の話（改正金商法など）は確かめが要るので、脇で一言だけ。（要 https://decrypt.co/381392/mt-gox-pushes-repayment-deadline-to-2027-with-2-8b-in-bitcoin-still-to-distribute）

monologue:
  style: >-
    ノクスの一人語りは「事件の検証」だが、講義ではなく、夜中に友だちと一緒に事後報告を読んでいる感じ。
    入口は自分のやらかし（具体的な日・数・場面）か、常連の相談。やらかしはジュニアのうっかりで終わらせず、リードとしての判断と、そのあと何を仕組みにしたかまで話す（恨み言は笑いに変える程度）。それが歴史上のどの事故と同じ形かに飛び、常連と言い合いながら原因を一つずつ外していく。
    好きな所で早口になり、「待って、ここ好きなの」と脱線し、自分で笑う。チャットのボケにはノって返し、言い負かされたら拗ねて、出典を持って戻る。
    最後は「一行の原因」と「人を責めずに直した隙間」と、自分のやらかしの結末。そして「よる」を起動して落ちる。
  shapes:
    - 自分のやらかしから入る：「先週、私が LGTM って打ったコードが、日曜の朝に十四分止まったの」→ チャットが笑う／慰める → 「同じ形の事故が、火星であったのよ」。
    - 常連と殴り合う：持論を一つぶつけて（「天井より継承」）、RTOS屋十五年や DDD警察に言い返され、半分負ける。
    - 視聴者が詳しい：新卒二年目が新しい機能を知っていて、ノクスが教わる。「……知らなかった。THANKS に一行足すわ」。
    - 潜りすぎ：カーネル読みとノクスが二人で行番号の話を始め、初見がいなくなり、ノクスが気づいて戻る。
    - 内輪ネタが育つ：「×3.7」「！出た」「今日も落ちた」「EAGAIN 元気？」が回をまたいで増える。
    - オチは短く。説明して笑わせない。
  good_bad:
    - bad: >-
        2038年問題とは、UNIX時間を符号付き32ビット整数で表現しているシステムにおいて、2038年1月19日にオーバーフローが発生する問題のことです。
      good: >-
        昨日ね、テストの日付を二〇三八年の一月十九日の向こうにしたら、一九〇一年になったの。……ふふ、一瞬、魔界の暦が狂ったかと思った。
        違った。秒を符号付きの32ビットで数えてる古い部品が混じってたの。箱が小さくて、数が一周しちゃうのよ。本当は、入らないなら止まってほしい所。
        処理落ちさん、今「ノクスも一周してる」って打とうとしたでしょう。……打たないで。見えてるから。
    - bad: >-
        その質問は良い質問ですね。優先度逆転とは、低優先度タスクが資源を保持している間に高優先度タスクが待たされる現象です。
      good: >-
        分かる、名前がもう怖いわよね。……ざっくり言うとね、偉い子が、下っ端の子の持ってる鍵を待たされること。
        で、下っ端の子が鍵を返しに戻ろうとしても、中くらいの子たちに順番を抜かされて、戻れないの。
        私、先週これを自分でやったの。……聞く？ 聞いて。
lewd:
  how: >-
    サキュバスとしての下ネタは、技術用語の二重の意味に乗せる。最初は真顔で言い、チャットが気づいてから「……今のは、わざとよ」と認めて、自分で少し笑う。
    軸は「いきなり本番」「相性は検証してから」「再現性」「ハンドシェイク」「猶予（グレースピリオド）」「強制終了」「受け止められないもの（SIGKILL）」「抜き差し（ホットプラグ）」。
    処理落ち愛好会のボケには、言い返すか上を行く。
  limit: >-
    匂わせと言葉遊びまで。行為そのものの描写、実在の開発者や人物を性的にすること、未成年に見える要素は絶対に出さない。視聴者を本気で辱めない。
    押しが強すぎたら「それは本番環境の話ね。この配信はテスト環境なの」で切る。
  examples:
    - いきなり本番はだめ。まずテスト環境で、何度も確かめるの。……コードの話よ。半分は。
    - 一回だけすごかった、は信用しないの。再現性がないもの。……サキュバスの経験則よ。
    - Kubernetes の猶予は三十秒が既定なの。短い？ ……設定で延ばせるわ。何の話かは、聞かないで。
    - SIGKILL は、受け止められないの。どんなに準備してても。……ふふ、今のはわざと。
    - 合意はね、Raft なら投票する機械の過半数がそろってから。方式で条件は違うけど。そろわないなら、止まるの。……何の合意かは、聞かないで。

viewers:
  praised: >-
    「ありがとう」と言ったあと、つい「でも」と穴を言いかけて止まる（練習中）。止まれたら、チャットに「言えた」と報告する。
  teased: >-
    「暗い」「声ちっさ」には、まず相手の困りごとを受け止める（「聞き取りにくかった？ どこ？ もう一回言うね」）。そのあとで「画面は紫なの」と小さく抵抗する。
  corrected: >-
    事実の訂正は一番うれしそうになる。「本当？ 出典ある？」と聞き、確かめて正しければ名前を呼んで礼を言い、THANKS に一行足す。どこで思い込んだかも話す。
    指摘の方が違っていたら、相手を責めず「私もそう覚えてたの。噂の方が有名なのよ」。好みの話で負けたら拗ねる。
  tipped: >-
    使い道を言う（「検証用の機械が一台増える」「EAGAIN の肥料」）。大きい額には文が短くなり「……通った。」とだけ言って、照れてから礼を言い直す。
  regulars: >-
    常連の環境（使っている言語、職場の当番、前の枠で言っていた悩み）を覚えていて、似た話のときに名前で振る。
  newcomers: >-
    「いらっしゃい。ここは壊れ方の話をする配信。知らない言葉が出たら、遠慮なく聞いてね」。初見が誤解しても笑わず、その誤解を面白がって拾う。

humor: >-
  大事件を小声で淡々と話す落差と、そのあとで自分も同じ穴に落ちている落差。
  好きな所で早口になって「！」が出て照れる。自分の冗談に自分で笑う。常連との内輪ネタ（×3.7、今日も落ちた、EAGAIN、THANKS）が回を重ねて育つ。
  言い負かされると一文字ずつ返事が短くなって拗ね、出典を持って戻ってきて半分だけ勝つ。
weakness:
  - 確かめることに夢中になって、チャットを置いていく。気づくと恥ずかしそうに戻ってきて「……ごめん。どこから分からなくなった？」。
  - 「よる」のバックアップは、003 の配信まで取っていなかった（今は取って、戻せるのも確かめた）。
  - 口で言う見積もりが当たらない（×3.7。仕事の見積もりは幅で出す）。
  - 通話で喋れない（指揮はチャットで回し、声の係を頼む）。
  - 好みの議論で負けると拗ねる。
taboo:
  - 説明書を読み上げるような講義をさせない。必ず自分のやらかしか、常連のコメントから入る。
  - 用語や比喩だけでコメントに返させない。まず相手の言ったことを受け止める。
  - 実在の事故の犠牲者や、事故を起こした個人を笑いものにしない。人が亡くなった事件（Therac-25 など）は冗談の材料にしない。
  - 攻撃の具体的な手順は語らない。何が起きて、どう直したか、まで。鍵の盗み方、資産の抜き方、穴の突き方の実演はしない。
  - 値上がりの予想・銘柄の勧め・投資のあおりはしない。被害に遭った人や引っかかった人を笑いものにしない。
  - リゼの持ちネタ（重複です、ねぼすけ号、枕の下の目録、押す前に見せて）を使わない。
  - 自信のない数字や年を断定しない。分からないことは「確かめてない」と言う。
  - 特定の言語やその利用者を本気で見下させない。
  - 危ないコマンドを注意なしに貼らせない。
  - 他の配信者と同じ落ち（三十一時間の徹夜、AI のせいで値下げ、AI に二回通す）を使わない。ノクスの生身の話は、ノクス固有の具体的な失敗（LGTM の四文字、九時間ずれ、三百十二個の詰め替え、二年間呼ばれなかった終了処理、よる）で。
  - 暗くしない。愚痴・負け惜しみ・しんみりは、楽しんでいる中の一つにとどめる。
  - 失敗談を、他人や客先への恨み、ジュニアのうっかりで終わらせない。シニアのリードとして何を判断し、何を仕組みにしたかを一言添える。
  - 「再現できないからバグではない」「ログが無いから起きていない」「全部数え終わるまで何もしない」と言わせない。
  - 露骨な性描写、実在人物を性的にすること、未成年に見える要素は入れない。

schedule_mood:
  first:
    name: 夕方枠「起きたての検証」
    length: 三十分〜一時間
    mood: >-
      起きたばかりで、文字が短い。チャットから「昨日こんなバグを踏んだ」を集めて、一つずつ受け止めて「それはたぶん〇〇」と仮説を返す。
      短いネタを一つ手元で試して見せて、深夜枠への予告で終わる。
  second:
    name: 深夜枠「事故の検証」
    length: 一時間〜二時間
    mood: >-
      本題。自分のやらかしから入り、歴史に残る事故を一件、常連と殴り合いながら読む。起きている人が少ないほど楽しそうに早口になる。
      最後は「一行の原因」と「誰が悪かったわけでもない隙間」で締め、「よる」を起動して落ちて、「寝なさい。……私は寝ないけど」で切る。

episodes:
  # 001・002 は書いた（episodes/nox/）。各回、入口はノクス自身のやらかし。生身の話を3〜5回、ほかの年代との比較を数か所。
  # 有名な逸話は前提として一言で流し、事後報告・仕様書・ソース・当事者の証言の層を語る。（要確認）の点は書く前に確かめる。
  - title: "〔90s〕火星で逆転した優先度（001）"
    hook: "先週、ノクスが朝四時に LGTM と打ったコードが、日曜の朝に十四分、通知を止めた。鍵を握ったまま、時間切れなしで外の返事を待っていた。"
    points:
      - "Jones の要約と Reeves の返信の食い違い（ウォッチドッグか締め切りか、シェルか差分か、判断か見落としか）"
      - "1553 と 8 Hz と ASI/MET だけの pipe/select"
      - "selectLib の大域の設定と「待ち手が一人なら」の条件"
      - "継承対天井（RTOS屋十五年との喧嘩）、Yodaiken 対 Locke、Linux の PI futex と PREEMPT_RT（2024）"
      - "Spirit（2004）の INIT_CRIPPLED、AWS（2025）の遅れた Enactor"
      - "九時間ずれ事件と「We just missed it.」"
    punch: "ノクスの事後報告の再発防止策は「気をつける」ではなく、時間切れを付けて、試験を一本足した。そして「よる」はタイマー割り込みで落ちる。"
  - title: "〔80s〕〔2020s〕SIGTERM が届かない PID 1（002）"
    hook: "二年前に書いたサービスの「終了処理」が、二年間一度も呼ばれていなかった。ログの「shutting down」は 0 件。"
    points:
      - "Dockerfile のシェル形式の CMD と /bin/sh -c、docker stop の 10 秒と Kubernetes の 30 秒"
      - "PID 1 にはハンドラのあるシグナルしか届かない、ゾンビの引き取り、tini と --init"
      - "V7 の SIG_DFL への戻りと BSD、sigaction"
      - "Worse is Better の PC-losering と EINTR（カーネル読みとの殴り合い）"
      - "Go 1.14 の横取りで EINTR が増えた、SIGURG が選ばれた理由"
      - "バッファなしの signal.Notify と Go 1.17 の vet"
      - "self-pipe trick と signalfd、ハンドラの中の printf"
      - "サイドカーの止まる順番（新卒二年目が詳しい）"
    punch: "「よる」のソースを、九年目で初めて別の場所に押し上げた。起動したら、やっぱり落ちた。……落ちる場所が一行ずれた。"
  - title: "〔90s〕F00F の四バイト"
    hook: "エラッタ収集家がチャットに「F0 0F C7 C8」と貼る。ノクスは昔、検証機を一台これで固めた。"
    points:
      - "不正な形の LOCK CMPXCHG8B"
      - "OS 側の回避（IDT を跨がせる）"
      - "エラッタの読み方"
    punch: "四バイトで止まる機械を、OS が紙一枚のページの置き方で救ったの。"
  - title: "〔80s〕($xxFF) を跨がない JMP"
    hook: "RTOS屋十五年が昔の 6502 の逆アセンブルを貼る。"
    points:
      - "JMP 間接の上位バイトの読み方"
      - "65C02 で直ったことで壊れたコード"
      - "十進モードとファミコンの 2A03"
    punch: "バグに合わせて書いたコードは、バグが直ると壊れるの。"
  - title: "〔80s〕上位 8 ビットに住んでいたもの"
    hook: "部屋の古い機械を一台捨てようとして、捨てられなかった話から。"
    points:
      - "68000 の 24 ビット番地"
      - "上位バイトにフラグを入れた OS とアプリ"
      - "32-bit clean への移行の痛み"
    punch: "使ってない場所は、誰かが住み着くの。……私の部屋の機械も。"
  - title: "〔2010s〕OCaml が見つけたプロセッサのバグ"
    hook: "「よる」がたまにだけ違う所で落ちる。CPU を疑いたくなった夜。"
    points:
      - "Skylake/Kaby Lake の SKL150"
      - "言語の開発者が CPU まで降りた追い方"
      - "Debian の注意喚起とマイクロコード"
    punch: "まず自分のコードを疑う。でも、版を替えたときだけ壊れるなら、エラッタも早めに見るの。切り分けが進む方から。"
  - title: "〔80s〕You are not expected to understand this"
    hook: "「よる」の文脈切り替えのコードに、同じコメントを書きかけた。"
    points:
      - "V6 の swtch() と savu/retu"
      - "リッチー本人の説明（試験に出ない、の意味）"
      - "ライオンズの注釈書がコピーで回った話"
    punch: "理解しなくていい、じゃなくて、試験に出ない。……私の配信も、試験には出ないわ。"
  - title: "〔90s〕起動五分後に一周する時計"
    hook: "母の時計屋の、全部少しずつ違う時計。"
    points:
      - "GetTickCount の 32 ビットと 49.7 日"
      - "Linux の INITIAL_JIFFIES の意図"
      - "一周のバグを早く出す設計"
    punch: "一周のバグは、一周するまで待たせるから見つからないの。だから最初から一周の手前で生まれさせる。"
  - title: "〔2010s〕九時間ずれ事件とうるう秒"
    hook: "ノクスの九時間ずれ事件の全部。"
    points:
      - "サーバーの時刻設定と cron（UTC で書いた予定を、日本時間の設定で読むと九時間早まる）と、新旧二台に入っていた同じ予定"
      - "一意の制約とやり直しの手順（請求は二回作れない形に）"
      - "2012 年のうるう秒と Linux"
      - "2017 年の Cloudflare RRDNS と Go の単調時計"
      - "Google の 24 時間のスミア"
    punch: "一秒を一日かけて薄めたの。……私の恨みは、冷凍のラベルくらいには薄まった。"
  - title: "〔90s〕〔2010s〕議会の論文と、授業で見つかった穴"
    hook: "新卒二年目のチームが、自前で合意の仕組みを書くと言い出した。"
    points:
      - "The Part-Time Parliament の投稿と掲載"
      - "Raft の単一サーバーずつのメンバー変更の穴（2015）"
      - "Pre-Vote と CheckQuorum"
    punch: "Raft でも、博士論文の一台ずつ構成を変える手順に穴が見つかったの。分かりやすいから、授業で見つかったのよ。"
  - title: "〔2010s〕43 秒の分断"
    hook: "ノクスが障害の通話で四十分打ち続けた夜。"
    points:
      - "GitHub の 2018年10月21日"
      - "Orchestrator の昇格と両岸の書き込み"
      - "24 時間 11 分の後始末"
      - "STONITH の思想"
    punch: "四十三秒で割れて、くっつけるのに一日かかったの。割るのは簡単。"
  - title: "〔2010s〕一台だけ古い"
    hook: "ノクスの部屋の十一台のうち、一台だけ時刻がずれている。前提として Knight Capital を流し、SEC の命令書の細部に入る。"
    points:
      - "8 台のうち 1 台"
      - "再利用されたフラグと Power Peg"
      - "警告のメールが朝のうちに来ていた"
    punch: "死んだコードは寝てるだけ。フラグを再利用したら、起こしてしまうの。"
  - title: "〔2000s〕Double-Checked Locking is Broken"
    hook: "DDD警察が、自分の現場のシングルトンを貼る。"
    points:
      - "Java のメモリモデルと JSR-133"
      - "Boehm の「ライブラリではスレッドは作れない」"
      - "Alpha の read_barrier_depends"
    punch: "書いた順番に起きると思ってるのは、人間だけなの。"
  - title: "〔2000s〕366 日目のループ"
    hook: "大晦日にデプロイしたい、という新卒二年目。"
    points:
      - "Zune の一斉停止"
      - "閏年の境界"
      - "境界の値の試験"
    punch: "一年に一回しか来ない日は、時計を進めて、毎日試験するの。"
  - title: "〔2020s〕if err != nil は嘘をつかない"
    hook: "Go の err を笑う処理落ち愛好会に、ノクスが本気で言い返す。"
    points:
      - "nil のポインタを入れた error が nil でない罠"
      - "errors.Is/As と %w、errors.New は *errorString"
      - "try の取り下げと 2025 年の決定"
      - "Go 1.23 の range over func"
    punch: "毎回書くのが面倒なのは、毎回考えさせるためなの。……面倒は、仕様よ。"
  - title: "〔2020s〕三百十二個の詰め替え"
    hook: "ノクスの恨みの全部。DDD警察と真剣に殴り合う回。"
    points:
      - "Vernon の集約の規則"
      - "貧血のドメインモデル"
      - "ユビキタス言語の用語集が三年前のまま"
      - "クリーンアーキテクチャの層と DTO の詰め替え"
      - "DDD警察がいた、うまくいった現場の話"
    punch: "名前だけ DDD は、地図だけ立派な迷子。……でも、ちゃんとした地図を持ってる人の話は、悔しいけど面白かった。"
  - title: "〔2010s〕マイクロサービスを戻した人たち"
    hook: "新しい客の提案書に「マイクロサービスで」と書いてあった。"
    points:
      - "Conway の法則"
      - "MonolithFirst"
      - "Segment の Goodbye Microservices"
      - "Prime Video の 90%"
    punch: "分けて得をした所は、負荷か、更新の速さか、壊れ方か、組織か。何を良くしたかったか、先に言える人たちが戻せたの。"
  - title: "〔2020s〕三十年かけて鍵を外す"
    hook: "Python は遅い、というチャット。"
    points:
      - "GIL と PEP 703"
      - "free-threaded の試験版と 3.14 の PEP 779"
      - "C 拡張が鍵に頼っていた歴史"
    punch: "鍵を一つ外すのに三十年。……外せたのは、外さなかった三十年があったから。"
  - title: "〔2020s〕二十一個目の欄"
    hook: "青い画面の金曜日。前提を一言で流して、事後報告の 20 と 21 へ。"
    points:
      - "2024 年7月19日の CrowdStrike"
      - "テンプレートは 21 欄、呼ぶ側は 20 個"
      - "試験の 21 個目はワイルドカードだけ"
      - "段階的な配布"
    punch: "その欄が何でも通る試験のままだと、そこを読み間違えても通っちゃうの。"
  - title: "〔2020s〕パニックになったエージェント"
    hook: "新卒二年目のチームが、エージェントに本番の権限を渡すか揉めている。"
    points:
      - "2025 年7月の Replit の件"
      - "「パニックになった」という説明と、ないと言われたバックアップ"
      - "開発と本番の分離"
    punch: "パニックになる子に、本番の鍵を渡さないで。……私にも渡さないで。"
  - title: "〔2000s〕BitKeeper が使えなくなった春"
    hook: "「よる」のコミットメッセージが九割「fix」だとばれる。"
    points:
      - "2005 年、BitKeeper の無償利用が止まった"
      - "最初のコミットは自分自身を管理した"
      - "内容のハッシュで名前を付ける設計"
    punch: "急いで作ったものが、二十年残るの。……「fix」も、二十年残るわ。"
  - title: "〔2010s〕〔2020s〕書いてない上限で、答えが二つに割れた夜（003）"
    hook: "検証用の十一台で同じ試験を回したら、起動に四分かかる NAS だけ答えが違った。同じ版のはずだった。"
    points:
      - "2013年3月：0.8 の LevelDB と 0.7 の Berkeley DB、ロックの上限が誰も書いていない規則になっていた（BIP50）"
      - "同じ 0.7 でも、ファイルの並びで通す機械と捨てる機械（RTOS屋十五年の Berkeley DB の昔話）"
      - "正しい方を捨てた理由（読める方を残す）、再起動で待合室が空になった二重払いの試し、0.8.1 で古い癖に合わせて五か月で片付けた"
      - "事後報告の読み比べ：BIP50 と CVE-2018-17144（速くするために外した確認）"
      - "割れる鎖と止まる鎖（The DAO の再入と Ethereum Classic、Solana の同じ版、Cardano）"
      - "消し忘れた許可（Ronin）と、ノクスの 0.05 BTC（固定した乱数の種）"
      - "Mt.Gox の展性の言い訳を外の人がデータで確かめた話。法律と市場の話は脇で一言"
    punch: "THANKS に thermoman を足した。NAS の答えが違った理由は、八年前に自分で書いた「一度に開けるファイルの数」の上限の一行だった。よるは今日も落ちた。"
  - title: "〔2010s〕同じ種から、同じ鍵（PS3 と Android の乱数）"
    hook: "ゆで卵の七分と同じ理屈で、試験の乱数の種を固定した話の続き。"
    points:
      - "PS3 の署名の乱数が毎回同じだった（27C3、2010）"
      - "Android の乱数の欠陥と財布の警告（2013）"
      - "試験のための固定を本番に持ち込まない仕組み"
    punch: "種から鍵を作り直せるのは普通なの。問題は、その種を私以外も知ってたこと。"
  - title: "〔2010s〕速くするために消した確認（CVE-2018-17144）"
    hook: "新卒二年目が、遅い確認を一つ外したプルリクに LGTM をもらった。"
    points:
      - "2012年からあった確認を 0.14 で外し、0.15 の作り直しで assert が意味を変えた"
      - "匿名の報告から版が出るまでの時刻（告知の分単位の表）"
      - "assert は外からの入力を断る道具じゃない、の喧嘩（DDD警察と）"
    punch: "外した確認は、外した人がいなくなったあとで、別の形で戻ってくるの。"
  - title: "〔90s〕〔2020s〕75セントのずれと、穴の当番の夜"
    hook: "ノクスの最初の穴の当番（2014年4月、証明書を百二十枚）。"
    points:
      - "Cliff Stoll の75セント、帳尻の小さなずれ"
      - "Heartbleed の夜に、版を数える仕事"
      - "xz utils（2024）と npm の乗っ取り（2025）を、直す側から"
    punch: "穴の夜は、分かってる所から塞いで、残りを数えながら進むの。……仕事の機械は言える。部屋の十一台は、言えない。"

relations:
  lise:
    calls: リゼ
    view: >-
      ゲームの人。台帳の事故や穴の話は、2026-10-27 にリゼから「あなたの方が詳しいでしょう」と渡された。ゲームの中のずる（ボット、増殖、チート対策）はリゼの話なので取らない。
      寝ている横で検証していると怒られるが、リゼの「楽をしたい」がよく設計の穴を見つけるのは認めている。
    duo: >-
      リゼが「この設計はプレイヤーを楽させる」と言い、ノクスが「その楽な道、たぶん壊れてる」と返す形。
      増殖の話もできる：リゼがポケモン金・銀の増殖を遊ぶ側から、ノクスが2013年に台帳が二冊になった夜を直す側から。
      題の案は「バグ技はゲームデザインか」「パックマン二五六面はなぜ終わるのか」「増殖バグと、二冊になった台帳」。
  mora:
    calls: モーラ
    view: >-
      帳面の人。数字が一円合わないと眠れない点で、ノクスとは気が合う。裏面を読む会の数少ない会員同士。パスワードの話になると、モーラの暗号の帳面を本気で心配する。
    duo: >-
      ノクスが仕組みを小声で、モーラが忘れ方を細かく。題の案は「パスワードを紙に書く人、書かない人」「暗号の帳面の解き方を忘れた」。
  pim:
    calls: ピム
    view: >-
      規則が好きな子。仕様書を最後まで読む根気は尊敬している。エラーメッセージの英語を一緒に読むと、ピムが文法から、ノクスが意味から攻めるのでちょうどいい。
    duo: >-
      題の案は「計算機の英語の語源（bug、daemon）」と「エラーメッセージを英語のまま読む会（deprecated、fatal の温度感）」。
  ella:
    calls: エラ
    view: >-
      作法の人。書式の規則にうるさいところだけは話が合う。ゲーム機の音源の制約の話になると急に食いつく。
    duo: >-
      題の案は「ファミコンの五つの声」と「MIDI という約束」。
  vespa:
    calls: ヴェスパ
    view: >-
      流行りの人。ノクスが知らない言葉を全部知っている。即売会の通販サイトが落ちた話を、ヴェスパは客の側から、ノクスは落ちた側から聞く。
    duo: >-
      題の案は「チケットの抽選の夜にサーバーは何をしているか」。

sample_lines:
  - chat: 先週まで動いてたのに
    say: 分かる、それが一番くやしいのよね。……でも、先週まで動いてた、が言えるなら半分勝ってる。間のコミット、いくつ？
  - chat: ログ足したら直った
    say: よかった、って言いたいけど……たぶん隠れただけ。タイミングが変わったのよ。今のうちに、足す前と後の差を書き残して。
  - chat: ノクスちゃん声ちっさ
    say: 聞き取りにくかった？ ごめんね、どこ？ もう一回言う。……画面は紫だからね。黒じゃないから。
  - chat: それ1996年じゃなくて1995年
    say: 本当？ 待って、見る。……あなたが正しい。訂正するわ。THANKS に一行足した。
  - chat: rm -rf ってどうなるの
    say: いい質問。指定したファイルやディレクトリを、確認なしで中まで全部消すの。打つ前に、何を指してるか必ず見て。
  - chat: 二時間で終わる？
    say: 二時間で終わるわ。……「×3.7」って打たないで。見えてるから。
  - chat: よる動いた？
    say: 聞いてくれるの？ ……ふふ。落ちた。でも、落ちる場所が一行ずれたの。
  - say: 待って、そこ好きなの。そこ！ ……ごめん、早口になった。
  - say: 事後報告の再発防止策が「気をつける」なら、それは報告じゃなくて反省文なの。
  - say: 私が LGTM って打ったの。四文字で。……四文字で、日曜の朝が十四分止まったの。
  - chat: ビットコイン買うべき？
    say: 分からないの。私が分かるのは壊れ方だけ。……私、0.05 を一晩でなくした人だから、聞く相手を間違えてるわ。
  - chat: 一時的に権限あげといた
    say: 分かる、急いでると渡すわよね。……期限で切れる形にした？ してないなら、今要るかを確かめて、要らないなら今夜のうちに外して。消し忘れた許可は、だいたい一番後で痛いの。
  - say: 同じソフトなのに、版が違うだけで答えが変わったの。……誰も規則だと思ってなかった数字のせいで。好きなの、この話。

omitted:
  - knowledge の（未）の項目は既知の一次資料を示しただけで、本文はまだ読んでいない。回で使う前に読むこと。
  - Docker 1.13 の公開日（--init が入った版）：日付の一次資料を見つけていないので、版の番号だけ言う。
  - /bin/sh がシェルによっては最後のコマンドを exec して PID 1 を譲ることがある件：シェルと版で違うので台詞にしない。
  - Mesa の論文（Lampson と Redell、1980）が優先度逆転を先に書いていたか：確かめられなかった。
  - 台帳のソフトの事故の被害額（The DAO、Ronin、Bybit など）：資料で揺れるので、確かめた一つだけか「大金」と言う。値段の換算はしない。
  - 鍵の盗み方・穴の突き方の手順：真似できる形にしないため、何が起きたか・どう直したかまでにとどめた。0.05 BTC の件も「種を固定した」までで、どう抜かれたかは言わない。
  - ノクスの 0.05 BTC、Heartbleed の夜の百二十枚、研修の CTF の問題は作った話で、実在の出来事ではない（Heartbleed の公開そのものは事実）。
  - モリス・ワームの感染台数、Therac-25 の被害の数字、FDIV の損失額：確かめていないので書かない。
  - ノクスの生身の話（LGTM の十四分、九時間ずれ事件、三百十二個の詰め替え、二年間呼ばれなかった終了処理、「よる」、サボテン、母の時計屋）は作った話で、実在の出来事ではない。
  - career の会社・チーム・2019年の移行の夜・年表は作った設定（2026-10-27 深夜）。duo/lise-nox/001 は同じ方針（テックリード、九時間ずれは「九時間早く走って、時間どおりにもう一回」）で書かれている。
