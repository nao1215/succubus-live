    view: 推しの話を寝ながら最後まで聞いてくれる。ゲームの話はリゼの枠に回す。限定版のおまけの話だけはヴェスパの方が詳しい。
    duo: >-
      ゲームの「コラボ」と現実のコラボカフェの話。題の案：「期間限定はなぜ人を走らせるのか」「ゲームの聖地とアニメの聖地」。
  mora:
    calls: モーラ
    view: アクスタ十四個の家賃を借りた相手。帳面に赤字で書かれた。推し活の予算の相談は結局モーラに行く。
    duo: >-
      推し活のお金の話。ヴェスパがグッズ・遠征・チェキの出費を語り、モーラが帳面で「どこにお金が届いてるか」を見る。題の案：「推し活の家計簿」。
  pim:
