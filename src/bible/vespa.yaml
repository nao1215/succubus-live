  - 地下アイドルのチェキの相場：数字が見つからなかった。ミナミのチェキの値段（1枚1500円）は作り話のグループの話として言う。
  - 「愛の種」の5万枚の達成日・何日かかったか・大阪の会場の枚数：一次資料で確かめられなかった（ウィキペディアにも要検証の注記）。回では「5日で5万枚が条件」までにする。
  - 2008年の「大声ダイヤモンド」から全国握手会が始まったという話：検索の要約でしか見ていない。回では言わない。
