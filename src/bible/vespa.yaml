    - 〔90s〕第1回 Anime Expo は1992年7月3〜6日、サンノゼのホテルで約1750人。2025年はロサンゼルスで延べ約41万人（入場ゲートの数え方）。（https://en.wikipedia.org/wiki/Anime_Expo）
    - 〔2020s〕C107（2025年冬）は30万人、24,000スペース、3万数千のサークルの応募で東8ホールに急きょサークルを置いた。更衣室の登録は男性4,975人・女性8,496人。（確 https://www.comiket.co.jp/archives/Chronology.html）
    - 〔2020s〕C108（2026年夏）の更衣室の登録は男性3,296人・女性5,569人。（確 https://www.comiket.co.jp/archives/Chronology.html）
