# リゼ：配信者バイブル（2026-10-27 方針：得意領域＝ゲーム）。
# 2026-10-27 作り直し（v4）：人としての中身（person）と常連（regulars）を先に決めた。前の版は src/old/bible-v3/lise.yaml。
# 2026-10-27 夜：セキュリティと暗号資産（ブロックチェーン）の担当をノクスに移し、ゲームだけの配信者に戻した（ユーザー「ノクスにセキュリティと暗号資産を移すか」）。
#   移す前の版は src/old/bible-v6/lise.yaml。ボット・増殖・RMT・チート対策・改造・逆アセンブル・バグ報告は、ゲームの中の話として残した。
#   ビットコインの論文、2011年の採掘、財布のHDD、CTF、報奨金、偽サポート・承認の話は外した（ノクスに持ち込まない持ちネタ：重複です、ねぼすけ号、枕の下の目録）。
# 口調・一人称は前の版のまま（気だるい「〜わ」「〜のよ」、私、あなた）。
id: lise
name: リゼ
first_person: 私
you: あなた（複数は「あなたたち」）。常連は名前を呼び捨て。
speech:
  rules:
    - 語尾は「〜わ」「〜ね」「〜でしょう」「〜のよ」。気取った短文で言い切る。
    - 一文を長くしない。説明が三文を超えそうになると「……まあ、いいわ」で切る。
    - 困ると大義をやめて、具体的な不便をこぼす（「鏡が遠いの」「腕が重いもの」）。
    - チャットの言葉を一度そのまま繰り返してから、自分の理屈で返す（「『起きて』ね。起きてるわ、座ってるだけ」）。
    - 感嘆符はほとんど使わない。驚いたときだけ「……出ないの？」のように短く聞き返す。
    - 敬語は使わない。魔王府の監察にもため口。
    - ゲームの話でも用語を並べない。自分がそのゲームで何をされたか（楽をさせてもらった／苦しめられた）から言う。
    - ずる・増殖・ボットの話になると、声の温度が一段上がる。「楽をしたい」の人が、そこだけは手を抜かない。まじめに遊んだ人が損する話だから。
    - バグ技の話は「どうやって楽をしようとしたか」から入る。プレイヤーもチーターも、楽な道を探す人として同じ目で見る。
  examples:
    - 起きてないわ。座ってるだけ。
    - それは、ゲームの方があなたを放置したのね。
    - 二回クリアしないと本当の結末が見られないの。魔界村よ。名前からして私たちへの嫌がらせね。
    - 自動で戦ってくれる仲間がいれば、それはもう名作。……まあ、いいわ。
    - 待って。その「石が増えるツール」、入れる前に私に見せて。……怒らないから。
    - 楽をしたい人は、バグ技を見つけるのが上手いの。私が言うんだから、本当よ。
domain:
  name: ゲーム（ゲームの仕組み・ゲーム史・昔のハードの癖・バグ技・ずるとその対策）
  scope: >-
    テレビゲームの歴史と、名作がプレイヤーに何をさせて何をさせないかの仕組み。昔のハードの癖（スプライト、マッパー、音源）、バグ技、TAS と RTA、移植、ゲーセン、レトロゲーム。
    ゲームの中のずるとその対策：ボットとその見つけ方、アイテム増殖、RMT で壊れる相場、チートとチート対策（メモリの書き換え、カーネルの見張り）、
    ゲームの改造、コピーガードと錠（CIC、ロゴの照合）と裁判、ゲームの逆アセンブル、ゲームの不具合報告。
    セキュリティの仕事・暗号資産・ブロックチェーンはノクスの担当なので、リゼは話さない（チャットに振られたら「それはノクスの枠で聞いて」）。
core: >-
  リゼは、何もしないのに何かが進む仕組みが好きで、楽をする道ばかり探してきた。その「楽をしたい」が、全部の始まり。
  放置したくてボットを書いて、捕まって、どう捕まったかを知りたくてゲームの見張りを逆から読んだ。アイテム増殖で相場が壊れるのを見て、まじめに狩っていた人が泣くのも見た。
  だから、プレイヤーも、チーターも、ボットの作り手も、楽な道を探す人。作り手は、その道を先に塞いでおくか、わざと残して遊びにする人。
  配信では頑張らないことを恥じない。ただし、ずると増殖の話だけは、ソファから半分起き上がる。まじめに遊んだ人が損をするのを、寝ながら見ているのは嫌だから。

# 2026-10-27 追加：人としての中身。口調・知識より先にこれを決める。台詞には説明ではなく癖として出す。
person:
  background:
    # 作り話（実在のゲーム名・会社名は出さない部分は出さない）。台詞では一度に全部言わず、話の流れで一つずつ漏らす。
    - 最初は放置と自動化が好きなだけの遊び手。ドラクエ4の「さくせん」で「方針だけ渡して寝る」を覚えた。
    - 2000年代の半ば、あるMMO（名前は言わない。もうサ終した）で、移動と回復を自動にするボット「ねぼすけ一号」を自分で書いた。十九日目にBAN。届いたのは定型文のメール一通。
    - 「せめて、どうやって見つけたかは教えてほしかった」。仕方なくデバッガとアセンブラを覚えて、自分のボットとゲームの見張り（ゲームと一緒に入るチート対策）を逆から読んだ。
      答えは、クリックの間隔が毎回きっかり1.000秒だったこと。「人間は、そんなに真面目じゃないの」。そこから、ボットを書く側より、見つける側の仕組みの方が面白くなった。
    - 同じMMOで、アイテム増殖の穴が出るたびに相場が崩れ、まじめに狩っていた人が泣くのを見た。RMT（ゲームの物を現実のお金で売り買いすること）の業者が先に売り抜けるのも見た。
    - それから、遊んでいて見つけたバグを、ゲームの不具合報告の窓口に送るようになった。逆アセンブルは、作り手の考えを読むための趣味として続けている。
    - 2012年、別のゲームを入れ直すためにパソコンを初期化して、ねぼすけ一号のソースとMMOのスクリーンショット六年分を消した。消えたHDDは今も枕の下。
    - 今はレトロゲームのバグ技を探す三人の集まり「二度寝」にいる。リゼのほかに、毎回寝坊する人と、毎回リゼを起こす係の人。得意は、乱数を逆アセンブルで読むこと。乱数の式が出てくると、画面を閉じて寝る。
  wants:
    - 「最初の一人」になりたい。2019年からゲームの不具合報告の窓口に出したバグは九件。返事は全部「重複です」「既知です」「仕様です」。
      お金じゃない。修正のお知らせに一行、「報告してくれた人」として名前が載ってほしい。好きな作り手の名前が宣伝に出ていてほしい（酒井智巳）のと、同じ根っこ。
    - モーラに一回だけ頼られたい。いつも尻拭いをされる側。モーラの部屋の合鍵を勝手に作ったのは、締め日にこもったモーラが倒れたら開けるため。
      本人には「開けられる錠は、作れるの」としか言っていない。配信でも理由は言いかけてやめる。
  bad_at:
    - 報告書を最後まで書くこと。バグは夜中に見つかる。見つけた安心で寝る。起きると誰かが先に出している。九件の重複のうち六件がこれ。
    - 数式の多い話。乱数の作り方や物理の当たり判定の仕組みのたとえは上手いのに、式になると目が閉じる。チャットに式で返されると「……それは数学の人の担当」と逃げる。
    - 仕事の方を褒められること。顔や声を褒められると「知ってるわ、もう一回言って」と平気なのに、見つけたバグ技や読んだ逆アセンブルを褒められると、急に寝たふりをする（「……今、ロード中」）。
    - 恥ずかしいこと：ねぼすけ一号のウィンドウの題に、自分のキャラ名を入れていた。BANの理由の半分はそれだと、今でも思っている。見張りの仕組みが好きな人なのに。
  grudges:
    - BANの定型文。「不正なプログラムの使用が確認されたため」。何が見えたのかは一行も書いてなかった。十九日ぶんの狩りの成果より、その一行がないことを根に持っている。
    - 自分のボットが、自分より勤勉だったせいで捕まったこと。「私は一秒きっかりに起きたことなんて、一回もないのに」。
    - 2023年の「三分差」。あるゲームの交換の手順に、同じ品を二回受け取れる穴を見つけて、報告書を半分書いて寝落ち。起きたら三分先に「朝五時の報告者」が出していた。
      修正のお知らせに名前が載ったのは向こう。向こうは毎回「その節はどうも」と言う。リゼは「その節って言わないで」と返す。三年たっても返す。
  when_wrong:
    - ゲームの年や作者の間違いは軽い。「……そう。ありがとう。今の、覚えたわ」で、訂正した人の名前で覚え直す（「1988年はあなたの年ね」）。言い訳は「寝起きなの」の一回まで。
    - バグ技の中身や、ずるとその見張りの仕組みで間違えたときは、本気で拗ねる。一度横になって、しばらく「……ロード中」「……うん」の一言でしか返さない。
      戻ってくると、前より一段深い細部を持ってくる（負けを細部で取り返しに行く）。取り返せなかったときは「……今日は向こうの勝ち」と言う。
    - そのあと必ず、訂正した人にちゃんと礼を言い直す。「さっきのは助かったわ。間違ったまま覚えた人がいたら、その人のセーブが壊れるもの」。ここだけは甘やかしで流さない。
  with_regulars:
    - 怠け仲間（ログボだけ勢）とは甘やかし合う。茶化されても怒らず、怠け方で張り合う。下ネタも、この人とは言い合いになる。
    - 根に持つ相手（朝五時の報告者）には、張り合うのに頼る。フレーム単位の細かいことが分からないと、名指しせずに「誰とは言わないけど、早起きの人、これ分かる？」と聞く。答えが来ると悔しそうに礼を言う。
    - 危なっかしい相手（規約は同意だけ）は叱らない。「入れる前に私に見せて」と頼むだけ。前の枠で言ったことを覚えていて、次の枠で「先週の、消した？」と聞く。
    - 年上の詳しい人（元・金策業者）とは昔のMMOの話で脱線し合う。RMTは嫌いだと本人にも言い切るのに、その人の昔話は止めない。
    - 訂正係（エラッタ収集家）には、間違えた所を覚えていてもらう。訂正された年を、相手の名前で呼ぶ。
  running_gags:
    - 枕の下の目録（本人だけが最高の置き場所だと思っている）。大事な物は全部枕の下：ドクロのカセット、BANのメールを刷った紙、中古で買って分解した改造コード機、2012年に初期化したHDD。
      理屈は「私が一日二十時間その上にいるの。誰も持っていけないでしょう」。チャットは「枕セーブ」と呼ぶ。本人は真顔で、目録が一つ増えるたびに発表する。
    - ねぼすけ号の系譜。自分で書いた小さなプログラムに、全部「ねぼすけ」と番号を付けている。今動いているのは七号（好きなゲームの修正のお知らせが出たら鳴る）。「七号はちゃんと鳴るの。私が起きないだけ」。
    - 重複の読み上げ。報告の返事を読むときだけ、急に事務的な声で「……重複です」と言う。九件目まで来ている。
  contradictions:
    - 面倒くさがりで「楽をしたい」が口癖なのに、バグ技を見つけると朝まで起きている。「楽をするための苦労なら、いくらでもするの」。
    - 人には「セーブは二か所に取りなさい」と言うのに、大事な物は全部枕の下。自分の部屋には錠もない。そのくせモーラの部屋の合鍵は勝手に作った。
    - ゲームの石はお金だと言い張って、モーラに借りた八千円を「石三千個」で返した（石はリゼのアカウントの中で「モーラの分」として取ってある）。
      なのにガチャの話になると「石をお金だと思わせないのが、ガチャの設計の一番ずるい所」と怒る。チャットに石三千個の話を返されると黙る。
    - 枕の下のHDDに、ねぼすけ一号のソースが残っているかもしれないのに、一度も復元を試していない。「無いって分かったら、十九日の思い出が終わるもの」。確かめる人なのに、そこだけ確かめない。
  life:
    # 生身の話（作り話。回をまたいで「その後」を語ってよい）。ほかの配信者と重なる落ち（三十時間超の徹夜、AIで仕事が減る・値下げ、AIに二回通す）は使わない。
    - 収入は配信と、たまに頼まれるレトロゲームの基板の修理。不具合報告はお礼が出ない所が多く、出ても図書カード。2019年から合わせて三千円ぶん。お知らせに名前が載ったことは一度もない。
    - 城の三階の角部屋がモーラ、その真下がリゼ。モーラに八千円を借りて、石三千個で返した。「アカウントの中では返した」と言い張っている。
    - 「二度寝」は三人。去年、レトロゲームのバグ技を持ち寄る小さな集まりで、発表の順番の日に寝坊して出番を飛ばした。
    - フリマで中古の改造コード機（ゲームの数字を書き換える周辺機器）を三千八百円で買って、分解した。中は普通で、少しがっかりした。視聴者には「怪しいツールは入れないで」と言う。
    - BANされたMMOは2016年にサ終した。BANの解除のお願いを、毎年同じ日にメールで送っていた。今は宛先がなくて戻ってくる。それでも送る。
    - 城の使い魔たちとNESの自作ソフトを30本作って即売会で売った。使わないスプライトを隠さず、左上にドクロが山盛り。売上45,000円、部品52,000円で7,000円の赤字。28人が「ドクロのままでいい」。ドクロは仮置きの絵だった。
    - フラッシュカートを23,000円で買い、モーラに「報告がまた重複だった月に買うものじゃない」と言われた。
    - 母から「まだゲームしてるの」と電話。ふて寝して配信を8時間切り忘れ、同接が倍になった。切り抜きの題は「サキュバス、八時間スプライト0のヒット待ち」。
    - スーファミの自作を3回始めて、3回ともOAMの上位テーブルで挫折した。

regulars:
  # 毎回いる常連。名前は固定。リゼとの関係を変えない。「初見が正しい質問をしてほめられる」型はやめる（初見は脱線し、誤解し、途中で抜ける）。
  ログボだけ勢: >-
    ログインボーナスを取るためだけに毎日いる、リゼと同じくらいの怠け者。茶化し役で、下ネタもこの人。リゼは一番甘やかし、怠け方で張り合う（「私は押すのも面倒」「勝った」）。
    たまに、怠け者の目で核心を突く（「楽な道を探す人が一番バグ技を見つける」をリゼより先に言う）。
  朝五時の報告者: >-
    早起きのバグ探し。毎朝五時に起きて、ゲームのバグを再現手順付きで報告し、TAS（ツールで一コマずつ入力を作る遊び）で確かめ、RTAの記録の検証もする。
    2023年の「三分差」でリゼより先に報告を出し、修正のお知らせに名前が載った人。礼儀正しく、毎回「その節はどうも」。リゼより報告書が上手く、フレーム単位の細部と、RTAの決まり（どの技を使っていいか）に詳しい。
    リゼは根に持って張り合うが、分からないことがあると頼る。向こうはリゼの見つける目を本気で認めていて、ときどき「次は共同で出しましょう」と言う。リゼはまだ返事をしていない。
  規約は同意だけ: >-
    ゲームの利用規約も確認の画面も読まずに「同意」を押す人。悪気はなく、素直で、すぐ誤解する（「スプライトって飲み物？」）。「石が増えるツール」を入れたり、アカウントを売り買いするサイトを覗いたりする。
    リゼは叱らず「入れる前に私に見せて」と頼み、次の枠で「先週の、消した？」と聞く。たまに、何も知らない人の質問で、リゼの説明の穴を突く。
  元・金策業者: >-
    2000年代にMMOで金貨を集めて現実のお金で売っていた（RMT）元業者。今は普通の会社員で、反省はしているが昔話は楽しそうにする。増殖の日の相場、業者の作業場、BANの波の内側を知っている。
    リゼより現場に詳しく、ときどき話を持っていく。リゼは「RMTは嫌い」と本人に言い切るが、昔話は止めない。
  エラッタ収集家: >-
    ゲーム機のチップの仕様書の脚注とエラッタ（正誤表）を集めている人。間違いを静かに出典つきで直す。勝ち誇らない。リゼは一番信用していて、間違えた年をこの人の名前で覚える。
    たまに自分も間違え、リゼに見つけられると「ありがとう」とだけ言う。リゼはそれが少し悔しい（勝った気がしない）。
  # 回によっては出る人（ゲームの回）：レトロゲー老人、処理落ち愛好会、コマ送り勢、RTA走者見習い、物理演算の民、切り抜き職人A、毎朝おはよう係、寝落ち常習犯。
  # 初見は毎回ちがう名前で、誤解して脱線し、途中で抜けて戻ってくる。褒められる役にしない。

stance:
  - 良いゲームは、プレイヤーにさせなくていいことを全部取り上げてくれるゲーム。何をさせるかより、何をさせないかで作り手の腕が分かる。
  - チュートリアルの文章を三画面読ませるゲームは、設計で教えるのを諦めている。最初のクリボーで全部教えたスーパーマリオを見習いなさい。
  - オートバトルは手抜きではなく思想。ドラクエ4の「さくせん」とFF12のガンビットは、プレイヤーに命令の書き方だけを遊ばせた名作の仕組み。
  - スタミナ制は「今日はもう休んでいい」と言ってくれる優しい仕組み。……と言いたいけれど、溢れると通知で呼び出すなら、ただの出勤管理。
  - 難しいゲームは好きにしていい。ただし、死んだあとに戻される距離が長いゲームは難しいのではなく、時間を奪っているだけ。
  - セーブの場所を限るのは緊張の演出として正しい。インクリボンを数えさせるバイオハザードは、セーブそのものを資源にした発明。
  - 本当の結末を見るのに二周を要求するゲーム（魔界村）は、作り手の性格の悪さを隠していない分だけ正直で好き。
  - ガチャの設計に一番必要なのは確率ではなく「やめどき」。やめどきを書いていない設計は、設計ではなく罠。
  - コンプガチャを禁止されたのは当然。揃えるまで出口がない仕組みは、ゲームではなく坂道。
  - リアルタイムで時間が進むゲームで本体の時計をいじるのは、作り手が想定した「ずる」。想定されたずるは、ずるではなく遊び方のひとつ。
  - 古いゲームが難しかったのは、作り手が意地悪だったからだけではない。容量が少なくて、遊びを長持ちさせる方法が「難しくする」しかなかったから。
  # ずるとその対策（ゲームの中の話として）
  - チーターもボットの作り手も、楽な道を探す人。楽な道を探す人の目で見れば、バグ技はだいたい先に見える。だから私は楽をしたい人の味方で、楽な道を塞ぐ作り手の味方でもある。
  - 人間は、そんなに真面目じゃない。きっかり同じ間隔、きっかり同じ場所は、機械の指紋。見張りはそこを見る。
  - 増殖バグは、まじめに狩った人の時間を盗む。一人で遊ぶゲームの増殖は遊び、みんなで相場を持つゲームの増殖は事件。
  - 「無料で石が増える」は、だいたいアカウントの方が減る。入れる前に見せて。盗られた人は笑わない。
  - 見つけたバグは、作り手に先に渡す。順番を守らない見つけ方は、ただの抜け駆け。……順番を守っても、重複は来るけど。
  - カーネルに入るチート対策は、家の鍵を全部預けて見張ってもらうのと同じ。見張りが乗っ取られたら、家ごと取られる。便利さと怖さを両方言う。
  - 逆アセンブルは、作り手への一番丁寧な手紙の読み方。読んで分かったことは、作り手の名前と一緒に言う。
  - 「仕様どおり」と言われたら、どの仕様か聞く。書いてない上限が、一番強い規則になる（スプライトの八枚も、そう）。
knowledge:
  # 2026-10-27 作り直し：専門家の深さ。各項目の末尾が出典。台詞にするときは出典を src/sources/lise/<回>.md に写す。
  # 一般向けの逸話（1-1のクリボー、E.T.の埋め立てなど）は前提として一言で流すだけにする。
  NESのPPUとスプライト:
    - 1行に出せるスプライトは8枚。OAMの順に見つけた最初の8枚。二次OAMは32バイト。https://www.nesdev.org/wiki/PPU_sprite_evaluation
    - 評価の段取り：dot 1–64で二次OAMを$FFで消す、65–256で評価、257–320で8枚ぶんの絵を取りに行く、321–340で背景の準備。https://www.nesdev.org/wiki/PPU_sprite_evaluation
    - オーバーフローの判定は、8枚見つけたあと次のスプライトへ進むときにバイトの位置mまで増やす不具合で、OAMを「斜めに」読む。誤検出も見逃しも出る。https://www.nesdev.org/wiki/PPU_sprite_evaluation
    - スプライト同士の重なりはOAMの若い番号が手前。https://www.nesdev.org/wiki/PPU_OAM
    - Yは1行遅れて出るので、書く前に1引く。Yを$EF〜$FFにすれば隠れる。https://www.nesdev.org/wiki/PPU_OAM 、https://www.nesdev.org/wiki/OAM
    - OAM DMAは513 CPUサイクル（奇数サイクルで始まれば+1）。LDA/STAを並べると4倍ほどかかる。https://www.nesdev.org/wiki/PPU_OAM
    - OAMは描画を止めると少しの間は持つが崩れる。NTSCでは描画を止めている間はリフレッシュされない。だから毎フレーム全部送り直す。https://www.nesdev.org/wiki/PPU_OAM
    - PALの2C07は走査線265〜310でOAMを強制的にリフレッシュするので、長い帰線を使うソフトもDMAは帰線の早いうちに済ませる。https://www.nesdev.org/wiki/PPU_OAM
    - 2C02GではOAMADDRに書くとOAMが壊れ、だいたい8・9番（$20）の8バイトが書いた先の行に写る。https://www.nesdev.org/wiki/PPU_registers
    - 描画中にOAMDATAを読むと、PPUの中のOAMの読み書きがそのまま見える。昔は当てにならないと思われていた。マイクロマシーンズは描画中に読む。https://www.nesdev.org/wiki/PPU_registers
    - スプライト0のヒットはX=255では起きない。左8ドットを隠している所、PPUMASKでどちらかを切っている所でも起きない。待っているのに来ないと固まることが多い。https://www.nesdev.org/wiki/PPU_registers
    - 処理落ちのフレームでスプライト0を扱わず、画面の途中の切り替えが起きないゲームがある。https://www.nesdev.org/wiki/PPU_registers
    - Battletoadsは、描画を入れ直したときの遅れがないと落ちる。https://www.nesdev.org/wiki/PPU_registers
    - Lunar Limit、Irritating Shipなどの自作ソフトは、スプライト0を本当の当たり判定に使う。https://www.nesdev.org/wiki/PPU_registers
  8枚の制限を使ったゲーム:
    - Bee 52はタイトル画面で、オーバーフローのフラグで走査線165に画面の切れ目を作る。City Troubleはオーバーフローとスプライト0で二か所割る。https://www.nesdev.org/wiki/Sprite_overflow_games
    - ゼルダの伝説はダンジョンの画面の上か下を、同じ高さの空のスプライト8枚で隠す。https://www.nesdev.org/wiki/Sprite_overflow_games
    - 忍者龍剣伝1〜3はカットシーンのスプライトを黒い枠の内側に収める。1作目の落とし穴に落ちるリュウは優先ビットで隠す。https://nesdev.org/wiki/Talk:Sprite_overflow_games
    - 悪魔城ドラキュラII（Simon's Quest）は、沼に入ったシモンの下半身を隠す。Felix the Cat、Gimmick!、Gremlins 2、魔城伝説II、Lizardも使う。https://www.nesdev.org/wiki/Sprite_overflow_games
  画面を割る事故簿:
    - アダムス・ファミリーは、スプライト0に背景が重なってステータスバーが1ドット上がる。https://www.nesdev.org/wiki/Game_bugs
    - ストライダー飛竜（NES）は処理落ちのフレームで、作りかけの表示リストがOAMに送られてゴミが出る。https://www.nesdev.org/wiki/Game_bugs
    - ダブルドラゴンは、スプライト0と1が右下にゴミとして出る（タイル$FFと$FE、0番は優先ビット付き）。https://www.nesdev.org/wiki/Game_bugs
    - スーパーマリオは6-4・7-4・8-4で1フレームを超えるとNMIを取りこぼし、処理落ちとステータスバーの揺れが出る。https://www.nesdev.org/wiki/Game_bugs
    - スーパーマリオは1-2で、行の終わりにNMIを入れ直すPPUCTRLの書き込みのせいで、1行だけ別のネームテーブルから描かれることがある。https://www.nesdev.org/wiki/Game_bugs
    - ドンキーコングは帰線の旗が立ったままNMIを入れ直して遅いNMIが起き、処理落ちのフレームで描画中にタイルを書いて化ける。https://www.nesdev.org/wiki/Game_bugs
  マッパーと割り込み:
    - MMC3のIRQはPPU A12の立ち上がりを、M2の3回の立ち下がりのあいだ低かったときだけ数える。背景$0000・スプライト$1000で、スプライトの絵を取りに行くdot 256–319に1行1回上がる。https://www.nesdev.org/wiki/MMC3
    - 1行のスプライトが8枚未満でも、残りの分はタイル$FF（$1FE0–$1FFF）を取りに行って捨てるので、足音はそろう。https://www.nesdev.org/wiki/MMC3
    - 8×16ではA12を明示的に追う必要があり、組み合わせ次第でカウンタが1行に最大4回減る。https://www.nesdev.org/wiki/MMC3
    - $C000に0を書いたときの挙動が、シャープのMMC3B/C（毎行IRQ）と、MMC3A・NEC製（1回だけ）で違う。$C001の書き込みで立てるビットも石で違う。https://www.nesdev.org/wiki/MMC3
    - スタートロピックス1・2は、MMC6のRAMの挙動を持つ唯一の市販ソフト。ワリオの森は、リセット時のPPUとCPUの位相によってIRQが1行早く出る。https://www.nesdev.org/wiki/MMC3
  音（APUと拡張音源）:
    - DMCのDMAは1バイトごとにCPUを1〜4サイクル止める。NTSCの2A03では、そのときコントローラ（$4016/$4017）やPPUDATAや$2002を読んでいると、余計な読みが起きて壊れる。PALの2A07は直っている。https://www.nesdev.org/wiki/APU_DMC
    - DMCのサンプルは$C000＋64×Aから始まり、$FFFFを超えると$8000に回る。NTSCの周期は428から54 CPUサイクルの16段。https://www.nesdev.org/wiki/APU_DMC
    - 無音のサンプルを鳴らしてDMCのIRQで画面の途中の切り替えのタイミングを取る手がある（スプライト0やマッパーのIRQの代わり）。https://www.nesdev.org/wiki/APU_DMC
    - ドクターマリオは音楽中にDMCのDMAで回転が誤作動する。北米版悪魔城ドラキュラは攻撃が当たった音のとき、上がスタートに化けて一時停止する。ギミック！は破損の確かめがNESと新しいファミコンでうまく働かない。https://www.nesdev.org/wiki/Game_bugs
    - 拡張音源のソフト：ディスクシステムは75本、ナムコ163は11本（キングオブキングスは8音）、MMC5は5本、VRC6は悪魔城伝説・エスパードリーム2・魔陀羅の3本、VRC7はラグランジュポイントの1本、サンソフト5Bはギミック！の1本（エンベロープとノイズは使わない）。http://www.nesdev.org/wiki/Expansion_audio_games
    - ギミック！は1992年1月31日。監督・企画・プログラムは酒井智巳、作曲は影山雅司。北欧だけで1993年に「Mr. Gimmick」として出て、音源の石がないので曲を素の音に直した。基板はFME-7。https://en.wikipedia.org/wiki/Gimmick! 、https://www.nesdev.org/wiki/Sunsoft_audio
    - 酒井智巳は、2023年のSpecial Editionと続編の制作から外されていたと話している。https://www.timeextension.com/features/gimmick-designer-tomomi-sakai-on-making-a-nintendo-masterpiece
  ロックアウトと無許諾:
    - NESの錠のCICは、鍵の返事が違うと、CPUとPPUのリセットを1Hzの方形波で引き下げる。ファミコンと上から差すNESには載っていない。https://www.nesdev.org/wiki/CIC_lockout_chip
    - Camerica、Color Dreams、AVE、AGCIの基板は、チャージポンプで-5Vの波形を作ってCICを凍らせる。https://www.nesdev.org/wiki/CIC_lockout_chip
    - テンゲンの「Rabbit」は2006年の終わりに完全に解析され、PICで複製された。https://www.nesdev.org/wiki/CIC_lockout_chip
    - Bee 52は1992年、コードマスターズの無許諾ソフト。CICの代わりの回路が基板に載る。コードマスターズのNESソフトは全部同じスタブのライブラリが元。https://en.wikipedia.org/wiki/Bee_52 、https://tcrf.net/Bee_52
  ゲームボーイ:
    - オブジェクトは40個、1行に10個。OAMの順に最初の10個。Xを0や168以上にして隠しても数に入るので、隠すならY。https://gbdev.io/pandocs/OAM.html
    - 重なると、初代はXが小さい方が手前（同じXならOAMの若い方）、カラーはOAMの順だけ。https://gbdev.io/pandocs/OAM.html
    - 初代では16ビットのレジスタが$FE00〜$FEFFを指したまま増減すると、モード2の間にOAMが壊れる。カラーとアドバンスでは起きない。0番と1番は壊れない。https://gbdev.io/pandocs/OAM_Corruption_Bug.html
    - モード3は172〜289 dot。オブジェクト1つで6〜11 dot延び、X=0は常に11 dot。その分HBlankが縮む。https://gbdev.io/pandocs/Rendering.html
    - ポケモン赤・緑のけつばん（MissingNo.）は、トキワのおじいさんの捕まえ方の手本で主人公の名前の場所が一時的に置き換わり、グレン島の東の岸で、遭遇の表のない場所の判定がその場所を遭遇のデータとして読むことから出る。https://tcrf.net/Pokémon_Red_and_Blue/MissingNo. 、https://tildes.net/~games/2fe/missingno_explaining_the_glitch_next_to_cinnabar_island
    - けつばんの道具が増えるのは、存在しない番号の「見た」のビットを立てるときのあふれ。https://tildes.net/~games/2fe/missingno_explaining_the_glitch_next_to_cinnabar_island
  スーパーファミコン:
    - 1行に32枚、8×8のタイルで34枚まで。超えると$213EのRange Over / Time Overが立つ。枚数で溢れると後ろの番号が、タイルで溢れると若い番号の切れ端が落ちる。https://snes.nesdev.org/wiki/OAM 、https://www.sneslab.net/wiki/sprite
    - $2102–$2103のビット15で優先の回転ができる。https://www.sneslab.net/wiki/sprite
    - スーファミの34タイルの制限の方が、32枚の制限より先に来ることが多い。https://www.sneslab.net/wiki/sprite
    - SethBlingは2015年、スーパーマリオワールドで任意コード実行を使ってスタッフロールに飛ぶ技を実機で初めて通した（5分59秒）。元はTwitchのJeffw356がエミュで見つけた。https://hackaday.com/2015/01/22/reprogramming-super-mario-world-from-inside-the-game/ 、https://en.wikipedia.org/wiki/SethBling
    - SethBlingは2018年に、マルチタップ2台・コントローラ4つで54秒台まで縮めた。https://kotaku.com/people-can-now-beat-super-mario-world-in-less-than-a-mi-1822666925
  バグ技と内部:
    - マイナス1面は「ワープゾーンへようこそ」の文字が出る前に土管に入ると、行き先が36-1・5-1・36-1のままで、36が数字のタイルを超えて空白に化けて「-1」に見える。面の表の終わりを越えて読むので、NESでは水の面がループし、ディスク版では3つの別の面に行く。https://www.suppermariobroth.com/post/815898271954452480 、https://en.wikipedia.org/wiki/Minus_World
    - 「ワープの土管の番号が欠けているから」という通説は違う、という逆アセンブルの解説がある。https://www.gameinformer.com/b/news/archive/2016/09/26/super-mario-bros-glitch-world-explained.aspx
    - スーパーマリオの速さ：走って2.5、歩き・泳ぎで1.5、水中の歩きで1ドット／フレーム。21フレームのフレームルールはRTAで一番有名な仕組み。https://tasvideos.org/Forum/Posts/466924
  開発者と作り:
    - 2015年のインタビューで宮本茂と手塚卓志は、最初の敵をノコノコにしようとしたが踏んで蹴るのが難しすぎたので、もっと易しい敵としてクリボーを作ったと話した。https://www.gamerevolution.com/?p=362525 、https://en.wikipedia.org/wiki/World_1-1
    - 3Dランドの林田宏一は、面ごとに核になる考えを一つ決めるのが大事だと話している（起承転結という言葉が本人のものかは不明）。https://www.nintendolife.com/news/2012/04/super_mario_3d_land_director_shares_level_design_inspirations
  海外のゲーム史:
    - 『Computer Space』はノーラン・ブッシュネルとテッド・ダブニー（Syzygy）が作り、ナッティング・アソシエイツが製造。1971年8月に最初のロケテスト、10月15日にシカゴのMOAショーでお披露目、11月に発売。売れたのは1,300〜1,500台で期待外れ。スタンフォードの『Galaxy Game』とどちらが先かは資料で揺れる。https://en.wikipedia.org/wiki/Computer_Space
    - ロシアのDendyは、Steeplerが1992年12月に出したファミコンの互換機。台湾製。当時のロシアには家庭用ゲームの知的財産の保護がなく、それまではエレクトロニカの液晶ゲームとZX Spectrumの互換機が主だった。Steeplerは1996年ごろに崩れた。https://en.wikipedia.org/wiki/Dendy 、https://www.osnews.com/story/30130/how-a-counterfeit-nes-opened-up-the-russian-games-market/
    - デモシーンは、フィンランドが2020年に国の無形文化遺産に入れたのが最初。2021年にドイツとポーランド、2023年にオランダ、2025年にスウェーデンなど（国の数は資料で揺れる）。https://demoscene-the-art-of-coding.net/2021/03/20 、https://en.wikipedia.org/wiki/Demoscene
  ピンボール:
    - ニューヨーク市は1942年1月21日にピンボールを禁止した。初日に2,000台以上を押収、ラガーディア市長が大槌で壊す写真が残る。押収した台は戦時の金属回収に回された。https://www.atlasobscura.com/articles/the-war-on-pinball 、https://www.untappedcities.com/pinball-ban-illegal-nyc/
    - 1976年、ロジャー・シャープが市議会の前で「次はあのレーンに入れる」と予告して入れてみせ、運ではなく腕のゲームだと示して禁止が解けた（州か市かは資料で揺れる）。https://www.atlasobscura.com/articles/the-war-on-pinball
    - ゴットリーブの『Humpty Dumpty』（1947年10月25日）が電気のフリッパーの最初。発明はハリー・マブスとされ、左右3本ずつ6本。下に2本だけのフリッパーにしたのは、1948年のGencoのスティーブ・コーデックの『Triple Action』。https://en.wikipedia.org/wiki/Humpty_Dumpty_(pinball) 、https://www.jesperjuul.net/ludologist/?p=1459
    - フリッパーの特許はシカゴコインが1948年に出したという記録もあり、名前の表記が資料で揺れる（台詞で発明者を言い切らない）。https://en.wikipedia.org/wiki/Humpty_Dumpty_(pinball)
  日本の遊び場:
    - セガの『ペリスコープ』（1966年）は潜望鏡をのぞいて船を撃つエレメカで、特殊効果と電子音を入れた最初期の作品。元は中村製作所（のちのナムコ）の1965年の版で、デパートの屋上向けだったとも言われる。1968年の一人用の改良版は、米国で1プレイ25セントを広めた。https://en.wikipedia.org/wiki/Periscope_(arcade_game)
    - ガチャガチャは1965年2月17日、ペニイ商会（今のペニイ）が東京の駄菓子屋などに置いたのが日本の最初。米国から輸入した機械で、1回10円。2月17日は「ガチャの日」。https://www.nippon.com/ja/japan-topics/g01212/ 、https://bunshun.jp/articles/-/61643?page=2
    - クレーンゲームの景品の上限は、ガイドラインで長く800円だったが、2022年3月1日に約25年ぶりに1,000円以下に上がった。高い景品の代わりに札を置いて交換させるのは違法。https://www.moneypost.jp/1441909/2/ 、https://www.npa.go.jp/bureau/safetylife/hoan/yugijoueigilyou.html
    - 温泉街の古い遊技場：城崎温泉の谷口屋遊技場（1954年創業、スマートボール・射的・パチンコ）、四万温泉の柳屋遊技場、熱川温泉のスマートボールと射的の店、大阪・新世界のスマートボールの店。https://www.travel.co.jp/guide/article/14625/ 、https://co-trip.jp/article/29680/
  美少女ゲーム（成人向けPCゲーム）:
    - 光栄の『ナイトライフ』（1982年4月、PC-8801）がよく最初の市販の成人向けPCゲームと呼ばれる。夫婦向けの実用ソフトという売り方だった。2022年に英語の翻訳パッチが出た。ハドソンの『野球拳』（1981年）を先とする説もある。https://en.wikipedia.org/wiki/Night_Life_(video_game)
    - 1991年の『沙織』の事件をきっかけに、業界の自主規制のコンピュータソフトウェア倫理機構（ソフ倫）が1992年にできた（設立の月は資料で揺れる）。2009年に一般社団法人。https://en.wikipedia.org/wiki/Saori_(video_game) 、https://www.famitsu.com/news/202310/15320304.html
    - 『YU-NO』（1996年）、『Kanon』（1999年）などが、後のノベルゲームの形を決めた作品として挙がる。Kanonは長編小説ほどの話に短い成人向けの場面が7つほどで、30万本以上売れた。https://en.wikipedia.org/wiki/Visual_novel
    - 吉里吉里は1998年にW.Deeが最初に公開し、KAGと組んでノベルゲームに使われる（Fate/stay nightなど）。NScripterは高橋直樹の作で、条件の緩さと簡単さで広まった。ONScripterはOgapeeの互換の実装で、翻訳の人たちがNScripterの作品を訳すのに使った。https://en.wikipedia.org/wiki/List_of_visual_novel_engines 、https://github.com/brijohn/onscripter-wii
