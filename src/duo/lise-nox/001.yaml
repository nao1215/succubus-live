# 二人配信 リゼ×ノクス 001：リゼの部屋にノクスが来た（重いときに二回押すと、二回もらえる）
# 2026-10-27 夜に書いた。形と決まりは src/README.md と scratchpad の duo-spec（二人それぞれの一人配信を聴いてきた常連向け。自己紹介なし）。
# 2026-10-27 深夜、Codex のレビュー（artifacts/codex/duo-review/report.md）で直した：L2 テトリスは NES の任天堂版・レベル155から消し方しだい、L3 断言を確かめた範囲に、
#   L4 投票の集計はどの票でも成り立つ形に、L5 初見役と21フレームの脇道を外して冪等性を報告書の押し付け合いで、L6 録画を数える、L7・L8 言い回し。
#   ノクスはテックリード（小さな班を見る係。設計のレビュー、障害の振り返りは人の名前を書かない、一回だけの報告も欲しがる）。内気・小声・早口・照れはそのまま。
# 本題らしきもの：リゼが夜中に見つけた放置ゲーのバグ（画面が重いときに受け取りを押すと、報酬がたまに二回入る）を、報告書を書くのが面倒なのでノクスに書かせようとする。
#   ノクスは「リゼが見たならバグ。でも手順が無いと『再現しません』で閉じられる」と手順を書かせようとし、面倒がるリゼとぶつかる。そこから九時間ずれ事件と「何回押しても一回分」（冪等性）の話になる。
# 脇道：カップヌードルの三分と十五分（food_cupnoodle）、ジフかギフか（fac_gif。投票）、emacs のテトリス（fac_vim_emacs）→ NES 版テトリスのクラッシュ → 「よる」の仮説。
# 内輪ネタ：リゼの重複です（九件）・朝五時の報告者と三分差・規約は同意だけ・ねぼすけ一号、ノクスの ×3.7・0.05・よる・THANKS（41行、うち一行はサボテン）・「！」出た・nxo。
# 増殖の手順（どう押すか）は言わない（リゼの taboo）。放置ゲーの名前も出さない（作り話）。テトリスを初めて止めた人は未成年なので名前を出さない。出典は src/sources/duo/lise-nox.md。
title: ノクスが来た。重いときに押すと、報酬が二回もらえるバグ
lobby:
- 今日は、地下からノクスが上がってきてくれたの。
- 夜中にゲームのバグを見つけたわ。報告書は、ノクスに書いてもらうつもり。
- ……まだ頼んでないけど。
parts:
- title: 入り（時間ちょうどと、十五分のカップヌードル）
  beats:
  - nox: あ、映ってる。……リゼ、始まってる。始まってるわよ。
  - lise: 知ってるわ。目を閉じてるだけ。
  - chat: [ログボだけ勢, 開始一秒で寝てる]
  - chat: [処理落ち愛好会, ノクスいるじゃん]
  - nox: 処理落ちさん、いるの。こんばんは。今日はリゼの部屋なの。
  - lise: 「開始一秒で寝てる」ね。違うわ。ノクスが早く来すぎたの。
  - nox: 早くないの。約束の時間ちょうどに、ノックしたの。
  - lise: ちょうどに来る人、初めて見たわ。普通は少し遅れるものよ。
  - nox: ……ねえリゼ、机の上のそれ、何？
  - lise: カップヌードル。シーフード。ノクスがノックする前に、お湯入れたの。
  - nox: {face: surprised, text: 'それ、もう十五分たってる。'}
  - lise: 十五分でいいの。わざとよ。
  - chat: [ログボだけ勢, 放置の料理だ]
  - lise: そう、放置の料理。汁を吸って別の食べ物になるの。
  - nox: 私、三分をタイマーで計る人なの。四分でも伸びたって分かる人なの。
  - chat: [カーネル読み, 六回中四回の人]
  - nox: {face: annoyed, text: 'カーネル読みさん、六回中四回の話は今しないで。'}
  - lise: 一口あげるわ。
  - nox: いらない。……一口だけ。
  - nox: {face: surprised, text: '……おいしい。悔しい。'}
  - chat: [処理落ち愛好会, ノクスが負けた]
  - lise: {face: smug, text: '勝ったわ。放置の勝ち。'}
- title: 本題（重いときに押すと）
  beats:
  - chat: [規約は同意だけ, で、なんでノクスさん呼んだの？]
  - lise: 「なんで呼んだの」ね。バグを見つけたのよ、ゆうべ。
  - nox: それ、私も今初めて聞くの。
  - lise: 来てから言えば、断れないでしょう。
  - chat: [ログボだけ勢, 罠じゃん]
  - lise: 罠じゃないわ。お願いよ。報告書を書いてほしいの。私が書くと、書いてる間に寝るの。
  - chat: [朝五時の報告者, その節はどうも]
  - lise: その節って言わないで。……ほら、こうなるの。
  - nox: どんなバグ？
  - lise: いつもの放置ゲー。名前は言わないわ。敵がいっぱい出て、画面が重くなる所があるの。
  - lise: そこで受け取りのボタンを押すと、たまに報酬が二回入るの。
  - nox: たまに、って何回に何回？
  - lise: 三回くらい見たわ。
  - nox: 何回やって、三回？
  - lise: 数えてないわ。眠かったもの。
  - nox: リゼが見たなら、起きてるのよ。バグだと思う。
  - nox: でも、それだと直してもらえないの。よその会社は、手順の無い報告を「こちらでは再現しません」で閉じるの。うちのチームなら閉じないけど。
  - lise: {face: annoyed, text: '見たって書けばいいでしょう。'}
  - nox: 私、それで閉じられたことあるの。二〇一四年。三年後に、別の人がほぼ同じ手順で出して、そっちで直ったの。
  - lise: 手順を書くの、面倒なのよ。押して、数えて、また押すのよ。
  - nox: 分かる。でも、その面倒な所が、直してもらえるかどうかの所なの。
  - chat: [ログボだけ勢, 部屋の主が負けてる]
  - lise: 負けてないわ。ロード中なだけ。
  - lise: それに、これは本気なの。あれ、プレイヤー同士で売り買いできるのよ。
  - lise: 増やした人が売ったら、まじめに放置してた人の持ち物まで安くなるの。
  - nox: ……それは、ちゃんと出した方がいいわね。
  - lise: でしょう。どう押すかは言わないわよ、チャット。窓口にだけ書くの。
- title: 重いときだけ
  beats:
  - nox: 重いときだけ起きるのね。……そこ好き。一番好きな種類のバグなの。
  - chat: [処理落ち愛好会, ラグフレームの出番]
  - lise: 処理落ちの出番ね。重くて計算が間に合わないコマは、ボタンを読まないことが多いの。
  - nox: 待って。じゃあ、押したのが次のコマに……
  - lise: 言いかけてやめないで。
  - nox: 画面が重い理由と、二回入る理由は、別かもしれないの。今はまだ、分けて調べる。
  - chat: [カーネル読み, 出た、分けて調べる]
  - nox: うちの班の口ぐせなの。混ぜると、振り返りで全員が違う話をするの。
  - lise: 班？ ノクス、班があるの？
  - nox: {face: shy, text: '……小さいのを、見てるの。設計を読む係。'}
  - chat: [DDD警察, こいつのレビュー、コメントが毎回四十個つく]
  - nox: {face: flustered, text: '「四十個」は、ほんと。直してほしいのは三つ。あとは相談なの。'}
  - chat: [新卒二年目, その三つを先に教えてください]
  - nox: {face: shy, text: '三つを先に、ね。……うん。それは、私が直す。'}
  - lise: 私の報告書は一行よ。四十個もつかないわ。
  - nox: 一行でも、読むの。
- title: 二回届く（二重の請求書）
  beats:
  - lise: で、二回入るのは何なの。
  - nox: 遅いと、人はもう一回押すの。受け取る方には二回届く。よくある事故なの。
  - lise: ノクスも二回出したことあるでしょう。請求書。前に地下で聞いたわ。
  - nox: {face: flustered, text: 'リゼ、それ言うの。'}
  - lise: 言うわ。私の配信だもの。
  - nox: ……前の現場で、夜の請求が九時間早く走って、そのあと時間どおりにもう一回走ったの。請求書が二回出たの。
  - chat: [カーネル読み, 九時間ずれ事件]
  - nox: そう。別の班が、機械の時計を世界の基準の時間に変えてたの。会議は、私の確認不足で終わった。
  - nox: だから、うちの班の振り返りは、人の名前を書かないの。書くのは、どこで二回になったか、だけ。
  - lise: いいわね。私の「重複です」九件も、名前を書かないでほしかったわ。
  - nox: リゼのは、同じ人が九回出してるから……
  - lise: {face: annoyed, text: '名前を書かないで。'}
  - chat: [新卒二年目, 二回届いても一回にする方法ってあるんですか]
  - nox: 新卒さん、いい質問。同じ受け取りには、同じ番号を付けるの。同じ番号が二回来たら「もう渡した」って返す。冪等性っていうの。
  - lise: じゃあ、受け取りのお願いが二回届いても、一回分だけ渡せばいいのね。
  - lise: じゃあ報告書も、何回お願いしても一枚ね。
  - nox: ……待って。今、私、引き受けたことになってる？
  - lise: 一回は届いたでしょう。
  - chat: [カーネル読み, 受領と承諾は別]
  - nox: {face: smug, text: 'そう。受け取ったのと、やるって言ったのは別なの。'}
  - lise: ……ノクスのくせに、言い返したわね。で、あの放置ゲーは番号を見てないの？
  - nox: かも。重いときに、一回目の受け取りが書き終わる前に、二回目も「まだもらってない人」に見えた、のかも。
  - lise: 確かめてないことは言わないんじゃなかったの？
  - nox: {face: shy, text: '……「かも」って言ったの。二回。'}
  - chat: [ログボだけ勢, リゼ二勝一敗]
  - lise: {face: smug, text: '本日二勝目。一敗は数えないわ。'}
- title: そういえば（ジフかギフか）
  beats:
  - chat: [処理落ち愛好会, 報告書にカクカクの動画つけたら？GIFで]
  - lise: 「GIFで」ね。ギフで付けるわ。
  - nox: ジフ。
  - lise: ギフ。
  - nox: 作った人がジフって言ってるの。二〇一三年に、賞の授賞式で、わざわざ。
  - lise: ノクス、会議ではギフって言ってるでしょう。
  - nox: {face: surprised, text: '……なんで知ってるの。'}
  - lise: 前に地下に寄ったとき、扉の外まで聞こえてたわ。通話の声。
  - nox: ……その一言だけは声で言ったの。新しい人がギフって言ったから、合わせたの。
  - lise: それを折れるって言うのよ。チャットにも聞くわ。
  - ask:
      who: lise
      q: GIF（動く画像の形式）、何て読む？
      options:
      - c: ジフ
        r:
        - nox: '{name}さん、ジフね。……ありがとう。'
        - lise: ノクスの味方が来たわね。
      - c: ギフ
        r:
        - lise: '{name}、ギフね。そうよ、それでいいの。'
        - nox: ……そう。
      - c: どっちでもいい
        r:
        - lise: どっちでもいい、ね。{name}は平和な人ね。
        - nox: どっちでもよくないの。……会議の間だけは、どっちでもいいけど。
      - c: 読んだことない
        r:
        - nox: '{name}さん、正直でいいの。動く絵の、あの形式の名前よ。'
        - lise: 読まなくても使えるわ。私もそうしてるもの。
      npc:
      - [カーネル読み, 0]
      - [処理落ち愛好会, 1]
      - [ログボだけ勢, 1]
      - [RTOS屋十五年, 0]
      - [規約は同意だけ, 3]
      - [朝五時の報告者, 2]
  - lise: ほら、ギフの人もちゃんといるわ。処理落ちもログボも。
  - nox: ジフの人もいるの。カーネル読みさんと、RTOS屋さん。
  - lise: 規約は「読んだことない」ね。規約も読まない人だもの。
  - lise: 家ではジフ、会議ではギフ。それがノクスよ。
  - nox: ……ん。
  - lise: ほら、短くなってきた。
- title: 脇道（emacs のテトリス）
  beats:
  - chat: [DDD警察, 報告書のエディタは何で書くの]
  - nox: 報告書のエディタ？ vim。……戻ってきたわ。
  - lise: 私は emacs よ。
  - nox: リゼ、emacs で何を書くの？
  - lise: 何も書かないわ。テトリスするの。勝手に遊んでくれるのも足せるのよ。
  - chat: [RTOS屋十五年, テトリスといえば、NES版を止めた人いたな]
  - lise: いたわね。二〇二三年の暮れ。人のプレイで、初めてそこまで行って止めた人。
  - lise: 海外のファミコン、NESの任天堂のテトリスね。レベル百五十五から、消し方によって固まることがあるの。
  - lise: 点数の足し算が遅いのよ。レベルが高いほど、足し算を何回も繰り返す作りなの。
  - lise: で、終わらないうちに、画面を描く係が割り込んでくるの。
  - nox: 待って。割り込む係は、計算が途中なのを知らないのね。
  - lise: 知らないわ。いつもの所で計算が終わってるつもりで来るの。違うと、落ちるの。
  - nox: {face: surprised, text: 'それ、よると同じ形かも！'}
  - chat: [処理落ち愛好会, ！出た]
  - chat: [カーネル読み, ！出た]
  - nox: {face: shy, text: '出た。……ごめん、早口になった。'}
  - nox: よるはね、最初の時計の合図で落ちるの。合図の係が来たとき、まだ準備の途中なのかもしれない。
  - lise: 私のテトリスで、ノクスの九年が動いたの？
  - chat: [RTOS屋十五年, 割り込みを許す前に準備が終わってるか見て]
  - nox: 割り込みの前に準備の確認、ね。はい。……あ、はいって言っちゃった。見ます。
- title: また戻る（報告書を書く）
  beats:
  - chat: [朝五時の報告者, 二回もらえる件、報告書は書かないんですか]
  - lise: 書いたわよ、一行。「重いとき、たまに二回入る。眠い」。
  - nox: {face: smile, text: 'レビューするね。「たまに」は数字にして。「眠い」は消して。'}
  - lise: 眠いのは本当よ。
  - nox: 本当でも、直す人の役に立たない行は消すの。……リゼ、ゆうべの録画ある？
  - lise: あるわよ。放置ゲーは、録りっぱなしなの。
  - nox: えらい。重い所だけ早送りで見るね。……押したのが十回。二回入ったのが二回。
  - lise: ほら、バグよ。
  - nox: {face: smile, text: 'バグなのは最初から。これで、直してもらえる報告になったの。'}
  - nox: 書くわ。起きたこと、起きる条件、回数。……二時間で清書する。
  - chat: [処理落ち愛好会, ×3.7]
  - chat: [新卒二年目, ×3.7]
  - nox: {face: annoyed, text: '「×3.7」……二人とも打つのね。新卒さんまで。'}
- title: 0.05 と、乱数の種
  beats:
  - chat: [カーネル読み, 乱数は絡んでない？]
  - nox: 乱数はまだ見てないの。今分かるのは、重いときに起きた、だけ。次に見る所に書いとく。
  - lise: 乱数の話はやめて。それに、乱数はノクスの方が痛い目にあってるでしょう。
  - nox: リゼ。
  - lise: 「再現性のため」に、乱数の種を固定したのよね。財布で。
  - chat: [処理落ち愛好会, 0.05の話きた]
  - nox: {face: flustered, text: '試験の設定を、本物に持ち込んだだけなの。'}
  - nox: 財布だったの。寝て起きたら 0 だったの。振り返りは自分で書いた。
  - lise: 私のねぼすけ一号は十九日もったわ。ノクスの財布は一晩。
  - chat: [RTA走者見習い, 乱数を固定したら同じ鍵で同じ穴が開く]
  - nox: 同じ鍵で同じ穴、そう。鍵の話よ。……半分は。
  - lise: サキュバスの部屋で、その言い方をしないで。意味が増えるわ。
  - chat: [ログボだけ勢, 増えた意味は増殖バグ扱いで]
  - lise: {face: smug, text: '増えた意味は、報告しないでおくわ。'}
- title: 締め（よると、THANKS の四十二行目）
  beats:
  - nox: 報告書、下書きできた。
  - chat: [朝五時の報告者, 実は私も昨日、同じ所で一回だけ見ました]
  - lise: {face: surprised, text: '……見たの？'}
  - chat: [朝五時の報告者, 一回だけなので出してません。再現できなかったので]
  - nox: 一回だけだと「再現しません」で閉じられるものね。朝五時さんが出さなかったのも分かる。
  - nox: でも、一回でも送っていいの。「一回だけ、再現できなかった」って添えて。別の人にも起きたって分かるの。条件を比べたいから。
  - lise: ノクス、朝五時さんの一回も書いて、送って。今。
  - nox: 清書なしで、いきなり本番？
  - lise: 本番は得意でしょう。サキュバスなんだから。
  - nox: {face: shy, text: '……報告書の話よ。送った。'}
  - nox: 返事が来た。「受け付けました」。自動のやつ。
  - lise: 「重複です」じゃないわね。
  - chat: [カーネル読み, よるは起動しないの？]
  - nox: よる、ここで？ ……さっき、合図を許す前に、準備が終わってるか確かめる行を一行足したの。
  - lise: いいわよ。落ちるところまで、放置で見てるわ。
  - nox: yoru、って出た。合図を入れる。
  - nox: {face: surprised, text: '……落ちた。'}
  - chat: [処理落ち愛好会, 今日も落ちた]
  - nox: でも、落ちる前に確かめた行の字が出たの。この準備は先に終わってた。今日疑った所は外れ。次、見よう。
  - nox: {face: smile, text: 'リゼ、THANKS に一行足すね。四十二行目。'}
  - lise: 四十二？ そんなに誰かいるの？
  - nox: 今、四十一行。一行はサボテン。
  - lise: サボテンが載ってて、私がまだ載ってなかったの？
  - nox: 今、載ったの。
  - chat: [ログボだけ勢, リゼがロード中になった]
  - nox: あ。綴り、間違えた。「Lsie」になってる。
  - lise: {face: annoyed, text: '直して。今すぐ。'}
  - nox: 直してって言えるの、すごいわね。私、nxo のまま言ってないの。
  - lise: 言いなさい。自分の名前よ。
  - nox: ……直した。リゼも、報告書、一回くらい自分で最後まで書いて。
  - lise: 書かないわ。次もノクスを呼ぶもの。
  - nox: 呼ばれたら、時間ちょうどに来るの。
  - lise: じゃあ、私は少し遅れて起きるわ。おつかれさま。
  - nox: 起きてる人たち、ありがとう。寝なさい。……リゼはもう寝てるけど。
