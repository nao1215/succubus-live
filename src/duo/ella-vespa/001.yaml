# エラ×ヴェスパ 001：エラの部屋にヴェスパが法被を直してもらいに来た（2026-10-27 二人配信の最初の回）
# 二人の一人配信を聴いてきた常連向け。続き：vespa/003 の終わり（「ミ」の糸の色はエラに聞いてから決める）、エラの「最前列の取り方を聞くと負けた気がする」（relations）、
# エラの物販の四時間（rec_life_long_wait）、歌えない（bad_at）、手紙の返事（ella/001・007）、ヴェスパの「おつかれさまの人」（vespa/002）、最後尾札を逆さま（bible life）。
# 共通の話題：単推しか箱推しか（fac_oshi_hako：ヴェスパ単推し／エラ箱推し）、豚まん（fac_nikuman：二人とも豚まん派）。
# 2026-10-27 深夜、Codex のレビュー（artifacts/codex/duo-review/report.md）で直した：E1 整理番号はヴェスパの行く現場の話にし、エラは基本を知っている、E2 投票の集計はどの票でも成り立つ形、
#   E3 角の手の由来を一往復にして二人の角と手の掛け合いに、E4 二年目の「両方の糸」（vespa/003）を拾う、E5 落ちサビとモーツァルトを今の二人の行動へ戻す、E6 コメントを読む、E7 モーツァルトさん。
#   下ネタは物販の「搾り取る」だけ残し、ペンライトの「太い細い」はやめた。
# 出典は src/sources/duo/ella-vespa.md。ハチミツ注意報・ミナミ・常連の発言・城の出来事は架空。
title: ヴェスパが法被を直しに来たので、アイドルとメタルのライブの作法を比べた
parts:
- title: 始まり（五分前と、七分遅れ）
  beats:
  - say: {face: smile, text: 皆様、ごきげんよう。エラでございます。}
  - say: 本日は、当方のお部屋に、お客様がいらっしゃる予定なのですけれど。
  - chat: [晴海の生き残り, ヴェスパの配信から来た。本人は？]
  - say: まあ、晴海様、ようこそ。本人は、と。……まだでございます。お約束は、始まる五分前でございました。
  - chat: [最後尾はこちら, あいつは必ず寄り道を一個する]
  - say: 必ず寄り道を一個する。最後尾様、よくご存じで。
  - vespa: ごめーん！ 遅れた！ もう映ってる！？
  - say: {face: annoyed, text: 映っております。七分の遅れでございます、ヴェスパ様。}
  - vespa: 七分！ 数えてたの！？ ……途中で豚まん買ってきたの。二人分！
  - say: 拝見いたします。……袋に「肉まん」と書いてございますね。
  - vespa: 書いてある！ でも中身は豚！
  - say: 豚の饅頭を肉と申すのは、雑でございます。
  - vespa: でしょ！ 雑なの！ ここは二人とも同じ派だから、安心して食べられる。
  - chat: [武道館二階東, 二人とも豚まん派か]
  - say: 豚まん派でございます。七分のことは、これで許して差し上げます。
  - vespa: {face: smug, text: やった、豚まんで七分買えた！ ……ふふ、安い！}
- title: 法被の「ミ」と、糸の色
  beats:
  - vespa: で、今日の本題！ これ！ 緑の法被！
  - say: ミナミ様の法被でございますね。背中の刺繍の「ミ」が、ほつれております。
  - chat: [緑ペンラ二年目, 先輩こんばんは！ 「ミ」の二本目の線が取れそうって言ってました]
  - vespa: 二年目、こんばんは！ そう、二本目がぺろってなってるの。洗いすぎた。
  - say: 法被は、洗濯ネットに入れてくださいまし。
  - vespa: ネット！ 知らなかった！
  - chat: [新譜しか聴かない, で、糸は何色にするの]
  - vespa: それ！ この前の配信で決まらなかったの。緑か、黄緑か。
  - say: ミナミ様のお色が、緑から黄緑に変わったのでございましたね。
  - vespa: 2018年に！ 刺繍を入れた次の月に！ 一万二千円！
  - chat: [晴海の生き残り, 黄緑は緑の一種だって毎回言ってる]
  - vespa: 一種だもん！ 親戚だもん！ ……あ、前の配信で、二年目が「両方の糸で縫えば」って言ってた！
  - chat: [緑ペンラ二年目, 言いました！]
  - say: では、「ミ」の線は緑で縫って、そのふちを黄緑で。主旋律とハモりでございます。
  - vespa: {face: surprised, text: 両方入る！ 昔の緑のミナミも、今の黄緑のミナミもいる！ 二年目、採用！ エラが形にしてくれた！}
  - chat: [解釈違いです, 解釈違いです。先輩は緑一色でしょ]
  - vespa: 緑一色でしょ、って、解釈違いまで来た！ じゃあ、みんなに聞こう！
  - ask:
      who: vespa
      q: 法被の「ミ」を縫い直す糸、何色がいい？
      options:
      - c: 緑だけ
        r:
        - '{name}は緑一色！ 分かってる！ 九年分の緑！'
      - c: 黄緑だけ（今の色）
        r:
        - '{name}は今の色派！ ……うっ、正しい。正しいけど！'
      - c: 緑で縫って、ふちを黄緑
        r:
        - ella: '{name}様、ありがとうございます。二年目様の案でございます。'
        - エラ、選ばれて尻尾が揺れてる！
      npc:
      - [緑ペンラ二年目, 2]
      - [解釈違いです, 0]
      - [晴海の生き残り, 1]
      - [武道館二階東, 2]
      - [新譜しか聴かない, 2]
  - vespa: ふちを黄緑が一番多い！ 決まり！
  - say: では、縫いながらお話しいたしますね。
  - vespa: お願いします、エラ先生！
  - say: 先生ではございません。本物の先生が見ておられますので。
  - chat: [ピアノ教室の先生, 呼ばれた気がした]
- title: 最前列の取り方
  beats:
  - say: ところで、ヴェスパ様。前から、伺いたいことがございまして。ライブの最前列は、どうやって取るのでございますか。
  - chat: [武道館二階東, エラちゃん、それずっと聞きたがってたよね]
  - say: {face: annoyed, text: 武道館様、言わないでくださいまし。聞いたら負けた気がするので、黙っておりましたのに。}
  - vespa: 負けじゃないよ！ 教える！ 私の行く立ち見の現場なら、まず整理番号！
  - say: 整理番号は存じております。番号が悪くても前へ行ける作法を、伺っているのでございます。
  - vespa: 作法で番号は変わんないよ！ 走ったら怒られるし！ 私、バイトで呼ぶ側やってるもん。番号順に呼ぶだけ！
  - say: {face: surprised, text: 当方、四十年、どこかに技があるのだと信じておりました。}
  - chat: [ヘドバンで首やった, 抽選と仲悪いエラ終了]
  - say: 終了ではございません。……抽選の神様とは、たしかに仲が悪うございますけれど。
  - chat: [緑ペンラ二年目, 先輩は最前取ったことあるんですか]
  - vespa: 最前取ったこと？ ある！ 2023年に、2番！
  - say: それで、最前でミナミ様に、何かおっしゃいました？
  - chat: [最後尾はこちら, そのあとのチェキ会で「おつかれさまです」]
  - vespa: {face: annoyed, text: 『チェキ会でおつかれさまです』って、最後尾！ 言わないで！ 行くのは得意なの！ 喋るのが苦手なの！}
- title: コールとMIX
  beats:
  - chat: [晴海の生き残り, エラはコールできるのか]
  - vespa: そうだ、エラ、コールやったことある？ 曲の決まった所で、みんなで名前を呼んだりするやつ。
  - say: メタルのライブで「ヘイ！ ヘイ！」くらいでしたら。
  - vespa: それもコール！ じゃあ今日はMIXやろう！
  - chat: [ヘドバンで首やった, ミックスって録音の？]
  - say: 首やった様、当方もそれだと思いました。録った音を混ぜて仕上げる、ミックス。
  - vespa: 違う違う！ イントロとか間奏で、みんなで叫ぶ呪文みたいなやつ！
  - vespa: 「タイガー！ ファイヤー！ サイバー！ ファイバー！ ダイバー！ バイバー！ ジャージャー！」
  - say: 虎、火、電脳、繊維、潜る方、震える方。……ジャージャーは？
  - vespa: ジャージャーは、ジャージャー！
  - chat: [新譜しか聴かない, 出た敬語訳]
  - say: {face: smug, text: では敬語訳で。「虎でございます、火でございます、電脳でございます、繊維でございます」。……ふふ。}
  - vespa: 長い！ 間奏が終わっちゃう！
  - chat: [ヘドバンで首やった, 繊維でございますで笑った]
  - chat: [晴海の生き残り, 日本語のMIXはもうあるぞ。虎、火、から始まるやつ]
  - vespa: そう、日本語版、もうあるの！
  - say: {face: sad, text: ……当方の訳より、先に。}
  - vespa: エラ、先を越されてしょんぼりしてる！ 私の発見日誌と同じ顔！
  - say: でも、一つ感心いたしました。ヴェスパ様、今のMIX、テンポが一度も揺れておりませんでした。
  - vespa: {face: shy, text: え、褒めてる！？ もっと言って！ 一人カラオケで毎週練習してるから！}
  - vespa: じゃあエラも！ 名前を呼ぶだけ！ せーの、「ミナミー！」
  - say: 歌は、お断りいたします。
  - vespa: 歌じゃない！ 叫ぶだけ！ 音の高さ関係ないから！
  - chat: [ピアノ教室の先生, 叫ぶだけなら低くならないよ]
  - say: 先生まで。……では、一度だけ。ミナミ様ー！
  - vespa: {face: laugh, text: 様いらない！ 「様ー」で伸ばさないで！}
  - chat: [武道館二階東, 丁寧すぎて客席が静かになるやつ]
- title: ヘドバンと、手の形
  beats:
  - chat: [ヘドバンで首やった, じゃあヴェスパはヘドバンやって]
  - vespa: ヘドバン！ やってみたい！ ……こう？
  - say: ヴェスパ様、それは頷いておられるだけでございます。
  - chat: [新譜しか聴かない, チェキ会で頷くだけの人]
  - vespa: {face: annoyed, text: 新譜まで！ エラのとこの人も厳しい！ ……でも手のやつは知ってる！ こう！ キツネ！}
  - say: それはBABYMETAL様の、キツネの手でございますね。当方どもメタルの客は、人差し指と小指を立てます。角でございます。
  - vespa: 角、もう頭にあるじゃん！
  - say: 客席の後ろからも見えるように、でございます。ディオ様は、お祖母様に教わった、悪い目をはらう手だとおっしゃっていたそうで。
  - vespa: おばあちゃんの！？ 悪魔のじゃなくて！？
  - say: 悪魔のではございません。……当方どもは、悪魔の親戚ですけれど。
  - vespa: じゃあ私、キツネ。エラ、角。隣で違ってもいい？
  - say: ええ。当方の顔に当たらなければ。
  - vespa: じゃあ、エラの頭の横に、私の手も。角四本！
  - say: {face: annoyed, text: 近うございます。二本で足りております。}
- title: 単推しか、箱推しか
  beats:
  - chat: [解釈違いです, エラはバンドの中で誰推し？]
  - vespa: それ聞きたい！ エラ、誰推し！？
  - say: 推し、でございますか。……バンドは、全員でバンドでございます。
  - vespa: 箱推しだ！ グループ全体を推すこと！ 私はミナミだけ。単推し！ 九年！
  - say: サバスは、ウォード様のドラムがなければ、サバスではございませんので。
  - vespa: でも一人に決めないと、物販で何色のタオル買えばいいか分かんないじゃん！
  - say: 全色でございます。
  - vespa: 全色！？ 箱推しってお金かかる！
  - ask:
      q: 皆様は、グループやバンドを、お一人だけ推しますか。それとも全員？
      options:
      - c: 一人だけ（単推し）
        r:
        - vespa: '{name}、単推し仲間！ その人の色、何色？'
      - c: 全員（箱推し）
        r:
        - '{name}様、全員でバンドでございますよね。'
      - c: 日によって変わる
        r:
        - '{name}様は日によって。……ヴェスパ様、それは何と申しますの。'
        - vespa: DDって言う！ 「誰でも大好き」の略！ リゼがそれ！
      npc:
      - [緑ペンラ二年目, 0]
      - [晴海の生き残り, 2]
      - [武道館二階東, 1]
      - [新譜しか聴かない, 0]
      - [ヘドバンで首やった, 1]
  - say: 箱推しのお仲間も、いらっしゃいました。武道館様と、首やった様。
  - vespa: でも箱推しって、メンバー全員の誕生日、覚えてるんでしょ？
  - say: 誕生日は存じません。ドラムの方の、シンバルの銘柄でしたら。
  - vespa: それ推し活！ 誕生日よりそっちの方が重い！
- title: 物販の列
  beats:
  - say: 物販といえば、当方、四時間並びまして。当方の一人前で、当方のサイズのTシャツだけ、売り切れました。
  - vespa: {face: surprised, text: 一人前で！？ それ一番つらいやつ！}
  - chat: [最後尾はこちら, よくある。売り切れの札出すの、こっちもつらい]
  - vespa: 札といえば私、前に最後尾の札を……
  - chat: [最後尾はこちら, 逆さまに持って四十分立ってた]
  - vespa: 逆さまに四十分、って！ 自分で言おうとしたのに！ みんな首をかしげながら並んでくれたの！ 優しい列だった！
  - chat: [ヘドバンで首やった, 物販でサキュバスが搾り取られてる]
  - vespa: 物販はお財布が搾り取られる場所だからね！
  - say: {face: smug, text: ヴェスパ様、サキュバスの前で「搾り取る」とおっしゃらないでくださいまし。当方どもの本業でございます。}
  - vespa: 今のわざとでしょ！ ……でも物販の方が搾り方うまいよ。一回で二万円いくもん。
  - say: 二万円。……当方ども、まだまだでございますね。
  - chat: [ピアノ教室の先生, 張り合わないで]
- title: 落ちサビで黙る作法
  beats:
  - vespa: あ、そういえばさー。落ちサビって、音楽の人から見るとどうなってるの？
  - say: 最後のサビの前で、伴奏を薄くする所でございますね。
  - vespa: そう！ 私の行く現場だと、そこはコールをやめて黙るの。ペンライトだけ推しの色にして上げるの。誰も決めてないのに！
  - chat: [ヘドバンで首やった, ペンライトって何本持ってくの]
  - vespa: ペンライト？ 二本！ 両手に一本ずつ！
  - say: 当方は、両手で角でございます。
  - vespa: {face: laugh, text: ペンライト持ったまま角は無理！ 指が足りない！}
  - say: 黙る作法でしたら、クラシックにもございます。楽章と楽章の間には、拍手をしない。今の作法では。
  - say: ただ一七七八年、モーツァルト様の交響曲『パリ』の初演では、最初の楽章の途中で拍手が来まして。そこで来るように、わざと書いた、とお父様へのお手紙に。
  - vespa: {face: surprised, text: 待って。コールの入れどころを作曲家が作ってたってこと！？ モーツァルトさん、アイドルの曲の人だ！}
  - say: アイドルの曲の人ではございません。
  - vespa: じゃあ今度クラシック行ったら、途中で拍手していい？
  - say: 本日の会場の作法に従ってくださいまし。
  - chat: [ピアノ教室の先生, 今それやると隣の人に睨まれるよ]
  - vespa: 睨まれる！ じゃあ黙る！ 落ちサビと同じ！
- title: 締め（縫い終わった法被）
  beats:
  - say: ……はい。縫い終わりました。「ミ」の線は緑で、ふちを黄緑で。
  - vespa: {face: surprised, text: すごい！ 緑のミナミと黄緑のミナミがいる！ エラ、ありがとう！}
  - vespa: お礼にね、次にエラがライブに行くとき、私がリゼの上着を持つ！ いつも後ろで持って観てるんでしょ。エラは前に行って！
  - say: {face: shy, text: ……それは。ありがたく、頂戴いたします。}
  - chat: [武道館二階東, エラちゃん尻尾揺れてる]
  - say: 尾が揺れている、と。……当方の尾は、当方の管轄外でございます。
  - vespa: でも次の公演、まずチケットの方式を見てね！ 整理番号か、指定席か！
  - say: 夢がございませんね。では当方からも。次のミナミ様のチェキ会、当方が付いてまいります。
  - say: 横で、「おつかれさまです」の次の一言を、小声でお教えいたします。
  - vespa: {face: flustered, text: それはやめて！ 絶対もっと緊張する！}
  - chat: [緑ペンラ二年目, 先輩、法被の話をすればいいのに。直してもらったって]
  - vespa: 法被の話……。「法被直してもらったよ」なら、言えるかも。
  - say: 十文字でございます。
  - vespa: 数えないで！
  - chat: [鍵盤を売った, エラも手紙の返事ね]
  - say: ……鍵盤様。それは、また当方の配信で。本日はここまででございます。皆様、ごきげんよう。
  - vespa: 手紙？ 何それ！ ……逃げた！ みんな、おつかれさまでした！ あ、豚まん冷めてる！
