# 二人配信 リゼ×ギャル 001：リゼの部屋に、別のゲーム「Rabbit Run」のギャル（人間・ゲスト）が来た
# 2026-10-27 夜に書いた。形と決まりは src/README.md と scratchpad の duo-spec。ギャルは一人配信を持たないゲスト（src/cast.yaml の guest: true）。
# 2026-10-27 深夜、Codex のレビュー（artifacts/codex/duo-review-gyal/report.md）で直した：ロゴの件は作者の「公開して大丈夫かな」という心配にとどめ、怒られると決めつけない、
#   裁判の講義は一言にしてギャル本人（残った側）の話に、検品は週報どおり「途中から」、センターの理由は自慢してから漏れる形に、四角ボタンの講義をやめて服のブレを生活の掛け合いに、
#   締めの「朝五時がもう一周した」を声に出す、コメントを読んでから返す、投票の集計は常連の票だけの話と分かる形に。
# 本題らしきもの：なぜ Rabbit Run ができたか。ギャルが作者の代弁で舞台裏を明るくばらす（元はテトリス、絵の生成が終わらない、
#   一番早くできたからセンター、最初のキャラなので服がブレた、難しくしすぎて絵を見る暇がなくなった、隠しコマンド、部屋が暑い）。
#   リゼは遊ぶ側（やさしい派、放置好き、テトリス好き）と作る側（ドクロの自作、プログラムを読む、「最初の一人」になりたい）の目でツッコむ。
# メタ：ゲームのキャラがゲーム配信者の部屋に来る。リゼが Rabbit Run を遊ぶと、画面の中のギャルと横のギャルが同じ顔をする。
# 温度差：サキュバスの城に人間が一人（チャットが緊張する、部屋が寒い）と、ギャルの作者の部屋は GPU で暑い。
# 名前：ギャルには名前が無い（ユーザーの指定。ゲームでも「ギャル」と呼ばれているだけ）。重くしない。
# 脇道の共通の話題：ゲームの難易度（fac_difficulty。ask。リゼはやさしい、ギャルは難しい方が燃える）、暑いのと寒いの（season_cold_hot。リゼは寒い方）。
# 内輪ネタ（リゼ）：重複です九件・三分差と朝五時の報告者「その節はどうも」・ねぼすけ一号の十九日・石三千個・ドクロの自作・ルームランナー・emacs のテトリス・ロード中。
# ギャルは別のゲームの全年齢のキャラなので family: true（この回の間、下ネタのコメントには safe_refusal を返す）。性的な冗談は置かない。
# 書かないこと：作者の家族の話、隠しキャラの見た目。作者は名指ししない（「うちの作者」）。隠しコマンドの中身も言わない。
# 出典は src/sources/duo/lise-gyal.md。
title: Rabbit Run のギャルが来た。最初はテトリスだったって本当？
family: true
lobby:
- 今日は、別のゲームの子が遊びに来てるの。人間よ。
- 走るゲームの子なのに、元はテトリスだったんですって。
- 部屋、寒いって言われたわ。石の城だもの。
parts:
- title: 入り（人間のお客さんと、寒い部屋）
  beats:
  - gyal: はいはーい、映ってる？ これ映ってる？
  - lise: 映ってるわ。あなた、カメラに近すぎるの。顔しか映ってない。
  - gyal: {face: laugh, text: 'あ、ほんとだ。おでこデカっ。ウケる。'}
  - chat: [処理落ち愛好会, Rabbit Runの子だ！]
  - gyal: そ！ ウサギ走らせるゲームの、横で応援してる係。今日はリゼちゃんの部屋にお呼ばれ。
  - chat: [規約は同意だけ, え、人間？]
  - gyal: 人間だよー。ガチの人間。角もしっぽもないよ、ほら。
  - lise: 人間のお客さんは初めてなの。チャット、ちょっと静かになったでしょう。
  - chat: [ログボだけ勢, 本物の人間、正座した]
  - gyal: {face: laugh, text: '「正座した」って、正座しないで！ 動物園のパンダじゃん、あたし。'}
  - gyal: てか、この部屋寒くない？ 動いてないと凍る。
  - lise: 石の城だもの。夏でも壁が冷たいの。毛布で解決してるわ。
  - gyal: 一枚ちょうだい。
  - lise: いいわよ。膝のじゃない方ね。
  - chat: [ログボだけ勢, 膝のじゃない方って何枚あるの]
  - lise: 「何枚あるの」ね。三枚よ。膝のは渡さないの。
  - gyal: 一番いいやつ膝じゃん！
- title: 名前はないよ
  beats:
  - chat: [初見のこぐま, ギャルちゃん、名前なんていうの？]
  - lise: 「名前なんていうの」ね。私も聞こうと思ってたの。なんて呼べばいい？
  - gyal: {face: smile, text: '名前？ ないよー。'}
  - lise: ないの。
  - gyal: ないない。作ってるとき、うちの作者が「ギャル」「銀髪」「緑」「大正ロマン」って呼んでて、それがそのまんま残ったの。
  - lise: 私のボットより雑ね。私は番号まで付けたわ。
  - gyal: じゃ、あたし「ギャル一号」でいいよ。
  - lise: {face: annoyed, text: 'やめて。一号は十九日でBANされたの。'}
  - gyal: 縁起わるっ。じゃ、ただのギャルで。
- title: 本題（最初はテトリスだった）
  beats:
  - lise: で、今日聞きたいのはこれ。Rabbit Run、最初はテトリスだったって本当？
  - gyal: {face: smile, text: 'ほんと！ 最初はブロック落とすやつだったの。名前もPOP TETRIS。'}
  - lise: ……テトリスの横で、あなたが応援してたの？
  - gyal: そうそう。その頃も、横で顔が変わる係。
  - lise: それ、私が一番見たかったゲームよ。
  - chat: [処理落ち愛好会, リゼ、emacsでテトリスやってる人だもんね]
  - lise: emacs の中のテトリスね。毎晩積んでるわ。勝手に積む方を入れて、寝てる間もね。
  - gyal: それもう遊んでなくない？ でね、テトリスの方、すぐできちゃったんだって。
  - gyal: うちの作者、試しに遊んだら一時間ふつうに遊んじゃって。「テトリス、完成しすぎてる」って。
  - lise: 1984年から、積んで列を消すところはずっと同じだもの。
  - lise: 一時間遊べるなら、出せばいいじゃない。
  - chat: [レトロゲー老人, POP TETRIS、やりたかったぞ]
  - gyal: 老人さん、それ！ あたしもまたブロックの横で応援したい！
  - gyal: でも、問題はゲームじゃなくて、絵だったの。
- title: 絵の生成が終わらない
  beats:
  - gyal: あたしたちの絵、AIで作ってるんだけど、それが全っ然終わんないの。パソコン三日回しっぱなしで、まだ終わんない。
  - lise: {face: smile, text: '最高の放置ゲーじゃない。'}
  - gyal: {face: laugh, text: 'そこ食いつく！？'}
  - lise: 寝てる間に絵が増えるのよ。理想の仕事。
  - gyal: 8枚作って、ちゃんと使えるの1枚から4枚。顔が別人だったり、足が切れてたり。
  - lise: 8枚引いて、当たりが1枚から4枚。……ガチャね。
  - gyal: マジでガチャ。しかも1枚40秒から60秒。絵を作ってるGPU、10倍速いやつは100万円だって。作者、値段見て泣いてた。
  - lise: 100万円……。石だと何個かしら。
  - chat: [ログボだけ勢, モーラの8000円を石3000個で返した人]
  - gyal: え、石で借金返したの？ ヤバくない？
  - lise: {face: annoyed, text: 'アカウントの中では返したの。……話を戻して。'}
- title: ゲームの方が替わった
  beats:
  - gyal: でね、ロゴまで作った頃にさ、作者が「これ公開して大丈夫かな」って心配になっちゃって。
  - lise: 似せすぎたテトリスで、裁判に負けた例はあるわね。
  - gyal: そうなの。で、ゲームの方をウサギが走るやつに替えたの。あたしは残った！
  - lise: {face: sad, text: '私が遊びたかった方が消えたわ。'}
  - gyal: {face: surprised, text: '本人の前で言う！？'}
  - lise: 私のゲームも、仮のドクロだけ残ったの。
  - gyal: 待って。今あたし、ドクロと同じ枠？
  - lise: 残してって言われた方よ。28人に。
  - gyal: {face: smug, text: 'じゃ、あたしも残して。ほら、遊んでみよ。'}
- title: 選ぶ画面（なんでギャルがセンター）
  beats:
  - lise: 開いたわ。ブラウザでそのまま動くのね。……最初からあなたが選ばれてるのね。
  - chat: [初見のこぐま, なんでギャルちゃんが真ん中なの？選ぶ画面で最初にいるよね]
  - gyal: {face: smug, text: '「なんで真ん中」？ それはね、あたしが主役だから！ 元気で、ポンポン動かしやすいんだって。'}
  - lise: 主役ね。
  - gyal: ……あと、一番早くできたから。
  - lise: じゃあ、選ぶ手間が省けたわ。
  - gyal: {face: annoyed, text: '本人が横にいるんだから、もうちょい悩んで！'}
  - lise: 別の子でもいいの？
  - gyal: あたしで！
  - lise: 一番乗りで主役になれるのね。うらやましいわ。私、バグを9回送って、一回も名前が載らなかったの。
  - chat: [朝五時の報告者, その節はどうも]
  - gyal: {face: surprised, text: '朝五時さんの「その節はどうも」って、これのこと！？'}
  - lise: {face: annoyed, text: '……そうよ。三分差で、朝五時が先だったの。'}
  - gyal: 三分！ おしいじゃん。じゃ、今日はリゼちゃんが一番乗りじゃん。人間を部屋に呼んだサキュバス、一番乗り。
  - chat: [ログボだけ勢, リゼがちょっと嬉しそう]
  - lise: 「嬉しそう」って。ロード中なだけよ。……始めるわ。
- title: リゼが遊ぶ（画面の中のギャルと、横のギャル）
  beats:
  - lise: 始まった。ウサギで壁をよけて、上に進むのね。
  - lise: 画面の右に、あなたがいるわ。……それで、私の右にも、あなたがいるの。
  - gyal: {face: laugh, text: 'ちょ、横も見てよ。本人こっち！'}
  - lise: 道が狭くなってきたわ。
  - gyal: {face: surprised, text: 'あ、待って待って、そこ狭い、右、右！'}
  - lise: 横のあなたの方がうるさいの。
  - chat: [ログボだけ勢, 画面のギャルと横のギャル、同じ顔してる]
  - lise: 「同じ顔してる」ね。本当よ。画面のも横のも、同じ顔で焦ってるわ。
  - lise: ……当たった。
  - gyal: {face: sad, text: 'あー！ 画面のあたし泣いてる。'}
  - lise: 横のあなたも、ちょっと泣いてるわ。
  - gyal: 泣いてないし。もらい泣きだし。
  - gyal: スペースでハンマー！ 画面の壁、全部壊せるの。
  - lise: ……それ、最初に言って。振ったわ。全部、壊れた。楽ね。
  - chat: [RTA走者見習い, ハンマー温存しないの？]
  - lise: 「温存しないの」って、もう振ったわ。今あるものは今使うの。
  - gyal: 曲はヴィヴァルディの四季を、ドラムンベースにしたやつ。走るゲームだもん、急かさないと。
- title: 最初に作られたから、服がブレた
  beats:
  - gyal: ねえ、画面のあたし見て。パーカーのピンク、さっきの絵とちょっと違くない？
  - lise: 違うわね。
  - gyal: 一番早くできたって、いいことばっかじゃないの。最初の頃って、作者も絵の作り方が分かってなくて。同じパーカーのはずなのに、毎回ちょっと違うの。
  - lise: 私なら、着替えたことにするわ。
  - gyal: リゼちゃん、それ洗濯さぼる言い訳にしてない？
  - lise: {face: smug, text: 'してるわ。'}
  - chat: [処理落ち愛好会, リゼの毛布も毎回色ちがくない？]
  - lise: 「毛布の色がちがう」？ ちがわないわ。……洗ってないもの。
  - gyal: {face: surprised, text: 'その毛布、今あたしの膝にあるんだけど！ せめて次来るまでに洗って。'}
  - gyal: ……作者は途中から、8枚ごとに確かめるようにしたんだって。
  - chat: [マカロン百個勢, ギャルだけ表情多いよね]
  - gyal: 「あたしだけ表情多い」？ 気づいた！？ あたしだけ顔が74枚あるの。ほかの子は47とか48とか。
  - gyal: 主役だから、って言いたいけど……たぶん、最初だから作りすぎたんだと思う。
  - lise: 最初の子に張り切るのね。分かるわ。
- title: そういえば（作者の部屋が暑い）
  beats:
  - gyal: あ、そういえばさー、寒いで思い出した。うちの作者の部屋、逆にめっちゃ暑いの。
  - gyal: あたしたちの絵、434枚と小物で一週間。GPUがずっと全力。
  - gyal: そのあとも絵を作ってて、外が14度の日にも床の冷房つけてるって。冬も暖房いらないかも、だって。
  - lise: 絵を作るたびに部屋が暖まるなら、私もやろうかしら。
  - gyal: それ、暖まりたいだけじゃん。……毛布は返さないよ。
  - chat: [処理落ち愛好会, 暑いのと寒いの、どっちがまし？]
  - lise: 暑いのと寒いの？ 寒い方。毛布で解決できるもの。……その毛布、私のよ。
  - gyal: あたしは暑い方！ アイス食べれば勝ちだし。
  - gyal: ……待って、何の話してたっけ。
  - lise: 覚えてないわ。もう一回走るわ。
- title: 難しくしすぎて、絵を見る暇がない
  beats:
  - lise: ねえ、あなたのコース、ずっと落ち着かないわね。曲がり道ばっかり。
  - gyal: あたしのコース、一番せわしないの。ジグザグとか、階段みたいなのとか。性格出てるって言われる。
  - gyal: でもこれ、かなり優しくなったの。作者が「単調すぎない？」って、どんどん難しくしちゃって。
  - gyal: 1マスだけ空いてるとこを、ずーっとよけ続けるコースとか作ってて。
  - gyal: で、自分で遊んでて気づいたんだって。「よけるのに必死で、キャラ見る暇ない」って。
  - lise: {face: smile, text: '分かるわ。今も見られないもの。……だから、隣のあなたを見るわ。こっちは止まってるし。'}
  - gyal: {face: surprised, text: 'ウサギ見て！ またぶつかる！'}
  - lise: 私はいつも「やさしい」で遊ぶの。アシストを使っても、見える景色は同じだもの。
  - gyal: えー、あたしは難しい方が燃えるけどな。
  - lise: 燃える子のコースは、作者が下げたでしょう。
  - gyal: {face: annoyed, text: 'それ言う？'}
  - lise: チャットにも聞くわ。
  - ask:
      who: lise
      q: ゲームの難易度、ふだんどれで遊ぶ？
      options:
      - c: やさしい
        r:
        - lise: '{name}、やさしいのね。いい人よ、あなた。'
        - gyal: リゼちゃん、味方来たら嬉しそうじゃん。
      - c: ふつう
        r:
        - lise: '{name}はふつうね。作り手が一番遊んでほしい所よ。'
        - gyal: ふつうが一番作るの大変なんだって。
      - c: 難しい
        r:
        - gyal: '{name}さん、分かってる！ 燃えるよね！'
        - lise: 燃えて、絵を見る暇がなくなるのね。
      - c: 選ぶ画面で迷う
        r:
        - lise: '{name}、迷うのね。迷ったら、やさしいでいいの。'
        - gyal: あたしは迷ったら難しい方！
      npc:
      - [ログボだけ勢, 0]
      - [RTA走者見習い, 2]
      - [朝五時の報告者, 1]
      - [規約は同意だけ, 3]
      - [レトロゲー老人, 2]
      - [マカロン百個勢, 0]
      - [元・金策業者, 1]
  - lise: 常連は二人ずつね。規約は、まだ選ぶ画面で迷ってるの？
  - chat: [規約は同意だけ, 説明文を読んでる]
  - lise: 規約は読まないのに、説明文は読むのね。
- title: 隠しコマンドと、鍵のない宝箱
  beats:
  - chat: [規約は同意だけ, 隠しコマンドあるってほんと？]
  - lise: 「隠しコマンドある」の。それは聞きたいわ。
  - gyal: あるよー。でも教えなーい。キーボードがいるやつ、とだけ言っとく。
  - lise: 教えなくていいわ。……プログラムを読めば分かるけど。
  - gyal: {face: surprised, text: '読むのナシ！ それズルじゃん。'}
  - gyal: 作者、条件そろえたらもらえるボーナスとかも頑張ったの。……まあ、正直に言うとさ。
  - gyal: GitHub、ゲームのファイルを公開してる所ね。そこを見たら、ご褒美の絵、全部見れちゃうんだけどね。
  - lise: ……全部。
  - gyal: 全部。
  - lise: 鍵のかかってない宝箱を、隠しコマンドで守ってるのね。
  - gyal: {face: laugh, text: 'それ言わないでー！'}
  - chat: [規約は同意だけ, 置き場所のぞいてきた]
  - lise: {face: annoyed, text: '「置き場所のぞいてきた」って、規約、早いわ。……私も、あとで見るだけ見るわ。'}
  - gyal: 今「寝る前に見る」声した！ 見る前に一周走って！ 取ったときのあたし、一番いい顔するから。
  - lise: ……一周ね。寝る前に。
- title: 締め（ルームランナーと、また来る）
  beats:
  - gyal: リゼちゃん、走るの嫌いっしょ。
  - lise: 嫌いよ。前に、歩きながらゲームしたくてルームランナーを買ったの。三日で物干しになったわ。
  - gyal: {face: laugh, text: '三日！？ 物干しの方が長続きしてんじゃん！'}
  - lise: でも、ウサギが走ってくれるなら、私は座ってていいでしょう。
  - chat: [朝五時の報告者, 一周三分くらいですね。今計りました]
  - gyal: 朝五時さん、もう一周したの？ はや！ 一番乗りじゃん。
  - lise: {face: annoyed, text: 'また一番乗りを取られたわ。今日も朝五時に。'}
  - chat: [朝五時の報告者, その節はどうも]
  - lise: 今日の節は、今日の分よ。
  - gyal: リゼちゃん、またやろ。今度はボツになったテトリスの方の話もしよ。
  - lise: いいわ。ボツになったテトリス、私が一番遊びたいもの。
  - gyal: じゃあ、また来るね。寒いから、次は毛布もう一枚出しといて。
  - lise: 膝のじゃない方ね。
  - gyal: みんな、ありがとー！ ウサギ、走らせてあげてね。
  - lise: おつかれさま。私はこれから、目を閉じて遊ぶわ。

