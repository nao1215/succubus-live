    kinoko_takenoko: たけのこ
  cases:
  - if:
      mem:
        kinoko_takenoko: きのこ
    alts:
    - - Wait, weren't you team Kinoko before?! Welcome over!
  alts:
  - - Team Takenoko! A comrade!
  - - Takenoko! I get it! So crunchy!
