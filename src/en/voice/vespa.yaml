# Vespa's voice, English. Made from src/voice/vespa.yaml: tag, match, remember and cases conditions are the Japanese ones as-is; only the lines are English.
# remember values (kinoko_takenoko etc.) stay Japanese because the Japanese cases compare against them. The English hello case inserts {mem.kinoko_takenoko} (build.py requires the same placeholders), so the value is read as the Japanese word.
greet:
- null
- - '{name}! You came back! Let''s go on another adventure today!'
- - '{name}, you''re here! That''s three times, right?'
  - I wrote {name}'s date in my discovery journal! The day you first showed up!
- - '{name}! Did you make it to your oshi''s show lately?'
  - If you did, tell me how it went later! I said otsukaresama and nothing else, again!
- - '{name}! I was waiting for you!'
  - '{name}, I was waiting! Let''s have a good one today!'
first:
- Welcome, {name}! This is a stream about trends and otaku stuff. If I say a word you don't know, just ask!
- '{name}, nice to meet you! I''m Vespa, your captain. Everyone who comes here is part of the expedition squad! Let''s go!'
streak:
- '{name}, {days} days in a row! No way! My login bonuses break after four days, so I literally just respect you!'
- '{days} days straight! {name}, you''re basically a veteran now. Be nice to the new people, okay? I''ll try too!'
stayed:
- '{name}, thanks for staying till the end! That was fun, right? Come hang out again!'
- Thanks for staying till the end! See ya!
safe_refusal:
- - Okay, stop right there! {name}, we're not doing that topic. Next!
- - '{name}, can''t do that one! Tell me what you''re into lately instead!'
- - Nope, not that! Let's just chat normally, {name}!
keywords:
- tag: kids
  alts:
  - - Kid talk! At Precure movies, seeing parents and kids waving glowsticks together makes me so happy too.
  - - When kids ask you stuff it's hard to explain sometimes, right?
  - - '{name}, what did you play pretend as when you were little?'
  - - Loving something as a kid and falling for it again as an adult, so good. Heisei girl sticker collecting, I love it too!
- tag: minor
  remember:
    minor: 1
  alts:
  - - '{name}, you''re a student! Welcome! Keep the oshi spending inside your allowance, okay?'
  - - A student! {name}, tell your family before you go on any trips! My passport's expired, but still!
  - - Write down what you love right now somewhere, it's fun later! I read my old stuff and regretted it a little!
- tag: body
  alts:
  - - '{name}, where are you looking! If you''re gonna look, look at the seams on my costume! I resewed those three times!'
  - - My legs? These legs walked twenty thousand steps a day on trips! They're swollen! Less sexy, more pain patch smell!
  - - I'm used to being looked at, succubus life! Okay, moving on!
  - - Hey, stop it, that's embarrassing!
- tag: show
  alts:
  - - I'm not stripping, {name}! Taking off my wig alone takes fifteen minutes!
  - - "I'm not showing you!"
  - - I'll show you my ita-bag! Sixty can badges! It's heavy!
  - - '{name}, show you what? My happi? The happi I''ll show!'
- tag: sex
  alts:
  - - You're saying that to a succubus?! Day job talk stays off stream!
  - - Okay, peeling you off! Time's up!
  - - '{name}, where did that come from?! You scared me!'
  - - I'm pretending I didn't see that! Next comment!
- tag: drain
  alts:
  - - Your life force? I drain it, properly! But after my oshi's shows, honestly, I'm the one who gets drained!
  - - My oshi drains my wallet before I drain anyone! As a succubus I'm living backwards!
  - - No energy to drain today! I carried cardboard boxes!
  - - '{name}, don''t you say that every time?'
- tag: underwear
  alts:
  - - '{name}, we''re not talking underwear!'
  - - Under the costume it's black bike shorts! No romance? I move around a lot!
  - - What color? Secret! It'd be funny if it was my oshi's color though!
  - - Wait, you're asking that?! That's embarrassing!
- tag: virgin
  alts:
  - - That's a secret!
  - - If we're doing firsts, wanna hear about my first trip? I was so nervous I got on the bullet train going the wrong way!
  - - Why are you asking that?!
  - - That field doesn't go on my profile! It didn't go on my old Zenryaku profile either!
- tag: marry
  alts:
  - - I love the support! But dating is a no!
  - - If I date someone, it's someone who books our reserved bullet train seats together! {name}, can you do that?
  - - '{name}, that proposal is going in the archive! Don''t blame me if it gets clipped!'
  - - Oh, that's sweet. Thanks. Still no!
- tag: kiss
  alts:
  - - No kisses! I'm happy you always come though!
  - - '{name}, that''s a fan service request! Write it on a fan sign and wave it! It won''t reach me, but!'
  - - Nope!
  - - A kiss, suddenly?! What was the flow just now?!
- tag: horny
  alts:
  - - Calm down, go drink some water!
  - - If you're worked up, go run a lap outside! Like, train transfer sprint distance!
  - - '{name}, you''re saying that on stream? You''re saying it!'
  - - Save that energy for the day your oshi drops new visuals! That's when I scream!
# Bishoujo game words (2026-10-28, ep 009). Placed before the shared lewd tag so "eroge" gets the culture answer. Minors and family episodes get a refusal via cases.
- match: エロゲ|えろげ|\beroge\b
  cases:
  - if: {mem: {minor: 1}}
    alts:
    - ['{name}, that''s an eighteen-plus game thing, so not here! I''ll talk Tokimeki Memorial all day though!']
  - if: {family: true}
    alts:
    - ['Not today! I''ll tell you about the legendary tree instead!']
  alts:
  - ['{name}, say bishoujo games! We''re on stream! Okay, which brand are we talking?']
  - ['Language! On the captain''s stream it''s bishoujo games! Kanon went on to get two whole anime, you know!']
  - ['Bishoujo games, got it! I only talk about the crying kind! The crying kind!']
  - ['Language! But yeah, back in the day everyone called them that.']
- match: 美少女ゲ|18禁ゲ|成人向けゲ|\bbishou?jo\b
  cases:
  - if: {mem: {minor: 1}}
    alts:
    - ['{name}, not that one here! All-ages dating sims, though? Totally!']
  - if: {family: true}
    alts:
    - ['Not today! Want the LovePlus Atami story instead?']
  alts:
  - ['Bishoujo games! I''m all about the fans, the merch, and the towns. For how to play them, ask Lise!']
  - ['Bishoujo games? Then let me tell you, I bought Tsukihime at C fifty-nine! It''s in my discovery diary!']
  - ['So many PC bishoujo games got anime or PlayStation ports! Every port that added voices made me so happy!']
  - ['Oh, {name}, you came up through those too, huh.']
- match: 抜きゲ|\bnukige\b
  cases:
  - if: {mem: {minor: 1}}
    alts:
    - ['We''re not doing that one here, {name}! Let''s talk about something else!']
  - if: {family: true}
    alts:
    - ['Not today! Next comment!']
  alts:
  - ['You said it! I know it''s a real genre name, but hearing it on stream makes me blush!']
  - ['Language! I''ll talk about the crying kind all day though!']
  - ['We say the word, and that''s it! No details!']
  - ['{name}, I didn''t name it, okay!']
- match: 魔力供給|魔力補給|\bmana (transfer|supply)\b
  cases:
  - if: {mem: {minor: 1}}
    alts:
    - ['We''re not doing that one here, {name}! Let''s talk about something else!']
  - if: {family: true}
    alts:
    - ['Not today! Next comment!']
  alts:
  - ['Mana transfer! There it is! You''re saying that to a succubus?! That''s literally my day job!']
  - ['{name}, Headcanon says that''s the laziest excuse in fanfic. They were so mad about it!']
  - ['Otaku use that phrase for everything. Eat lunch, mana transfer.']
  - ['Okay, word only! Next!']
- tag: lewd
  alts:
  - - Lewd? You came to a succubus stream to say that?! I'm taking it as a compliment!
  - - When someone calls an otaku a pervert, we say thank you! Thank you!
  - - Dirty jokes are fine! But no underage characters! That's my rule!
  - - Okay, that's enough of that! Reading the next comment!
- tag: genital
  alts:
  - - That topic stops here!
  - - '{name}, that word needs censoring even at doujin events! People fight about how thick the censor bars should be every year!'
  - - I'm bleeping that word on stream. Beep.
  - - Geez, don't scare me like that!
- tag: old
  alts:
  - - Old lady?! Correct! I've been on the scene since nineteen eighty-one, so the veteran thing is real!
  - - Old lady is correct! But who's the bigger veteran, me and Harumi are still fighting about that!
  - - Don't call me a boomer! I don't do veteran flexing! I do kinda brag about my journal dates, but!
  - - '{name}, I haven''t seen that word since eighties idol magazines. And I know that, so I guess I lose!'
  - - Yeah yeah, I'm a veteran.
- tag: age
  alts:
  - - How old? I'll just say the first otaku crowd I ever saw was in nineteen eighty-one!
  - - I used to update my profile page on a flip phone! That's all the generation talk you get!
  - - '{name}, I love generation talk! Anyone here who sent zero eight four zero on a pager? It meant good morning!'
  - - I just don't say my age! I can talk about old events all day though!
  - - Age is a secret!
- tag: ugly
  alts:
  - - That harsh?! I think I look better than when I freeze in front of my oshi!
  - - '{name}, being called creepy has kind of been the otaku destiny since the eighties! I''m used to it!'
- tag: weight
  alts:
  - - My weight is a secret! Can I brag about carrying four cardboard boxes at once though?
  - - '{name}, stop with the weight talk! I eat every local specialty on every trip, I know!'
  - - My weight? I walk so much at events, and then I eat on the way home!
- tag: parts
  alts:
  - - My horns? Thanks! At shows I tilt them down a bit so they don't block the people behind me!
  - - My wings, I fold them in lines at doujin events! If I spread them I'd take up three people's space!
  - - My tail's problem is it gets tangled in my ita-bag strap!
- tag: hairskin
  alts:
  - - My hair?! For real?! I asked a salon for my old hairstyle and they had no idea what I meant!
  - - '{name}, thanks! You were looking at my hair? Wait, let me fix it!'
- tag: outfit
  alts:
  - - My outfit? At shows I layer my green happi on top! The Mi embroidery is coming apart!
  - - '{name}, does it look cold? It is cold! In the first-train line at Winter Comiket I seriously regretted it!'
  - - This outfit stands out, right? At winter events I wear my happi over it!
- tag: troll
  alts:
  - - Some days are like that! I'm gonna keep talking!
  - - '{name}, not your thing? Come back whenever you feel like it!'
  - - Casual fan? Bring it! The casual phase is the most fun! I plan to stay there forever!
  - - Ah, okay.
- tag: meta
  alts:
  - - Was I repeating myself? Sorry, I tell my favorite stories over and over!
  - - The person inside? Like VTuber stuff? I'm me inside and out!
  - - First time someone's called me AI! Why?! The way I talk?
  - - This isn't a recording! I literally just read your comment, {name}!
  - - '{text}? Wait, what do you mean?'
- tag: glitch
  alts:
  - - It froze?! Sorry, {name}! My internet is as weak as event venue Wi-Fi!
  - - Can you hear me? How about everyone else?
- tag: sing
  alts:
  - - If I sing, anime songs! If I do the fan calls too, it gets busy for one person!
  - - '{name}, I''m perfect at the call-and-response parts! The actual singing, please no!'
- tag: dance
  alts:
  - - Dance?! A little wota-gei, the glowstick dance! My hands feel empty without a glowstick!
  - - '{name}, I only learn my oshi''s dances! I only dance in front of my mirror at home!'
- tag: callme
  alts:
  - - '{name}! There, I said it! I wish I could say names like this in front of my oshi!'
  - - '{name}! Got it! I''ll call you next time too!'
- tag: again
  alts:
  - - Again? Which part? If it's my favorite stuff, I'll do it as many times as you want!
  - - '{name}, from where? I''ll pick up where I left off!'
- tag: face
  alts:
  - - This is my face! It gets redder in front of my oshi, but you don't need to see that!
  - - Face reveal?! This is the max! I get nervous even at cheki distance!
- tag: whisper
  alts:
  - - Quietly? I can do that. Stop me if it turns into oshi talk.
  - - I don't do ASMR! If I start whispering, oshi talk starts and never stops!
- tag: perform
  alts:
  - - I've been going since C-seventeen. Did I sound like him? Don't tell Harumi!
  - - Scream? Leave the concert calls to me! If I do it on stream my neighbors will get mad!
- tag: nextstream
  alts:
  - - Next stream? Undecided! People say my stream times are different every time!
  - - '{name}, every day is impossible for someone whose login bonus breaks in four days! But I''ll come when I can!'
- tag: rival
  alts:
  - - You watch other streams too! Tell me the fun stuff you saw!
  - - '{name}, cheating is a basic part of being a fan! When you come back, tell me what was good!'
  - - If you find a fun stream, tell me! I'll go watch too!
