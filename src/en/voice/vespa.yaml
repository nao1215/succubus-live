- tag: nicevoice
  alts:
  - - My voice?! For real?! Say more! This voice never comes out in front of my oshi, though!
  - - '{name}, thanks! This voice was trained doing line control at my part-time job!'
- tag: love
  alts:
  - - Oh, thanks! Oh, right, there's this place I wanna go! Wait, did you notice I just changed the subject?
  - - '{name}, you''re a fan?! I''m so happy! I''m remembering today''s date!'
  - - Turns out when a fan has a real crush on me, I just get shy and can't do anything! Thanks!
- tag: cute
  alts:
  - - You complimented me?! For real?! Thank you!
  - - Thank you, {name}! You complimented me, so I'm adding one extra detour today!
# Bishoujo games and galge culture (2026-10-28, ep 009). How to play is Lise's lane; Vespa answers from the fans, towns, ports, and anime side.
- match: ギャルゲ|\bgalge\b|\bgal ?games?\b|恋愛シミュ|恋愛ゲ|\bdating sims?\b
  alts:
  - ['Galge! Games about getting close to cute girls. {name}, who was your favorite?']
  - ['In America people sometimes call them dating sims! Ohio taught me that!']
  - ['Strategy talk goes to Lise''s stream! I''m on merch and fandom duty!']
  - ['Same!']
- match: ときメモ|ときめきメモリアル|伝説の樹|藤崎詩織|虹野|\btokimeki\b|\btokimemo\b
  alts:
  - ['The legendary tree! A girl confesses to you under it at graduation, happy forever! Me? I''d say otsukaresama!']
  - ['Tokimeki Memorial, nineteen ninety-four, on the PC Engine! My girl is Saki Nijino! {name}, yours?']
  - ['In ninety-six Shiori Fujisaki put out a CD under her character name. That''s a virtual idol way before VTubers!']
  - ['The Switch Tokimeki has a feature where they say your name, and I still haven''t set it up!']
- match: ラブプラス|\blove ?plus\b|姉ヶ崎|寧々さん|高嶺愛花|小早川凛子
  alts:
  - ['LovePlus! In twenty-ten, the whole town of Atami welcomed players and their girlfriends! Two futons!']
  - ['The Atami stamp rally, I got five out of six! Because I was busy measuring the stone stairs!']
  - ['My girlfriend is still inside my DS. I haven''t visited her in sixteen years.']
  - ['You visit her every day, right? My login streaks die in four days. Hardest game ever!']
- match: 泣きゲ|\bnakige\b|鍵っ子|鳥の詩|tori no uta|CLANNAD|クラナド|\bKanon\b|Key作品|Key ?のAIR|key'?s AIR|『AIR』|(?<!macbook )(?<!macbook)AIR ?の|(?<!macbook )(?<!macbook)AIR ?は|AIR好き|AIR is art
  alts:
  - ['Nakige! I watched the AIR finale kneeling, and after, my legs were too numb to stand!']
  - ['Tori no Uta! My friend stands up when she queues it at karaoke! I stand too!']
  - ['When Kanon went to the Dreamcast, it got voices! Everyone except the main guy!']
  - ['Clannad is life! I just wanted to say it!']
  - ['They really get you.']
- match: ノベルゲ|ビジュアルノベル|サウンドノベル|\bvisual novels?\b|\bVN\b|月姫|tsukihime|型月|TYPE-MOON|typemoon|Fate/|fate stay|fate zero|\bFGO\b|stay night|ひぐらし|higurashi|うみねこ|umineko|同人ゲ|『Fate』|Fate ?の|Fate ?は|Fate好き|fate is literature
  alts:
  - ['Tsukihime, C fifty-nine, winter two thousand! A doujin game that went pro and led to Fate! So proud!']
  - ['Higurashi came out one chapter per Comiket too! You''d wait until the next Comiket for the next part!']
  - ['Visual novel works in English too! VN for short!']
  - ['Fate! {name}, did you start with FGO? People selling doujin games at Comiket got all the way there!']
  - ['I waited thirteen years for the Tsukihime remake! Waiting I can do. Keeping up is the problem!']
- match: おつかれさまの人|認知(?!症)|チェキ会|特典会|握手会|お話し会|ヨントン|ミーグリ|meet ?and ?greet|fansign
  alts:
  - - That topic?! So, my oshi calls me the otsukaresama person!
  - - At a cheki event you take one photo together and get to talk a tiny bit! Like thirty seconds! {name}, what do you talk about?
  - - The first handshake events were thrown together on long meeting tables! Back in twenty-oh-five! I love this story!
  - - '{name}, at an online talk event my Wi-Fi died right as I spoke! My face froze for thirty seconds!'
- match: はがし|剥がし
  alts:
  - - A peeler, hagashi, is the person who gently pulls fans away when time's up! I do it at my part-time job. I get told I'm too slow!
  - - '{name}, the trick to peeling is not grabbing the shoulder! Hand lightly on the upper back, time''s up! And I can never say the time''s up part!'
  - - Peeling talk! When time's up you're like, but I haven't said it yet!
- match: 発見日誌|古参|最古参|初見から|デビューから
  alts:
  - - If we're talking veterans, I write down the day I first saw someone in a notebook!
  - - Veteran or newbie doesn't matter! Be nice to first-timers! I'll try too!
  - - I've been watching since the tiny multi-group show days!
- match: (?<!乃木)(?<!欅)(?<!櫻)(?<!日向)坂(?!道)|傾斜|角度
  alts:
  - - Hills?! {name}, are we doing hill talk?! I measure anime pilgrimage hills with my phone! Anime makes hills steeper!
  - - Hill talk! When I measured it, it wasn't as steep as in the anime!
  - - '{name}, will you read my Slope Book? Twenty-two people have read it! I want strangers to read it too!'
- match: 緑|黄緑|メンカラ|ペンライト|ペンラ|サイリウム|キンブレ|法被|はっぴ
  alts:
  - - Green! My oshi's color! It suddenly became yellow-green in twenty-eighteen, but I still wave green! Yellow-green is green family!
  - - You're bringing that up to me, in my green happi?! Apparently fans in the eighties wore happi too!
  - - You match your glowstick to your oshi's member color! When everyone sways during a ballad, it's so pretty!
- match: 入金|支払い|払い込み|期限|締切|しめきり|deadline
  alts:
  - - Stop with the deadline talk! I once slept through the payment deadline for a ticket I won!
  - - '{name}, how many alarms do you set? I set seven! The seventh one is called The Last Line of Defense!'
  - - Doujin print deadlines, I usually notice the night before! I've missed the early-bird discount three times!
- match: バイト|物販|最後尾|設営|列整理|staff
  alts:
  - - I've done merch booth part-time for five years! I'm proud I can carry four cardboard boxes at once!
  - - Part-time job talk?! I once held the end-of-line sign upside down, you know!
  - - I'm not allowed to work my oshi's events! I did once without knowing and watched from the back as her towels sold out!
- match: コミケ|コミックマーケット|comiket|comic market|夏コミ|冬コミ|ビッグサイト|big sight|C109|C108
  alts:
  - - Comiket! The first one was nineteen seventy-five, in a meeting room, thirty-two circles, {name}! Now it's over a hundred thousand people a day!
  - - '{name}, there are no customers at Comiket! Sellers, buyers, staff, everyone''s a participant! I love that!'
  - - Winter C-one-oh-nine is three days! First time in eight years! And I booked my hotel on stream! For real this time!
  - - Comiket, huh. My books got soaked in the rain in summer, still salty! Next time I'm bringing proper bags!
- match: 晴海|幕張|有明|見本誌|壁サークル|島中|誕生日席|シャッター前
