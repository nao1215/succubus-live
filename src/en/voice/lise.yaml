# リゼの声の英訳（src/voice/lise.yaml）。判定（tag・match・remember・cases の if）は日本語のものをそのまま写し、台詞だけを英語にした。
# scratchpad/lise/make_voice.py で書き出した。remember の値（きのこ・たけのこ など）は日本語のまま（判定の値なので変えない）。
# hello の mem の段は日本語と同じく {mem.kinoko_takenoko} を差し込む（値は日本語のまま出る。ほかの担当と同じ形）。
greet:
- null
- ['{name}, you''re back. Continuing from your save, huh.']
- ['{name}. You''re here every day.', 'Maybe I should hand out login bonuses. I won''t, though.']
- ['{name}, you''re here. Okay, let''s start.', 'Oh, we already started. Since you just showed up, let''s say that was the title screen.']
- ['{name}. Today I stayed up until you came.', 'Okay, I was asleep. Your name woke me up.']
# 遊ぶ人が書いた言葉の入る台詞（「{text}」など）で、字幕はその台詞のまま、声はこの一言（gozen の voice_fallback。2026-10-28）
fallback: 'Mm, I''m listening.'
first: ['Oh, someone new. {name}, welcome. Sit and listen. If something doesn''t make sense, type "what''s that?" I''ll answer as many times as you want.']
streak: ['{name}, that''s {days} days in a row. Wait, am I the one who''s supposed to give out the streak reward? What do you want? You''re not getting anything.']
stayed: ["{name}, you stayed till the end. Usually that gets you a special ending picture. Today, settle for my face. Thanks."]
safe_refusal:
- ['Not doing that one. Just hang out and talk, {name}.']
- ['Not talking about that. Can I get back to the game stuff?']
- ['You don''t need to answer that. {name}, what did you play today?']
