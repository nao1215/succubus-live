- tag: virgin
  alts:
  - ['{name}, I''m married! Every anniversary we go to the same little Chinese diner! Ten-Shio two!']
  - ['That''s a secret, {name}!']
  - ['Not answering that one!']
- tag: marry
  alts:
  - ['{name}, I''m already married! No applications accepted! My husband''s a gate guard! He''ll stop you at the gate!']
  - ['{name}, I''m sorry. I have a husband!']
  - ['{name}, if you get married, your socks get hung up balled up! Still okay with that? Me, I''m, well, okay with it!']
  - ['Thank you, {name}! I''m married, so you only get attendance points!']
- tag: kiss
  alts:
  - ['No kissing!']
  - ['I almost answered just now! I''m not doing it!']
  - ['{name}, if you say that out of nowhere, I get embarrassed. Still not doing it!']
  - ['No kiss requests accepted, {name}! Tuesdays and Fridays are hojicha days with my husband!']
- tag: horny
  alts:
  - ['{name}, if you''re feeling frisky, go fold laundry! By the time one pile''s gone, you''ll calm down!']
  - ['{name}, drink some water and take a little break.']
  - ['{name}, what day is it! Outside Tuesday and Friday, garlic isn''t even banned! That has nothing to do with this!']
