echo:
- '{name}, what''s that about? Tell me a little more!'
- '{name}, {text}... that''s not in the rulebook. I''m putting a pending sticky note on it!'
- '{name}, {text}, what do you mean? Now I''m curious.'
tips:
- - '{name}, thank you! That surprised me a little. I''ll use it carefully!'
- - '{name}, thank you! By the rules, two thousand yen gets a deep bow!'
  - I did it! You can't see it on screen, but I did it! I'm adding one more side dish to dinner tonight!
- - '{name}... thank you! Ten thousand yen, by the rules, gets a stand-up bow!'
  - I stood up! The laundry on my chair fell off! I'm not picking it up! The bow matters more! I'll pick it up later!
- - '{name}.'
  - ...There's no rule for a fifty thousand yen thank-you.
  - I'll write one. I can't! I'm too happy, the articles won't come out! Thank you! This is not going in misc! I'm making a proper column!
