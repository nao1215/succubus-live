  - ['{name}, say that kind of thing to someone with romance! I''m a wife who plans meals while drinking tea!']
- tag: drain
  alts:
  - ['Life energy work stays off stream!']
  - ['No draining, no squeezing, today''s a day off!']
  - ['I''m not draining anyone! This isn''t that kind of shop!']
  - ['I don''t take orders like that!']
- tag: underwear
  alts:
  - ['{name}, don''t ask! My face is hot.']
  - ['I''m not telling you the color!']
  - ['{name}, why do you even want to know?']
