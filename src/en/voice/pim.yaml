  - ['More than that, I want to decide dinner tonight!']
  - ['Don''t look there! Look at my face! My face!']
  - ['{name}, if we''re doing that, I''m telling the story of my husband getting the day wrong! He brought two teas on a Wednesday!']
  - ['That''s a mark from oil splatter. It hurts, you know!']
  - ['{name}, what''s gotten into you! That''s embarrassing, stop it.']
- tag: show
  alts:
  - ['I''m not showing you!']
  - ['{name}, are you serious right now?']
  - ['The most I''ll show you is the meal plan on the fridge, {name}! The one my husband doesn''t read either!']
  - ['Not taking anything off! That request is closed.']
