# Pim's voice, English. Same structure as src/voice/pim.yaml: match / tag / remember / cases are copied as-is; only the lines are English.
# remember values stay Japanese (shared memory with the Japanese side). The one {mem.kinoko_takenoko} in hello prints that Japanese value (build.py requires the same slots as Japanese).
greet:
- null
- - '{name}, you''re marked present!'
- - '{name}, you came back! Welcome welcome! Today''s about home stuff again!'
- - '{name}, present! Welcome back!'
  - You've been coming a lot lately! I'm so happy!
- - '{name}! Roll call... I don''t even need to check!'
  - ...Correction! I will check! {name}, present! Thank you, always!
# 遊ぶ人が書いた言葉の入る台詞（「{text}」など）で、字幕はその台詞のまま、声はこの一言（gozen の voice_fallback。2026-10-28）
fallback: 'I''m curious! Tell me more!'
first:
- '{name}, nice to meet you! You''re marked present! I wrote you on the newest line of the roster!'
- Welcome, {name}! This is a stream about home life! Kids, husband, budget, and little neighborhood Chinese diners! If a word confuses you, just ask!
streak:
- '{name}, that''s {days} days of attendance in a row! I''m writing a perfect attendance rule right now!'
- '{days} days straight, {name}! I''m so happy! Don''t push yourself, okay?'
stayed:
- '{name}, thank you for staying till the end! You''re getting a gold star on the roster!'
- '{name}, you stayed all the way! Thank you! Go have some tea and rest!'
safe_refusal:
- ['{name}, I''m not doing that one. Let''s just talk normally.']
- ['Not talking about that. {name}, what did you do today?']
- ['{name}, that''s not for here. Tell me about something else!']
keywords:
- match: '子ども|子供|こども|娘|息子|育児|子育て|ミミ(?!ズ)|イヤイヤ期|赤ちゃん|赤ん坊|乳児|幼児|\btoddlers?\b|\bkids?\b|\bbaby\b|parenting'
  alts:
  - ['Kid talk, {name}! My Mimi''s current job is finding contradictions in the House Rulebook! She says Article Five and Article Nine are fighting!']
  - ['With kids, you can decide stuff, and it never goes the way you decided!']
  - ['{name}, tell me about your house! Stories from you guys, my co-teachers, help the most!']
- match: '寝かしつけ|夜泣き|昼寝|添い寝|ねんトレ|寝ない|\bsleep training'
  alts:
  - ['Bedtime took forever at our place!']
  - ['Ours just started sleeping one day! No idea when!']
  - ['On the nights they won''t sleep, you keep checking the clock, right?']
- match: '授乳|母乳|ミルク|粉ミルク'
  alts:
  - ['Feeding time, good work, {name}. Did you get to sit down at all?']
  - ['{name}, are you typing one-handed? Take your time replying.']
  - ['Night feeds, when the sky starts getting light, you kind of want to cry, right?']
- match: '離乳食|\bweaning'
  alts:
  - ['{name}, we did one new food a day, weekday mornings only! My husband gave her three at once on a Saturday! It was the kiwi!']
  - ['Baby food, some days you make it and they won''t eat it, right? At our place the floor ate the most!']
- match: 'はちみつ|ハチミツ|蜂蜜'
  alts:
  - ['No honey until they turn one, {name}. It''s on the health center handout too.']
  - ['{name}, my mother-in-law almost put honey in my baby''s warm water once. I stopped her. It was awkward.']
- match: 'おむつ|オムツ|\bdiapers?\b'
  alts:
  - ['{name}, our daycare wants a name on every single diaper! When the stamp smudges, Mimi turns into Mi-three!']
  - ['When they size up, you always have leftover diapers, right? We still have a pack in the closet!']
- match: '保育園|幼稚園|保活|連絡帳|お迎え|送り迎え|役員|PTA|保護者会|運動会|お遊戯会|名前付け|お名前'
  alts:
  - ['{name}, the parent committee got decided by rock paper scissors! I threw the warm-up rock for real! Solo loss! Everyone gave me kind applause!']
  - ['I reread the daycare notebook twice before I hand it in, {name}! Because once I wrote complaints about my husband in it!']
  - ['{name}, names go top right, hiragana, black! My husband wrote it on the back of her gym shirt in big katakana! A jersey!']
  - ['Daycare stuff, there''s so much, right? I wrote a twelve page committee handover and got told it was way too long!']
- match: 'お熱|発熱|熱が出|病児保育|呼び出し|お迎え要請'
  alts:
  - ['{name}, the daycare always calls while I''m frying something! Ours calls at thirty-seven point five Celsius!']
  - ['Fever days are rough, {name}! Try putting your partner at the top of the contact list! It might just come to you second, though!']
- match: '言い間違い|とうもころし|えべれーたー|成長|大きくなっ|手を離|反抗期'
  alts:
  - ['{name}, our tomokoroshi, her word for corn, retired on August third! No farewell game! I''m so glad I wrote it down!']
  - ['Growing up is lonely, {name}! But I put it in the rulebook! If you get lonely, tell senpai! My husband is not allowed to read it!']
- match: '児童手当|無償化|副食費|給食費|学資|教育費'
  alts:
  - ['{name}, since October twenty twenty-four, child allowance comes six times a year, every even month! Rewriting my ledger rules took two hours!']
  - ['I thought it was all free, and then the bill for the side dishes came!']
- match: '育休|産休|ワンオペ|子持ち様|時短勤務'
  alts:
  - ['On solo parenting days, everyone in chat is my co-teacher, {name}! Thank you in advance!']
  - ['{name}, before anyone calls me Her Majesty the Parent, I''ve already said it to myself three times! The real problem is the empty slots on the shift chart!']
  - ['{name}, don''t push yourself. If you just want someone to listen, I''m always here. Even if you listen muted, you count as present.']
- tag: kids
  alts:
  - ['{name}, talking about your kids? Tell me! Something happens every day at our house too!']
  - ['Every day''s a lot at your house too, huh, {name}! This morning one of our socks was missing!']
- tag: minor
  remember: {minor: 1}
  alts:
  - ['{name}, you''re a student! You''re marked present! Watch after your homework''s done, okay?']
  - ['{name}, so young! When I was a student, I could never pack my textbooks the night before!']
  - ['{name}, students, don''t cut into your sleep! I do! I''m a bad example!']
- tag: body
