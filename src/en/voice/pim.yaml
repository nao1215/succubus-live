- tag: lewd
  alts:
  - ['{name}, no dirty jokes here! I can tell you how to brew hojicha instead!']
  - ['{name}, I''m not answering that.']
  - ['{name}, I''m pretending I didn''t hear that!']
  - ['Huh. Um, I''m not talking about that!']
- tag: genital
  alts:
  - ['{name}, in the rulebook, that word goes in the censored chapter! I''m closing the whole chapter!']
  - ['{name}, I just let that go by like I''m frying karaage! Sizzle!']
  - ['I''m not reading that word!']
  - ['{name}, what exactly were you going for with that?']
- tag: old
  alts:
  - ['Auntie is correct! But here, call me Pim, please! At daycare I''m Mimi''s mom forever!']
  - ['{name}? I''ve memorized that nickname! Memorize my actual name too!']
  - ['I admit there are too many rules! My daughter told me too! When I talked about cutting some, I added another article!']
  - ['Even my husband has never brought up my age! If he did, he''d probably be sitting in seiza!']
  - ['Yep, I heard you!']
- tag: age
  alts:
