  - say: "Komeda over Tully's? I've never been. It's the cozy diner-style coffee chain, right? What's good about it?"
  - chat: [night_shift_survivor, "you can nap on the sofas"]
  - say: "You can nap on the sofas. ...Are the neighbors farther away than at Tully's?"
  - chat: [night_shift_survivor, "farther. theres walls too"]
  - say: "Farther, and there's walls. Okay, I kind of want to go."
  - chat: [second_year_dev, "mornings you get free toast and a boiled egg with your coffee"]
  - say: "Wait, the morning set comes with a boiled egg? For free with the drink? I need to know. How many minutes do they boil it."
  - chat: [rtos_veteran_15y, "some locations do soft boiled"]
  - say: "Some do soft-boiled? In winter the water's colder, so even the same time changes it."
  - chat: [lag_appreciation_club, "go ask them"]
  - say: "Go ask them? I can't. I can't talk to staff."
  - chat: [kernel_reader, "then how do you order"]
  - say: "How do I order? I point at the menu. ...I want a place where pointing works."
  - chat: [night_shift_survivor, "i want a komeda shiro noir"]
  - chat: [lag_appreciation_club, "dont say that at midnight"]
  - say: "Shiro-Noir. Warm Danish with soft serve on top. ...Don't say that at midnight. Okay, that's it for tonight. Thanks, everyone who's awake."
  - say: "Good night."
