generic:
  safe_refusal: [["{name}, we don't talk about that here. Let's just chat like normal."]]
  first: ['First time here, {name}? Make yourself at home.']
  streak: ['{name}, that is {days} days in a row. I see you.']
  stayed: ['{name}, you stayed till the end. Thank you.']
  greet:
  - null
  - ['{name}, you came back.']
  - ['{name}, thanks for always being here.']
  - ['{name}, I was waiting for you.']
  - ['{name}. It doesn''t feel like the stream''s started till you show up.']
  keywords:
  - match: おは|good morning|morning
    say: ['Morning, {name}.']
  - match: かわい|可愛|美人|きれい|綺麗|cute|pretty|beautiful
    say: ['Thank you, {name}.']
  - match: 初見|はじめまして|first time|new here
    say: ['Welcome, {name}. Take it easy.']
  echo:
  - '"{text}"... tell me a little more, {name}.'
  tips:
  - ['Thank you, {name}.']
  - ['Thank you, {name}! I will spend it wisely.']
  - ['{name}...! Thank you. You startled me.']
  - ['{name}. ...Really. Thank you.']
tipTexts: [thanks as always, great stream today, you are my oshi, '', can't wait for the next one, learned a lot]
